services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: habruta
      POSTGRES_PASSWORD: habruta
      POSTGRES_DB: habruta
    ports:
      - "5432:5432"
    volumes:
      - habruta_pgdata:/var/lib/postgresql/data

volumes:
  habruta_pgdata:
