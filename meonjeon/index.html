<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F2F8F6" />
<title>먼저ON — 내가 생각하기 전에 먼저 오는 것</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="먼저ON" />
<link rel="manifest" href="/manifest.json" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap');
  html,body{margin:0;background:#F2F8F6;font-family:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;color:#17302C;-webkit-font-smoothing:antialiased}
  #gate{max-width:440px;margin:0 auto;padding:64px 22px calc(40px + env(safe-area-inset-bottom))}
  #gate h1{font-family:'Noto Serif KR',serif;font-size:28px;font-weight:600;letter-spacing:-.035em;line-height:1.42;margin:0}
  #gate p{font-size:13.5px;color:#4E6B66;line-height:1.78;margin-top:14px}
  #gate input{width:100%;border:1px solid #DCEAE6;border-radius:16px;padding:15px 16px;font-size:15px;background:#fff;font-family:inherit;box-sizing:border-box;transition:border-color .15s,box-shadow .15s}
  #gate input:focus{outline:none;border-color:#0D7368;box-shadow:0 0 0 3px #DDF2EE}
  #gate button{width:100%;border:none;border-radius:16px;padding:16px 0;font-size:15px;font-weight:600;font-family:inherit;background:#17302C;color:#fff;margin-top:10px;cursor:pointer;transition:transform .12s ease}
  #gate button:active{transform:scale(.985)}
  #gate .ghost{background:transparent;color:#6E8C86;font-weight:400;font-size:13px}
  #gate .msg{margin-top:16px;font-size:13px;line-height:1.7;padding:14px 15px;border-radius:14px;background:#DDF2EE;color:#0D7368}
  /* 버튼이 넷이 되면 좁은 폰에서 밀립니다. 줄바꿈을 허용합니다 */
  #bar{position:fixed;top:0;left:0;right:0;z-index:80;display:none;justify-content:center;gap:6px;flex-wrap:wrap;
       background:rgba(255,255,255,.86);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);
       border-bottom:1px solid #DCEAE6;padding:8px 12px;font-size:11.5px;color:#4E6B66;align-items:center}
  #bar button{border:1px solid #DCEAE6;background:#F2F8F6;border-radius:99px;padding:6px 10px;font-size:11px;white-space:nowrap;color:#4E6B66;font-family:inherit;cursor:pointer}
  #sync{position:fixed;bottom:calc(112px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:90;display:none;
        background:#17302C;color:#fff;border-radius:99px;padding:11px 16px;font-size:12.5px;align-items:center;gap:10px;
        box-shadow:0 2px 4px rgba(15,26,21,.06), 0 22px 48px -22px rgba(15,26,21,.4)}
  #sync button{background:#0D7368;color:#fff;border:none;border-radius:99px;padding:6px 12px;font-size:12px;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div id="bar"></div>
<div id="gate"></div>
<div id="root"></div>
<div id="sync"><span>가족이 방금 업데이트했어요</span><button onclick="location.reload()">새로고침</button></div>

<script>
/* ── 부팅: 설정 → 로그인 → 가구 연결 → 앱 실행 ────────────── */
let SB = null, HH = null, MYUID = null, LASTWRITE = 0;
/* BASE = 마지막으로 서버와 맞춘 상태. 세 갈래 병합의 기준점입니다 */
let BASE = null, BASE_AT = null;

/* ── 가족 화면 합치기 ──────────────────────────────────────
   두 사람이 각자 화면에서 고치면, 나중에 저장한 쪽이 상대가 담은 것을
   통째로 덮어썼습니다. 아내가 담은 두부·시금치와 남편이 담은 아이스크림이
   서로를 지웠습니다. 저장 직전에 서버를 다시 읽고, BASE를 기준으로
   "내가 바꾼 것"과 "상대가 바꾼 것"을 합쳐서 씁니다. */
const clone = (o) => JSON.parse(JSON.stringify(o));
const J = (x) => JSON.stringify(x === undefined ? null : x);
/* id로 구분되는 목록들 */
const ID_LISTS = ['tasks', 'shopping', 'pantry', 'toss', 'customRoutines', 'customCats', 'children', 'members', 'cars', 'discoverSnoozed'];
/* 키마다 따로 판단해야 하는 사전들 */
/* 새 맵을 여기 안 넣으면 합칠 때 통째로 덮어써집니다 —
   남편이 접어둔 항목을 내가 열면 남편 쪽이 사라집니다.
   welfareOff는 복지 화면을 지우면서 같이 없어진 이름이라 뺐습니다. */
const KEY_MAPS = ['routines', 'prefs', 'duty', 'groupsOff', 'flags', 'petTypes', 'dismissedDiscover', 'routineTitles', 'wfOff', 'aheadDone'];

function mergeList(base, mine, theirs) {
  base = Array.isArray(base) ? base : []; mine = Array.isArray(mine) ? mine : []; theirs = Array.isArray(theirs) ? theirs : [];
  const B = new Map(base.map((x) => [x && x.id, x])), T = new Map(theirs.map((x) => [x && x.id, x]));
  const mineIds = new Set(mine.map((x) => x && x.id));
  const out = [];
  for (const x of mine) {
    const id = x && x.id, b = B.get(id), t = T.get(id);
    const changedByMe = J(x) !== J(b);
    /* 상대가 지웠는데 나도 손대지 않았으면 지운 것을 따릅니다 */
    if (!T.has(id) && B.has(id) && !changedByMe) continue;
    /* 둘 다 고쳤으면 지금 저장하는 내 것을, 나만 안 고쳤으면 상대 것을 */
    out.push(changedByMe || !T.has(id) ? x : t);
  }
  /* 상대가 새로 담은 것 — 내 화면엔 아직 없던 것 */
  for (const t of theirs) {
    const id = t && t.id;
    if (mineIds.has(id)) continue;
    if (B.has(id)) continue;          /* 내가 지운 것은 되살리지 않습니다 */
    out.push(t);
  }
  return out;
}

function mergeMap(base, mine, theirs) {
  base = base || {}; mine = mine || {}; theirs = theirs || {};
  const out = {};
  for (const k of new Set([...Object.keys(mine), ...Object.keys(theirs)])) {
    const inM = k in mine, inT = k in theirs, inB = k in base;
    const changedByMe = J(mine[k]) !== J(base[k]);
    if (!inM) { if (inB) continue; out[k] = theirs[k]; continue; }
    if (!inT) { if (inB && !changedByMe) continue; out[k] = mine[k]; continue; }
    out[k] = changedByMe ? mine[k] : theirs[k];
  }
  return out;
}

/* 이벤트 로그는 양쪽 다 계속 쌓입니다. 겹치는 것만 빼고 이어붙입니다 */
function mergeEvents(mine, theirs) {
  const seen = new Set(), out = [];
  for (const e of [...(mine || []), ...(theirs || [])]) {
    const k = (e && e.ts) + '|' + (e && e.name);
    if (seen.has(k)) continue;
    seen.add(k); out.push(e);
  }
  out.sort((a, b) => (a.ts || 0) - (b.ts || 0));
  return out.slice(-1200);
}

function merge3(base, mine, theirs) {
  base = base || {};
  const out = {};
  for (const k of new Set([...Object.keys(mine || {}), ...Object.keys(theirs || {})])) {
    if (ID_LISTS.indexOf(k) >= 0) { out[k] = mergeList(base[k], mine[k], theirs[k]); continue; }
    if (KEY_MAPS.indexOf(k) >= 0) { out[k] = mergeMap(base[k], mine[k], theirs[k]); continue; }
    if (k === 'events' || k === 'feedback') { out[k] = mergeEvents(mine[k], theirs[k]); continue; }
    /* 나머지(설정값 등)는 바꾼 쪽을 남깁니다 */
    out[k] = J(mine[k]) !== J(base[k]) ? mine[k] : (k in (theirs || {}) ? theirs[k] : mine[k]);
  }
  return out;
}
const gate = document.getElementById('gate');
const bar  = document.getElementById('bar');

const GATE_BUILD = '0901-k';
const show = (html) => {
  gate.innerHTML = html +
    `<p style="margin-top:26px;font-size:10.5px;color:#9DB5AF;font-family:'IBM Plex Mono',monospace">BUILD ${GATE_BUILD}</p>`;
  gate.style.display = 'block';
};
const hideGate = () => { gate.style.display = 'none'; };

/* .env.example의 예시 값이 그대로 들어간 경우를 잡아냅니다.
   값이 있는데도 앱이 이상하게 도는 것보다, 여기서 말해주는 편이 낫습니다. */
const isExample = (v) => !v || /xxxxxxxx|^sk-ant-\.\.\.$|^eyJ\.\.\.$|^https:\/\/xxx/i.test(String(v).trim());

const isIPhone = () => /iPad|iPhone|iPod/.test(String(navigator.userAgent || ''));
/* 카카오·네이버 앱 안에서는 홈 화면 추가도, 알림도 안 됩니다 */
const inAppName = () => {
  const u = String(navigator.userAgent || '');
  if (/KAKAOTALK/i.test(u)) return '카카오톡';
  if (/NAVER|Whale.*inapp/i.test(u)) return '네이버 앱';
  if (/Instagram/i.test(u)) return '인스타그램';
  if (/FBAN|FBAV/i.test(u)) return '페이스북';
  if (/DaumApps/i.test(u)) return '다음 앱';
  return null;
};

/* 홈 화면에 추가한 앱으로 들어왔는지 — 사파리와는 다른 방입니다 */
const isStandalone = () => {
  try { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
  catch { return false; }
};

async function boot() {
  const cfg = await fetch('/api/config').then(r => r.json()).catch(() => ({}));
  if (!cfg.url || !cfg.anonKey) {
    show('<h1>설정이 아직이에요</h1><p>Vercel 환경변수에 <b>SUPABASE_URL</b>과 <b>SUPABASE_ANON_KEY</b>를 넣고 다시 배포해 주세요. README의 2단계를 참고하시면 됩니다.</p>');
    return;
  }
  if (isExample(cfg.url) || isExample(cfg.anonKey)) {
    show('<h1>예시 값이 들어가 있어요</h1><p>환경변수는 채워져 있는데 <b>.env.example의 예시 값</b>입니다. Vercel → Settings → Environment Variables에서 <b>SUPABASE_URL</b>과 <b>SUPABASE_ANON_KEY</b>를 Supabase 대시보드의 실제 값으로 바꾸고 다시 배포해 주세요.</p><p style="color:#6E8C86;font-size:13px">URL은 <code>https://프로젝트ID.supabase.co</code>, anon 키는 <code>eyJ</code>로 시작하는 수백 글자입니다.</p>');
    return;
  }
  SB = supabase.createClient(cfg.url, cfg.anonKey);
  /* 알림을 켤 때 쓰는 공개 키 — 앱 쪽에서 꺼내 씁니다 */
  window.__VAPID = cfg.vapidPublicKey || '';

  const { data: { session } } = await SB.auth.getSession();
  if (!session) return askEmail();
  MYUID = session.user.id;
  /* AI 서버 함수가 로그인 여부를 확인할 수 있게 토큰을 들고 있습니다 */
  window.__TOKEN = session.access_token;
  SB.auth.onAuthStateChange((_e, s2) => { window.__TOKEN = s2 ? s2.access_token : null; });
  await connectHousehold(session.user);
}

/* 메일을 못 보낸 이유를 한국말로.
   Supabase 무료 메일은 <b>시간당 몇 통</b>으로 막혀 있습니다. 여러 번 시도하면
   조용히 아무것도 안 옵니다 — 그때 "안 온다"고만 하면 원인을 영영 못 찾습니다. */
function sendWhy(error) {
  const m = String((error && error.message) || '');
  if (/rate|limit|too many|over_email/i.test(m))
    return '메일을 <b>너무 자주 보냈어요.</b><br>Supabase 무료 메일은 시간당 보낼 수 있는 통수가 정해져 있습니다. <b>한 시간쯤 뒤에</b> 다시 해주세요.';
  if (/signup|sign-up|not allowed|disabled/i.test(m))
    return '지금은 <b>초대받은 이메일만</b> 들어올 수 있어요.<br>초대받으신 주소가 맞는지 확인해 주세요. 오타가 있으면 로그인이 안 됩니다.';
  if (/not found|no user|user not/i.test(m))
    return '이 주소로는 아직 초대가 안 됐어요.<br>초대받으신 주소가 맞는지 확인해 주세요.';
  if (/invalid|valid email/i.test(m)) return '이메일 주소 형식을 다시 확인해 주세요.';
  return m;
}

function askEmail() {
  const join = new URLSearchParams(location.search).get('join');
  show(`
    <h1>먼저ON</h1>
    <p>생각나는 건 말하세요.<br>생각나지 않는 건 먼저 챙길게요.</p>
    ${join ? '<div class="msg">가족 초대를 받으셨네요. 로그인하면 같은 집으로 들어갑니다.</div>' : ''}
    ${inAppName() ? `<div class="msg" style="background:#F9E9EE;color:#A84362">
        지금 <b>${inAppName()}</b> 안에서 보고 계세요. 여기서는 알림을 켤 수 없습니다.<br>
        주소창의 <b>meonjeon.vercel.app</b>을 꾹 눌러 복사한 뒤,
        ${isIPhone() ? '<b>사파리</b>' : '<b>크롬</b>'}에 붙여넣어 열어주세요.
      </div>` : isIPhone() && !isStandalone() ? `<div class="msg">
        <b>아이폰은 로그인 전에 한 가지만 먼저</b><br>
        아래쪽 <b>공유 버튼</b>(□에 ↑) → <b>홈 화면에 추가</b> → 생긴 <b>먼저</b> 아이콘으로 들어와서 로그인하세요.<br>
        <span style="opacity:.8">이러면 로그인을 한 번만 하면 되고, 알림도 받을 수 있습니다.
        지금 여기서 로그인하면 나중에 한 번 더 하셔야 해요.</span>
      </div>` : ''}
    <div style="margin-top:26px">
      <input id="em" type="email" inputmode="email" autocomplete="email" placeholder="이메일 주소" />
      <button id="go">로그인 링크 받기</button>
      <p style="font-size:12px;color:#6E8C86">비밀번호는 없어요. 메일로 온 <b>숫자</b>를 넣으면 시작됩니다.</p>
      <p style="font-size:12px;color:#6E8C86;margin-top:10px;line-height:1.7">
        가족도 <b>각자 본인 이메일</b>로 들어와요. 누가 무엇을 맡았는지 구분해야 하니까요.<br>
        <b>가족 코드는 로그인이 아니라</b>, 들어온 다음 같은 집으로 합치는 코드입니다.
      </p>
    </div>`);
  document.getElementById('go').onclick = async () => {
    const email = document.getElementById('em').value.trim();
    if (!email) return;
    document.getElementById('go').textContent = '보내는 중…';
    const opts = { emailRedirectTo: location.origin + location.search };
    let { error } = await SB.auth.signInWithOtp({ email, options: opts });
    /* 가입을 막아둔 폐쇄 베타에서는, 이미 초대된 사람에게도 이 호출이
       "새 가입"으로 보여 거절당합니다. 그때는 "기존 사용자에게만 보내기"로
       한 번 더 시도합니다. 가입을 다시 열면 첫 시도에서 그냥 통과합니다. */
    if (error && /signup|sign-up|not allowed/i.test(String(error.message || ''))) {
      const retry = await SB.auth.signInWithOtp({ email, options: { ...opts, shouldCreateUser: false } });
      error = retry.error;
    }
    if (error) {
      /* 베타 동안에는 초대받은 분만 들어옵니다. 영문 에러를 그대로 보여주면
         "내가 뭘 잘못했나" 하고 헤매게 됩니다 */
      const why = sendWhy(error);
      show('<h1>메일을 못 보냈어요</h1><p>' + why + '</p><button onclick="location.reload()">다시 시도</button>');
      return;
    }
    askCode(email);
  };
}

/* 홈 화면에 추가한 앱은 사파리와 다른 방입니다.
   메일에서 링크를 누르면 사파리가 열리고, 사파리에서만 로그인이 됩니다.
   아이폰에서 알림을 받으려면 홈 화면 앱으로 들어와야 하는데,
   그 앱에는 주소창이 없어서 링크를 붙여넣을 수도 없습니다.
   그래서 링크 말고 메일에 적힌 숫자로도 들어올 수 있게 해둡니다.
   숫자 길이는 Supabase 설정에 따라 6~10자리로 달라집니다. 고정하지 않습니다. */
function askCode(email) {
  const home = isStandalone();
  show(`
    <h1>메일함을 확인해 주세요</h1>
    <p><b>${email}</b>로 보냈어요.<br>메일이 안 보이면 스팸함도 봐주세요.</p>
    ${home ? `<div class="msg">지금은 <b>홈 화면 앱</b>이라 메일의 링크를 눌러도 여기로 안 들어옵니다.
       메일에 적힌 <b>숫자</b>를 아래에 넣어주세요.</div>` : ''}
    <div class="msg" style="background:#FCF4D9;color:#7D6A15">
      메일의 <b>링크는 누르지 마세요.</b> 링크를 한 번 누르면 그 숫자는 못 쓰게 됩니다.
      <b>가장 마지막에 온 메일</b>의 숫자를 쓰세요 — 다시 받을 때마다 앞의 숫자는 지워집니다.
    </div>
    <div style="margin-top:22px">
      <!-- 숫자 길이는 Supabase 설정(6~10자리)에 따라 달라집니다. 고정하지 않습니다 -->
      <input id="cd" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10"
             placeholder="메일에 온 숫자"
             style="letter-spacing:.22em;text-align:center;font-size:20px" />
      <button id="ok">숫자로 들어가기</button>
      <p id="cderr" style="font-size:12.5px;color:#A84362;min-height:18px"></p>
      <button class="ghost" id="again">숫자 다시 받기</button>
      <button class="ghost" onclick="location.reload()">다른 주소로 다시 받기</button>
    </div>`);
  const inp = document.getElementById('cd');
  const err = document.getElementById('cderr');
  inp.oninput = () => { inp.value = inp.value.replace(/[^0-9]/g, ''); err.textContent = ''; };
  inp.focus();
  const go = async () => {
    const token = inp.value.trim();
    if (token.length < 6) { err.textContent = '메일에 온 숫자를 끝까지 넣어주세요.'; return; }
    const b = document.getElementById('ok');
    b.textContent = '확인 중…'; b.disabled = true;
    /* Supabase는 보낸 메일 종류에 따라 같은 숫자를 다르게 부릅니다.
       (매직링크면 magiclink, 첫 가입이면 signup) 어느 쪽인지 알 수 없어서
       차례로 시도합니다. "종류를 고르세요"는 사용자에게 물을 일이 아닙니다. */
    let last = null;
    for (const type of ['email', 'magiclink', 'signup']) {
      const { error } = await SB.auth.verifyOtp({ email, token, type });
      if (!error) { boot(); return; }
      last = error;
    }
    const m = String((last && last.message) || '');
    err.innerHTML = /expired|invalid|token/i.test(m)
      ? '이 숫자는 이제 못 써요.<br><b>메일의 링크를 누르셨거나</b>, 그 뒤에 숫자를 또 받으셨을 수 있어요.<br>아래 <b>숫자 다시 받기</b>를 누르고, <b>가장 마지막에 온 메일</b>의 숫자를 링크는 누르지 말고 넣어주세요.'
      : m;
    b.textContent = '숫자로 들어가기'; b.disabled = false;
  };
  document.getElementById('ok').onclick = go;
  inp.onkeydown = (e) => { if (e.key === 'Enter') go(); };
  document.getElementById('again').onclick = async () => {
    const a = document.getElementById('again');
    a.textContent = '보내는 중…'; a.disabled = true;
    const opts = { emailRedirectTo: location.origin + location.search };
    let { error } = await SB.auth.signInWithOtp({ email, options: opts });
    if (error && /signup|sign-up|not allowed/i.test(String(error.message || ''))) {
      error = (await SB.auth.signInWithOtp({ email, options: { ...opts, shouldCreateUser: false } })).error;
    }
    inp.value = '';
    err.innerHTML = error ? sendWhy(error) : '';
    a.textContent = error ? '숫자 다시 받기' : '새 숫자를 보냈어요 · 다시 받기';
    a.disabled = false;
    if (!error) inp.focus();
  };
}

async function connectHousehold(user) {
  show('<h1>우리 집을 여는 중…</h1>');
  const joinCode = new URLSearchParams(location.search).get('join');

  /* 초대 링크를 안 열고 그냥 들어오면 자기 빈 집이 먼저 생깁니다.
     그러면 나중에 초대 링크를 눌러도 이미 집이 있어서 합류가 안 됐습니다.
     남편이 주소만 받아 먼저 열어보면 영영 못 합치는 구멍이었습니다.
     → 초대 코드가 있으면 이미 집이 있어도 합류를 시도합니다. */
  let { data: mine } = await SB.from('households').select('*');
  mine = mine || [];
  const remembered = (() => { try { return localStorage.getItem('meonjeon:hh'); } catch { return null; } })();

  if (joinCode) {
    const { data, error } = await SB.rpc('join_household', { p_code: joinCode });
    if (data) HH = data;
    else if (mine.length) HH = mine.find(h => h.id === remembered) || mine[0];
    else { show('<h1>초대 코드를 못 찾았어요</h1><p>' + ((error && error.message) || '') + '</p><button onclick="location.href=location.origin">내 집 새로 만들기</button>'); return; }
  } else if (mine.length) {
    /* 여러 집에 속해 있으면 마지막에 쓰던 집을 씁니다. limit(1)은 순서가 없어
       로그인할 때마다 다른 집이 열릴 수 있었습니다 */
    HH = mine.find(h => h.id === remembered) || mine[0];
  } else {
    const { data, error } = await SB.rpc('create_household');
    if (error) { show('<h1>집을 만들지 못했어요</h1><p>' + error.message + '</p>'); return; }
    HH = data;
  }
  try { localStorage.setItem('meonjeon:hh', HH.id); } catch {}
  /* 알림 등록에 어느 집인지 알려줘야 합니다 */
  window.__HH = HH.id;

  /* 로그인한 사람을 가구 구성원과 연결 */
  const st = HH.state && Object.keys(HH.state).length ? HH.state : null;
  if (st && Array.isArray(st.members)) {
    let me = st.members.find(m => m.uid === user.id);
    if (!me) {
      const free = st.members.find(m => !m.uid);
      if (free) { free.uid = user.id; me = free; }
      else {
        me = { id: 'm' + Date.now().toString(36), name: user.email.split('@')[0].slice(0, 6), role: 'member',
               color: ["#2E7D72","#6B5BA8","#8A7327","#A85477"][st.members.length % 4], uid: user.id };
        st.members.push(me);
      }
      await SB.from('households').update({ state: st }).eq('id', HH.id);
      HH.state = st;
    }
    window.__ME = me.id;
  }

  /* 앱이 쓰는 저장소를 가구 DB에 연결 */
  window.storage = {
    async get(k) {
      const { data } = await SB.from('households').select('state, updated_at').eq('id', HH.id).single();
      if (data) { HH.state = data.state; HH.updated_at = data.updated_at; BASE = clone(data.state || {}); BASE_AT = data.updated_at; }
      if (!HH.state || !Object.keys(HH.state).length) throw new Error('empty');
      return { key: k, value: JSON.stringify(HH.state) };
    },
    async set(k, v) {
      const mine = JSON.parse(v);
      let out = mine;
      /* 내가 마지막으로 읽은 뒤 가족이 저장했는지 봅니다 */
      try {
        const { data: cur } = await SB.from('households').select('state, updated_at').eq('id', HH.id).single();
        if (cur && cur.updated_at !== BASE_AT && cur.state && Object.keys(cur.state).length) {
          out = merge3(BASE || {}, mine, cur.state);
        }
      } catch (e) { /* 못 읽었으면 내 것을 그대로 씁니다. 저장을 놓치는 것보단 낫습니다 */ }
      const at = new Date().toISOString();
      LASTWRITE = Date.now();
      await SB.from('households').update({ state: out, updated_at: at, updated_by: MYUID }).eq('id', HH.id);
      HH.state = out; BASE = clone(out); BASE_AT = at;
      /* 합치면서 내 화면에 없던 게 들어왔으면 화면에도 바로 반영합니다 */
      if (JSON.stringify(out) !== JSON.stringify(mine) && typeof window.__applyRemote === 'function') window.__applyRemote(out);
      return { key: k, value: JSON.stringify(out) };
    },
    async delete() { HH.state = {}; await SB.from('households').update({ state: {} }).eq('id', HH.id); return { deleted: true }; },
    async list() { return { keys: ['meonjeon'] }; },
  };

  /* 가족이 고치면 알려주기 */
  SB.channel('hh').on('postgres_changes',
    { event: 'UPDATE', schema: 'public', table: 'households', filter: 'id=eq.' + HH.id },
    async (p) => {
      if (p.new.updated_by === MYUID) return;
      /* 가족이 고친 것을 바로 받아옵니다. "새로고침"을 누르게 하지 않습니다 */
      try {
        const { data } = await SB.from('households').select('state, updated_at').eq('id', HH.id).single();
        if (!data || !data.state || !Object.keys(data.state).length) return;
        HH.state = data.state; BASE = clone(data.state); BASE_AT = data.updated_at;
        if (typeof window.__applyRemote === 'function') { window.__applyRemote(data.state); return; }
      } catch (e) {}
      if (Date.now() - LASTWRITE > 3000) document.getElementById('sync').style.display = 'flex';
    }
  ).subscribe();

  /* 상단 바: 초대 코드 / 로그아웃 */
  bar.style.display = 'flex';
  bar.innerHTML = `<span>초대코드 <b>${HH.code}</b></span>
    <button id="inv">가족 초대 링크 복사</button>
    <button id="jn">가족 코드로 합류</button>
    <button id="out">로그아웃</button>`;
  /* 다른 이메일로 들어와 빈 집이 생겼을 때 되돌아갈 길입니다.
     이게 없으면 설정을 처음부터 다시 해야 합니다 */
  document.getElementById('jn').onclick = async () => {
    const code = prompt('합류할 가족의 초대코드를 넣어주세요 (예: 7E2F42)\n\n지금 이 화면의 내용은 그대로 남고, 그 집 화면으로 바뀝니다.');
    if (!code || !code.trim()) return;
    const { data, error } = await SB.rpc('join_household', { p_code: code.trim() });
    if (error || !data) { alert('그 코드를 찾지 못했어요.\n' + ((error && error.message) || '')); return; }
    try { localStorage.setItem('meonjeon:hh', data.id); } catch {}
    location.href = location.origin;
  };
  document.getElementById('inv').onclick = async () => {
    const link = location.origin + '/?join=' + HH.code;
    try { await navigator.clipboard.writeText(link); document.getElementById('inv').textContent = '복사했어요'; }
    catch { prompt('이 링크를 가족에게 보내세요', link); }
  };
  document.getElementById('out').onclick = async () => { await SB.auth.signOut(); location.href = location.origin; };
  document.getElementById('root').style.paddingTop = '34px';

  /* 앱 코드는 Babel이 컴파일한 뒤에야 준비됩니다.
     준비 전에 부르면 화면이 하얗게 남으므로 기다렸다가 엽니다. */
  runApp();
}

function runApp(tries) {
  tries = tries || 0;
  if (window.startApp) { hideGate(); window.startApp(); return; }
  if (tries > 200) {   /* 20초 */
    show('<h1>앱을 불러오지 못했어요</h1><p>인터넷 연결을 확인하고 새로고침해 주세요. 사내망이나 일부 와이파이에서는 외부 스크립트가 막히기도 합니다.</p><button onclick="location.reload()">새로고침</button>');
    return;
  }
  setTimeout(function () { runApp(tries + 1); }, 100);
}

boot();
</script>

function domList(cfg) {

/* 요일·날짜가 지정된 반복의 다음 차례 */
/* 처음 켠 정기 일정의 "첫 회차"를 언제로 잡을 것인가.
   6개월마다 하는 일을 오늘 하라고 띄우면, 그날 안 해도 되는 일이 떠서 짜증만 납니다.
   그렇다고 전부 첫날에 몰면 첫 화면이 벽이 됩니다. 그래서 주기에 비례해 뒤로 밉니다.
     매일류(3일 이하) → 오늘부터. 이건 오늘 해야 맞습니다
     주간(7일 이하)   → 이번 주 안 아무 날
     그 이상          → 주기의 1/4 ~ 1/2 지점 (6개월이면 45~90일 뒤) */
function firstRunAt(cycle) {
  const c = Math.max(Number(cycle) || 30, 1);
  const rand = (n) => Math.floor(Math.random() * Math.max(n, 1));
  if (c <= 3) return todayKey();
  if (c <= 7) return todayKey() + (1 + rand(c)) * DAY;
  const lo = Math.max(3, Math.round(c * 0.25));
  const hi = Math.max(lo + 1, Math.round(c * 0.5));
  return todayKey() + (lo + rand(hi - lo)) * DAY;
}

function nextByPattern(cfg, fromMs) {
  const base = startOfDay(fromMs || Date.now()) + DAY;
  const ds = dowList(cfg);
  if (ds.length) {
    /* 고른 요일 중 가장 먼저 오는 날 */
    for (let i = 0; i < 8; i++) {
      const d = new Date(base + i * DAY);
      if (ds.includes(d.getDay())) return d.getTime();
    }
  }
  const ms = domList(cfg);
  if (ms.length) {
    /* 고른 날짜들 중 가장 먼저 오는 날 */
    let best = null;
    const now = new Date(base);
    ms.forEach((dom) => {
      for (let i = 0; i < 4; i++) {
        const d = dom === 31
          ? new Date(now.getFullYear(), now.getMonth() + i + 1, 0)   /* 말일: 2월이면 28일 */
          : new Date(now.getFullYear(), now.getMonth() + i, dom);
        if (dom !== 31 && d.getDate() !== dom) continue;             /* 2월 30일처럼 없는 날짜는 건너뜀 */
        if (d.getTime() >= base) { if (best == null || d.getTime() < best) best = d.getTime(); break; }
      }
    });
    if (best != null) return best;
  }
  return base - DAY + (cfg.cycle || 30) * DAY;
}
function cycleToDays(cy) {
  if (!cy) return 30;
  const s = String(cy);

  if (s.includes("2~3일")) return 3;
  if (s.includes("주 1회") || s.includes("주간")) return 7;
  if (s.includes("2주")) return 14;
  if (s.includes("월 1회") || s.includes("월령별")) return 30;
  if (s.includes("2~3개월") || s.includes("계절")) return 75;
  if (s.includes("2개월")) return 60;
  if (s.includes("3개월")) return 90;
  if (s.includes("학기")) return 120;
  if (s.includes("6개월")) return 180;
  if (s.includes("연 2회")) return 180;
  if (s.includes("연 1회") || s.includes("1년")) return 365;
  return 30;
}

}

/* 맞는 것을 다 돌려줍니다. 몇 개만 보일지는 LinkCards가 정합니다 —
   여기서 미리 2개로 자르면, 이미 "이미 있어요"로 내린 것이 자리를 차지한 채
   걸러져서 한 개만 남거나 아무것도 안 남습니다. 새로 넣은 링크도 영영 못 뜹니다. */
const linksFor = ({ group, text, flags }) => {
  const t = String(text || "");
  const hit = LINKS.filter((l) => {
    /* 이 집에 해당 없는 건 아예 안 봅니다. 차 없는 집에 주유소를 띄우면
       그 자리는 광고가 아니라 소음입니다 */
    if (l.flag && flags && !flags[l.flag]) return false;
    /* 다른 데를 가리키는 말이 있으면 이 링크가 아닙니다.
       "둘째 6개월 예방접종"의 "접종" 두 글자에 동물병원이 붙던 일이 있었습니다 */
    if ((l.not || []).some((k) => t.includes(k))) return false;
    return (group && (l.g || []).includes(group)) || (l.kw || []).some((k) => t.includes(k));
  });
  return hit;
};
/* {near}가 있는 링크는 사시는 곳을 앞에 붙여 보냅니다.
   "동물병원"으로 보내면 지도가 어디를 보여줄지 모릅니다 —
   설정에 적어둔 동네가 있으면 "강서구 동물병원"으로 보냅니다.
   시·군·구를 안 적었으면 날씨용으로 고른 광역(서울)이라도 씁니다. */
const nearWhere = (st) =>
  String((st && st.region) || "").trim() || ((st && st.place && st.place.label) || "");
const linkUrl = (l, text, st) => {
  let u = l.url.replace("{q}", encodeURIComponent(String(text || "").slice(0, 30)));
  if (l.near) {
    const where = nearWhere(st);
    u = u.replace("{near}", encodeURIComponent((where ? where + " " : "") + l.near));
  }
  return u;
};

/* AI가 준 "YYYY-MM-DD"를 그날 0시로 바꿉니다. 이상한 값이면 null */
function parseWhen(v) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || "").trim());
  if (!m) return null;
  const y = Number(m[1]), mo = Number(m[2]), da = Number(m[3]);
  const d = new Date(y, mo - 1, da);
  /* 13월 40일 같은 값은 Date가 조용히 다른 날로 굴려버립니다. 되돌려 확인합니다 */
  if (d.getFullYear() !== y || d.getMonth() !== mo - 1 || d.getDate() !== da) return null;
  const t = d.getTime();
  if (isNaN(t)) return null;
  /* 지나간 날짜를 주면 오늘로 당깁니다 */
  return Math.max(t, todayKey());
}
/* 말에 시점이 없을 때, 분류만 보고 대강 언제쯤인지 정합니다 */
const DUE_BY_STATUS = { now: 0, conditional: 1, check: 2, week: 3, decide: 5, buy: 5, remember: 7, repeat: 7 };
const defaultDue = (status) => todayKey() + (DUE_BY_STATUS[status] != null ? DUE_BY_STATUS[status] : 3) * DAY;
/* "그날"과 "며칠 전"을 따로 받습니다.
   단수 9/3, 하루 전 → 9/2에 올립니다. 사용자가 역산하지 않게. */
const LEADS = [[0, "당일"], [1, "하루 전"], [2, "2일 전"], [3, "3일 전"], [7, "1주 전"], [14, "2주 전"]];
const dueFromEvent = (eventAt, lead) => Math.max(startOfDay(eventAt) - (Number(lead) || 0) * DAY, todayKey());

/* 남은 날짜 표시 — 오늘/내일/D-3/3일 지남
   date에는 "9/3(목)"처럼 진짜 날짜를 담습니다.
   D-5만 보여주면 며칠인지 세어봐야 하고, 고치려 해도 뭘 고치는지 모릅니다 */
function dueLabel(t) {
  if (!t) return null;
  const dt = new Date(t);
  const date = `${dt.getMonth() + 1}/${dt.getDate()}(${WEEKDAY[dt.getDay()]})`;
  const d = Math.round((todayKey0(t) - todayKey()) / DAY);
  if (d < 0) return { text: `${-d}일 지남`, date, urgent: true };
  if (d === 0) return { text: "오늘", date, urgent: true };
  if (d === 1) return { text: "내일", date, urgent: false };
  return { text: `D-${d}`, date, urgent: false };
}
const todayKey0 = (t) => startOfDay(t);

/* "반복으로"를 누를 때마다 정기 일정을 새로 만들던 시절에, 같은 일정이
   여러 개 쌓인 집이 있습니다. 읽을 때 한 번 정리합니다.
   이름과 영역이 똑같은 것만 묶으므로, 일부러 따로 만든 것은 안 건드립니다. */
/* 영수증에서 나온 재료 손질은 오래 두면 거짓말이 됩니다.
   일주일이면 이미 먹었거나 상했는데 "야채 손질"만 남아 있으면,
   앱이 우리 집을 모른다는 뜻이 됩니다. 안 끝낸 것만 조용히 걷어냅니다. */
function cleanupPerishable(st) {
  const tasks = st.tasks || [];
  const cut = todayKey() - 7 * DAY;
  const kept = tasks.filter((t) => !(t && t.perish && !t.done && (t.dueAt || 0) < cut));
  return kept.length === tasks.length ? st : { ...st, tasks: kept };
}

function dedupeRoutines(st) {
  const list = st.customRoutines || [];
  if (list.length < 2) return st;
  const seen = new Map(), keep = [], drop = [];
  list.forEach((r) => {
    const k = `${String(r.title || "").trim()}|${r.category || ""}`;
    if (seen.has(k)) { drop.push(r); return; }
    seen.set(k, r); keep.push(r);
  });
  if (!drop.length) return st;
  const ro = { ...(st.routines || {}) };
  drop.forEach((r) => { 
    const first = seen.get(`${String(r.title || "").trim()}|${r.category || ""}`);
    /* 지우는 쪽이 켜져 있었으면 남기는 쪽도 켜줍니다 */
    const mineOn = (ro[`c:${r.id}`] || {}).on;
    if (mineOn && ro[`c:${first.id}`]) ro[`c:${first.id}`] = { ...ro[`c:${first.id}`], on: true };
    delete ro[`c:${r.id}`];
  });
  return { ...st, customRoutines: keep, routines: ro };
}

/* ── 유틸 ─────────────────────────────────────── */
const DAY = 86400000;
const uid = (p) => `${p}${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
const monthsToDays = (m) => Math.round(m * 30.44);
const startOfDay = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const todayKey = () => startOfDay(Date.now());

function toFragments(text) {
  const words = String(text).split(/[\s.,!?]+/).filter(Boolean);
  const out = [];
  words.forEach((w) => { if (w.length <= 7) out.push(w); else out.push(...(w.match(/.{1,5}/g) || [])); });
  return out.slice(0, 18);
}
function childMonths(ch) {
  if (ch.unit === "week") return -((40 - Number(ch.value || 0)) / 4.345);
  if (ch.unit === "month") return Number(ch.value || 0);
  if (ch.unit === "year") return Number(ch.value || 0) * 12;
  if (ch.unit === "elem") return 72 + Number(ch.value || 1) * 12;
  if (ch.unit === "mid") return 144 + Number(ch.value || 1) * 12;
  return Number(ch.value || 0);
}
function childLabel(ch) {
  const v = ch.value;
  if (ch.unit === "week") return `임신 ${v}주`;
  if (ch.unit === "month") return `${v}개월`;
  if (ch.unit === "year") return `${v}세`;
  if (ch.unit === "elem") return `초${v}`;
  if (ch.unit === "mid") return `중${v}`;
  return `${v}`;
}
const keyOf = (seed, child) => (child ? `${seed.id}:${child.id}` : seed.id);

/* ── 공휴일 (연 1회 손으로 갱신합니다. 대체공휴일 포함) ── */
const HOLIDAYS = {
  2026: ["01-01","02-16","02-17","02-18","03-01","03-02","03-03","05-05","05-24","05-25","06-06","08-15","08-17","09-24","09-25","09-26","10-03","10-05","10-09","12-25"],
  2027: ["01-01","02-06","02-07","02-08","02-09","03-01","05-05","05-13","06-06","08-15","08-16","09-14","09-15","09-16","10-03","10-04","10-09","10-11","12-25"],
};
const ymd = (d) => {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
};
const isHoliday = (d) => {
  const y = d.getFullYear(), md = ymd(d).slice(5);
  return d.getDay() === 0 || d.getDay() === 6 || (HOLIDAYS[y] || []).includes(md);
};
/* 이번 쉬는 날 묶음을 찾습니다. 금요일이 공휴일이면 목요일에 브리핑합니다 */
function nextBreak(from) {
  const base = startOfDay(from || Date.now());
  for (let i = 0; i <= 9; i++) {
    const d = new Date(base + i * DAY);
    if (!isHoliday(d)) continue;
    const days = [];
    for (let j = 0; j < 6; j++) {
      const n = new Date(base + (i + j) * DAY);
      if (!isHoliday(n)) break;
      days.push(n);
    }
    return { start: days[0], days, briefAt: startOfDay(days[0].getTime() - DAY) };
  }
  return null;
}
const WEEKDAY = ["일", "월", "화", "수", "목", "금", "토"];

/* ── ① 반복 업무 ──────────────────────────────── */
const ROUTINE_SEEDS = SEED.filter((s) => s.st === "repeat");
const LIFE_SEEDS = SEED.filter((s) => s.st !== "repeat");

/* 계절 항목은 그 계절에만 올라옵니다 */
const SEASON = { summer: [5, 6, 7, 8, 9], winter: [11, 12, 1, 2, 3] };
const inSeason = (seed, month) => !seed.season || (SEASON[seed.season] || []).includes(month || (new Date().getMonth() + 1));

/* 이 가구에 해당하는 반복 업무만 추림 */
function eligibleRoutines(st, ignoreSeason) {
  const out = [];
  const petTypes = st.petTypes || {};
  const anyPetType = Object.keys(petTypes).some((k) => petTypes[k]);
  ROUTINE_SEEDS.forEach((seed) => {
    if (!ignoreSeason && !inSeason(seed)) return;
    /* 반려동물 종류를 고른 집에는 그 종류에 맞는 것만 */
    if (seed.pt && anyPetType && !seed.pt.split("|").some((t) => petTypes[t])) return;
    /* 차 종류에 맞는 것만 (주유는 기름차, 충전은 전기차).
       두 대면 종류가 섞일 수 있어서, 한 대라도 맞으면 올립니다. */
    if (seed.ct) {
      const kinds = carsOf(st).map((c) => c.type || "ice");
      const want = seed.ct.split("|");
      if (!kinds.some((k) => want.includes(k))) return;
    }
    if (seed.kid) {
      st.children.forEach((ch) => {
        const m = childMonths(ch);
        if (m >= seed.w[0] && m <= seed.w[1]) out.push({ key: keyOf(seed, ch), seed, child: ch });
      });
    } else if (seed.nkid) {
      if ((st.children || []).length >= seed.nkid && (!seed.f || st.flags[seed.f]))
        out.push({ key: seed.id, seed, child: null });
    } else if (!seed.f || st.flags[seed.f]) out.push({ key: seed.id, seed, child: null });
  });
  /* 직접 만든 정기 일정 */
  (st.customRoutines || []).forEach((cr) => {
    const child = String(cr.category || "").startsWith("kid:")
      ? st.children.find((c) => `kid:${c.id}` === cr.category) : null;
    if (String(cr.category || "").startsWith("kid:") && !child) return;
    out.push({
      key: `c:${cr.id}`, custom: true, child,
      seed: { id: cr.id, t: cr.title, cat: cr.category, cy: cr.cycle, g: "우리집정기", tg: "직접 등록", ask: "", st: "repeat" },
    });
  });
  return out;
}
/* 비사업용 승용차 정기검사 — 최초 등록 4년 뒤 첫 검사, 그 뒤로 2년마다.
   만료일 전후 31일 안에 받으면 되므로 D-31에 올려둡니다.
   (승합·화물은 주기가 달라 지금은 승용차만 계산합니다) */
function nextCarInspection(firstReg, now) {
  const m = /^(\d{4})-(\d{1,2})$/.exec(String(firstReg || ""));
  if (!m) return null;
  const y = Number(m[1]), mo = Number(m[2]);
  if (mo < 1 || mo > 12) return null;
  now = now || Date.now();
  let due = new Date(y + 4, mo - 1, 1).getTime();
  let guard = 0;
  while (due < now && guard++ < 40) { const d = new Date(due); due = new Date(d.getFullYear() + 2, d.getMonth(), 1).getTime(); }
  return due;
}
/* 보험 갱신은 '가입한 달'만 알면 됩니다. 날짜까지 적으라고 하면 아무도 안 적어요 */
/* 자동차보험 만기일. 예전에는 "갱신하는 달"만 받아서 그 달 1일로 잡았습니다.
   만기 하루라도 넘기면 무보험 운행이라 날짜까지 받는 게 맞습니다.
   day가 없으면 옛 방식 그대로 그 달 1일입니다. */
function nextInsuranceMonth(month, now, day) {
  const mo = Number(month);
  if (!mo || mo < 1 || mo > 12) return null;
  now = now || Date.now();
  const d = new Date(now);
  const dy = Number(day) > 0 ? Number(day) : 1;
  const make = (y) => {
    const t = new Date(y, mo - 1, dy);
    /* 2월 30일처럼 없는 날은 그 달 말일로 */
    return t.getMonth() === mo - 1 ? t : new Date(y, mo, 0);
  };
  let due = make(d.getFullYear()).getTime();
  if (due < startOfDay(now)) due = make(d.getFullYear() + 1).getTime();
  return due;
}

/* 오늘 떠야 할 반복 업무 */
function dueRoutines(st) {
  const endOfToday = todayKey() + DAY;
  return eligibleRoutines(st)
    .map((r) => ({ ...r, cfg: st.routines[r.key] }))
    /* 오늘 이미 완료한 것도 목록에 남겨둡니다 (지우지 않고 흐리게 표시하기 위해) */
    .filter((r) => r.cfg && r.cfg.on !== false && ((r.cfg.nextAt || 0) < endOfToday || (r.cfg.lastAt && r.cfg.lastAt >= todayKey())))
    /* 완료한 항목은 다음 회차가 미래로 밀리므로, 정렬에서는 오늘 자리를 지킵니다 */
    .sort((a, b) => {
      const at = (r) => (r.cfg.lastAt && r.cfg.lastAt >= todayKey() ? todayKey() : (r.cfg.nextAt || 0));
      return at(a) - at(b);
    });
}

/* 기념일 하나를 정기 일정으로 바꿉니다.
   온보딩에서도, 나중에 앱이 다시 물어볼 때도 같은 규칙이어야 합니다.
   못 만들면 null을 돌려줍니다(날짜가 없거나 이름을 안 적었을 때). */
function makeAnniversary(a, v) {
  const m = Number(v.m), dd = Number(v.d);
  if (!m || !dd) return null;
  const title = a.editable ? String(v.name || "").trim() : a.title;
  if (!title) return null;
  const useLunar = v.lunar !== undefined ? v.lunar : !!a.lunar;
  const md = `${String(m).padStart(2, "0")}-${String(dd).padStart(2, "0")}`;
  let anchor = md, evt;
  if (useLunar) {
    evt = nextLunarSolarAfter(md, Date.now());
    if (evt == null) return null;
    const ad = new Date(evt);
    anchor = `${String(ad.getMonth() + 1).padStart(2, "0")}-${String(ad.getDate()).padStart(2, "0")}`;
  } else evt = nextAnchorAfter(md, 0, Date.now());
  const id = uid("cr");
  /* 제사는 준비할 게 많아 2주 전부터 올립니다 */
  const lead = /제사|기일|차례/.test(title) ? 14 : 7;
  return {
    routine: { id, title, category: "event", cycle: 365 },
    key: `c:${id}`,
    cfg: { on: true, cycle: 365, anchor, leadDays: lead,
           lunar: useLunar || undefined, lunarMD: useLunar ? md : undefined,
           lunarLabel: useLunar ? `음력 ${m}월 ${dd}일` : undefined,
           nextAt: Math.max(evt - lead * DAY, todayKey()) },
  };
}

/* ── ② 생애주기 업무 ─────────────────────────── */
function buildRecommendations(st) {
  const now = Date.now();
  const out = [];
  const push = (seed, child, dday, dateKnown) => {
    const p = st.prefs[keyOf(seed, child)] || {};
    if (p.enabled === false || st.groupsOff[seed.g] || p.accepted || p.dismissedOnce) return;
    if (p.snoozedUntil && p.snoozedUntil > now) return;
    out.push({ key: keyOf(seed, child), seed, child, dday, dateKnown, lead: p.lead != null ? p.lead : seed.lead });
  };
  LIFE_SEEDS.forEach((seed) => {
    /* 복지는 유용정보에서 읽는 것입니다. 마감이 없어서 할 일로 담기면
       "시점 미정"만 쌓입니다. 추천 카드로 권하지 않습니다. */
    if (seed.wf) return;
    if (seed.kid) {
      st.children.forEach((ch) => {
        const m = childMonths(ch), [a, b] = seed.w;
        const p = st.prefs[keyOf(seed, ch)] || {};
        const lead = p.lead != null ? p.lead : seed.lead;
        const days = monthsToDays(a - m);
        if (days <= lead && m <= b) push(seed, ch, days, true);
      });
    } else {
      if (seed.f && !st.flags[seed.f]) return;
      if (seed.nkid && (st.children || []).length < seed.nkid) return;
      push(seed, null, null, false);
    }
  });
  return out.sort((x, y) => (x.dateKnown && y.dateKnown ? x.dday - y.dday : x.dateKnown ? -1 : y.dateKnown ? 1 : 0));
}

const usageMonth = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };
/* 이번 달 쓴 횟수. 달이 바뀌면 저절로 0부터 다시 셉니다 */
function usedThis(st, kind) {

function limitOf(st, kind) {

function leftOf(st, kind) {

  return lim === Infinity ? Infinity : Math.max(lim - usedThis(st, kind), 0);
}

/* 토큰은 만료되기도 하고 갱신되기도 해서, 부를 때마다 최신을 꺼내옵니다 */
async function authHeaders() {

      if (data && data.session && data.session.access_token) {

}

   검색은 한 번에 25원쯤 듭니다. 그래서 전부가 아니라 이런 말에만 켭니다. */
const NEEDS_WEB = /찾아|추천|알아봐|알아보|뭐가 있|어디서|어디에|프로그램|모집|공고|신청|접수|행사|전시|축제|캠프|체험|지원금|보조금|할인|무료|혜택|바뀐|달라진|올해|이번 ?달|요즘/;

async function askClaude(prompt, images, search) {
  const res = await fetch("/api/classify", {
    method: "POST",
    headers: { "Content-Type": "application/json", ...(await authHeaders()) },
    body: JSON.stringify({ prompt, images: images || undefined, search: search || undefined, promptVersion: PROMPT_VERSION }),
  });
  if (!res.ok) {
    let why = "";
    try { why = (await res.json()).error || ""; } catch {}
    const err = new Error(why || `서버가 ${res.status}로 응답했어요`);
    err.status = res.status;
    throw err;
  }
  const data = await res.json();
  const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
  return parseLoose(text, data.stop_reason, data.diag);
}

/* AI 답에서 자료만 꺼냅니다.
   답이 길이 제한에 걸려 중간에 끊기는 일이 실제로 생깁니다. 그때 그냥 던지면
   화면에 "Unexpected end of JSON input"만 뜹니다. 끊긴 답이라도 끝까지 온
   항목은 살려 쓰고, 정말 못 쓸 때만 무슨 일인지 한국어로 알립니다. */
function parseLoose(text, stopReason, diag) {
  const clean = String(text || "").replace(/```json/g, "").replace(/```/g, "").trim();
  /* 왜 못 읽었는지를 화면에서 바로 알 수 있어야 합니다.
     원문이 아니라 "무엇이 왔는지"만 붙입니다 */
  const tail = diag
    ? ` (받은 것: ${(diag.types || []).join("+") || "없음"} · 글자 ${diag.chars || 0} · 중단 ${stopReason || "?"})`
    : stopReason ? ` (중단 ${stopReason})` : "";
  const fail = (msg, code) => { const e = new Error(msg); e.code = code; e.stopReason = stopReason; e.diag = diag; throw e; };
  if (!clean) fail("AI가 빈 답을 보냈어요." + tail, "empty");

  const a = clean.indexOf("["), o = clean.indexOf("{");
  const at = o >= 0 && (o < a || a < 0) ? o : a;
  if (at < 0) fail("AI 답에서 정리된 내용을 못 찾았어요." + tail, "nojson");
  const body = clean.slice(at);

  try { return JSON.parse(body); } catch {}

  /* 뒤에 군더더기가 붙은 경우 — 마지막 닫는 괄호까지만 */
  const close = body.lastIndexOf(body[0] === "{" ? "}" : "]");
  if (close > 0) { try { return JSON.parse(body.slice(0, close + 1)); } catch {} }

  /* 배열이 중간에 끊긴 경우 — 온전히 닫힌 항목만 골라냅니다 */
  if (body[0] === "[") {
    const out = [];
    let depth = 0, start = -1, inStr = false, esc = false;
    for (let i = 1; i < body.length; i++) {
      const ch = body[i];
      if (inStr) { if (esc) esc = false; else if (ch === "\\") esc = true; else if (ch === '"') inStr = false; continue; }
      if (ch === '"') { inStr = true; continue; }
      if (ch === "{") { if (!depth) start = i; depth++; }
      else if (ch === "}") { depth--; if (!depth && start >= 0) { try { out.push(JSON.parse(body.slice(start, i + 1))); } catch {} start = -1; } }
    }
    if (out.length) return out;
  }
  fail((stopReason === "max_tokens"
    ? "AI 답이 너무 길어서 중간에 끊겼어요."
    : "AI 답을 읽지 못했어요.") + tail, "cut");
}

/* ── 바깥 서비스로 이어주는 카드 ─────────────────── */
/* 이번 접속에서 이미 센 노출 (같은 카드를 여러 번 세지 않게) */
const SHOWN = new Set();

/* 한 화면에 같은 링크가 두 번 뜨지 않게 합니다.
   살 것 옆에 쿠팡이 있는데 식단 아래에 또 쿠팡이 붙던 일이 있었습니다.
   먼저 그려진 카드가 이름을 잡고, 뒤에 오는 카드는 그 이름을 건너뜁니다.
   누가 잡았는지를 함께 적어두어서, 그 카드가 혼자 다시 그려질 때는
   자기 것을 그대로 다시 잡습니다. */
const ClaimCtx = createContext(null);
function LinkClaims({ children }) {
  const ref = useRef(null);
  ref.current = new Map();   /* 화면을 다시 그릴 때마다 처음부터 */
  return <ClaimCtx.Provider value={ref}>{children}</ClaimCtx.Provider>;
}

function LinkCards({ group, text, compact, exclude, noAd }) {
  const { st, setSt, log } = use();
  /* 눌렀다고 깐 것도, 예매한 것도 아닙니다. 앱은 알 수가 없습니다.
     그래서 클릭으로 숨기지 않고 90일간 그대로 둡니다.
     대신 사용자가 직접 "이미 있어요"를 누르면 그때 내립니다 —
     판단은 앱이 아니라 쓰는 사람이 합니다.
     · always  쿠팡·레시피처럼 늘 필요한 것 → 안 내림
     · 기본     첫 노출로부터 90일 → 그 뒤 자동으로 내림 */
  const clicked = st.linkClicks || {};
  const seen = st.linkSeen || {};
  const off = st.linkOff || {};
  const claims = useContext(ClaimCtx);
  const uid = useId();
  const skip = exclude || [];
  const hits = linksFor({ group, text, flags: st.flags }).filter((l) => {
    /* 복지 안내 밑에는 물건 파는 링크를 안 붙입니다. 안마기 광고가 그 자리에 붙으면
       바로 위의 "장기요양등급 신청"까지 광고로 읽힙니다.
       이 앱이 파는 건 "먼저ON이 말하면 진짜다" 하나뿐입니다.

       관공서만 남기는 방식은 써봤다가 물렀습니다 — 기차 할인 카드에서
       코레일까지 막혔습니다. 그건 광고가 아니라 실제로 가야 하는 길입니다. */
    if (noAd && l.ad) return false;
    if (skip.indexOf(l.name) >= 0) return false;
    /* 이 화면 위쪽에서 이미 뜬 링크는 건너뜁니다 */
    if (claims && claims.current) {
      const owner = claims.current.get(l.name);
      if (owner && owner !== uid) return false;
    }
    if (off[l.name] && Date.now() - off[l.name] < 180 * DAY) return false;
    if (l.always) return true;
    const from = seen[l.name] || clicked[l.name];
    return !from || (Date.now() - from) / DAY < 90;
  })
    /* 아직 못 보신 것을 앞으로. 한 자리에 2개까지만 — 그 이상은 광고판이 됩니다 */
    .sort((a, b) => (seen[a.name] ? 1 : 0) - (seen[b.name] ? 1 : 0))
    .slice(0, 2);
  if (claims && claims.current) hits.forEach((l) => claims.current.set(l.name, uid));
  /* 어디에서 뜬 카드인지 — 제휴 협상 때 "돌잔치 화면에서 몇 번" 을 말할 수 있어야 합니다 */
  const from = String(text || group || "").trim().slice(0, 24);
  useEffect(() => {
    const fresh = hits.filter((l) => !seen[l.name] && !l.always);
    hits.forEach((l) => {
      const key = l.name + "|" + from;
      if (SHOWN.has(key)) return;
      SHOWN.add(key);
      log("partner_show", { name: l.name, g: group || null, from });
    });
    /* 90일은 처음 보여드린 날부터 셉니다 */
    if (fresh.length) {
      const now = Date.now();
      setSt((sv) => {
        const cur = sv.linkSeen || {};
        const add = {};
        fresh.forEach((l) => { if (!cur[l.name]) add[l.name] = now; });
        return Object.keys(add).length ? { ...sv, linkSeen: { ...cur, ...add } } : sv;
      });
    }
  }, [hits.map((l) => l.name).join(","), from]);
  if (!hits.length) return null;
  return (
    <div className="flex flex-col gap-1.5" style={{ marginTop: compact ? 8 : 12 }}>

/* 기준 날짜(MM-DD)로 다음 차례 계산 — 생일·기념일용
   leadDays를 안 주면 일주일 전으로 잡습니다.
   0을 주면 그날 그대로입니다 — 예전에는 `leadDays || 7`이라 0이 7로 바뀌었고,
   그래서 "캘린더에 넣기"가 생일을 일주일 일찍 넣고 있었습니다. */
function nextFromAnchor(anchor, leadDays) {
  if (!anchor) return null;
  const [mm, dd] = anchor.split("-").map(Number);
  const now = new Date(); const y = now.getFullYear();
  let d = new Date(y, mm - 1, dd);
  if (d.getTime() < startOfDay(Date.now())) d = new Date(y + 1, mm - 1, dd);
  return d.getTime() - (leadDays == null ? 7 : leadDays) * DAY;
}
const anchorLabel = (a) => (a ? `${Number(a.split("-")[0])}월 ${Number(a.split("-")[1])}일` : "");
/* ── 음력 → 양력 변환 ──────────────────────────────
   한국천문연구원 데이터 기반(korean-lunar-calendar)으로 생성한
   2025~2045년 테이블. ny=음력 1월 1일의 양력 날짜,
   s=각 달 시작 오프셋(일), l=각 달 길이(29/30). 전 구간 검증 완료. */
const LUNAR_TABLE = {"2025":{"ny":[1,29],"s":[0,30,59,89,118,147,206,236,265,295,325,355],"l":[30,29,30,29,29,30,30,29,30,30,30,29]},"2026":{"ny":[2,17],"s":[0,30,59,89,118,147,177,206,236,265,295,325],"l":[30,29,30,29,29,30,29,30,29,30,30,30]},"2027":{"ny":[2,7],"s":[0,29,59,88,118,147,176,206,235,264,294,324],"l":[29,30,29,30,29,29,30,29,29,30,30,30]},"2028":{"ny":[1,27],"s":[0,29,59,89,118,177,206,236,265,294,324,354],"l":[29,30,30,29,30,29,30,29,29,30,30,29]},"2029":{"ny":[2,13],"s":[0,30,60,89,119,149,178,207,237,266,295,325],"l":[30,30,29,30,30,29,29,30,29,29,30,30]},"2030":{"ny":[2,3],"s":[0,29,59,88,118,148,177,207,236,266,295,325],"l":[29,30,29,30,30,29,30,29,30,29,30,29]},"2031":{"ny":[1,23],"s":[0,30,59,118,148,177,207,237,266,296,325,355],"l":[30,29,30,30,29,30,30,29,30,29,30,29]},"2032":{"ny":[2,11],"s":[0,30,59,88,118,147,177,207,236,266,296,325],"l":[30,29,29,30,29,30,30,29,30,30,29,30]},"2033":{"ny":[1,31],"s":[0,29,59,88,117,147,176,206,235,265,295,354],"l":[29,30,29,29,30,29,30,29,30,30,30,30]},"2034":{"ny":[2,19],"s":[0,29,59,88,117,147,176,206,235,265,295,325],"l":[29,30,29,29,30,29,30,29,30,30,30,29]},"2035":{"ny":[2,8],"s":[0,30,59,89,118,147,177,206,235,265,295,324],"l":[30,29,30,29,29,30,29,29,30,30,29,30]},"2036":{"ny":[1,28],"s":[0,30,60,89,119,148,207,236,265,295,325,354],"l":[30,30,29,30,29,29,29,29,30,30,29,30]},"2037":{"ny":[2,15],"s":[0,30,60,89,119,148,177,207,236,265,295,324],"l":[30,30,29,30,29,29,30,29,29,30,29,30]},"2038":{"ny":[2,4],"s":[0,30,60,89,119,148,178,207,237,266,295,325],"l":[30,30,29,30,29,30,29,30,29,29,30,29]},"2039":{"ny":[1,24],"s":[0,30,60,89,119,178,208,237,267,296,326,355],"l":[30,30,29,30,30,30,29,30,29,30,29,29]},"2040":{"ny":[2,12],"s":[0,30,59,89,119,148,178,208,237,267,296,326],"l":[30,29,30,30,29,30,30,29,30,29,30,29]},"2041":{"ny":[2,1],"s":[0,30,59,88,118,147,177,207,236,266,296,325],"l":[30,29,29,30,29,30,30,29,30,30,29,30]},"2042":{"ny":[1,22],"s":[0,29,88,117,147,176,206,235,265,295,324,354],"l":[29,30,29,30,29,30,29,30,30,29,30,30]},"2043":{"ny":[2,10],"s":[0,29,59,88,117,147,176,205,235,265,294,324],"l":[29,30,29,29,30,29,29,30,30,29,30,30]},"2044":{"ny":[1,30],"s":[0,30,59,89,118,147,177,235,265,294,324,354],"l":[30,29,30,29,29,30,29,30,29,30,30,30]},"2045":{"ny":[2,17],"s":[0,30,59,89,118,147,177,206,235,265,294,324],"l":[30,29,30,29,29,30,29,29,30,29,30,30]}};
function lunarToSolar(ly, lm, ld) {
  const t = LUNAR_TABLE[ly];
  if (!t) return null;
  const day = Math.min(ld, t.l[lm - 1]); /* 29일까지인 달의 30일 제사는 그 달 말일로 */
  return new Date(ly, t.ny[0] - 1, t.ny[1] + t.s[lm - 1] + day - 1).getTime();
}
/* afterMs 이후 첫 음력 MM-DD의 양력 시점. 테이블 밖이면 null */
function nextLunarSolarAfter(lunarMD, afterMs) {
  const [lm, ld] = lunarMD.split("-").map(Number);
  const y0 = new Date(afterMs).getFullYear();
  for (let y = y0 - 1; y <= y0 + 2; y++) {
    const t = lunarToSolar(y, lm, ld);
    if (t != null && t > afterMs) return t;
  }
  return null;
}

/* afterMs 이후에 오는 첫 (기념일 - 미리 알릴 일수) 시점 */
function nextAnchorAfter(anchor, lead, afterMs) {
  if (!anchor) return null;
  const [mm, dd] = anchor.split("-").map(Number);
  const y = new Date(afterMs).getFullYear();
  for (let i = 0; i <= 2; i++) {
    const t = new Date(y + i, mm - 1, dd).getTime() - (lead || 0) * DAY;
    if (t > afterMs) return t;
  }
  return null;
}

/* 주기 고르기 시트 — 주기 + 요일/날짜 패턴까지 한 자리에서 */
/* 씨앗의 기본 설정. 설·추석처럼 음력에 매인 것(lu)은 음력 정보를 함께 넣습니다.
   그래야 해마다 양력 날짜가 저절로 옮겨갑니다 — 올해 설이 2월 17일이면
   내년에는 알아서 다른 날로 갑니다. */
function seedCfg(seed) {
  const cycle = cycleToDays(seed.cy);
  /* 새 학기처럼 날짜가 정해진 일은 주기로 떠돌면 안 됩니다.
     "학기별(120일)"로 두면 8월에 이름표를 붙이라고 합니다. */
  if (seed && seed.an) {
    const lead = seed.lead || 0;
    const at = nextAnchorAfter(seed.an, 0, todayKey());
    return { cycle: 365, anchor: seed.an, leadDays: lead,
             nextAt: Math.max(at - lead * DAY, todayKey()) };
  }
  if (!seed || !seed.lu) return { cycle };
  const lead = seed.lead || 0;
  const at = nextLunarSolarAfter(seed.lu, todayKey());
  const d = at != null ? new Date(at) : null;
  return {
    cycle: 365, lunar: true, lunarMD: seed.lu, leadDays: lead,
    lunarLabel: `음력 ${Number(seed.lu.split("-")[0])}월 ${Number(seed.lu.split("-")[1])}일`,
    ...(d ? {
      anchor: `${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`,
      nextAt: Math.max(at - lead * DAY, todayKey()),
    } : {}),
  };
}

/* 사진을 1200px 이내로 줄이고 JPEG로 바꿉니다.
   원본 그대로 보내지 않는 이유: 통신량·비용도 있지만
   사진에 붙은 위치·기기 정보(EXIF)를 떼어내기 위해서예요. */
function shrinkImage(file, max = 1200) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("파일을 읽지 못했어요"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("사진을 열지 못했어요"));
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * scale);
        cv.height = Math.round(img.height * scale);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        const url = cv.toDataURL("image/jpeg", 0.78);
        resolve({ media_type: "image/jpeg", data: url.split(",")[1] });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* 캘린더로 내보내기 (.ics)
   폰 캘린더는 이미 알림을 잘 보냅니다. 우리가 못 하는 걸 거기에 얹습니다.
   ⚠ 알림(VALARM)이 없으면 캘린더에 들어가도 아무 소리가 안 납니다.
      전날 저녁 8시와 당일 아침 8시, 두 번 울리게 넣습니다. */
function icsText(title, whenMs, note) {
  const d = new Date(whenMs);
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  /* 쉼표·세미콜론·줄바꿈은 ics에서 뜻이 있는 글자라 그대로 두면 깨집니다 */
  const esc = (t) => String(t || "").replace(/\\/g, "\\\\").replace(/([,;])/g, "\\$1").replace(/\r?\n/g, " ").slice(0, 200);
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//meonjeon//KO", "CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",
    `UID:${Date.now()}-${Math.random().toString(36).slice(2, 8)}@meonjeon`,
    `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${ymd}`,
    `SUMMARY:${esc(title)}`, `DESCRIPTION:${esc(note || "먼저ON")}`,
    /* 전날 저녁 8시 (하루 전 0시 기준 +20시간) */
    "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${esc(title)}`, "TRIGGER:-PT4H", "END:VALARM",
    /* 당일 아침 8시 */
    "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${esc(title)}`, "TRIGGER:PT8H", "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
}

/* 네이버·카카오 앱 안의 브라우저는 .ics 파일을 캘린더로 못 넘깁니다.
   자기 다운로드함에 가둬두고 끝입니다. 그런 데서도 되는 건 "웹 페이지를 여는 것"뿐이라
   구글 캘린더 등록 화면을 링크로 엽니다.
   시간을 아침 9시로 두는 이유: 종일 일정으로 넣으면 캘린더 기본 알림이 안 붙는 경우가 많습니다. */
function gcalUrl(title, whenMs, note) {
  const d = new Date(whenMs);
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  const q = new URLSearchParams({
    action: "TEMPLATE",
    text: String(title || "").slice(0, 80),
    dates: `${ymd}T090000/${ymd}T093000`,
    ctz: "Asia/Seoul",
    details: String(note || "먼저ON").slice(0, 200),
  });
  return `https://calendar.google.com/calendar/render?${q.toString()}`;
}

/* 캘린더에 넣는 두 갈래를 한 자리에 */

      <button className="press" style={{ ...box, color: C.ink3 }}
        onClick={() => { log2("cal_ics"); downloadICS(title, whenMs, note);
          say("파일이 안 열리면 '구글 캘린더에'를 쓰세요. 앱 안 브라우저는 파일을 캘린더로 못 넘깁니다"); }}>
        파일로(.ics)
      </button>
    </>
  );
}

function downloadICS(title, whenMs, note) {
  const url = URL.createObjectURL(new Blob([icsText(title, whenMs, note)], { type: "text/calendar;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url;
  /* 아이폰에서 download를 붙이면 캘린더로 안 가고 "다운로드 목록"에 떨어집니다.
     거기서 한 번 더 눌러야 하는데, 그러면 까먹는 사람에게는 단계가 둘 더 생깁니다.
     그냥 열면 브라우저가 text/calendar를 보고 캘린더 추가 화면을 띄웁니다. */
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent || "");
  if (!ios) a.download = `${String(title).replace(/[\\/:*?"<>|]/g, "")}.ics`;
  else { a.target = "_blank"; a.rel = "noopener"; }
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ── 알림 ──────────────────────────────────────
   폰 잠금화면까지 가는 진짜 알림입니다. 앱을 안 열어도 옵니다 —
   "잘 까먹는 사람"에게는 이게 앱의 본체입니다.

   ⚠ 아이폰은 홈 화면에 추가해야만 됩니다. 애플이 그렇게 막아놨습니다. */
const standalone = () => {
  try {
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  } catch { return false; }
};
/* 서버가 준 공개 키를 브라우저가 알아듣는 모양으로 바꿉니다 */
function urlB64ToUint8(b64) {
  const pad = "=".repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

async function turnOnPush(hour) {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    return { error: "이 브라우저는 알림을 지원하지 않아요" };
  }
  if (inApp) return { error: `${inApp} 안에서는 알림을 못 켭니다. 위 안내대로 브라우저로 열어주세요` };
  if (isIOS() && !standalone()) return { error: "ios-home" };
  if (!window.__VAPID) return { error: "서버에 알림 키가 아직 없어요 (VAPID_PUBLIC_KEY)" };
  if (!window.__HH) return { error: "가구 정보를 아직 못 읽었어요. 새로고침해 주세요" };

  const perm = await Notification.requestPermission();
  if (perm !== "granted") return { error: "알림 권한이 꺼져 있어요. 브라우저 설정에서 허용해 주세요" };

  const reg = await navigator.serviceWorker.register("/sw.js");
  await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlB64ToUint8(window.__VAPID),
    });
  }
  const r = await fetch("/api/push-subscribe", {
    method: "POST",
    headers: { "Content-Type": "application/json", ...(await authHeaders()) },
    body: JSON.stringify({
      sub: sub.toJSON(), householdId: window.__HH, hour,
      /* 서버는 UTC로 돕니다. 한국이면 -540이 넘어가니 뒤집어서 보냅니다 */
      tzOffset: -new Date().getTimezoneOffset(),
    }),
  });
  if (!r.ok) { const j = await r.json().catch(() => ({})); return { error: j.error || "알림 등록에 실패했어요" }; }
  return { ok: true };
}

async function turnOffPush() {
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && (await reg.pushManager.getSubscription());
    if (sub) await sub.unsubscribe();
  } catch {}
  await fetch("/api/push-subscribe", {
    method: "POST",
    headers: { "Content-Type": "application/json", ...(await authHeaders()) },
    body: JSON.stringify({ off: true, householdId: window.__HH }),
  }).catch(() => {});
}

function PushBox() {
  const { st, setSt, say } = use();
  const nt = st.notify || {};
  const hour = PUSH_HOUR;
  const [busy, setBusy] = useState(false);
  const [howto, setHowto] = useState(false);
  const [msg, setMsg] = useState(null);
  /* "켜짐"은 가구 설정이라 가족 기기 전체에 같이 저장됩니다.
     그런데 알림은 기기마다 따로 등록됩니다 — 사파리에서 켜도 홈 화면 앱은
     안 켜져 있습니다. 그래서 이 기기에 진짜 등록됐는지를 따로 확인합니다.
     이걸 안 하면 "켜짐"이라고 적혀 있는데 아무것도 안 오는 일이 생깁니다. */
  const [here, setHere] = useState(null);
  const checkHere = async () => {
    try {
      if (!("serviceWorker" in navigator) || !("PushManager" in window)) return setHere(false);
      const reg = await navigator.serviceWorker.getRegistration();
      if (!reg) return setHere(false);
      const sub = await reg.pushManager.getSubscription();
      setHere(!!sub);
    } catch { setHere(false); }
  };
  useEffect(() => { checkHere(); }, []);

  const on = async (h) => {
    setBusy(true);
    const r = await turnOnPush(h).catch((e) => ({ error: String((e && e.message) || e) }));
    setBusy(false);
    if (r.error === "ios-home") { setHowto(true); return; }
    if (r.error) return say(r.error);
    setHowto(false);
    setSt((sv) => ({ ...sv, notify: { ...(sv.notify || {}), on: true, hour: h } }));
    checkHere();
    say(`매일 ${hourLabel(h)}에 알립니다`);
  };
  const test = async () => {
    setBusy(true); setMsg(null);
    try {
      const r = await fetch("/api/push-test", { method: "POST", headers: await authHeaders() }).then((x) => x.json());
      setMsg(r.ok
        ? { ok: true, t: `기기 ${r.sent}대로 보냈습니다.`,
            d: "이 화면을 벗어나서 잠금화면을 봐주세요. 30초 안에 안 오면 아래를 확인해 주세요." }
        : { ok: false, t: r.error || "보내지 못했어요", d: "" });
    } catch { setMsg({ ok: false, t: "서버에 닿지 못했어요", d: "" }); }
    setBusy(false);
  };
  const off = async () => {
    setBusy(true);
    await turnOffPush();
    setBusy(false);
    setSt((sv) => ({ ...sv, notify: { ...(sv.notify || {}), on: false } }));
    setHere(false); setMsg(null);
    say("알림을 껐어요");
  };

  return (
    <Card>
      <div style={{ padding: "14px 15px" }}>
        <div style={{ fontSize: 13.5, fontWeight: 600, color: C.ink }}>
          {nt.on ? `매일 ${hourLabel(hour)} · 켜짐` : `매일 ${hourLabel(hour)}, 폰으로`}
        </div>
        <div style={{ fontSize: 12, color: C.ink3, marginTop: 5, lineHeight: 1.7 }}>
          앱을 닫아둬도 그날 <b>살펴둘 일</b>만 한 줄로 보냅니다. 하루 한 번이고, 그 이상 보내지 않아요.
        </div>

        <div className="flex gap-2" style={{ marginTop: 13 }}>
          <button className="press" disabled={busy} onClick={() => on(hour)}
            style={{ background: C.moss, color: "#fff", border: "none", borderRadius: R.pill, padding: "10px 16px", fontSize: 12.5, opacity: busy ? 0.6 : 1 }}>
            {/* 가구 설정은 켜져 있는데 이 기기만 등록이 안 된 상태가 있습니다.
                 그때 "다시 확인"이라고 적혀 있으면 무엇을 누르는 건지 알 수 없습니다 */}
            {busy ? "잠시만요…" : !nt.on ? "알림 켜기" : here === false ? "이 기기에서 켜기" : "다시 확인"}
          </button>
          {nt.on && (
            <button className="press" disabled={busy} onClick={off}
              style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "10px 16px", fontSize: 12.5, color: C.ink2 }}>
              끄기
            </button>
          )}
        </div>

        {/* 이 기기에 진짜 등록됐는지 — 가구 설정과 별개입니다 */}
        <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px solid ${C.lineSoft}`, fontSize: 12.5, lineHeight: 1.7 }}>
          <span style={{ color: C.ink3 }}>지금 이 기기 · </span>
          {here == null ? <span style={{ color: C.ink3 }}>확인 중…</span>
            : here ? <b style={{ color: C.moss }}>등록됨</b>
            : <b style={{ color: C.persim }}>등록 안 됨</b>}
          {here === false && nt.on && (
            <div style={{ color: C.persim, marginTop: 5 }}>
              다른 기기에서 켜신 것 같아요. <b>이 기기에서도 “알림 켜기”를 한 번 눌러주세요.</b>
              알림은 기기마다 따로 등록됩니다.
            </div>
          )}
        </div>

        {/* "켜졌다"와 "온다"는 다릅니다. 내일 아침까지 기다렸다가 안 오면 하루를 버립니다 */}
        {here && (
          <>
            <button className="press" disabled={busy} onClick={test}
              style={{ width: "100%", marginTop: 11, background: "transparent", border: `1px solid ${C.line}`,
                       borderRadius: R.pill, padding: "10px 0", fontSize: 12.5, color: C.ink2 }}>
              {busy ? "보내는 중…" : "지금 테스트 알림 받아보기"}
            </button>

            {msg && (
              <div style={{ marginTop: 10, padding: "13px 14px", borderRadius: 14, fontSize: 12.5, lineHeight: 1.75,
                            background: msg.ok ? C.mossSoft : C.persimSoft, color: msg.ok ? C.moss : C.persim }}>
                <b>{msg.t}</b>
                {msg.d && <div style={{ marginTop: 4 }}>{msg.d}</div>}
              </div>
            )}

            {msg && msg.ok && (
              <div style={{ marginTop: 10, padding: "13px 14px", borderRadius: 14, background: C.bg,
                            fontSize: 12, color: C.ink2, lineHeight: 1.85 }}>
                <b style={{ color: C.ink }}>그래도 안 오면 여기를 봐주세요</b>
                <div style={{ marginTop: 6 }}>
                  1. 아이폰 <b>설정 앱</b> → <b>알림</b> → 목록을 내려 <b>먼저ON</b> 찾기<br />
                  &nbsp;&nbsp;→ “알림 허용”이 켜져 있고 <b>“잠금 화면”에 체크</b>돼 있는지<br />
                  &nbsp;&nbsp;<span style={{ opacity: .8 }}>(설정 <b>검색</b>으로는 안 나옵니다. 홈 화면에 추가한 앱은 검색에 안 잡혀요)</span><br />
                  2. 화면 위에서 아래로 쓸어내려 <b>집중 모드</b>가 켜져 있지 않은지<br />
                  3. <b>홈 화면 아이콘</b>으로 들어와 계신지 (사파리로 들어오면 안 옵니다)
                </div>
              </div>
            )}
          </>
        )}

        {howto && (
          <div style={{ marginTop: 13, background: C.sunSoft, border: `1px solid ${C.line}`, borderRadius: 14, padding: "12px 13px", fontSize: 12, color: C.ink2, lineHeight: 1.85 }}>
            <div style={{ fontWeight: 600, color: C.ink, marginBottom: 5 }}>아이폰은 한 단계가 더 있어요</div>
            애플이 <b>홈 화면에 추가한 앱</b>에만 알림을 허용합니다. 딱 한 번만 하시면 됩니다.
            <div style={{ marginTop: 8 }}>
              1. 사파리 아래쪽 <b>공유 버튼</b>(네모에 화살표)<br />
              2. <b>홈 화면에 추가</b><br />
              3. 홈 화면에 생긴 <b>먼저ON</b> 아이콘으로 다시 들어와서 <b>알림 켜기</b>
            </div>
          </div>
        )}

        {inApp && (
          <div style={{ marginTop: 11, fontSize: 11.5, color: C.persim, lineHeight: 1.7 }}>
            지금 {inApp} 안에서 보고 계셔서 알림을 켤 수 없어요. 오른쪽 위 메뉴에서 <b>다른 브라우저로 열기</b>를 눌러주세요.

/* 네이버·카카오·인스타 앱 안의 브라우저는 파일을 캘린더로 못 넘기고,
   홈 화면 추가도 안 되고, 알림도 못 켭니다. 쓰시는 분은 그걸 모릅니다.
   앱이 알아서 알려줘야 합니다. */
const inApp = (() => {
  const u = String((typeof navigator !== "undefined" && navigator.userAgent) || "");
  if (/NAVER|Whale.*inapp/i.test(u)) return "네이버 앱";
  if (/KAKAOTALK/i.test(u)) return "카카오톡";
  if (/Instagram/i.test(u)) return "인스타그램";
  if (/FBAN|FBAV/i.test(u)) return "페이스북";
  if (/DaumApps/i.test(u)) return "다음 앱";
  return null;
})();
const isIOS = () => /iPad|iPhone|iPod/.test(String((typeof navigator !== "undefined" && navigator.userAgent) || ""));

    </div>
  );

/* ── 새 버전이 나왔는지 스스로 봅니다 ──────────────
   홈 화면에 추가한 앱은 시작 화면을 아주 오래 들고 있습니다.
   실제로 폰이 0831-y에 굳어 있는 동안 서버는 0901-g였습니다.
   그러면 이미 고친 것을 다시 신고하게 되고, 베타에서 그건 시간 낭비입니다.

   그래서 화면을 다시 볼 때마다 version.json을 캐시 없이 읽어
   지금 돌고 있는 판과 다르면 위에 한 줄을 띄웁니다.
   새로고침은 사용자가 누릅니다 — 쓰던 걸 앱이 마음대로 끊지 않습니다. */
function useNewBuild() {
  const [newer, setNewer] = useState("");
  const last = useRef(0);
  useEffect(() => {
    const look = async () => {
      if (document.hidden) return;
      if (Date.now() - last.current < 60000) return;   /* 1분에 한 번이면 충분합니다 */
      last.current = Date.now();
      try {
        const r = await fetch(`/version.json?t=${Date.now()}`, { cache: "no-store" });
        if (!r.ok) return;
        const v = await r.json();
        if (v && v.build && v.build !== BUILD) setNewer(v.build);
      } catch {}
    };
    look();
    document.addEventListener("visibilitychange", look);
    window.addEventListener("focus", look);
    return () => {
      document.removeEventListener("visibilitychange", look);
      window.removeEventListener("focus", look);
    };
  }, []);
  return newer;
}

function NewBuildBar({ build }) {

      </span>
