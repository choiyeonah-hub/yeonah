[{"kind":"public 또는 private","title":"18자 이내","body":"무엇을 어떻게 하는지 80자 이내","deadline":"","who":"","category":"추정 카테고리 id","src":"기관·서비스 이름 12자 이내","url":"공식 안내 주소, 없으면 빈 문자열"}]`, null, true);
        const list = Array.isArray(r) ? r.filter((x) => x && x.title).slice(0, 4) : [];
        setSt((sv) => ({ ...sv, news: { month: mon, items: list, at: Date.now() } }));
        log("news_fetch", { n: list.length });
        if (forced) {
          say(list.length ? `${list.length}건 찾았어요` : "이번 달엔 찾은 게 없어요");
          if (!list.length) setSt((sv) => ({ ...sv, newsErr: "찾았는데 이 집에 맞는 게 없었어요" }));
        }
      } catch (e) {
        refundAI("find", 1);
        const why = String((e && e.message) || "").slice(0, 120);
        log("news_fail", { why: why.slice(0, 40) });
        fail(why ? `못 가져왔어요 — ${why}` : "못 가져왔어요. 잠시 뒤에 다시 눌러주세요");
      }
      setSt((sv) => ({ ...sv, newsBusy: false }));
    })();
  }, [st.onboarded, st.newsAsk]);

  const handOver = () => {
    if (!spouse) return say("설정에서 가족을 먼저 추가해 주세요");
    let n = 0;
    setSt((sv) => {
      const ro = { ...sv.routines };
      due.forEach((r) => { const c = ro[r.key] || {}; if (!c.owner || c.owner === me) { ro[r.key] = { ...c, owner: spouse.id }; n++; } });
      return { ...sv, routines: ro };
    });
    say(`오늘 ${n}개를 ${spouse.name}에게 넘겼어요`);
  };
  /* 오늘 루틴 전부 완료 — 요일·날짜 지정은 그 패턴대로 다음 회차 계산 */
  const doneAll = () => {
    const n = daily.length;
    setSt((sv) => {
      const ro = { ...sv.routines };
      daily.forEach((r) => {
        const c = ro[r.key] || { cycle: 30 };
        const patterned = dowList(c).length > 0 || domList(c).length > 0;
        const nx = c.anchor ? nextAnchorAfter(c.anchor, c.leadDays != null ? c.leadDays : 7, todayKey())
          : patterned ? nextByPattern(c) : todayKey() + (c.cycle || 30) * DAY;
        ro[r.key] = { ...c, nextAt: nx, lastAt: Date.now(), doneBy: me, streak: (c.streak || 0) + 1 };
      });
      return { ...sv, routines: ro };
    });
    log("routine_done_all", { n });
    say(`오늘 루틴 ${n}개를 모두 완료했어요`);
  };
  const pushAll = () => {
    setSt((sv) => {
      const ro = { ...sv.routines };
      daily.forEach((r) => { ro[r.key] = { ...(ro[r.key] || {}), nextAt: Date.now() + DAY }; });
      return { ...sv, routines: ro };
    });
    say("오늘 루틴은 내일로 미뤘어요");
  };

  return (
    <>
      <div className="rise" style={{ marginTop: 12, borderRadius: R.xl, overflow: "hidden", position: "relative",
                                     background: "radial-gradient(120% 100% at 100% 0%, #17564C 0%, #10403950 45%, transparent 70%), linear-gradient(165deg, #124038 0%, #17302C 70%)",
                                     boxShadow: SHADOW_LIFT }}>
        <div style={{ position: "absolute", top: -40, right: -30, width: 160, height: 160, borderRadius: 999, background: "rgba(120,220,200,.14)", filter: "blur(6px)" }} />
        <div style={{ padding: "22px 21px 21px", position: "relative" }}>
          <div className="mono" style={{ fontSize: 9.5, color: "#F0DE9A" }}>
            {new Date().getMonth() + 1}월 {new Date().getDate()}일 {WEEKDAY[new Date().getDay()]}요일
          </div>
          <div className="disp" style={{ color: "#fff", fontSize: 23, fontWeight: 600, lineHeight: 1.42, marginTop: 10, letterSpacing: "-.03em" }}>
            {meName} 님, 오늘<br />살펴둘 일은 {think.length}가지예요.
          </div>
          <div style={{ color: "#9DBDB5", fontSize: 13, marginTop: 10, lineHeight: 1.65 }}>
            {daily.length > 0 ? `루틴 ${daily.length}개는 늘 하던 일이라 세지 않았어요. ` : ""}
            {remain > 0 ? `나머지 ${remain}개는 제가 기억하고 있을게요.` : "지금은 급한 게 없어요."}
          </div>
          <button className="press" onClick={() => setTab("speak")}
            style={{ width: "100%", marginTop: 17, background: "#fff", color: C.ink, border: "none", borderRadius: R.md, padding: "15px 0", fontSize: 14.5, fontWeight: 600 }}>생각나는 거 말하기</button>
        </div>
      </div>


      {/* 보기 전환: 다 같이 / 내 몫만 */}
      {st.members.length > 1 && (
        <>
          <div className="flex gap-1.5" style={{ marginTop: 12, background: C.card, border: `1px solid ${C.lineSoft}`, borderRadius: R.pill, padding: 4, boxShadow: SHADOW }}>
            {[["all", "다 같이 보기"], ["mine", `${meName} 몫만`]].map(([k, l]) => (
              <button key={k} className="press" onClick={() => setOnly(k)}
                style={{ flex: 1, background: only === k ? C.ink : "transparent", color: only === k ? "#fff" : C.ink2, border: "none", borderRadius: R.pill, padding: "9px 0", fontSize: 12.5, fontWeight: only === k ? 600 : 400 }}>{l}</button>
            ))}
          </div>
          {only === "mine" && (
            <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 7, paddingLeft: 4, lineHeight: 1.6 }}>
              내 몫으로 정해진 일만 보여요. AI 추천과 담당 없는 일 {unowned}개는 ‘다 같이 보기’에 있어요.
            </div>
          )}
        </>
      )}

      <InAppNotice />


      <HolidayBrief />
      <MovePlan />



      <Section eyebrow="TODAY" title="오늘 살펴둘 일" right={think.length ? "나머지는 접어뒀어요" : null}>
        {thinkShown.length ? (
          <>
            {thinkShown.filter((x) => x.kind !== "rec").length > 0 && (
              <Card>
                {thinkShown.filter((x) => x.kind !== "rec").map((x, i, a) => x.kind === "task"
                  ? <TaskRow key={x.t.id} t={x.t} delay={i * 55} last={i === a.length - 1} />
                  : <RoutineRow key={x.r.key} r={x.r} delay={i * 55} last={i === a.length - 1} />)}
              </Card>
            )}
            {thinkShown.filter((x) => x.kind === "rec").map((x, i) => <div key={x.r.key} style={{ marginTop: 10 }}><RecCard rec={x.r} delay={120 + i * 60} /></div>)}
            {/* 급한 것을 조용히 숨기지 않습니다. 개수만 말하고, 누르면 펼칩니다 */}
            {hiddenUrgent.length > 0 && !all && (
              <button className="press w-full text-left" onClick={() => setAll(true)}
                style={{ marginTop: 10, background: C.persimSoft, border: `1px solid ${C.persimSoft}`,
                         borderRadius: 14, padding: "12px 14px" }}>
                <span style={{ fontSize: 13, color: C.persim, fontWeight: 600 }}>
                  오늘까지인 일이 {hiddenUrgent.length}개 더 있어요
                </span>
                <span style={{ display: "block", fontSize: 11.5, color: C.persim, opacity: .85, marginTop: 3, lineHeight: 1.6 }}>
                  {hiddenUrgent.slice(0, 3).map((t) => t.title).join(" · ")} · 눌러서 보기
                </span>
              </button>
            )}
          </>
        ) : (
          <Card flat style={{ background: "transparent", borderStyle: "dashed", boxShadow: "none" }}>
            <div style={{ padding: "26px 18px", textAlign: "center", fontSize: 13.5, color: C.ink3, lineHeight: 1.7 }}>
              {only === "mine"
                ? <>아직 {meName} 몫으로 정해진 일이 없어요.<br />항목 오른쪽 동그라미를 눌러 담당을 정해보세요.</>
                : <>오늘 따로 생각할 일은 없어요.<br />떠오르는 게 있으면 말하기로 비워두세요.</>}
            </div>
          </Card>
        )}
      </Section>

      {/* 이달의 소식 — 안 읽었을 때만 눈에 띕니다 */}
      {((st.news || {}).items || []).length > 0 && (
        <button className="press w-full text-left" onClick={() => setTab("news")}
          style={{ marginTop: 12, background: C.card, border: `1px solid ${C.sprout}`, borderRadius: R.lg, padding: "14px 16px", boxShadow: SHADOW }}>
          <span className="flex items-center gap-3">
            <span style={{ fontSize: 19 }}>📬</span>
            <span className="flex-1 min-w-0">
              <span style={{ display: "block", fontSize: 14, fontWeight: 600 }}>
                이달의 소식 {st.news.items.length}건
              </span>
              <span style={{ display: "block", fontSize: 12, color: C.ink3, marginTop: 3, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                {st.news.items.map((n) => n.title).join(" · ")}
              </span>
            </span>
            <span style={{ fontSize: 14, color: C.moss }}>›</span>
          </span>
        </button>
      )}

      {/* 살 것은 식단과 한 화면에 있어야 합니다. 여기서는 몇 개인지만 알려주고 넘깁니다 */}
      {st.tasks.some((t) => t.status === "buy" && !t.done) && (
        <button className="press w-full text-left" onClick={() => setTab("meal")}
          style={{ marginTop: 12, background: C.card, border: `1px solid ${C.lineSoft}`, borderRadius: R.lg, padding: "14px 16px", boxShadow: SHADOW }}>
          <span className="flex items-center gap-3">
            <span style={{ fontSize: 19 }}>🛒</span>
            <span className="flex-1 min-w-0">
              <span style={{ display: "block", fontSize: 14, fontWeight: 600 }}>
                살 것 {st.tasks.filter((t) => t.status === "buy" && !t.done).length}개
              </span>
              <span style={{ display: "block", fontSize: 12, color: C.ink3, marginTop: 3, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                {st.tasks.filter((t) => t.status === "buy" && !t.done).slice(0, 3).map((t) => t.title.replace(/\s*구매$/, "")).join(" · ")}
              </span>
            </span>
            <span style={{ fontSize: 14, color: C.moss }}>›</span>
          </span>
        </button>
      )}

      {only !== "mine" && (disc.length > 0 || loadingDisc) && (
        <Fold icon="✦" tone={C.sprout} defaultOpen={false}
          title={loadingDisc && !disc.length ? `${BRAND}이 찾아보는 중…` : `${BRAND}이 미리 찾은 것 ${disc.length}개`}
          sub={disc.length ? disc.map((d) => d.title).join(" · ") : "지금 시기에 놓치기 쉬운 일"}>
          {loadingDisc && !disc.length && (
            <Card><div style={{ padding: 18 }}>
              <div className="skel" style={{ height: 13, width: "45%" }} />
              <div className="skel" style={{ height: 17, width: "72%", marginTop: 11 }} />
              <div className="skel" style={{ height: 13, width: "88%", marginTop: 9 }} />
              <div className="skel" style={{ height: 44, width: "100%", marginTop: 14, borderRadius: 14 }} />
              <div style={{ fontSize: 12, color: C.ink3, marginTop: 11 }}>지금 시기에 놓치기 쉬운 걸 찾아보는 중…</div>
            </div></Card>
          )}
          {disc.map((item, i) => (
            <DiscoverCard key={i} item={item} delay={i * 70}
              onAdd={() => {
                /* 물건 제안은 할 일이 아니라 살 것으로 갑니다 */
                const isBuy = item.kind === "buy";
                const hit = isBuy ? { id: "etc", label: "살 것" }
                  : (cats.find((c) => c.id === item.category) || cats.find((c) => c.label.includes(String(item.category || ""))) || { id: "etc", label: "기타" });
                addTasks([{ title: item.title, category: hit.id,
                  status: isBuy ? "buy" : (item.status && STATUS[item.status] ? item.status : "week"),
                  note: item.why, coverage: "new" }], "ai");
                setDisc((d) => d.filter((x) => x !== item));
                say(isBuy ? "살 것에 담았어요" : `${hit.label} 영역에 담았어요`);
              }}
              onLater={() => {
                const m = String(item.when || "").match(/(\d{1,2})\s*월/);
                let at = Date.now() + 30 * DAY;
                if (m) { const mm = Number(m[1]); const now = new Date(); const y = now.getFullYear() + (mm - 1 < now.getMonth() ? 1 : 0); at = new Date(y, mm - 1, 1).getTime(); }
                setSt((sv) => ({ ...sv, discoverSnoozed: [...(sv.discoverSnoozed || []), { ...item, dueAt: at }] }));
                setDisc((d) => d.filter((x) => x !== item));
                say(`${item.when || "한 달 뒤"} 다시 알립니다`);
              }}
              onNo={() => { setSt((sv) => ({ ...sv, dismissedDiscover: [...sv.dismissedDiscover, item.title] })); setDisc((d) => d.filter((x) => x !== item)); }} />
          ))}
        </Fold>
      )}

      <PendingDates />
      <SkippedCats />

      {/* 매일 루틴은 체크리스트로 따로 */}
      {daily.length > 0 && (
        <Section eyebrow="ROUTINE" title="오늘의 루틴" right="매일 하는 것">
          <Card>
            {/* 접혀 있어도 무엇이 남았는지 이름으로 보입니다.
                잘 챙기고 있다고 말해주는 칭찬은 여기 쓰지 않습니다 —
                매일 하는 일을 매일 까먹는 사람에게는 틀린 말이고, 놀리는 것처럼 들립니다. */}
            <button className="press flex items-center justify-between w-full" onClick={() => setOpenRoutine((v) => !v)}
              style={{ background: "transparent", border: "none", padding: "14px 16px", borderBottom: openRoutine ? `1px solid ${C.line}` : "none" }}>
              <span style={{ fontSize: 14, color: C.ink2, textAlign: "left", minWidth: 0 }}>
                {/* "N개 남음"은 빚처럼 읽히고 "다 했어요"는 평가입니다.
                    매일 하는 일을 매일 못 하는 사람에게 둘 다 상처가 됩니다.
                    오늘 무엇이 도는지, 사실만 적습니다. */}
                <b style={{ color: C.ink, fontWeight: 600 }}>
                  {dailyLeft.length ? `오늘 도는 것 ${dailyLeft.length}개` : `오늘 도는 것 ${daily.length}개`}
                </b>
                {st.members.length > 1 && mineRoutines.length ? ` · ${meName} 님 몫 ${mineRoutines.length}개` : ""}
                {!openRoutine && dailyLeft.length > 0 && (
                  <span style={{ display: "block", fontSize: 11.5, color: C.ink3, marginTop: 3, lineHeight: 1.5 }}>
                    {dailyLeft.slice(0, 3).map((r) => r.seed.t + (r.child ? ` (${r.child.name})` : "")).join(" · ")}
                    {dailyLeft.length > 3 ? ` 외 ${dailyLeft.length - 3}개` : ""}
                  </span>
                )}
              </span>
              <span style={{ fontSize: 12.5, color: C.moss, flexShrink: 0 }}>{openRoutine ? "접기" : "펼치기"}</span>
            </button>
            {openRoutine && dailyLeft.length > 1 && (
              <div style={{ padding: "11px 16px", borderBottom: `1px solid ${C.line}` }}>
                {/* 하나씩 누르는 것도 일입니다. 다 했으면 한 번에 긋습니다.
                    안 한 것을 캐묻지 않습니다 — 그냥 내일 또 돕니다. */}
                <button className="press" onClick={() => {
                    dailyLeft.forEach((r) => routineAction(r.key, st.routines[r.key] || {}, "done"));
                    say(`${dailyLeft.length}개에 줄 그었어요`);
                  }}
                  style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: 999,
                    padding: "8px 14px", fontSize: 12.5, color: C.ink2, fontWeight: 600 }}>
                  오늘 건 한꺼번에 줄 긋기
                </button>
              </div>
            )}
            {openRoutine && daily.map((r, i, a) => <RoutineRow key={r.key} r={r} delay={i * 30} last={i === a.length - 1} />)}
          </Card>
          {openRoutine && <div className="flex gap-2" style={{ marginTop: 8 }}>
            <button className="press" onClick={doneAll} style={{ flex: 1.2, background: C.moss, border: "none", borderRadius: 12, padding: "10px 0", fontSize: 12.5, color: "#fff", fontWeight: 600 }}>✓ 전부 완료</button>
            <button className="press" onClick={pushAll} style={{ flex: 1, background: "transparent", border: `1px solid ${C.line}`, borderRadius: 12, padding: "10px 0", fontSize: 12.5, color: C.ink2 }}>통째로 내일로</button>
            {spouse && <button className="press" onClick={handOver} style={{ flex: 1, background: "transparent", border: `1px solid ${C.line}`, borderRadius: 12, padding: "10px 0", fontSize: 12.5, color: C.ink2 }}>{spouse.name}에게</button>}
          </div>}
        </Section>
      )}

      <div style={{ marginTop: 22 }}>
        <button onClick={() => setAll((v) => !v)} style={{ width: "100%", background: "none", border: "none", color: C.ink3, fontSize: 12.5, padding: 10 }}>
          {all ? "접기" : `기억하고 있는 ${Math.max(remain, 0)}개 보기`}
        </button>
        {all && (
          <>
            {occasional.length > 0 && <Section eyebrow="ROUTINE" title="이번 주 정기 일정">
              <Card>{occasional.map((r, i, a) => <RoutineRow key={r.key} r={r} delay={i * 35} last={i === a.length - 1} />)}</Card>
            </Section>}
            {openTasks.length > 0 && <Section eyebrow="TASKS" title="담아둔 일" right="날짜순">
              <Card>{openTasks.slice().sort((a, b) => (a.dueAt || 0) - (b.dueAt || 0)).map((t, i, a) => <TaskRow key={t.id} t={t} delay={i * 35} last={i === a.length - 1} />)}</Card>
            </Section>}
            {/* 날짜를 아는 것만 올립니다. 여행 계획도 없는데 "환전"이 뜨는 이유가
                기준 날짜를 모르는 항목까지 여기 섞였기 때문입니다.
                시점을 모르는 일은 타임라인 > 시점 미정에 영역별로 접혀 있습니다. */}
            {datedRecs.length > 0 && <Section eyebrow="AHEAD" title="미리 살필 일">
              {datedRecs.slice(0, 6).map((r, i) => <RecCard key={r.key} rec={r} delay={i * 50} />)}
            </Section>}
            {st.tasks.some((t) => t.done) && <Section eyebrow="DONE" title="끝낸 일">
              <Card>{st.tasks.filter((t) => t.done).map((t, i, a) => <TaskRow key={t.id} t={t} delay={i * 30} last={i === a.length - 1} />)}</Card>
            </Section>}
          </>
        )}
      </div>
    </>
  );
}

/* ── 말하기 ───────────────────────────────────── */
function Speak() {
  const { st, setSt, cats, addTasks, me, say, setTab, log, spendAI, refundAI } = use();
  const [text, setText] = useState("");
  const [capped, setCapped] = useState(null);   /* 상한에 닿았을 때 보여줄 안내 */
  const [phase, setPhase] = useState("input");
  const [result, setResult] = useState([]);
  const [listening, setListening] = useState(false);
  const [shots, setShots] = useState([]);        /* 올린 사진 미리보기 */
  const [hasShot, setHasShot] = useState(false);  /* 사진을 올렸는지 — 안내 문구용 */
  const [answer, setAnswer] = useState("");       /* 질문에 대한 AI의 답 — 담기 전에 먼저 보여줌 */
  const [groupBy, setGroupBy] = useState("cat");  /* 결과를 영역별로 볼지 시점별로 볼지 */
  const fileRef = useRef(null);
  const [note, setNote] = useState("");
  const [failed, setFailed] = useState(false);
  const [ex, setEx] = useState(0);
  const [edit, setEdit] = useState(null);
  const rec = useRef(null);

  /* 영역 화면에서 예시 질문을 눌러 넘어온 경우 */
  useEffect(() => {
    if (!st.draft) return;
    const joined = (text ? text + " " : "") + st.draft;
    const run = st.draftRun;
    setText(joined);
    setSt((sv) => ({ ...sv, draft: "", draftRun: false }));
    /* 예시 질문을 눌러서 넘어온 것이면 한 번 더 누르게 하지 않고 바로 답합니다 */
    if (run) analyze(joined);
  }, [st.draft]);

  /* 카테고리별로 묶어두고 접었다 폅니다. 스스로 바뀌지 않아요 */
  const exByCat = useMemo(() => cats
    .map((c) => {
      const all = c.child
        ? (KID_PROMPTS[kidBand(childMonths(c.child))] || [])
        : (PROMPTS[c.id] || []);
      /* 아이마다 다른 자리에서 시작하게 합니다 — 첫째와 둘째가 같은 줄이면
         나이대로 갈라놓은 뜻이 없어집니다 */
      return { cat: c, list: rotatePrompts(all, c.id, 4) };
    })
    .filter((g) => g.list.length), [cats]);

              : Date.now() + r.repeatDays * DAY };
        });
        return { ...sv, customRoutines: cr, routines: ro };
      });
    }
    /* 날짜가 아직 멀면 "담았는데 안 보인다"가 됩니다. 언제 올라오는지 같이 알려줍니다 */
    const soon = result.map((r) => r.dueAt || 0).filter(Boolean).sort((a, b) => a - b)[0];
    const far = soon && soon > todayKey() + DAY ? new Date(soon) : null;
    say(reps.length ? `${n}개를 담고 ${reps.length}개는 정기로 등록했어요`
      : far ? `${n}개를 담았어요 · ${far.getMonth() + 1}/${far.getDate()}부터 올라와요`
      : `${n}개를 담았어요`);
    setSt((sv) => ({ ...sv, showAll: Date.now() }));
    setTab("home");
  };

  if (capped) {
    const left = leftOf(st, capped), lim = limitOf(st, capped);
    return (
      <>
        <div style={{ marginTop: 20, paddingLeft: 2 }}>
          <div className="disp" style={{ fontSize: 22, fontWeight: 600 }}>이번 달 {AI_LABEL[capped]}를 다 쓰셨어요</div>
          <p style={{ fontSize: 13.5, color: C.ink2, marginTop: 9, lineHeight: 1.75 }}>
            무료로 쓰시는 동안 한 달에 {lim}번까지 도와드리고 있어요. {nextResetLabel()}에 다시 채워집니다.
          </p>
        </div>
        <Card style={{ marginTop: 16, borderColor: C.moss }}>
          <div style={{ padding: 17 }}>
            <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 8 }}>그동안에도 그대로 챙깁니다</div>
            <div style={{ fontSize: 13, color: C.ink2, lineHeight: 1.8 }}>
              직접 적으신 일은 <b>횟수와 상관없이</b> 담기고, 정기 일정과 미리 알려드리는 것도 계속 돌아갑니다.
              AI가 대신 정리해주는 것만 잠깐 쉬는 거예요.
            </div>
          </div>
        </Card>
        <div style={{ marginTop: 18 }}>
          <Btn kind="accent" onClick={() => { setCapped(null); setResult([{ title: text.trim().slice(0, 20) || "", category: (cats[0] || {}).id, status: "week", note: "" }]); setPhase("result"); setEdit(0); }}>
            직접 적어서 담기
          </Btn>
          <div style={{ height: 8 }} />
          <Btn kind="ghost" onClick={() => { setCapped(null); setTab("home"); }}>오늘 화면으로</Btn>
        </div>
      </>
    );
  }

  if (phase === "thinking") return (
    <Card style={{ marginTop: 14 }}>
      <div style={{ padding: "48px 20px", textAlign: "center" }}>
        <div className="disp" style={{ fontSize: 17, fontWeight: 600, marginBottom: 22 }}>머릿속을 펼치는 중</div>
        <div className="flex flex-wrap justify-center gap-2">
          {toFragments(text).map((w, i) => (
            <span key={i} className="frag" style={{ "--r": `${(i % 5) - 2}deg`, animationDelay: `${i * 90}ms`, background: C.bg, border: `1px solid ${C.line}`, borderRadius: 9, padding: "5px 9px", fontSize: 12, color: C.ink2 }}>{w}</span>
          ))}
        </div>
        <div className="mono" style={{ fontSize: 10.5, color: C.ink3, marginTop: 26 }}>카테고리 · 시점 · 선행 판단 중</div>
      </div>
    </Card>
  );

  if (phase === "result") return (
    <>
      <div style={{ marginTop: 20, paddingLeft: 2 }}>
        <div className="disp" style={{ fontSize: 22, fontWeight: 600 }}>
          {answer ? "이렇게 해보면 어때요?" : `${result.length}개로 정리했어요`}
        </div>
        <p style={{ fontSize: 13.5, color: C.ink2, marginTop: 7, lineHeight: 1.65 }}>
          {answer ? "괜찮으면 아래에서 필요한 일만 담으세요." : "담으면 가족 모두에게 보이고, 담당자를 나눌 수 있어요."}
        </p>
        {failed && <div style={{ marginTop: 12, background: C.sunSoft, color: C.sun, borderRadius: 12, padding: "11px 13px", fontSize: 12.5, lineHeight: 1.7 }}>
          {typeof failed === "string" ? failed : "이번엔 분석이 실패했어요."} 아래는 예시라 담지 마시고, 다시 시도해 주세요.
        </div>}
        {newCats.length > 0 && <div style={{ marginTop: 12, background: C.mossSoft, color: C.moss, borderRadius: 12, padding: "11px 13px", fontSize: 12.5, lineHeight: 1.6 }}>
          지금 카테고리에 없는 이야기가 있어요. <b>{newCats.join(", ")}</b>은 기타로 담아둘게요. 영역 화면에서 새로 만들 수 있습니다.
        </div>}
      </div>
      {answer && (
        <Card style={{ marginTop: 16, borderColor: C.sprout }}>
          <div style={{ padding: 17 }}>
            <div className="flex items-center gap-2" style={{ marginBottom: 10 }}>
              <Avatar member="ai" size={22} />
              <span className="mono" style={{ fontSize: 9.5, color: C.moss }}>{BRAND}의 답</span>
            </div>
            <div style={{ fontSize: 14, lineHeight: 1.85, whiteSpace: "pre-wrap" }}>{answer}</div>
            <LinkCards group={null} text={answer.slice(0, 60)} compact />
          </div>
        </Card>
      )}
      {answer && result.length > 0 && (
        <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 16, paddingLeft: 3, fontWeight: 600 }}>이걸 하려면 이런 일이 필요해요 👇</div>
      )}
      {result.length > 1 && (
        <div className="flex items-center gap-2" style={{ marginTop: 16, paddingLeft: 3 }}>
          <span style={{ fontSize: 11.5, color: C.ink3 }}>묶어 보기</span>
        </div>
      )}
      {result.length > 1 && (
        <div className="flex gap-1.5" style={{ marginTop: 7, background: C.card, border: `1px solid ${C.lineSoft}`, borderRadius: R.pill, padding: 4, boxShadow: SHADOW }}>
          {[["cat", "영역별"], ["time", "시점별"]].map(([k, l]) => (
            <button key={k} className="press" onClick={() => setGroupBy(k)}
              style={{ flex: 1, background: groupBy === k ? C.ink : "transparent", color: groupBy === k ? "#fff" : C.ink2, border: "none", borderRadius: R.pill, padding: "9px 0", fontSize: 12.5, fontWeight: groupBy === k ? 600 : 400 }}>{l}</button>
          ))}
        </div>
      )}
      {grouped.map((g, gi) => (
        <Section key={g.key} title={<span style={{ color: g.color }}>{g.label}</span>} right={g.hint}>
          <Card>{g.items.map((t, i, a) => {
            const cat = cats.find((c) => c.id === t.category) || { emoji: "🗂", label: t.newCategory || "기타" };
            const idx = result.indexOf(t);
            return (
              <button key={i} className="press rise flex items-start gap-3 w-full text-left" onClick={() => setEdit(idx)}
                style={{ background: "transparent", border: "none", padding: "14px 16px", borderBottom: i === a.length - 1 ? "none" : `1px solid ${C.line}`, animationDelay: `${gi * 100 + i * 55}ms` }}>
                <span className="flex-1 min-w-0">
                  <span style={{ display: "block", fontSize: 15, fontWeight: 500 }}>{t.title}</span>
                  <span style={{ display: "block", fontSize: 12, color: C.ink3, marginTop: 4 }}>
                    {t.dueAt ? <span style={{ color: dueLabel(t.dueAt).urgent ? C.persim : C.moss, fontWeight: 600 }}>{dueLabel(t.dueAt).date} · {dueLabel(t.dueAt).text} · </span> : null}
                    {t.eventAt ? <span style={{ color: C.sun, fontWeight: 600 }}>그날 {dueLabel(t.eventAt).date} · </span> : null}
                    {cat.emoji} {cat.label} · {t.note}
                    {t.repeatDays ? <span style={{ color: C.moss }}> · {patternLabel({ cycle: t.repeatDays, dow: t.repeatDow, dows: t.repeatDows, dom: t.repeatDom, doms: t.repeatDoms })} 반복</span> : null}
                  </span>
                </span>
                <Chip status={t.status} />
                <span style={{ fontSize: 13, color: C.ink3, marginTop: 2 }}>›</span>
              </button>
            );
          })}</Card>
          <LinkCards group={null} text={g.items.map((t) => t.title).join(" ")} />
        </Section>
      ))}
      <div style={{ marginTop: 14, background: C.mossSoft, borderRadius: R.sm, padding: "13px 15px", fontSize: 12.5, color: C.moss, lineHeight: 1.6 }}>
        항목을 누르면 이름·시점·영역·반복을 모두 고칠 수 있어요. 필요 없는 건 빼셔도 됩니다.
      </div>
      <button className="press w-full" onClick={() => { setResult((rs) => [...rs, { title: "", category: (cats[0] || {}).id, status: "week", note: "" }]); setEdit(result.length); }}
