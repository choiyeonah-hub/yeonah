/* 자동차 검사·보험 시점 —
   보험사·검사기관 API는 본인인증 없이는 열리지 않습니다. 그래서 연동 대신
   최초등록 연월과 보험 갱신월만 한 번 받고, 날짜는 법정 주기로 계산합니다. */
/* 차마다 검사일도 보험 갱신 달도 다릅니다. 한 대씩 따로 받습니다. */
function CarOne({ car, idx, n }) {
  const { st, setSt, say } = use();
  const insp = nextCarInspection(car.firstReg);
  const ins = nextInsuranceMonth(car.insMonth, null, car.insDay);
  const fmt = (t) => t ? new Date(t).toLocaleDateString("ko-KR", { year: "numeric", month: "long" }) : null;
  const dday = (t) => Math.round((t - todayKey()) / DAY);

  /* 계산한 시점을 정기 일정으로 넣어 알림·담당까지 그대로 씁니다.
     차가 여러 대면 일정도 차마다 따로 생겨야 합니다 — id에 차 번호를 붙입니다. */
  const sync = (next) => setSt((sv) => {
    const list = carsOf(sv).map((c) => c.id === car.id ? { ...c, ...next } : c);
    const me = list.find((c) => c.id === car.id) || {};
    const kInsp = `car-insp:${car.id}`, kIns = `car-ins:${car.id}`;
    const cr = (sv.customRoutines || []).filter((r) => r.id !== kInsp && r.id !== kIns);
    const ro = { ...sv.routines };
    delete ro[`c:${kInsp}`]; delete ro[`c:${kIns}`];
    /* 차가 한 대면 이름을 안 붙입니다. "우리 차 정기검사"는 군더더기예요 */
    const tail = list.length > 1 ? ` (${carLabel(me, idx)})` : "";
    const i1 = nextCarInspection(me.firstReg);
    if (i1) {
      cr.push({ id: kInsp, title: "자동차 정기검사 받기" + tail, category: "transport", cycle: 730 });
      ro[`c:${kInsp}`] = { on: true, cycle: 730, nextAt: i1 - 31 * DAY };
    }
    const i2 = nextInsuranceMonth(me.insMonth, null, me.insDay);
    if (i2) {
      /* 보험은 금융입니다. 차가 두 대여도 갱신·비교는 돈 쓰는 일이라 그 영역에서 봅니다. */
      cr.push({ id: kIns, title: "자동차 보험 만기" + tail, category: "finance", cycle: 365 });
      const d2 = new Date(i2);
      ro[`c:${kIns}`] = {
        on: true, cycle: 365,
        /* 만기일 5일 전부터 올라오고, 갱신했다고 누를 때까지 매일 남아 있습니다 */
        anchor: `${String(d2.getMonth() + 1).padStart(2, "0")}-${String(d2.getDate()).padStart(2, "0")}`,
        leadDays: 5,
        nextAt: Math.max(i2 - 5 * DAY, todayKey()),
      };
    }
    return { ...sv, cars: list, customRoutines: cr, routines: ro };
  });

  const drop = () => {
    if (!confirm(`${carLabel(car, idx)}를 지울까요? 이 차의 검사·보험 일정도 같이 없어집니다.`)) return;
    setSt((sv) => {
      const kInsp = `car-insp:${car.id}`, kIns = `car-ins:${car.id}`;
      const ro = { ...sv.routines };
      delete ro[`c:${kInsp}`]; delete ro[`c:${kIns}`];
      return { ...sv, cars: carsOf(sv).filter((c) => c.id !== car.id),
               customRoutines: (sv.customRoutines || []).filter((r) => r.id !== kInsp && r.id !== kIns),
               routines: ro };
    });
    say("지웠어요");
  };

  const thisYear = new Date().getFullYear();
  const years = []; for (let y = thisYear; y >= thisYear - 24; y--) years.push(y);
  const ry = (car.firstReg || "").split("-")[0] || "";
  const rm = (car.firstReg || "").split("-")[1] || "";
  const setReg = (y, m) => { if (y && m) sync({ firstReg: `${y}-${m}` }); else sync({ firstReg: "" }); };

  return (
    <Card style={{ marginTop: 10 }}>
      <div style={{ padding: 15 }}>
        <div className="flex items-center gap-2">
          <input className="hae" value={car.name || ""} onChange={(e) => sync({ name: e.target.value })}
            placeholder={n > 1 ? `${idx + 1}번째 차 — 예: 남편 차, 카니발` : "우리 차"}
            style={{ flex: 1, minWidth: 0, border: `1px solid ${C.line}`, borderRadius: 11, padding: "10px 12px",
                     fontSize: 14, fontWeight: 600, background: C.bg, color: C.ink }} />
          {n > 1 && <button className="press" onClick={drop} aria-label="이 차 지우기"
            style={{ background: "transparent", border: "none", color: C.ink3, fontSize: 13, padding: "4px 6px" }}>✕</button>}
        </div>

        <div className="flex gap-2" style={{ marginTop: 11 }}>
          {Object.keys(CAR_TYPES).map((k) => {
            const on = (car.type || "ice") === k;
            return (
              <button key={k} className="press" onClick={() => sync({ type: k })}
                style={{ flex: 1, background: on ? C.mossSoft : C.bg, color: on ? C.moss : C.ink2,
                         border: `1px solid ${on ? C.moss : C.line}`, borderRadius: R.sm, padding: "10px 0",
                         fontSize: 12, fontWeight: 600 }}>
                {CAR_TYPES[k].emoji} {CAR_TYPES[k].label}
              </button>
            );
          })}
        </div>

        <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 16 }}>최초 등록</div>
        <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 4 }}>자동차등록증이나 보험 안내문에 적혀 있어요.</div>
        <div className="flex gap-2" style={{ marginTop: 8 }}>
          <select className="hae" value={ry} onChange={(e) => setReg(e.target.value, rm)}
            style={{ flex: 1.3, border: `1px solid ${C.line}`, borderRadius: 11, padding: "11px 10px", fontSize: 14, background: C.bg, color: C.ink }}>
            <option value="">연도</option>
            {years.map((y) => <option key={y} value={String(y)}>{y}년</option>)}
          </select>
          <select className="hae" value={rm} onChange={(e) => setReg(ry, e.target.value)}
            style={{ flex: 1, border: `1px solid ${C.line}`, borderRadius: 11, padding: "11px 10px", fontSize: 14, background: C.bg, color: C.ink }}>
            <option value="">월</option>
            {Array.from({ length: 12 }, (_, i) => String(i + 1).padStart(2, "0")).map((m) => <option key={m} value={m}>{Number(m)}월</option>)}
          </select>
        </div>

        <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 18 }}>보험 만기일</div>
        <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 4, lineHeight: 1.6 }}>
          보험증권이나 문자에 적힌 <b style={{ color: C.ink2 }}>만기일</b>이에요.
          하루만 넘겨도 무보험이라 <b style={{ color: C.ink2 }}>5일 전부터</b> 매일 올립니다.
        </div>
        <div className="grid grid-cols-6 gap-1.5" style={{ marginTop: 9 }}>
          {Array.from({ length: 12 }, (_, i) => i + 1).map((m) => {
            const on = Number(car.insMonth) === m;
            return (
              <button key={m} className="press" onClick={() => sync({ insMonth: on ? null : m, insDay: on ? null : car.insDay })}
                style={{ background: on ? C.mossSoft : C.bg, color: on ? C.moss : C.ink2, border: `1px solid ${on ? C.moss : C.line}`, borderRadius: 10, padding: "9px 0", fontSize: 12, fontWeight: on ? 600 : 400 }}>{m}월</button>
            );
          })}
        </div>
        {car.insMonth ? (
          <>
            <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 12 }}>며칠인가요?</div>
            <div className="grid gap-1.5" style={{ marginTop: 7, gridTemplateColumns: "repeat(7, minmax(0, 1fr))" }}>
              {Array.from({ length: 31 }, (_, i) => i + 1).map((n) => {
                const on = Number(car.insDay) === n;
                return (
                  <button key={n} className="press" onClick={() => sync({ insDay: on ? null : n })}
                    style={{ background: on ? C.moss : C.bg, color: on ? "#fff" : C.ink2, border: `1px solid ${on ? C.moss : C.line}`,
                             borderRadius: 9, padding: "8px 0", fontSize: 12, fontWeight: 600 }}>{n}</button>
                );
              })}
            </div>
            {!car.insDay && <div style={{ fontSize: 11.5, color: C.sun, marginTop: 8, lineHeight: 1.6 }}>
              날짜를 모르시면 안 골라도 됩니다. 그 달 1일 기준으로 잡아둘게요.
            </div>}
          </>
        ) : null}

        {(insp || ins) && (
          <div style={{ marginTop: 15, paddingTop: 13, borderTop: `1px solid ${C.lineSoft}` }}>
            <div className="mono" style={{ fontSize: 9.5, color: C.moss }}>이렇게 챙길게요</div>
            {insp && <div style={{ fontSize: 13.5, marginTop: 9, lineHeight: 1.65 }}>
              정기검사 <b>{fmt(insp)}</b>쯤 · <span style={{ color: C.moss }}>D-{dday(insp)}</span>
              <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 3 }}>월까지만 계산한 값이에요. 만료 한 달 전에 정기 일정으로 올라오고, 정확한 날짜는 그때 자동차민원 포털에서 확인하시면 됩니다</div>
            </div>}
            {ins && <div style={{ fontSize: 13.5, marginTop: 11, lineHeight: 1.65 }}>
              보험 만기 <b>{new Date(ins).toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric" })}</b>
              {" · "}<span style={{ color: C.moss }}>D-{dday(ins)}</span>
              <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 3 }}>
                {car.insDay ? "만기 5일 전부터 매일 올립니다. 금융 영역에 있습니다."
                            : "날짜를 안 고르셔서 그 달 1일 기준이에요. 5일 전부터 매일 올립니다."}
              </div>
            </div>}
          </div>
        )}
      </div>
    </Card>
  );
}

/* 자동차 검사·보험 시점 —
   보험사·검사기관 API는 본인인증 없이는 열리지 않습니다. 그래서 연동 대신
   최초등록 연월과 보험 갱신월만 한 번 받고, 날짜는 법정 주기로 계산합니다. */
function CarDates() {
  const { st, setSt, say } = use();
  const cars = carsOf(st);

  const add = () => setSt((sv) => {
    const list = carsOf(sv);
    if (list.length >= 4) return sv;
    return { ...sv, cars: [...list, { id: uid("car"), name: "", type: "ice", firstReg: "", insMonth: null }] };
  });

  return (
    <>
      <div style={{ fontSize: 12.5, color: C.ink3, marginTop: 10, paddingLeft: 2, lineHeight: 1.7 }}>
        한 번만 넣어두면 다시 안 물어봐요. 법정 주기(신차 4년 → 이후 2년)로 다음 검사 시점을 계산합니다.
      </div>
      {cars.length === 0
        ? <Card style={{ marginTop: 10 }}><div style={{ padding: "22px 16px", fontSize: 13.5, color: C.ink3, textAlign: "center", lineHeight: 1.7 }}>
            아직 등록한 차가 없어요.<br />아래에서 추가하시면 검사·보험 시점을 챙깁니다.
          </div></Card>
        : cars.map((c, i) => <CarOne key={c.id} car={c} idx={i} n={cars.length} />)}
      {cars.length < 4 && (
        <button className="press" onClick={add}
          style={{ width: "100%", marginTop: 10, background: "transparent", border: `1px dashed ${C.line}`,
                   borderRadius: R.sm, padding: "13px 0", fontSize: 13, color: C.ink2 }}>
          {cars.length ? "차 한 대 더 추가" : "차 추가"}
        </button>
      )}
      {cars.length > 1 && (
        <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 9, paddingLeft: 2, lineHeight: 1.7 }}>
          차마다 검사·보험 일정이 따로 올라옵니다. 이름을 적어두시면 어느 차인지 바로 보여요.
        </div>
      )}
    </>
  );
}

function Settings() {

  const [d, setD] = useState(st);
  const [dash, setDash] = useState(false);
  const [routineCat, setRoutineCat] = useState(null);
  const [pickKey, setPickKey] = useState(null);

  const routineGroups = useMemo(() => {
    const g = {};
    eligibleRoutines(st, true).forEach((r) => {
      const cid = r.child ? `kid:${r.child.id}` : r.seed.cat;
      const meta = r.child ? { label: `${r.child.name}(${childLabel(r.child)})`, emoji: "🧒" }
        : (BASE_CATS.find((c) => c.id === r.seed.cat) || { label: "기타", emoji: "🗂" });
      (g[cid] = g[cid] || { cid, label: meta.label, emoji: meta.emoji, items: [], on: 0 }).items.push(r);
      if ((st.routines[r.key] || {}).on) g[cid].on++;
    });
    return Object.values(g);
  }, [st.routines, st.children, st.flags, st.customRoutines]);
  const inp = { border: `1px solid ${C.line}`, borderRadius: 12, padding: "11px 12px", fontSize: 14.5, background: C.bg, color: C.ink, width: "100%" };

      <BetaAll />
      <Section eyebrow="ANA-01" title="이 집의 지표">
        <div className="grid grid-cols-2 gap-2.5">
          {[["총 할 일", st.tasks.length], ["완료", st.tasks.filter((t) => t.done).length], ["AI가 먼저 꺼낸 일", st.tasks.filter((t) => t.raisedBy === "ai").length], ["제휴 링크 클릭", st.events.filter((e) => e.name === "partner_click").length]].map(([k, v]) => (
            <div key={k} style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 16, padding: 15, boxShadow: SHADOW }}>
              <b className="disp" style={{ display: "block", fontSize: 26, fontWeight: 600 }}>{v}</b>
              <span style={{ fontSize: 11.5, color: C.ink3 }}>{k}</span>
            </div>
          ))}
        </div>
      </Section>
      <Section eyebrow="ANA-03" title="Seed 적중 범위">
        <Card><div style={{ padding: 17, fontSize: 13.5, color: C.ink2, lineHeight: 2 }}>
          기본 목록에서 나온 일 <b style={{ color: C.ink }}>{cov.system || 0}</b>건<br />
          우리 집 반복 항목 <b style={{ color: C.ink }}>{cov.custom || 0}</b>건<br />
          목록에 없던 새 일 <b style={{ color: C.persim }}>{cov.new || 0}</b>건
          <div style={{ fontSize: 12.5, color: C.ink3, marginTop: 10, lineHeight: 1.7 }}>새 일 비율이 높을수록 기본 목록에 빠진 영역이 많다는 뜻이에요. 베타에서 가장 중요한 숫자입니다.</div>
        </div></Card>
      </Section>
      <Section title="추천 피드백">
        <Card><div style={{ padding: 17, fontSize: 13.5, color: C.ink2 }}>

        </div></Card>
      </Section>
      {(offGroups.length || offSeeds.length) > 0 && (

              <div key={g} className="flex items-center justify-between">

                </div>
              );
            })}
          </div></Card>
        </Section>
      )}
      <p style={{ fontSize: 11.5, color: C.ink3, marginTop: 24, lineHeight: 1.8 }}>

  return (
    <>
      <PageHead title="설정" onBack={() => setTab("home")} backLabel="오늘로 돌아가기" />
      <Section eyebrow="ONB-01" title="함께 챙기는 사람">
        <Card><div style={{ padding: 16 }}>
          {d.members.map((m, i) => (
            <div key={m.id} className="flex items-center gap-3" style={{ marginTop: i ? 10 : 0 }}>
              <Avatar member={{ ...m, name: m.name || "?" }} size={34} />
              <input className="hae" value={m.name} onChange={(e) => setD((s) => ({ ...s, members: s.members.map((x) => x.id === m.id ? { ...x, name: e.target.value } : x) }))} style={inp} />
              <span className="mono" style={{ fontSize: 10, color: C.ink3, whiteSpace: "nowrap" }}>{m.role === "admin" ? "관리자" : "가족"}</span>
            </div>
          ))}
          {d.members.length < 4 && <button className="press w-full" onClick={() => setD((s) => ({ ...s, members: [...s.members, { id: uid("m"), name: "", role: "member", color: MEMBER_COLORS[s.members.length] }] }))}
            style={{ marginTop: 12, background: "none", border: `1px dashed ${C.line}`, borderRadius: 12, padding: "11px 0", fontSize: 13, color: C.ink2 }}>가족 추가</button>}
        </div></Card>
      </Section>

      <Section eyebrow="ONB-02" title="아이">
        <Card><div style={{ padding: 16 }}>
          {d.children.map((c) => (
            <div key={c.id} className="flex items-center gap-2" style={{ marginBottom: 10 }}>
              <input className="hae" value={c.name} onChange={(e) => setD((s) => ({ ...s, children: s.children.map((x) => x.id === c.id ? { ...x, name: e.target.value } : x) }))} style={{ ...inp, width: 72 }} />
              <input className="hae" inputMode="numeric" value={c.value} onChange={(e) => setD((s) => ({ ...s, children: s.children.map((x) => x.id === c.id ? { ...x, value: e.target.value } : x) }))} style={{ ...inp, width: 62 }} />
              <select className="hae" value={c.unit} onChange={(e) => setD((s) => ({ ...s, children: s.children.map((x) => x.id === c.id ? { ...x, unit: e.target.value } : x) }))} style={{ ...inp, flex: 1 }}>
                <option value="week">임신 주수</option><option value="month">개월</option><option value="year">세</option><option value="elem">초등</option><option value="mid">중등</option>
              </select>
              <button onClick={() => setD((s) => ({ ...s, children: s.children.filter((x) => x.id !== c.id) }))} style={{ background: "none", border: "none", color: C.ink3, fontSize: 20 }}>×</button>
            </div>
          ))}
          <button className="press w-full" onClick={() => setD((s) => ({ ...s, children: [...s.children, { id: uid("c"), name: ["첫째", "둘째", "셋째", "넷째"][s.children.length] || "아이", unit: "year", value: "" }] }))}
            style={{ background: "none", border: `1px dashed ${C.line}`, borderRadius: 12, padding: "11px 0", fontSize: 13, color: C.ink2 }}>아이 추가</button>
        </div></Card>
      </Section>

      {/* 접어둔 것을 되돌리는 길이 없으면, 사람들은 아무 버튼도 안 누릅니다.
          한 번 누르면 끝인 버튼은 무서워서 못 누릅니다. */}
      {Object.keys(st.wfOff || {}).length || Object.keys(st.aheadDone || {}).length ? (
        <Section eyebrow="USEFUL" title="접어둔 유용정보"
          right={`${Object.keys(st.wfOff || {}).length + Object.keys(st.aheadDone || {}).length}개`}>
          <Card><div style={{ padding: 16 }}>
            <div style={{ fontSize: 12.5, color: C.ink2, lineHeight: 1.7 }}>
              “해당 없음”이나 “올해 챙김”을 누르신 것들입니다.
              다시 꺼내면 해당되는 때에 또 올라옵니다.
            </div>
            <Btn kind="ghost" style={{ marginTop: 13 }} onClick={() => {
              setSt((sv) => ({ ...sv, wfOff: {}, aheadDone: {} }));
              say("다시 꺼냈습니다");
            }}>다시 꺼내기</Btn>
          </div></Card>
        </Section>
      ) : null}

      <Section eyebrow="DATES" title="가족 생일·기념일·제사">
        <button className="press w-full text-left" onClick={() => setTab("ann")}
          style={{ background: C.card, border: `1px solid ${C.lineSoft}`, borderRadius: R.lg, padding: "15px 17px", boxShadow: SHADOW }}>
          <span className="flex items-center gap-3">
            <span style={{ fontSize: 20 }}>🗓</span>
            <span className="flex-1 min-w-0">
              <span style={{ display: "block", fontSize: 14, fontWeight: 600 }}>경조사 등록하기</span>
              <span style={{ display: "block", fontSize: 12, color: C.ink3, marginTop: 3 }}>생신·기일(음력 포함)·결혼기념일을 날짜로 넣으면 미리 떠요</span>
            </span>
            <span style={{ fontSize: 14, color: C.moss }}>›</span>
          </span>
        </button>
      </Section>

      {FLAG_GROUPS.map((g) => (
        <Section key={g} eyebrow="ONB-03" title={`우리 집 · ${g}`}>
          <Card>
            {Object.keys(FLAGS).filter((k) => FLAGS[k].g === g && (!FLAGS[k].need || d.flags[FLAGS[k].need])).map((k, i, arr) => {
              const on = d.flags[k];
              return (
                <button key={k} className="press flex items-center gap-3 w-full text-left" onClick={() => setD((s) => ({ ...s, flags: { ...s.flags, [k]: !s.flags[k] } }))}
                  style={{ background: on ? C.mossSoft : "transparent", border: "none", borderBottom: i === arr.length - 1 ? "none" : `1px solid ${C.line}`, padding: "13px 15px" }}>
                  <span style={{ fontSize: 18 }}>{FLAGS[k].emoji}</span>
                  <span className="flex-1 min-w-0">
                    <span style={{ display: "block", fontSize: 14.5, fontWeight: 600, color: on ? C.moss : C.ink }}>{FLAGS[k].label}</span>
                    <span style={{ display: "block", fontSize: 12, color: C.ink3, marginTop: 1 }}>{FLAGS[k].desc}</span>
                  </span>
                  <span style={{ width: 21, height: 21, borderRadius: 7, flexShrink: 0, border: `1.5px solid ${on ? C.moss : C.line}`, background: on ? C.moss : "transparent", color: "#fff", fontSize: 12, lineHeight: "19px", textAlign: "center" }}>{on ? "✓" : ""}</span>
                </button>
              );
            })}
          </Card>
        </Section>
      ))}

      {/* 반려동물 종류 — 켜면 그 종류에 맞는 일만 뜹니다 */}
      {d.flags.pet && (
        <Section eyebrow="PET" title="어떤 아이와 사나요?" right="여러 개 고를 수 있어요">
          <Card><div style={{ padding: 15 }}>
            <div className="flex flex-wrap gap-2">
              {Object.keys(PET_TYPES).map((k) => {
                const on = (d.petTypes || {})[k];
                return (
                  <button key={k} className="press" onClick={() => setD((sv) => ({ ...sv, petTypes: { ...(sv.petTypes || {}), [k]: !on } }))}
                    style={{ background: on ? C.mossSoft : C.bg, color: on ? C.moss : C.ink2, border: `1px solid ${on ? C.moss : C.line}`, borderRadius: R.pill, padding: "10px 15px", fontSize: 13, fontWeight: 600 }}>
                    {PET_TYPES[k].emoji} {PET_TYPES[k].label}
                  </button>
                );
              })}
            </div>
            <div style={{ fontSize: 12, color: C.ink3, marginTop: 11, lineHeight: 1.6 }}>
              고양이면 모래, 강아지면 산책·동물등록, 물고기면 물갈이처럼 종류마다 다른 일이 올라옵니다. 아무것도 안 고르면 전부 보여줍니다.
            </div>
          </div></Card>
        </Section>
      )}

      {/* 자동차 — 차마다 종류·검사·보험을 따로 받습니다 */}
      {d.flags.car && (
        <Section eyebrow="CAR" title={carsOf(st).length > 1 ? `자동차 ${carsOf(st).length}대` : "자동차"}
          right="종류에 맞는 항목만 떠요">
          <CarDates />
        </Section>
      )}

      {moveDuty && (() => {
        const who = st.members.find((m) => m.id === moveDuty.to) || {};
        const n = moveDuty.tasks.length + moveDuty.routs.length;
        return (
          <Sheet onClose={() => setMoveDuty(null)}>
            <div className="disp" style={{ fontSize: 20, fontWeight: 600 }}>이미 있는 것도 같이 옮길까요?</div>
            <p style={{ fontSize: 13.5, color: C.ink2, marginTop: 9, lineHeight: 1.7 }}>
              앞으로 <b>{moveDuty.cat.emoji} {moveDuty.cat.label}</b>에 담기는 일은 {who.name} 몫이 됩니다.
              지금 이 영역에 이미 있는 <b>{n}개</b>는 아직 예전 담당자 그대로예요.
            </p>
            <div style={{ marginTop: 14, background: C.bg, borderRadius: R.sm, padding: "12px 14px", fontSize: 12.5, color: C.ink2, lineHeight: 1.75 }}>
              {moveDuty.tasks.length > 0 && <div>담아둔 일 {moveDuty.tasks.length}개 · {moveDuty.tasks.slice(0, 3).map((t) => t.title).join(", ")}{moveDuty.tasks.length > 3 ? " 외" : ""}</div>}
              {moveDuty.routs.length > 0 && <div>정기 일정 {moveDuty.routs.length}개 · {moveDuty.routs.slice(0, 3).map((r) => r.seed.t).join(", ")}{moveDuty.routs.length > 3 ? " 외" : ""}</div>}
            </div>
            <Btn kind="accent" style={{ marginTop: 18 }} onClick={() => {
              setSt((sv) => ({
                ...sv,
                tasks: sv.tasks.map((t) => moveDuty.tasks.some((x) => x.id === t.id) ? { ...t, owner: moveDuty.to } : t),
                routines: moveDuty.routs.reduce((acc, r) => ({ ...acc, [r.key]: { ...(acc[r.key] || {}), owner: moveDuty.to } }), { ...sv.routines }),
              }));
              say(`${n}개를 ${who.name} 몫으로 옮겼어요`);
              setMoveDuty(null);
            }}>{n}개 모두 {who.name} 몫으로</Btn>
            <Btn kind="ghost" onClick={() => setMoveDuty(null)}>앞으로 담기는 것만</Btn>
          </Sheet>
        );
      })()}

      {/* 기본 분담 — 이미 정해져 있는 일은 매번 안 물어봅니다 */}
      {st.members.length > 1 && (
        <Section eyebrow="SHARE" title="기본 분담" right="새로 담기는 일에 자동 적용">
          <Card>
            <div style={{ padding: "13px 15px", fontSize: 12.5, color: C.ink2, lineHeight: 1.65, borderBottom: `1px solid ${C.lineSoft}` }}>
              음식·청소는 한 사람, 화분·쓰레기는 다른 사람처럼 이미 정해진 게 있으면 여기서 한 번만 정해두세요.
              앞으로 그 영역에 담기는 일은 자동으로 그 사람 몫이 됩니다. (개별 항목은 언제든 바꿀 수 있어요)
            </div>
            {cats.map((c, i, arr) => {
              const cur = (st.duty || {})[c.id];
              return (
                <div key={c.id} className="flex items-center gap-2" style={{ padding: "11px 15px", borderBottom: i === arr.length - 1 ? "none" : `1px solid ${C.lineSoft}` }}>
                  <span className="flex-1 min-w-0" style={{ fontSize: 13.5 }}>{c.emoji} {c.label}</span>
                  <div className="flex gap-1.5">
                    {st.members.map((m) => (
                      <button key={m.id} className="press" onClick={() => {
                        const next = cur === m.id ? null : m.id;
                        setSt((sv) => ({ ...sv, duty: { ...(sv.duty || {}), [c.id]: next } }));
                        /* 앞으로 담기는 것만 바뀌므로, 이미 있는 것도 옮길지 물어봅니다 */
                        if (next) {
                          const tasks = st.tasks.filter((t) => !t.done && t.category === c.id && t.owner !== next);
                          const routs = eligibleRoutines(st, true)
                            .filter((r) => (r.child ? `kid:${r.child.id}` : r.seed.cat) === c.id)
                            .filter((r) => { const cfg = st.routines[r.key]; return cfg && cfg.on !== false && cfg.owner !== next; });
                          if (tasks.length + routs.length > 0) setMoveDuty({ cat: c, to: next, tasks, routs });
                        }
                      }}
                        style={{ background: cur === m.id ? m.color : C.bg, color: cur === m.id ? "#fff" : C.ink3, border: `1px solid ${cur === m.id ? m.color : C.line}`, borderRadius: R.pill, padding: "6px 11px", fontSize: 11.5, fontWeight: 600 }}>
                        {m.name}
                      </button>
                    ))}
                  </div>
                </div>
              );
            })}
          </Card>
        </Section>
      )}

      {/* 이번 달 AI 사용량 — 얼마나 썼는지 스스로 보이게 */}
      <Section eyebrow="AI" title="이번 달 AI 사용량" right={!CHARGING() ? (PHASE === "beta" ? "베타" : "무료 기간") : st.plan === "paid" ? "유료" : "무료"}>
        <Card>
          <div style={{ padding: "13px 15px", fontSize: 12.5, color: C.ink2, lineHeight: 1.7, borderBottom: `1px solid ${C.lineSoft}` }}>
            무료로 쓰시는 동안은 한 달에 정해진 횟수만큼 AI가 돕습니다. {nextResetLabel()}에 다시 채워집니다.
            직접 적으시는 건 횟수와 상관없이 언제든 됩니다.
          </div>
          {["talk", "photo", "find"].map((k, i, a) => {
            const used = usedThis(st, k), lim = limitOf(st, k);
            const pct = lim === Infinity ? 0 : Math.min(used / lim, 1);
            return (
              <div key={k} style={{ padding: "13px 15px", borderBottom: i === a.length - 1 ? "none" : `1px solid ${C.lineSoft}` }}>
                <div className="flex items-center justify-between" style={{ marginBottom: 8 }}>
                  <span style={{ fontSize: 13.5 }}>{AI_LABEL[k]}</span>
                  <span style={{ fontSize: 12.5, color: pct >= 1 ? C.persim : C.ink3 }}>
                    {lim === Infinity ? "무제한" : `${used} / ${lim}`}
                  </span>
                </div>
                {lim !== Infinity && (
                  <div style={{ height: 6, borderRadius: 99, background: C.lineSoft, overflow: "hidden" }}>
                    <div style={{ width: `${pct * 100}%`, height: "100%", background: pct >= 1 ? C.persim : C.moss, transition: "width .4s ease" }} />
                  </div>
                )}
              </div>
            );
          })}
        </Card>
      </Section>

      <Section eyebrow="DATA" title="무엇이 남나요">
        <Card><div style={{ padding: "15px 16px", fontSize: 12.5, color: C.ink2, lineHeight: 1.85 }}>
          <div style={{ fontWeight: 600, color: C.ink, marginBottom: 6 }}>남지 않는 것</div>
          말씀하신 <b>원문</b>과 올리신 <b>사진</b>은 저장하지 않습니다.
          사진은 크기를 줄여 AI에 보내고 바로 버립니다.
          <div style={{ fontWeight: 600, color: C.ink, marginTop: 12, marginBottom: 6 }}>남는 것</div>
          서비스 개선을 위해 <b>AI가 정리한 할 일의 제목</b>이 익명으로 수집됩니다.
          (예: “테니스 라켓 구매”) 누가 말했는지는 함께 남기지 않습니다.
          <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 10, lineHeight: 1.7 }}>
            이 기록은 “한국 가정이 실제로 무엇을 챙기는가”를 알아 항목을 넓히는 데만 씁니다.
            광고에 쓰거나 밖으로 팔지 않습니다.
          </div>
        </div></Card>
      </Section>

      <Section eyebrow="NOTIFY" title="알림">
        <PushBox />
      </Section>

      <Section eyebrow="ROUTINE" title="정기 일정 관리" right="영역을 골라 주기를 조정하세요">
        {!routineCat ? (
          <div className="grid grid-cols-2 gap-2.5">
            {routineGroups.map((g) => (
              <button key={g.cid} className="press text-left" onClick={() => setRoutineCat(g.cid)}
                style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 18, padding: 15, boxShadow: SHADOW }}>
                <div style={{ fontSize: 22 }}>{g.emoji}</div>
                <div style={{ fontSize: 14.5, fontWeight: 600, marginTop: 8 }}>{g.label}</div>
                <div className="mono" style={{ fontSize: 10.5, color: g.on ? C.moss : C.ink3, marginTop: 6 }}>{g.on}/{g.items.length} 켜짐</div>
              </button>
            ))}
          </div>
        ) : (() => {
          const g = routineGroups.find((x) => x.cid === routineCat) || routineGroups[0];
          return (
            <>
              {(() => {
                const idx = routineGroups.findIndex((x) => x.cid === g.cid);
                const prev = routineGroups[idx - 1], next = routineGroups[idx + 1];
                return (
                  <div className="flex items-center justify-between" style={{ paddingBottom: 10 }}>
                    <button onClick={() => setRoutineCat(null)} style={{ background: "none", border: "none", color: C.ink2, fontSize: 13, padding: 0 }}>← 전체 영역</button>
                    <span className="mono" style={{ fontSize: 11, color: C.ink3 }}>{idx + 1} / {routineGroups.length}</span>
                  </div>
                );
              })()}
              <div className="flex items-center gap-2" style={{ marginBottom: 10 }}>
                <span style={{ fontSize: 22 }}>{g.emoji}</span>
                <span className="disp" style={{ fontSize: 19, fontWeight: 600, flex: 1 }}>{g.label}</span>
                <button className="press" onClick={() => setSt((sv) => { const ro = { ...sv.routines }; const allOn = g.items.every((r) => (ro[r.key] || {}).on); g.items.forEach((r) => { const d = ro[r.key] || seedCfg(r.seed); ro[r.key] = { ...d, on: !allOn, nextAt: d.nextAt || Date.now() }; }); return { ...sv, routines: ro }; })}
                  style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: 999, padding: "6px 12px", fontSize: 12, color: C.ink2, whiteSpace: "nowrap" }}>
                  {g.items.every((r) => (st.routines[r.key] || {}).on) ? "전부 끄기" : "전부 켜기"}
                </button>
              </div>
              <Card>
                {g.items.map((r, i, arr) => {
                  const cfg = st.routines[r.key] || { on: false, ...seedCfg(r.seed) };
                  return (
                    <div key={r.key} className="flex items-center gap-3" style={{ padding: "13px 15px", borderBottom: i === arr.length - 1 ? "none" : `1px solid ${C.line}`, opacity: cfg.on ? 1 : .4 }}>
                      <span className="flex-1 min-w-0" style={{ fontSize: 14, fontWeight: 500 }}>
                        {r.seed.t}{r.child ? <span style={{ color: C.ink3, fontWeight: 400 }}> · {r.child.name}</span> : null}
                      </span>
                      <button className="press" onClick={() => setPickKey(r.key)}
                        style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: 999, padding: "5px 11px", fontSize: 12, color: C.ink2, whiteSpace: "nowrap" }}>{patternLabel(cfg)}</button>
                      <button className="press" onClick={() => setRoutine(r.key, { ...(st.routines[r.key] ? {} : seedCfg(r.seed)), on: !cfg.on, cycle: cfg.cycle, nextAt: cfg.nextAt || Date.now() })} aria-label="사용 여부"
                        style={{ width: 42, height: 25, borderRadius: 99, border: "none", background: cfg.on ? C.moss : C.line, position: "relative", flexShrink: 0 }}>
                        <span style={{ position: "absolute", top: 3, left: cfg.on ? 20 : 3, width: 19, height: 19, borderRadius: 99, background: "#fff", transition: "left .18s" }} />
                      </button>
                      {r.custom && <button onClick={() => setSt((sv) => ({ ...sv, customRoutines: sv.customRoutines.filter((x) => x.id !== r.seed.id) }))}
                        style={{ background: "none", border: "none", color: C.ink3, fontSize: 17, padding: 0 }}>×</button>}
                    </div>
                  );
                })}
                <div className="flex items-center gap-2" style={{ padding: "12px 15px", borderTop: `1px solid ${C.line}`, background: C.bg }}>
                  <input className="hae" value={newRoutine} onChange={(e) => setNewRoutine(e.target.value)}
                    placeholder="우리 집만의 일 추가"
                    style={{ flex: 1, border: `1px solid ${C.line}`, borderRadius: 10, padding: "9px 11px", fontSize: 13.5, background: C.card, color: C.ink }} />
                  <button className="press" onClick={() => {
                    const title = newRoutine.trim(); if (!title) return;
                    const nid = uid("cr");
                    setSt((sv) => ({
                      ...sv,
                      customRoutines: [...(sv.customRoutines || []), { id: nid, title, category: g.cid, cycle: 7 }],
                      routines: { ...sv.routines, [`c:${nid}`]: { on: true, cycle: 7, nextAt: Date.now() } },
                    }));
                    setNewRoutine(""); say("정기 일정에 넣었어요");
                  }} style={{ background: C.moss, color: "#fff", border: "none", borderRadius: 10, padding: "9px 14px", fontSize: 13, fontWeight: 600, whiteSpace: "nowrap" }}>추가</button>
                </div>
              </Card>
              {(() => {
                const idx = routineGroups.findIndex((x) => x.cid === g.cid);
                const prev = routineGroups[idx - 1], next = routineGroups[idx + 1];
                return (
                  <div className="flex gap-2" style={{ marginTop: 12 }}>
                    <button className="press" disabled={!prev} onClick={() => { setRoutineCat(prev.cid); window.scrollTo({ top: 0, behavior: "smooth" }); }}
                      style={{ flex: 1, background: "transparent", border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 0", fontSize: 12.5, color: prev ? C.ink2 : C.ink3, opacity: prev ? 1 : .4 }}>
                      {prev ? `← ${prev.label}` : "이전 없음"}
                    </button>
                    <button className="press" disabled={!next} onClick={() => { setRoutineCat(next.cid); window.scrollTo({ top: 0, behavior: "smooth" }); }}
                      style={{ flex: 1, background: "transparent", border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 0", fontSize: 12.5, color: next ? C.ink2 : C.ink3, opacity: next ? 1 : .4 }}>
                      {next ? `${next.label} →` : "다음 없음"}
                    </button>
                  </div>
                );
              })()}
            </>
          );
        })()}
        {pickKey && (() => {
          const r = eligibleRoutines(st, true).find((x) => x.key === pickKey);
          const cfg = st.routines[pickKey] || { cycle: cycleToDays(r ? r.seed.cy : "") };
          return <CyclePicker current={cfg.cycle} title={r ? r.seed.t : "주기"} pattern={cfg}
            onPick={(dd) => {
              setRoutine(pickKey, { cycle: dd, on: true, nextAt: nextByPattern({ ...cfg, cycle: dd }) }); setPickKey(null);
              const fixed = dowList(cfg).length || domList(cfg).length;
              say(fixed ? `${cycleLabel(dd)}로 바꿨어요. 다만 아래 요일·날짜 지정이 먼저라 올라오는 날은 그대로예요`
                        : `${cycleLabel(dd)}로 바꿨어요`);
            }}
            onPattern={(p) => {
              setRoutine(pickKey, { ...p, on: true, nextAt: nextByPattern({ ...cfg, ...p }) || cfg.nextAt });
              say(dowList(p).length ? `${dowList(p).map((i) => WEEKDAY[i]).join("·")}요일마다 올립니다`
                : domList(p).length ? `매달 ${domList(p).map(domLabel).join("·")}에 올립니다` : "요일·날짜 지정을 풀었어요");
            }}
            onOff={() => { setRoutine(pickKey, { on: false }); setPickKey(null); }}
            onClose={() => { setRoutine(pickKey, { nextAt: nextByPattern(cfg) || cfg.nextAt }); setPickKey(null); }} />;
        })()}
      </Section>

      {/* 주소가 아니라 시·군·구까지만입니다. 조례를 찾아가는 데는 그거면 되고,
          그 이상은 받아둘 이유가 없습니다. 온보딩에는 안 넣었습니다 —
          안 적어도 앱은 다 돌아가고, 처음에 묻는 게 이미 많습니다. */}
      <Section eyebrow="선택" title="사시는 곳">
        <input className="hae" value={d.region || ""} onChange={(e) => setD((s) => ({ ...s, region: e.target.value }))}
          placeholder={`예: ${(d.place && d.place.label) || "서울"} 강서구`}
          style={{ width: "100%", border: `1px solid ${C.line}`, borderRadius: 14, padding: 13, fontSize: 14.5, background: C.card, color: C.ink }} />
        <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 9, lineHeight: 1.75 }}>
          주차 감면·전기차 보조금처럼 동네마다 다른 건 앱이 답을 말하지 않습니다.
          대신 여기 적어두시면 그 동네 조례로 바로 보냅니다. 시·군·구까지만 받고, 상세 주소는 안 받습니다.
        </div>
      </Section>

      <Section eyebrow="선택" title="더 알려주실 것">
        <textarea className="hae" value={d.extra} onChange={(e) => setD((s) => ({ ...s, extra: e.target.value }))} rows={3}
          placeholder="예: 전세 계약이 내년 봄에 끝나요."
          style={{ width: "100%", border: `1px solid ${C.line}`, borderRadius: 14, padding: 13, fontSize: 14.5, lineHeight: 1.65, resize: "none", background: C.card, color: C.ink }} />
      </Section>

      <div style={{ marginTop: 20 }}>
        <Btn onClick={() => { setSt((s) => ({ ...s, members: d.members.filter((m) => m.name.trim()), children: d.children, flags: d.flags, petTypes: d.petTypes, cars: carsOf(d), carType: d.carType || "ice", extra: d.extra, region: String(d.region || "").trim() })); say("추천을 다시 계산했어요"); setTab("home"); }}>저장하고 추천 다시 계산</Btn>
        <div style={{ height: 8 }} />
        <Btn kind="ghost" onClick={() => setDash(true)}>베타 지표 보기</Btn>
        <div style={{ height: 8 }} />
        {/* 처음 화면은 한 번 지나가면 다시 못 봅니다. 남에게 보내기 전에 확인해야 합니다 */}
        <Btn kind="ghost" onClick={() => { setSt((s2) => ({ ...s2, previewOnboarding: true })); setTab("home"); }}>처음 화면 미리보기</Btn>
        <div style={{ height: 8 }} />
        {/* 이달의 소식은 정보 탭에 있습니다. 설정에도 두면 자리가 둘이 되고,
            둘이 되면 어디로 가야 하는지를 또 외워야 합니다. */}
        {/* 복지를 할 일로 담던 때에 쌓인 것들입니다. 이제는 안 담기지만
            이미 들어간 건 남아 있습니다. 조용히 지우지 않고 눌러서 지우게 합니다 —
            남의 할 일을 앱이 마음대로 지우면 안 됩니다. */}
        {(() => {
          const wfIds = new Set(SEED.filter((x) => x.wf).map((x) => x.id));
          const n = st.tasks.filter((t) => !t.done && wfIds.has(t.seedId)).length;
          if (!n) return null;
          return (
            <Btn kind="ghost" onClick={() => {
              if (!confirm(`복지 항목 ${n}개를 할 일에서 뺄까요? 정보 화면에서는 그대로 보입니다.`)) return;
              setSt((sv) => ({ ...sv, tasks: sv.tasks.filter((t) => t.done || !wfIds.has(t.seedId)) }));
              say(`${n}개를 할 일에서 뺐어요`);
            }}>복지 {n}개를 할 일에서 빼기</Btn>
          );
        })()}
        <div style={{ height: 8 }} />
        {/* 지우기 전에 내려받을 길이 있어야 합니다. 되돌릴 수 없는 버튼 옆에
            백업이 없으면, 그건 버튼이 아니라 함정입니다. */}
        <Btn kind="ghost" onClick={() => {
          try {
            const blob = new Blob([JSON.stringify(st, null, 2)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `먼저ON-백업-${todayStr().replace(/[^0-9]/g, "")}.json`;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 4000);
            say("백업 파일을 내려받았어요");
          } catch { say("이 브라우저에선 내려받기가 안 돼요"); }
        }}>지금 상태 백업 내려받기</Btn>
        <div style={{ height: 8 }} />
        <Btn kind="quiet" onClick={() => {
          if (!confirm("모든 데이터를 지우고 처음부터 시작할까요?\n\n가족 전체의 데이터가 지워지고 되돌릴 수 없습니다.\n먼저 위에서 백업을 내려받으세요.")) return;
          if (!confirm("정말 지울까요? 남편분 화면의 내용도 함께 사라집니다.")) return;
          window.storage.delete("meonjeon").catch(() => {}); setSt(DEFAULT_STATE);
        }}>데이터 전체 삭제</Btn>
      </div>

      <EnvCheck />

      {/* 폰에서 새로고침이 됐는지 확인하는 자리 */}
      <div className="flex items-center justify-between" style={{ marginTop: 26, paddingTop: 16, borderTop: `1px solid ${C.lineSoft}` }}>
        <span className="mono" style={{ fontSize: 10, color: C.ink3, letterSpacing: ".08em" }}>BUILD {BUILD}</span>
        <button className="press" onClick={() => { location.href = location.pathname + "?v=" + Date.now(); }}
          style={{ background: "transparent", border: `1px solid ${C.line}`, borderRadius: 999, padding: "7px 13px", fontSize: 11.5, color: C.ink2 }}>
          최신으로 받기
        </button>
      </div>
    </>
  );
}

/* ── 하단 탭 ──────────────────────────────────── */
function TabBar() {
  const { st, tab, setTab } = use();
  /* 혼자 쓰면 나눌 것이 없습니다. 나눔 탭은 가족이 둘 이상일 때만 */
  const solo = (st.members || []).length < 2;
  const items = [
    { id: "home", label: "오늘", icon: "◉" },
    { id: "cat", label: "영역", icon: "▦" },
    { id: "speak", label: "말하기", icon: "✦", primary: true },
    { id: "meal", label: "식단", icon: "❖" },
    { id: "share", label: "유용정보", icon: "◑" },
  ].filter((it) => !(solo && it.id === "share"));
  return (
    <nav style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 440,
                  background: "rgba(255,255,255,.9)", backdropFilter: "saturate(1.6) blur(16px)", WebkitBackdropFilter: "saturate(1.6) blur(16px)",
                  borderTop: `1px solid ${C.line}`, display: "flex", gap: 2, zIndex: 30, padding: "7px 8px",
                  paddingBottom: "calc(7px + env(safe-area-inset-bottom))" }}>
      {items.map((it) => {
        const on = tab === it.id;
        /* 식단 탭만 초록. 어느 방에 와 있는지 아래에서도 보이게 */
        const ac = it.id === "meal" ? C.leaf : C.moss;
        if (it.primary) return (
          <button key={it.id} className="press flex-1 flex flex-col items-center justify-center" onClick={() => setTab(it.id)}
            style={{ background: "transparent", border: "none", padding: "2px 0", color: on ? ac : C.ink3 }}>
            <span style={{ width: 40, height: 40, borderRadius: 999, background: on ? ac : C.ink, color: "#fff", fontSize: 16,
                           display: "inline-flex", alignItems: "center", justifyContent: "center", boxShadow: SHADOW }}>{it.icon}</span>
            <span style={{ fontSize: 10.5, marginTop: 3, fontWeight: on ? 600 : 400 }}>{it.label}</span>
          </button>
        );
        return (
          <button key={it.id} className="press flex-1 flex flex-col items-center" onClick={() => setTab(it.id)}
            style={{ background: "transparent", border: "none", borderRadius: R.sm, padding: "7px 0", color: on ? ac : C.ink3 }}>
            <span style={{ position: "relative", fontSize: 15, lineHeight: "20px" }}>
              {it.icon}
              {it.badge ? <span className="mono" style={{ position: "absolute", top: -3, right: -12, minWidth: 15, height: 15, borderRadius: 99, background: C.persim, color: "#fff", fontSize: 9, lineHeight: "15px", padding: "0 4px" }}>{it.badge}</span> : null}
            </span>
            <span style={{ fontSize: 10.5, marginTop: 3, fontWeight: on ? 600 : 400 }}>{it.label}</span>
          </button>
        );
      })}
    </nav>
  );
}


window.startApp = () => ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
