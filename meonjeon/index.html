                  </p>
                : !!rows.length && (
                  /* 칸이 비었는데 요일을 고르셨습니다. 새로 넣을 것이 아니라
                     여기 있는 것을 저 요일에도 두시겠다는 뜻입니다. */
                  <div style={{ marginTop: 8, background: C.mossSoft, borderRadius: 12, padding: "11px 13px" }}>
                    <div style={{ fontSize: 12, color: C.ink2, lineHeight: 1.7, marginBottom: 8 }}>
                      새로 넣을 것을 안 적으셨어요. <b style={{ color: C.ink }}>여기 있는 {rows.length}개를
                      {" " + alsoDows.map((d) => DOW_KR[Number(d)]).join("·")}요일에도</b> 두시려는 거라면 —
                    </div>
                    <button className="press" onClick={() => {
                      const 간곳 = [];
                      alsoDows.forEach((d) => { if (copyTo(d)) 간곳.push(DOW_KR[Number(d)]); });
                      if (!간곳.length) return;
                      setAlsoDows([]);
                      say(`${간곳.join("·")}요일에 ${rows.length}개 넣었습니다`);
                    }}
                      style={{ width: "100%", background: C.moss, color: "#fff", border: "none",
                               borderRadius: 10, padding: "10px 0", fontSize: 13, fontWeight: 600 }}>
                      {DOW_KR[Number(dow)]}요일 {rows.length}개를 {alsoDows.map((d) => DOW_KR[Number(d)]).join("·")}요일로 그대로 옮기기
                    </button>
                  </div>
                ))}
              <p style={{ fontSize: 11.5, color: C.ink3, marginTop: 10, lineHeight: 1.7 }}>
                여기 넣은 정기일정은 <b style={{ color: C.ink2 }}>따로 전화하지 않습니다.</b> 아침 문자 한 통에 담기거나(설정) 아예 안 갑니다.
                달라지는 날만 <b style={{ color: C.ink2 }}>말하기</b>로 말씀하시면 그것이 전화로 갑니다.
              </p>
            </>
          )}

          {kind === "med" && (
            <>
              <div className="flex gap-1.5" style={{ flexWrap: "wrap", marginBottom: 8 }}>
                {MED_WHEN.map((w) => (
                  <button key={w} className="press" onClick={() => setMed((m) => ({ ...m, when: w }))}
                    style={{ padding: "6px 11px", borderRadius: 999, fontSize: 12,
                             border: `1px solid ${med.when === w ? C.moss : C.line}`,
                             background: med.when === w ? C.mossSoft : "transparent",
                             color: med.when === w ? C.moss : C.ink3 }}>{w}</button>
                ))}
              </div>
              {med.when === "정한 시각에" && (
                <input style={{ ...inp, width: 100, marginBottom: 8 }} placeholder="13:00" value={time}
                  onChange={(e) => setTime(e.target.value.slice(0, 5))} />
              )}
              {med.how !== MED_BAG && (
                <>
                  <div className="grid grid-cols-2 gap-2">
                    <input style={inp} placeholder="약 이름 (예: 시럽)" value={med.name}
                      onChange={(e) => setMed((m) => ({ ...m, name: e.target.value.slice(0, 16) }))} />
                    <input style={inp} placeholder="용량 (예: 5ml, 반 알)" value={med.dose}
                      onChange={(e) => setMed((m) => ({ ...m, dose: e.target.value.slice(0, 12) }))} />
                  </div>
                  {/* 하루 몇 번인지가 없으면 어른은 한 번만 드리고 마십니다. 선택입니다 —
                      "아침 먹고"만으로 충분한 약도 있습니다. */}
                  <input style={{ ...inp, marginTop: 8 }} placeholder="하루 몇 번 (예: 하루 2번, 8시간마다) — 선택"
                    value={med.times} onChange={(e) => setMed((m) => ({ ...m, times: e.target.value.slice(0, 14) }))} />
                </>
              )}
              {med.how === MED_BAG && (
                <p style={{ fontSize: 12, color: C.ink3, lineHeight: 1.75 }}>
                  <b style={{ color: C.ink2 }}>이름도 용량도 안 적으셔도 됩니다.</b>
                  전날 봉투에 담아두시면 어른은 꺼내 드리기만 하시면 돼요.
                  병명이나 약 이름이 스피커폰으로 새어나갈 일도 없습니다.
                </p>
              )}
              <div className="flex gap-1.5" style={{ flexWrap: "wrap", marginTop: 8 }}>
                {MED_HOW.map((h) => (
                  <button key={h} className="press" onClick={() => setMed((m) => ({ ...m, how: h }))}
                    style={{ padding: "6px 11px", borderRadius: 999, fontSize: 12,
                             border: `1px solid ${med.how === h ? C.moss : C.line}`,
                             background: med.how === h ? C.mossSoft : "transparent",
                             color: med.how === h ? C.moss : C.ink3 }}>{h}</button>
                ))}
              </div>
              <p style={{ fontSize: 12, color: C.ink3, marginTop: 10, lineHeight: 1.7 }}>
                이렇게 읽어드립니다 — “{medLine({ ...med, name: med.name || "○○" }) || "…"}”<br />
                <b style={{ color: C.ink2 }}>밥에 붙은 약은 따로 전화하지 않습니다.</b>
                어른이 밥을 챙기시니 약도 그때 하십니다. 아침 통화에 같이 실립니다.
              </p>
              <Btn kind="accent" onClick={add} style={{ marginTop: 10, padding: "12px 0", fontSize: 14 }}>넣기</Btn>
            </>
          )}

          {kind === "bag" && (
            <>
              <div className="flex gap-2">
                <input style={inp} placeholder="물통, 체육복" value={what}
                  onChange={(e) => setWhat(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") add(); }} />
                <button className="press" onClick={add}
                  style={{ flexShrink: 0, padding: "0 16px", borderRadius: 12, background: C.moss, color: "#fff", border: "none", fontSize: 14, fontWeight: 600 }}>넣기</button>
              </div>
              <p style={{ fontSize: 12, color: C.ink3, marginTop: 10, lineHeight: 1.7 }}>
                이렇게 읽어드립니다 — “{what || "물통"} 가방에 챙겨뒀어요. 현관에 두겠습니다.”<br />
                <b style={{ color: C.ink2 }}>어른께 챙기시라고 하지 않습니다.</b>
                준비물은 전날 부모가 챙기는 게 맞고, 어른께는 챙겨뒀다는 것만 알려드립니다.
              </p>
            </>
          )}

        </div>

        {rows.length > 0 && (
          <div className="flex items-center gap-1.5" style={{ marginTop: 12, flexWrap: "wrap" }}>
            <span style={{ fontSize: 11.5, color: C.ink3 }}>
              여기 <b style={{ color: C.ink2 }}>{rows.length}개</b>를 그대로 옮기기 →</span>
            {["1", "2", "3", "4", "5"].filter((d) => d !== dow).map((d) => (
              <button key={d} className="press" onClick={() => {
                if (!copyTo(d)) return;
                setDow(d); say(`${DOW_KR[Number(d)]}요일에 ${rows.length}개 넣었습니다`);
              }}
                style={{ padding: "5px 11px", borderRadius: 999, border: `1px solid ${C.line}`, background: "transparent", fontSize: 11.5, color: C.ink2 }}>
                {DOW_KR[Number(d)]}
              </button>
            ))}
          </div>
        )}
      </Section>

      {/* 줄을 눌러 고치는 서랍. 계획을 고치는 것이라 여기 있어야 합니다 */}
      {rowEdit && rowOf(rowEdit) && (() => {
        const r = rowOf(rowEdit);
        const 시각있 = r.kind !== "bag" && r.kind !== "med";
        return (
          <Sheet onClose={() => setRowEdit(null)}>
            <div className="disp" style={{ fontSize: 19, fontWeight: 600 }}>이 줄 고치기</div>
            <div style={{ fontSize: 12, color: C.ink3, marginTop: 5 }}>
              {오늘만인가(rowEdit)
                ? <>{날짜말(dayOfAdd(rowEdit))}만 {((st.elders || [])[0] || {}).label || "어른"}께 갑니다 — 매주 되풀이되지 않습니다</>
                : <>{DOW_KR[Number(dow)]}요일마다 {((st.elders || [])[0] || {}).label || "어른"}께 갑니다</>}
            </div>

            {/* "카레 데워주기"가 약으로 잘못 담긴 걸 부모가 여기서 직접 고칠 길이 없었습니다.
                말로 다시 담으면 지금 프롬프트로는 일정이 되지만, 이미 담긴 줄은 그대로 약인 채
                남아 있었습니다. 빼고 다시 넣지 않아도 여기서 바로 갈래를 바꿉니다. */}
            <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 16 }}>갈래</div>
            <div className="flex gap-1.5" style={{ marginTop: 8 }}>
              {[["sked", "일정"], ["med", "약"], ["bag", "준비물"]].map(([k, lab]) => (
                <button key={k} className="press" onClick={() => patchRow(r.id, { kind: k })}
                  style={{ flex: 1, padding: "9px 0", borderRadius: 999, fontSize: 13, fontWeight: r.kind === k ? 600 : 400,
                           border: `1px solid ${r.kind === k ? C.moss : C.line}`,
                           background: r.kind === k ? C.mossSoft : "transparent", color: r.kind === k ? C.moss : C.ink2 }}>{lab}</button>
              ))}
            </div>

            {시각있 && <>
              <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 16 }}>몇 시</div>
              <input className="hae" value={r.time || ""} placeholder="1430 또는 14:30"
                onChange={(e) => patchRow(r.id, { time: e.target.value.slice(0, 8) })}
                onBlur={(e) => patchRow(r.id, { time: toTime(e.target.value) || r.time })}
                style={{ width: "100%", marginTop: 8, border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 13px", fontSize: 15, background: C.bg, color: C.ink }} />
            </>}

            <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 14 }}>무엇을</div>
            <input className="hae" value={r.what || ""}
              onChange={(e) => patchRow(r.id, { what: e.target.value.slice(0, 30) })}
              onBlur={(e) => patchRow(r.id, { what: callSpace(e.target.value) })}
              style={{ width: "100%", marginTop: 8, border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 13px", fontSize: 15, background: C.bg, color: C.ink }} />

            {/^.*(병원|의원|치과|소아과|한의원|검진|보건소).*$/.test(r.what || "") && <>
              <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 14 }}>왜 가는지</div>
              <input className="hae" value={r.why || ""} placeholder="예: 어금니 왼쪽 아래 충치"
                onChange={(e) => patchRow(r.id, { why: e.target.value.slice(0, 60) })}
                style={{ width: "100%", marginTop: 8, border: `1px solid ${C.line}`, borderRadius: 12, padding: "11px 13px", fontSize: 14, background: C.bg, color: C.ink }} />
            </>}

            {(st.children || []).length > 1 && <>
              <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 16 }}>누구</div>
              <div className="flex gap-1.5" style={{ marginTop: 8, flexWrap: "wrap" }}>
                {(st.children || []).map((k) => (
                  <button key={k.id} className="press" onClick={() => patchRow(r.id, { kid: k.id })}
                    style={{ padding: "8px 14px", borderRadius: 999, fontSize: 13,
                             border: `1px solid ${r.kid === k.id ? C.moss : C.line}`,
                             background: r.kid === k.id ? C.mossSoft : "transparent",
                             color: r.kid === k.id ? C.moss : C.ink2 }}>{k.name || "아이"}</button>
                ))}
              </div>
            </>}

            {/* 정기일정에는 없습니다 — 전화하지 않으니까요. 그날 것에만 */}
            {!오늘만인가(rowEdit) && (
              <p style={{ fontSize: 12, color: C.ink3, marginTop: 16, lineHeight: 1.7 }}>
                정기일정은 따로 전화하지 않습니다. 이날만 달라지면 <b style={{ color: C.ink2 }}>말하기</b>로 말씀해주세요 — 그것이 전화로 갑니다.
              </p>
            )}
            {오늘만인가(rowEdit) && <>
            <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 16 }}>어떻게 갈까요</div>
            <div className="flex gap-1.5" style={{ marginTop: 8, flexWrap: "wrap" }}>
              {wayOptions(rowWay(st, r)).map(([v, lb]) => {
                const on = rowWay(st, r) === v;
                return (
                  <button key={v} className="press" onClick={() => patchRow(r.id, { way: v })}
                    style={{ padding: "9px 15px", borderRadius: 999, fontSize: 13, fontWeight: on ? 600 : 400,
                             border: `1px solid ${on ? C.moss : C.line}`,
                             background: on ? C.mossSoft : "transparent", color: on ? C.moss : C.ink2 }}>{lb}</button>
                );
              })}
            </div>

            {시각있 && (
              <>
                <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 16 }}>언제 알릴까요</div>
                <div className="flex gap-1.5" style={{ marginTop: 8, flexWrap: "wrap" }}>
                  {CALL_LEADS.map((n) => {
                    const on = rowLead(r) === n;
                    return (
                      <button key={n} className="press" onClick={() => patchRow(r.id, { lead: n })}
                        style={{ padding: "9px 15px", borderRadius: 999, fontSize: 13, fontWeight: on ? 600 : 400,
                                 border: `1px solid ${on ? C.moss : C.line}`,
                                 background: on ? C.mossSoft : "transparent", color: on ? C.moss : C.ink2 }}>
                        {n ? `${n}분 전` : "정시"}
                      </button>
                    );
                  })}
                </div>
              </>
            )}
            </>}

            <Btn onClick={() => setRowEdit(null)} style={{ marginTop: 20 }}>확인</Btn>
            <Btn kind="quiet" onClick={() => { del(r.id); setRowEdit(null); say("뺐어요"); }}>이 줄 빼기</Btn>
          </Sheet>
        );
      })()}
    </>
  );
}


/* ── 조부모님 탭 ────────────────────────────────────────
   이 화면은 조부모님이 보신다고 치고 만들었습니다.
   앱 알림으로 받기로 하신 집에서는 어른이 직접 여기를 여십니다.
   그래서 누를 것을 두지 않았고, 글씨를 키웠습니다.
   부모가 고칠 것은 전부 부모님 탭에 있습니다. */
function ElderScreen() {
  const { st, setTab } = use();
  const lab = ((st.elders || [])[0] || {}).label || "어른";
  /* 다음 전화 날(아침 통이 지나면 내일)을 보여주고 있었습니다. 앱으로 보시는 어른께는
     "오늘 뭐 하나"가 필요합니다 — 내일 것이 크게 떠 있으면 오늘 것을 오늘로 아십니다. */
  const day = todayKey();
  const 오늘 = true;
  const d = new Date(day);
  const 날 = `${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW_KR[d.getDay()]}요일`;
  const off = ((st.callToday || {})[day] || {}).off;
  const byApp = elderByApp(st);
  const batches = callBatches(st, day).map((b) => ({
    ...b,
    text: (b.sms || b.app) ? smsText(st, day, b.rows) : callScript(st, day, b.rows),
  }));
  /* 시각이 있는 것만 차례로. 시각 없는 것은 아침 통에 실려 갑니다 */
  const 할일 = callAllFor(st, day)
    .filter((r) => !r.skip)
    .slice()
    .sort((a, b) => String(a.time || "99:99").localeCompare(String(b.time || "99:99")));

  const 이름 = (kid) => ((st.children || []).find((c) => c.id === kid) || {}).name || "";
  const 하나 = (st.children || []).length <= 1;

  return (
    /* 아이콘의 수화기 색이 민트입니다. 전화가 나가는 화면이라 여기를 그 색으로 둡니다 */
    <div style={{ "--ac": C.sea, paddingBottom: 30 }}>
      <div style={{ marginTop: 22 }}>
        <div className="mono" style={{ fontSize: 12, color: C.sea, letterSpacing: ".08em" }}>
          {오늘 ? "오늘" : "다음"}
        </div>
        <h1 className="disp" style={{ fontSize: 27, fontWeight: 600, letterSpacing: "-.02em", marginTop: 6, lineHeight: 1.35 }}>
          {날}
        </h1>
        <p style={{ fontSize: 15, color: C.ink2, marginTop: 9, lineHeight: 1.75 }}>
          {lab}께 <b style={{ color: C.ink }}>{할일.length}가지</b>를 알려드립니다.
        </p>
      </div>

      {off ? (
        <Card style={{ marginTop: 20, borderColor: C.persim }}>
          <div style={{ padding: "20px 18px", fontSize: 18, color: C.persim, lineHeight: 1.7 }}>
            이 날은 <b>쉬는 날</b>입니다.<br />아무것도 안 나갑니다.
          </div>
        </Card>
      ) : (
        <>
          {/* 실제로 읽힐 말. 제일 위, 제일 크게 */}
          {batches.map((b, i) => (
            <Card key={b.at + i} style={{ marginTop: i ? 12 : 20, borderColor: C.sea }}>
              <div style={{ padding: "18px 18px 20px" }}>
                <div className="mono" style={{ fontSize: 13, color: C.sea, letterSpacing: ".06em", marginBottom: 10 }}>
                  {b.at} · {b.app ? "앱 알림" : b.sms ? "문자" : "전화"}
                </div>
                <div style={{ fontSize: 19, lineHeight: 1.9, color: C.ink, whiteSpace: (b.sms || b.app) ? "pre-wrap" : "normal" }}>
                  {b.text}
                </div>
              </div>
            </Card>
          ))}

          <div className="mono" style={{ fontSize: 11, color: C.ink3, letterSpacing: ".1em", marginTop: 30, marginBottom: 10 }}>
            {lab} 할 일
          </div>
          <Card>
            <div style={{ padding: "6px 18px" }}>
              {할일.length === 0 && (
                <div style={{ padding: "18px 0", fontSize: 17, color: C.ink3, lineHeight: 1.7 }}>
                  이 날은 알려드릴 것이 없습니다.
                </div>
              )}
              {할일.map((r, i, a) => (
                <div key={r.id} style={{ display: "grid", gridTemplateColumns: "64px 1fr", gap: 14,
                                         padding: "16px 0", borderBottom: i === a.length - 1 ? "none" : `1px solid ${C.lineSoft}` }}>
                  <span className="mono" style={{ fontSize: 16, color: C.sea, paddingTop: 2 }}>{r.time || "—"}</span>
                  <div>
                    <div style={{ fontSize: 18, lineHeight: 1.5, color: C.ink }}>
                      {!하나 && 이름(r.kid) ? <span style={{ color: C.ink2 }}>{이름(r.kid)} </span> : null}
                      {callSpace(r.what)}
                    </div>
                    {r.why ? <div style={{ fontSize: 15, color: C.ink2, marginTop: 5, lineHeight: 1.6 }}>{String(r.why).trim()} 때문이에요</div> : null}
                  </div>
                </div>
              ))}
            </div>
          </Card>
        </>
      )}

      {/* 부모가 잘못 들어왔을 때만 나가는 길. 어른께는 누를 일이 없습니다 */}
      <button className="press" onClick={() => setTab("script")}
        style={{ display: "block", width: "100%", marginTop: 26, background: "transparent",
                 border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "12px 0",
                 fontSize: 13, color: C.ink3 }}>
        고치려면 · 문구 탭
      </button>
    </div>
  );
}

function CallPreview() {
  const { st, setSt, say, setTab, log } = use();
  /* 앱을 열면 다음 전화 날의 요일부터 보입니다 — 예전과 같은 화면입니다.
     요일을 바꾸면 미리보기도 따라갑니다. */
  /* 병원에 왜 가는지. 어른이 접수대에서 말씀하셔야 합니다 */
  const inp = { border: `1px solid ${C.line}`, borderRadius: 12, padding: "11px 12px", fontSize: 14.5, background: C.bg, color: C.ink, width: "100%" };
  const elder = (st.elders || [])[0] || { label: "", phone: "" };
  /* rows 는 요일 편집기로 갔습니다 */
  const 다음전화 = nextCallDay(st);
  /* 보고 있는 요일이 아니라 늘 다음 전화 날을 보여줍니다 —
     요일 계획은 이제 부모님 탭에 있습니다 */
  const day = 다음전화;
  const tomorrow = day > todayKey();
  /* 무슨 날을 보고 있는지 제목에 그대로 씁니다 */
  const dayLabel = day === todayKey() ? "오늘"
    : day === todayKey() + DAY ? "내일"
    : `${new Date(day).getMonth() + 1}월 ${new Date(day).getDate()}일`;
  const byApp = elderByApp(st);
  const bySms = elderBySms(st);
  const batches = callBatches(st, day).map((b) => {
    if (b.app) {
      /* 앱 알림은 값이 안 듭니다. 대신 어른이 앱을 안 보시면 조용히 안 갑니다 */
      const text = smsText(st, day, b.rows);
      return { ...b, text, cost: { sec: 0, won: 0, bytes: 0 } };
    }
    if (b.sms) {
      const text = smsText(st, day, b.rows);
      const c = smsCost(text);
      return { ...b, text, cost: { sec: 0, won: byApp ? 0 : c.won, bytes: c.bytes, long: c.long } };
    }
    const text = callScript(st, day, b.rows);
    return { ...b, text, cost: callCost(text, byApp) };
  });
  const dayWon = batches.reduce((a, b) => a + b.cost.won, 0);
  const dropped = callDropped(st, day);
  const callN = batches.filter((b) => !b.sms && !b.app).length;
  const smsN = batches.filter((b) => b.sms).length;
  const appN = batches.filter((b) => b.app).length;

  /* 호칭·번호 입력이 여기 있었습니다. 설정으로 옮기고, 여기서는 이번에 누구께 갈지만 고릅니다.
     고르면 그분을 맨 앞으로 — 서버와 화면 스물 몇 곳이 elders[0] 을 보기 때문에 자리를 바꾸는 게 제일 안전합니다. */
  const pickElder = (id) => setSt((sv) => {
    const list = (sv.elders || []).slice();
    const k = list.findIndex((e) => e.id === id);
    if (k <= 0) return sv;
    const [e] = list.splice(k, 1);
    return { ...sv, elders: [e, ...list] };
  });

  /* 넣을 때 고른 요일들. 비어 있으면 지금 보고 있는 요일에만 넣습니다.
     피아노가 월·수·금이면 세 번 넣게 하지 않습니다. */

  return (
    <div style={{ "--ac": C.moss }}>
      <div className="mono" style={{ fontSize: 10.5, color: C.moss, letterSpacing: ".1em", marginTop: 30 }}>어른 설정</div>
      <p style={{ fontSize: 12.5, color: C.ink3, marginTop: 7, lineHeight: 1.75 }}>
        매일 아침 부모가 보내는 것이 아니라 정해진 시각에 앱이 겁니다. 나갈 말은 <b style={{ color: C.ink2 }}>전날 저녁에</b> 만들어져요 —
        급히 바뀐 건 <b style={{ color: C.ink2 }}>말하기</b>로.
      </p>

      <Section eyebrow="CALL-01" title="어느 분께 걸까요">
        {(st.elders || []).length === 0 ? (
          <button className="press w-full" onClick={() => setTab("set")}
            style={{ background: "transparent", border: `1px dashed ${C.line}`, borderRadius: 12, padding: "12px 0", fontSize: 13, color: C.ink2 }}>
            설정에서 어른을 먼저 넣어주세요
          </button>
        ) : (
          <div className="flex gap-1.5" style={{ flexWrap: "wrap" }}>
            {(st.elders || []).map((e, i) => (
              <button key={e.id || i} className="press" onClick={() => pickElder(e.id)}
                style={{ padding: "9px 15px", borderRadius: 999, fontSize: 13.5, fontWeight: i === 0 ? 600 : 400,
                         border: `1px solid ${i === 0 ? C.moss : C.line}`,
                         background: i === 0 ? C.mossSoft : "transparent", color: i === 0 ? C.moss : C.ink3 }}>
                {e.label || "어른"}{e.phone ? <span className="mono" style={{ fontSize: 10.5, marginLeft: 6, opacity: .75 }}>{String(e.phone).slice(-4)}</span> : null}
              </button>
            ))}
            <button className="press" onClick={() => setTab("set")}
              style={{ padding: "9px 13px", borderRadius: 999, fontSize: 12.5, border: `1px dashed ${C.line}`, background: "transparent", color: C.ink3 }}>
              + 다른 분
            </button>
          </div>
        )}
        <p style={{ fontSize: 12, color: C.ink3, marginTop: 8, lineHeight: 1.7 }}>
          호칭·번호·받는 방법은 <b style={{ color: C.ink2 }}>설정</b>에서 고칩니다. 여기서는 이번에 받으실 분만 고르세요.
        </p>
        <p style={{ fontSize: 12, color: C.ink3, marginTop: 8, lineHeight: 1.75 }}>
          정기일정은 따로 전화하지 않습니다 — 아침 문자 한 통에 담기거나 아예 안 갑니다(설정).
          <b style={{ color: C.ink2 }}>말하기로 말씀하신 것</b>만 전화로 갑니다. 전화·문자, 몇 분 전은 일정 탭에서 그 줄을 눌러 고칩니다.
        </p>
        {/* 아침 문자 시각은 설정 "아침 알림"에 있습니다 */}
        {/* "어른 폰에 이 번호를 저장해드려야 합니다" 상자가 여기 있었습니다.
            온보딩 3단계 "시작 전에 꼭 하실 것"에 같은 말이 있어서 거기 한 곳에만 둡니다.
            매일 보는 화면에 경고가 붙어 있으면 며칠 뒤엔 안 읽힙니다. */}
      </Section>



      {/* 그날 나갈 말은 조부모님 탭에 있습니다. 여기 또 두면 같은 것이 두 군데가 됩니다.
          부모가 바꾸실 일은 위 요일 계획에서 그 요일을 골라 손보시는 것입니다.
          다만 "나에게 미리 알려주기"는 부모 것이라 여기 남습니다. */}
      {/* 쉬는 날로 해둔 것을 되돌릴 길이 없으면, 잘못 껐을 때 그날 하원을 아무도 안 갑니다 */}
      {/* 조부모님 탭은 이제 늘 "오늘"만 보여줍니다(어른이 실제로 보시는 화면이라).
          그런데 나갈 말은 전날 저녁에 만들어지고, 부모는 저녁에 "내일" 것을 확인해야 합니다.
          내일 문구를 볼 곳이 없어졌던 이유입니다 — 여기, 부모 탭에 그 문구를 그대로 둡니다. */}
      <Section eyebrow="CALL-03" title={`${dayLabel} 이렇게 갑니다`}
        right={tomorrow ? "전날 저녁 확인용" : null}>
        {((st.callToday || {})[day] || {}).off ? (
          <div style={{ fontSize: 13, color: C.ink3, padding: "4px 0 2px" }}>{dayLabel}은 쉬는 날이라 안 나갑니다.</div>
        ) : batches.length === 0 ? (
          <div style={{ fontSize: 13, color: C.ink3, padding: "4px 0 2px" }}>{dayLabel}은 알려드릴 것이 없습니다.</div>
        ) : (
          batches.map((b, i) => (
            <Card key={b.at + i} style={{ marginTop: i ? 8 : 0 }}>
              <div style={{ padding: "12px 14px" }}>
                <div className="mono" style={{ fontSize: 11.5, color: C.moss, letterSpacing: ".05em", marginBottom: 6 }}>
                  {b.at} · {b.app ? "앱 알림" : b.sms ? "문자" : "전화"}
                </div>
                <div style={{ fontSize: 13.5, lineHeight: 1.75, color: C.ink, whiteSpace: (b.sms || b.app) ? "pre-wrap" : "normal" }}>
                  {b.text}
                </div>
              </div>
            </Card>
          ))
        )}
      </Section>

      <Section eyebrow="CALL-04" title={`${dayLabel} 어떻게 할까요`}>
        {((st.callToday || {})[day] || {}).off ? (
          <div style={{ background: C.persimSoft, borderRadius: 12, padding: "13px 15px", fontSize: 13, color: C.persim, lineHeight: 1.75 }}>
            <b>{dayLabel}은 쉬는 날로 해두셨습니다.</b> 아무것도 안 나갑니다.
            <button className="press" onClick={() => setSt((sv) => {
              const t = { ...(sv.callToday || {}) }; t[day] = { ...(t[day] || {}), off: false };
              return { ...sv, callToday: t };
            })} style={{ display: "block", marginTop: 9, background: "transparent", border: `1px solid ${C.persim}`,
                         borderRadius: R.pill, padding: "7px 14px", fontSize: 12.5, color: C.persim }}>다시 켜기</button>
          </div>
        ) : (
          <button className="press" onClick={() => setSt((sv) => {
            const t = { ...(sv.callToday || {}) }; t[day] = { ...(t[day] || {}), off: true };
            return { ...sv, callToday: t };
          })} style={{ background: "transparent", border: `1px solid ${C.line}`, borderRadius: R.pill,
                       padding: "8px 14px", fontSize: 12.5, color: C.ink3 }}>
            {dayLabel}은 안 맡겨요 — 아무것도 안 보내기
          </button>
        )}
        {/* 예산에 걸려 빠진 것은 반드시 말해야 합니다. 조용히 빠지는 게 제일 나쁜 실패입니다 */}
        {dropped.length > 0 && (
          <div style={{ marginTop: 12, background: C.sunSoft, borderRadius: 12, padding: "12px 14px", fontSize: 12.5, color: C.sun, lineHeight: 1.75 }}>
            <b>{dropped.length}개는 안 나갑니다.</b> 하루에 걸 수 있는 통 수를 넘었어요 —
            {dropped.map((r) => callWhat(r.what)).slice(0, 3).join(" · ")}
            {dropped.length > 3 ? ` 외 ${dropped.length - 3}개` : ""}.<br />
            설정에서 하루 통 수를 늘리시거나, 위 요일 계획에서 몇 개를 빼주세요.
          </div>
        )}
      </Section>

      {/* "나에게 확인 알림"(전날 저녁·아침)이 여기 있었습니다. 아침 알림은 종이 메모를 대신하는
          기본 서비스라, 어른께 가는 아침 알림과 함께 설정 "아침 알림" 한 곳에 둡니다. */}

      {/* 줄 하나 고치기 — 시각·이름·갈래를 한 화면에서. 전에는 갈래만
          글자 눌러 돌릴 수 있었고, 시각과 이름은 빼고 다시 넣어야 했습니다. */}
    </div>
  );
}

function Settings() {
  const [dev, setDev] = useState(false);   /* BUILD 줄을 누르면 만드는 사람용 버튼이 나옵니다 */
  const { st, setSt, say, setTab } = use();
  const [d, setD] = useState(st);
  /* 저장 버튼이 맨 아래에만 있어서, 편집 중에 바닥 탭(부모님·말하기·조부모님)이나
     헤더 ✕를 눌러 나가면 아무 것도 안 남고 리셋됐습니다. 저장은 "누르는 것"이 아니라
     "나가면 저절로 되는 것"이어야 합니다 — 나가는 길이 몇 개든 다 저장돼야 하니까요.
     dRef 는 언마운트 시점에도 최신 값을 보려고 둡니다(클로저가 첫 렌더의 d를 붙잡지 않게). */
  const dRef = useRef(d);
  useEffect(() => { dRef.current = d; }, [d]);

        사진(알림장)은 크기를 줄여 AI에 보내고 앱에는 저장하지 않습니다. 뽑아낸 일정만 남습니다.

              <input className="hae" inputMode="numeric" placeholder="나이" value={c.age || ""} onChange={(e) => setD((s) => ({ ...s, children: s.children.map((x) => x.id === c.id ? { ...x, age: e.target.value.replace(/\D/g, "").slice(0, 2) } : x) }))} style={{ ...inp, width: 62 }} />

                  <b style={{ color: C.ink2 }}> 열몇 배 쌉니다.</b> 하원처럼 시각이 중요한 건 그때그때
                  <b style={{ color: C.ink2 }}> 일정 탭</b>에서 그 줄만 전화로 바꾸시면 됩니다.</>

          {routineOut(d) === "sms" && (
            <div className="flex items-center gap-2.5" style={{ marginTop: 10, flexWrap: "wrap" }}>
              <span style={{ fontSize: 13, color: C.ink2, flexShrink: 0 }}>매일</span>
              <input className="hae" style={{ ...inp, width: 86, padding: "8px 10px", fontSize: 13.5, textAlign: "center" }} value={d.callAt || "07:50"}
                onChange={(e) => setD((v) => ({ ...v, callAt: e.target.value.slice(0, 5) }))}
                onBlur={(e) => setD((v) => ({ ...v, callAt: toTime(e.target.value) || "07:50" }))} />
              <span style={{ fontSize: 13, color: C.ink2 }}>에 그날 정기일정을 모아 문자로</span>
            </div>
          )}
          <p style={{ fontSize: 12, color: C.ink3, marginTop: 8, lineHeight: 1.75 }}>
            {routineOut(d) === "sms"
              ? <>냉장고에 붙이던 종이 메모 대신입니다. 한 통 20원이고, 남아 있어서 필요할 때 보십니다.</>
              : <>정기일정은 어른이 곧 외우십니다. 아무것도 안 보내고, 달라지는 날만 전화로 갑니다.</>}
            {" "}<b style={{ color: C.ink2 }}>말하기</b>로 말씀하신 것(그날 것)은 이 설정과 상관없이 전화로 갑니다.
          </p>

          {/* 복직 첫 2주 — 아직 못 외우신 동안만 정기일정도 전화 */}
          {(() => {
            const until = Number(d.routineCallUntil || 0);
            const on = until > Date.now();
            const days = on ? Math.ceil((until - Date.now()) / DAY) : 0;
            return (
              <div style={{ marginTop: 14, paddingTop: 12, borderTop: `1px solid ${C.lineSoft}` }}>
                <button className="press flex items-center gap-2"
                  onClick={() => setD((w) => ({ ...w, routineCallUntil: on ? 0 : Date.now() + 14 * DAY }))}
                  style={{ background: "transparent", border: "none", padding: 0, textAlign: "left" }}>
                  <span style={{ width: 15, height: 15, borderRadius: 4, flexShrink: 0,
                                 border: `1.5px solid ${on ? C.moss : C.line}`, background: on ? C.moss : "transparent",
                                 color: "#fff", fontSize: 10, lineHeight: "13px", textAlign: "center" }}>{on ? "✓" : ""}</span>
                  <span style={{ fontSize: 13, color: on ? C.ink2 : C.ink3 }}>
                    첫 2주는 정기일정도 전화로{on ? <b style={{ color: C.moss, marginLeft: 6 }}>D-{days}</b> : null}
                  </span>
                </button>
                <p style={{ fontSize: 12, color: C.ink3, marginTop: 6, lineHeight: 1.75 }}>
                  복직 초기라 어른이 아직 요일 일정을 못 외우셨으면 켜세요. 시각이 있는 정기일정이 그 시각 30분 전에 전화로 가고,
                  2주 뒤 저절로 꺼집니다. 한 통 약 300원이라 하루 네 통이면 2주에 만 원 남짓입니다.
                </p>
              </div>
            );
          })()}

          <div style={{ marginTop: 16, paddingTop: 14, borderTop: `1px solid ${C.lineSoft}`, fontSize: 12, color: C.moss, fontWeight: 600, letterSpacing: ".04em" }}>나에게</div>
          {[["callHeadsEve", "전날 저녁", "내일 어른께 갈 말을 확인하세요"],
            ["callHeadsMorn", "아침", "오늘 어른께 갈 말을 확인하세요"]].map(([k, lab, hint]) => {
            const at = headsAt(d, k);
            const on = at !== "";
            return (
              <div key={k} className="flex items-center gap-2.5" style={{ marginTop: 9 }}>
                <button className="press flex items-center gap-2" onClick={() => setD((v) => ({ ...v, callHeadsUp: true, [k]: on ? "" : HEADS_DEFAULT[k] }))}
                  style={{ background: "none", border: "none", padding: 0, flex: 1, textAlign: "left" }}>
                  <span style={{ width: 15, height: 15, borderRadius: 4, flexShrink: 0,
                                 border: `1.5px solid ${on ? C.moss : C.line}`, background: on ? C.moss : "transparent",
                                 color: "#fff", fontSize: 10, lineHeight: "13px", textAlign: "center" }}>{on ? "✓" : ""}</span>
                  <span style={{ fontSize: 13, color: on ? C.ink2 : C.ink3 }}><b style={{ fontWeight: 600 }}>{lab}</b> · {hint}</span>
                </button>
                {on && (
                  <input className="hae" style={{ ...inp, width: 86, padding: "8px 10px", fontSize: 13.5, textAlign: "center" }}
                    value={d[k] == null ? HEADS_DEFAULT[k] : d[k]}
                    onChange={(e) => setD((v) => ({ ...v, [k]: e.target.value.slice(0, 5) }))}
                    onBlur={(e) => setD((v) => ({ ...v, [k]: toTime(e.target.value) || HEADS_DEFAULT[k] }))} />
                )}
              </div>
            );
          })}
          <p style={{ fontSize: 12, color: C.ink3, marginTop: 8, lineHeight: 1.75 }}>
            이 폰에 알림으로 옵니다 (문자가 아니라 값이 안 듭니다). 건마다 알리지 않습니다. 끄셔도 어른께 가는 것은 그대로 갑니다.
          </p>
          {(headsAt(d, "callHeadsEve") || headsAt(d, "callHeadsMorn")) && <div style={{ marginTop: 12 }}><PushBox /></div>}
          <p style={{ fontSize: 11.5, color: C.ink3, marginTop: 10 }}>아래 저장을 눌러야 시각이 남습니다.</p>
        </div></Card>
      </Section>

      {/* 막대 셋(말하기·사진·찾기)을 그리던 자리입니다. 부모가 이 앱에서
          AI를 쓰는 건 "내일 달라진 것 말하기" 하나뿐인데 셋을 그리면
          안 쓰는 것 둘을 매번 설명하게 됩니다. 남은 횟수만 한 줄로 둡니다. */}
      <Section eyebrow="AI" title="AI 정리" right={PHASE === "beta" ? "베타 · 무료" : st.plan === "paid" ? "유료" : "무료"}>
        <Card><div style={{ padding: "14px 16px", fontSize: 12.5, color: C.ink2, lineHeight: 1.75 }}>
          {/* "77번 남았어요"는 우리 사정이지 부모 사정이 아닙니다.
              전화 예산을 안 보여주는 것과 같은 이유예요 — 세어 보이면
              쓸 때마다 세게 됩니다. 얼마 안 남았을 때만 말합니다.
              말하기 화면은 이미 5번 이하일 때만 말하고 있었는데
              여기만 늘 굵게 떠 있었습니다. */}
          {(() => {
            const left = leftOf(st, "talk"), lim = limitOf(st, "talk");
            if (lim === Infinity) return <>말하기로 넣으시는 건 <b style={{ color: C.ink }}>횟수 제한이 없습니다.</b></>;
            if (!left) return <span style={{ color: C.persim }}>
              이번 달 말하기를 다 쓰셨어요. {nextResetLabel()}에 다시 채워집니다.</span>;
            if (left <= 10) return <span style={{ color: C.sun }}>
              이번 달 말하기가 <b>{left}번</b> 남았어요 · {nextResetLabel()}에 다시 채워집니다.</span>;
            return <>말하기는 {PHASE === "beta" ? "베타 동안 " : ""}<b style={{ color: C.ink }}>넉넉합니다.</b> 마음껏 쓰세요.</>;
          })()}
          <br />일정 탭 요일 계획에 직접 적으시는 건 횟수와 상관없이 언제든 됩니다.
        </div></Card>
      </Section>

      <Section eyebrow="DATA" title="무엇이 남나요">
        <Card><div style={{ padding: "15px 16px", fontSize: 12.5, color: C.ink2, lineHeight: 1.85 }}>
          <div style={{ fontWeight: 600, color: C.ink, marginBottom: 6 }}>남지 않는 것</div>
          말씀하신 <b>원문</b>과 올리신 <b>사진</b>은 저장하지 않습니다.
          사진은 크기를 줄여 AI에 보내고 바로 버립니다.
          <div style={{ fontWeight: 600, color: C.ink, marginTop: 12, marginBottom: 6 }}>남는 것</div>
          서비스 개선을 위해 <b>AI가 정리한 일의 제목</b>이 익명으로 수집됩니다.
          (예: “피아노 학원 5시”) 누가 말했는지, 어느 집인지는 함께 남기지 않습니다.
          <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 10, lineHeight: 1.7 }}>
            어른 성함과 전화번호는 <b style={{ color: C.ink2 }}>전화를 거는 데에만</b> 씁니다.
            광고에 쓰거나 밖으로 팔지 않습니다.
          </div>
        </div></Card>
      </Section>

      {/* "알림" 상자가 여기 있었습니다. 부모에게 가는 알림은 "나가기 전에 알려드릴까요" 하나라
          부모님 탭 그 자리로 옮겼습니다. 설정에 따로 있으면 두 개인 줄 알게 됩니다. */}


      <div style={{ marginTop: 20 }}>
        {/* 이제 나가기만 해도 저장됩니다. 이 버튼은 "저장했어요"를 눈으로 보고 싶을 때,
            또는 계속 고치던 중에 지금까지 것만 먼저 남겨두고 싶을 때 누르시면 됩니다. */}
        <Btn onClick={() => { skipAutosave.current = true; commit(d); say("저장했어요"); setTab("plan"); }}>저장</Btn>
        <div style={{ height: 8 }} />
        {/* 지우기 전에 내려받을 길이 있어야 합니다. 되돌릴 수 없는 버튼 옆에
            백업이 없으면, 그건 버튼이 아니라 함정입니다. */}
        <Btn kind="ghost" onClick={() => {
          try {
            const blob = new Blob([JSON.stringify(st, null, 2)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `손주한통-백업-${todayStr().replace(/[^0-9]/g, "")}.json`;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 4000);
            say("백업 파일을 내려받았어요");
          } catch { say("이 브라우저에선 내려받기가 안 돼요"); }
        }}>지금 상태 백업 내려받기</Btn>
        <div style={{ height: 8 }} />
        <Btn kind="quiet" onClick={() => {
          if (!confirm("모든 데이터를 지우고 처음부터 시작할까요?\n\n가족 전체의 데이터가 지워지고 되돌릴 수 없습니다.\n먼저 위에서 백업을 내려받으세요.")) return;
          if (!confirm("정말 지울까요? 남편분 화면의 내용도 함께 사라집니다.")) return;
          /* 지운 뒤 화면을 나가면, 언마운트 자동저장이 방금 지운 자리에 옛 d를 도로 채워 넣습니다.
             그러면 "지웠다"가 거짓말이 됩니다. 이번만 자동저장을 끕니다. */
          skipAutosave.current = true;
          window.storage.delete("meonjeon").catch(() => {}); setSt(DEFAULT_STATE);
        }}>데이터 전체 삭제</Btn>
      </div>

      {/* 베타 지표·처음 화면 미리보기·서버 점검은 만드는 사람이 보는 것입니다.
          쓰는 부모에게는 눌러도 뜻을 모르는 버튼 셋일 뿐이라, BUILD 줄을 눌러야 나옵니다. */}
      {dev && (
        <div style={{ marginTop: 20 }}>
          <Btn kind="ghost" onClick={() => setDash(true)}>베타 지표 보기</Btn>
          <div style={{ height: 8 }} />
          <Btn kind="ghost" onClick={() => { setSt((s2) => ({ ...s2, previewOnboarding: true })); setTab("plan"); }}>처음 화면 미리보기</Btn>
          <EnvCheck />
        </div>
      )}

      {/* 폰에서 새로고침이 됐는지 확인하는 자리 */}
      <div className="flex items-center justify-between" style={{ marginTop: 26, paddingTop: 16, borderTop: `1px solid ${C.lineSoft}` }}>
        <button className="press" onClick={() => setDev((v) => !v)}
          style={{ background: "none", border: "none", padding: 0 }}>
          <span className="mono" style={{ fontSize: 10, color: dev ? C.moss : C.ink3, letterSpacing: ".08em" }}>BUILD {BUILD}</span>
        </button>
        <button className="press" onClick={() => { location.href = location.pathname + "?v=" + Date.now(); }}
          style={{ background: "transparent", border: `1px solid ${C.line}`, borderRadius: 999, padding: "7px 13px", fontSize: 11.5, color: C.ink2 }}>
          최신으로 받기
        </button>
      </div>
    </>
  );
}

/* ── 하단 탭 ──────────────────────────────────── */
function TabBar() {
  const { st, tab, setTab } = use();
  /* 예전에 이 자리는 "나눔" 탭이었고, 혼자 쓰면 나눌 게 없어서 감췄습니다.
     지금은 같은 자리가 유용정보(복지 + 미리 사두기)입니다.
     그런데 감추는 조건만 남아 있어서, 혼자 등록한 집은 이 탭을 아예 못 봤습니다.
     복지는 오히려 혼자 사는 집에 더 필요하고, 미리 사두기도 여기에만 있습니다. */
  const items = [
    { id: "plan", label: "일정", icon: "◉" },
    { id: "speak", label: "말하기", icon: "✦", primary: true },
    { id: "script", label: "문구", icon: "✎" },
    { id: "call", label: "조부모님", icon: "☏" },
  ];
  return (
    <nav style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 440,
                  background: "rgba(255,255,255,.9)", backdropFilter: "saturate(1.6) blur(16px)", WebkitBackdropFilter: "saturate(1.6) blur(16px)",
                  borderTop: `1px solid ${C.line}`, display: "flex", gap: 2, zIndex: 30, padding: "7px 8px",
                  paddingBottom: "calc(7px + env(safe-area-inset-bottom))" }}>
      {items.map((it) => {
        const on = tab === it.id;
        /* 식단 탭만 초록. 어느 방에 와 있는지 아래에서도 보이게 */
        const ac = it.id === "meal" ? C.leaf : C.moss;
        if (it.primary) return (
          <button key={it.id} className="press flex-1 flex flex-col items-center justify-center" onClick={() => setTab(it.id)}
            style={{ background: "transparent", border: "none", padding: "2px 0", color: on ? ac : C.ink3 }}>
            <span style={{ width: 40, height: 40, borderRadius: 999, background: on ? ac : C.ink, color: "#fff", fontSize: 16,
                           display: "inline-flex", alignItems: "center", justifyContent: "center", boxShadow: SHADOW }}>{it.icon}</span>
            <span style={{ fontSize: 10.5, marginTop: 3, fontWeight: on ? 600 : 400 }}>{it.label}</span>
          </button>
        );
        return (
          <button key={it.id} className="press flex-1 flex flex-col items-center" onClick={() => setTab(it.id)}
            style={{ background: "transparent", border: "none", borderRadius: R.sm, padding: "7px 0", color: on ? ac : C.ink3 }}>
            <span style={{ position: "relative", fontSize: 15, lineHeight: "20px" }}>
              {it.icon}
              {it.badge ? <span className="mono" style={{ position: "absolute", top: -3, right: -12, minWidth: 15, height: 15, borderRadius: 99, background: C.persim, color: "#fff", fontSize: 9, lineHeight: "15px", padding: "0 4px" }}>{it.badge}</span> : null}
            </span>
            <span style={{ fontSize: 10.5, marginTop: 3, fontWeight: on ? 600 : 400 }}>{it.label}</span>
          </button>
        );
      })}
    </nav>
  );
}


window.startApp = () => ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
