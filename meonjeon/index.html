<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#EFE9F9" />
<title>손주한통 — 어머니께 오늘 일정을 전화로 읽어드립니다</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=da" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="손주한통" />
<link rel="manifest" href="/manifest.json" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap');
  html,body{margin:0;background:#EFE9F9;font-family:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;color:#2A2440;-webkit-font-smoothing:antialiased}
  #gate{max-width:440px;margin:0 auto;padding:64px 22px calc(40px + env(safe-area-inset-bottom))}
  #gate h1{font-family:'Noto Serif KR',serif;font-size:28px;font-weight:600;letter-spacing:-.035em;line-height:1.42;margin:0}
  #gate p{font-size:13.5px;color:#5B5378;line-height:1.78;margin-top:14px}
  #gate input{width:100%;border:1px solid #E0D8F2;border-radius:16px;padding:15px 16px;font-size:15px;background:#fff;font-family:inherit;box-sizing:border-box;transition:border-color .15s,box-shadow .15s}
  #gate input:focus{outline:none;border-color:#5B4394;box-shadow:0 0 0 3px #F0E8FB}
  #gate button{width:100%;border:none;border-radius:16px;padding:16px 0;font-size:15px;font-weight:600;font-family:inherit;background:#2A2440;color:#fff;margin-top:10px;cursor:pointer;transition:transform .12s ease}
  #gate button:active{transform:scale(.985)}
  #gate .ghost{background:transparent;color:#7E7699;font-weight:400;font-size:13px}
  #gate .msg{margin-top:16px;font-size:13px;line-height:1.7;padding:14px 15px;border-radius:14px;background:#F0E8FB;color:#5B4394}
  /* 버튼이 넷이 되면 좁은 폰에서 밀립니다. 줄바꿈을 허용합니다 */
  #bar{position:fixed;top:0;left:0;right:0;z-index:80;display:none;justify-content:center;gap:6px;flex-wrap:wrap;
       background:rgba(255,255,255,.86);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);
       border-bottom:1px solid #E1DFD7;padding:8px 12px;font-size:11.5px;color:#565952;align-items:center}
  #bar button{border:1px solid #E1DFD7;background:#F3F2EE;border-radius:99px;padding:6px 10px;font-size:11px;white-space:nowrap;color:#565952;font-family:inherit;cursor:pointer}
  #sync{position:fixed;bottom:calc(112px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:90;display:none;
        background:#20211D;color:#fff;border-radius:99px;padding:11px 16px;font-size:12.5px;align-items:center;gap:10px;
        box-shadow:0 2px 4px rgba(15,26,21,.06), 0 22px 48px -22px rgba(15,26,21,.4)}
  #sync button{background:#1F4B73;color:#fff;border:none;border-radius:99px;padding:6px 12px;font-size:12px;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div id="bar"></div>
<div id="gate"></div>
<div id="root"></div>
<div id="sync"><span>가족이 방금 업데이트했어요</span><button onclick="location.reload()">새로고침</button></div>

<script>
/* ── 부팅: 설정 → 로그인 → 가구 연결 → 앱 실행 ────────────── */
let SB = null, HH = null, MYUID = null, LASTWRITE = 0;
/* BASE = 마지막으로 서버와 맞춘 상태. 세 갈래 병합의 기준점입니다 */
let BASE = null, BASE_AT = null;

/* ── 가족 화면 합치기 ──────────────────────────────────────
   두 사람이 각자 화면에서 고치면, 나중에 저장한 쪽이 상대가 담은 것을
   통째로 덮어썼습니다. 아내가 담은 두부·시금치와 남편이 담은 아이스크림이
   서로를 지웠습니다. 저장 직전에 서버를 다시 읽고, BASE를 기준으로
   "내가 바꾼 것"과 "상대가 바꾼 것"을 합쳐서 씁니다. */
const clone = (o) => JSON.parse(JSON.stringify(o));
const J = (x) => JSON.stringify(x === undefined ? null : x);
/* id로 구분되는 목록들 */
const ID_LISTS = ['children', 'members', 'elders'];
/* 키마다 따로 판단해야 하는 사전들.
   새 맵을 여기 안 넣으면 합칠 때 통째로 덮어써집니다 —
   남편이 넣은 요일이 내가 저장하는 순간 사라집니다. */
const KEY_MAPS = ['callPlan', 'callToday', 'callLog', 'callChecked', 'callOutbox'];

function mergeList(base, mine, theirs) {
  base = Array.isArray(base) ? base : []; mine = Array.isArray(mine) ? mine : []; theirs = Array.isArray(theirs) ? theirs : [];
  const B = new Map(base.map((x) => [x && x.id, x])), T = new Map(theirs.map((x) => [x && x.id, x]));
  const mineIds = new Set(mine.map((x) => x && x.id));
  const out = [];
  for (const x of mine) {
    const id = x && x.id, b = B.get(id), t = T.get(id);
    const changedByMe = J(x) !== J(b);
    /* 상대가 지웠는데 나도 손대지 않았으면 지운 것을 따릅니다 */
    if (!T.has(id) && B.has(id) && !changedByMe) continue;
    /* 둘 다 고쳤으면 지금 저장하는 내 것을, 나만 안 고쳤으면 상대 것을 */
    out.push(changedByMe || !T.has(id) ? x : t);
  }
  /* 상대가 새로 담은 것 — 내 화면엔 아직 없던 것 */
  for (const t of theirs) {
    const id = t && t.id;
    if (mineIds.has(id)) continue;
    if (B.has(id)) continue;          /* 내가 지운 것은 되살리지 않습니다 */
    out.push(t);
  }
  return out;
}

function mergeMap(base, mine, theirs) {
  base = base || {}; mine = mine || {}; theirs = theirs || {};
  const out = {};
  for (const k of new Set([...Object.keys(mine), ...Object.keys(theirs)])) {
    const inM = k in mine, inT = k in theirs, inB = k in base;
    const changedByMe = J(mine[k]) !== J(base[k]);
    if (!inM) { if (inB) continue; out[k] = theirs[k]; continue; }
    if (!inT) { if (inB && !changedByMe) continue; out[k] = mine[k]; continue; }
    out[k] = changedByMe ? mine[k] : theirs[k];
  }
  return out;
}

/* 이벤트 로그는 양쪽 다 계속 쌓입니다. 겹치는 것만 빼고 이어붙입니다 */
function mergeEvents(mine, theirs) {
  const seen = new Set(), out = [];
  for (const e of [...(mine || []), ...(theirs || [])]) {
    const k = (e && e.ts) + '|' + (e && e.name);
    if (seen.has(k)) continue;
    seen.add(k); out.push(e);
  }
  out.sort((a, b) => (a.ts || 0) - (b.ts || 0));
  return out.slice(-1200);
}

function merge3(base, mine, theirs) {
  base = base || {};
  const out = {};
  for (const k of new Set([...Object.keys(mine || {}), ...Object.keys(theirs || {})])) {
    if (ID_LISTS.indexOf(k) >= 0) { out[k] = mergeList(base[k], mine[k], theirs[k]); continue; }
    if (KEY_MAPS.indexOf(k) >= 0) { out[k] = mergeMap(base[k], mine[k], theirs[k]); continue; }
    if (k === 'events' || k === 'feedback') { out[k] = mergeEvents(mine[k], theirs[k]); continue; }
    /* 나머지(설정값 등)는 바꾼 쪽을 남깁니다 */
    out[k] = J(mine[k]) !== J(base[k]) ? mine[k] : (k in (theirs || {}) ? theirs[k] : mine[k]);
  }
  return out;
}
const gate = document.getElementById('gate');
const bar  = document.getElementById('bar');

/* 첫 화면에 놓는 마크. 아이콘과 같은 그림이라 따로 안 받아도 되고,
   글자만 있던 화면이 앱처럼 보입니다. */
const MARK = `<svg width="62" height="62" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="mkb" x1="0" y1="0" x2="512" y2="512"><stop offset="0" stop-color="#D5C3F2"/><stop offset="1" stop-color="#F1E7FC"/></linearGradient><linearGradient id="mkp" x1="150" y1="150" x2="360" y2="360"><stop offset="0" stop-color="#249C7C"/><stop offset="1" stop-color="#7FE3C2"/></linearGradient></defs><rect width="512" height="512" rx="115" fill="url(#mkb)"/><circle cx="256" cy="256" r="180" fill="white" fill-opacity="0.2"/><path d="M180 120C160 120 140 140 140 160V220C140 300 210 370 290 370H350C370 370 390 350 390 330V290C390 275 378 263 363 263L315 263C300 263 288 275 288 290V300C240 290 220 270 210 220H222C237 220 249 208 249 193V145C249 130 237 118 222 118L180 120Z" fill="url(#mkp)"/><circle cx="290" cy="180" r="45" fill="#FBE3BD"/><path d="M250 175C250 145 270 130 290 130C310 130 330 145 330 175C320 165 305 165 290 170C275 165 260 165 250 175Z" fill="#5B4394"/><circle cx="275" cy="180" r="5" fill="#3A2A5C"/><circle cx="305" cy="180" r="5" fill="#3A2A5C"/><circle cx="268" cy="190" r="6" fill="#E8CE3E" opacity="0.6"/><circle cx="312" cy="190" r="6" fill="#E8CE3E" opacity="0.6"/><path d="M283 193Q290 202 297 193" stroke="#3A2A5C" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M370 140C390 160 400 185 400 210" stroke="#E8CE3E" stroke-width="12" stroke-linecap="round" fill="none"/></svg>`;
const GATE_BUILD = '0902-fe';
const show = (html) => {
  gate.innerHTML = html +
    `<p style="margin-top:26px;font-size:10.5px;color:#A0A096;font-family:'IBM Plex Mono',monospace">BUILD ${GATE_BUILD}</p>`;
  gate.style.display = 'block';
};
const hideGate = () => { gate.style.display = 'none'; };

/* .env.example의 예시 값이 그대로 들어간 경우를 잡아냅니다.
   값이 있는데도 앱이 이상하게 도는 것보다, 여기서 말해주는 편이 낫습니다. */
const isExample = (v) => !v || /xxxxxxxx|^sk-ant-\.\.\.$|^eyJ\.\.\.$|^https:\/\/xxx/i.test(String(v).trim());

const isIPhone = () => /iPad|iPhone|iPod/.test(String(navigator.userAgent || ''));
/* 카카오·네이버 앱 안에서는 홈 화면 추가도, 알림도 안 됩니다 */
const inAppName = () => {
  const u = String(navigator.userAgent || '');
  if (/KAKAOTALK/i.test(u)) return '카카오톡';
  if (/NAVER|Whale.*inapp/i.test(u)) return '네이버 앱';
  if (/Instagram/i.test(u)) return '인스타그램';
  if (/FBAN|FBAV/i.test(u)) return '페이스북';
  if (/DaumApps/i.test(u)) return '다음 앱';
  return null;
};

/* 홈 화면에 추가한 앱으로 들어왔는지 — 사파리와는 다른 방입니다 */
const isStandalone = () => {
  try { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
  catch { return false; }
};

async function boot() {
  const cfg = await fetch('/api/config').then(r => r.json()).catch(() => ({}));
  if (!cfg.url || !cfg.anonKey) {
    show('<h1>설정이 아직이에요</h1><p>Vercel 환경변수에 <b>SUPABASE_URL</b>과 <b>SUPABASE_ANON_KEY</b>를 넣고 다시 배포해 주세요. README의 2단계를 참고하시면 됩니다.</p>');
    return;
  }
  if (isExample(cfg.url) || isExample(cfg.anonKey)) {
    show('<h1>예시 값이 들어가 있어요</h1><p>환경변수는 채워져 있는데 <b>.env.example의 예시 값</b>입니다. Vercel → Settings → Environment Variables에서 <b>SUPABASE_URL</b>과 <b>SUPABASE_ANON_KEY</b>를 Supabase 대시보드의 실제 값으로 바꾸고 다시 배포해 주세요.</p><p style="color:#767A6F;font-size:13px">URL은 <code>https://프로젝트ID.supabase.co</code>, anon 키는 <code>eyJ</code>로 시작하는 수백 글자입니다.</p>');
    return;
  }
  SB = supabase.createClient(cfg.url, cfg.anonKey);
  /* 알림을 켤 때 쓰는 공개 키 — 앱 쪽에서 꺼내 씁니다 */
  window.__VAPID = cfg.vapidPublicKey || '';
  /* 어른 폰에 저장해드릴 발신번호. 서버가 실제로 거는 번호(SOLAPI_FROM)와 같은 값이라
     따로 적어두면 어긋납니다. 알뜰폰으로 바꾸면 Vercel 값만 바꿉니다. */
  window.__CALL_FROM = cfg.callFrom || '';

  const { data: { session } } = await SB.auth.getSession();
  if (!session) return askEmail();
  MYUID = session.user.id;
  /* AI 서버 함수가 로그인 여부를 확인할 수 있게 토큰을 들고 있습니다 */
  window.__TOKEN = session.access_token;
  SB.auth.onAuthStateChange((_e, s2) => { window.__TOKEN = s2 ? s2.access_token : null; });
  await connectHousehold(session.user);
}

/* 메일을 못 보낸 이유를 한국말로.
   Supabase 무료 메일은 <b>시간당 몇 통</b>으로 막혀 있습니다. 여러 번 시도하면
   조용히 아무것도 안 옵니다 — 그때 "안 온다"고만 하면 원인을 영영 못 찾습니다. */
function sendWhy(error) {
  const m = String((error && error.message) || '');
  if (/rate|limit|too many|over_email/i.test(m))
    return '메일을 <b>너무 자주 보냈어요.</b><br>Supabase 무료 메일은 시간당 보낼 수 있는 통수가 정해져 있습니다. <b>한 시간쯤 뒤에</b> 다시 해주세요.';
  /* Supabase 기본 메일은 <b>프로젝트 팀원 주소로만</b> 나갑니다.
     남의 주소로 부르면 "Email address not authorized" 로 거절되는데,
     화면에 영어로 뜨면 "내가 주소를 잘못 적었나" 하고 한 시간을 헤맵니다. */
  if (/not authorized|address not/i.test(m))
    return '이 주소로는 <b>아직 메일이 못 나갑니다.</b><br>지금은 만든 사람 주소로만 보낼 수 있게 돼 있어요. 초대를 받으셔야 합니다.';
  if (/signup|sign-up|not allowed|disabled/i.test(m))
    return '지금은 <b>초대받은 이메일만</b> 들어올 수 있어요.<br>초대받으신 주소가 맞는지 확인해 주세요. 오타가 있으면 로그인이 안 됩니다.';
  if (/not found|no user|user not/i.test(m))
    return '이 주소로는 아직 초대가 안 됐어요.<br>초대받으신 주소가 맞는지 확인해 주세요.';
  if (/invalid|valid email/i.test(m)) return '이메일 주소 형식을 다시 확인해 주세요.';
  return m;
}

function askEmail() {
  const join = new URLSearchParams(location.search).get('join');
  show(`
    <div style="margin-bottom:18px">${MARK}</div>
    <h1>손주한통</h1>
    <p>어른께 아이 일정을 전화로 알려드립니다.<br>어른은 받기만 하시면 됩니다.</p>
    ${join ? '<div class="msg">가족 초대를 받으셨네요. 로그인하면 같은 집으로 들어갑니다.</div>' : ''}
    ${inAppName() ? `<div class="msg" style="background:#F8E7EA;color:#A8324A">
        지금 <b>${inAppName()}</b> 안에서 보고 계세요. 여기서는 알림을 켤 수 없습니다.<br>
        주소창의 <b>${location.host}</b>을 꾹 눌러 복사한 뒤,
        ${isIPhone() ? '<b>사파리</b>' : '<b>크롬</b>'}에 붙여넣어 열어주세요.
      </div>` : isIPhone() && !isStandalone() ? `<div class="msg">
        <b>아이폰은 로그인 전에 한 가지만 먼저</b><br>
        아래쪽 <b>공유 버튼</b>(□에 ↑) → <b>홈 화면에 추가</b> → 생긴 <b>손주한통</b> 아이콘으로 들어와서 로그인하세요.<br>
        <span style="opacity:.8">이러면 로그인을 한 번만 하면 되고, 알림도 받을 수 있습니다.
        지금 여기서 로그인하면 나중에 한 번 더 하셔야 해요.</span>
      </div>` : ''}
    <div style="margin-top:26px">
      <input id="em" type="email" inputmode="email" autocomplete="email" placeholder="이메일 주소" />
      <button id="go">로그인 숫자 받기</button>
      <p style="font-size:12px;color:#7E7699">비밀번호는 없어요. 메일로 온 <b>여섯 자리 숫자</b>를 넣으면 시작됩니다.<br><b>메일 속 링크는 누르지 마세요</b> — 누르면 그 숫자가 못 쓰게 됩니다.</p>
      <p style="font-size:12px;color:#767A6F;margin-top:10px;line-height:1.7">
        가족도 <b>각자 본인 이메일</b>로 들어와요. 누가 무엇을 맡았는지 구분해야 하니까요.<br>
        <b>가족 코드는 로그인이 아니라</b>, 들어온 다음 같은 집으로 합치는 코드입니다.
      </p>
    </div>`);
  document.getElementById('go').onclick = async () => {
    const email = document.getElementById('em').value.trim();
    if (!email) return;
    document.getElementById('go').textContent = '보내는 중…';
    const opts = { emailRedirectTo: location.origin + location.search };
    let { error } = await SB.auth.signInWithOtp({ email, options: opts });
    /* 가입을 막아둔 폐쇄 베타에서는, 이미 초대된 사람에게도 이 호출이
       "새 가입"으로 보여 거절당합니다. 그때는 "기존 사용자에게만 보내기"로
       한 번 더 시도합니다. 가입을 다시 열면 첫 시도에서 그냥 통과합니다. */
    if (error && /signup|sign-up|not allowed/i.test(String(error.message || ''))) {
      const retry = await SB.auth.signInWithOtp({ email, options: { ...opts, shouldCreateUser: false } });
      error = retry.error;
    }
    if (error) {
      /* 베타 동안에는 초대받은 분만 들어옵니다. 영문 에러를 그대로 보여주면
         "내가 뭘 잘못했나" 하고 헤매게 됩니다 */
      const why = sendWhy(error);
      show('<h1>메일을 못 보냈어요</h1><p>' + why + '</p><button onclick="location.reload()">다시 시도</button>');
      return;
    }
    askCode(email);
  };
}

/* 홈 화면에 추가한 앱은 사파리와 다른 방입니다.
   메일에서 링크를 누르면 사파리가 열리고, 사파리에서만 로그인이 됩니다.
   아이폰에서 알림을 받으려면 홈 화면 앱으로 들어와야 하는데,
   그 앱에는 주소창이 없어서 링크를 붙여넣을 수도 없습니다.
   그래서 링크 말고 메일에 적힌 숫자로도 들어올 수 있게 해둡니다.
   숫자 길이는 Supabase 설정에 따라 6~10자리로 달라집니다. 고정하지 않습니다. */
function askCode(email) {
  const home = isStandalone();
  show(`
    <h1>메일함을 확인해 주세요</h1>
    <p><b>${email}</b>로 보냈어요.<br>메일이 안 보이면 스팸함도 봐주세요.</p>
    ${home ? `<div class="msg">지금은 <b>홈 화면 앱</b>이라 메일의 링크를 눌러도 여기로 안 들어옵니다.
       메일에 적힌 <b>숫자</b>를 아래에 넣어주세요.</div>` : ''}
    <div class="msg" style="background:#FBF2D6;color:#7A5C10">
      메일의 <b>링크는 누르지 마세요.</b> 링크를 한 번 누르면 그 숫자는 못 쓰게 됩니다.
      <b>가장 마지막에 온 메일</b>의 숫자를 쓰세요 — 다시 받을 때마다 앞의 숫자는 지워집니다.
    </div>
    <div style="margin-top:22px">
      <!-- 숫자 길이는 Supabase 설정(6~10자리)에 따라 달라집니다. 고정하지 않습니다 -->
      <input id="cd" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10"
             placeholder="메일에 온 숫자"
             style="letter-spacing:.22em;text-align:center;font-size:20px" />
      <button id="ok">숫자로 들어가기</button>
      <p id="cderr" style="font-size:12.5px;color:#A8324A;min-height:18px"></p>
      <button class="ghost" id="again">숫자 다시 받기</button>
      <button class="ghost" onclick="location.reload()">다른 주소로 다시 받기</button>
    </div>`);
  const inp = document.getElementById('cd');
  const err = document.getElementById('cderr');
  inp.oninput = () => { inp.value = inp.value.replace(/[^0-9]/g, ''); err.textContent = ''; };
  inp.focus();
  const go = async () => {
    const token = inp.value.trim();
    if (token.length < 6) { err.textContent = '메일에 온 숫자를 끝까지 넣어주세요.'; return; }
    const b = document.getElementById('ok');
    b.textContent = '확인 중…'; b.disabled = true;
    /* Supabase는 보낸 메일 종류에 따라 같은 숫자를 다르게 부릅니다.
       (매직링크면 magiclink, 첫 가입이면 signup) 어느 쪽인지 알 수 없어서
       차례로 시도합니다. "종류를 고르세요"는 사용자에게 물을 일이 아닙니다. */
    let last = null;
    for (const type of ['email', 'magiclink', 'signup']) {
      const { error } = await SB.auth.verifyOtp({ email, token, type });
      if (!error) { boot(); return; }
      last = error;
    }
    const m = String((last && last.message) || '');
    err.innerHTML = /expired|invalid|token/i.test(m)
      ? '이 숫자는 이제 못 써요.<br><b>메일의 링크를 누르셨거나</b>, 그 뒤에 숫자를 또 받으셨을 수 있어요.<br>아래 <b>숫자 다시 받기</b>를 누르고, <b>가장 마지막에 온 메일</b>의 숫자를 링크는 누르지 말고 넣어주세요.'
      : m;
    b.textContent = '숫자로 들어가기'; b.disabled = false;
  };
  document.getElementById('ok').onclick = go;
  inp.onkeydown = (e) => { if (e.key === 'Enter') go(); };
  document.getElementById('again').onclick = async () => {
    const a = document.getElementById('again');
    a.textContent = '보내는 중…'; a.disabled = true;
    const opts = { emailRedirectTo: location.origin + location.search };
    let { error } = await SB.auth.signInWithOtp({ email, options: opts });
    if (error && /signup|sign-up|not allowed/i.test(String(error.message || ''))) {
      error = (await SB.auth.signInWithOtp({ email, options: { ...opts, shouldCreateUser: false } })).error;
    }
    inp.value = '';
    err.innerHTML = error ? sendWhy(error) : '';
    a.textContent = error ? '숫자 다시 받기' : '새 숫자를 보냈어요 · 다시 받기';
    a.disabled = false;
    if (!error) inp.focus();
  };
}

async function connectHousehold(user) {
  show('<h1>우리 집을 여는 중…</h1>');
  const joinCode = new URLSearchParams(location.search).get('join');

  /* 초대 링크를 안 열고 그냥 들어오면 자기 빈 집이 먼저 생깁니다.
     그러면 나중에 초대 링크를 눌러도 이미 집이 있어서 합류가 안 됐습니다.
     남편이 주소만 받아 먼저 열어보면 영영 못 합치는 구멍이었습니다.
     → 초대 코드가 있으면 이미 집이 있어도 합류를 시도합니다. */
  let { data: mine } = await SB.from('households').select('*');
  mine = mine || [];
  const remembered = (() => { try { return localStorage.getItem('meonjeon:hh'); } catch { return null; } })();

  if (joinCode) {
    const { data, error } = await SB.rpc('join_household', { p_code: joinCode });
    if (data) HH = data;
    else if (mine.length) HH = mine.find(h => h.id === remembered) || mine[0];
    else { show('<h1>초대 코드를 못 찾았어요</h1><p>' + ((error && error.message) || '') + '</p><button onclick="location.href=location.origin">내 집 새로 만들기</button>'); return; }
  } else if (mine.length) {
    /* 여러 집에 속해 있으면 마지막에 쓰던 집을 씁니다. limit(1)은 순서가 없어
       로그인할 때마다 다른 집이 열릴 수 있었습니다 */
    HH = mine.find(h => h.id === remembered) || mine[0];
  } else {
    const { data, error } = await SB.rpc('create_household');
    if (error) { show('<h1>집을 만들지 못했어요</h1><p>' + error.message + '</p>'); return; }
    HH = data;
  }
  try { localStorage.setItem('meonjeon:hh', HH.id); } catch {}
  /* 알림 등록에 어느 집인지 알려줘야 합니다 */
  window.__HH = HH.id;

  /* 로그인한 사람을 가구 구성원과 연결 */
  const st = HH.state && Object.keys(HH.state).length ? HH.state : null;
  if (st && Array.isArray(st.members)) {
    let me = st.members.find(m => m.uid === user.id);
    if (!me) {
      const free = st.members.find(m => !m.uid);
      if (free) { free.uid = user.id; me = free; }
      else {
        me = { id: 'm' + Date.now().toString(36), name: user.email.split('@')[0].slice(0, 6), role: 'member',
               color: ["#8A5A2B","#6B5BA8","#8A7327","#A85477"][st.members.length % 4], uid: user.id };
        st.members.push(me);
      }
      await SB.from('households').update({ state: st }).eq('id', HH.id);
      HH.state = st;
    }
    window.__ME = me.id;
  }

  /* 앱이 쓰는 저장소를 가구 DB에 연결 */
  window.storage = {
    async get(k) {
      const { data } = await SB.from('households').select('state, updated_at').eq('id', HH.id).single();
      if (data) { HH.state = data.state; HH.updated_at = data.updated_at; BASE = clone(data.state || {}); BASE_AT = data.updated_at; }
      if (!HH.state || !Object.keys(HH.state).length) throw new Error('empty');
      return { key: k, value: JSON.stringify(HH.state) };
    },
    async set(k, v) {
      const mine = JSON.parse(v);
      let out = mine;
      /* 내가 마지막으로 읽은 뒤 가족이 저장했는지 봅니다 */
      try {
        const { data: cur } = await SB.from('households').select('state, updated_at').eq('id', HH.id).single();
        if (cur && cur.updated_at !== BASE_AT && cur.state && Object.keys(cur.state).length) {
          out = merge3(BASE || {}, mine, cur.state);
        }
      } catch (e) { /* 못 읽었으면 내 것을 그대로 씁니다. 저장을 놓치는 것보단 낫습니다 */ }
      const at = new Date().toISOString();
      LASTWRITE = Date.now();
      await SB.from('households').update({ state: out, updated_at: at, updated_by: MYUID }).eq('id', HH.id);
      HH.state = out; BASE = clone(out); BASE_AT = at;
      /* 합치면서 내 화면에 없던 게 들어왔으면 화면에도 바로 반영합니다 */
      if (JSON.stringify(out) !== JSON.stringify(mine) && typeof window.__applyRemote === 'function') window.__applyRemote(out);
      return { key: k, value: JSON.stringify(out) };
    },
    async delete() { HH.state = {}; await SB.from('households').update({ state: {} }).eq('id', HH.id); return { deleted: true }; },
    async list() { return { keys: ['meonjeon'] }; },
  };

  /* 가족이 고치면 알려주기 */
  SB.channel('hh').on('postgres_changes',
    { event: 'UPDATE', schema: 'public', table: 'households', filter: 'id=eq.' + HH.id },
    async (p) => {
      if (p.new.updated_by === MYUID) return;
      /* 가족이 고친 것을 바로 받아옵니다. "새로고침"을 누르게 하지 않습니다 */
      try {
        const { data } = await SB.from('households').select('state, updated_at').eq('id', HH.id).single();
        if (!data || !data.state || !Object.keys(data.state).length) return;
        HH.state = data.state; BASE = clone(data.state); BASE_AT = data.updated_at;
        if (typeof window.__applyRemote === 'function') { window.__applyRemote(data.state); return; }
      } catch (e) {}
      if (Date.now() - LASTWRITE > 3000) document.getElementById('sync').style.display = 'flex';
    }
  ).subscribe();

  /* 상단 바: 초대 코드 / 로그아웃 */
  bar.style.display = 'flex';
  bar.innerHTML = `<span>초대코드 <b>${HH.code}</b></span>
    <button id="inv">가족 초대 링크 복사</button>
    <button id="jn">가족 코드로 합류</button>
    <button id="out">로그아웃</button>`;
  /* 다른 이메일로 들어와 빈 집이 생겼을 때 되돌아갈 길입니다.
     이게 없으면 설정을 처음부터 다시 해야 합니다 */
  document.getElementById('jn').onclick = async () => {
    const code = prompt('합류할 가족의 초대코드를 넣어주세요 (예: 7E2F42)\n\n지금 이 화면의 내용은 그대로 남고, 그 집 화면으로 바뀝니다.');
    if (!code || !code.trim()) return;
    const { data, error } = await SB.rpc('join_household', { p_code: code.trim() });
    if (error || !data) { alert('그 코드를 찾지 못했어요.\n' + ((error && error.message) || '')); return; }
    try { localStorage.setItem('meonjeon:hh', data.id); } catch {}
    location.href = location.origin;
  };
  document.getElementById('inv').onclick = async () => {
    const link = location.origin + '/?join=' + HH.code;
    try { await navigator.clipboard.writeText(link); document.getElementById('inv').textContent = '복사했어요'; }
    catch { prompt('이 링크를 가족에게 보내세요', link); }
  };
  document.getElementById('out').onclick = async () => { await SB.auth.signOut(); location.href = location.origin; };
  document.getElementById('root').style.paddingTop = '34px';

  /* 앱 코드는 Babel이 컴파일한 뒤에야 준비됩니다.
     준비 전에 부르면 화면이 하얗게 남으므로 기다렸다가 엽니다. */
  runApp();
}

function runApp(tries) {
  tries = tries || 0;
  if (window.startApp) { hideGate(); window.startApp(); return; }
  if (tries > 200) {   /* 20초 */
    show('<h1>앱을 불러오지 못했어요</h1><p>인터넷 연결을 확인하고 새로고침해 주세요. 사내망이나 일부 와이파이에서는 외부 스크립트가 막히기도 합니다.</p><button onclick="location.reload()">새로고침</button>');
    return;
  }
  setTimeout(function () { runApp(tries + 1); }, 100);
}

boot();
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useId, createContext, useContext } = React;



/* ══════════════════════════════════════════════════════════
   손주한통 — 어머니께 오늘 일정을 전화로 읽어드립니다
   "어른께 아이 일정을 전화로 알려드립니다. 어른은 받기만 하시면 됩니다."

   업무 3종류
   ① 반복 업무   — 사용자가 주기를 정하고 그 주기에 맞춰 뜸
   ② 생애주기 업무 — 기본 시점을 갖고 있다가 해당 가정에만 제안
   ③ AI 발견 업무 — DB에 없는 상황을 AI가 맥락으로 찾아 제안

   원칙
   · 초기 1회 설정에서는 충분히 보여주되, 평소엔 오늘 것만

const BRAND = "손주한통";

/* 어른 폰에 뜨는 번호. 온 집이 이 번호 하나를 씁니다.
   집집마다 부모 번호로 걸 수는 없습니다 — 솔라피는 발신번호마다 등록·인증이
   필요하고, 개수를 늘리려면 사업자 증빙서류가 듭니다(2027년 3월까지 안 냅니다).
   그래서 어른 폰에 이 번호를 "손주한통"으로 저장해두시는 것이 필수 단계입니다.
   ⚠ 번호가 정해지면 여기 한 줄만 고치세요. 서버 쪽은 SOLAPI_FROM 환경변수입니다. */
const CALL_FROM = "";

/* 어른이 앱으로 받는 길 — 베타 동안에는 감춥니다.
   화면(조부모님 탭)은 만들어뒀습니다. 다만 그걸 부모에게 "고를 수 있는 것"으로
   보여주면, 어른이 앱을 까시게 되고 "어른은 앱을 안 깐다"가 무너집니다.
   그리고 30집이 전화와 앱으로 갈리면 "전화가 통하는가"의 답이 흐려집니다.
   베타가 끝나고 전화비가 부담이라는 말이 나오면 이 한 줄만 true 로 바꾸면 됩니다.
   이미 앱으로 골라두신 집은 그대로 둡니다 — 쓰던 것을 말없이 뺏지 않습니다. */
const APP_WAY = false;
/* "설정대로"를 없앴습니다 — 집 기본값이라는 것 자체가 없어졌습니다.
   한 줄 한 줄 전화·문자 중 무엇으로 갈지 그 자리에서 고릅니다. */
const wayOptions = (cur) =>
  [["call", "전화"], ["sms", "문자"], ["app", "앱"]]
    .filter(([v]) => v !== "app" || APP_WAY || cur === "app");
const howOptions = (cur) =>
  [["call", "전화로"], ["sms", "문자로"], ["app", "앱 알림으로"]]
    .filter(([v]) => v !== "app" || APP_WAY || cur === "app");
const callFromLabel = () => {
  /* Vercel 의 SOLAPI_FROM 이 먼저, 없으면 위 CALL_FROM. 둘 다 비면 "번호 하나"로 말합니다 */
  const d = String((typeof window !== "undefined" && window.__CALL_FROM) || CALL_FROM).replace(/[^0-9]/g, "");
  if (!d) return "";
  return d.length === 11 ? `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`
       : d.length === 10 ? `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}` : d;
};

const C = {
  /* 민트 · 연보라 · 연레몬.
     민트가 주인공이고, 식단 화면은 연보라, 눈에 띄어야 할 자리는 연레몬입니다.
     밝은 색만 쓰면 글자가 안 보여서, 각 색마다 "글자용 진한 것"과
     "배경용 연한 것"을 짝지어 둡니다. 뒤 이름(moss/persim/sea)은 그대로 둡니다.

  line: "#E0D8F2", lineSoft: "#EBE4F7",
  /* 진보라 — 주 강조. 버튼과 브랜드. 아이콘 바탕(연보라)의 진한 쪽입니다. */
  moss: "#5B4394", mossSoft: "#F0E8FB", sprout: "#9B85D4",
  /* 대추 — 오늘 안 하면 큰일 나는 것. 쪽빛의 반대편이라 가장 먼저 눈에 걸립니다 */
  persim: "#A8324A", persimSoft: "#F8E7EA",
  /* 레몬 — 알아둘 것. 배경이 연레몬이고 글자는 겨자입니다 */
  sun: "#7A5C10", sunSoft: "#FBF2D6",
  /* 민트 — 이번 주·구매처럼 급하지 않은 것. 아이콘 수화기 색입니다 */
  sea: "#137057", seaSoft: "#DEF4EC",
  /* 식단 화면 전용. 다른 화면은 "잊지 마세요"인데 여기는 "고르세요"입니다.
     같은 진보라를 쓰면 장보기까지 재촉으로 읽혀서, 이 한 화면만 민트로 둡니다. */
  leaf: "#137057", leafMid: "#6BC4A8", leafSoft: "#DEF4EC", bgMeal: "#EDF6F2",
};
/* 그림자는 두 겹으로: 얇은 윤곽 + 넓고 옅은 확산 (요즘 앱 느낌) */
const SHADOW = "0 1px 1.5px rgba(32,33,29,.05), 0 12px 32px -18px rgba(32,33,29,.20)";
const SHADOW_LIFT = "0 2px 4px rgba(32,33,29,.06), 0 22px 48px -22px rgba(32,33,29,.28)";
const R = { xs: 10, sm: 14, md: 18, lg: 22, xl: 28, pill: 999 };
const MEMBER_COLORS = ["#8A5A2B", "#6B5BA8", "#8A7327", "#A85477"];

const FONTS = `
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

input:focus-visible, textarea:focus-visible, select:focus-visible { outline: none; border-color: ${C.moss}; box-shadow: 0 0 0 3px ${C.mossSoft}; }
button:focus-visible { outline: 2px solid ${C.moss}; outline-offset: 2px; }

const todayStr = (t) => { const d = new Date(t || Date.now()); const z = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; };
/* AI가 준 "YYYY-MM-DD"를 그날 0시로 바꿉니다. 이상한 값이면 null */
function parseWhen(v) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || "").trim());
  if (!m) return null;
  const y = Number(m[1]), mo = Number(m[2]), da = Number(m[3]);
  const d = new Date(y, mo - 1, da);
  /* 13월 40일 같은 값은 Date가 조용히 다른 날로 굴려버립니다. 되돌려 확인합니다 */
  if (d.getFullYear() !== y || d.getMonth() !== mo - 1 || d.getDate() !== da) return null;
  const t = d.getTime();
  if (isNaN(t)) return null;
  /* 지나간 날짜를 주면 오늘로 당깁니다 */
  return Math.max(t, todayKey());
}

function nextCallDay(st, now) {
  const t = now || Date.now();
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(st.callAt || "07:50"));
  const cut = new Date(t);
  cut.setHours(m ? Number(m[1]) : 7, m ? Number(m[2]) : 50, 0, 0);
  return startOfDay(t < cut.getTime() ? t : t + DAY);
}

/* 고른 요일이 다음에 오는 날짜.
   미리보기가 늘 "내일"에 못 박혀 있어서, 월요일을 고쳐도 화면이 안 움직였습니다.

   base(보통 nextCallDay)와 요일이 같으면 그날을 그대로 씁니다. */
function dayForDow(dow, base) {
  const from = startOfDay(base || Date.now());
  const want = Number(dow);
  for (let i = 0; i < 7; i++) {
    const d = from + i * DAY;
    if (new Date(d).getDay() === want) return d;
  }
  return from;
}

  const 시각없는예외 = rows.filter((r) => 예외(r) && !r.time);
  const 지금줄 = 시각없는예외.filter(늦게넣음);
  const 아침줄 = 정기아침.concat(시각없는예외.filter((r) => !늦게넣음(r)));
  const 슬롯 = {};
  지금줄.forEach((r) => { const k = 올림5(r.addedAt); (슬롯[k] = 슬롯[k] || []).push(r); });
  Object.keys(슬롯).sort().forEach((k) => out.push({ at: k, rows: 슬롯[k], kind: "지금", now: true }));
  out.sort((a2, b2) => String(a2.at).localeCompare(String(b2.at)));
  if (아침줄.length) out.unshift({ at: st.callAt || "07:50", rows: 아침줄, kind: "아침", soft: true });

  /* 그 통이 어느 길로 가는지 — 한 줄이라도 전화면 전화 */
  const way = (b2) => (b2.rows.some((r) => rowWay(st, r) === "call") ? "call" : "sms");

  /* 앱으로 받는 집은 예산이 없습니다. 부모가 그 줄만은 "전화"라고 찍어두셨으면 그건 전화입니다 */
  if (byApp) return out.map((b2) => b2.rows.some((r) => r.way === "call") ? b2 : { ...b2, app: true });

  /* ── 하루 전화 상한 ─────────────────────────────────
     정기일정 전화가 없어져서 이 상한에 걸릴 일은 드뭅니다. 아이 둘이 같은 날
     병원·조퇴·학원 변경이 겹칠 때만 겨룹니다. 병원과 "지금" 통은 예산 밖입니다 —
     못 들으시면 되돌릴 수 없는 것들이라 300원이 아깝지 않습니다. */
  const must = out.filter((b2) => b2.must);
  const 급함 = (b2) => Math.max(0, ...b2.rows.map((r) => URGENT(r)));
  const wantCall = must.filter((b2) => way(b2) === "call")
    .slice().sort((a2, b2) => 급함(b2) - 급함(a2));
  let left = Math.max(0, Number(st.callMax != null ? st.callMax : 2));
  const 전화 = new Set();
  wantCall.filter((b2) => 급함(b2) === 3).forEach((b2) => { 전화.add(b2); left--; });
  wantCall.filter((b2) => 급함(b2) !== 3).forEach((b2) => { if (left > 0) { 전화.add(b2); left--; } });

  return out.map((b2) => {
    if (b2.soft) return { ...b2, sms: true };                       /* 아침 통은 늘 문자 */
    if (b2.now) return way(b2) === "call" ? b2 : { ...b2, sms: true }; /* "지금" 통은 고른 길 그대로 */
    if (전화.has(b2)) return b2;
    return { ...b2, sms: true };
  });
}

/* 부모가 말한 것 중 "어른께 갈 것"과 "내가 챙길 것"을 갈라주는 지시문.

function CALL_SPLIT(st, today) {

  잘못 꺼서 하원을 아무도 안 가는 것이 이 앱에서 제일 나쁜 실패입니다.
  offDay가 true여도 call은 평소대로 뽑으세요. 끄는 것은 부모가 정합니다.
  다만 **재택근무는 offDay가 아닙니다.** 집에 있어도 회의 중이면 하원은 어른이 가십니다.
  "재택", "집에서 일해"만 있는 말에는 offDay를 false로 두세요.

}

/* 오늘과 내일 나갈 말을 미리 구워둡니다.
   서버(api/voice-send)가 이걸 읽어서 그대로 보냅니다. */
function bakeOutbox(st) {
  const box = {};
  [0, 1].forEach((n) => {
    const when = todayKey() + n * DAY;
    const day = new Date(when);
    const k = `${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, "0")}-${String(day.getDate()).padStart(2, "0")}`;
    if (!st.callOn || !((st.elders || [])[0] || {}).phone) return;
    const bs = callBatches(st, when);
    if (!bs.length) return;
    box[k] = bs.map((b, i) => ({
      /* id에 내용을 넣으면 안 됩니다.
         08:58에 나간 뒤 08:59에 부모가 고치면 id가 바뀌어
         "안 보낸 통"이 되고, 09:00에 한 번 더 나갑니다.
         시각과 차례로만 만듭니다 — 고치면 아직 안 나간 통에만 반영되고,
         이미 나간 통은 그대로 둡니다. 나간 말을 되돌릴 수는 없으니까요. */
      id: `${b.at}-${b.app ? "a" : b.sms ? "s" : "c"}-${i}`,
      at: b.at, sms: !!b.sms, app: !!b.app,
      text: (b.sms || b.app) ? smsText(st, when, b.rows) : callScript(st, when, b.rows),
    }));
  });
  return box;
}

/* 전화 대신 문자로 갈 때의 글. 읽어드리는 말투를 그대로 쓰지 않습니다 —
   "끊으셔도 됩니다"는 글에서는 뜻이 없고, 보낸 사람이 누구인지가 필요합니다. */
function smsText(st, when, rows) {
  const body = callScript(st, when, rows)
    .replace(/^[^,]+,\s*/, "")            /* "어머니, " 머리말은 뺍니다 */
    /* 베타의 "1번을 눌러주세요"는 전화에만 붙습니다.
       문자에 그게 가면 어른이 눌러도 아무 일이 안 일어나고,
       글자 수가 90바이트를 넘어 장문(50원)이 됩니다. */
    .replace(/\s*들으셨으면 1번을 눌러주세요\.\s*안 누르셔도 괜찮습니다\.?/, "")
    .replace(/\s*끊으셔도 됩니다\.?\s*$/, "");
  const me = (st.members || []).find((m) => m.id === (st.me || "m1"));
  /* 처음 만들어질 때 부모 이름이 "나"로 들어갑니다(남편은 "남"). 이름을 안 고친 집은
     문자가 "- 나"로 끝났습니다 — 어른이 보시기엔 누가 보낸 건지 알 수 없는 서명입니다.
     자리표시 이름이면 아이 이름으로 "- 지호네"라고 씁니다. 어른께 제일 익숙한 이름이니까요. */
  const raw = ((me && me.name) || "").trim();
  const 자리표시 = !raw || /^(나|남|남편|아내|엄마|아빠)$/.test(raw);
  const kid = ((st.children || [])[0] || {}).name;
  const who = !자리표시 ? raw : kid ? `${kid}네` : "";
  return who ? `${body}\n- ${who}` : body;
}

/* 단문은 90바이트(한글 45자)까지 20원 안팎, 넘으면 장문이 되어 값이 뜁니다.
   부모가 길게 적으면 미리 알려줘야 합니다. */
function smsCost(text) {
  const bytes = [...String(text || "")].reduce((n, ch) => n + (ch.charCodeAt(0) < 128 ? 1 : 2), 0);
  return { bytes, won: bytes <= 90 ? 20 : 50, long: bytes > 90 };
}

/* "15:20" → "14:50" */
function minus30(t, lead) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || ""));
  if (!m) return t;
  let v = Number(m[1]) * 60 + Number(m[2]) - (lead == null ? 30 : Number(lead));
  if (v < 0) v += 1440;
  return `${String(Math.floor(v / 60)).padStart(2, "0")}:${String(v % 60).padStart(2, "0")}`;
}

/* 어른께 그대로 나갈 문장. 부모가 미리 볼 수 있어야 해서 따로 뺐습니다.
   확인을 요구하지 않습니다 — 버튼을 누르시라고 하면 그 순간
   어른이 이 앱의 사용자가 되어버립니다. 끊으시면 끝입니다.

   준비물은 "챙겨주세요"가 아니라 "챙겨뒀어요"입니다.
   전화로 부를 수 있는 건 두세 개까지고, 그보다 많으면 어른이 못 외우십니다.
   그리고 준비물은 부모가 전날 챙기는 게 맞습니다. 어른께 시킬 일이 아닙니다. */
function callScript(st, when, rows) {
  const list = rows || callItemsFor(st, when);
  if (!list.length) return "";
  const elder = (st.elders || [])[0] || {};
  const label = elder.label || "어르신";
  const kids = st.children || [];
  const day = startOfDay(when || Date.now());
  const t = (st.callToday || {})[day] || {};
  /* 부모가 그날 문장을 통째로 고쳤으면 그것이 우선입니다 */
  if (t.script) return String(t.script);

  const nameOf = (id) => (kids.find((k) => k.id === id) || {}).name || "";
  const 하나 = kids.length <= 1;
  const 첫아이 = kids[0] && kids[0].name ? kids[0].name : "아이";

  const 일정 = list.filter((r) => r.kind !== "bag");
  const 가방 = list.filter((r) => r.kind === "bag");

  /* ── 아이별로 묶고, 그 안에서 시간순 ────────────────
     전에는 들어온 차례대로 이어붙였습니다. 그래서 이런 게 나갔습니다 —
     "태권도, 첫째 오후 1시 30분 피아노, 첫째 오후 2시 30분 하원, 첫째 오후 3시 간식"
     시각 없는 것이 맨 앞에 오고, 같은 아이인데 "첫째"가 매 줄에 붙습니다.
     귀로 들으면 누구 것인지 따라가기가 어렵습니다.

     이제 아이마다 한 덩이로 묶고 이름은 그 앞에 한 번만 부릅니다 —
     "첫째는 1시 30분 피아노 데려다주기, 2시 30분 하원, 3시 간식입니다."
     시각이 없는 것은 뒤로 보냅니다. 시각이 있는 것이 먼저 들려야
     어른이 시계를 보실 수 있습니다. */
  const mm = (r) => {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(r.time || ""));
    return m ? Number(m[1]) * 60 + Number(m[2]) : 9999;   /* 시각 없는 것은 맨 뒤 */
  };
  const 시간순 = (a2, b2) => mm(a2) - mm(b2);

  /* 아이 차례는 등록 순서 그대로. 그래야 매일 같은 차례로 들리십니다 */
  const 묶음 = [];
  if (하나) {
    묶음.push({ name: "", rows: 일정.slice().sort(시간순) });
  } else {
    kids.forEach((k) => {
      const mine = 일정.filter((r) => r.kid === k.id).sort(시간순);
      if (mine.length) 묶음.push({ name: k.name || "아이", rows: mine });
    });
    /* 누구 것인지 안 정해진 것은 이름 없이 뒤에 붙입니다 */
    const 미정 = 일정.filter((r) => !kids.some((k) => k.id === r.kid)).sort(시간순);
    if (미정.length) 묶음.push({ name: "", rows: 미정 });
  }

  /* 시각이 없는 것을 시각 있는 것 뒤에 그냥 이어붙이면
     "오후 3시 간식 주기, 태권도입니다"가 되어 3시에 태권도인 줄 아십니다.
     문장을 끊고 "그밖에"로 시작합니다. */
  /* 어린이집·유치원이 집 앞이 아닙니다. 차를 타는 곳, 만나는 곳이 따로 있어요.
     "2시 30분 하원"만 들으시면 어디로 가실지 모르십니다.
     아이마다 한 번 넣어둔 곳을 등하원 줄에만 붙입니다 —
     학원이나 병원에는 안 붙입니다. 거기는 이름이 곧 장소니까요. */
  const 등하원 = /등원|하원|등교|하교|데리러|데려다|데려오/;
  const 곳붙임 = (r) => {
    const w = callSpace(r.what);
    const kid = kids.find((k) => k.id === r.kid);
    const spot = kid && String(kid.spot || "").trim();
    if (!spot || !등하원.test(w)) return w;
    /* "유치원 하원하기" → "유치원 하원하기, 아파트 정문에서" */
    return `${w}, ${spot}에서`;
  };

  const 문장 = 묶음.map((g) => {
    const 때있 = g.rows.filter((r) => r.time);
    const 때없 = g.rows.filter((r) => !r.time);
    const 앞말 = g.name ? `${은는(g.name)} ` : "";
    const 조각 = [];
    if (때있.length) 조각.push(`${앞말}${때있.map((r) => `${callTime(r.time)} ${곳붙임(r)}`).join(", ")}입니다.`);
    if (때없.length) 조각.push(`${때있.length ? "그밖에 " : 앞말}${때없.map((r) => 곳붙임(r)).join(", ")}가 있습니다.`);
    return 조각.join(" ");
  }).join(" ");

  /* "유치원 가방"이 들어오면 "유치원 가방 가방에"가 나갔습니다 */
  const 가방목록 = 가방.map((r) => (하나 ? "" : (nameOf(r.kid) ? nameOf(r.kid) + " " : "")) + r.what).join(", ");
  const 가방줄 = 가방.length
    ? ` ${가방목록}${/가방$/.test(가방목록) ? "에" : " 가방에"} 챙겨뒀어요. 현관에 두겠습니다.`
    : "";
  /* 병원은 어른이 데려가시면 접수대에서 "어디가 아파서 왔냐"를 물으십니다.
     부모는 회사에 있고, 어른이 모르시면 진료가 안 됩니다.
     그래서 왜 가는지를 그 자리에서 같이 읽어드립니다. 두 개까지만 —
     그보다 많으면 어른이 못 외우십니다. */
  const 이유들 = list.filter((r) => r.why && String(r.why).trim()).slice(0, 2);
  /* "소아과 데려다주기는 충치 때문이에요"는 말이 겹칩니다. 앞말만 씁니다 */
  const 곳 = (w) => String(w || "").replace(/\s*(데려다주기|데리러\s*가기|데려오기|하원하기|등원하기|하교하기|가기)$/, "").trim() || String(w || "");
  const 이유줄 = 이유들.length
    ? " " + 이유들.map((r) => `${은는(곳(r.what))} ${String(r.why).trim()} 때문이에요.`).join(" ")
    : "";
  const 곧 = list === rows && rows.length === 1 && rows[0].alert;
  const 머리 = 하나 ? `${label}, ${첫아이} ` : `${label}, `;
  const 앞 = 일정.length
    ? `${머리}${곧 ? "곧 있을 일정입니다" : "오늘 일정입니다"}. ${문장}`
    : `${머리}오늘입니다.`;
  return `${앞}${이유줄}${가방줄}${confirmTail()} 끊으셔도 됩니다.`;
}

/* 약은 이름·용량·때를 따로 받습니다. 자유롭게 적게 두면
   "약 먹이기"라고만 적고 마는데, 어른께는 그 말이 아무 소용이 없습니다. */
/* 먹는 약은 밥에 붙어 있어서 시각을 따로 알려드릴 일이 아닙니다.
   그런데 안약·연고·흡입기는 밥과 무관하고, 그래서 제일 잘 빠뜨립니다.
   그런 것만 그 시각에 따로 겁니다. */
const MED_WHEN = ["아침 먹고", "점심 먹고", "저녁 먹고", "자기 전", "정한 시각에"];
/* 약 이름·용량을 매번 적는 게 번거로우면 이 하나로 끝냅니다.
   부모가 전날 봉투에 담아두고, 어른은 그걸 꺼내 드리기만 하시면 됩니다.
   병명·약 이름이 스피커폰으로 새어나가는 것도 같이 막힙니다. */
/* 어른이 들으셨는지 아는 길은 둘입니다.
   ① 통화 길이 — 32초짜리를 5초에 끊으면 안 들으신 겁니다. 어른은 아무것도 안 하십니다.
   ② 1번 눌러주세요 — 확실하지만 어른께 일을 하나 드립니다.

   정식판은 ①입니다. "어른은 받기만 하신다"가 이 제품의 전부니까요.
   다만 ①이 실제와 얼마나 맞는지를 아무도 모릅니다.
   그래서 베타 4주 동안만 ②를 같이 넣어 ①을 검증합니다 —
   눌러주시면 확실히 알고, 안 누르셔도 길이로 압니다.
   그래서 "안 누르셔도 괜찮습니다"를 반드시 같이 읽어드립니다.
   이 한 줄이 없으면 어른이 눌러야 하는 줄 아시고, 그 순간 정식판과 다른 물건이 됩니다. */
/* PHASE가 아래에 선언돼 있어서 상수로 두면 앱이 아예 안 뜹니다(TDZ).
   쓰는 시점에 읽도록 함수로 둡니다. */
const confirmTail = () => (PHASE === "beta"
  ? " 들으셨으면 1번을 눌러주세요. 안 누르셔도 괜찮습니다."
  : "");

const MED_BAG = "준비된 약봉투";
const MED_HOW = [MED_BAG, "먹는 약", "물약", "가루약", "바르는 약", "붙이는 약", "코에 넣는 약"];
function medLine(m) {
  if (!m) return "";
  /* 약봉투를 고르셨으면 이름도 용량도 필요 없습니다 */
  if (m.how === MED_BAG) return `${m.when} 준비된 약봉투`;
  if (!m.name) return "";
  return [m.when, m.name, m.dose, m.times, m.how].filter(Boolean).join(" ");
}

/* 통화 길이와 값. 초당 4원에 기본료 200원 — 이 숫자가 요금제를 정합니다.
   한글 한 글자를 0.18초로 잡았습니다(보통 TTS 속도) */
/* 솔라피 음성: 기본 200원 + 길이 초당 4원. (2026-09-01 고객지원 확인)
   그래서 문장을 줄이면 돈이 바로 줄어듭니다 — 10초 240원, 56초 424원.
   ⚠ 안 받으셔도 차감됩니다. 통화가 연결되면 과금이라고 안내받았습니다. */
function callCost(text, byApp) {
  const sec = Math.max(10, Math.ceil(String(text || "").length * 0.18) + 3);
  return { sec, won: byApp ? 0 : 200 + sec * 4 };
}

function toFragments(text) {
  const words = String(text).split(/[\s.,!?]+/).filter(Boolean);
  const out = [];
  words.forEach((w) => { if (w.length <= 7) out.push(w); else out.push(...(w.match(/.{1,5}/g) || [])); });
  return out.slice(0, 18);
}

const SHARED = (() => {
  try {
    const q = new URLSearchParams(window.location.search);
    const t = [q.get("title"), q.get("text"), q.get("url")].filter(Boolean).join("\n").trim();
    if (!t) return "";
    /* 새로고침해도 또 들어오지 않게 주소에서 지웁니다. join 같은 다른 값은 그대로 둡니다 */

/* 사진을 1200px 이내로 줄이고 JPEG로 바꿉니다.
   원본 그대로 보내지 않는 이유: 통신량·비용도 있지만
   사진에 붙은 위치·기기 정보(EXIF)를 떼어내기 위해서예요. */
function shrinkImage(file, max = 1200) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("파일을 읽지 못했어요"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("사진을 열지 못했어요"));
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * scale);
        cv.height = Math.round(img.height * scale);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        const url = cv.toDataURL("image/jpeg", 0.78);
        resolve({ media_type: "image/jpeg", data: url.split(",")[1] });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function askClaude(prompt, images, search) {
  const res = await fetch("/api/classify", {
    method: "POST",
    headers: { "Content-Type": "application/json", ...(await authHeaders()) },
    body: JSON.stringify({ prompt, images: images || undefined, search: search || undefined, promptVersion: PROMPT_VERSION }),

  }
  const data = await res.json();

/* AI 답에서 자료만 꺼냅니다.
   답이 길이 제한에 걸려 중간에 끊기는 일이 실제로 생깁니다. 그때 그냥 던지면
   화면에 "Unexpected end of JSON input"만 뜹니다. 끊긴 답이라도 끝까지 온
   항목은 살려 쓰고, 정말 못 쓸 때만 무슨 일인지 한국어로 알립니다. */
function parseLoose(text, stopReason, diag) {
  const clean = String(text || "").replace(/```json/g, "").replace(/```/g, "").trim();
  /* 왜 못 읽었는지를 화면에서 바로 알 수 있어야 합니다.
     원문이 아니라 "무엇이 왔는지"만 붙입니다 */
  const tail = diag
    ? ` (받은 것: ${(diag.types || []).join("+") || "없음"} · 글자 ${diag.chars || 0} · 중단 ${stopReason || "?"})`
    : stopReason ? ` (중단 ${stopReason})` : "";
  const fail = (msg, code) => { const e = new Error(msg); e.code = code; e.stopReason = stopReason; e.diag = diag; throw e; };
  if (!clean) fail("AI가 빈 답을 보냈어요." + tail, "empty");

  const a = clean.indexOf("["), o = clean.indexOf("{");
  const at = o >= 0 && (o < a || a < 0) ? o : a;
  if (at < 0) fail("AI 답에서 정리된 내용을 못 찾았어요." + tail, "nojson");
  const body = clean.slice(at);

  try { return JSON.parse(body); } catch {}

  /* 뒤에 군더더기가 붙은 경우 — 마지막 닫는 괄호까지만 */
  const close = body.lastIndexOf(body[0] === "{" ? "}" : "]");
  if (close > 0) { try { return JSON.parse(body.slice(0, close + 1)); } catch {} }

  /* 배열이 중간에 끊긴 경우 — 온전히 닫힌 항목만 골라냅니다 */
  if (body[0] === "[") {
    const out = [];
    let depth = 0, start = -1, inStr = false, esc = false;
    for (let i = 1; i < body.length; i++) {
      const ch = body[i];
      if (inStr) { if (esc) esc = false; else if (ch === "\\") esc = true; else if (ch === '"') inStr = false; continue; }
      if (ch === '"') { inStr = true; continue; }
      if (ch === "{") { if (!depth) start = i; depth++; }
      else if (ch === "}") { depth--; if (!depth && start >= 0) { try { out.push(JSON.parse(body.slice(start, i + 1))); } catch {} start = -1; } }
    }
    if (out.length) return out;
  }
  fail((stopReason === "max_tokens"
    ? "AI 답이 너무 길어서 중간에 끊겼어요."
    : "AI 답을 읽지 못했어요.") + tail, "cut");
}

/* 홈 화면에 추가된 앱으로 열렸는지. 아이폰은 이래야만 알림이 됩니다 — 애플이 그렇게 막아놨습니다 */
const standalone = () => {
  try {
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  } catch { return false; }
};

/* 서버가 준 공개 키를 브라우저가 알아듣는 모양으로 바꿉니다 */
function urlB64ToUint8(b64) {
  const pad = "=".repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

async function turnOnPush(hour) {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    return { error: "이 브라우저는 알림을 지원하지 않아요" };
  }
  if (inApp) return { error: `${inApp} 안에서는 알림을 못 켭니다. 위 안내대로 브라우저로 열어주세요` };
  if (isIOS() && !standalone()) return { error: "ios-home" };
  if (!window.__VAPID) return { error: "서버에 알림 키가 아직 없어요 (VAPID_PUBLIC_KEY)" };
  if (!window.__HH) return { error: "가구 정보를 아직 못 읽었어요. 새로고침해 주세요" };

  const perm = await Notification.requestPermission();
  if (perm !== "granted") return { error: "알림 권한이 꺼져 있어요. 브라우저 설정에서 허용해 주세요" };

  const reg = await navigator.serviceWorker.register("/sw.js");
  await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlB64ToUint8(window.__VAPID),
    });
  }
  const r = await fetch("/api/push-subscribe", {
    method: "POST",
    headers: { "Content-Type": "application/json", ...(await authHeaders()) },
    body: JSON.stringify({
      sub: sub.toJSON(), householdId: window.__HH, hour,
      /* 서버는 UTC로 돕니다. 한국이면 -540이 넘어가니 뒤집어서 보냅니다 */
      tzOffset: -new Date().getTimezoneOffset(),
    }),
  });
  if (!r.ok) { const j = await r.json().catch(() => ({})); return { error: j.error || "알림 등록에 실패했어요" }; }
  return { ok: true };
}

async function turnOffPush() {
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && (await reg.pushManager.getSubscription());
    if (sub) await sub.unsubscribe();
  } catch {}
  await fetch("/api/push-subscribe", {
    method: "POST",
    headers: { "Content-Type": "application/json", ...(await authHeaders()) },
    body: JSON.stringify({ off: true, householdId: window.__HH }),
  }).catch(() => {});
}

function PushBox() {
  const { st, setSt, say } = use();
  const nt = st.notify || {};
  const hour = PUSH_HOUR;
  const [busy, setBusy] = useState(false);
  const [howto, setHowto] = useState(false);
  const [msg, setMsg] = useState(null);
  /* "켜짐"은 가구 설정이라 가족 기기 전체에 같이 저장됩니다.
     그런데 알림은 기기마다 따로 등록됩니다 — 사파리에서 켜도 홈 화면 앱은
     안 켜져 있습니다. 그래서 이 기기에 진짜 등록됐는지를 따로 확인합니다.
     이걸 안 하면 "켜짐"이라고 적혀 있는데 아무것도 안 오는 일이 생깁니다. */
  const [here, setHere] = useState(null);
  const checkHere = async () => {
    try {
      if (!("serviceWorker" in navigator) || !("PushManager" in window)) return setHere(false);
      const reg = await navigator.serviceWorker.getRegistration();
      if (!reg) return setHere(false);
      const sub = await reg.pushManager.getSubscription();
      setHere(!!sub);
    } catch { setHere(false); }
  };
  useEffect(() => { checkHere(); }, []);

  const on = async (h) => {
    setBusy(true);
    const r = await turnOnPush(h).catch((e) => ({ error: String((e && e.message) || e) }));
    setBusy(false);
    if (r.error === "ios-home") { setHowto(true); return; }
    if (r.error) return say(r.error);
    setHowto(false);
    setSt((sv) => ({ ...sv, notify: { ...(sv.notify || {}), on: true, hour: h } }));
    checkHere();
    say("이 폰으로 알립니다");
  };
  const test = async () => {
    setBusy(true); setMsg(null);
    try {
      /* 지금 이 기기로만 보냅니다. 예전에 홈 화면에 추가해둔 것까지
         다 울리면 무엇을 보고 있는지 알 수 없습니다. */
      let here = "";
      try {
        const reg = await navigator.serviceWorker.getRegistration();
        const sub = reg && await reg.pushManager.getSubscription();
        here = (sub && sub.endpoint) || "";
      } catch {}
      const r = await fetch("/api/push-test", {
        method: "POST",
        headers: { ...(await authHeaders()), "Content-Type": "application/json" },
        body: JSON.stringify({ endpoint: here }),
      }).then((x) => x.json());
      setMsg(r.ok
        ? { ok: true, t: "이 기기로 보냈습니다.",
            d: "이 화면을 벗어나서 잠금화면을 봐주세요. 30초 안에 안 오면 아래를 확인해 주세요.",
            others: r.others || 0, here }
        : { ok: false, t: r.error || "보내지 못했어요", d: "" });
    } catch { setMsg({ ok: false, t: "서버에 닿지 못했어요", d: "" }); }
    setBusy(false);
  };
  /* 홈 화면에 다시 추가할 때마다 등록이 하나씩 늘어납니다.
     하루 만져보면 여섯 대가 됩니다. 이 기기만 남기고 지웁니다. */
  const prune = async (here) => {
    setBusy(true);
    try {
      const r = await fetch("/api/push-test", {
        method: "POST",
        headers: { ...(await authHeaders()), "Content-Type": "application/json" },
        body: JSON.stringify({ endpoint: here, prune: true }),
      }).then((x) => x.json());
      if (r.ok) { setMsg(null); say(`옛 등록 ${r.pruned}대를 지웠어요`); }
      else say(r.error || "지우지 못했어요");
    } catch { say("서버에 닿지 못했어요"); }
    setBusy(false);
  };
  const off = async () => {
    setBusy(true);
    await turnOffPush();
    setBusy(false);
    setSt((sv) => ({ ...sv, notify: { ...(sv.notify || {}), on: false } }));
    setHere(false); setMsg(null);
    say("알림을 껐어요");
  };

  return (
    <Card>
      <div style={{ padding: "14px 15px" }}>
        <div style={{ fontSize: 13.5, fontWeight: 600, color: C.ink }}>
          {nt.on ? "이 폰으로 알림 · 켜짐" : "이 폰으로 알림 받기"}
        </div>
        <div style={{ fontSize: 12, color: C.ink3, marginTop: 5, lineHeight: 1.7 }}>
          그날 첫 통 10분 전에 <b>어른께 무엇이 나가는지</b> 이 폰에 한 번 뜹니다. 앱을 닫아둬도 옵니다.
        </div>

        <div className="flex gap-2" style={{ marginTop: 13 }}>
          <button className="press" disabled={busy} onClick={() => on(hour)}
            style={{ background: C.moss, color: "#fff", border: "none", borderRadius: R.pill, padding: "10px 16px", fontSize: 12.5, opacity: busy ? 0.6 : 1 }}>
            {/* 가구 설정은 켜져 있는데 이 기기만 등록이 안 된 상태가 있습니다.
                 그때 "다시 확인"이라고 적혀 있으면 무엇을 누르는 건지 알 수 없습니다 */}
            {busy ? "잠시만요…" : !nt.on ? "알림 켜기" : here === false ? "이 기기에서 켜기" : "다시 확인"}
          </button>
          {nt.on && (
            <button className="press" disabled={busy} onClick={off}

/* 네이버·카카오·인스타 앱 안의 브라우저는 파일을 캘린더로 못 넘기고,
   홈 화면 추가도 안 되고, 알림도 못 켭니다. 쓰시는 분은 그걸 모릅니다.
   앱이 알아서 알려줘야 합니다. */
const inApp = (() => {
  const u = String((typeof navigator !== "undefined" && navigator.userAgent) || "");
  if (/NAVER|Whale.*inapp/i.test(u)) return "네이버 앱";
  if (/KAKAOTALK/i.test(u)) return "카카오톡";
  if (/Instagram/i.test(u)) return "인스타그램";
  if (/FBAN|FBAV/i.test(u)) return "페이스북";
  if (/DaumApps/i.test(u)) return "다음 앱";
  return null;
})();
const isIOS = () => /iPad|iPhone|iPod/.test(String((typeof navigator !== "undefined" && navigator.userAgent) || ""));

function InAppNotice() {
  const { st, setSt } = use();
  const [copied, setCopied] = useState(false);
  if (!inApp || (st.inAppOff || 0) > Date.now() - 30 * DAY) return null;
  return (
    <div style={{ marginTop: 12, background: C.sunSoft, borderRadius: R.md, padding: "14px 16px" }}>
      <div className="flex items-start justify-between gap-3">
        <div style={{ fontSize: 12.5, color: C.sun, lineHeight: 1.8 }}>
          지금 <b>{inApp} 안의 브라우저</b>로 보고 계세요. 여기서는
          <b> 캘린더에 넣기</b>와 <b>알림</b>이 안 됩니다.<br />
          {isIOS()
            ? <>오른쪽 아래 <b>☰ → Safari로 열기</b>를 한 번만 눌러주세요.</>
            : <>오른쪽 위 <b>⋮ → 다른 브라우저로 열기</b>를 한 번만 눌러주세요.</>}
        </div>
        <button className="press" aria-label="닫기"
          onClick={() => setSt((sv) => ({ ...sv, inAppOff: Date.now() }))}
          style={{ background: "transparent", border: "none", color: C.sun, fontSize: 12, padding: 0, lineHeight: 1 }}>✕</button>
      </div>
      <button className="press" onClick={() => {
        try { navigator.clipboard.writeText(location.href); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch {}
      }} style={{ marginTop: 10, background: C.card, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "8px 13px", fontSize: 12, color: C.ink2 }}>
        {copied ? "복사했어요 · 브라우저에 붙여넣으세요" : "주소 복사하기"}
      </button>
    </div>
  );
}

/* ══════════ 앱 ══════════ */
/* ── 새 버전이 나왔는지 스스로 봅니다 ──────────────
   홈 화면에 추가한 앱은 시작 화면을 아주 오래 들고 있습니다.
   실제로 폰이 0831-y에 굳어 있는 동안 서버는 0901-g였습니다.
   그러면 이미 고친 것을 다시 신고하게 되고, 베타에서 그건 시간 낭비입니다.

   그래서 화면을 다시 볼 때마다 version.json을 캐시 없이 읽어
   지금 돌고 있는 판과 다르면 위에 한 줄을 띄웁니다.
   새로고침은 사용자가 누릅니다 — 쓰던 걸 앱이 마음대로 끊지 않습니다. */
function useNewBuild() {
  const [newer, setNewer] = useState("");
  const last = useRef(0);
  useEffect(() => {
    const look = async () => {
      if (document.hidden) return;
      if (Date.now() - last.current < 60000) return;   /* 1분에 한 번이면 충분합니다 */
      last.current = Date.now();
      try {
        const r = await fetch(`/version.json?t=${Date.now()}`, { cache: "no-store" });
        if (!r.ok) return;
        const v = await r.json();
        if (v && v.build && v.build !== BUILD) setNewer(v.build);
      } catch {}
    };
    look();
    document.addEventListener("visibilitychange", look);
    window.addEventListener("focus", look);
    return () => {
      document.removeEventListener("visibilitychange", look);
      window.removeEventListener("focus", look);
    };
  }, []);
  return newer;
}

function NewBuildBar({ build }) {
  if (!build) return null;
  return (
    <div style={{ position: "sticky", top: 0, zIndex: 60, background: C.moss, color: "#fff",
      padding: "10px 16px", display: "flex", alignItems: "center", gap: 12 }}>
      <span style={{ flex: 1, minWidth: 0, fontSize: 13, lineHeight: 1.5 }}>
        새 버전이 있습니다 <span className="mono" style={{ opacity: .8, fontSize: 11 }}>{BUILD} → {build}</span>
      </span>
      {/* location.reload() 로는 아이폰 홈 화면 앱이 옛 화면을 그대로 내줍니다.
          주소에 시각을 붙여야 새로 받아옵니다. 설정의 "최신으로 받기"와 같은 방법입니다. */}
      <button className="press" onClick={() => { window.location.href = window.location.pathname + "?v=" + Date.now(); }}
        style={{ flex: "none", background: "#fff", color: C.moss, border: "none",
          borderRadius: 999, padding: "7px 14px", fontSize: 12.5, fontWeight: 600 }}>
        새로 받기
      </button>
    </div>
  );
}

function App() {
  const [st, setSt] = useState(DEFAULT_STATE);
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState("plan");
  const [me, setMe] = useState(window.__ME || "m1");
  const [toast, setToast] = useState(null);
  const newBuild = useNewBuild();
  const first = useRef(true);
  /* 가족이 고친 걸 받아 화면에 넣을 때, 그걸 다시 저장하지 않도록 한 번 건너뜁니다 */
  const skipSave = useRef(false);

  /* ── 나갈 말을 미리 구워둡니다 ──────────────────────
     서버(api/voice-send)는 이걸 읽어서 그대로 보냅니다.
     서버가 문장을 다시 만들면 부모가 미리보기에서 본 것과 달라질 수 있고,
     그러면 "내가 본 게 안 나갔다"가 됩니다.

     계획·그날 것·전화 설정이 바뀔 때만 다시 굽습니다.
     매번 구우면 저장이 계속 돌아 동기화가 시끄러워집니다. */
  const outboxKey = JSON.stringify([
    st.callOn, st.callMax, st.callAt, st.routineOut, st.routineCallUntil,
    st.callPlan, st.callToday, (st.elders || [])[0], (st.children || []).map((k) => [k.id, k.name]),
  ]);
  useEffect(() => {
    if (!ready) return;
    const next = bakeOutbox(st);
    if (JSON.stringify(next) === JSON.stringify(st.callOutbox || {})) return;
    setSt((sv) => ({ ...sv, callOutbox: next }));
  }, [outboxKey, ready]);

  useEffect(() => {
    (async () => {
      /* 저장 키는 앞으로 고정. 옛 버전 키가 남아 있으면 옮겨온다 */
      const KEYS = ["meonjeon", "meonjeon:v7", "household:v6", "household:v5"];
      for (const k of KEYS) {
        try {
          const r = await window.storage.get(k);
          if (r) {
            const loaded = scrubLegacy({ ...DEFAULT_STATE, ...JSON.parse(r.value) });
            /* 한 번 열 때 한 번만 셉니다 */
            setSt({ ...loaded, opens: (Number(loaded.opens) || 0) + 1 });
            break;
          }
        } catch {}
      }
      setReady(true);
    })();
  }, []);
  useEffect(() => {
    if (!ready) return;
    if (first.current) { first.current = false; return; }
    if (skipSave.current) { skipSave.current = false; return; }
    const t = setTimeout(() => { window.storage.set("meonjeon", JSON.stringify(st)).catch(() => {}); }, 500);
    return () => clearTimeout(t);
  }, [st, ready]);

  /* 가족이 다른 기기에서 고치면 여기로 들어옵니다.
     "새로고침" 버튼을 누르게 하지 않고 화면에 바로 반영합니다 */
  useEffect(() => {
    window.__applyRemote = (remote) => {
      if (!remote || !Object.keys(remote).length) return;
      skipSave.current = true;
      setSt((sv) => (JSON.stringify(sv) === JSON.stringify({ ...DEFAULT_STATE, ...remote }) ? sv : { ...DEFAULT_STATE, ...remote }));
    };
    return () => { delete window.__applyRemote; };
  }, []);

  const log = (name, props) => setSt((s) => ({ ...s, events: [...s.events.slice(-1200), { name, props, ts: Date.now() }] }));
  const say = (m) => { setToast(m); setTimeout(() => setToast(null), 2300); };
  /* AI를 한 번 씁니다. 상한에 닿으면 세지 않고 false를 돌려줘요 */
  const spendAI = (kind, n = 1) => {
    if (leftOf(st, kind) < n) return false;
    setSt((sv) => {
      const cur = (sv.aiUsage || {}).month === usageMonth() ? sv.aiUsage : { month: usageMonth(), talk: 0, photo: 0, find: 0 };
      return { ...sv, aiUsage: { ...cur, month: usageMonth(), [kind]: (cur[kind] || 0) + n } };
    });
    return true;
  };
  /* 실패한 호출은 돌려줍니다. AI가 답을 못 준 것까지 사용자 몫에서 깎으면 안 됩니다 */
  const refundAI = (kind, n = 1) => setSt((sv) => {
    const cur = (sv.aiUsage || {}).month === usageMonth() ? sv.aiUsage : null;
    if (!cur) return sv;
    return { ...sv, aiUsage: { ...cur, [kind]: Math.max((cur[kind] || 0) - n, 0) } };
  });
  /* 공유로 들어온 글은 말하기 화면으로 넘겨 바로 정리합니다.
     한 번만 합니다 — 화면을 다시 그릴 때마다 또 넣으면 같은 글이 쌓입니다. */
  const sharedUsed = useRef(false);
  useEffect(() => {
    if (!ready || !SHARED || sharedUsed.current) return;
    sharedUsed.current = true;
    setSt((sv) => ({ ...sv, draft: SHARED, draftRun: true, draftFrom: "share" }));
    setTab("speak");
    log("share_in", { chars: SHARED.length });
  }, [ready]);

  if (!ready) return (
    <div className="hae" style={{ background: C.bg, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: C.ink3, fontSize: 13 }}>
      <style dangerouslySetInnerHTML={{ __html: FONTS }} />불러오는 중…
    </div>
  );

  return (
    <Ctx.Provider value={{ st, setSt, me, setMe, say, log, spendAI, refundAI, tab, setTab }}>
      <div className="hae" style={{ background: C.bg, minHeight: "100vh", color: C.ink,
                                     transition: "background .35s ease", WebkitFontSmoothing: "antialiased" }}>
        <style dangerouslySetInnerHTML={{ __html: FONTS }} />
        <NewBuildBar build={newBuild} />
        <div style={{ maxWidth: 440, margin: "0 auto", paddingBottom: 100, position: "relative" }}>
          {(!st.onboarded || st.previewOnboarding) ? <Onboarding preview={!!st.onboarded} /> : (
            <>
              <Header />
              <div className="px-5">
                {tab === "plan" && <PlanTab />}
                {tab === "script" && <ScriptTab />}
                {tab === "speak" && <Speak />}
                {tab === "call" && <ElderScreen />}
                {tab === "set" && <Settings />}
              </div>
              <TabBar />
            </>
          )}
          {toast && <div className="rise" style={{ position: "fixed", bottom: 108, left: "50%", transform: "translateX(-50%)", background: C.ink, color: "#fff", fontSize: 13, padding: "11px 18px", borderRadius: 999, zIndex: 70, whiteSpace: "nowrap", boxShadow: SHADOW }}>{toast}</div>}
        </div>
      </div>
    </Ctx.Provider>
  );
}

  const PreviewBar = () => !preview ? null : (

                  fontSize: 12.5, lineHeight: 1.7, margin: "14px 0 2px" }}>

    </div>

  const STEPS = [
    { q: `${BRAND}에 오신 걸 환영해요.\n아이를 어른께 맡기시나요?`,

    { q: "아이가 누구인가요?",

    { q: "어느 분께 걸까요?",
      s: "호칭은 어른이 들으실 말로 적으세요. 번호는 그 어른 휴대폰이나 집전화입니다." },
    { q: "무엇을 알려드릴까요?",
      s: "요일마다 다른 것이 있으면 지금 하나만 넣어보세요. 나머지는 나중에 채우시면 됩니다." },
  ];
  const cur = STEPS[step];
  const kidsOk = kids.some((k) => k.name.trim());
  const elderOk = elder.label.trim() && elder.phone.trim();
  const canNext = step === 0 ? true : step === 1 ? kidsOk : step === 2 ? elderOk : true;
  const planN = Object.values(plan).reduce((a, v) => a + v.length, 0);

  const addRow = () => {
    const w = what.trim();
    if (!w) return;
    setPlan((p) => ({ ...p, [dow]: (p[dow] || []).concat([{ id: uid("cl"), time: time.trim(), what: w.slice(0, 30), kind: "sked", kid: (kids[0] || {}).id, alert: false }]) }));
    setTime(""); setWhat("");
  };

  const finish = (on) => {
    if (preview) { setSt((sv) => ({ ...sv, previewOnboarding: false })); say("미리보기였어요. 아무것도 안 바뀌었습니다"); return; }
    const cleanKids = kids.filter((k) => k.name.trim())
      .map((k) => ({ ...k, name: k.name.trim(), months: Number(k.age) ? Math.round(Number(k.age) * 12) : null }));
    setSt((sv) => ({
      ...sv,
      children: cleanKids,
      elders: on && elderOk ? [{ ...elder, label: elder.label.trim(), phone: elder.phone.trim() }] : [],
      callAt: at, callPlan: plan, callOn: !!on && elderOk,
      routineCallUntil: on && elderOk && firstWeeks ? Date.now() + 14 * DAY : 0,
      callOff: on ? 0 : Date.now(),
      onboarded: true,
    }));
    say(on ? "다 됐어요. 오늘 화면에서 나갈 말을 미리 보실 수 있어요" : "다 됐어요");
  };

  /* 그냥 둘러보시는 분께 빈 화면을 보여드리면 안 됩니다 — 뭘 하는 앱인지
     한눈에 안 보이니까요. 지호·할머니로 예시를 채워 넣어 조부모님 탭이
     실제로 어떻게 쓰이는지 미리 보여드립니다. callOn은 꺼둡니다 —
     가짜 번호로 전화가 나가면 안 됩니다. */
  const startExample = () => {
    if (preview) { setSt((sv) => ({ ...sv, previewOnboarding: false })); say("미리보기였어요. 아무것도 안 바뀌었습니다"); return; }
    const kidId = uid("k");
    const row = (t, w) => ({ id: uid("cl"), time: t, what: w, kind: "sked", kid: kidId, alert: false });
    setSt((sv) => ({
      ...sv,
      children: [{ id: kidId, name: "지호", age: "5", months: 60 }],
      elders: [{ id: uid("e"), label: "할머니", phone: "010-0000-0000", how: "call" }],
      callAt: at,
      callPlan: {
        "1": [row("15:00", "유치원 하원, 아파트 정문에서 데려와주세요")],
        "2": [row("16:00", "피아노학원 데려다주기")],
        "3": [row("15:00", "유치원 하원, 아파트 정문에서 데려와주세요")],
        "4": [row("16:00", "피아노학원 데려다주기")],
        "5": [row("15:00", "유치원 하원, 아파트 정문에서 데려와주세요")],
      },
      callOn: false, callOff: 0, onboarded: true, exampleSeed: true,
    }));
    say("예시로 채워봤어요. 마음대로 고치거나 지우고 새로 넣으셔도 됩니다");
  };

  return (
    <div className="px-5" style={{ paddingBottom: 40 }}>
      <PreviewBar />
      <div className="mono" style={{ fontSize: 10.5, color: C.moss, letterSpacing: ".1em", marginTop: 26 }}>
        {step + 1} / {STEPS.length}
      </div>
      <h1 className="disp" style={{ fontSize: 25, fontWeight: 600, lineHeight: 1.4, marginTop: 10, whiteSpace: "pre-line", letterSpacing: "-.02em" }}>
        {cur.q}
      </h1>
      <p style={{ fontSize: 13, color: C.ink3, marginTop: 11, lineHeight: 1.8 }}>{cur.s}</p>

      <div style={{ marginTop: 24 }}>
        {step === 0 && (
          <>
            <Btn kind="accent" onClick={() => setStep(1)}>네, 맡깁니다</Btn>
            <Btn kind="quiet" onClick={() => { setStep(1); }} style={{ marginTop: 6 }}>
              아직은 아니지만 곧 맡길 것 같아요
            </Btn>
            <button className="press" onClick={startExample}
              style={{ display: "block", width: "100%", marginTop: 10, background: "transparent", border: "none",
                       color: C.ink3, fontSize: 12.5, padding: "10px 0" }}>
              아직 몰라요 — 예시로 먼저 둘러볼게요
            </button>
          </>
        )}

        {step === 1 && (
          <>
            {/* 아이 하나에 딸린 칸을 한 덩어리로. 떨어져 있으면 둘째를 넣을 때 헷갈립니다 */}
            {kids.map((k, i) => (
              <div key={k.id} style={{ marginBottom: 14 }}>
                <input style={inp} placeholder={i === 0 ? "첫째 이름" : "이름"} value={k.name}
                  onChange={(e) => setKids((v) => v.map((x, ix) => ix === i ? { ...x, name: e.target.value.slice(0, 10) } : x))} />
                {k.name.trim() ? (
                  <>
                    {/* 나이는 고르는 것으로. 자유 입력이면 88도 들어갔습니다 */}
                    <div className="flex gap-1.5" style={{ marginTop: 8, flexWrap: "wrap" }}>
                      {["2", "3", "4", "5", "6", "7", "8", "9"].map((a2) => {
                        const on = String(k.age) === a2;
                        return (
                          <button key={a2} className="press"
                            onClick={() => setKids((v) => v.map((x) => x.id === k.id ? { ...x, age: on ? "" : a2 } : x))}
                            style={{ flex: 1, minWidth: 38, padding: "9px 0", borderRadius: 11, fontSize: 13,
                                     fontWeight: on ? 600 : 400,
                                     border: `1px solid ${on ? C.moss : C.line}`,
                                     background: on ? C.moss : "transparent",
                                     color: on ? "#fff" : C.ink3 }}>{a2}세</button>
                        );
                      })}
                    </div>
                    <div className="grid grid-cols-3 gap-2" style={{ marginTop: 8 }}>
                      <input style={inp} placeholder="학년" inputMode="numeric" value={k.grade || ""}
                        onChange={(e) => setKids((v) => v.map((x) => x.id === k.id ? { ...x, grade: e.target.value.replace(/\D/g, "").slice(0, 2) } : x))} />
                      <input style={{ ...inp, gridColumn: "span 2" }} placeholder={`${k.name.trim()} 반 (예: 16, 햇님)`} value={k.klass || ""}
                        onChange={(e) => setKids((v) => v.map((x) => x.id === k.id ? { ...x, klass: e.target.value.slice(0, 10) } : x))} />
                    </div>
                    {/* 집 앞이 아닙니다. 차 타는 곳을 모르시면 못 가십니다 */}
                    <input style={{ ...inp, marginTop: 8 }} placeholder="등하원 하는 곳 (예: 아파트 정문)" value={k.spot || ""}
                      onChange={(e) => setKids((v) => v.map((x) => x.id === k.id ? { ...x, spot: e.target.value.slice(0, 20) } : x))} />
                  </>
                ) : null}
              </div>
            ))}
            {kids.length < 4 && (
              <button className="press" onClick={() => setKids((v) => v.concat([{ id: uid("k"), name: "", age: "" }]))}
                style={{ background: "transparent", border: `1px dashed ${C.line}`, borderRadius: 12, width: "100%",
                         padding: "11px 0", fontSize: 13, color: C.ink3 }}>+ 아이 더 넣기</button>
            )}
            <p style={{ fontSize: 12, color: C.ink3, marginTop: 12, lineHeight: 1.7 }}>
              아이가 둘이어도 <b style={{ color: C.ink2 }}>전화는 한 통</b>입니다. 이름을 앞에 붙여 읽어드려요.<br />
              <b style={{ color: C.ink2 }}>안 넣으셔도 됩니다.</b> 넣어두시면 통신문 사진에서 그 반 줄만 뽑고,
              어른께 "아파트 정문에서 하원"처럼 <b style={{ color: C.ink2 }}>어디로 가실지</b>까지 읽어드립니다.
            </p>
          </>
        )}

        {step === 2 && (
          <>
            <div className="grid grid-cols-2 gap-2">
              <input style={inp} placeholder="호칭 (예: 할머니)" value={elder.label}
                onChange={(e) => setElder((v) => ({ ...v, label: e.target.value.slice(0, 10) }))} />
              <input style={inp} placeholder="전화번호" inputMode="tel" value={elder.phone}
                onChange={(e) => setElder((v) => ({ ...v, phone: e.target.value.replace(/[^\d-]/g, "").slice(0, 14) }))} />
            </div>
            {/* 어른이 안 받으시면 이 앱은 아무것도 아닙니다. 그리고 어른은
                저장 안 된 번호를 안 받으십니다. 화면에서 제일 중요한 자리입니다. */}
            <div style={{ marginTop: 14, background: C.sunSoft, borderRadius: 12, padding: "13px 15px", fontSize: 12.5, color: C.ink2, lineHeight: 1.8 }}>
              <b style={{ color: C.sun }}>시작 전에 꼭 하실 것</b><br />
              전화는 {callFromLabel()
                ? <><b style={{ color: C.ink }}>{callFromLabel()}</b>로</>
                : <><b style={{ color: C.ink }}>{BRAND} 번호 하나</b>로</>} 갑니다. 부모님 번호가 아닙니다.
              그 번호를 <b style={{ color: C.ink }}>어른 폰에 “{BRAND}”으로 저장</b>해 드리세요.
              <b style={{ color: C.ink }}>저장이 안 되어 있으면 모르는 번호라 안 받으십니다.</b><br />
              “앞으로 이 번호로 전화 갈 거야” 한마디도 꼭 해주세요.
            </div>
            {/* 정기일정은 전화하지 않습니다. 복직 초기라 아직 못 외우셨으면 첫 2주만 켭니다 */}
            <button className="press flex items-center gap-2" onClick={() => setFirstWeeks((v) => !v)}
              style={{ marginTop: 12, background: "transparent", border: "none", padding: 0, textAlign: "left" }}>
              <span style={{ width: 15, height: 15, borderRadius: 4, flexShrink: 0,
                             border: `1.5px solid ${firstWeeks ? C.moss : C.line}`, background: firstWeeks ? C.moss : "transparent",
                             color: "#fff", fontSize: 10, lineHeight: "13px", textAlign: "center" }}>{firstWeeks ? "✓" : ""}</span>
              <span style={{ fontSize: 13, color: firstWeeks ? C.ink2 : C.ink3 }}>복직 초기예요 — 첫 2주는 정기일정도 전화로</span>
            </button>
            <p style={{ fontSize: 12, color: C.ink3, marginTop: 6, lineHeight: 1.7 }}>
              평소 정기일정은 전화하지 않고 <b style={{ color: C.ink2 }}>달라지는 날만</b> 전화가 갑니다. 아직 못 외우셨으면 2주만 켜세요. 저절로 꺼집니다.
            </p>
          </>
        )}

        {step === 3 && (
          <>
            <div className="flex gap-1.5" style={{ marginBottom: 12 }}>
              {["1", "2", "3", "4", "5"].map((dv) => {
                const n = (plan[dv] || []).length;
                return (
                  <button key={dv} className="press" onClick={() => setDow(dv)}
                    style={{ flex: 1, padding: "9px 0", borderRadius: 12, fontSize: 13, fontWeight: dow === dv ? 600 : 400,
                             border: `1px solid ${dow === dv ? C.moss : C.line}`, background: dow === dv ? C.moss : "transparent",
                             color: dow === dv ? "#fff" : (n ? C.ink2 : C.ink3) }}>
                    {DOW_KR[Number(dv)]}{n ? <span style={{ fontSize: 10, marginLeft: 3, opacity: .8 }}>{n}</span> : null}
                  </button>
                );
              })}
            </div>
            {(plan[dow] || []).map((r) => (
              <div key={r.id} className="flex items-center gap-2.5" style={{ padding: "9px 0", borderBottom: `1px solid ${C.lineSoft}` }}>
                <span className="mono" style={{ fontSize: 12.5, color: C.moss, width: 46 }}>{r.time || "—"}</span>
                <span style={{ fontSize: 14, flex: 1 }}>{r.what}</span>
                <button className="press" onClick={() => setPlan((p) => ({ ...p, [dow]: p[dow].filter((x) => x.id !== r.id) }))}
                  style={{ background: "transparent", border: "none", color: C.ink3, fontSize: 12 }}>빼기</button>
              </div>
            ))}
            <div className="flex gap-2" style={{ marginTop: 12 }}>
              <input style={{ ...inp, width: 82, flexShrink: 0 }} placeholder="1430 (꼭)" value={time}
                onChange={(e) => setTime(e.target.value.slice(0, 8))}
                onBlur={() => setTime((v) => toTime(v) || v)} />
              <input style={inp} placeholder="태권도 데려다주기" value={what}
                onChange={(e) => setWhat(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") addRow(); }} />
              <button className="press" onClick={addRow}
                style={{ flexShrink: 0, padding: "0 16px", borderRadius: 12, background: C.moss, color: "#fff", border: "none", fontSize: 14, fontWeight: 600 }}>넣기</button>
            </div>
            <p style={{ fontSize: 12, color: C.ink3, marginTop: 12, lineHeight: 1.7 }}>
              약과 준비물은 나중에 <b style={{ color: C.ink2 }}>전화</b> 화면에서 넣으시면 됩니다.
              지금은 하나만 넣어보셔도 되고, 그냥 넘어가셔도 됩니다.
            </p>
          </>
        )}
      </div>

      {step > 0 && (
        <div style={{ marginTop: 26 }}>
          {step < STEPS.length - 1
            ? <Btn kind="accent" disabled={!canNext} onClick={() => setStep(step + 1)}>다음</Btn>
            : <Btn kind="accent" onClick={() => finish(true)}>{planN ? "다 됐어요" : "일단 이대로 시작하기"}</Btn>}
          <Btn kind="quiet" onClick={() => setStep(step - 1)} style={{ marginTop: 4 }}>← 뒤로</Btn>
        </div>
      )}
    </div>
  );
}

function Header() {
  const { st, me, setMe, tab, setTab } = use();
  const inSet = tab === "set";
  return (
    <div className="stick flex items-center justify-between px-5" style={{ paddingTop: 14, paddingBottom: 12 }}>
      <div className="flex items-center gap-2 min-w-0">
        <div className="disp" style={{ fontSize: 18, fontWeight: 700, letterSpacing: "-.035em" }}>{BRAND}</div>
        {st.members.length > 1 && (
          <span style={{ fontSize: 11, color: C.ink3, whiteSpace: "nowrap" }}>
            · {(st.members.find((m) => m.id === me) || {}).name} 화면
          </span>
        )}
      </div>
      <div className="flex items-center gap-1.5">
        {st.members.map((m) => (
          <button key={m.id} className="press" onClick={() => setMe(m.id)} aria-label={`${m.name} 화면으로 보기`}
            style={{ background: "none", border: "none", padding: 0, lineHeight: 0, opacity: me === m.id ? 1 : .28 }}>
            <Avatar member={m} size={28} />
          </button>
        ))}
        <button className="press" onClick={() => setTab(inSet ? "plan" : "set")} aria-label={inSet ? "설정 닫기" : "설정"}
          style={{ width: 30, height: 30, marginLeft: 4, borderRadius: 999, border: `1px solid ${inSet ? C.moss : C.line}`, background: inSet ? C.mossSoft : C.card, color: inSet ? C.moss : C.ink2, fontSize: 13 }}>{inSet ? "✕" : "⚙"}</button>
      </div>
    </div>
  );
}

/* ── 반복 업무 행 ─────────────────────────────── */

/* ── Task 행 ──────────────────────────────────── */

/* ── 생애주기 추천 카드 ───────────────────────── */

/* ── 휴일 날씨 브리핑 ─────────────────────────────
   금·토·일이나 연휴가 오면 그 전날에 한 번만 띄웁니다.
   금요일이 공휴일이면 자동으로 목요일에 뜹니다. */


/* ── 이사: 날짜를 넣으면 방별로 나눠 계획을 짭니다 ──
   한 번에 다 싸려니 못 하는 일이라, 역산해서 하루치로 쪼갭니다. */


/* ── 여행: 출국일을 넣으면 역산해서 나눕니다 ──────
   여행은 이사와 달리 "언제 가는지"를 앱이 알 방법이 없습니다.
   그래서 예전에는 여권·환전이 늘 "시점 미정"에만 있었고,
   정작 출국 두 주 전에는 아무것도 안 올라왔습니다.
   여기서 날짜를 한 번 적으면 아래 항목이 전부 그 날짜 기준으로 돕니다. */



/* ── 홈 ───────────────────────────────────────
   판단이 필요한 일은 3가지만. 매일 루틴은 체크리스트로 따로.
   나머지는 접어두고, 가족이 각자 자기 몫만 볼 수도 있게. */
function PlanTab() {
  const { st, setSt, setTab } = use();
  return (
    <>
      {/* "그냥 둘러볼게요"로 채운 예시 데이터. 지호·할머니는 실제 정보가 아니라
          목업이라, 실수로 이대로 전화가 나가면 안 됩니다 — callOn은 항상 꺼둡니다.
          지우는 길을 늘 보여줘야, 예시인지 모르고 진짜 정보인 척 쓰다가
          나중에 "지호가 누구예요"가 되지 않습니다. */}
      {st.exampleSeed && (
        <Card style={{ marginTop: 14, borderColor: C.moss }}>
          <div style={{ padding: 15 }}>
            <div style={{ fontSize: 13.5, fontWeight: 600 }}>지금 보시는 건 예시예요</div>
            <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 7, lineHeight: 1.75 }}>
              지호·할머니는 실제 정보가 아니라 어떻게 쓰는지 보여드리려고 넣은 예시예요.
              아래 조부모님 탭에서 어떻게 나가는지 미리 보시고, 준비되시면 우리 집 정보로 바꿔주세요.
            </div>
            <button className="press" onClick={() => setSt((sv) => ({ ...sv, children: [], elders: [], callPlan: {}, callOn: false, exampleSeed: false }))}
              style={{ marginTop: 11, background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "7px 13px", fontSize: 12, color: C.ink3 }}>
              예시 지우고 우리 집 정보 넣기
            </button>
          </div>
        </Card>
      )}

      {/* 처음 켜보시라는 안내. 조부모님 정보가 아직 없는 모든 집에 뜹니다.
          "안 맡긴다"고 하신 집에는 조용한 안내만, 나머지는 원래 카드를 보여줍니다. */}
      {!st.callOn && (st.elders || []).length === 0 && (
        st.callOff ? (
          <Card style={{ marginTop: 14, borderColor: C.lineSoft }}>
            <button className="press w-full text-left" onClick={() => setTab("set")}
              style={{ padding: 15, background: "transparent", border: "none" }}>
              <div style={{ fontSize: 13.5, fontWeight: 600 }}>📞 설정에서 어른을 넣으면 시작됩니다</div>
              <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 7, lineHeight: 1.75 }}>
                아이와 어른 정보를 넣어두시면, 요일마다 한 번만 계획을 넣고 매일 전화로 읽어드립니다.
              </div>
            </button>
          </Card>
        ) : (
          <Card style={{ marginTop: 14, borderColor: C.lineSoft }}>
            <div style={{ padding: 15 }}>
              <button className="press w-full text-left" onClick={() => setTab("set")} style={{ background: "transparent", border: "none", padding: 0 }}>
                <div style={{ fontSize: 13.5, fontWeight: 600 }}>📞 어른께 아이 일정을 대신 전해드릴까요</div>
                <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 7, lineHeight: 1.75 }}>
