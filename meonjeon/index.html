- 사람 이름·주민번호·차량번호·계좌번호·주소는 절대 옮기지 마세요.
- 여러 장이면 각각 다른 안내로 보고 따로 정리하세요.
- 식단표·시간표·교사 이름·교실 위치·연휴에 급식이 없다는 사실은 읽으면 끝나는 정보입니다. 담지 마세요.`;

    let gotAnswer = "";
    let lastErr = "";
    let callRows = [];   /* 어른께 갈 것 */
    let planRows = [];   /* 요일마다 되풀이될 것 — 붙여넣은 학원 시간표가 여기 옵니다 */
    let offAsk = false;  /* "내일 아빠 연차야" 같은 말. 끄지는 않고 물어보기만 합니다 */
    let offDays = [];    /* 방학·가정학습기간처럼 여러 날 안 맡기시는 것 */
    for (let i = 0; i < 2 && !gotAnswer && !callRows.length && !planRows.length && !offDays.length && !offAsk; i++) {
      try {
        const raw = await askClaude((i === 0 ? prompt : prompt + "\n\n(직전 응답이 비어 있었습니다. 다시 한 번 꼼꼼히 뽑으세요.)") + shotPrompt, shots.length ? shots : null, false);
        if (raw && !Array.isArray(raw)) {
          if (raw.answer) gotAnswer = String(raw.answer).slice(0, 400);
          if (Array.isArray(raw.call)) callRows = raw.call.filter((x) => x && x.what).slice(0, 6);
          if (Array.isArray(raw.plan)) planRows = raw.plan
            .filter((x) => x && x.what && Array.isArray(x.dows) && x.dows.length).slice(0, 20);
          if (raw.offDay === true) offAsk = true;
          if (Array.isArray(raw.offDays)) offDays = raw.offDays
            .map((x) => parseWhen(String(x || "")))
            .filter((d) => d && d >= todayKey())
            .filter((d, i2, a) => a.indexOf(d) === i2)
            .sort((a2, b2) => a2 - b2).slice(0, 30);
        }
      } catch (e) {
        /* 왜 안 됐는지 알려줘야 합니다. "실패했어요"만으로는 손쓸 수가 없어요 */
        lastErr = e && e.status === 401
          ? "로그인이 풀렸어요. 새로고침하고 다시 해주세요."
          : e && e.status === 413 ? "사진이 너무 커요. 화면 캡처는 잘라서 올려주세요."
          : e && e.message ? e.message : "";
      }
    }
    setAnswer(gotAnswer);
    /* 어른께 갈 것이 있으면 그날 것으로 담습니다. */
    if (callRows.length) {
      /* 줄마다 날짜가 다를 수 있습니다 — "금요일은 병원, 다음 주 월요일은 안 맡겨요" */
      const 담긴날 = [...new Set(callRows.map((x) => callDayFor(x.day, st)))].sort();
      setSt((sv) => {
        /* AI가 "카레 데워주기"를 약으로 분류한 일이 있었습니다. 프롬프트로 한 번 막았지만
           그것만 믿지 않습니다 — 밥·간식 낱말이 있고 약 낱말은 없으면 여기서 일정으로 되돌립니다. */
        const 음식말 = /카레|국|밥|죽|반찬|우유|분유|간식|주스|빵|과일|요거트|요구르트|계란|고기|생선|나물|김치|국수|라면|미음/;
        const 약말 = /약|시럽|연고|물약|가루약|정제|알약/;
        const rows = callRows.map((x) => {
          const w = callWhat(x.what);
          const 실제kind = x.kind === "med" && 음식말.test(w) && !약말.test(w) ? "sked" : x.kind;
          return {
            id: uid("cl"),
            day: callDayFor(x.day, sv),
            /* 00:00 은 "시각 모름"으로 봅니다. 아이 일정에 자정은 없습니다 */
            time: (() => { const t = toTime(x.time); return t === "00:00" ? "" : t; })(),
            what: w,
            why: String(x.why || "").trim().slice(0, 60),
            kind: ["sked", "med", "bag"].includes(실제kind) ? 실제kind : "sked",
            kid: ((sv.children || []).find((k) => k.name && k.name === String(x.who || "")) || {}).id
                 || ((sv.children || []).length === 1 ? (sv.children[0] || {}).id : ""),
            /* 시각이 있으면 항상 그 시각 앞에 따로 갑니다. 몇 분 전인지는 rowLead 기본값(30분 전) */
          };
        }).filter((r) => r.what);
        let ct = sv.callToday || {};
        담긴날.forEach((d) => {
          const mine = rows.filter((r) => r.day === d).map(({ day: _d, ...r }) => r);
          if (mine.length) ct = callMerge({ ...sv, callToday: ct }, d, mine);
        });
        return { ...sv, callToday: ct, callOn: true };
      });
      const 날말 = (d) => d === todayKey() ? "오늘" : d === todayKey() + DAY ? "내일"
        : `${DOW_KR[new Date(d).getDay()]}요일(${new Date(d).getMonth() + 1}/${new Date(d).getDate()})`;
      const when = 담긴날.length === 1 ? 날말(담긴날[0]) : 담긴날.map(날말).join("·");
      setJustCall({ day: 담긴날[0], when, label, offAsk });
      log("talk_to_call", { n: callRows.length });
    }
    /* 넣을 게 없어도 "쉬는 날?"은 물어봐야 합니다 */
    if (!callRows.length && offAsk) {
      setJustCall({ day: nextCallDay(st), when: nextCallDay(st) > todayKey() ? "내일" : "오늘", label, offAsk: true });
    }
    /* 요일 계획은 담기 전에 보여드립니다. 매주 되풀이될 것이라 한 번 잘못 들어가면 계속 나갑니다. */
    if (planRows.length) {
      setJustPlan(planRows.map((x) => ({
        id: uid("pl"),
        dows: x.dows.map(String).filter((d) => ["1", "2", "3", "4", "5"].includes(d)),
        time: toTime(x.time),
        what: callWhat(x.what),
        kid: ((st.children || []).find((k) => k.name && k.name === String(x.who || "")) || {}).id
             || ((st.children || []).length === 1 ? (st.children[0] || {}).id : ""),
      })).filter((r) => r.what && r.time && r.dows.length));
      log("talk_to_plan", { n: planRows.length });
    }
    if (offDays.length) { setJustOff(offDays); log("talk_to_offdays", { n: offDays.length }); }
    /* 아무것도 못 건졌으면 이번 시도는 없던 일로 하고 횟수를 돌려줍니다 */
    if (!gotAnswer && !callRows.length && !offAsk && !planRows.length && !offDays.length) { refundAI(kind, 1); setFailed(lastErr || true); }
    else setFailed(false);
    setShots([]);
    setPhase("result");
  };

  if (capped) {
    const left = leftOf(st, capped), lim = limitOf(st, capped);
    return (
      <>
        <div style={{ marginTop: 20, paddingLeft: 2 }}>
          <div className="disp" style={{ fontSize: 22, fontWeight: 600 }}>이번 달 {AI_LABEL[capped]}를 다 쓰셨어요</div>
          <p style={{ fontSize: 13.5, color: C.ink2, marginTop: 9, lineHeight: 1.75 }}>
            무료로 쓰시는 동안 한 달에 {lim}번까지 도와드리고 있어요. {nextResetLabel()}에 다시 채워집니다.
          </p>
        </div>
        <Card style={{ marginTop: 16, borderColor: C.moss }}>
          <div style={{ padding: 17 }}>
            <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 8 }}>그동안에도 그대로 나갑니다</div>
            <div style={{ fontSize: 13, color: C.ink2, lineHeight: 1.8 }}>
              일정 탭에 직접 적으신 것은 <b>횟수와 상관없이</b> 그대로 어른께 갑니다.
              말로 하면 AI가 대신 정리해주는 것만 잠깐 쉬는 거예요.
            </div>
          </div>
        </Card>
        <div style={{ marginTop: 18 }}>
          <Btn kind="accent" onClick={() => { setCapped(null); setTab("plan"); }}>일정 탭에서 직접 넣기</Btn>
        </div>
      </>
    );
  }

  if (phase === "thinking") return (
    <Card style={{ marginTop: 14 }}>
      <div style={{ padding: "48px 20px", textAlign: "center" }}>
        <div className="disp" style={{ fontSize: 17, fontWeight: 600, marginBottom: 22 }}>어른께 갈 것을 고르는 중</div>
        <div className="flex flex-wrap justify-center gap-2">
          {toFragments(text).map((w, i) => (
            <span key={i} className="frag" style={{ "--r": `${(i % 5) - 2}deg`, animationDelay: `${i * 90}ms`, background: C.bg, border: `1px solid ${C.line}`, borderRadius: 9, padding: "5px 9px", fontSize: 12, color: C.ink2 }}>{w}</span>
          ))}
        </div>
        <div className="mono" style={{ fontSize: 10.5, color: C.ink3, marginTop: 26 }}>누구께 · 몇 시에 · 전화인지 문자인지</div>
      </div>
    </Card>
  );

  if (phase === "result") return (
    <>
      <div style={{ marginTop: 20, paddingLeft: 2 }}>
        <div className="disp" style={{ fontSize: 22, fontWeight: 600 }}>
          {justCall && justCall.day
            ? `${justCall.label}께 ${callAllFor(st, justCall.day).length}개 담았어요`
            : answer ? "이렇게 답해드릴게요" : "어른께 갈 것이 없었어요"}
        </div>
        <p style={{ fontSize: 13.5, color: C.ink2, marginTop: 7, lineHeight: 1.65 }}>
          {answer || "시각이나 전화·문자를 바꾸시려면 일정 탭 요일 계획에서 그 줄을 누르세요."}
        </p>
        {justOff && justOff.length > 0 && (() => {
          const lab = ((st.elders || [])[0] || {}).label || "어른";
          const 이미끈 = justOff.filter((d) => ((st.callToday || {})[d] || {}).off);
          const 끌것 = justOff.filter((d) => !((st.callToday || {})[d] || {}).off);
          const 통수 = 끌것.reduce((a, d) => a + callBatches(st, d).length, 0);
          const 날짜 = (d) => `${new Date(d).getMonth() + 1}/${new Date(d).getDate()}(${DOW_KR[new Date(d).getDay()]})`;
          return (
            <Card style={{ marginTop: 14, borderColor: 끌것.length ? C.persim : C.line }}>
              <div style={{ padding: "14px 16px" }}>
                {끌것.length ? (
                  <>
                    <div style={{ fontSize: 13.5, fontWeight: 600, color: C.ink, marginBottom: 6 }}>
                      이 {끌것.length}일은 어떻게 하시나요?
                    </div>
                    <div style={{ fontSize: 12.5, color: C.ink2, lineHeight: 1.8, marginBottom: 9 }}>
                      {끌것.map(날짜).join(" · ")}
                    </div>
                    {/* 기관이 쉬는 것과 아이를 안 맡기는 것은 다릅니다.
                        기관이 쉬면 부모는 회사에 가야 하니 오히려 하루 종일 맡기십니다.
                        전에는 "끌까요"만 물었습니다. 그건 반대로 물은 것이었습니다. */}
                    <div style={{ fontSize: 12.5, color: C.ink3, lineHeight: 1.75, marginBottom: 11 }}>
                      <b style={{ color: C.ink2 }}>기관이 쉬는 것과 안 맡기시는 것은 다릅니다.</b>
                      기관이 쉬면 오히려 하루 종일 맡기시는 집이 많습니다.
                      {이미끈.length ? <><br />{이미끈.length}일은 이미 쉬는 날로 해두셨어요.</> : null}
                    </div>
                    <button className="press" onClick={() => {
                      setSt((sv) => {
                        const t = { ...(sv.callToday || {}) };
                        끌것.forEach((d) => {
                          /* 등하원만 빼고 나머지는 그대로 둡니다 — 점심·간식·약은 하루 종일이면 오히려 늘어납니다 */
                          const 등하원 = /등원|하원|등교|하교|데리러|데려다|데려오/;
                          const ids = callAllFor(sv, d).filter((r) => 등하원.test(callSpace(r.what))).map((r) => r.id);
                          const prev = (t[d] || {}).skip || [];
                          t[d] = { ...(t[d] || {}), off: false, skip: [...new Set([...prev, ...ids])] };
                        });
                        return { ...sv, callToday: t };
                      });
                      say(`${끌것.length}일은 하루 종일로 했어요. 등하원만 뺐습니다`);
                      log("offdays_allday", { n: 끌것.length });
                      setJustOff(null);
                    }}
                      style={{ width: "100%", background: C.mossSoft, color: C.moss, border: "none",
                               borderRadius: 12, padding: "11px 0", fontSize: 13.5, fontWeight: 600, marginBottom: 8 }}>
                      하루 종일 맡겨요 — 등하원만 빼기
                    </button>
                    <p style={{ fontSize: 11.5, color: C.ink3, lineHeight: 1.7, marginBottom: 9 }}>
                      맡기시는 날이 섞여 있으면 그대로를 누르세요 —
                      <b style={{ color: C.ink2 }}>안 나가는 쪽이 더 위험합니다.</b> 잘못 끄면 그날 하원을 아무도 안 갑니다.
                    </p>
                    <div className="flex gap-2">
                      <button className="press" onClick={() => {
                        setSt((sv) => {
                          const t = { ...(sv.callToday || {}) };
                          끌것.forEach((d) => { t[d] = { ...(t[d] || {}), off: true }; });
                          return { ...sv, callToday: t };
                        });
                        say(`${끌것.length}일을 쉬는 날로 했어요`);
                        log("offdays_accept", { n: 끌것.length });
                        setJustOff(null);
                      }}
                        style={{ flex: 1, background: C.persimSoft, color: C.persim, border: "none",
                                 borderRadius: 12, padding: "11px 0", fontSize: 13.5, fontWeight: 600 }}>
                        이 날은 안 맡겨요
                      </button>
                      <button className="press" onClick={() => setJustOff(null)}
                        style={{ flex: 1, background: "transparent", color: C.ink2, border: `1px solid ${C.line}`,
                                 borderRadius: 12, padding: "11px 0", fontSize: 13.5 }}>
                        아니요, 그대로
                      </button>
                    </div>
                    <p style={{ fontSize: 11.5, color: C.ink3, marginTop: 9, lineHeight: 1.7 }}>
                      하루만 다르면 <b style={{ color: C.ink2 }}>부모님</b> 탭의 요일 계획에서 그 요일을 골라 되돌리시면 됩니다.
                    </p>
                  </>
                ) : (
                  <div style={{ fontSize: 13, color: C.ink2, lineHeight: 1.75 }}>
                    <b style={{ color: C.ink }}>{justOff.length}일 다 이미 쉬는 날입니다.</b> 더 끌 것이 없어요.
                    <button className="press" onClick={() => setJustOff(null)}
                      style={{ display: "block", marginTop: 9, background: "transparent",
                               border: `1px solid ${C.line}`, borderRadius: 999, padding: "6px 13px",
                               fontSize: 12, color: C.ink2 }}>닫기</button>
                  </div>
                )}
              </div>
            </Card>
          );
        })()}
        {justPlan && justPlan.length > 0 && (() => {
          const 이름 = (kid) => ((st.children || []).find((c) => c.id === kid) || {}).name || "";
          const 하나 = (st.children || []).length <= 1;
          /* 요일을 통째로 보고 있었습니다. 월에는 있고 수에는 없으면
             "새것"이 되어 월에 하나가 더 들어갑니다. 요일마다 따로 봅니다. */
          const 있나 = (r, d) => ((st.callPlan || {})[d] || [])
            .some((x) => callKey(x) === callKey(r) && x.time === r.time);
          const 새것 = justPlan
            .map((r) => ({ ...r, dows: (r.dows || []).filter((d) => !있나(r, d)) }))
            .filter((r) => r.dows.length);
          return (
            <Card style={{ marginTop: 14, borderColor: C.moss }}>
              <div style={{ padding: "14px 16px" }}>
                <div style={{ fontSize: 13.5, fontWeight: 600, color: C.moss, marginBottom: 4 }}>
                  ☏ 요일마다 되풀이될 것 {새것.length}개
                </div>
                <div style={{ fontSize: 12, color: C.ink3, marginBottom: 10, lineHeight: 1.7 }}>
                  담으면 <b style={{ color: C.ink2 }}>매주 저절로</b> 나갑니다. 한 번만 넣으시면 됩니다.
                </div>
                {새것.map((r) => (
                  <div key={r.id} className="flex items-center justify-between"
                    style={{ padding: "7px 0", borderTop: `1px solid ${C.lineSoft}` }}>
                    <span style={{ fontSize: 13.5, color: C.ink }}>
                      <b className="mono" style={{ fontSize: 11.5, color: C.moss, marginRight: 7, fontWeight: 500 }}>
                        {r.dows.map((d) => DOW_KR[Number(d)]).join("·")} {r.time}
                      </b>
                      {!하나 && 이름(r.kid) ? 이름(r.kid) + " " : ""}{r.what}
                    </span>
                    <button className="press" onClick={() => setJustPlan((v) => v.filter((x) => x.id !== r.id))}
                      style={{ background: "transparent", border: "none", color: C.ink3, fontSize: 12 }}>빼기</button>
                  </div>
                ))}
                {!새것.length && (
                  <div style={{ fontSize: 12.5, color: C.ink3, padding: "6px 0" }}>
                    다 이미 들어 있습니다. 더 담을 것이 없어요.
                  </div>
                )}
                <div className="flex gap-2" style={{ marginTop: 11 }}>
                  <button className="press" disabled={!새것.length} onClick={() => {
                    setSt((sv) => {
                      const plan = { ...(sv.callPlan || {}) };
                      새것.forEach((r) => r.dows.forEach((d) => {
                        plan[d] = (plan[d] || []).concat([{
                          id: uid("cl"), time: r.time, what: r.what,
                          kind: "sked", kid: r.kid }]);
                      }));
                      return { ...sv, callPlan: plan, callOn: true };
                    });
                    say(`요일 계획에 ${새것.length}개 담았어요`);
                    log("plan_accept", { n: 새것.length });
                    setJustPlan(null);
                  }}
                    style={{ flex: 1, background: 새것.length ? C.moss : C.line, color: "#fff", border: "none",
                             borderRadius: 12, padding: "11px 0", fontSize: 13.5, fontWeight: 600 }}>
                    요일 계획에 담기
                  </button>
                  <button className="press" onClick={() => setJustPlan(null)}
                    style={{ flex: 1, background: "transparent", color: C.ink2, border: `1px solid ${C.line}`,
                             borderRadius: 12, padding: "11px 0", fontSize: 13.5 }}>
                    안 담기
                  </button>
                </div>
              </div>
            </Card>
          );
        })()}
        {justCall && justCall.offAsk && (() => {
          const day = justCall.day;
          const off = ((st.callToday || {})[day] || {}).off;
          const n = off ? 0 : callBatches(st, day).length;
          return (
            <Card style={{ marginTop: 14, borderColor: off ? C.line : C.persim }}>
              <div style={{ padding: "14px 16px" }}>
                {off ? (
                  <>
                    <div style={{ fontSize: 13.5, color: C.ink2, lineHeight: 1.75 }}>
                      <b style={{ color: C.ink }}>{justCall.when}은 쉽니다.</b> {justCall.label}께 아무것도 안 갑니다.
                    </div>
                    <button className="press" onClick={() => setSt((sv) => {
                      const t = { ...(sv.callToday || {}) }; t[day] = { ...(t[day] || {}), off: false };
                      return { ...sv, callToday: t };
                    })} style={{ marginTop: 10, background: "transparent", border: `1px solid ${C.line}`, borderRadius: 999, padding: "7px 14px", fontSize: 12.5, color: C.ink2 }}>
                      다시 켜기
                    </button>
                  </>
                ) : (
                  <>
                    <div style={{ fontSize: 13.5, color: C.ink, fontWeight: 600, marginBottom: 6 }}>
                      {justCall.when}은 안 맡기시나요?
                    </div>
                    <div style={{ fontSize: 12.5, color: C.ink3, lineHeight: 1.75, marginBottom: 11 }}>
                      그렇게 들려서 여쭙니다. <b style={{ color: C.ink2 }}>끄면 {justCall.label}께 갈 {n}건이 안 나갑니다.</b><br />
                      연차셔도 아이는 그대로 맡기시는 날이면 그냥 두세요 —

                    </div>
                    <div className="flex gap-2">
                      <button className="press" onClick={() => { setSt((sv) => {
                        const t = { ...(sv.callToday || {}) }; t[day] = { ...(t[day] || {}), off: true };
                        return { ...sv, callToday: t };
                      }); say(`${justCall.when}은 쉬는 것으로 했어요`); log("call_off_day", {}); }}
                        style={{ flex: 1, background: C.persimSoft, color: C.persim, border: "none", borderRadius: 12, padding: "11px 0", fontSize: 13.5, fontWeight: 600 }}>
                        네, 하루 다 쉽니다
                      </button>
                      <button className="press" onClick={() => setJustCall((v) => ({ ...v, offAsk: false }))}
                        style={{ flex: 1, background: "transparent", color: C.ink2, border: `1px solid ${C.line}`, borderRadius: 12, padding: "11px 0", fontSize: 13.5 }}>
                        아니요, 그대로
                      </button>
                    </div>
                    {/* 반차가 제일 흔합니다. 오전 반차면 등원만 빠지고 하원은 그대로예요.
                        하루를 통째로 끄면 하원이 같이 꺼져서, 그게 제일 위험한 실수입니다. */}
                    <button className="press" onClick={() => setJustCall((v) => ({ ...v, part: !v.part }))}
                      style={{ width: "100%", marginTop: 8, background: "transparent", color: C.moss, border: "none", padding: "8px 0", fontSize: 12.5, fontWeight: 600 }}>
                      {justCall.part ? "접기" : "반차라 몇 개만 뺄게요"}
                    </button>
                    {justCall.part && (() => {
                      const all = callAllFor(st, day);
                      const skip = ((st.callToday || {})[day] || {}).skip || [];
                      if (!all.length) return (
                        <div style={{ fontSize: 12.5, color: C.ink3, padding: "4px 2px 2px" }}>
                          {justCall.when} {justCall.label}께 갈 것이 없습니다.
                        </div>
                      );
                      return (
                        <div style={{ borderTop: `1px solid ${C.lineSoft}`, paddingTop: 8 }}>
                          <div style={{ fontSize: 11.5, color: C.ink3, marginBottom: 7 }}>
                            뺄 것을 눌러주세요. 나머지는 그대로 나갑니다.
                          </div>
                          <div className="flex flex-col gap-1">
                            {all.map((r) => {
                              const gone = skip.indexOf(r.id) >= 0;
                              return (
                                <button key={r.id} className="press" onClick={() => setSt((sv) => {
                                  const t = { ...(sv.callToday || {}) };
                                  const cur = (t[day] || {}).skip || [];
                                  const next = gone ? cur.filter((x) => x !== r.id) : cur.concat([r.id]);
                                  t[day] = { ...(t[day] || {}), skip: next };
                                  return { ...sv, callToday: t };
                                })}
                                  style={{ display: "flex", alignItems: "center", gap: 8, textAlign: "left",
                                           background: gone ? C.lineSoft : "transparent",
                                           border: `1px solid ${gone ? C.line : C.lineSoft}`,
                                           borderRadius: 10, padding: "8px 10px", fontSize: 13,
                                           color: gone ? C.ink3 : C.ink,
                                           textDecoration: gone ? "line-through" : "none" }}>
                                  <span style={{ fontSize: 11.5, color: gone ? C.ink3 : C.moss, minWidth: 42, fontWeight: 600 }}>
                                    {/^\d{1,2}:\d{2}$/.test(String(r.time || "")) ? r.time : "시각없음"}
                                  </span>
                                  <span style={{ flex: 1 }}>{r.what}</span>
                                  <span style={{ fontSize: 11.5, color: C.ink3 }}>{gone ? "뺐음" : "뺄까요"}</span>
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })()}
                  </>
                )}
              </div>
            </Card>
          );
        })()}
        {justCall && (() => {
          /* 말씀하신 것만 보여주고 있었습니다. 그래서 "이렇게 갑니다" 아래에
             요일 계획은 안 보이고, 순서도 말한 차례 그대로였습니다.
             실제로 나갈 것을 시간순으로 그대로 보여줍니다. */
          const rows = callItemsFor(st, justCall.day);
          if (!rows.length) return null;
          return (
            <Card style={{ marginTop: 14, borderColor: C.moss }}>
              <div style={{ padding: "14px 16px" }}>
                <div style={{ fontSize: 13.5, fontWeight: 600, color: C.moss, marginBottom: 9 }}>
                  ☏ {justCall.when} {justCall.label}께 이렇게 갑니다
                </div>
                {rows.map((r) => (
                  <div key={r.id} className="flex items-center justify-between" style={{ padding: "7px 0", borderTop: `1px solid ${C.lineSoft}` }}>
                    <span style={{ fontSize: 13.5, color: C.ink }}>
                      <b className="mono" style={{ fontSize: 11.5, color: C.moss, marginRight: 7, fontWeight: 500 }}>
                        {r.kind === "bag" ? "가방" : r.kind === "med" ? "약" : (r.time || "—")}
                      </b>
                      {r.what}
                    </span>
                    {/* 말씀해서 담긴 것은 지우고, 요일 계획에서 온 것은 그날만 빼둡니다.
                        계획을 지워버리면 다음 주 화요일 하원까지 같이 사라집니다. */}
                    <button className="press" onClick={() => setSt((sv) => {
                      const t = { ...(sv.callToday || {}) };
                      const cur = t[justCall.day] || {};
                      const 말한것 = (cur.add || []).some((x) => x.id === r.id);
                      t[justCall.day] = 말한것
                        ? { ...cur, add: (cur.add || []).filter((x) => x.id !== r.id) }
                        : { ...cur, skip: (cur.skip || []).concat([r.id]) };
                      return { ...sv, callToday: t };
                    })} style={{ background: "transparent", border: "none", color: C.ink3, fontSize: 12 }}>빼기</button>
                  </div>
                ))}
                <button className="press" onClick={() => setTab("plan")}
                  style={{ marginTop: 11, background: "transparent", border: `1px solid ${C.line}`, borderRadius: 999, padding: "7px 14px", fontSize: 12.5, color: C.ink2 }}>
                  시각·말투 고치기
                </button>
              </div>
            </Card>
          );
        })()}
        {failed && <div style={{ marginTop: 12, background: C.sunSoft, color: C.sun, borderRadius: 12, padding: "11px 13px", fontSize: 12.5, lineHeight: 1.7 }}>
          {typeof failed === "string" ? failed : "이번엔 못 알아들었어요."} 아무것도 담지 않았습니다 — 횟수도 안 깎였어요.
          시각과 무엇을 하실지 같이 말씀해 보세요. 예: “내일 3시 소아과”
        </div>}
      </div>

      <div style={{ marginTop: 24 }}>
        <Btn onClick={() => setPhase("input")}>확인</Btn>
        <div style={{ height: 8 }} />
        <Btn kind="ghost" onClick={() => setPhase("input")}>다시 말하기</Btn>
      </div>
      <div style={{ height: 40 }} />
    </>
  );

  return (
    <>
      <div style={{ marginTop: 18, paddingLeft: 2 }}>
        <div className="disp" style={{ fontSize: 24, fontWeight: 600, lineHeight: 1.38, letterSpacing: "-.03em" }}>그날 달라지는 것만<br />말하세요</div>
        <p style={{ fontSize: 13.5, color: C.ink2, marginTop: 10, lineHeight: 1.7 }}>매주 같은 것은 일정 탭에 있습니다. 여기는 병원, 준비물, 오늘만 다른 것.</p>
      </div>

      <Card style={{ marginTop: 16 }}>
        <div style={{ padding: 18 }}>
          <div className="flex justify-center" style={{ position: "relative", height: 96, marginBottom: 4 }}>
            {listening && <span className="ring" style={{ position: "absolute", top: 8, width: 80, height: 80, borderRadius: 999, border: `2px solid ${C.moss}` }} />}
            <button className="press" onClick={listening ? stopMic : startMic} aria-label={listening ? "멈추기" : "말하기"}
              style={{ width: 80, height: 80, borderRadius: 999, marginTop: 8, background: listening ? C.persim : C.moss, color: "#fff", border: "none", fontSize: 26, boxShadow: SHADOW_LIFT }}>{listening ? "■" : "🎙"}</button>
          </div>
          {fromShare && (
            <div style={{ marginTop: 12, background: C.mossSoft, color: C.moss, borderRadius: 12, padding: "11px 13px", fontSize: 12.5, lineHeight: 1.7 }}>
              <b>카톡·문자에서 받은 글입니다.</b> 날짜와 준비물을 뽑아 담아둘게요.
            </div>
          )}
          <textarea className="hae" value={text} onChange={(e) => setText(e.target.value)} rows={4}
            placeholder="내일 달라지는 것을 말씀하세요. 띄어쓰기는 안 맞아도 됩니다. 알림장 캡처는 붙여넣기 해도 돼요."
            style={{ width: "100%", border: `1px solid ${C.line}`, borderRadius: R.md, padding: 14, fontSize: 14.5, lineHeight: 1.65, resize: "none", background: C.bg, color: C.ink }} />
          {note && <div style={{ fontSize: 12.5, color: C.persim, marginTop: 9 }}>{note}</div>}

          {/* 매주 같은 것은 부모님 탭 요일 계획에 한 번 넣으면 끝입니다. 여기는 그날 어긋난 것만 받습니다.
              그 선을 흐리면 부모가 매일 여기에 들어와 다시 적게 되고,
              그러면 전화로 대신 말해주기로 한 뜻이 없어집니다.
              병명을 적는 칸은 안 만들었지만 말로는 들어옵니다. 안 적어도 된다는 것만 알립니다. */}
          <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 9, lineHeight: 1.7 }}>
            어른께 갈 것과 내가 챙길 것을 앱이 갈라 담습니다. 섞어 말씀하셔도 돼요.
            여기서 말한 것은 <b style={{ color: C.ink2 }}>전화</b>로 갑니다 — 시각이 있으면 그 시각 앞에, 없으면 바로. 매주 같은 것은 일정 탭에 두세요.
          </div>

          {shots.length > 0 && (
            <div className="rail" style={{ marginTop: 11 }}>
              {shots.map((sh, i) => (
                <div key={i} style={{ position: "relative" }}>
                  <img src={`data:${sh.media_type};base64,${sh.data}`} alt="" style={{ width: 66, height: 66, objectFit: "cover", borderRadius: R.xs, border: `1px solid ${C.line}` }} />
                  <button onClick={() => setShots((v) => v.filter((_, k) => k !== i))} aria-label="빼기"
                    style={{ position: "absolute", top: -6, right: -6, width: 20, height: 20, borderRadius: 99, background: C.ink, color: "#fff", border: "none", fontSize: 11 }}>×</button>
                </div>
              ))}
            </div>
          )}

          <div className="rail" style={{ marginTop: 12 }}>
            <button className="press" onClick={pickPhoto}
              style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "9px 14px", fontSize: 12, color: C.ink2 }}>📄 알림장·학원 문자 캡처</button>
            {/* 아이폰은 공유 목록에 앱이 못 뜹니다(애플이 규격을 지원하지 않습니다).
                그래서 카톡에서 글을 복사해 오는 길을 따로 둡니다. */}
            <button className="press" onClick={async () => {
              try {
                const t = await navigator.clipboard.readText();
                if (!t || !t.trim()) return setNote("복사해둔 글이 없어요. 카톡에서 메시지를 길게 눌러 복사한 뒤 다시 눌러주세요.");
                setText((v) => (v ? v + "\n" : "") + t.trim().slice(0, 4000));
                setFromShare(true); setNote("");
              } catch {
                setNote("붙여넣기 권한이 막혀 있어요. 위 칸을 길게 눌러 붙여넣기 하셔도 결과는 같습니다.");
              }
            }} style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "9px 14px", fontSize: 12, color: C.ink2 }}>📋 카톡 글 붙여넣기</button>
          </div>
          {/* 무엇까지 말해도 되는지 모르면 아무것도 안 넣으십니다. 눌러서 고쳐 쓰시라고 둡니다 */}
          <div style={{ marginTop: 12 }}>
            <div className="mono" style={{ fontSize: 10, color: C.ink3, letterSpacing: ".09em", marginBottom: 7 }}>
              평소와 달라지는 것을 이렇게 — 눌러서 고쳐 쓰세요
            </div>
            <div className="flex gap-1.5" style={{ flexWrap: "wrap" }}>
              {SPEAK_EX.slice(0, 6).map(([lb, tx]) => (
                <button key={lb} className="press"
                  onClick={() => { setText(tx); setNote("예시를 넣었어요. 우리 집에 맞게 고쳐서 넣기를 누르세요."); }}
                  style={{ background: "transparent", border: `1px solid ${C.line}`, borderRadius: R.pill,
                           padding: "7px 12px", fontSize: 12, color: C.ink2 }}>{lb}</button>
              ))}
              {/* 칩만 스무 개면 벽이 됩니다. 나머지는 문장까지 펼쳐서 읽으실 수 있게 */}
              <button className="press" onClick={() => setAllEx((v) => !v)}
                style={{ background: allEx ? C.mossSoft : "transparent", border: `1px solid ${allEx ? C.mossSoft : C.line}`,
                         borderRadius: R.pill, padding: "7px 12px", fontSize: 12, color: allEx ? C.moss : C.ink3 }}>
                {allEx ? "접기" : `예시 ${SPEAK_EX.length}가지 다 보기`}
              </button>
            </div>
            {allEx && (
              <Card style={{ marginTop: 10 }}>
                <div style={{ padding: "4px 15px" }}>
                  {SPEAK_EX.map(([lb, tx], i2, a2) => (
                    <button key={lb} className="press"
                      onClick={() => { setText(tx); setAllEx(false); setNote("예시를 넣었어요. 우리 집에 맞게 고쳐서 넣기를 누르세요."); }}
                      style={{ display: "block", width: "100%", textAlign: "left", background: "none", border: "none",
                               padding: "12px 0", borderBottom: i2 === a2.length - 1 ? "none" : `1px solid ${C.lineSoft}` }}>
                      <div className="mono" style={{ fontSize: 10.5, color: C.moss, letterSpacing: ".06em", marginBottom: 4 }}>{lb}</div>
                      <div style={{ fontSize: 13, color: C.ink2, lineHeight: 1.75 }}>{tx}</div>
                    </button>
                  ))}
                </div>
              </Card>
            )}
          </div>
          <input ref={fileRef} type="file" accept="image/*" multiple style={{ display: "none" }} onChange={onFiles} />
          <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 9, lineHeight: 1.65 }}>
            알림장·가정통신문·학원 문자 캡처를 읽어 <b style={{ color: C.ink2 }}>날짜와 준비물</b>만 뽑습니다.
            그게 그대로 어른께 갈 말이 됩니다.<br />
            {/* 종이를 찍으면 그림자와 각도 때문에 글자가 뭉갭니다.
                화면 캡처는 글자가 그대로라 훨씬 잘 읽힙니다. */}
            화면 캡처가 사진보다 잘 읽힙니다. 종이를 찍으면 그림자와 각도 때문에 글자가 뭉개져요.
            키즈노트·문자는 캡처하시고, 종이만 있을 때는 평평하게 펴서 위에서 찍어주세요.
          </div>
          {st.plan !== "paid" && leftOf(st, "talk") <= 5 && (
            <div style={{ fontSize: 11.5, color: leftOf(st, "talk") ? C.ink3 : C.persim, marginTop: 10, lineHeight: 1.65 }}>
              {leftOf(st, "talk")
                ? `이번 달 AI 정리 ${leftOf(st, "talk")}번 남았어요 · ${nextResetLabel()}에 다시 채워집니다`
                : `이번 달 AI 정리를 다 쓰셨어요. 직접 적으시면 그대로 챙깁니다 · ${nextResetLabel()}에 다시 채워집니다`}
            </div>
          )}
          {hasShot && <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 9, lineHeight: 1.6 }}>
            사진은 크기를 줄여 AI에 보내고 <b style={{ color: C.ink2 }}>앱에는 저장하지 않습니다</b>. 뽑아낸 할 일만 남아요.
          </div>}

          <div style={{ height: 14 }} />
          <Btn onClick={() => analyze()}>{shots.length ? "사진까지 같이 정리해줘" : "정리해줘"}</Btn>
        </div>
      </Card>

    </>
  );
}


/* ── 영역(카테고리) ───────────────────────────── */
/* 광고는 무료 사용자에게만, 유료 전환 뒤에 켭니다.
   지금은 자리만 잡아두고 아무것도 안 그립니다 —
   베타에 광고를 넣으면 유지율 숫자가 오염됩니다.
   켤 때 지킬 것: 복지 안내 옆에는 절대 붙이지 않습니다. */
/* 광고를 붙일 때 지킬 것 (2027년 6월, live로 바꿀 때 설정합니다)

   ① 이 자리(영역 탭)에만 붙입니다. 유용정보 카드 안에는 안 붙입니다 —
      거기는 앱이 "이거 챙기세요"라고 말한 자리라, 바로 아래 광고가 붙으면
      앱이 한 말까지 광고로 읽힙니다. 지금은 noAd로 막아뒀습니다.
   ② 배너에 "광고" 표시가 있어야 합니다. 앱이 하는 말과 구분되어야 합니다.
   ③ 그날 유용정보에 뜬 물건과 같은 품목은 광고에서 뺍니다.
      한복 카드를 띄운 날 한복 광고가 뜨면, 바로 위의
      "집에 있는지 먼저 보세요"가 우스워집니다.
      AdMob 카테고리 차단으로 막습니다. */


/* 마트에서 동선이 다릅니다. 먹을 것과 생활용품을 섞어두면
   한 줄씩 훑으며 왔다 갔다 하게 됩니다. 이름만 보고 갈라둡니다.
   틀려도 살 것 목록에서 자리만 바뀌는 정도라 위험하지 않습니다. */

/* 늘 두고 쓰는 것들. 이게 있어야 "토마토소스 있으니 파스타" 같은 조합이 나옵니다.
   재료는 먹으면 없어지지만 이건 떨어질 때까지 계속 있습니다. */

/* ── 장보기와 식단 ────────────────────────────────
   "뭐 먹지"와 "뭐 사야 하지"는 사실 같은 고민입니다. 한 화면에 둡니다.
   영수증을 찍으면 산 재료를 읽어 손질할 일과 식단 후보를 함께 냅니다.
   고른 것만 남기고 나머지는 지웁니다. */

/* ── 날짜를 아는 것에서 역산 ─────────────────────────
   AHEAD는 행사 날짜를 모르는 경우입니다(달력 월로만 띄웁니다).
   생일·기념일은 반대로 날짜가 확정된 몇 안 되는 것이라, 역산이 정확히 됩니다.

   그래서 경조사에 날짜를 넣는 이유가 "안 까먹으려고"가 아닙니다.
   생일은 안 까먹습니다. 까먹는 건 그 준비를 언제 시작해야 싼가입니다. */

/* 사이즈 위험이 붙은 것에는 "한 사이즈 크게"를 빠뜨릴 수 없게 여기서 붙입니다.
   문구를 손으로 적다 보면 언젠가 한 줄을 빠뜨립니다. */


/* ── 유용정보 ─────────────────────────────────
   복지는 마감이 없습니다. 날짜를 붙이면 "시점 미정"만 쌓이고,
   할 일로 담으면 목록이 읽을 수 없게 길어집니다.
   여기서는 갈래별로 띄워두기만 합니다 — 해당되니 알아보세요, 까지입니다.

   흩어져 있던 것을 걷었습니다. 예전에는 같은 항목이 영역에도,
   타임라인에도, 맡기기에도 있었습니다. 이제 이 한 화면뿐입니다. */

/* ④ 사기 전에 순서를 제안합니다.
   이 앱이 쇼핑앱과 갈라지는 지점입니다. "안 사도 되는 걸 안 사게 해준다"가
   사람들이 이 앱을 믿는 이유고, 그걸 깨면 남을 이유가 없어집니다.
   그래서 구매는 맨 아래에 둡니다.

   외동은 "물려받기" 칸이 비어 있습니다. 형제가 없으니까요.
   그 집에는 대여와 당근이 더 중요합니다. */

/* 쓰는 날을 넣으면 하루 전에 알립니다.
   유용정보는 할 일을 안 만드는 자리입니다. 다만 사용자가 날짜를 직접 넣은 것은
   앱이 짐작한 것이 아니라 사용자가 정한 것이라, 그때는 할 일이 되어도 됩니다.
   가정통신문 사진으로 날짜가 확정될 때와 같은 규칙입니다. */

/* ── 설정 + 베타 지표 (UX-11) ─────────────────── */
/* 자동차 검사·보험 시점 —
   보험사·검사기관 API는 본인인증 없이는 열리지 않습니다. 그래서 연동 대신
   최초등록 연월과 보험 갱신월만 한 번 받고, 날짜는 법정 주기로 계산합니다. */
/* 차마다 검사일도 보험 갱신 달도 다릅니다. 한 대씩 따로 받습니다. */

/* 자동차 검사·보험 시점 —
   보험사·검사기관 API는 본인인증 없이는 열리지 않습니다. 그래서 연동 대신
   최초등록 연월과 보험 갱신월만 한 번 받고, 날짜는 법정 주기로 계산합니다. */

/* ── 어른께 전화 ───────────────────────────────────
   부모가 보는 화면입니다. 어른은 이 화면을 못 보십니다 — 볼 필요도 없고요.
   요일별로 한 번 넣어두면 앱이 매일 아침 대신 읽어드립니다. */
/* ── 요일마다 되풀이될 것을 정하는 곳 ────────────────
   전에는 '전하기' 안에 있었습니다. 그런데 이건 어른께 가는 것이 아니라
   부모가 한 번 앉아서 정하는 일입니다. 어른 화면과 섞여 있으니
   같은 것이 두 탭에 나와 헷갈렸습니다. 부모 쪽으로 옮겼습니다. */
function PlanEditor() {
  const { st, setSt, say, log } = use();
  /* 조부모님 탭은 "다음 전화 날"을 보지만, 여기는 계획을 손보는 곳이라 "오늘 요일"로 엽니다.
     전에는 다음 전화 날로 열어서, 아침 7:50이 지나면 내일 요일이 골라져 있었습니다 —
     수요일 오후에 열면 목요일이 비어 있고, 오늘 넣은 것도 안 보였습니다. 주말이면 월요일. */
  const 오늘요일 = new Date().getDay();
  const [dow, setDow] = useState(String(오늘요일 === 0 || 오늘요일 === 6 ? 1 : 오늘요일));
  /* 탭을 가를 때 이 두 줄이 저쪽에 남아서, 요일 칩을 그리다 화면이 통째로 죽었습니다 */
  const 다음전화 = nextCallDay(st);
  /* 일주일씩 봅니다. "다른 날 것" 목록을 따로 두어봤는데 한 화면에 두 목록이라 복잡했습니다.
     일요일에 다음 주 것을 넣어두는 집이 있어서 주만 넘길 수 있게 합니다. */
  const [week, setWeek] = useState(0);
  const 주기준 = todayKey() + week * 7 * DAY;
  const day = dayForDow(dow, 주기준);   /* 고른 요일의 그 주 날짜 — 오늘이면 오늘 */
  const 날짜짧게 = (d) => `${new Date(d).getMonth() + 1}/${new Date(d).getDate()}`;
  const dayLabel = day === todayKey() ? "오늘" : day === todayKey() + DAY ? "내일"
    : week === 0 ? `다음 ${DOW_KR[Number(dow)]}요일` : `${날짜짧게(day)}(${DOW_KR[Number(dow)]})`;
  const [time, setTime] = useState("");
  const [what, setWhat] = useState("");
  const [why, setWhy] = useState("");
  const [kind, setKind] = useState("sked");   /* sked 일정 · med 약 · bag 준비물 */
  /* 정기일정에는 전화·문자, 몇 분 전이 없습니다. 정기일정은 전화하지 않으니까요.
     그건 말하기로 들어온 그날 것에만 붙고, 그 줄을 눌러 여는 시트에서 고칩니다. */
  const [med, setMed] = useState({ when: MED_WHEN[0], name: "", dose: "", times: "", how: MED_HOW[0] });
  const wayLabel = (w) => w === "call" ? "전화" : w === "app" ? "앱" : "문자";
  const [kid, setKid] = useState(((st.children || [])[0] || {}).id || "");
  const [alsoDows, setAlsoDows] = useState([]);
  const [rowEdit, setRowEdit] = useState(null);   /* 고치고 있는 줄 */
  const inp = { border: `1px solid ${C.line}`, borderRadius: 12, padding: "11px 12px", fontSize: 14.5, background: C.bg, color: C.ink, width: "100%" };
  const rows = ((st.callPlan || {})[dow] || []).slice()
    .map((r) => ({ ...r, what: callSpace(r.what) }))
    .sort((a, b) => String(a.time || "").localeCompare(String(b.time || "")));
  const 오늘skip = ((st.callToday || {})[day] || {}).skip || [];
  const add = () => {
    const w = what.trim();
    if (kind === "med") { addMed(); return; }
    /* 빈 칸으로 누르면 아무 말 없이 아무 일도 안 일어났습니다.
       요일까지 골라두셨으면 "이거 그대로 저 요일에도"라는 뜻이라,
       그 자리에서 옮기기를 권합니다. */
    if (!w) {
      say(alsoDows.length
        ? `무엇을 넣을지 적어주세요. 여기 ${rows.length}개를 ${alsoDows.map((d) => DOW_KR[Number(d)]).join("·")}요일로 그대로 옮기시려면 아래 버튼을 눌러주세요`
        : "무엇을 알려드릴지 적어주세요");
      return;
    }
    /* 시각 없는 일정은 어른께 "태권도"라고만 읽힙니다. 언제인지 모르십니다.
       준비물은 시각이 필요 없으니 일정에만 막습니다.
       */
    const t = toTime(time);
    if (kind === "sked" && !t) {
      say(time.trim()
        ? `"${time.trim()}"을 시각으로 못 읽었어요. 1430 이나 14:30 처럼 넣어주세요`
        : "몇 시인지 같이 넣어주세요. 시각이 없으면 어른이 언제인지 모르십니다");
      return;
    }
    const 넣을요일 = [...new Set([dow, ...alsoDows])];
    setSt((sv) => {
      const plan = { ...(sv.callPlan || {}) };
      넣을요일.forEach((d) => {
        plan[d] = (plan[d] || []).concat([{
          id: uid("cl"), time: kind === "bag" ? "" : t,
          what: callSpace(w.slice(0, 30)), kind, kid,
          why: why.trim().slice(0, 60) }]);
      });
      return { ...sv, callPlan: plan, callOn: true };
    });
    setTime(""); setWhat(""); setAlsoDows([]); setWhy("");
    if (넣을요일.length > 1) say(`${넣을요일.map((d) => DOW_KR[Number(d)]).join("·")}요일에 넣었어요`);
    log("call_plan_add", { dow, kind, n: 넣을요일.length });
  };
  /* 약은 이름만 적고 마는 일이 많습니다. 때·용량을 따로 받습니다 */
  const addMed = () => {
    /* 약봉투는 이름을 안 받습니다 — 그게 이 선택지의 뜻입니다 */
    if (med.how !== MED_BAG && !med.name.trim()) return;
    const line = medLine({ ...med, name: med.name.trim() });
    const 넣을요일 = [...new Set([dow, ...alsoDows])];
    const medTime = med.when === "정한 시각에" ? time.trim() : "";
    setSt((sv) => {
      const plan = { ...(sv.callPlan || {}) };
      넣을요일.forEach((d) => { plan[d] = (plan[d] || []).concat([{
        id: uid("cl"), time: medTime,
        what: line.slice(0, 40), kind: "med", kid }]); });
      return { ...sv, callPlan: plan, callOn: true };
    });
    setMed({ when: MED_WHEN[0], name: "", dose: "", times: "", how: MED_HOW[0] });
    setTime("");
    log("call_plan_add", { dow, kind: "med" });
  };
  /* 줄 하나를 고치는 자리. 시각·이름·갈래를 한 화면에서 봅니다 */
  /* 줄은 두 곳에 있습니다 — 요일 계획(매주)과 그날만 더한 것(callToday.add).
     전에는 계획 쪽만 찾아서, 말하기로 담긴 "오늘은 후문" 같은 줄은 눌러도 안 열렸고
     전화로 갈지 문자로 갈지 정할 수 없었습니다. 그날 제일 중요한 줄이 바로 그건데요. */
  /* 말하기로 담긴 것은 보고 있는 요일이 아닌 날(다음 주 목요일, 토요일)에도 있습니다.
     어느 날짜에 있든 id 로 찾습니다 — 안 그러면 "다른 날 것"은 눌러도 안 열립니다. */
  const dayOfAdd = (id, src) => {
    const ct = (src || st).callToday || {};
    const k = Object.keys(ct).find((d) => (((ct[d] || {}).add) || []).some((r) => r.id === id));
    return k == null ? null : Number(k);
  };
  const 오늘만인가 = (id) => dayOfAdd(id) != null;
  const 날짜말 = (d) => d === todayKey() ? "오늘" : d === todayKey() + DAY ? "내일"
    : `${new Date(d).getMonth() + 1}/${new Date(d).getDate()}(${DOW_KR[new Date(d).getDay()]})`;
  const rowOf = (id) => ((st.callPlan || {})[dow] || []).find((r) => r.id === id)
    || (() => { const k = dayOfAdd(id); return k == null ? undefined : (st.callToday[k].add || []).find((r) => r.id === id); })();
  const patchRow = (id, patch) => setSt((sv) => {
    const k = dayOfAdd(id, sv);
    if (k != null) {
      const ct = { ...(sv.callToday || {}) };
      ct[k] = { ...ct[k], add: ct[k].add.map((r) => r.id === id ? { ...r, ...patch } : r) };
      return { ...sv, callToday: ct };
    }
    const plan = { ...(sv.callPlan || {}) };
    plan[dow] = (plan[dow] || []).map((r) => r.id === id ? { ...r, ...patch } : r);
    return { ...sv, callPlan: plan };
  });

  const del = (id) => setSt((sv) => {
    const k = dayOfAdd(id, sv);
    if (k != null) {
      const ct = { ...(sv.callToday || {}) };
      ct[k] = { ...ct[k], add: ct[k].add.filter((r) => r.id !== id) };
      return { ...sv, callToday: ct };
    }
    const plan = { ...(sv.callPlan || {}) };
    plan[dow] = (plan[dow] || []).filter((r) => r.id !== id);
    return { ...sv, callPlan: plan };
  });
  /* 한 요일을 짜두고 다른 요일에 복사 — 하원 시각처럼 매일 같은 것이 있습니다 */
  /* 통째로 덮어씁니다. 그쪽에 뭐가 있으면 그게 사라지니 먼저 여쭤봅니다.
     되돌릴 방법이 없는 자리입니다. */
  const copyTo = (target) => {
    const 있던것 = ((st.callPlan || {})[target] || []).length;
    const 옮길것 = ((st.callPlan || {})[dow] || []).length;
    if (!옮길것) { say(`${DOW_KR[Number(dow)]}요일에 옮길 것이 없어요`); return false; }
    if (있던것 && !confirm(
      `${DOW_KR[Number(target)]}요일에 이미 ${있던것}개가 있습니다.\n\n`
      + `그것을 지우고 ${DOW_KR[Number(dow)]}요일 ${옮길것}개로 바꿀까요?\n`
      + `되돌릴 수 없습니다.`)) return false;
    setSt((sv) => {
      const plan = { ...(sv.callPlan || {}) };
      plan[target] = (plan[dow] || []).map((r) => ({ ...r, id: uid("cl") }));
      return { ...sv, callPlan: plan };
    });
    return true;
  };

  /* 말로 넣기 — 칸을 하나씩 채우는 것보다 말이 빠릅니다.
     다만 반복 일정은 건드리지 않습니다. 그날 것만 더합니다. */

  return (
    <>
      <Section eyebrow="CALL-02" title="요일마다 무엇을 알려드릴까요">
        {/* 주 넘기기. 그 주에 말하기로 담긴 것이 있으면 수를 붙여, 안 보고 지나치지 않게 */}
        <div className="flex gap-1.5" style={{ marginBottom: 8 }}>
          {[["이번 주", 0], ["다음 주", 1], ["그 다음 주", 2]].map(([lab, w]) => {
            const from = todayKey() + w * 7 * DAY;
            const ct = st.callToday || {};
            const m = Object.keys(ct).map(Number)
              .filter((d) => d >= from && d < from + 7 * DAY)
              .reduce((a, d) => a + (((ct[d] || {}).add) || []).length, 0);
            return (
              <button key={w} className="press" onClick={() => setWeek(w)}
                style={{ padding: "6px 12px", borderRadius: 999, fontSize: 12, fontWeight: week === w ? 600 : 400,
                         border: `1px solid ${week === w ? C.moss : C.line}`, background: week === w ? C.mossSoft : "transparent",
                         color: week === w ? C.moss : C.ink3 }}>
                {lab}{m ? <span style={{ fontSize: 10.5, marginLeft: 4, color: C.sun }}>+{m}</span> : null}
              </button>
            );
          })}
        </div>
        <div className="flex gap-1.5" style={{ marginBottom: 12 }}>
          {["1", "2", "3", "4", "5"].map((d) => {
            const n = ((st.callPlan || {})[d] || []).length;
            /* 요일 계획만 세고 있었습니다. 수요일이 0인데 5건이 나가면
               부모는 어디에 있는 5건인지 알 수가 없습니다. */
            const dd = dayForDow(d, 주기준);
            const m = (((st.callToday || {})[dd] || {}).add || []).length;
            return (
              <button key={d} className="press" onClick={() => setDow(d)}
                style={{ flex: 1, padding: "7px 0", borderRadius: 12, fontSize: 13, fontWeight: dow === d ? 600 : 400,
                         border: `1px solid ${dow === d ? C.moss : C.line}`, background: dow === d ? C.moss : "transparent",
                         color: dow === d ? "#fff" : (n || m ? C.ink2 : C.ink3), lineHeight: 1.25 }}>
                {DOW_KR[Number(d)]}
                {n ? <span style={{ fontSize: 10, marginLeft: 3, opacity: .8 }}>{n}</span> : null}
                {m ? <span style={{ fontSize: 10, marginLeft: 2, color: dow === d ? "#fff" : C.sun, opacity: dow === d ? .85 : 1 }}>+{m}</span> : null}
                {/* 날짜가 붙어 있어야 "다음 주 월요일"이 며칠인지 안 헤아립니다 */}
                <span className="mono" style={{ display: "block", fontSize: 9.5, opacity: dow === d ? .8 : .7, marginTop: 1 }}>{날짜짧게(dd)}</span>
              </button>
            );
          })}
        </div>

        {rows.length === 0 && (
          <p style={{ fontSize: 12.5, color: C.ink3, padding: "6px 0 12px" }}>
            {DOW_KR[Number(dow)]}요일마다 되풀이될 것은 아직 없습니다. 학원·하원 시각처럼 매주 같은 것을 넣으세요.
          </p>
        )}
        {/* 말하기 결과 화면에서 요일 계획 줄을 "빼기"로 누르면, 지우는 게 아니라
           "그날만 빼기"(skip)로 담깁니다 — 화요일 하원까지 통째로 사라지면 안 되니까요.
           그런데 여기 요일 계획에는 그 표시가 전혀 없었습니다. 매주 있는 줄인데
           오늘만 조용히 안 나가서, "학원 일정이 안 갔다"는 것을 알아챌 길이 없었습니다. */}
        {rows.map((r) => {
          const 오늘빠짐 = 오늘skip.includes(r.id);
          return (
          <div key={r.id} className="flex items-center gap-2.5"
            style={{ padding: "10px 0", borderBottom: `1px solid ${C.lineSoft || C.line}`, opacity: 오늘빠짐 ? .55 : 1 }}>
            <span className="mono" style={{ fontSize: 12.5, color: 오늘빠짐 ? C.ink3 : C.moss, width: 46, flexShrink: 0 }}>
              {r.kind === "bag" ? "가방" : r.kind === "med" ? "약" : (r.time || "—")}
            </span>
            {/* 눌러서 고칠 수 있게. 전에는 시각이나 이름을 고치려면
                빼고 다시 넣는 수밖에 없었습니다. */}
            <button className="press" onClick={() => setRowEdit(r.id)}
              style={{ fontSize: 14, flex: 1, minWidth: 0, background: "transparent", border: "none",
                       textAlign: "left", color: C.ink, padding: 0 }}>
              {(st.children || []).length > 1 && r.kid
                ? <b style={{ color: C.ink3, fontWeight: 500, marginRight: 5 }}>
                    {((st.children || []).find((k) => k.id === r.kid) || {}).name}
                  </b> : null}
              {r.what}
              {오늘빠짐 ? <b style={{ color: C.persim, fontSize: 11, marginLeft: 6, fontWeight: 500 }}>· {dayLabel}은 안 감</b> : null}
            </button>
            {오늘빠짐 ? (
              <button className="press" onClick={() => setSt((sv) => {
                const t = { ...(sv.callToday || {}) };
                const cur = t[day] || {};
                t[day] = { ...cur, skip: (cur.skip || []).filter((id) => id !== r.id) };
                return { ...sv, callToday: t };
              })} style={{ flexShrink: 0, padding: "5px 9px", borderRadius: 999, fontSize: 11.5,
                          border: `1px solid ${C.moss}`, background: "transparent", color: C.moss }}>다시 켜기</button>
            ) : (
              /* 정기일정 줄에는 전화·문자 알약이 없습니다 — 정기일정은 전화하지 않으니까요 */
              <button className="press" onClick={() => del(r.id)}
                style={{ background: "transparent", border: "none", color: C.ink3, fontSize: 12, flexShrink: 0 }}>빼기</button>
            )}
          </div>
          );
        })}

        {/* 말하기로 담긴 그날치는 여기 안 보이고 있었습니다. 요일 계획이 비었는데
            "3통 나갑니다"가 뜨니 어긋나 보였어요. 같은 자리에 같이 보여줍니다. */}
        {(() => {
          const 그날것 = ((st.callToday || {})[day] || {}).add || [];
          if (!그날것.length) return null;
          const key = (r) => (/^\d{1,2}:\d{2}$/.test(String(r.time || "")) ? r.time : "99:99");
          return (
            <div style={{ marginTop: 14, paddingTop: 12, borderTop: `1px solid ${C.line}` }}>
              <div style={{ fontSize: 12, color: C.sun, fontWeight: 600, marginBottom: 2 }}>
                {dayLabel}만 — {그날것.length}건
              </div>
              <div style={{ fontSize: 11.5, color: C.ink3, marginBottom: 6, lineHeight: 1.7 }}>
                말하기로 담긴 그날치입니다. 매주 되풀이되지 않고 이날만, 전화로 나갑니다.
              </div>
              {그날것.slice().sort((a2, b2) => key(a2).localeCompare(key(b2))).map((r) => (
                <div key={r.id} className="flex items-center gap-2.5"
                  style={{ padding: "8px 0", borderBottom: `1px solid ${C.lineSoft || C.line}` }}>
                  <span className="mono" style={{ fontSize: 12.5, color: C.sun, width: 46, flexShrink: 0 }}>
                    {r.kind === "bag" ? "가방" : r.kind === "med" ? "약" : (r.time || "—")}
                  </span>
                  <button className="press" onClick={() => setRowEdit(r.id)}
                    style={{ fontSize: 14, flex: 1, minWidth: 0, background: "transparent", border: "none",
                             textAlign: "left", color: C.ink, padding: 0 }}>
                    {(st.children || []).length > 1 && r.kid
                      ? <b style={{ color: C.ink3, fontWeight: 500, marginRight: 5 }}>
                          {((st.children || []).find((k) => k.id === r.kid) || {}).name}
                        </b> : null}
                    {callSpace(r.what)}
                    {r.time ? <span style={{ fontSize: 11, color: C.moss, marginLeft: 6 }}>· {rowLead(r) ? `${rowLead(r)}분 전` : "정시"}</span> : null}
                  </button>
                  {/* 글자만 버튼이고 "설정대로"는 그냥 글씨였습니다. 부모는 바꾸고 싶은 그 글씨를
                      누릅니다 — 눌러도 안 열리니 "고치기 없어"가 됐습니다. 위 요일 줄과 같은 단추로. */}
                  {(() => { const w = rowWay(st, r); return (
                  <button className="press" onClick={() => setRowEdit(r.id)}
                    style={{ flexShrink: 0, padding: "5px 9px", borderRadius: 999, fontSize: 11.5, border: "1px solid transparent",
                             background: w === "call" ? C.mossSoft : w === "sms" ? C.sunSoft : C.seaSoft,
                             color: w === "call" ? C.moss : w === "sms" ? C.sun : C.sea }}>
                    {wayLabel(w)}
                  </button>); })()}
                  <button className="press" onClick={() => setSt((sv) => {
                    const t2 = { ...(sv.callToday || {}) };
                    const cur = t2[day] || {};
                    t2[day] = { ...cur, add: (cur.add || []).filter((x) => x.id !== r.id) };
                    return { ...sv, callToday: t2 };
                  })} style={{ background: "transparent", border: "none", color: C.ink3, fontSize: 12, flexShrink: 0 }}>빼기</button>
                </div>
              ))}
              <button className="press" onClick={() => { if (!confirm(`${dayLabel} 것 ${그날것.length}건을 모두 뺄까요?`)) return;
                setSt((sv) => {
                  const t2 = { ...(sv.callToday || {}) };
                  t2[day] = { ...(t2[day] || {}), add: [] };
                  return { ...sv, callToday: t2 };
                }); say(`${dayLabel} 것을 모두 뺐어요`); }}
                style={{ marginTop: 9, background: "transparent", border: `1px solid ${C.line}`,
                         borderRadius: 999, padding: "6px 13px", fontSize: 12, color: C.ink2 }}>
                {dayLabel} 것 모두 빼기
              </button>
            </div>
          );
        })()}

        {/* "다른 날 것" 목록이 여기 있었습니다. 한 화면에 두 목록은 복잡해서
            위의 "이번 주 / 다음 주"로 대신합니다. */}

        <div style={{ marginTop: 14, paddingTop: 13, borderTop: `1px solid ${C.line}` }}>
          {(st.children || []).length > 1 && (
            <div className="flex gap-1.5" style={{ marginBottom: 10, flexWrap: "wrap" }}>
              <span style={{ fontSize: 12, color: C.ink3, alignSelf: "center", marginRight: 2 }}>누구</span>
              {(st.children || []).map((k) => (
                <button key={k.id} className="press" onClick={() => setKid(k.id)}
                  style={{ padding: "5px 12px", borderRadius: 999, fontSize: 12,
                           border: `1px solid ${kid === k.id ? C.moss : C.line}`,
                           background: kid === k.id ? C.mossSoft : "transparent",
                           color: kid === k.id ? C.moss : C.ink3 }}>{k.name}</button>
              ))}
            </div>
          )}
          <div className="flex gap-1.5" style={{ marginBottom: 10 }}>
            {[["sked", "일정"], ["med", "약"], ["bag", "준비물"]].map(([k, lab]) => (
              <button key={k} className="press" onClick={() => setKind(k)}
                style={{ padding: "6px 14px", borderRadius: 999, fontSize: 12.5, fontWeight: kind === k ? 600 : 400,
                         border: `1px solid ${kind === k ? C.moss : C.line}`,
                         background: kind === k ? C.mossSoft : "transparent",
                         color: kind === k ? C.moss : C.ink3 }}>{lab}</button>
            ))}
          </div>
          {kind === "sked" && (
            <>
              {/* 아침에 등원 전 병원 가는 일이 흔합니다. 매번 치게 하지 않습니다.
                  손으로 고쳐 쓰셔도 되게 칸에 넣어주기만 합니다. */}
              <div className="flex gap-1.5" style={{ flexWrap: "wrap", marginBottom: 9 }}>
                {["병원 데려다주기", "등원 데려다주기", "하원 데리러 가기", "학원 데려다주기", "학원에서 데려오기"].map((q) => (
                  <button key={q} className="press" onClick={() => setWhat(q)}
                    style={{ padding: "5px 11px", borderRadius: 999, fontSize: 11.5,
                             border: `1px solid ${what === q ? C.moss : C.line}`,
                             background: what === q ? C.mossSoft : "transparent",
                             color: what === q ? C.moss : C.ink3 }}>{q}</button>
                ))}
              </div>
              <div className="flex gap-2">
                <input style={{ ...inp, width: 82, flexShrink: 0 }} placeholder="1430 또는 14:30" value={time}
                  onChange={(e) => setTime(e.target.value.slice(0, 8))}
                  onBlur={() => setTime((v) => toTime(v) || v)} />
                <input style={inp} placeholder="태권도 데려다주기" value={what}
                  onChange={(e) => setWhat(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") add(); }} />
                <button className="press" onClick={add}
                  style={{ flexShrink: 0, padding: "0 16px", borderRadius: 12, background: C.moss, color: "#fff", border: "none", fontSize: 14, fontWeight: 600 }}>넣기</button>
              </div>
              {/* 병원일 때만 칸을 하나 더 엽니다. 늘 열어두면 모든 일정에
                  칸이 하나 더 늘어나는데, 학원에는 이유를 적을 일이 없습니다. */}
              {/^.*(병원|의원|치과|소아과|한의원|검진|보건소).*$/.test(what) && (
                <div style={{ marginTop: 8 }}>
                  <input style={inp} placeholder="왜 가는지 (예: 어금니 왼쪽 아래 충치)"
                    value={why} onChange={(e) => setWhy(e.target.value.slice(0, 60))}
                    onKeyDown={(e) => { if (e.key === "Enter") add(); }} />
                  <p style={{ fontSize: 11.5, color: C.ink3, marginTop: 6, lineHeight: 1.7 }}>
                    접수대에서 <b style={{ color: C.ink2 }}>어디가 아파서 왔는지</b>를 물으십니다.
                    적어두시면 어른께 같이 읽어드립니다 — 그 자리에서 부모께 전화하지 않으셔도 되게요.
                  </p>
                </div>
              )}
              {/* 이 줄은 "지금 넣는 것"에만 붙습니다. 이미 들어 있는 줄을 다른 요일로
                  보내는 것은 아래 "그대로 옮기기"입니다. 위에 떨어뜨려 놨더니
                  이미 있는 것도 같이 가는 줄 아셨습니다. 넣기 바로 밑으로 내렸습니다. */}
              <div className="flex items-center gap-1.5" style={{ marginTop: 10, flexWrap: "wrap" }}>
                <span style={{ fontSize: 12, color: C.ink3, marginRight: 2 }}>지금 넣는 것을 이 요일에도</span>
                {["1", "2", "3", "4", "5"].filter((d) => d !== dow).map((d) => {
                  const on = alsoDows.includes(d);
                  return (
                    <button key={d} className="press" onClick={() => setAlsoDows((v) => on ? v.filter((x) => x !== d) : v.concat(d))}
                      style={{ padding: "5px 11px", borderRadius: 999, fontSize: 12, fontWeight: on ? 600 : 400,
                               border: `1px solid ${on ? C.moss : C.line}`,
                               background: on ? C.mossSoft : "transparent", color: on ? C.moss : C.ink3 }}>
                      {DOW_KR[Number(d)]}
                    </button>
                  );

              </div>
              {!!alsoDows.length && (what.trim()
