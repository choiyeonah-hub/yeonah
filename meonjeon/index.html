       border-bottom:1px solid #E7ECE9;padding:8px 12px;font-size:11.5px;color:#57675F;align-items:center}
  #bar button{border:1px solid #E7ECE9;background:#F6F8F7;border-radius:99px;padding:6px 12px;font-size:11.5px;color:#57675F;font-family:inherit;cursor:pointer}

<body>
<div id="bar"></div>
<div id="gate"></div>
<div id="root"></div>
<div id="sync"><span>가족이 방금 업데이트했어요</span><button onclick="location.reload()">새로고침</button></div>

<script>
/* ── 부팅: 설정 → 로그인 → 가구 연결 → 앱 실행 ────────────── */
let SB = null, HH = null, MYUID = null, LASTWRITE = 0;
const gate = document.getElementById('gate');
const bar  = document.getElementById('bar');

const show = (html) => { gate.innerHTML = html; gate.style.display = 'block'; };
const hideGate = () => { gate.style.display = 'none'; };

async function boot() {
  const cfg = await fetch('/api/config').then(r => r.json()).catch(() => ({}));
  if (!cfg.url || !cfg.anonKey) {
    show('<h1>설정이 아직이에요</h1><p>Vercel 환경변수에 <b>SUPABASE_URL</b>과 <b>SUPABASE_ANON_KEY</b>를 넣고 다시 배포해 주세요. README의 2단계를 참고하시면 됩니다.</p>');
    return;
  }
  SB = supabase.createClient(cfg.url, cfg.anonKey);

  const { data: { session } } = await SB.auth.getSession();
  if (!session) return askEmail();
  MYUID = session.user.id;
  await connectHousehold(session.user);
}

function askEmail() {
  const join = new URLSearchParams(location.search).get('join');
  show(`
    <h1>먼저ON</h1>
    <p>생각나는 건 말하세요.<br>생각나지 않는 건 먼저 챙길게요.</p>
    ${join ? '<div class="msg">가족 초대를 받으셨네요. 로그인하면 같은 집으로 들어갑니다.</div>' : ''}
    <div style="margin-top:26px">
      <input id="em" type="email" inputmode="email" autocomplete="email" placeholder="이메일 주소" />
      <button id="go">로그인 링크 받기</button>
      <p style="font-size:12px;color:#95A29B">비밀번호는 없어요. 메일로 온 링크를 누르면 바로 시작됩니다.</p>
    </div>`);
  document.getElementById('go').onclick = async () => {
    const email = document.getElementById('em').value.trim();
    if (!email) return;
    document.getElementById('go').textContent = '보내는 중…';
    const { error } = await SB.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.search } });
    if (error) { show('<h1>메일을 못 보냈어요</h1><p>' + error.message + '</p><button onclick="location.reload()">다시 시도</button>'); return; }
    show('<h1>메일함을 확인해 주세요</h1><p><b>' + email + '</b>로 로그인 링크를 보냈어요.<br>링크를 누르면 바로 시작됩니다. 메일이 안 보이면 스팸함도 확인해 주세요.</p><button class="ghost" onclick="location.reload()">다른 주소로 다시 받기</button>');
  };
}

async function connectHousehold(user) {
  show('<h1>우리 집을 여는 중…</h1>');
  const joinCode = new URLSearchParams(location.search).get('join');

  let { data: mine } = await SB.from('households').select('*').limit(1);
  if (joinCode && (!mine || !mine.length)) {
    const { data, error } = await SB.rpc('join_household', { p_code: joinCode });
    if (error) { show('<h1>초대 코드를 못 찾았어요</h1><p>' + error.message + '</p><button onclick="location.href=location.origin">내 집 새로 만들기</button>'); return; }
    HH = data;
  } else if (mine && mine.length) {
    HH = mine[0];
  } else {
    const { data, error } = await SB.rpc('create_household');
    if (error) { show('<h1>집을 만들지 못했어요</h1><p>' + error.message + '</p>'); return; }
    HH = data;
  }

  /* 로그인한 사람을 가구 구성원과 연결 */
  const st = HH.state && Object.keys(HH.state).length ? HH.state : null;
  if (st && Array.isArray(st.members)) {
    let me = st.members.find(m => m.uid === user.id);
    if (!me) {
      const free = st.members.find(m => !m.uid);
      if (free) { free.uid = user.id; me = free; }
      else {
        me = { id: 'm' + Date.now().toString(36), name: user.email.split('@')[0].slice(0, 6), role: 'member',
               color: ["#2E6B57","#3D5B7A","#C08A2E","#7A4E77"][st.members.length % 4], uid: user.id };
        st.members.push(me);
      }
      await SB.from('households').update({ state: st }).eq('id', HH.id);
      HH.state = st;
    }
    window.__ME = me.id;
  }

  /* 앱이 쓰는 저장소를 가구 DB에 연결 */
  window.storage = {
    async get(k) {
      const { data } = await SB.from('households').select('state, updated_at').eq('id', HH.id).single();
      if (data) { HH.state = data.state; HH.updated_at = data.updated_at; }
      if (!HH.state || !Object.keys(HH.state).length) throw new Error('empty');
      return { key: k, value: JSON.stringify(HH.state) };
    },
    async set(k, v) {
      HH.state = JSON.parse(v);
      LASTWRITE = Date.now();
      await SB.from('households').update({ state: HH.state, updated_at: new Date().toISOString(), updated_by: MYUID }).eq('id', HH.id);
      return { key: k, value: v };
    },
    async delete() { HH.state = {}; await SB.from('households').update({ state: {} }).eq('id', HH.id); return { deleted: true }; },
    async list() { return { keys: ['meonjeon'] }; },
  };

  /* 가족이 고치면 알려주기 */
  SB.channel('hh').on('postgres_changes',
    { event: 'UPDATE', schema: 'public', table: 'households', filter: 'id=eq.' + HH.id },
    (p) => { if (p.new.updated_by !== MYUID && Date.now() - LASTWRITE > 3000) document.getElementById('sync').style.display = 'flex'; }
  ).subscribe();

  /* 상단 바: 초대 코드 / 로그아웃 */
  bar.style.display = 'flex';
  bar.innerHTML = `<span>초대코드 <b>${HH.code}</b></span>
    <button id="inv">가족 초대 링크 복사</button>
    <button id="out">로그아웃</button>`;
  document.getElementById('inv').onclick = async () => {
    const link = location.origin + '/?join=' + HH.code;
    try { await navigator.clipboard.writeText(link); document.getElementById('inv').textContent = '복사했어요'; }
    catch { prompt('이 링크를 가족에게 보내세요', link); }
  };
  document.getElementById('out').onclick = async () => { await SB.auth.signOut(); location.href = location.origin; };
  document.getElementById('root').style.paddingTop = '34px';

  hideGate();
  startApp();
}

boot();
</script>

const FONTS = `

const STATUS = {

const STATUS_ORDER = ["now", "week", "conditional", "check", "buy", "decide", "remember", "repeat"];

/* ── 반복 주기 선택지 ─────────────────────────── */
const CYCLES = [
  { d: 1, label: "매일" }, { d: 3, label: "2~3일" }, { d: 7, label: "매주" },
  { d: 14, label: "격주" }, { d: 30, label: "매월" }, { d: 90, label: "3개월" },
  { d: 180, label: "6개월" }, { d: 365, label: "1년" },
];
const cycleLabel = (d) => (CYCLES.find((c) => c.d === d) || { label: `${d}일마다` }).label;
/* 반복 패턴을 한 줄로 읽어줍니다 — "매주 · 화요일" 처럼 */
function patternLabel(cfg) {
  if (!cfg) return "";
  const base = cycleLabel(cfg.cycle);
  if (cfg.dow != null && cfg.dow !== "") return `${base} · ${WEEKDAY[Number(cfg.dow)]}요일`;
  if (cfg.dom) return `${base} · ${Number(cfg.dom) === 31 ? "말일" : cfg.dom + "일"}`;
  if (cfg.anchor) return `매년 · ${Number(cfg.anchor.split("-")[0])}월 ${Number(cfg.anchor.split("-")[1])}일`;
  return base;
}
/* 요일·날짜가 지정된 반복의 다음 차례 */
function nextByPattern(cfg, fromMs) {
  const base = startOfDay(fromMs || Date.now()) + DAY;
  if (cfg.dow != null && cfg.dow !== "") {
    for (let i = 0; i < 8; i++) {
      const d = new Date(base + i * DAY);
      if (d.getDay() === Number(cfg.dow)) return d.getTime();
    }
  }
  if (cfg.dom) {
    const dom = Number(cfg.dom);
    const now = new Date(base);
    for (let i = 0; i < 4; i++) {
      const d = dom === 31
        ? new Date(now.getFullYear(), now.getMonth() + i + 1, 0)   /* 말일: 2월이면 28일 */
        : new Date(now.getFullYear(), now.getMonth() + i, dom);
      if (dom !== 31 && d.getDate() !== dom) continue;             /* 2월 30일처럼 없는 날짜는 건너뜀 */
      if (d.getTime() >= base) return d.getTime();
    }
  }
  return base - DAY + (cfg.cycle || 30) * DAY;
}
function cycleToDays(cy) {
  if (!cy) return 30;
  const s = String(cy);
  if (s.includes("매일") || s.includes("사용 시마다")) return 1;
  if (s.includes("주 3회")) return 2;
  if (s.includes("2~3일")) return 3;
  if (s.includes("주 1회") || s.includes("주간")) return 7;
  if (s.includes("2주")) return 14;

  if (s.includes("2~3개월") || s.includes("계절")) return 75;

  if (s.includes("연 1회") || s.includes("1년")) return 365;
  return 30;
}

const monthsToDays = (m) => Math.round(m * 30.44);

function toFragments(text) {
  const words = String(text).split(/[\s.,!?]+/).filter(Boolean);
  const out = [];
  words.forEach((w) => { if (w.length <= 7) out.push(w); else out.push(...(w.match(/.{1,5}/g) || [])); });
  return out.slice(0, 18);
}
function childMonths(ch) {
  if (ch.unit === "week") return -((40 - Number(ch.value || 0)) / 4.345);
  if (ch.unit === "month") return Number(ch.value || 0);
  if (ch.unit === "year") return Number(ch.value || 0) * 12;
  if (ch.unit === "elem") return 72 + Number(ch.value || 1) * 12;
  if (ch.unit === "mid") return 144 + Number(ch.value || 1) * 12;
  return Number(ch.value || 0);
}
function childLabel(ch) {
  const v = ch.value;
  if (ch.unit === "week") return `임신 ${v}주`;
  if (ch.unit === "month") return `${v}개월`;
  if (ch.unit === "year") return `${v}세`;
  if (ch.unit === "elem") return `초${v}`;
  if (ch.unit === "mid") return `중${v}`;
  return `${v}`;
}
const keyOf = (seed, child) => (child ? `${seed.id}:${child.id}` : seed.id);

/* ── 공휴일 (연 1회 손으로 갱신합니다. 대체공휴일 포함) ── */
const HOLIDAYS = {
  2026: ["01-01","02-16","02-17","02-18","03-01","03-02","03-03","05-05","05-24","05-25","06-06","08-15","08-17","09-24","09-25","09-26","10-03","10-05","10-09","12-25"],
  2027: ["01-01","02-06","02-07","02-08","02-09","03-01","05-05","05-13","06-06","08-15","08-16","09-14","09-15","09-16","10-03","10-04","10-09","10-11","12-25"],
};
const ymd = (d) => {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
};
const isHoliday = (d) => {
  const y = d.getFullYear(), md = ymd(d).slice(5);
  return d.getDay() === 0 || d.getDay() === 6 || (HOLIDAYS[y] || []).includes(md);
};
/* 이번 쉬는 날 묶음을 찾습니다. 금요일이 공휴일이면 목요일에 브리핑합니다 */
function nextBreak(from) {
  const base = startOfDay(from || Date.now());
  for (let i = 0; i <= 9; i++) {
    const d = new Date(base + i * DAY);
    if (!isHoliday(d)) continue;
    const days = [];
    for (let j = 0; j < 6; j++) {
      const n = new Date(base + (i + j) * DAY);
      if (!isHoliday(n)) break;
      days.push(n);
    }
    return { start: days[0], days, briefAt: startOfDay(days[0].getTime() - DAY) };
  }
  return null;
}
const WEEKDAY = ["일", "월", "화", "수", "목", "금", "토"];

/* ── 연료·엔진오일 계산 ────────────────────────────────
   연비(km/L) × 탱크(L) = 만탱크 주행가능거리
   하루 평균 + 출장 가산으로 남은 날짜를 셉니다 */
function fuelForecast(car) {
  const kmPerL = Number(car.kmPerL || 0), tankL = Number(car.tankL || 0);
  const daily = Number(car.dailyKm || 0) + Number(car.tripKmPerMonth || 0) / 30.44;
  if (!kmPerL || !tankL || !daily) return null;
  const full = kmPerL * tankL;
  const level = car.fuelLevel == null ? 1 : Number(car.fuelLevel);
  const since = car.fuelAt ? (Date.now() - car.fuelAt) / DAY : 0;
  const left = Math.max(full * level - daily * since, 0);
  const daysLeft = Math.floor(left / daily);
  return { full: Math.round(full), left: Math.round(left), daysLeft, emptyAt: Date.now() + daysLeft * DAY, daily: Math.round(daily * 10) / 10 };
}
function oilForecast(car) {
  const last = Number(car.oilLastKm || 0), every = Number(car.oilEvery || 10000), odo = Number(car.odo || 0);
  if (!last || !odo || odo < last) return null;
  const daily = Number(car.dailyKm || 0) + Number(car.tripKmPerMonth || 0) / 30.44;
  const kmLeft = last + every - odo;
  return { kmLeft, daysLeft: daily ? Math.floor(kmLeft / daily) : null, nextKm: last + every };
}

const ROUTINE_SEEDS = SEED.filter((s) => s.st === "repeat");
const LIFE_SEEDS = SEED.filter((s) => s.st !== "repeat");

/* 계절 항목은 그 계절에만 올라옵니다 */
const SEASON = { summer: [5, 6, 7, 8, 9], winter: [11, 12, 1, 2, 3] };
const inSeason = (seed, month) => !seed.season || (SEASON[seed.season] || []).includes(month || (new Date().getMonth() + 1));

/* 이 가구에 해당하는 반복 업무만 추림 */
function eligibleRoutines(st, ignoreSeason) {
  const out = [];
  const petTypes = st.petTypes || {};
  const anyPetType = Object.keys(petTypes).some((k) => petTypes[k]);
  ROUTINE_SEEDS.forEach((seed) => {
    if (!ignoreSeason && !inSeason(seed)) return;
    /* 반려동물 종류를 고른 집에는 그 종류에 맞는 것만 */
    if (seed.pt && anyPetType && !seed.pt.split("|").some((t) => petTypes[t])) return;
    if (seed.kid) {
      st.children.forEach((ch) => {
        const m = childMonths(ch);
        if (m >= seed.w[0] && m <= seed.w[1]) out.push({ key: keyOf(seed, ch), seed, child: ch });
      });
    } else if (!seed.f || st.flags[seed.f]) out.push({ key: seed.id, seed, child: null });
  });
  /* 직접 만든 정기 일정 */
  (st.customRoutines || []).forEach((cr) => {
    const child = String(cr.category || "").startsWith("kid:")
      ? st.children.find((c) => `kid:${c.id}` === cr.category) : null;
    if (String(cr.category || "").startsWith("kid:") && !child) return;
    out.push({
      key: `c:${cr.id}`, custom: true, child,
      seed: { id: cr.id, t: cr.title, cat: cr.category, cy: cr.cycle, g: "우리집정기", tg: "직접 등록", ask: "", st: "repeat" },
    });
  });
  return out;
}
/* 오늘 떠야 할 반복 업무 */
function dueRoutines(st) {
  const now = Date.now();
  return eligibleRoutines(st)
    .map((r) => ({ ...r, cfg: st.routines[r.key] }))
    .filter((r) => r.cfg && r.cfg.on !== false && (r.cfg.nextAt || 0) <= now + DAY)
    .sort((a, b) => (a.cfg.nextAt || 0) - (b.cfg.nextAt || 0));
}

/* ── ② 생애주기 업무 ─────────────────────────── */
function buildRecommendations(st) {
  const now = Date.now();
  const out = [];
  const push = (seed, child, dday, dateKnown) => {
    const p = st.prefs[keyOf(seed, child)] || {};
    if (p.enabled === false || st.groupsOff[seed.g] || p.accepted || p.dismissedOnce) return;
    if (p.snoozedUntil && p.snoozedUntil > now) return;
    out.push({ key: keyOf(seed, child), seed, child, dday, dateKnown, lead: p.lead != null ? p.lead : seed.lead });
  };
  LIFE_SEEDS.forEach((seed) => {
    if (seed.kid) {
      st.children.forEach((ch) => {
        const m = childMonths(ch), [a, b] = seed.w;
        const p = st.prefs[keyOf(seed, ch)] || {};
        const lead = p.lead != null ? p.lead : seed.lead;
        const days = monthsToDays(a - m);
        if (days <= lead && m <= b) push(seed, ch, days, true);
      });
    } else {
      if (seed.f && !st.flags[seed.f]) return;
      push(seed, null, null, false);
    }
  });
  return out.sort((x, y) => (x.dateKnown && y.dateKnown ? x.dday - y.dday : x.dateKnown ? -1 : y.dateKnown ? 1 : 0));
}

const PROMPT_VERSION = "v7.0";
async function askClaude(prompt, images) {
  const res = await fetch("/api/classify", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ prompt, images: images || undefined, promptVersion: PROMPT_VERSION }),
  });
  const data = await res.json();
  const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
  const clean = text.replace(/```json/g, "").replace(/```/g, "").trim();
  const a = clean.indexOf("["), o = clean.indexOf("{");
  const s = o >= 0 && (o < a || a < 0) ? o : a;
  const e = clean.lastIndexOf(clean[s] === "{" ? "}" : "]");
  return JSON.parse(s >= 0 ? clean.slice(s, e + 1) : clean);
}

function nextFromAnchor(anchor, leadDays) {
  if (!anchor) return null;
  const [mm, dd] = anchor.split("-").map(Number);
  const now = new Date(); const y = now.getFullYear();
  let d = new Date(y, mm - 1, dd);
  if (d.getTime() < startOfDay(Date.now())) d = new Date(y + 1, mm - 1, dd);
  return d.getTime() - (leadDays || 7) * DAY;
}

/* 사진을 1200px 이내로 줄이고 JPEG로 바꿉니다.
   원본 그대로 보내지 않는 이유: 통신량·비용도 있지만
   사진에 붙은 위치·기기 정보(EXIF)를 떼어내기 위해서예요. */
function shrinkImage(file, max = 1200) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("파일을 읽지 못했어요"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("사진을 열지 못했어요"));
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * scale);
        cv.height = Math.round(img.height * scale);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        const url = cv.toDataURL("image/jpeg", 0.78);
        resolve({ media_type: "image/jpeg", data: url.split(",")[1] });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* 캘린더로 내보내기 (.ics) — 실제 연동 전 다리 역할 */
function downloadICS(title, whenMs, note) {
  const d = new Date(whenMs);
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//meonjeon//KO", "BEGIN:VEVENT",
    `UID:${Date.now()}@meonjeon`, `DTSTAMP:${ymd}T090000Z`, `DTSTART;VALUE=DATE:${ymd}`,
    `SUMMARY:${title}`, `DESCRIPTION:${(note || "먼저ON에서 보냄").replace(/\n/g, " ")}`,
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const url = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  const a = document.createElement("a");
  a.href = url; a.download = `${title}.ics`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

  );

  return (
    <Ctx.Provider value={{ st, setSt, me, setMe, cats, addTasks, addShopping, tossTask, complete, assign, setPref, setRoutine, routineAction, say, log, tab, setTab, openCat, setOpenCat }}>
      <div className="hae" style={{ background: C.bg, minHeight: "100vh", color: C.ink, WebkitFontSmoothing: "antialiased" }}>
        <style dangerouslySetInnerHTML={{ __html: FONTS }} />
        <div style={{ maxWidth: 440, margin: "0 auto", paddingBottom: 100, position: "relative" }}>
          {!st.onboarded ? <Onboarding /> : (
            <>
              <Header />
              <div className="px-5">
                {tab === "home" && <Home />}
                {tab === "cat" && <Categories />}
                {tab === "speak" && <Speak />}
                {tab === "time" && <Timeline />}
                {tab === "shop" && <Shopping />}
                {tab === "share" && <Share />}
                {tab === "set" && <Settings />}
              </div>
              <TabBar />
            </>
          )}
          {toast && <div className="rise" style={{ position: "fixed", bottom: 108, left: "50%", transform: "translateX(-50%)", background: C.ink, color: "#fff", fontSize: 13, padding: "11px 18px", borderRadius: 999, zIndex: 70, whiteSpace: "nowrap", boxShadow: SHADOW }}>{toast}</div>}
        </div>
      </div>
    </Ctx.Provider>
  );
}

/* ── 첫 설정 4단계 ────────────────────────────── */
function Onboarding() {
  const { setSt } = use();
  const [step, setStep] = useState(0);
  const [d, setD] = useState(DEFAULT_STATE);
  const [routines, setRoutines] = useState({});
  const [pick, setPick] = useState(null);
  const [page, setPage] = useState(0);
  const [newItem, setNewItem] = useState("");
  const inp = { border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 13px", fontSize: 14.5, background: C.bg, color: C.ink, width: "100%" };

  /* 3단계까지 고른 내용으로 추천 반복업무 목록을 만든다 */
  const suggested = useMemo(() => eligibleRoutines(d, true), [d.children, d.flags, d.petTypes]);
  useEffect(() => {
    if (step !== 3) return;
    setRoutines((prev) => {
      const next = { ...prev };
      suggested.forEach((r) => { if (!next[r.key]) next[r.key] = { on: true, cycle: cycleToDays(r.seed.cy) }; });
      return next;
    });
  }, [step, suggested]);

  const byCat = useMemo(() => {
    const g = {};
    suggested.forEach((r) => {
      const cid = r.child ? `kid:${r.child.id}` : r.seed.cat;
      const label = r.child ? `${r.child.name}(${childLabel(r.child)})` : (BASE_CATS.find((c) => c.id === r.seed.cat) || { label: "기타" }).label;
      const emoji = r.child ? "🧒" : (BASE_CATS.find((c) => c.id === r.seed.cat) || { emoji: "🗂" }).emoji;
      (g[cid] = g[cid] || { label, emoji, items: [] }).items.push(r);
    });
    return g;
  }, [suggested]);

  const steps = [
    { q: `${BRAND}에 오신 걸 환영해요.\n누구와 함께 챙기나요?`, s: "여기 있는 사람에게 할 일을 나눌 수 있어요. 나중에 바꿔도 됩니다." },
    { q: "아이가 있나요?", s: "아이마다 챙길 것이 완전히 달라서 따로 관리해요. 임신 중이면 주수로 넣어주세요." },
    { q: "우리 집에\n해당하는 것만 골라주세요", s: "고르지 않은 건 앞으로 한 번도 안 물어봐요." },
    { q: "이 정도 주기면\n괜찮을까요?", s: "영역별로 한 화면씩 넘어갑니다. 기본 주기는 저희가 넣어뒀으니 바꾸거나 끄기만 하세요." },
  ];
  const cids = useMemo(() => Object.keys(byCat), [byCat]);
  const onCount = Object.values(routines).filter((r) => r.on).length;

  return (
    <div className="px-5" style={{ paddingTop: 44 }}>
      <div className="flex items-center gap-3" style={{ marginBottom: 22 }}>
        <button className="press" onClick={() => { if (step === 3 && page > 0) return setPage(page - 1); if (step > 0) setStep(step - 1); }}
          disabled={step === 0} aria-label="이전 단계"
          style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 999, width: 34, height: 34, fontSize: 14, color: step === 0 ? C.ink3 : C.ink2, opacity: step === 0 ? .35 : 1, flexShrink: 0 }}>←</button>
        <div className="flex gap-1.5 flex-1">
          {[0, 1, 2, 3].map((i) => <div key={i} style={{ flex: 1, height: 3, borderRadius: 99, background: i <= step ? C.moss : C.line, transition: "background .3s" }} />)}
        </div>
        <span className="mono" style={{ fontSize: 10.5, color: C.ink3, flexShrink: 0 }}>{step + 1}/4</span>
      </div>
      <h1 className="disp" style={{ fontSize: 26, fontWeight: 600, lineHeight: 1.45, whiteSpace: "pre-line" }}>{steps[step].q}</h1>
      <p style={{ fontSize: 13.5, color: C.ink2, marginTop: 12, lineHeight: 1.7 }}>{steps[step].s}</p>

      <div style={{ marginTop: 22 }}>
        {step === 0 && (
          <Card><div style={{ padding: 16 }}>
            {d.members.map((m, i) => (
              <div key={m.id} className="flex items-center gap-3" style={{ marginTop: i ? 10 : 0 }}>
                <Avatar member={{ ...m, name: m.name || "?" }} size={34} />
                <input className="hae" value={m.name} placeholder={i ? "예: 남편" : "내 호칭"}
                  onChange={(e) => setD((s) => ({ ...s, members: s.members.map((x) => x.id === m.id ? { ...x, name: e.target.value } : x) }))} style={inp} />
                {i > 0 && <button onClick={() => setD((s) => ({ ...s, members: s.members.filter((x) => x.id !== m.id) }))} style={{ background: "none", border: "none", color: C.ink3, fontSize: 20 }}>×</button>}
              </div>
            ))}
            {d.members.length < 4 && <button className="press w-full" onClick={() => setD((s) => ({ ...s, members: [...s.members, { id: uid("m"), name: "", role: "member", color: MEMBER_COLORS[s.members.length] }] }))}
              style={{ marginTop: 12, background: "none", border: `1px dashed ${C.line}`, borderRadius: 12, padding: "11px 0", fontSize: 13, color: C.ink2 }}>가족 추가</button>}
          </div></Card>
        )}

        {step === 1 && (
          <Card><div style={{ padding: 16 }}>
            {d.children.map((c) => (
              <div key={c.id} className="flex items-center gap-2" style={{ marginBottom: 10 }}>
                <input className="hae" value={c.name} onChange={(e) => setD((s) => ({ ...s, children: s.children.map((x) => x.id === c.id ? { ...x, name: e.target.value } : x) }))} style={{ ...inp, width: 74 }} />
                <input className="hae" inputMode="numeric" placeholder="숫자" value={c.value} onChange={(e) => setD((s) => ({ ...s, children: s.children.map((x) => x.id === c.id ? { ...x, value: e.target.value } : x) }))} style={{ ...inp, width: 66 }} />
                <select className="hae" value={c.unit} onChange={(e) => setD((s) => ({ ...s, children: s.children.map((x) => x.id === c.id ? { ...x, unit: e.target.value } : x) }))} style={{ ...inp, flex: 1 }}>
                  <option value="week">임신 주수</option><option value="month">개월</option><option value="year">세</option><option value="elem">초등</option><option value="mid">중등</option>
                </select>
                <button onClick={() => setD((s) => ({ ...s, children: s.children.filter((x) => x.id !== c.id) }))} style={{ background: "none", border: "none", color: C.ink3, fontSize: 20 }}>×</button>
              </div>
            ))}
            <button className="press w-full" onClick={() => setD((s) => ({ ...s, children: [...s.children, { id: uid("c"), name: ["첫째", "둘째", "셋째", "넷째"][s.children.length] || "아이", unit: "year", value: "" }] }))}
              style={{ background: "none", border: `1px dashed ${C.line}`, borderRadius: 12, padding: "11px 0", fontSize: 13, color: C.ink2 }}>아이 추가</button>
            {!d.children.length && <div style={{ fontSize: 12.5, color: C.ink3, marginTop: 12, lineHeight: 1.6 }}>아이가 없으면 그냥 넘어가세요. 육아·유치원·기저귀 같은 건 처음부터 안 보여드려요.</div>}
          </div></Card>
        )}

        {step === 2 && d.flags.pet && (
          <div style={{ marginBottom: 14 }}>
            <Eyebrow>반려동물 종류</Eyebrow>
            <Card style={{ marginTop: 7 }}>
              <div style={{ padding: 15 }}>
                <div className="flex flex-wrap gap-2">
                  {Object.keys(PET_TYPES).map((k) => {
                    const on = (d.petTypes || {})[k];
                    return (
                      <button key={k} className="press" onClick={() => setD((sv) => ({ ...sv, petTypes: { ...(sv.petTypes || {}), [k]: !on } }))}
                        style={{ background: on ? C.mossSoft : C.bg, color: on ? C.moss : C.ink2, border: `1px solid ${on ? C.moss : C.line}`, borderRadius: R.pill, padding: "10px 15px", fontSize: 13, fontWeight: 600 }}>
                        {PET_TYPES[k].emoji} {PET_TYPES[k].label}
                      </button>
                    );
                  })}
                </div>
                <div style={{ fontSize: 12, color: C.ink3, marginTop: 11, lineHeight: 1.6 }}>종류마다 챙길 게 달라서요. 고양이는 모래, 강아지는 산책·동물등록, 물고기는 물갈이가 따로 뜹니다.</div>
              </div>
            </Card>
          </div>
        )}

        {step === 2 && FLAG_GROUPS.map((g) => (
          <div key={g} style={{ marginBottom: 14 }}>
            <Eyebrow>{g}</Eyebrow>
            <Card style={{ marginTop: 7 }}>
              {Object.keys(FLAGS).filter((k) => FLAGS[k].g === g).map((k, i, arr) => {
                const on = d.flags[k];
                return (
                  <button key={k} className="press flex items-center gap-3 w-full text-left" onClick={() => setD((s) => ({ ...s, flags: { ...s.flags, [k]: !s.flags[k] } }))}
                    style={{ background: on ? C.mossSoft : "transparent", border: "none", borderBottom: i === arr.length - 1 ? "none" : `1px solid ${C.line}`, padding: "13px 15px" }}>
                    <span style={{ fontSize: 18 }}>{FLAGS[k].emoji}</span>
                    <span className="flex-1 min-w-0">
                      <span style={{ display: "block", fontSize: 14.5, fontWeight: 600, color: on ? C.moss : C.ink }}>{FLAGS[k].label}</span>
                      <span style={{ display: "block", fontSize: 12, color: C.ink3, marginTop: 1 }}>{FLAGS[k].desc}</span>
                    </span>
                    <span style={{ width: 21, height: 21, borderRadius: 7, flexShrink: 0, border: `1.5px solid ${on ? C.moss : C.line}`, background: on ? C.moss : "transparent", color: "#fff", fontSize: 12, lineHeight: "19px", textAlign: "center" }}>{on ? "✓" : ""}</span>
                  </button>
                );
              })}
            </Card>
          </div>
        ))}

        {step === 3 && cids.length > 0 && (() => {
          const cid = cids[Math.min(page, cids.length - 1)];
          const grp = byCat[cid];
          const onHere = grp.items.filter((r) => (routines[r.key] || { on: true }).on).length;
          return (
            <>
              <div className="flex items-center justify-between" style={{ marginBottom: 12 }}>
                <div className="flex items-center gap-2">
                  <span style={{ fontSize: 22 }}>{grp.emoji}</span>
                  <span className="disp" style={{ fontSize: 19, fontWeight: 600 }}>{grp.label}</span>
                </div>
                <span className="mono" style={{ fontSize: 11, color: C.ink3 }}>{page + 1} / {cids.length}</span>
              </div>
              <div style={{ fontSize: 12.5, color: C.ink3, marginBottom: 10, lineHeight: 1.6 }}>
                {grp.items.length}개 중 {onHere}개를 켜뒀어요 · 주기를 누르면 바꿀 수 있어요<br />
                청소·빨래·음식은 <b style={{ color: C.ink2 }}>청소·집안일 / 빨래·옷 / 식단·냉장고 / 가전·가구</b> 네 영역에 나눠 담겨 있어요. 계절 항목도 여기서 다 보입니다.
              </div>
              <Card>
                {grp.items.map((r, i, arr) => {
                  const cfg = routines[r.key] || { on: true, cycle: cycleToDays(r.seed.cy) };
                  return (
                    <div key={r.key} className="flex items-center gap-3" style={{ padding: "13px 15px", borderBottom: i === arr.length - 1 ? "none" : `1px solid ${C.line}`, opacity: cfg.on ? 1 : .4 }}>
                      <span className="flex-1 min-w-0">
                        <span style={{ display: "block", fontSize: 14.5, fontWeight: 500 }}>{r.seed.t}</span>
                        {r.seed.season && <span style={{ display: "block", fontSize: 11, color: C.sun, marginTop: 2 }}>{r.seed.season === "summer" ? "여름에만" : "겨울에만"}</span>}
                      </span>
                      <button className="press" onClick={() => setPick(r.key)}
                        style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: 999, padding: "5px 11px", fontSize: 12, color: C.ink2, whiteSpace: "nowrap" }}>{cycleLabel(cfg.cycle)}</button>
                      <button className="press" onClick={() => setRoutines((pv) => ({ ...pv, [r.key]: { ...cfg, on: !cfg.on } }))} aria-label="사용 여부"
                        style={{ width: 42, height: 25, borderRadius: 99, border: "none", background: cfg.on ? C.moss : C.line, position: "relative", flexShrink: 0 }}>
                        <span style={{ position: "absolute", top: 3, left: cfg.on ? 20 : 3, width: 19, height: 19, borderRadius: 99, background: "#fff", transition: "left .18s" }} />
                      </button>
                      {r.custom && <button onClick={() => setD((sv) => ({ ...sv, customRoutines: sv.customRoutines.filter((x) => x.id !== r.seed.id) }))}
                        style={{ background: "none", border: "none", color: C.ink3, fontSize: 17, padding: 0 }}>×</button>}
                    </div>
                  );
                })}
                <div className="flex items-center gap-2" style={{ padding: "12px 15px", borderTop: `1px solid ${C.line}`, background: C.bg }}>
                  <input className="hae" value={newItem} onChange={(e) => setNewItem(e.target.value)}
                    placeholder="우리 집만의 일 추가 (예: 김치 담그기)"
                    style={{ flex: 1, border: `1px solid ${C.line}`, borderRadius: 10, padding: "9px 11px", fontSize: 13.5, background: C.card, color: C.ink }} />
                  <button className="press" onClick={() => {
                    const title = newItem.trim(); if (!title) return;
                    const nid = uid("cr");
                    setD((sv) => ({ ...sv, customRoutines: [...(sv.customRoutines || []), { id: nid, title, category: cid, cycle: 7 }] }));
                    setRoutines((pv) => ({ ...pv, [`c:${nid}`]: { on: true, cycle: 7 } }));
                    setNewItem("");
                  }} style={{ background: C.moss, color: "#fff", border: "none", borderRadius: 10, padding: "9px 14px", fontSize: 13, fontWeight: 600, whiteSpace: "nowrap" }}>추가</button>
                </div>
              </Card>
              <div className="flex gap-2" style={{ marginTop: 10 }}>
                <button className="press" onClick={() => setRoutines((pv) => { const n = { ...pv }; grp.items.forEach((r) => { n[r.key] = { ...(n[r.key] || { cycle: cycleToDays(r.seed.cy) }), on: true }; }); return n; })}
                  style={{ flex: 1, background: "transparent", border: `1px solid ${C.line}`, borderRadius: 12, padding: "10px 0", fontSize: 12.5, color: C.ink2 }}>전부 켜기</button>
                <button className="press" onClick={() => setRoutines((pv) => { const n = { ...pv }; grp.items.forEach((r) => { n[r.key] = { ...(n[r.key] || { cycle: cycleToDays(r.seed.cy) }), on: false }; }); return n; })}
                  style={{ flex: 1, background: "transparent", border: `1px solid ${C.line}`, borderRadius: 12, padding: "10px 0", fontSize: 12.5, color: C.ink2 }}>이 영역은 건너뛰기</button>
              </div>
              <div className="flex gap-1.5" style={{ marginTop: 16, justifyContent: "center" }}>
                {cids.map((_, i) => <span key={i} onClick={() => setPage(i)} style={{ width: i === page ? 16 : 6, height: 6, borderRadius: 99, background: i === page ? C.moss : C.line, cursor: "pointer", transition: "width .2s" }} />)}
              </div>
              {pick && (
                <CyclePicker current={(routines[pick] || {}).cycle} title="얼마마다 할까요?"
                  onPick={(dd) => { setRoutines((pv) => ({ ...pv, [pick]: { ...pv[pick], cycle: dd, on: true } })); setPick(null); }}
                  onOff={() => { setRoutines((pv) => ({ ...pv, [pick]: { ...pv[pick], on: false } })); setPick(null); }}
                  onClose={() => setPick(null)} />
              )}
            </>
          );
        })()}
      </div>

      <div style={{ marginTop: 22 }}>
        <Btn onClick={() => {
          if (step < 3) return setStep(step + 1);
          if (page < cids.length - 1) { setPage(page + 1); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
          const init = {};
          Object.keys(routines).forEach((k) => {
            const c = routines[k];
            init[k] = { on: c.on, cycle: c.cycle, nextAt: Date.now() + Math.floor(Math.random() * Math.min(c.cycle, 3)) * DAY };
          });
          setSt({ ...d, members: d.members.filter((m) => m.name.trim()), routines: init, onboarded: true });
        }}>{step < 3 ? "다음" : (page < cids.length - 1 ? "다음 영역" : "시작하기")}</Btn>
        {step > 0 && <Btn kind="quiet" onClick={() => { if (step === 3 && page > 0) return setPage(page - 1); setStep(step - 1); }}>이전</Btn>}
        {step === 3 && <p style={{ fontSize: 12, color: C.ink3, textAlign: "center", marginTop: 4, lineHeight: 1.7 }}>지금 다 정하지 않아도 괜찮아요. 나중에 설정에서 바꿀 수 있어요.<br />평소엔 오늘 필요한 것만 보여드립니다.</p>}
      </div>
    </div>
  );
}

/* ── 헤더 ─────────────────────────────────────── */
function Header() {
  const { st, me, setMe, tab, setTab } = use();
  const inSet = tab === "set";
  return (
    <div className="stick flex items-center justify-between px-5" style={{ paddingTop: 14, paddingBottom: 12 }}>
      <div className="flex items-center gap-2 min-w-0">
        <div className="disp" style={{ fontSize: 18, fontWeight: 700, letterSpacing: "-.035em" }}>{BRAND}</div>
        {st.members.length > 1 && (
          <span style={{ fontSize: 11, color: C.ink3, whiteSpace: "nowrap" }}>
            · {(st.members.find((m) => m.id === me) || {}).name} 화면
          </span>
        )}
      </div>
      <div className="flex items-center gap-1.5">
        {st.members.map((m) => (
          <button key={m.id} className="press" onClick={() => setMe(m.id)} aria-label={`${m.name} 화면으로 보기`}
            style={{ background: "none", border: "none", padding: 0, lineHeight: 0, opacity: me === m.id ? 1 : .28 }}>
            <Avatar member={m} size={28} />
          </button>
        ))}
        <button className="press" onClick={() => setTab(inSet ? "home" : "set")} aria-label={inSet ? "설정 닫기" : "설정"}
          style={{ width: 30, height: 30, marginLeft: 4, borderRadius: 999, border: `1px solid ${inSet ? C.moss : C.line}`, background: inSet ? C.mossSoft : C.card, color: inSet ? C.moss : C.ink2, fontSize: 13 }}>{inSet ? "✕" : "⚙"}</button>
      </div>
    </div>
  );
}

/* ── 반복 업무 행 ─────────────────────────────── */
function RoutineRow({ r, delay = 0, last, compact, manage }) {
  const { st, setSt, routineAction, setRoutine, say } = use();
  const cfg = st.routines[r.key] || { cycle: cycleToDays(r.seed.cy), on: true };
  const owner = st.members.find((m) => m.id === cfg.owner);
  const [pick, setPick] = useState(false);
  const [own, setOwn] = useState(false);
  const [rename, setRename] = useState(null);
  const overdue = (cfg.nextAt || 0) < todayKey();
  const catId = r.child ? `kid:${r.child.id}` : r.seed.cat;

  return (
    <div className="rise flex items-start gap-3" style={{ padding: "15px 16px", borderBottom: last ? "none" : `1px solid ${C.lineSoft}`, animationDelay: `${delay}ms` }}>
      <button className="press" onClick={() => routineAction(r.key, cfg, "done")} aria-label="했어요"
        style={{ width: 23, height: 23, marginTop: 1, borderRadius: 8, flexShrink: 0, border: `1.5px solid ${C.line}`, background: "transparent" }} />
      <div className="flex-1 min-w-0">
        <div style={{ fontSize: 15, fontWeight: 500, lineHeight: 1.45 }}>
          {r.seed.t}
          {r.child ? <span style={{ color: C.ink3, fontWeight: 400 }}> · {r.child.name}</span> : null}
          {r.seed.season ? <span style={{ color: C.sun, fontWeight: 400, fontSize: 12 }}> · {r.seed.season === "summer" ? "여름" : "겨울"}</span> : null}
          {r.custom ? <button onClick={() => setRename(r.seed.t)} style={{ marginLeft: 6, background: "none", border: "none", color: C.ink3, fontSize: 11.5, padding: 0 }}>이름 고치기</button> : null}
        </div>
        {!compact && <div className="flex items-center gap-2 flex-wrap" style={{ marginTop: 8 }}>
          <button className="press" onClick={() => setPick(true)}
            style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "5px 11px", fontSize: 11.5, color: C.ink2 }}>{patternLabel(cfg)}</button>
          <button className="press" onClick={() => routineAction(r.key, cfg, "later")}
            style={{ background: "none", border: "none", color: C.ink3, fontSize: 11.5, padding: "4px 2px" }}>내일 할게요</button>
          <button className="press" onClick={() => routineAction(r.key, cfg, "skip")}
            style={{ background: "none", border: "none", color: C.ink3, fontSize: 11.5, padding: "4px 2px" }}>이번엔 건너뛰기</button>
          {cfg.anchor && <button className="press" onClick={() => downloadICS(r.seed.t, nextFromAnchor(cfg.anchor, 0), r.seed.tg)}
            style={{ background: "none", border: "none", color: C.moss, fontSize: 11.5, padding: "4px 2px" }}>캘린더에 넣기</button>}
        </div>}
      </div>
      {overdue && <span style={{ fontSize: 11, color: C.ink3, whiteSpace: "nowrap", marginTop: 3 }}>지난 회차</span>}
      {manage ? (
        <button className="press" onClick={() => setRoutine(r.key, { on: !(cfg.on !== false) })} aria-label="사용 여부"
          style={{ width: 42, height: 25, borderRadius: 99, border: "none", background: cfg.on !== false ? C.moss : C.line, position: "relative", flexShrink: 0, marginTop: 1 }}>
          <span style={{ position: "absolute", top: 3, left: cfg.on !== false ? 20 : 3, width: 19, height: 19, borderRadius: 99, background: "#fff", transition: "left .18s" }} />
        </button>
      ) : (
        <button className="press" onClick={() => setOwn(true)} aria-label="담당자 정하기" style={{ background: "none", border: "none", padding: 0, lineHeight: 0, marginTop: 1 }}>
          <Avatar member={owner} size={25} />
        </button>
      )}

      {own && <OwnerPicker title={r.seed.t} current={cfg.owner} categoryId={catId}
        onPick={(id) => setRoutine(r.key, { owner: id })} onClose={() => setOwn(false)} />}

      {rename != null && (
        <Sheet onClose={() => setRename(null)}>
          <div className="disp" style={{ fontSize: 20, fontWeight: 600 }}>이름 고치기</div>
          <input className="hae" value={rename} onChange={(e) => setRename(e.target.value)}
            style={{ width: "100%", marginTop: 14, border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "13px 14px", fontSize: 15, background: C.bg, color: C.ink }} />
          <Btn style={{ marginTop: 16 }} onClick={() => {
            const t = rename.trim(); if (!t) return setRename(null);
            setSt((sv) => ({ ...sv, customRoutines: (sv.customRoutines || []).map((x) => x.id === r.seed.id ? { ...x, title: t } : x) }));
            setRename(null); say("바꿨어요");
          }}>저장</Btn>
          <Btn kind="quiet" onClick={() => {
            setSt((sv) => ({ ...sv, customRoutines: (sv.customRoutines || []).filter((x) => x.id !== r.seed.id) }));
            setRename(null); say("이 항목은 지웠어요");
          }}>이 항목 지우기</Btn>
        </Sheet>
      )}

      {pick && <CyclePicker current={cfg.cycle} title={r.seed.t} anchor={cfg.anchor} pattern={cfg}
        onPick={(dd) => { setRoutine(r.key, { cycle: dd, nextAt: nextByPattern({ ...cfg, cycle: dd }) }); setPick(false); say(`${cycleLabel(dd)}로 바꿨어요`); }}
        onPattern={(p) => { setRoutine(r.key, { ...p, nextAt: nextByPattern({ ...cfg, ...p }) }); say(p.dow !== "" && p.dow != null ? `${WEEKDAY[Number(p.dow)]}요일마다 올려드릴게요` : p.dom ? `매달 ${p.dom === 31 ? "말" : p.dom}일에 올려드릴게요` : "요일·날짜 지정을 풀었어요"); }}
        onAnchor={(a) => { setRoutine(r.key, { anchor: a, cycle: a ? 365 : cfg.cycle, nextAt: a ? nextFromAnchor(a, 7) : cfg.nextAt }); setPick(false); say(a ? `${anchorLabel(a)} 기준으로 미리 알려드릴게요` : "날짜를 지웠어요"); }}
        onOff={() => { setRoutine(r.key, { on: false }); setPick(false); say("이 항목은 접어둘게요"); }}
        onClose={() => setPick(false)} />}
    </div>
  );
}

/* ── Task 행 ──────────────────────────────────── */
function TaskRow({ t, delay = 0, last }) {
  const { st, cats, complete, assign, tossTask, addShopping, setSt, say } = use();
  const [rep2, setRep2] = useState(false);
  const [own, setOwn] = useState(false);
  const [edit, setEdit] = useState(false);
  const [toss, setToss] = useState(false);
  const [msg, setMsg] = useState("");
  const cat = cats.find((c) => c.id === t.category) || { emoji: "🗂", label: "기타" };
  const owner = st.members.find((m) => m.id === t.owner);
  const raiser = t.raisedBy === "ai" ? "ai" : st.members.find((m) => m.id === t.raisedBy);
  const upd = (patch) => setSt((sv) => ({ ...sv, tasks: sv.tasks.map((x) => x.id === t.id ? { ...x, ...patch } : x) }));
  const kidNames = (t.withKids || []).map((id) => (st.children.find((c) => c.id === id) || {}).name).filter(Boolean);

  return (
    <div className="rise flex items-start gap-3" style={{ padding: "15px 16px", borderBottom: last ? "none" : `1px solid ${C.lineSoft}`, animationDelay: `${delay}ms` }}>
      <button className="press" onClick={() => complete(t.id)} aria-label={t.done ? "되돌리기" : "완료"}
        style={{ width: 23, height: 23, marginTop: 1, borderRadius: 8, flexShrink: 0, border: `1.5px solid ${t.done ? C.moss : C.line}`, background: t.done ? C.moss : "transparent", color: "#fff", fontSize: 12, lineHeight: "20px" }}>{t.done ? "✓" : ""}</button>
      <div className="flex-1 min-w-0">
        <button className="text-left w-full" onClick={() => !t.done && setEdit(true)} disabled={t.done}
          style={{ background: "none", border: "none", padding: 0, fontSize: 15, fontWeight: 500, lineHeight: 1.45, color: t.done ? C.ink3 : C.ink, textDecoration: t.done ? "line-through" : "none" }}>
          {t.title}
        </button>
        <div className="flex items-center gap-1.5 flex-wrap" style={{ fontSize: 11.5, color: C.ink3, marginTop: 5 }}>
          <span>{cat.emoji} {cat.label}</span>
          {kidNames.length ? <span>· 🧒 {kidNames.join(", ")}와 함께</span> : null}
          {t.note && <span>· {t.note}</span>}
          {!t.done && raiser && <span>· {raiser === "ai" ? `${BRAND}이 챙김` : `${raiser.name}이 떠올림`}</span>}
          {!t.done && t.tossedBy && <span style={{ color: C.sun }}>· {(st.members.find((m) => m.id === t.tossedBy) || {}).name}이 넘김</span>}
          {t.done && t.doneBy && <span>· {(st.members.find((m) => m.id === t.doneBy) || {}).name} 완료</span>}
        </div>
        {!t.done && (
          <div className="flex items-center gap-1.5 flex-wrap" style={{ marginTop: 9 }}>
            <button className="press" onClick={() => setEdit(true)}
              style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "5px 11px", fontSize: 11.5, color: C.ink2 }}>고치기</button>
            {!t.seedId && <button className="press" onClick={() => setRep2(true)}
              style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "5px 11px", fontSize: 11.5, color: C.ink2 }}>반복으로</button>}
            {st.members.length > 1 && <button className="press" onClick={() => setToss(true)}
              style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "5px 11px", fontSize: 11.5, color: C.ink2 }}>넘기기</button>}
            {(t.status === "buy" || /사기|구매|주문|장보기/.test(t.title)) && (
              <button className="press" onClick={() => { addShopping([t.title.replace(/\s*(사기|구매|주문)$/, "")], t.id); say("장바구니에 담았어요"); }}
                style={{ background: C.mossSoft, border: `1px solid ${C.mossSoft}`, borderRadius: R.pill, padding: "5px 11px", fontSize: 11.5, color: C.moss, fontWeight: 600 }}>🛒 장바구니에</button>
            )}
          </div>
        )}
        {!t.done && <LinkCards group={null} text={`${t.title} ${t.note || ""}`} compact />}
      </div>
      <div className="flex items-center gap-2" style={{ marginTop: 1 }}>
        {!t.done && <Chip status={t.status} />}
        {!t.done ? <button className="press" onClick={() => setOwn(true)} aria-label="담당자 정하기" style={{ background: "none", border: "none", padding: 0, lineHeight: 0 }}><Avatar member={owner} /></button>
          : <Avatar member={st.members.find((m) => m.id === t.doneBy)} dim />}
      </div>

      {own && <OwnerPicker title={t.title} current={t.owner} categoryId={t.category} withKids={t.withKids || []} onWithKids
        onPick={(id, kids) => upd({ owner: id, withKids: kids })} onClose={() => setOwn(false)} />}

      {toss && (
        <Sheet onClose={() => setToss(false)}>
          <div className="disp" style={{ fontSize: 20, fontWeight: 600 }}>누구에게 넘길까요?</div>
          <p style={{ fontSize: 13, color: C.ink2, marginTop: 8, lineHeight: 1.65 }}>“{t.title}” · 받는 사람 화면 맨 위에 뜹니다.</p>
          <input className="hae" value={msg} onChange={(e) => setMsg(e.target.value)} placeholder="한마디 (선택) — 예: 오늘 야근이라 못 해"
            style={{ width: "100%", marginTop: 14, border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "12px 13px", fontSize: 13.5, background: C.bg, color: C.ink }} />
          <div className="flex flex-col gap-2" style={{ marginTop: 14 }}>
            {st.members.filter((m) => m.id !== t.owner).map((m) => (
              <button key={m.id} className="press flex items-center gap-3" onClick={() => { tossTask(t.id, m.id, msg); setToss(false); setMsg(""); say(`${m.name}에게 넘겼어요`); }}
                style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.md, padding: "14px 16px", fontSize: 15, textAlign: "left" }}>
                <Avatar member={m} size={30} /> {m.name}에게
              </button>
            ))}
          </div>
        </Sheet>
      )}

      {edit && (
        <Sheet onClose={() => setEdit(false)}>
          <div className="disp" style={{ fontSize: 20, fontWeight: 600 }}>항목 고치기</div>
          <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 16 }}>할 일 이름</div>
          <input className="hae" value={t.title} onChange={(e) => upd({ title: e.target.value })}
            style={{ width: "100%", marginTop: 8, border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "13px 14px", fontSize: 15, background: C.bg, color: C.ink }} />
          <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 14 }}>메모</div>
          <input className="hae" value={t.note || ""} onChange={(e) => upd({ note: e.target.value })} placeholder="왜 해야 하는지 짧게"
            style={{ width: "100%", marginTop: 8, border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "12px 14px", fontSize: 13.5, background: C.bg, color: C.ink }} />
          <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 18 }}>언제 할 일인가요?</div>
          <div className="flex flex-wrap gap-2" style={{ marginTop: 10 }}>
            {STATUS_ORDER.filter((k) => k !== "repeat").map((k) => (
              <button key={k} className="press" onClick={() => upd({ status: k })}
                style={{ background: t.status === k ? STATUS[k].bg : C.bg, color: t.status === k ? STATUS[k].fg : C.ink2,
                         border: `1px solid ${t.status === k ? STATUS[k].fg : C.line}`, borderRadius: R.pill, padding: "8px 13px", fontSize: 12.5, fontWeight: 600 }}>{STATUS[k].label}</button>
            ))}
          </div>
          <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 18 }}>어느 영역에 넣을까요?</div>
          <div className="flex flex-wrap gap-2" style={{ marginTop: 10 }}>
            {[...cats, { id: "etc", emoji: "🗂", label: "기타" }].map((c) => (
              <button key={c.id} className="press" onClick={() => upd({ category: c.id })}
                style={{ background: t.category === c.id ? C.mossSoft : C.bg, color: t.category === c.id ? C.moss : C.ink2,
                         border: `1px solid ${t.category === c.id ? C.moss : C.line}`, borderRadius: R.pill, padding: "8px 12px", fontSize: 12.5 }}>{c.emoji} {c.label}</button>
            ))}
          </div>
          <Btn style={{ marginTop: 20 }} onClick={() => setEdit(false)}>확인</Btn>
          <Btn kind="quiet" onClick={() => { setSt((sv) => ({ ...sv, tasks: sv.tasks.filter((x) => x.id !== t.id) })); setEdit(false); say("지웠어요"); }}>이 할 일 지우기</Btn>
        </Sheet>
      )}

      {rep2 && <CyclePicker title={t.title} current={30} pattern={{}}
        onPattern={(p) => {
          const cid = uid("cr");
          const cfg = { on: true, cycle: p.dow != null && p.dow !== "" ? 7 : 30, ...p };
          setSt((sv) => ({
            ...sv,
            customRoutines: [...(sv.customRoutines || []), { id: cid, title: t.title, category: t.category, cycle: cfg.cycle }],
            routines: { ...sv.routines, [`c:${cid}`]: { ...cfg, nextAt: nextByPattern(cfg) } },
          }));
          setRep2(false); say("정기 일정으로 등록했어요");
        }}
        onAnchor={(a) => {
          if (!a) return setRep2(false);
          const cid = uid("cr");
          setSt((sv) => ({
            ...sv,
            customRoutines: [...(sv.customRoutines || []), { id: cid, title: t.title, category: t.category, cycle: 365 }],
            routines: { ...sv.routines, [`c:${cid}`]: { on: true, cycle: 365, anchor: a, nextAt: nextFromAnchor(a, 7) } },
          }));
          setRep2(false); say(`${anchorLabel(a)} 기준으로 매년 챙겨드릴게요`);
        }}
        onPick={(dd) => {
          const cid = uid("cr");
          setSt((sv) => ({
            ...sv,
            customRoutines: [...(sv.customRoutines || []), { id: cid, title: t.title, category: t.category, cycle: dd, createdFrom: t.id }],
            routines: { ...sv.routines, [`c:${cid}`]: { on: true, cycle: dd, nextAt: Date.now() + dd * DAY } },
          }));
          setRep2(false); say(`${cycleLabel(dd)}마다 챙겨드릴게요`);
        }} onClose={() => setRep2(false)} />}
    </div>
  );
}

/* ── 생애주기 추천 카드 ───────────────────────── */
function RecCard({ rec, delay = 0 }) {
  const { st, setPref, setSt, addTasks, say, log } = use();
  const [mode, setMode] = useState(null);
  const seed = rec.seed;
  const category = seed.kid ? `kid:${rec.child.id}` : seed.cat;
  const soon = rec.dateKnown && rec.dday <= 7;
  const accept = (owner) => {
    addTasks([{ title: seed.t, category, status: seed.st, note: seed.tg, seedId: seed.id, coverage: "system", owner: owner || null }], "ai");
    setPref(rec.key, { accepted: true }); log("rec_accept", { id: seed.id }); say(owner ? "담당자와 함께 담았어요" : "할 일에 담았어요");
  };
  const feedback = (type) => {
    setSt((s) => ({ ...s, feedback: [...s.feedback, { id: seed.id, type, ts: Date.now() }] }));
    /* 피드백을 바로 반영: 이르면 늦추고, 늦으면 당깁니다 */
    if (type === "너무 이름") setPref(rec.key, { lead: Math.max(3, (rec.lead || 30) - 30) });
    if (type === "너무 늦음") setPref(rec.key, { lead: (rec.lead || 30) + 30 });
  };
  return (
    <>
      <div className="rise" style={{ marginBottom: 10, animationDelay: `${delay}ms` }}>
        <Card style={{ borderColor: soon ? C.persim : C.line }}>
          <div style={{ padding: 17 }}>
            <div className="flex items-start justify-between gap-3">
              <div className="min-w-0">
                <div style={{ fontSize: 16, fontWeight: 600, letterSpacing: "-.01em" }}>{seed.t}</div>
                <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 5 }}>필요한 때 · {seed.tg}{rec.child ? ` · ${rec.child.name}` : ""}</div>
              </div>
              <span className="mono" style={{ fontSize: 12.5, fontWeight: 500, color: rec.dateKnown ? (soon ? C.persim : C.moss) : C.ink3, whiteSpace: "nowrap" }}>
                {rec.dateKnown ? (rec.dday <= 0 ? "지금" : `D-${rec.dday}`) : "시점 미정"}
              </span>
            </div>
            {seed.ask && <div style={{ marginTop: 12, background: C.mossSoft, color: C.moss, borderRadius: 12, padding: "11px 13px", fontSize: 13, lineHeight: 1.55 }}>{seed.ask}</div>}
            <button className="press w-full" onClick={() => accept()}
              style={{ marginTop: 14, background: C.moss, color: "#fff", border: "none", borderRadius: R.md, padding: "15px 0", fontSize: 14.5, fontWeight: 600 }}>할 일에 등록하기</button>
            <div className="flex gap-2" style={{ marginTop: 8 }}>
              <button className="press" onClick={() => { setPref(rec.key, { snoozedUntil: Date.now() + 30 * DAY }); say("한 달 뒤에 다시 알려드릴게요"); }}
                style={{ flex: 1, background: C.bg, color: C.ink2, border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "11px 0", fontSize: 12.5 }}>나중에</button>
              <button className="press" onClick={() => setMode("no")} style={{ flex: 1, background: C.bg, color: C.ink2, border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "11px 0", fontSize: 12.5 }}>관심 없음</button>
            </div>
            <div className="flex gap-4" style={{ marginTop: 11 }}>
              {[["시기 조정", "edit"], ["가족에게 넘기기", "give"], ["왜 지금?", "why"]].map(([l, m]) => (
                <button key={m} onClick={() => setMode(m)} style={{ background: "none", border: "none", color: C.ink3, fontSize: 11.5, padding: 0 }}>{l}</button>
              ))}
              {rec.dateKnown && <button onClick={() => downloadICS(seed.t, Date.now() + Math.max(rec.dday, 0) * DAY, seed.tg)}
                style={{ background: "none", border: "none", color: C.moss, fontSize: 11.5, padding: 0 }}>캘린더에 넣기</button>}
            </div>
            <LinkCards group={seed.g} text={seed.t} />
          </div>
        </Card>
      </div>

      {mode === "no" && (
        <Sheet onClose={() => setMode(null)}>
          <div className="disp" style={{ fontSize: 19, fontWeight: 600 }}>어떻게 할까요?</div>
          <p style={{ fontSize: 13.5, color: C.ink2, marginTop: 8 }}>“{seed.t}” 제안을 닫습니다.</p>
          <div style={{ marginTop: 16 }}>
            <Btn kind="ghost" onClick={() => { setPref(rec.key, { dismissedOnce: true }); feedback("이번만"); setMode(null); say("이번만 닫았어요"); }}>이번만 제외</Btn>
            <div style={{ height: 8 }} />
            <Btn kind="ghost" onClick={() => { setPref(rec.key, { enabled: false }); feedback("불필요"); setMode(null); say("앞으로 안 보여드릴게요"); }}>앞으로 제외</Btn>
            <Btn kind="quiet" onClick={() => { setSt((s) => ({ ...s, groupsOff: { ...s.groupsOff, [seed.g]: true } })); feedback("그룹차단"); setMode(null); say(`‘${seed.g}’ 관련을 모두 껐어요`); }}>‘{seed.g}’ 관련은 전부 안 받기</Btn>
          </div>
        </Sheet>
      )}
      {mode === "edit" && (
        <Sheet onClose={() => setMode(null)}>
          <div className="disp" style={{ fontSize: 19, fontWeight: 600 }}>얼마나 미리 알려드릴까요?</div>
          <p style={{ fontSize: 13.5, color: C.ink2, marginTop: 8, lineHeight: 1.7 }}>지금은 {rec.lead}일 전부터예요.</p>
          <div className="grid grid-cols-4 gap-2" style={{ marginTop: 16 }}>
            {[7, 14, 30, 60, 90, 120, 180, 270].map((dd) => (
              <button key={dd} className="press" onClick={() => { setPref(rec.key, { lead: dd }); feedback("수정"); setMode(null); say(`${dd}일 전부터 알려드릴게요`); }}
                style={{ background: rec.lead === dd ? C.mossSoft : C.bg, color: rec.lead === dd ? C.moss : C.ink2, border: `1px solid ${rec.lead === dd ? C.moss : C.line}`, borderRadius: 12, padding: "13px 0", fontSize: 13, fontWeight: 600 }}>{dd}일</button>
            ))}
          </div>
          <div style={{ fontSize: 12, color: C.ink3, marginTop: 18 }}>이 제안 어땠나요?</div>
          <div className="flex gap-2" style={{ marginTop: 8 }}>
            {["딱 필요", "너무 이름", "너무 늦음"].map((f) => (
              <button key={f} className="press" onClick={() => { feedback(f); setMode(null); say("반영할게요"); }}
                style={{ flex: 1, background: C.bg, border: `1px solid ${C.line}`, borderRadius: 999, padding: "10px 0", fontSize: 12.5, color: C.ink2 }}>{f}</button>
            ))}
          </div>
        </Sheet>
      )}
      {mode === "give" && (
        <Sheet onClose={() => setMode(null)}>
          <div className="disp" style={{ fontSize: 19, fontWeight: 600 }}>누구에게 맡길까요?</div>
          <div className="flex flex-col gap-2" style={{ marginTop: 16 }}>
            {st.members.map((m) => (
              <button key={m.id} className="press flex items-center gap-3" onClick={() => { accept(m.id); setMode(null); }}
                style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: 14, padding: "14px 16px", fontSize: 14.5 }}>
                <Avatar member={m} size={30} /> {m.name}에게
              </button>
            ))}
          </div>
        </Sheet>
      )}
      {mode === "why" && (
        <Sheet onClose={() => setMode(null)}>
          <div className="disp" style={{ fontSize: 19, fontWeight: 600 }}>왜 지금 보여드렸나요</div>
          <div style={{ fontSize: 14, color: C.ink2, marginTop: 12, lineHeight: 1.8 }}>
            이 항목은 <b style={{ color: C.ink }}>{seed.tg}</b>에 필요합니다.<br />
            준비는 보통 <b style={{ color: C.ink }}>{rec.lead}일 전</b>에 시작해야 늦지 않아요.
            {rec.child ? <> 지금 {rec.child.name}가 {childLabel(rec.child)}라서 그 시점이 왔습니다.</> : <> 우리 집에 해당하는 조건이라 올렸어요.</>}
            {seed.src && <><br /><br /><span style={{ color: C.ink3, fontSize: 12.5 }}>근거 · {seed.src.split(";").map((x) => SOURCE_NAME[x]).filter(Boolean).join(", ")}</span></>}
          </div>
        </Sheet>
      )}
    </>
  );
}

/* ── 휴일 날씨 브리핑 ─────────────────────────────
   금·토·일이나 연휴가 오면 그 전날에 한 번만 띄웁니다.
   금요일이 공휴일이면 자동으로 목요일에 뜹니다. */
const PLACES = [
  { label: "서울", lat: 37.5665, lon: 126.978 }, { label: "인천", lat: 37.4563, lon: 126.7052 },
  { label: "수원", lat: 37.2636, lon: 127.0286 }, { label: "대전", lat: 36.3504, lon: 127.3845 },
  { label: "대구", lat: 35.8714, lon: 128.6014 }, { label: "부산", lat: 35.1796, lon: 129.0756 },
  { label: "광주", lat: 35.1595, lon: 126.8526 }, { label: "울산", lat: 35.5384, lon: 129.3114 },
  { label: "춘천", lat: 37.8813, lon: 127.7300 }, { label: "전주", lat: 35.8242, lon: 127.1480 },
  { label: "청주", lat: 36.6424, lon: 127.4890 }, { label: "제주", lat: 33.4996, lon: 126.5312 },
];
const WMO = (c) => {
  if (c === 0) return { e: "☀️", t: "맑음" };
  if (c <= 2) return { e: "🌤", t: "구름 조금" };
  if (c === 3) return { e: "☁️", t: "흐림" };
  if (c <= 48) return { e: "🌫", t: "안개" };
  if (c <= 57) return { e: "🌦", t: "이슬비" };
  if (c <= 67) return { e: "🌧", t: "비" };
  if (c <= 77) return { e: "🌨", t: "눈" };
  if (c <= 82) return { e: "🌧", t: "소나기" };
  if (c <= 86) return { e: "🌨", t: "소나기눈" };
  return { e: "⛈", t: "천둥번개" };
};

function HolidayBrief() {
  const { st, setSt, setTab, addTasks, say } = use();
  const brk = useMemo(() => nextBreak(Date.now()), []);
  const [data, setData] = useState(null);
  const [err, setErr] = useState("");
  const asked = useRef(false);
  const place = st.place || PLACES[0];
  const show = brk && startOfDay(Date.now()) >= brk.briefAt && startOfDay(Date.now()) <= brk.days[brk.days.length - 1].getTime();

  useEffect(() => {
    if (!show || asked.current) return;
    asked.current = true;
    const cache = st.brief;
    if (cache && cache.date === todayStr() && cache.place === place.label) { setData(cache.daily); return; }
    (async () => {
      try {
        const r = await fetch(`/api/weather?lat=${place.lat}&lon=${place.lon}`);
        const d = await r.json();
        if (!r.ok || !d.time) throw new Error(d.error || "날씨 실패");
        setData(d);
        setSt((sv) => ({ ...sv, brief: { date: todayStr(), place: place.label, daily: d } }));
      } catch (e) { setErr("날씨를 못 가져왔어요. 잠시 뒤 다시 열어보세요."); }
    })();
  }, [show, place.label]);

  if (!show) return null;
  const rows = brk.days.map((d) => {
    const key = ymd(d);
    const i = data && data.time ? data.time.indexOf(key) : -1;
    if (i < 0) return { d, key };
    return { d, key, code: data.weather_code[i], max: data.temperature_2m_max[i], min: data.temperature_2m_min[i], pop: data.precipitation_probability_max[i] };
  });
  const wet = rows.some((r) => r.pop >= 60);
  const startLabel = `${brk.days[0].getMonth() + 1}월 ${brk.days[0].getDate()}일(${WEEKDAY[brk.days[0].getDay()]})`;

  return (
    <Card style={{ marginTop: 12, borderColor: C.sea }}>
      <div style={{ padding: "16px 17px" }}>
        <div className="flex items-center justify-between">
          <span className="mono" style={{ fontSize: 9.5, color: C.sea }}>HOLIDAY BRIEF</span>
          <select className="hae" value={place.label}
            onChange={(e) => { const p = PLACES.find((x) => x.label === e.target.value); asked.current = false; setSt((sv) => ({ ...sv, place: p, brief: null })); }}
            style={{ border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "4px 9px", fontSize: 11.5, background: C.bg, color: C.ink2 }}>
            {PLACES.map((p) => <option key={p.label} value={p.label}>{p.label}</option>)}
          </select>
        </div>
        <div style={{ fontSize: 15.5, fontWeight: 600, marginTop: 9, letterSpacing: "-.015em" }}>
          {startLabel}부터 {brk.days.length}일 쉬어요
        </div>
        {err && <div style={{ fontSize: 12.5, color: C.ink3, marginTop: 8 }}>{err}</div>}
        {!data && !err && <div className="flex gap-2" style={{ marginTop: 12 }}>{brk.days.map((_, i) => <div key={i} className="skel" style={{ flex: 1, height: 62 }} />)}</div>}
        {data && (
          <div className="flex gap-2" style={{ marginTop: 12 }}>
            {rows.map((r) => {
              const w = WMO(r.code);
              return (
                <div key={r.key} style={{ flex: 1, background: C.bg, borderRadius: R.sm, padding: "10px 4px", textAlign: "center" }}>
                  <div style={{ fontSize: 11, color: C.ink3 }}>{r.d.getDate()}일({WEEKDAY[r.d.getDay()]})</div>
                  <div style={{ fontSize: 19, marginTop: 3 }}>{w.e}</div>
                  <div style={{ fontSize: 11.5, marginTop: 3, fontWeight: 600 }}>{Math.round(r.max)}° <span style={{ color: C.ink3, fontWeight: 400 }}>{Math.round(r.min)}°</span></div>
                  {r.pop != null && <div className="mono" style={{ fontSize: 9.5, color: r.pop >= 60 ? C.sea : C.ink3, marginTop: 2 }}>{r.pop}%</div>}
                </div>
              );
            })}
          </div>
        )}
        <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 12, lineHeight: 1.65 }}>
          {wet ? "비 오는 날이 있어요. 실내 계획을 하나 잡아두면 덜 급합니다." : "나들이 가기 좋은 날씨예요. 예약이 필요한 곳은 지금이 마지막입니다."}
        </div>
        <LinkCards group="놀이" text={wet ? "실내 체험 키즈카페" : "주말 나들이 체험"} />
        <button className="press w-full" onClick={() => { addTasks([{ title: "휴일 계획 정하기", category: "event", status: "week", note: `${startLabel}부터 ${brk.days.length}일` }], "ai"); say("할 일에 담았어요"); }}
          style={{ marginTop: 12, background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "12px 0", fontSize: 13, color: C.ink2, width: "100%" }}>
          휴일 계획 할 일로 담기
        </button>
      </div>
    </Card>
  );
}

/* ── 자동차: 주유·엔진오일 시점 계산 ────────────────── */

  { d: 3, t: "욕실·세탁실 정리", n: "쓰던 세제는 남기지 말고" },
  { d: 2, t: "주방 나머지 싸기", n: "이틀치 식기만 남기기" },
  { d: 1, t: "침구·세면도구·충전기 싸기", n: "첫날 밤 상자 하나 따로" },
  { d: 0, t: "귀중품·서류는 직접 들고 이동", n: "도장·통장·계약서" },
  { d: -1, t: "전입신고·확정일자", n: "이사 후 14일 안, 보증금 보호와 직결" },
];

function MovePlan() {
  const { st, setSt, addTasks, say } = use();
  const [date, setDate] = useState(st.moveDate || "");
  if (!st.flags.moving) return null;
  const ms = date && /^\d{4}-\d{2}-\d{2}$/.test(date) ? new Date(date + "T00:00:00").getTime() : null;
  const dday = ms ? Math.ceil((startOfDay(ms) - todayKey()) / DAY) : null;
  const rows = ms ? PACK_PLAN.filter((p) => p.d <= (dday == null ? 99 : Math.max(dday, 0)) + 3) : [];

  return (
    <Card style={{ marginTop: 12 }}>
      <div style={{ padding: "15px 17px" }}>
        <div className="mono" style={{ fontSize: 9.5, color: C.ink3 }}>MOVING</div>
        <div style={{ fontSize: 15.5, fontWeight: 600, marginTop: 8, letterSpacing: "-.015em" }}>
          {dday == null ? "이사 날짜를 넣어주세요" : dday >= 0 ? `이사까지 ${dday}일` : "이사 뒤 정리 중"}
        </div>
        <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 5, lineHeight: 1.65 }}>
          한 번에 다 싸려면 못 합니다. 날짜를 넣으면 <b style={{ color: C.ink }}>방마다 하루치로 쪼개서</b> 나눠드려요.
        </div>
        <div className="flex gap-2" style={{ marginTop: 11 }}>
          <input className="hae" type="date" value={date} onChange={(e) => { setDate(e.target.value); setSt((sv) => ({ ...sv, moveDate: e.target.value })); }}
            style={{ flex: 1, border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "11px 12px", fontSize: 14, background: C.bg, color: C.ink }} />
          <button className="press" disabled={!ms} onClick={() => {
            const items = PACK_PLAN.map((p) => {
              const when = startOfDay(ms) - p.d * DAY;
              const left = Math.ceil((when - todayKey()) / DAY);
              const dt = new Date(when);
              return {
                title: p.t, category: p.d === -1 || p.d === 5 ? "finance" : "home",
                status: left <= 0 ? "now" : left <= 7 ? "week" : "remember",
                note: `${dt.getMonth() + 1}/${dt.getDate()} · ${p.n}`,
              };
            });
            const n = addTasks(items, "ai");
            say(`${n}개로 나눠 담았어요`);
          }} style={{ background: ms ? C.moss : C.line, color: ms ? "#fff" : C.ink3, border: "none", borderRadius: R.sm, padding: "0 16px", fontSize: 13, fontWeight: 600, whiteSpace: "nowrap" }}>계획 만들기</button>
        </div>
        {rows.length > 0 && (
          <div style={{ marginTop: 12, background: C.bg, borderRadius: R.sm, padding: "12px 13px" }}>
            <div style={{ fontSize: 11.5, color: C.ink3, marginBottom: 7 }}>이런 순서로 나눠집니다</div>
            {rows.slice(0, 5).map((p) => {
              const when = new Date(startOfDay(ms) - p.d * DAY);
              return (
                <div key={p.t} className="flex gap-2" style={{ fontSize: 12.5, color: C.ink2, lineHeight: 1.9 }}>
                  <span className="mono" style={{ color: C.ink3, whiteSpace: "nowrap" }}>{when.getMonth() + 1}/{when.getDate()}</span>
                  <span className="flex-1 min-w-0">{p.t}</span>
                </div>
              );
            })}
            {rows.length > 5 && <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 5 }}>외 {rows.length - 5}개</div>}
          </div>
        )}
        <LinkCards group="이사" text="포장이사 견적" />
      </div>
    </Card>
  );
}
