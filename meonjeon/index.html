  const [all, setAll] = useState(false);
  const [only, setOnly] = useState("all");   /* all = 다 같이 보기 / mine = 내 몫만 */
  const [openRoutine, setOpenRoutine] = useState(true);
  const [disc, setDisc] = useState([]);
  const [loadingDisc, setLoadingDisc] = useState(false);
  const asked = useRef(false);

  const recs = useMemo(() => buildRecommendations(st), [st]);
  const due = useMemo(() => dueRoutines(st), [st]);
  const openTasks = st.tasks.filter((t) => !t.done);
  const meName = (st.members.find((m) => m.id === me) || {}).name || "";
  const spouse = st.members.find((m) => m.id !== me);

  /* 이미 분담이 끝난 일은 각자 화면에서만 — "내 몫만 보기" */
  const isMine = (owner) => owner === me;
  const inbox = (st.toss || []).filter((z) => z.to === me && !z.seen);

  const cond = st.condition && st.condition.date === todayStr() ? st.condition : null;
  const level = cond ? cond.level : "ok";
  const limit = CONDITIONS[level].show;

  /* 매일 하는 것과 가끔 하는 것을 나눕니다 */
  const visible = (ownerId) => only === "all" || isMine(ownerId);
  const dailyAll = due.filter((r) => ((st.routines[r.key] || {}).cycle || 30) <= 3);
  const daily = dailyAll.filter((r) => visible((st.routines[r.key] || {}).owner));
  const occasional = due.filter((r) => !dailyAll.includes(r) && visible((st.routines[r.key] || {}).owner));
  const mineRoutines = due.filter((r) => (st.routines[r.key] || {}).owner === me);

  /* 생각·판단이 필요한 일 (여기만 3개 원칙) */
  const visTasks = openTasks.filter((t) => visible(t.owner));
  const think = [
    ...visTasks.filter((t) => t.status === "now").map((t) => ({ kind: "task", t })),
    ...occasional.map((r) => ({ kind: "routine", r })),
    /* 추천 카드는 아직 누구 몫도 아니라서 "내 몫만"에서는 뺍니다 */
    ...(only === "mine" ? [] : recs.filter((r) => r.dateKnown).map((r) => ({ kind: "rec", r }))),
    ...visTasks.filter((t) => t.status === "week").map((t) => ({ kind: "task", t })),
  ].slice(0, limit);
  const unowned = openTasks.filter((t) => !t.owner).length + due.filter((r) => !(st.routines[r.key] || {}).owner).length;
  const remain = openTasks.length + due.length + recs.length - think.length - daily.length;

  useEffect(() => {
    const dueSnooze = (st.discoverSnoozed || []).filter((x) => x.dueAt <= Date.now());
    if (dueSnooze.length) {
      setDisc((d) => [...dueSnooze, ...d].slice(0, 3));
      setSt((sv) => ({ ...sv, discoverSnoozed: (sv.discoverSnoozed || []).filter((x) => x.dueAt > Date.now()) }));
    }
  }, [st.onboarded]);

  /* AI 제안은 하루 한 번만 부릅니다 (로딩 줄이기) */
  useEffect(() => {
    if (asked.current || !st.onboarded || level === "low") return;
    asked.current = true;
    const cache = st.discoverCache;
    if (cache && cache.date === todayStr()) { setDisc((d) => (d.length ? d : cache.items || [])); return; }
    (async () => {
      setLoadingDisc(true);
      try {
        const r = await askClaude(`당신은 한국 가정의 살림을 대신 기억해주는 AI 비서 '${BRAND}'입니다.
아래 가구가 지금 시기에 미리 해두면 좋은데, 보통은 아무도 떠올리지 않는 일을 2개만 제안하세요.

가구: ${householdLine(st)}
오늘 날짜: ${todayStr()}
이미 챙기는 일: ${[...openTasks.map((t) => t.title), ...due.map((d) => d.seed.t)].slice(0, 20).join(", ") || "없음"}

규칙: 계절·다가오는 행사·아이 나이를 고려. 이미 챙기는 일과 겹치지 않게. 지금부터 준비해야 의미 있는 것만.
출력은 JSON 배열만: [{"title":"14자 이내","why":"왜 지금인지 40자 이내","when":"다시 알릴 시점(예: 9월에)","category":"추정 카테고리"}]`);
        if (Array.isArray(r)) {
          const items = r.filter((x) => x && x.title && !st.dismissedDiscover.includes(x.title)).slice(0, 2);
          setDisc((d) => [...d, ...items].slice(0, 3));
          setSt((sv) => ({ ...sv, discoverCache: { date: todayStr(), items } }));
        }
      } catch {}
      setLoadingDisc(false);
    })();
  }, [st.onboarded, level]);

  /* 기름이 이틀 남으면 오늘 목록에 스스로 올라옵니다 (하루 한 번) */
  useEffect(() => {
    if (!st.flags.car) return;
    const f = fuelForecast(st.car || {});
    if (!f || f.daysLeft > 2) return;
    if ((st.car || {}).alertedOn === todayStr()) return;
    if (st.tasks.some((t) => !t.done && t.title === "주유하기")) {
      setSt((sv) => ({ ...sv, car: { ...(sv.car || {}), alertedOn: todayStr() } }));
      return;
    }
    addTasks([{ title: "주유하기", category: "transport", status: f.daysLeft <= 1 ? "now" : "week", note: `기름 ${Math.max(f.daysLeft, 0)}일 남음`, coverage: "system" }], "ai");
    setSt((sv) => ({ ...sv, car: { ...(sv.car || {}), alertedOn: todayStr() } }));
  }, [st.onboarded, st.car && st.car.fuelAt, st.car && st.car.dailyKm]);

  const setCondition = (lv) => {
    setSt((sv) => ({ ...sv, condition: { date: todayStr(), level: lv, by: me } }));
    say(lv === "low" ? "오늘은 꼭 필요한 것만 남길게요" : "오늘도 잘 부탁드려요");
  };
  const handOver = () => {
    if (!spouse) return say("설정에서 가족을 먼저 추가해 주세요");
    let n = 0;
    setSt((sv) => {
      const ro = { ...sv.routines };
      due.forEach((r) => { const c = ro[r.key] || {}; if (!c.owner || c.owner === me) { ro[r.key] = { ...c, owner: spouse.id }; n++; } });
      return { ...sv, routines: ro };
    });
    say(`오늘 ${n}개를 ${spouse.name}에게 넘겼어요`);
  };
  const pushAll = () => {
    setSt((sv) => {
      const ro = { ...sv.routines };
      daily.forEach((r) => { ro[r.key] = { ...(ro[r.key] || {}), nextAt: Date.now() + DAY }; });
      return { ...sv, routines: ro };
    });
    say("오늘 루틴은 내일로 미뤘어요");
  };

  return (
    <>
      <div className="rise" style={{ marginTop: 12, borderRadius: R.xl, overflow: "hidden", position: "relative",
                                     background: "radial-gradient(120% 100% at 100% 0%, #235644 0%, #16302650 45%, transparent 70%), linear-gradient(165deg, #17332A 0%, #0F1A15 70%)",
                                     boxShadow: SHADOW_LIFT }}>
        <div style={{ position: "absolute", top: -40, right: -30, width: 160, height: 160, borderRadius: 999, background: "rgba(79,187,147,.12)", filter: "blur(6px)" }} />
        <div style={{ padding: "22px 21px 21px", position: "relative" }}>
          <div className="mono" style={{ fontSize: 9.5, color: "#7FB79E" }}>
            {new Date().getMonth() + 1}월 {new Date().getDate()}일 {WEEKDAY[new Date().getDay()]}요일
          </div>
          <div className="disp" style={{ color: "#fff", fontSize: 23, fontWeight: 600, lineHeight: 1.42, marginTop: 10, letterSpacing: "-.03em" }}>
            {level === "low" ? <>오늘은 {meName} 님,<br />이것만 하셔도 돼요.</> : <>{meName} 님,<br />생각할 건 {think.length}가지예요.</>}
          </div>
          <div style={{ color: "#93A69B", fontSize: 13, marginTop: 10, lineHeight: 1.65 }}>
            {remain > 0 ? `나머지 ${remain}개는 제가 기억하고 있을게요.` : "지금은 급한 게 없어요."}
          </div>
          <button className="press" onClick={() => setTab("speak")}
            style={{ width: "100%", marginTop: 17, background: "#fff", color: C.ink, border: "none", borderRadius: R.md, padding: "15px 0", fontSize: 14.5, fontWeight: 600 }}>생각나는 거 말하기</button>
        </div>
      </div>

      {/* 넘겨받은 일 — 받는 사람 화면 맨 위 */}
      {inbox.length > 0 && (
        <Card style={{ marginTop: 12, borderColor: C.sun }}>
          <div style={{ padding: "15px 17px" }}>
            <div className="mono" style={{ fontSize: 9.5, color: C.sun }}>넘어온 일</div>
            {inbox.map((z) => {
              const task = st.tasks.find((t) => t.id === z.taskId);
              const from = st.members.find((m) => m.id === z.from);
              if (!task) return null;
              return (
                <div key={z.id} style={{ marginTop: 9 }}>
                  <div style={{ fontSize: 14.5, fontWeight: 600 }}>{task.title}</div>
                  <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 4, lineHeight: 1.6 }}>
                    {from ? from.name : "가족"}이 넘겼어요{z.msg ? ` · “${z.msg}”` : ""}
                  </div>
                </div>
              );
            })}
            <button className="press w-full" onClick={() => setSt((sv) => ({ ...sv, toss: (sv.toss || []).map((z) => z.to === me ? { ...z, seen: true } : z) }))}
              style={{ marginTop: 12, background: C.sunSoft, color: C.sun, border: "none", borderRadius: R.sm, padding: "11px 0", fontSize: 13, fontWeight: 600 }}>확인했어요</button>
          </div>
        </Card>
      )}

      {/* 보기 전환: 다 같이 / 내 몫만 */}
      {st.members.length > 1 && (
        <>
          <div className="flex gap-1.5" style={{ marginTop: 12, background: C.card, border: `1px solid ${C.lineSoft}`, borderRadius: R.pill, padding: 4, boxShadow: SHADOW }}>
            {[["all", "다 같이 보기"], ["mine", `${meName} 몫만`]].map(([k, l]) => (
              <button key={k} className="press" onClick={() => setOnly(k)}
                style={{ flex: 1, background: only === k ? C.ink : "transparent", color: only === k ? "#fff" : C.ink2, border: "none", borderRadius: R.pill, padding: "9px 0", fontSize: 12.5, fontWeight: only === k ? 600 : 400 }}>{l}</button>
            ))}
          </div>
          {only === "mine" && (
            <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 7, paddingLeft: 4, lineHeight: 1.6 }}>
              내 몫으로 정해진 일만 보여요. AI 추천과 담당 없는 일 {unowned}개는 ‘다 같이 보기’에 있어요.
            </div>
          )}
        </>
      )}

      <HolidayBrief />
      <CarWatch />
      <MovePlan />

      {/* 장바구니에 담아두고 잊은 것 */}
      {(st.shopping || []).filter((x) => !x.got).length > 0 && (
        <button className="press w-full text-left" onClick={() => setTab("shop")}
          style={{ marginTop: 12, background: C.card, border: `1px solid ${C.lineSoft}`, borderRadius: R.lg, padding: "14px 16px", boxShadow: SHADOW }}>
          <span className="flex items-center gap-3">
            <span style={{ fontSize: 20 }}>🛒</span>
            <span className="flex-1 min-w-0">
              <span style={{ display: "block", fontSize: 14, fontWeight: 600 }}>장바구니에 {(st.shopping || []).filter((x) => !x.got).length}개가 남아 있어요</span>
              <span style={{ display: "block", fontSize: 12, color: C.ink3, marginTop: 3 }}>
                {(st.shopping || []).filter((x) => !x.got).slice(0, 3).map((x) => x.name).join(" · ")}
              </span>
            </span>
            <span style={{ fontSize: 14, color: C.moss }}>›</span>
          </span>
        </button>
      )}

      {/* 오늘 컨디션 */}
      <Card style={{ marginTop: 12 }}>
        <div style={{ padding: "14px 16px" }}>
          <div className="flex items-center justify-between">
            <span style={{ fontSize: 13.5, fontWeight: 600 }}>오늘 컨디션 어떠세요?</span>
            {cond && <span style={{ fontSize: 11.5, color: C.ink3 }}>{CONDITIONS[level].desc}</span>}
          </div>
          <div className="flex gap-2" style={{ marginTop: 10 }}>
            {Object.keys(CONDITIONS).map((k) => (
              <button key={k} className="press" onClick={() => setCondition(k)}
                style={{ flex: 1, background: level === k && cond ? C.mossSoft : C.bg, color: level === k && cond ? C.moss : C.ink2,
                         border: `1px solid ${level === k && cond ? C.moss : C.line}`, borderRadius: 12, padding: "10px 0", fontSize: 12.5, fontWeight: 600 }}>
                {CONDITIONS[k].emoji} {CONDITIONS[k].label}
              </button>
            ))}
          </div>
          {level === "low" && cond && spouse && (
            <button className="press w-full" onClick={handOver}
              style={{ marginTop: 10, background: C.moss, color: "#fff", border: "none", borderRadius: 12, padding: "12px 0", fontSize: 13, fontWeight: 600 }}>
              오늘 몫을 {spouse.name}에게 넘기기
            </button>
          )}
          {level === "low" && cond && (
            <div style={{ fontSize: 12, color: C.ink3, marginTop: 8, lineHeight: 1.6 }}>
              {st.conditionShare === false
                ? "지금은 나만 보기예요. 가족에게는 안 보입니다. (설정에서 바꿀 수 있어요)"
                : "가족이 앱을 열면 오늘 컨디션이 보여요. 말하지 않아도 알 수 있게요."}
            </div>
          )}
        </div>
      </Card>

      {cond && level !== "low" && st.condition.by !== me && st.conditionShare !== false && (
        <Card style={{ marginTop: 10, borderColor: C.moss }}>
          <div style={{ padding: "13px 15px", fontSize: 13, color: C.moss }}>
            오늘 {(st.members.find((m) => m.id === st.condition.by) || {}).name} 님 컨디션은 {CONDITIONS[level].label}
          </div>
        </Card>
      )}

      <Section eyebrow="TODAY" title={level === "low" ? "이것만 하셔도 돼요" : "생각할 건 이만큼"} right={think.length ? "나머지는 접어뒀어요" : null}>
        {think.length ? (
          <>
            {think.filter((x) => x.kind !== "rec").length > 0 && (
              <Card>
                {think.filter((x) => x.kind !== "rec").map((x, i, a) => x.kind === "task"
                  ? <TaskRow key={x.t.id} t={x.t} delay={i * 55} last={i === a.length - 1} />
                  : <RoutineRow key={x.r.key} r={x.r} delay={i * 55} last={i === a.length - 1} />)}
              </Card>
            )}
            {think.filter((x) => x.kind === "rec").map((x, i) => <div key={x.r.key} style={{ marginTop: 10 }}><RecCard rec={x.r} delay={120 + i * 60} /></div>)}
          </>
        ) : (
          <Card flat style={{ background: "transparent", borderStyle: "dashed", boxShadow: "none" }}>
            <div style={{ padding: "26px 18px", textAlign: "center", fontSize: 13.5, color: C.ink3, lineHeight: 1.7 }}>
              {only === "mine"
                ? <>아직 {meName} 몫으로 정해진 일이 없어요.<br />항목 오른쪽 동그라미를 눌러 담당을 정해보세요.</>
                : <>오늘 따로 생각할 일은 없어요.<br />떠오르는 게 있으면 말하기로 비워두세요.</>}
            </div>
          </Card>
        )}
      </Section>

      {only !== "mine" && level !== "low" && (disc.length > 0 || loadingDisc) && (
        <Section eyebrow="AI FOUND" title={`${BRAND}이 찾은 것`} right="DB에 없던 상황">
          {loadingDisc && !disc.length && (
            <Card><div style={{ padding: 18 }}>
              <div className="skel" style={{ height: 13, width: "45%" }} />
              <div className="skel" style={{ height: 17, width: "72%", marginTop: 11 }} />
              <div className="skel" style={{ height: 13, width: "88%", marginTop: 9 }} />
              <div className="skel" style={{ height: 44, width: "100%", marginTop: 14, borderRadius: 14 }} />
              <div style={{ fontSize: 12, color: C.ink3, marginTop: 11 }}>지금 시기에 놓치기 쉬운 걸 찾아보는 중…</div>
            </div></Card>
          )}
          {disc.map((item, i) => (
            <DiscoverCard key={i} item={item} delay={i * 70}
              onAdd={() => {
                const hit = cats.find((c) => c.id === item.category) || cats.find((c) => c.label.includes(String(item.category || ""))) || { id: "etc", label: "기타" };
                addTasks([{ title: item.title, category: hit.id, status: item.status && STATUS[item.status] ? item.status : "week", note: item.why, coverage: "new" }], "ai");
                setDisc((d) => d.filter((x) => x !== item));
                say(`${hit.label} 영역에 담았어요`);
              }}
              onLater={() => {
                const m = String(item.when || "").match(/(\d{1,2})\s*월/);
                let at = Date.now() + 30 * DAY;
                if (m) { const mm = Number(m[1]); const now = new Date(); const y = now.getFullYear() + (mm - 1 < now.getMonth() ? 1 : 0); at = new Date(y, mm - 1, 1).getTime(); }
                setSt((sv) => ({ ...sv, discoverSnoozed: [...(sv.discoverSnoozed || []), { ...item, dueAt: at }] }));
                setDisc((d) => d.filter((x) => x !== item));
                say(`${item.when || "한 달 뒤"} 다시 알려드릴게요`);
              }}
              onNo={() => { setSt((sv) => ({ ...sv, dismissedDiscover: [...sv.dismissedDiscover, item.title] })); setDisc((d) => d.filter((x) => x !== item)); }} />
          ))}
        </Section>
      )}

      {/* 매일 루틴은 체크리스트로 따로 */}
      {daily.length > 0 && (
        <Section eyebrow="ROUTINE" title="오늘의 루틴" right={`${daily.length}개`}>
          <Card>
            <button className="press flex items-center justify-between w-full" onClick={() => setOpenRoutine((v) => !v)}
              style={{ background: "transparent", border: "none", padding: "14px 16px", borderBottom: openRoutine ? `1px solid ${C.line}` : "none" }}>
              <span style={{ fontSize: 14, color: C.ink2 }}>
                {mineRoutines.length ? `${meName} 님 몫 ${mineRoutines.length}개 포함` : "담당자를 나눠보세요"}
              </span>
              <span style={{ fontSize: 12.5, color: C.moss }}>{openRoutine ? "접기" : "펼치기"}</span>
            </button>
            {openRoutine && daily.map((r, i, a) => <RoutineRow key={r.key} r={r} delay={i * 30} last={i === a.length - 1} compact={level === "low"} />)}
          </Card>
          <div className="flex gap-2" style={{ marginTop: 8 }}>
            <button className="press" onClick={pushAll} style={{ flex: 1, background: "transparent", border: `1px solid ${C.line}`, borderRadius: 12, padding: "10px 0", fontSize: 12.5, color: C.ink2 }}>오늘은 통째로 내일로</button>
            {spouse && <button className="press" onClick={handOver} style={{ flex: 1, background: "transparent", border: `1px solid ${C.line}`, borderRadius: 12, padding: "10px 0", fontSize: 12.5, color: C.ink2 }}>{spouse.name}에게 넘기기</button>}
          </div>
        </Section>
      )}

      <button className="press w-full text-left" onClick={() => setTab("time")}
        style={{ marginTop: 26, background: C.card, border: `1px solid ${C.lineSoft}`, borderRadius: R.lg, padding: "15px 17px", boxShadow: SHADOW }}>
        <span className="flex items-center gap-3">
          <span style={{ fontSize: 19 }}>🕰</span>
          <span className="flex-1 min-w-0">
            <span style={{ display: "block", fontSize: 14, fontWeight: 600 }}>앞으로 챙길 일 보기</span>
            <span style={{ display: "block", fontSize: 12, color: C.ink3, marginTop: 3 }}>지금 시작해야 늦지 않는 것들 · {recs.length}건</span>
          </span>
          <span style={{ fontSize: 14, color: C.moss }}>›</span>
        </span>
      </button>

      <div style={{ marginTop: 14 }}>
        <button onClick={() => setAll((v) => !v)} style={{ width: "100%", background: "none", border: "none", color: C.ink3, fontSize: 12.5, padding: 10 }}>
          {all ? "접기" : `기억하고 있는 ${Math.max(remain, 0)}개 보기`}
        </button>
        {all && (
          <>
            {occasional.length > 0 && <Section eyebrow="ROUTINE" title="이번 주 정기 일정">
              <Card>{occasional.map((r, i, a) => <RoutineRow key={r.key} r={r} delay={i * 35} last={i === a.length - 1} />)}</Card>
            </Section>}
            {openTasks.length > 0 && <Section eyebrow="TASKS" title="담아둔 일">
              <Card>{openTasks.map((t, i, a) => <TaskRow key={t.id} t={t} delay={i * 35} last={i === a.length - 1} />)}</Card>
            </Section>}
            {recs.length > 0 && <Section eyebrow="AHEAD" title="미리 살필 일">
              {recs.slice(0, 6).map((r, i) => <RecCard key={r.key} rec={r} delay={i * 50} />)}
            </Section>}
            {st.tasks.some((t) => t.done) && <Section eyebrow="DONE" title="끝낸 일">
              <Card>{st.tasks.filter((t) => t.done).map((t, i, a) => <TaskRow key={t.id} t={t} delay={i * 30} last={i === a.length - 1} />)}</Card>
            </Section>}
          </>
        )}
      </div>
    </>
  );
}

/* ── 말하기 ───────────────────────────────────── */
function Speak() {
  const { st, setSt, cats, addTasks, addShopping, me, say, setTab, log } = use();
  const [text, setText] = useState("");
  const [phase, setPhase] = useState("input");
  const [result, setResult] = useState([]);
  const [listening, setListening] = useState(false);
  const [shots, setShots] = useState([]);        /* 올린 사진 미리보기 */
  const [scanKind, setScanKind] = useState(null); /* note = 알림장 / fridge = 냉장고 */
  const [menu, setMenu] = useState(null);         /* 냉장고 스캔이 짜준 식단 */
  const fileRef = useRef(null);
  const [note, setNote] = useState("");
  const [failed, setFailed] = useState(false);
  const [ex, setEx] = useState(0);
  const [edit, setEdit] = useState(null);
  const rec = useRef(null);

  /* 영역 화면에서 예시 질문을 눌러 넘어온 경우 */
  useEffect(() => {
    if (st.draft) { setText((v) => (v ? v + " " : "") + st.draft); setSt((sv) => ({ ...sv, draft: "" })); }
  }, [st.draft]);

  /* 카테고리별로 묶어두고 접었다 폅니다. 스스로 바뀌지 않아요 */
  const exByCat = useMemo(() => cats
    .map((c) => ({ cat: c, list: (PROMPTS[c.child ? "kid" : c.id] || []) }))
    .filter((g) => g.list.length), [cats]);

  const startMic = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return setNote("이 브라우저는 음성 입력을 지원하지 않아요. 아래에 적어도 결과는 같습니다.");
    try {
      const r = new SR(); r.lang = "ko-KR"; r.continuous = true; r.interimResults = true;
      r.onresult = (e) => { let s = ""; for (let i = 0; i < e.results.length; i++) s += e.results[i][0].transcript; setText(s); };
      r.onerror = () => { setListening(false); setNote("마이크 권한을 허용해 주세요."); };
      r.onend = () => setListening(false);
      r.start(); rec.current = r; setListening(true); setNote("");
    } catch { setNote("음성 입력을 시작하지 못했어요."); }
  };
  const stopMic = () => { try { rec.current && rec.current.stop(); } catch {} setListening(false); };

  /* 사진으로 담기 — 알림장은 준비물로, 냉장고는 식단으로 */
  const pickPhoto = (kind) => { setScanKind(kind); if (fileRef.current) { fileRef.current.value = ""; fileRef.current.click(); } };
  const onFiles = async (e) => {
    const files = Array.from(e.target.files || []).slice(0, 3);
    if (!files.length) return;
    try {
      const out = [];
      for (const f of files) out.push(await shrinkImage(f));
      setShots((v) => [...v, ...out].slice(0, 3));
      setNote("");
    } catch (err) { setNote("사진을 읽지 못했어요. 다른 사진으로 해볼까요?"); }
  };

  const analyze = async () => {
    const speech = text.trim() || (shots.length ? "" : DEMO_SPEECH);
    if (speech) setText(speech);
    stopMic(); setPhase("thinking"); setMenu(null);
    log("dump_submit", { len: speech.length, shots: shots.length });
    const catList = cats.map((c) => `${c.id}(${c.label})`).join(" ");
    const prompt = `당신은 한국 가정의 인지부하를 대신 기억해주는 AI 비서 '${BRAND}'입니다.
사용자가 두서없이 말한 내용을 실행 가능한 할 일로 분해·분류하세요.

이 가구: ${householdLine(st)}
발화: "${speech}"

규칙
- 입력에 띄어쓰기가 전혀 없거나 오타·줄임말·구어체일 수 있습니다. 의미 단위로 직접 끊어 해석하세요.
  예: "두부먹어야하고휴지사야돼애운동화작아진듯" → 두부 소진 / 휴지 구매 / 발 사이즈 확인
- 애매해도 빈 배열을 내지 말고 최소 2개는 뽑으세요.
- category는 다음 id 중 하나: ${catList} etc(기타)
  어디에도 맞지 않으면 etc로 보내고 newCategory에 새 카테고리 이름을 한글 4자 이내로 제안하세요.
- status는 하나: now / week / conditional / check / buy / decide / remember / repeat
  반복해서 해야 하는 일이면 repeat으로 두고 cycle에 권장 주기를 적으세요.
- 말을 그대로 옮기지 말고 실행행동으로. 말한 내용은 하나도 빠뜨리지 말 것. 4~8개.
- 다만 돌잔치·백일·결혼식·이사처럼 전문 앱/업체가 따로 있는 준비는 세부로 쪼개지 마세요.
  "돌잔치 기획하기" 같은 한 줄로만 만들고, 장소·답례품·의상 같은 하위 항목은 만들지 마세요.

출력은 JSON 배열만: [{"title":"12자 이내","category":"...","status":"...","note":"20자 이내","newCategory":"","cycle":""}]`;

    /* 사진이 있으면 무엇을 읽어야 하는지 알려줍니다 */
    const shotPrompt = !shots.length ? "" : scanKind === "fridge"
      ? `\n\n[사진] 냉장고 안 사진입니다. 보이는 재료를 읽고
- 먼저 먹어야 할 것(오래돼 보이는 것)을 status:"now" 할 일로
- 떨어져 보이는 것은 status:"buy" 할 일로 만드세요.
그리고 그 재료로 만들 수 있는 이번 주 저녁 3끼를 함께 제안하세요.
출력은 JSON 객체: {"tasks":[위 형식],"menu":[{"day":"월","dish":"12자 이내","use":"쓰는 재료","tip":"밀키트/영상 검색어"}]}`
      : `\n\n[사진] 어린이집·유치원·학교 알림장이나 가정통신문입니다.
사진에서 부모가 실제로 해야 하는 일만 뽑으세요 (준비물·제출물·마감일·행사일).
안내문 문장을 그대로 옮기지 말고 "○○ 챙기기", "○○ 신청하기"처럼 행동으로 바꾸세요.
날짜가 적혀 있으면 note에 남기세요. 개인 이름은 옮기지 마세요.`;

    const fb = (cats.find((c) => c.id === "home") || cats[0]).id;
    const normalize = (arr) => (Array.isArray(arr) ? arr : []).filter((x) => x && x.title).map((x) => {
      const raw = String(x.category || "");
      const hit = cats.find((c) => c.id === raw) || (raw.startsWith("kid") ? cats.find((c) => c.id.startsWith("kid")) : null)
        || cats.find((c) => c.label.includes(raw)) || cats.find((c) => raw.includes(c.id));
      return { title: String(x.title).slice(0, 20), category: hit ? hit.id : (raw === "etc" ? "etc" : fb),
        status: STATUS[x.status] ? x.status : "week", note: x.note || "", newCategory: x.newCategory || "", cycle: x.cycle || "" };
    });
    let items = [];
    for (let i = 0; i < 2 && !items.length; i++) {
      try {
        const raw = await askClaude((i === 0 ? prompt : prompt + "\n\n(직전 응답이 비어 있었습니다. 반드시 2개 이상 추출하세요.)") + shotPrompt, shots.length ? shots : null);
        if (raw && !Array.isArray(raw) && Array.isArray(raw.menu)) setMenu(raw.menu);
        items = normalize(Array.isArray(raw) ? raw : (raw && raw.tasks) || []);
      } catch { items = []; }
    }
    if (!items.length) { setFailed(true); items = normalize([{ title: "두부 소진", category: "food", status: "now", note: "유통기한 임박" }, { title: "휴지 구매", category: "home", status: "buy", note: "떨어지기 전에" }]); }
    else setFailed(false);
    setShots([]);
    setResult(items); setPhase("result");
  };

  const grouped = STATUS_ORDER.map((s) => ({ s, items: result.filter((r) => r.status === s) })).filter((g) => g.items.length);
  const newCats = [...new Set(result.filter((r) => r.category === "etc" && r.newCategory).map((r) => r.newCategory))];

  if (phase === "thinking") return (
    <Card style={{ marginTop: 14 }}>
      <div style={{ padding: "48px 20px", textAlign: "center" }}>
        <div className="disp" style={{ fontSize: 17, fontWeight: 600, marginBottom: 22 }}>머릿속을 펼치는 중</div>
        <div className="flex flex-wrap justify-center gap-2">
          {toFragments(text).map((w, i) => (
            <span key={i} className="frag" style={{ "--r": `${(i % 5) - 2}deg`, animationDelay: `${i * 90}ms`, background: C.bg, border: `1px solid ${C.line}`, borderRadius: 9, padding: "5px 9px", fontSize: 12, color: C.ink2 }}>{w}</span>
          ))}
        </div>
        <div className="mono" style={{ fontSize: 10.5, color: C.ink3, marginTop: 26 }}>카테고리 · 시점 · 선행 판단 중</div>
      </div>
    </Card>
  );

  if (phase === "result") return (
    <>
      <div style={{ marginTop: 20, paddingLeft: 2 }}>
        <div className="disp" style={{ fontSize: 22, fontWeight: 600 }}>{result.length}개로 정리했어요</div>
        <p style={{ fontSize: 13.5, color: C.ink2, marginTop: 7, lineHeight: 1.65 }}>담으면 가족 모두에게 보이고, 담당자를 나눌 수 있어요.</p>
        {failed && <div style={{ marginTop: 12, background: C.sunSoft, color: C.sun, borderRadius: 12, padding: "11px 13px", fontSize: 12.5, lineHeight: 1.6 }}>이번엔 분석이 실패해서 예시를 보여드리고 있어요. 다시 시도해 주세요.</div>}
        {newCats.length > 0 && <div style={{ marginTop: 12, background: C.mossSoft, color: C.moss, borderRadius: 12, padding: "11px 13px", fontSize: 12.5, lineHeight: 1.6 }}>
          지금 카테고리에 없는 이야기가 있어요. <b>{newCats.join(", ")}</b>은 기타로 담아둘게요. 영역 화면에서 새로 만들 수 있습니다.
        </div>}
      </div>
      {grouped.map((g, gi) => (
        <Section key={g.s} title={<span style={{ color: STATUS[g.s].fg }}>{STATUS[g.s].label}</span>} right={STATUS[g.s].hint}>
          <Card>{g.items.map((t, i, a) => {
            const cat = cats.find((c) => c.id === t.category) || { emoji: "🗂", label: t.newCategory || "기타" };
            const idx = result.indexOf(t);
            return (
              <button key={i} className="press rise flex items-start gap-3 w-full text-left" onClick={() => setEdit(idx)}
                style={{ background: "transparent", border: "none", padding: "14px 16px", borderBottom: i === a.length - 1 ? "none" : `1px solid ${C.line}`, animationDelay: `${gi * 100 + i * 55}ms` }}>
                <span className="flex-1 min-w-0">
                  <span style={{ display: "block", fontSize: 15, fontWeight: 500 }}>{t.title}</span>
                  <span style={{ display: "block", fontSize: 12, color: C.ink3, marginTop: 4 }}>
                    {cat.emoji} {cat.label} · {t.note}
                    {t.repeatDays ? <span style={{ color: C.moss }}> · {patternLabel({ cycle: t.repeatDays, dow: t.repeatDow, dom: t.repeatDom })} 반복</span> : null}
                  </span>
                </span>
                <Chip status={t.status} />
                <span style={{ fontSize: 13, color: C.ink3, marginTop: 2 }}>›</span>
              </button>
            );
          })}</Card>
          <LinkCards group={null} text={g.items.map((t) => t.title).join(" ")} />
          {g.s === "buy" && (
            <button className="press w-full" onClick={() => { const n = addShopping(g.items.map((t) => t.title.replace(/\s*(사기|구매|주문)$/, ""))); say(`장바구니에 ${n}개 담았어요`); }}
              style={{ marginTop: 8, background: C.mossSoft, color: C.moss, border: "none", borderRadius: R.sm, padding: "12px 0", fontSize: 13, fontWeight: 600 }}>
              🛒 이 항목들 장바구니에도 담기
            </button>
          )}
        </Section>
      ))}
      {menu && menu.length > 0 && (
        <Section eyebrow="MENU" title="이 재료로 이렇게 드셔보세요" right="냉장고 사진 기준">
          <Card>
            {menu.map((m, i) => (
              <div key={i} style={{ padding: "14px 16px", borderBottom: i === menu.length - 1 ? "none" : `1px solid ${C.lineSoft}` }}>
                <div className="flex items-center gap-2">
                  <span className="mono" style={{ fontSize: 11, color: C.moss, background: C.mossSoft, borderRadius: 6, padding: "3px 7px" }}>{m.day}</span>
                  <span style={{ fontSize: 14.5, fontWeight: 600 }}>{m.dish}</span>
                </div>
                {m.use && <div style={{ fontSize: 12, color: C.ink3, marginTop: 5 }}>쓰는 재료 · {m.use}</div>}
                <LinkCards group="식단정기" text={m.tip || m.dish} compact />
              </div>
            ))}
          </Card>
        </Section>
      )}

      <div style={{ marginTop: 14, background: C.mossSoft, borderRadius: R.sm, padding: "13px 15px", fontSize: 12.5, color: C.moss, lineHeight: 1.6 }}>
        항목을 누르면 이름·시점·영역·반복을 모두 고칠 수 있어요. 필요 없는 건 빼셔도 됩니다.
      </div>
      <button className="press w-full" onClick={() => { setResult((rs) => [...rs, { title: "", category: (cats[0] || {}).id, status: "week", note: "" }]); setEdit(result.length); }}
        style={{ marginTop: 12, background: "transparent", border: `1px dashed ${C.line}`, borderRadius: 14, padding: "13px 0", fontSize: 13, color: C.ink2 }}>
        빠진 게 있으면 직접 추가
      </button>

      {edit != null && (() => {
        const t = result[edit];
        const upd = (patch) => setResult((rs) => rs.map((x, i) => i === edit ? { ...x, ...patch } : x));
        return (
          <Sheet onClose={() => setEdit(null)}>
            <div className="disp" style={{ fontSize: 19, fontWeight: 600 }}>항목 고치기</div>

            <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 14 }}>할 일 이름</div>
            <input className="hae" value={t.title} onChange={(e) => upd({ title: e.target.value })}
              style={{ width: "100%", marginTop: 8, border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 13px", fontSize: 15, background: C.bg, color: C.ink }} />

            <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 8 }}>메모</div>
            <input className="hae" value={t.note || ""} onChange={(e) => upd({ note: e.target.value })}
              placeholder="왜 해야 하는지 짧게"
              style={{ width: "100%", marginTop: 8, border: `1px solid ${C.line}`, borderRadius: 12, padding: "11px 13px", fontSize: 13.5, background: C.bg, color: C.ink }} />

            <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 20 }}>언제 할 일인가요?</div>
            <div className="flex flex-wrap gap-2" style={{ marginTop: 10 }}>
              {STATUS_ORDER.filter((k) => k !== "repeat").map((k) => (
                <button key={k} className="press" onClick={() => upd({ status: k })}
                  style={{ background: t.status === k ? STATUS[k].bg : C.bg, color: t.status === k ? STATUS[k].fg : C.ink2,
                           border: `1px solid ${t.status === k ? STATUS[k].fg : C.line}`, borderRadius: 999, padding: "8px 13px", fontSize: 12.5, fontWeight: 600 }}>
                  {STATUS[k].label}
                </button>
              ))}
            </div>

            <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 20 }}>어느 영역에 넣을까요?</div>
            <div className="flex flex-wrap gap-2" style={{ marginTop: 10 }}>
              {[...cats, { id: "etc", emoji: "🗂", label: "기타" }].map((c) => (
                <button key={c.id} className="press" onClick={() => upd({ category: c.id })}
                  style={{ background: t.category === c.id ? C.mossSoft : C.bg, color: t.category === c.id ? C.moss : C.ink2,
                           border: `1px solid ${t.category === c.id ? C.moss : C.line}`, borderRadius: 999, padding: "8px 12px", fontSize: 12.5 }}>
                  {c.emoji} {c.label}
                </button>
              ))}
            </div>
            <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 20 }}>반복되는 일인가요?</div>
            <div className="grid grid-cols-4 gap-2" style={{ marginTop: 10 }}>
              <button className="press" onClick={() => upd({ repeatDays: null, repeatDow: "", repeatDom: "" })}
                style={{ background: !t.repeatDays ? C.mossSoft : C.bg, color: !t.repeatDays ? C.moss : C.ink2, border: `1px solid ${!t.repeatDays ? C.moss : C.line}`, borderRadius: 12, padding: "13px 0", fontSize: 13, fontWeight: 600 }}>한 번만</button>
              {CYCLES.map((c) => (
                <button key={c.d} className="press" onClick={() => upd({ repeatDays: c.d })}
                  style={{ background: t.repeatDays === c.d ? C.mossSoft : C.bg, color: t.repeatDays === c.d ? C.moss : C.ink2, border: `1px solid ${t.repeatDays === c.d ? C.moss : C.line}`, borderRadius: 12, padding: "13px 0", fontSize: 13, fontWeight: 600 }}>{c.label}</button>
              ))}
            </div>
            {t.repeatDays ? (
              <>
                <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 16 }}>정해진 요일이 있나요?</div>
                <div className="flex gap-1.5" style={{ marginTop: 9 }}>
                  {WEEKDAY.map((w, wi) => {
                    const on = String(t.repeatDow) === String(wi);
                    return (
                      <button key={wi} className="press" onClick={() => upd({ repeatDow: on ? "" : wi, repeatDom: "", repeatDays: 7 })}
                        style={{ flex: 1, background: on ? C.moss : C.bg, color: on ? "#fff" : C.ink2, border: `1px solid ${on ? C.moss : C.line}`, borderRadius: R.xs, padding: "10px 0", fontSize: 12.5, fontWeight: 600 }}>{w}</button>
                    );
                  })}
                </div>
                <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 16 }}>매달 정해진 날짜가 있나요?</div>
                <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 3 }}>관리비·카드값처럼요. 옆으로 넘기면 말일까지 있어요.</div>
                <div className="rail" style={{ marginTop: 9 }}>
                  {Array.from({ length: 31 }, (_, di) => di + 1).map((n) => {
                    const on = String(t.repeatDom) === String(n);
                    return (
                      <button key={n} className="press" onClick={() => upd({ repeatDom: on ? "" : n, repeatDow: "", repeatDays: 30 })}
                        style={{ background: on ? C.moss : C.bg, color: on ? "#fff" : C.ink2, border: `1px solid ${on ? C.moss : C.line}`, borderRadius: R.pill, padding: "9px 13px", fontSize: 12.5, fontWeight: 600, minWidth: 46 }}>{n === 31 ? "말일" : `${n}일`}</button>
                    );
                  })}
                </div>
                {(t.repeatDom || t.repeatDow !== "" && t.repeatDow != null) ? (
                  <div style={{ fontSize: 11.5, color: C.moss, marginTop: 7 }}>
                    {t.repeatDom ? `매달 ${Number(t.repeatDom) === 31 ? "말일" : t.repeatDom + "일"}에 올려드릴게요` : `${WEEKDAY[Number(t.repeatDow)]}요일마다 올려드릴게요`}
                  </div>
                ) : null}
              </>
            ) : null}
            <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 20 }}>날짜가 정해져 있나요? (선택)</div>
            <div style={{ fontSize: 12, color: C.ink3, marginTop: 3 }}>생일·기념일이면 넣어주세요. 매년 미리 알려드릴게요.</div>
            <input className="hae" value={t.anchor || ""} onChange={(e) => upd({ anchor: e.target.value, repeatDays: t.repeatDays || 365 })}
              placeholder="MM-DD (예: 09-28)"
              style={{ width: "100%", marginTop: 9, border: `1px solid ${C.line}`, borderRadius: 11, padding: "11px 12px", fontSize: 14, background: C.bg, color: C.ink }} />
            <Btn onClick={() => setEdit(null)} style={{ marginTop: 18 }}>확인</Btn>
            <Btn kind="quiet" onClick={() => { setResult((rs) => rs.filter((_, i) => i !== edit)); setEdit(null); say("이 항목은 뺐어요"); }}>이 항목은 담지 않기</Btn>
          </Sheet>
        );
      })()}

      <div style={{ marginTop: 24 }}>
        <Btn kind="accent" onClick={() => {
          const n = addTasks(result, me);
          const reps = result.filter((r) => r.repeatDays);
          if (reps.length) {
            setSt((sv) => {
              const cr = [...(sv.customRoutines || [])], ro = { ...sv.routines };
              reps.forEach((r) => {
                const nid = uid("cr");
                const cfg = { on: true, cycle: r.repeatDays, anchor: r.anchor || undefined,
                  dow: r.repeatDow != null && r.repeatDow !== "" ? r.repeatDow : undefined,
                  dom: r.repeatDom || undefined };
                cr.push({ id: nid, title: r.title, category: r.category, cycle: r.repeatDays });
                ro[`c:${nid}`] = { ...cfg,
                  nextAt: r.anchor ? nextFromAnchor(r.anchor, 7)
                    : (cfg.dow != null || cfg.dom) ? nextByPattern(cfg)
                    : Date.now() + r.repeatDays * DAY };
              });
              return { ...sv, customRoutines: cr, routines: ro };
            });
            say(`${n}개를 담고 ${reps.length}개는 정기로 등록했어요`);
          } else say(`${n}개를 담았어요`);
          setTab("home");

        <p style={{ fontSize: 13.5, color: C.ink2, marginTop: 10, lineHeight: 1.7 }}>순서도, 분류도 신경 쓰지 마세요. 정리는 저희 일입니다.</p>

      <Card style={{ marginTop: 16 }}>
        <div style={{ padding: 18 }}>
          <div className="flex justify-center" style={{ position: "relative", height: 96, marginBottom: 4 }}>
            {listening && <span className="ring" style={{ position: "absolute", top: 8, width: 80, height: 80, borderRadius: 999, border: `2px solid ${C.moss}` }} />}
            <button className="press" onClick={listening ? stopMic : startMic} aria-label={listening ? "멈추기" : "말하기"}
              style={{ width: 80, height: 80, borderRadius: 999, marginTop: 8, background: listening ? C.persim : C.moss, color: "#fff", border: "none", fontSize: 26, boxShadow: SHADOW_LIFT }}>{listening ? "■" : "🎙"}</button>
          </div>
          <textarea className="hae" value={text} onChange={(e) => setText(e.target.value)} rows={4}
            placeholder="여기에 적어도 됩니다. 띄어쓰기 없어도 괜찮아요."
            style={{ width: "100%", border: `1px solid ${C.line}`, borderRadius: R.md, padding: 14, fontSize: 14.5, lineHeight: 1.65, resize: "none", background: C.bg, color: C.ink }} />
          {note && <div style={{ fontSize: 12.5, color: C.persim, marginTop: 9 }}>{note}</div>}

          {shots.length > 0 && (

                <div key={i} style={{ position: "relative" }}>
                  <img src={`data:${sh.media_type};base64,${sh.data}`} alt="" style={{ width: 66, height: 66, objectFit: "cover", borderRadius: R.xs, border: `1px solid ${C.line}` }} />
                  <button onClick={() => setShots((v) => v.filter((_, k) => k !== i))} aria-label="빼기"

              ))}

          <div className="rail" style={{ marginTop: 12 }}>

              style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "9px 14px", fontSize: 12, color: C.ink2 }}>📄 알림장·통신문 사진</button>
            <button className="press" onClick={() => pickPhoto("fridge")}
              style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "9px 14px", fontSize: 12, color: C.ink2 }}>🧊 냉장고 사진</button>
            <button className="press" onClick={() => setText(DEMO_SPEECH)}
              style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "9px 14px", fontSize: 12, color: C.ink2 }}>시연용 예시</button>

          <input ref={fileRef} type="file" accept="image/*" multiple style={{ display: "none" }} onChange={onFiles} />
          {scanKind && <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 9, lineHeight: 1.6 }}>
            사진은 크기를 줄여 AI에 보내고 <b style={{ color: C.ink2 }}>앱에는 저장하지 않습니다</b>. 뽑아낸 할 일만 남아요.
          </div>}

          <div style={{ height: 14 }} />
          <Btn onClick={analyze}>{shots.length ? "사진까지 같이 정리해줘" : "정리해줘"}</Btn>

      </Card>

      {/* 예시 질문 — 스스로 바뀌지 않게 고정했습니다. 누르면 위 칸에 들어가요 */}
      <Section eyebrow="EXAMPLES" title="뭐라고 말해야 할지 모르겠다면" right="누르면 그대로 들어가요">
        {exByCat.map((g) => (
          <div key={g.cat.id} style={{ marginBottom: 12 }}>
            <div style={{ fontSize: 12.5, color: C.ink2, fontWeight: 600, marginBottom: 7, paddingLeft: 2 }}>{g.cat.emoji} {g.cat.label}</div>
            <PromptRail list={g.list.slice(0, 4)} onUse={(p) => { setText((v) => (v ? v + " " : "") + p); window.scrollTo({ top: 0, behavior: "smooth" }); say("질문칸에 넣었어요"); }} />
          </div>
        ))}
      </Section>
    </>
  );
}

/* ── 장보기 ───────────────────────────────────────
   "담아놓고 깜박한다"는 문제를 앱 안에서 해결하는 자리.
   담은 지 오래된 것은 스스로 위로 올라옵니다. */
function Shopping() {
  const { st, setSt, me, addTasks, say, log } = use();
  const [txt, setTxt] = useState("");
  const list = st.shopping || [];
  const open = list.filter((x) => !x.got);
  const got = list.filter((x) => x.got);
  const stale = open.filter((x) => Date.now() - x.at > 7 * DAY);

  const add = () => {
    const names = txt.split(/[,\n·]+/).map((x) => x.trim()).filter(Boolean);
    if (!names.length) return;
    setSt((sv) => ({ ...sv, shopping: [...names.map((n) => ({ id: uid("s"), name: n, by: me, at: Date.now(), got: false })), ...(sv.shopping || [])] }));
    setTxt(""); say(`${names.length}개 담았어요`);
  };
  const toggle = (id) => setSt((sv) => ({ ...sv, shopping: sv.shopping.map((x) => x.id === id ? { ...x, got: !x.got, gotBy: !x.got ? me : undefined, gotAt: !x.got ? Date.now() : undefined } : x) }));
  const drop = (id) => setSt((sv) => ({ ...sv, shopping: sv.shopping.filter((x) => x.id !== id) }));

  return (
    <>
      <div style={{ marginTop: 18, paddingLeft: 2 }}>
        <div className="disp" style={{ fontSize: 24, fontWeight: 600, letterSpacing: "-.03em" }}>장보기</div>
        <p style={{ fontSize: 13.5, color: C.ink2, marginTop: 9, lineHeight: 1.7 }}>
          누가 담아도 둘 다 보입니다. 오래 담겨 있으면 제가 다시 꺼내드릴게요.
        </p>
      </div>

      <Card style={{ marginTop: 16 }}>
        <div style={{ padding: 15 }} className="flex gap-2">
          <input className="hae" value={txt} onChange={(e) => setTxt(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") add(); }}
            placeholder="휴지, 두부, 아이 양말 — 쉼표로 여러 개"
            style={{ flex: 1, border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "12px 13px", fontSize: 14, background: C.bg, color: C.ink }} />
          <button className="press" onClick={add}
            style={{ background: C.moss, color: "#fff", border: "none", borderRadius: R.sm, padding: "0 18px", fontSize: 13.5, fontWeight: 600 }}>담기</button>
        </div>
      </Card>

      {stale.length > 0 && (
        <Card style={{ marginTop: 12, borderColor: C.sun }}>
          <div style={{ padding: "14px 16px" }}>
            <div className="mono" style={{ fontSize: 9.5, color: C.sun }}>담아두고 잊으신 것</div>
            <div style={{ fontSize: 13.5, marginTop: 7, lineHeight: 1.6 }}>
              <b>{stale.map((x) => x.name).join(" · ")}</b> · 담은 지 일주일이 넘었어요.
            </div>
            <div className="flex gap-2" style={{ marginTop: 11 }}>
              <button className="press" onClick={() => { addTasks([{ title: "장보기", category: "food", status: "week", note: stale.map((x) => x.name).slice(0, 3).join(", ") }], me); say("할 일로 올렸어요"); }}
                style={{ flex: 1, background: C.sunSoft, color: C.sun, border: "none", borderRadius: R.sm, padding: "11px 0", fontSize: 12.5, fontWeight: 600 }}>이번 주 할 일로 올리기</button>
              <button className="press" onClick={() => { log("partner_click", { name: "쿠팡", g: "shop" }); window.open(`https://www.coupang.com/np/search?q=${encodeURIComponent(stale[0].name)}`, "_blank", "noopener"); }}
                style={{ flex: 1, background: C.bg, color: C.ink2, border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "11px 0", fontSize: 12.5 }}>바로 주문하기</button>
            </div>
          </div>
        </Card>
      )}

      <Section eyebrow="LIST" title="살 것" right={`${open.length}개`}>
        <Card>
          {open.length ? open.map((x, i) => {
            const by = st.members.find((m) => m.id === x.by);
            const days = Math.floor((Date.now() - x.at) / DAY);
            return (
              <div key={x.id} className="flex items-center gap-3" style={{ padding: "13px 16px", borderBottom: i === open.length - 1 ? "none" : `1px solid ${C.lineSoft}` }}>
                <button className="press" onClick={() => toggle(x.id)} aria-label="샀어요"
                  style={{ width: 22, height: 22, borderRadius: 7, flexShrink: 0, border: `1.5px solid ${C.line}`, background: "transparent" }} />
                <span className="flex-1 min-w-0">
                  <span style={{ display: "block", fontSize: 14.5, fontWeight: 500 }}>{x.name}</span>
                  <span style={{ display: "block", fontSize: 11.5, color: days >= 7 ? C.sun : C.ink3, marginTop: 3 }}>
                    {by ? `${by.name}이 담음` : "담김"} · {days === 0 ? "오늘" : `${days}일 전`}
                  </span>
                </span>
                <button className="press" onClick={() => window.open(`https://www.coupang.com/np/search?q=${encodeURIComponent(x.name)}`, "_blank", "noopener")}
                  style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "6px 11px", fontSize: 11.5, color: C.ink2, whiteSpace: "nowrap" }}>검색</button>
                <button onClick={() => drop(x.id)} style={{ background: "none", border: "none", color: C.ink3, fontSize: 18, padding: 0 }}>×</button>
              </div>
            );
          }) : <div style={{ padding: "26px 18px", textAlign: "center", fontSize: 13.5, color: C.ink3, lineHeight: 1.7 }}>
            비어 있어요.<br />“말하기”에서 나온 살 것도 여기로 보낼 수 있어요.
          </div>}
        </Card>
      </Section>

      {got.length > 0 && (
        <Section eyebrow="DONE" title="산 것" right={`${got.length}개`}>
          <Card>
            {got.slice(0, 12).map((x, i, a) => (
              <div key={x.id} className="flex items-center gap-3" style={{ padding: "12px 16px", borderBottom: i === a.length - 1 ? "none" : `1px solid ${C.lineSoft}` }}>
                <button className="press" onClick={() => toggle(x.id)} aria-label="되돌리기"
                  style={{ width: 22, height: 22, borderRadius: 7, flexShrink: 0, border: `1.5px solid ${C.moss}`, background: C.moss, color: "#fff", fontSize: 12, lineHeight: "20px" }}>✓</button>
                <span className="flex-1" style={{ fontSize: 14, color: C.ink3, textDecoration: "line-through" }}>{x.name}</span>
                <button onClick={() => drop(x.id)} style={{ background: "none", border: "none", color: C.ink3, fontSize: 18, padding: 0 }}>×</button>
              </div>
            ))}
          </Card>
          <button className="press w-full" onClick={() => setSt((sv) => ({ ...sv, shopping: sv.shopping.filter((x) => !x.got) }))}
            style={{ marginTop: 9, background: "transparent", border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "11px 0", fontSize: 12.5, color: C.ink2 }}>산 것 목록 비우기</button>
        </Section>
      )}
    </>
  );
}

/* ── 영역(카테고리) ───────────────────────────── */
function Categories() {
  const { st, setSt, cats, openCat, setOpenCat, addTasks, say, log, setTab } = use();
  const [picked, setPicked] = useState({});
  const [aiItems, setAiItems] = useState([]);
  const [loading, setLoading] = useState(false);
  const [adding, setAdding] = useState(false);
  const [newName, setNewName] = useState("");
  const [ex, setEx] = useState(0);

  const allCats = [...cats, { id: "etc", emoji: "🗂", label: "기타" }];

  const open = async (cat) => {
    setOpenCat(cat); setPicked({}); setAiItems([]); setLoading(true); log("cat_open", { id: cat.id });
    const mine = st.tasks.filter((t) => t.category === cat.id).map((t) => t.title);
    try {
      const r = await askClaude(`한국 가정의 살림을 대신 기억해주는 AI 비서 '${BRAND}'입니다.
"${cat.label}" 영역에서 이 집이 아직 등록하지 않았지만 주기적으로 챙겨야 할 항목을 알려주세요.
가구: ${householdLine(st)}
이미 등록: ${mine.length ? mine.join(", ") : "없음"}
규칙: 이 집에 실제 해당하는 것만, 한국 기준, 3~4개, 이미 등록한 항목 제외.
출력은 JSON 배열만: [{"t":"12자 이내","cy":"권장 주기","why":"놓치기 쉬운 이유 20자"}]`);
      if (Array.isArray(r)) setAiItems(r.filter((x) => x && x.t));
    } catch {}
    setLoading(false);
  };

  if (openCat) {
    const baseKey = openCat.child ? "kid" : openCat.id;
    const list = [...(BLIND[baseKey] || []), ...aiItems];
    const mine = st.tasks.filter((t) => t.category === openCat.id && !t.done);
    const myRoutines = eligibleRoutines(st, true).filter((r) => (r.child ? `kid:${r.child.id}` : r.seed.cat) === openCat.id);
    const chosen = list.filter((_, i) => picked[i]);
    const prompts = PROMPTS[baseKey] || PROMPTS.etc;

    return (
      <>
        <PageHead onBack={() => setOpenCat(null)} backLabel="영역 전체" />
        <div className="flex items-center gap-3" style={{ marginTop: 16, marginBottom: 6 }}>
          <span style={{ fontSize: 30 }}>{openCat.emoji}</span>
          <div>
            <div className="disp" style={{ fontSize: 22, fontWeight: 600, letterSpacing: "-.025em" }}>{openCat.label}</div>
            <div style={{ fontSize: 12.5, color: C.ink3, marginTop: 3 }}>반복 {myRoutines.length}개 · 진행 중 {mine.length}건</div>
          </div>
        </div>

        {/* 예시 질문 — 고정입니다. 누르면 말하기 화면 입력칸에 그대로 들어가요 */}
        <div style={{ marginTop: 16 }}>
          <PromptRail list={prompts.slice(0, 5)}
            note="누르면 ‘말하기’ 입력칸에 들어갑니다. 고쳐서 보내셔도 돼요."
            onUse={(p) => { setSt((sv) => ({ ...sv, draft: p })); setOpenCat(null); setTab("speak"); say("말하기 칸에 넣었어요"); }} />
        </div>
        <LinkCards group={null} text={openCat.label} />

        {myRoutines.length > 0 && (
          <Section eyebrow="ROUTINE" title="반복 업무" right="주기를 눌러 바꿀 수 있어요">
            <Card>{myRoutines.map((r, i, a) => <RoutineRow key={r.key} r={r} delay={i * 40} last={i === a.length - 1} manage />)}</Card>
          </Section>
        )}
        {mine.length > 0 && (
          <Section eyebrow="TASKS" title="담아둔 일">
            <Card>{mine.map((t, i, a) => <TaskRow key={t.id} t={t} delay={i * 40} last={i === a.length - 1} />)}</Card>
          </Section>
        )}

        <Section eyebrow="BLIND SPOT" title="혹시 놓치고 있는 건 없나요?" right="등록 안 해도 해당되는 일">
          <Card>
            {list.map((c, i) => (
              <button key={i} className="press rise flex items-start gap-3 w-full text-left" onClick={() => setPicked((p) => ({ ...p, [i]: !p[i] }))}
                style={{ background: picked[i] ? C.mossSoft : "transparent", border: "none", borderBottom: i === list.length - 1 && !loading ? "none" : `1px solid ${C.line}`, padding: "14px 16px", animationDelay: `${i * 50}ms` }}>
                <span style={{ width: 21, height: 21, marginTop: 1, borderRadius: 999, flexShrink: 0, border: `1.5px solid ${picked[i] ? C.moss : C.line}`, background: picked[i] ? C.moss : "transparent", color: "#fff", fontSize: 12, lineHeight: "19px", textAlign: "center" }}>{picked[i] ? "✓" : ""}</span>
                <span className="flex-1 min-w-0">
                  <span style={{ display: "block", fontSize: 14.5, fontWeight: 500 }}>{c.t}</span>
                  <span style={{ display: "block", fontSize: 12, color: C.ink3, marginTop: 3 }}>{c.why}</span>
                </span>
                <span className="mono" style={{ fontSize: 11, color: C.moss, whiteSpace: "nowrap", marginTop: 3 }}>{c.cy}</span>
              </button>
            ))}
            {loading && <div style={{ padding: "15px 16px", fontSize: 12.5, color: C.ink3, borderTop: `1px solid ${C.line}` }}>이 집에만 해당하는 항목을 더 찾는 중…</div>}
          </Card>
        </Section>

        <div style={{ marginTop: 18 }}>
          <Btn disabled={!chosen.length} onClick={() => { addTasks(chosen.map((c) => ({ title: c.t, category: openCat.id, status: "check", note: c.cy, coverage: "system" })), "ai"); say(`${chosen.length}개를 담았어요`); setPicked({}); }}>
            {chosen.length ? `${chosen.length}개 챙기기` : "챙길 항목을 골라주세요"}
          </Btn>
        </div>
      </>
    );
  }

  return (
    <Section eyebrow="AREAS" title="우리 집 관리 영역" right="탭하면 놓친 것부터">
      <div className="grid grid-cols-2 gap-2.5">
        {allCats.map((c, i) => {
          const n = st.tasks.filter((t) => t.category === c.id && !t.done).length;
          const rn = eligibleRoutines(st, true).filter((r) => (r.child ? `kid:${r.child.id}` : r.seed.cat) === c.id).length;
          return (
            <button key={c.id} className="press rise text-left" onClick={() => open(c)}
              style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 18, padding: 15, boxShadow: SHADOW, animationDelay: `${i * 30}ms` }}>
              <div style={{ fontSize: 23 }}>{c.emoji}</div>
              <div style={{ fontSize: 14.5, fontWeight: 600, marginTop: 9, lineHeight: 1.3 }}>{c.label}</div>
              <div className="mono" style={{ fontSize: 10.5, color: n || rn ? C.moss : C.ink3, marginTop: 6 }}>{rn ? `반복 ${rn}` : ""}{rn && n ? " · " : ""}{n ? `할 일 ${n}` : (rn ? "" : "비어 있음")}</div>
            </button>
          );
        })}
        <div style={{ border: `1px dashed ${C.line}`, borderRadius: 18, padding: 15 }}>
          {adding ? (
            <>
              <input className="hae" value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="예: 텃밭"
                style={{ width: "100%", border: `1px solid ${C.line}`, borderRadius: 10, padding: "8px 10px", fontSize: 13, background: C.card, color: C.ink }} />
              <button className="press w-full" onClick={() => {
                const label = newName.trim(); if (!label) return setAdding(false);
                setSt((s) => ({ ...s, customCats: [...(s.customCats || []), { id: uid("cc"), emoji: "✚", label }] }));
                setNewName(""); setAdding(false); say("영역을 추가했어요");
              }} style={{ marginTop: 9, background: C.moss, color: "#fff", border: "none", borderRadius: 10, padding: "8px 0", fontSize: 12.5, fontWeight: 600 }}>추가</button>
            </>
          ) : (
            <button onClick={() => setAdding(true)} className="w-full text-left" style={{ background: "none", border: "none" }}>
              <div style={{ fontSize: 23, color: C.ink3 }}>✚</div>
              <div style={{ fontSize: 14.5, fontWeight: 600, marginTop: 9, color: C.ink2 }}>직접 추가</div>
              <div style={{ fontSize: 10.5, color: C.ink3, marginTop: 6 }}>빠진 영역 만들기</div>
            </button>
          )}
        </div>
      </div>
    </Section>
  );
}

/* ── 타임라인 (UX-09) ─────────────────────────── */

  const dated = recs.filter((r) => r.dateKnown);
  const undated = recs.filter((r) => !r.dateKnown);

  return (
    <>
      <PageHead onBack={() => setTab("home")} backLabel="오늘로" />
      <div className="rise" style={{ marginTop: 14, borderRadius: R.xl, padding: 22, background: "linear-gradient(165deg, #17332A 0%, #0F1A15 70%)", boxShadow: SHADOW_LIFT }}>
        <div className="mono" style={{ fontSize: 10, color: "#7FB79E" }}>LIFE TIMELINE</div>
        <div className="disp" style={{ color: "#fff", fontSize: 21, fontWeight: 600, marginTop: 9, lineHeight: 1.45 }}>지금 시작해야<br />늦지 않는 일</div>
        <div style={{ color: "#93A69B", fontSize: 13, marginTop: 10, lineHeight: 1.7 }}>
          필요한 시점이 아니라 <b style={{ color: "#fff" }}>준비를 시작해야 하는 시점</b>으로 계산했어요.
        </div>
      </div>

      {dated.length > 0 && (

        </Section>
      )}

          {undated.map((r, i) => <RecCard key={r.key} rec={r} delay={i * 35} />)}
        </Section>
      )}
      {!recs.length && (

}

/* ── 나눔 (UX-10) ─────────────────────────────── */
function Share() {
  const { st, assign, say } = use();
  const members = st.members;
  const s = useMemo(() => {
    const raised = {}, doneBy = {};
    members.forEach((m) => { raised[m.id] = 0; doneBy[m.id] = 0; });
    let ai = 0;
    st.tasks.forEach((t) => {
      if (t.raisedBy === "ai") ai++; else if (raised[t.raisedBy] !== undefined) raised[t.raisedBy]++;
      if (t.done && doneBy[t.doneBy] !== undefined) doneBy[t.doneBy]++;
    });
    return { raised, doneBy, ai, human: Object.values(raised).reduce((a, b) => a + b, 0), doneTotal: Object.values(doneBy).reduce((a, b) => a + b, 0) };
  }, [st.tasks, members]);

  const unassigned = st.tasks.filter((t) => !t.done && !t.owner);
  const top = members.slice().sort((a, b) => s.raised[b.id] - s.raised[a.id])[0] || { name: "-", id: "" };
  const share = s.human ? Math.round((s.raised[top.id] / s.human) * 100) : 0;

  const Bar = ({ data, total, extra }) => (
    <div className="flex" style={{ height: 9, borderRadius: 99, overflow: "hidden", background: C.line, marginTop: 13 }}>
      {members.map((m) => (data[m.id] ? <div key={m.id} className="grow" style={{ width: `${(data[m.id] / (total || 1)) * 100}%`, background: m.color }} /> : null))}
      {extra ? <div className="grow" style={{ width: `${(extra / (total || 1)) * 100}%`, background: C.sprout }} /> : null}
    </div>
  );
  const Legend = ({ data, extraLabel, extra }) => (
    <div className="flex flex-wrap gap-3" style={{ marginTop: 12 }}>
      {members.map((m) => (
        <span key={m.id} className="flex items-center gap-2" style={{ fontSize: 12, color: C.ink2 }}>
          <span style={{ width: 8, height: 8, borderRadius: 99, background: m.color, display: "inline-block" }} />{m.name} {data[m.id] || 0}
        </span>
      ))}
      {extraLabel && <span className="flex items-center gap-2" style={{ fontSize: 12, color: C.ink2 }}>
        <span style={{ width: 8, height: 8, borderRadius: 99, background: C.sprout, display: "inline-block" }} />{extraLabel} {extra}
      </span>}
    </div>
  );

  return (
    <>
      <div className="rise" style={{ marginTop: 12, borderRadius: R.xl, padding: 22, background: "linear-gradient(165deg, #17332A 0%, #0F1A15 70%)", boxShadow: SHADOW_LIFT }}>
        <div className="mono" style={{ fontSize: 9.5, color: "#7FB79E" }}>MENTAL LOAD</div>
        <div className="disp" style={{ color: "#fff", fontSize: 20, fontWeight: 600, marginTop: 9, lineHeight: 1.5 }}>
          {s.human ? `이번 주 기억은 주로\n${top.name} 님이 했어요` : "아직 기록이 없어요"}
        </div>
        <div style={{ color: "#93A69B", fontSize: 13, marginTop: 10, lineHeight: 1.7 }}>
          누가 더 했는지 가리려는 화면이 아니에요. 안 보이던 일을 보이게 하려는 것뿐입니다.
        </div>
      </div>

      <Section eyebrow="INVISIBLE" title="누가 떠올렸나" right="눈에 안 보이는 일">
        <Card><div style={{ padding: 17 }}>
          <div style={{ fontSize: 13.5, color: C.ink2 }}>“이거 해야 하는데”를 처음 꺼낸 사람이에요.</div>
          <Bar data={s.raised} total={s.human + s.ai} extra={s.ai} />
          <Legend data={s.raised} extraLabel="AI가 대신" extra={s.ai} />
          {s.human > 0 && <div style={{ marginTop: 15, fontSize: 13, color: C.ink2, lineHeight: 1.65 }}>
            떠올린 일 {s.human}개 중 {share}%가 {top.name} 님에게서 나왔어요.
          </div>}
          {s.ai > 0 && <div style={{ marginTop: 12, background: C.mossSoft, color: C.moss, borderRadius: 12, padding: "12px 13px", fontSize: 12.5, lineHeight: 1.65 }}>
            그중 {s.ai}개는 아무도 기억하지 않았는데 AI가 먼저 꺼냈어요. 그만큼 머릿속이 덜 찼다는 뜻이에요.
          </div>}
        </div></Card>
      </Section>

      <Section eyebrow="VISIBLE" title="누가 끝냈나" right="눈에 보이는 일">
        <Card><div style={{ padding: 17 }}>
          <div style={{ fontSize: 13.5, color: C.ink2 }}>완료 표시를 누른 사람이에요.</div>
          <Bar data={s.doneBy} total={s.doneTotal} />
          <Legend data={s.doneBy} />
          {!s.doneTotal && <div style={{ fontSize: 12.5, color: C.ink3, marginTop: 12 }}>끝낸 일이 아직 없어요.</div>}
        </div></Card>
      </Section>

      <Section eyebrow="OPEN" title="아직 주인이 없는 일" right={`${unassigned.length}건`}>
        <Card>
          {unassigned.length ? unassigned.map((t, i) => (
            <div key={t.id} className="rise" style={{ padding: "14px 16px", borderBottom: i === unassigned.length - 1 ? "none" : `1px solid ${C.line}`, animationDelay: `${i * 45}ms` }}>
              <div style={{ fontSize: 14.5, fontWeight: 500 }}>{t.title}</div>
              <div className="flex items-center gap-2 flex-wrap" style={{ marginTop: 9 }}>
                {members.map((m) => (
                  <button key={m.id} className="press flex items-center gap-1.5" onClick={() => { assign(t.id, m.id); say(`${m.name}에게 넘겼어요`); }}
                    style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: 999, padding: "6px 12px", fontSize: 12, color: C.ink2 }}>
                    <span style={{ width: 7, height: 7, borderRadius: 99, background: m.color, display: "inline-block" }} />{m.name}에게
                  </button>
                ))}
              </div>
            </div>
          )) : <div style={{ padding: "24px 18px", fontSize: 13.5, color: C.ink3, textAlign: "center" }}>모든 일에 담당자가 있어요.</div>}
        </Card>
      </Section>
    </>
  );
}

          <Card>
            <div style={{ padding: "13px 15px", fontSize: 12.5, color: C.ink2, lineHeight: 1.65, borderBottom: `1px solid ${C.lineSoft}` }}>
              음식·청소는 한 사람, 화분·쓰레기는 다른 사람처럼 이미 정해진 게 있으면 여기서 한 번만 정해두세요.
              앞으로 그 영역에 담기는 일은 자동으로 그 사람 몫이 됩니다. (개별 항목은 언제든 바꿀 수 있어요)
            </div>
            {cats.map((c, i, arr) => {
              const cur = (st.duty || {})[c.id];
              return (
                <div key={c.id} className="flex items-center gap-2" style={{ padding: "11px 15px", borderBottom: i === arr.length - 1 ? "none" : `1px solid ${C.lineSoft}` }}>
                  <span className="flex-1 min-w-0" style={{ fontSize: 13.5 }}>{c.emoji} {c.label}</span>
                  <div className="flex gap-1.5">
                    {st.members.map((m) => (
                      <button key={m.id} className="press" onClick={() => setSt((sv) => ({ ...sv, duty: { ...(sv.duty || {}), [c.id]: cur === m.id ? null : m.id } }))}
                        style={{ background: cur === m.id ? m.color : C.bg, color: cur === m.id ? "#fff" : C.ink3, border: `1px solid ${cur === m.id ? m.color : C.line}`, borderRadius: R.pill, padding: "6px 11px", fontSize: 11.5, fontWeight: 600 }}>
                        {m.name}
                      </button>
                    ))}
                  </div>
                </div>
              );
            })}
          </Card>
        </Section>
      )}

      {/* 컨디션·알림 — 민감한 정보라 켜고 끄는 걸 분명히 */}
      <Section eyebrow="PRIVACY" title="컨디션과 알림">
        <Card>
          <button className="press flex items-center gap-3 w-full text-left" onClick={() => setSt((sv) => ({ ...sv, conditionShare: sv.conditionShare === false }))}
            style={{ background: "transparent", border: "none", borderBottom: `1px solid ${C.lineSoft}`, padding: "14px 15px" }}>
            <span className="flex-1 min-w-0">
              <span style={{ display: "block", fontSize: 14, fontWeight: 600 }}>오늘 컨디션을 가족에게 보이기</span>
              <span style={{ display: "block", fontSize: 12, color: C.ink3, marginTop: 3, lineHeight: 1.6 }}>
                끄면 나만 봅니다. 몸 상태는 민감한 정보라 기본값을 직접 고르시게 했어요.
              </span>
            </span>
            <span style={{ width: 42, height: 25, borderRadius: 99, flexShrink: 0, background: st.conditionShare !== false ? C.moss : C.line, position: "relative" }}>
              <span style={{ position: "absolute", top: 3, left: st.conditionShare !== false ? 20 : 3, width: 19, height: 19, borderRadius: 99, background: "#fff", transition: "left .18s" }} />
            </span>
          </button>
          <div style={{ padding: "14px 15px" }}>
            <div style={{ fontSize: 14, fontWeight: 600 }}>알림</div>
            <div style={{ fontSize: 12, color: C.ink3, marginTop: 4, lineHeight: 1.65 }}>
              지금은 앱을 열었을 때만 보여드립니다. 브라우저 알림을 켜두면 앱이 열려 있는 동안 넘어온 일을 소리 없이 띄워드려요.
              닫은 앱까지 깨우는 진짜 푸시는 서버 작업이 필요해서 베타 다음 단계입니다.
            </div>
            <button className="press" onClick={async () => {
              if (!("Notification" in window)) return say("이 브라우저는 알림을 지원하지 않아요");
              const p = await Notification.requestPermission();
              setSt((sv) => ({ ...sv, notify: { ...(sv.notify || {}), on: p === "granted" } }));
              say(p === "granted" ? "알림을 켰어요" : "알림 권한이 꺼져 있어요");
            }} style={{ marginTop: 11, background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "9px 14px", fontSize: 12.5, color: C.ink2 }}>
              {(st.notify || {}).on ? "알림 켜짐 · 다시 확인" : "브라우저 알림 켜기"}
            </button>
          </div>
        </Card>
      </Section>

      <Section eyebrow="ROUTINE" title="정기 일정 관리" right="영역을 골라 주기를 조정하세요">
        {!routineCat ? (
          <div className="grid grid-cols-2 gap-2.5">
            {routineGroups.map((g) => (
              <button key={g.cid} className="press text-left" onClick={() => setRoutineCat(g.cid)}
                style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 18, padding: 15, boxShadow: SHADOW }}>
                <div style={{ fontSize: 22 }}>{g.emoji}</div>
                <div style={{ fontSize: 14.5, fontWeight: 600, marginTop: 8 }}>{g.label}</div>
                <div className="mono" style={{ fontSize: 10.5, color: g.on ? C.moss : C.ink3, marginTop: 6 }}>{g.on}/{g.items.length} 켜짐</div>
              </button>
            ))}
          </div>
        ) : (() => {
          const g = routineGroups.find((x) => x.cid === routineCat) || routineGroups[0];
          return (
            <>
              {(() => {
                const idx = routineGroups.findIndex((x) => x.cid === g.cid);
                const prev = routineGroups[idx - 1], next = routineGroups[idx + 1];
                return (
                  <div className="flex items-center justify-between" style={{ paddingBottom: 10 }}>
                    <button onClick={() => setRoutineCat(null)} style={{ background: "none", border: "none", color: C.ink2, fontSize: 13, padding: 0 }}>← 전체 영역</button>
                    <span className="mono" style={{ fontSize: 11, color: C.ink3 }}>{idx + 1} / {routineGroups.length}</span>
                  </div>
                );
              })()}
              <div className="flex items-center gap-2" style={{ marginBottom: 10 }}>
                <span style={{ fontSize: 22 }}>{g.emoji}</span>
                <span className="disp" style={{ fontSize: 19, fontWeight: 600, flex: 1 }}>{g.label}</span>
                <button className="press" onClick={() => setSt((sv) => { const ro = { ...sv.routines }; const allOn = g.items.every((r) => (ro[r.key] || {}).on); g.items.forEach((r) => { ro[r.key] = { ...(ro[r.key] || { cycle: cycleToDays(r.seed.cy) }), on: !allOn, nextAt: (ro[r.key] || {}).nextAt || Date.now() }; }); return { ...sv, routines: ro }; })}
                  style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: 999, padding: "6px 12px", fontSize: 12, color: C.ink2, whiteSpace: "nowrap" }}>
                  {g.items.every((r) => (st.routines[r.key] || {}).on) ? "전부 끄기" : "전부 켜기"}
                </button>
              </div>
              <Card>
                {g.items.map((r, i, arr) => {
                  const cfg = st.routines[r.key] || { on: false, cycle: cycleToDays(r.seed.cy) };
                  return (
                    <div key={r.key} className="flex items-center gap-3" style={{ padding: "13px 15px", borderBottom: i === arr.length - 1 ? "none" : `1px solid ${C.line}`, opacity: cfg.on ? 1 : .4 }}>
                      <span className="flex-1 min-w-0" style={{ fontSize: 14, fontWeight: 500 }}>
                        {r.seed.t}{r.child ? <span style={{ color: C.ink3, fontWeight: 400 }}> · {r.child.name}</span> : null}
                      </span>
                      <button className="press" onClick={() => setPickKey(r.key)}
                        style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: 999, padding: "5px 11px", fontSize: 12, color: C.ink2, whiteSpace: "nowrap" }}>{cycleLabel(cfg.cycle)}</button>
                      <button className="press" onClick={() => setRoutine(r.key, { on: !cfg.on, cycle: cfg.cycle, nextAt: cfg.nextAt || Date.now() })} aria-label="사용 여부"
                        style={{ width: 42, height: 25, borderRadius: 99, border: "none", background: cfg.on ? C.moss : C.line, position: "relative", flexShrink: 0 }}>
                        <span style={{ position: "absolute", top: 3, left: cfg.on ? 20 : 3, width: 19, height: 19, borderRadius: 99, background: "#fff", transition: "left .18s" }} />
                      </button>
                      {r.custom && <button onClick={() => setSt((sv) => ({ ...sv, customRoutines: sv.customRoutines.filter((x) => x.id !== r.seed.id) }))}
                        style={{ background: "none", border: "none", color: C.ink3, fontSize: 17, padding: 0 }}>×</button>}
                    </div>
                  );
                })}
                <div className="flex items-center gap-2" style={{ padding: "12px 15px", borderTop: `1px solid ${C.line}`, background: C.bg }}>
                  <input className="hae" value={newRoutine} onChange={(e) => setNewRoutine(e.target.value)}
                    placeholder="우리 집만의 일 추가"
                    style={{ flex: 1, border: `1px solid ${C.line}`, borderRadius: 10, padding: "9px 11px", fontSize: 13.5, background: C.card, color: C.ink }} />
                  <button className="press" onClick={() => {
                    const title = newRoutine.trim(); if (!title) return;
                    const nid = uid("cr");
                    setSt((sv) => ({
                      ...sv,
                      customRoutines: [...(sv.customRoutines || []), { id: nid, title, category: g.cid, cycle: 7 }],
                      routines: { ...sv.routines, [`c:${nid}`]: { on: true, cycle: 7, nextAt: Date.now() } },
                    }));
                    setNewRoutine(""); say("정기 일정에 넣었어요");
                  }} style={{ background: C.moss, color: "#fff", border: "none", borderRadius: 10, padding: "9px 14px", fontSize: 13, fontWeight: 600, whiteSpace: "nowrap" }}>추가</button>
                </div>
              </Card>
              {(() => {
                const idx = routineGroups.findIndex((x) => x.cid === g.cid);
                const prev = routineGroups[idx - 1], next = routineGroups[idx + 1];
                return (
                  <div className="flex gap-2" style={{ marginTop: 12 }}>
                    <button className="press" disabled={!prev} onClick={() => { setRoutineCat(prev.cid); window.scrollTo({ top: 0, behavior: "smooth" }); }}
                      style={{ flex: 1, background: "transparent", border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 0", fontSize: 12.5, color: prev ? C.ink2 : C.ink3, opacity: prev ? 1 : .4 }}>
                      {prev ? `← ${prev.label}` : "이전 없음"}
                    </button>
                    <button className="press" disabled={!next} onClick={() => { setRoutineCat(next.cid); window.scrollTo({ top: 0, behavior: "smooth" }); }}
                      style={{ flex: 1, background: "transparent", border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 0", fontSize: 12.5, color: next ? C.ink2 : C.ink3, opacity: next ? 1 : .4 }}>
                      {next ? `${next.label} →` : "다음 없음"}
                    </button>
                  </div>
                );
              })()}
            </>
          );
        })()}
        {pickKey && (() => {
          const r = eligibleRoutines(st, true).find((x) => x.key === pickKey);
          const cfg = st.routines[pickKey] || { cycle: cycleToDays(r ? r.seed.cy : "") };
          return <CyclePicker current={cfg.cycle} title={r ? r.seed.t : "주기"}
            onPick={(dd) => { setRoutine(pickKey, { cycle: dd, on: true, nextAt: Date.now() + dd * DAY }); setPickKey(null); say(`${cycleLabel(dd)}로 바꿨어요`); }}
            onOff={() => { setRoutine(pickKey, { on: false }); setPickKey(null); }}
            onClose={() => setPickKey(null)} />;
        })()}
      </Section>

      <Section eyebrow="선택" title="더 알려주실 것">
        <textarea className="hae" value={d.extra} onChange={(e) => setD((s) => ({ ...s, extra: e.target.value }))} rows={3}
          placeholder="예: 전세 계약이 내년 봄에 끝나요."
          style={{ width: "100%", border: `1px solid ${C.line}`, borderRadius: 14, padding: 13, fontSize: 14.5, lineHeight: 1.65, resize: "none", background: C.card, color: C.ink }} />
      </Section>

      <div style={{ marginTop: 20 }}>
        <Btn onClick={() => { setSt((s) => ({ ...s, members: d.members.filter((m) => m.name.trim()), children: d.children, flags: d.flags, petTypes: d.petTypes, car: d.car, extra: d.extra })); say("추천을 다시 계산했어요"); setTab("home"); }}>저장하고 추천 다시 계산</Btn>
        <div style={{ height: 8 }} />
        <Btn kind="ghost" onClick={() => setDash(true)}>베타 지표 보기</Btn>
        <Btn kind="quiet" onClick={() => { if (confirm("모든 데이터를 지우고 처음부터 시작할까요?")) { window.storage.delete("meonjeon").catch(() => {}); setSt(DEFAULT_STATE); } }}>데이터 전체 삭제</Btn>
      </div>
    </>
  );
}

/* ── 하단 탭 ──────────────────────────────────── */
function TabBar() {
  const { tab, setTab, st } = use();
  const shopLeft = (st.shopping || []).filter((x) => !x.got).length;
  const items = [
    { id: "home", label: "오늘", icon: "◉" },
    { id: "cat", label: "영역", icon: "▦" },
    { id: "speak", label: "말하기", icon: "✦", primary: true },
    { id: "shop", label: "장보기", icon: "🛒", badge: shopLeft },
    { id: "share", label: "나눔", icon: "◑" },
  ];
  return (
    <nav style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 440,
                  background: "rgba(255,255,255,.9)", backdropFilter: "saturate(1.6) blur(16px)", WebkitBackdropFilter: "saturate(1.6) blur(16px)",
                  borderTop: `1px solid ${C.line}`, display: "flex", gap: 2, zIndex: 30, padding: "7px 8px",
                  paddingBottom: "calc(7px + env(safe-area-inset-bottom))" }}>
      {items.map((it) => {
        const on = tab === it.id;
        if (it.primary) return (
          <button key={it.id} className="press flex-1 flex flex-col items-center justify-center" onClick={() => setTab(it.id)}
            style={{ background: "transparent", border: "none", padding: "2px 0", color: on ? C.moss : C.ink3 }}>
            <span style={{ width: 40, height: 40, borderRadius: 999, background: on ? C.moss : C.ink, color: "#fff", fontSize: 16,
                           display: "inline-flex", alignItems: "center", justifyContent: "center", boxShadow: SHADOW }}>{it.icon}</span>
            <span style={{ fontSize: 10.5, marginTop: 3, fontWeight: on ? 600 : 400 }}>{it.label}</span>
          </button>
        );
        return (
          <button key={it.id} className="press flex-1 flex flex-col items-center" onClick={() => setTab(it.id)}
            style={{ background: "transparent", border: "none", borderRadius: R.sm, padding: "7px 0", color: on ? C.moss : C.ink3 }}>
            <span style={{ position: "relative", fontSize: 15, lineHeight: "20px" }}>
              {it.icon}
              {it.badge ? <span className="mono" style={{ position: "absolute", top: -3, right: -12, minWidth: 15, height: 15, borderRadius: 99, background: C.persim, color: "#fff", fontSize: 9, lineHeight: "15px", padding: "0 4px" }}>{it.badge}</span> : null}
            </span>
            <span style={{ fontSize: 10.5, marginTop: 3, fontWeight: on ? 600 : 400 }}>{it.label}</span>
          </button>
        );
      })}
    </nav>
  );
}


window.startApp = () => ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
