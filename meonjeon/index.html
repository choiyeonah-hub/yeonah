      </button>

      {edit != null && (() => {
        const t = result[edit];
        const upd = (patch) => setResult((rs) => rs.map((x, i) => i === edit ? { ...x, ...patch } : x));
        return (
          <Sheet onClose={() => setEdit(null)}>
            <div className="disp" style={{ fontSize: 19, fontWeight: 600 }}>항목 고치기</div>

            <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 14 }}>할 일 이름</div>
            <input className="hae" value={t.title} onChange={(e) => upd({ title: e.target.value })}
              style={{ width: "100%", marginTop: 8, border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 13px", fontSize: 15, background: C.bg, color: C.ink }} />

            <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 8 }}>메모</div>
            <input className="hae" value={t.note || ""} onChange={(e) => upd({ note: e.target.value })}
              placeholder="왜 해야 하는지 짧게"
              style={{ width: "100%", marginTop: 8, border: `1px solid ${C.line}`, borderRadius: 12, padding: "11px 13px", fontSize: 13.5, background: C.bg, color: C.ink }} />

            <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 20 }}>그날이 언제인가요? <span style={{ color: C.ink3, fontWeight: 400 }}>선택</span></div>
            <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 3, lineHeight: 1.6 }}>단수·소풍·마감처럼 <b style={{ color: C.ink2 }}>그날</b>이 있으면 넣어주세요. 며칠 전에 알려드릴지 정하면 올릴 날짜는 저희가 계산합니다.</div>
            <input type="date" className="hae" value={t.eventAt ? new Date(t.eventAt - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10) : ""}
              onChange={(e) => { const ev = parseWhen(e.target.value); upd(ev ? { eventAt: ev, lead: t.lead != null ? t.lead : 1, dueAt: dueFromEvent(ev, t.lead != null ? t.lead : 1) } : { eventAt: null }); }}
              style={{ width: "100%", marginTop: 9, border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 13px", fontSize: 15, background: C.bg, color: C.ink, fontFamily: "inherit" }} />
            {t.eventAt ? (
              <>
                <div className="flex flex-wrap gap-1.5" style={{ marginTop: 8 }}>
                  {LEADS.map(([n, lb]) => {
                    const on = (t.lead != null ? t.lead : 1) === n;
                    return (
                      <button key={n} className="press" onClick={() => upd({ lead: n, dueAt: dueFromEvent(t.eventAt, n) })}
                        style={{ background: on ? C.moss : C.bg, color: on ? "#fff" : C.ink2, border: `1px solid ${on ? C.moss : C.line}`,
                                 borderRadius: R.pill, padding: "8px 13px", fontSize: 12.5, fontWeight: on ? 600 : 400 }}>{lb}</button>
                    );
                  })}
                </div>
                <div style={{ marginTop: 9, background: C.mossSoft, borderRadius: 10, padding: "9px 12px", fontSize: 12.5, color: C.moss, lineHeight: 1.6 }}>
                  그날은 <b>{dueLabel(t.eventAt).date}</b> · <b>{dueLabel(dueFromEvent(t.eventAt, t.lead != null ? t.lead : 1)).date}</b>에 올립니다
                </div>
              </>
            ) : null}
            <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 18 }}>{t.eventAt ? "올려드릴 날짜를 직접 고치기" : "며칠에 올려드릴까요?"}</div>
            <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 3 }}>
              {t.dueAt ? `지금은 ${dueLabel(t.dueAt).date}예요. ` : ""}이 날이 되면 오늘 화면 맨 위로 올라옵니다.
            </div>
            <input type="date" className="hae" value={t.dueAt ? new Date(t.dueAt - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10) : ""}
              onChange={(e) => upd({ dueAt: parseWhen(e.target.value) || defaultDue(t.status) })}
              style={{ width: "100%", marginTop: 9, border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 13px", fontSize: 15, background: C.bg, color: C.ink, fontFamily: "inherit" }} />
            <div className="flex gap-1.5" style={{ marginTop: 8 }}>
              {[["오늘", 0], ["내일", 1], ["모레", 2], ["일주일 뒤", 7]].map(([lb, n]) => (
                <button key={lb} className="press" onClick={() => upd({ dueAt: todayKey() + n * DAY })}
                  style={{ flex: 1, background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "9px 0", fontSize: 12, color: C.ink2 }}>{lb}</button>
              ))}
            </div>

            <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 20 }}>어떤 종류인가요?</div>
            <div className="flex flex-wrap gap-2" style={{ marginTop: 10 }}>
              {STATUS_ORDER.filter((k) => k !== "repeat").map((k) => (
                <button key={k} className="press" onClick={() => upd({ status: k })}
                  style={{ background: t.status === k ? STATUS[k].bg : C.bg, color: t.status === k ? STATUS[k].fg : C.ink2,
                           border: `1px solid ${t.status === k ? STATUS[k].fg : C.line}`, borderRadius: 999, padding: "8px 13px", fontSize: 12.5, fontWeight: 600 }}>
                  {STATUS[k].label}
                </button>
              ))}
            </div>
            {/* 고른 것이 무슨 뜻인지 여기서 바로 읽히게. 누르면서 배우게 됩니다 */}
            {STATUS[t.status] && (
              <div style={{ marginTop: 9, background: STATUS[t.status].bg, borderRadius: 12, padding: "10px 13px" }}>
                <div style={{ fontSize: 12.5, color: STATUS[t.status].fg, fontWeight: 600, lineHeight: 1.55 }}>{STATUS[t.status].hint}</div>
                {STATUS[t.status].ex && <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 4 }}>예: {STATUS[t.status].ex}</div>}
              </div>
            )}

            <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 20 }}>어느 영역에 넣을까요?</div>
            <div className="flex flex-wrap gap-2" style={{ marginTop: 10 }}>
              {[...cats, { id: "etc", emoji: "🗂", label: "기타" }].map((c) => (
                <button key={c.id} className="press" onClick={() => upd({ category: c.id })}
                  style={{ background: t.category === c.id ? C.mossSoft : C.bg, color: t.category === c.id ? C.moss : C.ink2,
                           border: `1px solid ${t.category === c.id ? C.moss : C.line}`, borderRadius: 999, padding: "8px 12px", fontSize: 12.5 }}>
                  {c.emoji} {c.label}
                </button>
              ))}
            </div>
            <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 20 }}>반복되는 일인가요?</div>
            <div className="grid grid-cols-4 gap-2" style={{ marginTop: 10 }}>
              <button className="press" onClick={() => upd({ repeatDays: null, repeatDow: "", repeatDom: "" })}
                style={{ background: !t.repeatDays ? C.mossSoft : C.bg, color: !t.repeatDays ? C.moss : C.ink2, border: `1px solid ${!t.repeatDays ? C.moss : C.line}`, borderRadius: 12, padding: "13px 0", fontSize: 13, fontWeight: 600 }}>한 번만</button>
              {CYCLES.map((c) => (
                <button key={c.d} className="press" onClick={() => upd({ repeatDays: c.d })}
                  style={{ background: t.repeatDays === c.d ? C.mossSoft : C.bg, color: t.repeatDays === c.d ? C.moss : C.ink2, border: `1px solid ${t.repeatDays === c.d ? C.moss : C.line}`, borderRadius: 12, padding: "13px 0", fontSize: 13, fontWeight: 600 }}>{c.label}</button>
              ))}
            </div>
            {t.repeatDays ? (
              <>
                <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 16 }}>정해진 요일이 있나요? <span style={{ color: C.ink3, fontWeight: 400 }}>여러 개 고를 수 있어요</span></div>
                <div className="flex gap-1.5" style={{ marginTop: 9 }}>
                  {WEEKDAY.map((w, wi) => {
                    const cur = dowList({ dows: t.repeatDows, dow: t.repeatDow });
                    const on = cur.includes(wi);
                    const next = on ? cur.filter((x) => x !== wi) : [...cur, wi].sort((a, b) => a - b);
                    return (
                      <button key={wi} className="press" onClick={() => upd({ repeatDows: next, repeatDow: "", repeatDom: "", repeatDays: 7 })}
                        style={{ flex: 1, background: on ? C.moss : C.bg, color: on ? "#fff" : C.ink2, border: `1px solid ${on ? C.moss : C.line}`, borderRadius: R.xs, padding: "10px 0", fontSize: 12.5, fontWeight: 600 }}>{w}</button>
                    );
                  })}
                </div>
                <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 16 }}>매달 정해진 날짜가 있나요?</div>
                <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 3 }}>관리비·카드값처럼요. ‘말일’은 그 달의 마지막 날이에요.</div>
                <div className="grid gap-1.5" style={{ marginTop: 9, gridTemplateColumns: "repeat(7, minmax(0, 1fr))" }}>
                  {Array.from({ length: 31 }, (_, di) => di + 1).map((n) => {
                    const cur = domList({ doms: t.repeatDoms, dom: t.repeatDom });
                    const on = cur.includes(n);
                    const next = on ? cur.filter((x) => x !== n) : [...cur, n].sort((a, b) => a - b);
                    return (
                      <button key={n} className="press" onClick={() => upd({ repeatDoms: next, repeatDom: "", repeatDow: "", repeatDows: [], repeatDays: 30 })}
                        style={{ background: on ? C.moss : C.bg, color: on ? "#fff" : C.ink2, border: `1px solid ${on ? C.moss : C.line}`,
                                 borderRadius: 10, padding: "9px 0", fontSize: n === 31 ? 11 : 12.5, fontWeight: 600,
                                 gridColumn: n === 31 ? "span 2" : undefined }}>{n === 31 ? "말일" : n}</button>
                    );
                  })}
                </div>
                {(domList({ doms: t.repeatDoms, dom: t.repeatDom }).length || dowList({ dows: t.repeatDows, dow: t.repeatDow }).length) ? (
                  <div style={{ fontSize: 11.5, color: C.moss, marginTop: 7 }}>
                    {domList({ doms: t.repeatDoms, dom: t.repeatDom }).length
                      ? `매달 ${domList({ doms: t.repeatDoms, dom: t.repeatDom }).map(domLabel).join("·")}에 올립니다`
                      : `${dowList({ dows: t.repeatDows, dow: t.repeatDow }).map((i) => WEEKDAY[i]).join("·")}요일마다 올립니다`}
                  </div>
                ) : null}
              </>
            ) : null}
            <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 20 }}>날짜가 정해져 있나요? (선택)</div>
            <div style={{ fontSize: 12, color: C.ink3, marginTop: 3 }}>생일·기념일이면 넣어주세요. 매년 미리 알립니다.</div>
            <input className="hae" value={t.anchor || ""} onChange={(e) => upd({ anchor: e.target.value, repeatDays: t.repeatDays || 365 })}
              placeholder="MM-DD (예: 09-28)"
              style={{ width: "100%", marginTop: 9, border: `1px solid ${C.line}`, borderRadius: 11, padding: "11px 12px", fontSize: 14, background: C.bg, color: C.ink }} />
            <Btn onClick={() => setEdit(null)} style={{ marginTop: 18 }}>확인</Btn>
            <Btn kind="quiet" onClick={() => { setResult((rs) => rs.filter((_, i) => i !== edit)); setEdit(null); say("이 항목은 뺐어요"); }}>이 항목은 담지 않기</Btn>
          </Sheet>
        );
      })()}

      <div style={{ marginTop: 24 }}>
        <Btn kind="accent" onClick={commit}>가족 목록에 담기</Btn>
        <div style={{ height: 8 }} />
        <Btn kind="ghost" onClick={() => setPhase("input")}>다시 말하기</Btn>
      </div>

      {/* 목록이 길어지면 담기 버튼이 화면 밖으로 밀립니다.
          보고 있는 게 아직 안 담긴 목록이라는 걸 계속 알려주는 역할도 합니다 */}
      <div style={{ height: 78 }} />
      {result.length > 0 && (
        <div style={{ position: "fixed", left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 440,
                      bottom: "calc(60px + env(safe-area-inset-bottom))", zIndex: 40, padding: "16px 20px 12px",
                      background: "linear-gradient(to top, #F2F8F6 58%, rgba(242,248,246,0))", pointerEvents: "none" }}>
          <button className="press w-full" onClick={commit}
            style={{ pointerEvents: "auto", background: C.ink, color: "#fff", border: "none", borderRadius: R.pill,
                     padding: "15px 0", fontSize: 14.5, fontWeight: 600, boxShadow: SHADOW_LIFT }}>
            {result.length}개 담기
          </button>
          <div style={{ textAlign: "center", fontSize: 11, color: C.ink3, marginTop: 7 }}>담아야 오늘·영역 화면에 남아요</div>
        </div>
      )}
    </>
  );

  return (
    <>
      <div style={{ marginTop: 18, paddingLeft: 2 }}>
        <div className="disp" style={{ fontSize: 24, fontWeight: 600, lineHeight: 1.38, letterSpacing: "-.03em" }}>생각나는 거<br />다 말하세요</div>
        <p style={{ fontSize: 13.5, color: C.ink2, marginTop: 10, lineHeight: 1.7 }}>순서도, 분류도 신경 쓰지 마세요. 정리는 저희 일입니다.</p>
      </div>

      <Card style={{ marginTop: 16 }}>
        <div style={{ padding: 18 }}>
          <div className="flex justify-center" style={{ position: "relative", height: 96, marginBottom: 4 }}>
            {listening && <span className="ring" style={{ position: "absolute", top: 8, width: 80, height: 80, borderRadius: 999, border: `2px solid ${C.moss}` }} />}
            <button className="press" onClick={listening ? stopMic : startMic} aria-label={listening ? "멈추기" : "말하기"}
              style={{ width: 80, height: 80, borderRadius: 999, marginTop: 8, background: listening ? C.persim : C.moss, color: "#fff", border: "none", fontSize: 26, boxShadow: SHADOW_LIFT }}>{listening ? "■" : "🎙"}</button>
          </div>
          <textarea className="hae" value={text} onChange={(e) => setText(e.target.value)} rows={4}
            placeholder="여기에 적어도 됩니다. 띄어쓰기는 안 맞아도 됩니다. 알림장·안내문자 캡처는 붙여넣기 해도 돼요."
            style={{ width: "100%", border: `1px solid ${C.line}`, borderRadius: R.md, padding: 14, fontSize: 14.5, lineHeight: 1.65, resize: "none", background: C.bg, color: C.ink }} />
          {note && <div style={{ fontSize: 12.5, color: C.persim, marginTop: 9 }}>{note}</div>}

          {/* 앱에는 병명을 적는 칸을 안 만들었습니다. 그런데 말로는 들어옵니다.
              막을 수는 없으니, 안 적어도 된다는 것만 알립니다. */}
          <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 9, lineHeight: 1.7 }}>
            <b style={{ color: C.ink2 }}>들은 대로 말하시면 돼요.</b> "월요일 단수래" 하면 날짜와 알림까지 알아서 잡습니다.
            까먹으면 손해인 것을 찾아드리는 곳이라, 여행 코스나 일정 짜기는 전용 앱이 낫습니다.
            <br />약 이름·병명은 안 적으셔도 돼요 — <b style={{ color: C.ink2 }}>"약 떨어지기 전에 알려줘"</b>면 충분합니다.
          </div>

          {shots.length > 0 && (
            <div className="rail" style={{ marginTop: 11 }}>
              {shots.map((sh, i) => (
                <div key={i} style={{ position: "relative" }}>
                  <img src={`data:${sh.media_type};base64,${sh.data}`} alt="" style={{ width: 66, height: 66, objectFit: "cover", borderRadius: R.xs, border: `1px solid ${C.line}` }} />
                  <button onClick={() => setShots((v) => v.filter((_, k) => k !== i))} aria-label="빼기"
                    style={{ position: "absolute", top: -6, right: -6, width: 20, height: 20, borderRadius: 99, background: C.ink, color: "#fff", border: "none", fontSize: 11 }}>×</button>
                </div>
              ))}
            </div>
          )}

          <div className="rail" style={{ marginTop: 12 }}>
            <button className="press" onClick={pickPhoto}
              style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "9px 14px", fontSize: 12, color: C.ink2 }}>📄 알림장·안내문자 캡처</button>
            <button className="press" onClick={() => setText(DEMO_SPEECH)}
              style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "9px 14px", fontSize: 12, color: C.ink2 }}>시연용 예시</button>
          </div>
          <input ref={fileRef} type="file" accept="image/*" multiple style={{ display: "none" }} onChange={onFiles} />
          <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 9, lineHeight: 1.65 }}>
            알림장·가정통신문·안내문자 캡처를 읽어 <b style={{ color: C.ink2 }}>할 일과 마감일</b>만 뽑습니다.<br />
            노트북이면 캡처해서 <b style={{ color: C.ink2 }}>붙여넣기(Ctrl+V)</b>가 빨라요. 휴대폰은 버튼을 누르면 카메라가 열립니다.
            장 본 영수증은 <b style={{ color: C.ink2 }}>식단 화면</b>에서 찍어주세요.
          </div>
          {st.plan !== "paid" && leftOf(st, "talk") <= 5 && (
            <div style={{ fontSize: 11.5, color: leftOf(st, "talk") ? C.ink3 : C.persim, marginTop: 10, lineHeight: 1.65 }}>
              {leftOf(st, "talk")
                ? `이번 달 AI 정리 ${leftOf(st, "talk")}번 남았어요 · ${nextResetLabel()}에 다시 채워집니다`
                : `이번 달 AI 정리를 다 쓰셨어요. 직접 적으시면 그대로 챙깁니다 · ${nextResetLabel()}에 다시 채워집니다`}
            </div>
          )}
          {hasShot && <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 9, lineHeight: 1.6 }}>
            사진은 크기를 줄여 AI에 보내고 <b style={{ color: C.ink2 }}>앱에는 저장하지 않습니다</b>. 뽑아낸 할 일만 남아요.
          </div>}

          <div style={{ height: 14 }} />
          <Btn onClick={() => analyze()}>{shots.length ? "사진까지 같이 정리해줘" : "정리해줘"}</Btn>
        </div>
      </Card>

      {/* 예시 질문 — 스스로 바뀌지 않게 고정했습니다. 누르면 위 칸에 들어가요 */}
      <Section eyebrow="EXAMPLES" title="뭐라고 말해야 할지 모르겠다면" right="누르면 그대로 들어가요">
        {exByCat.map((g) => (
          <div key={g.cat.id} style={{ marginBottom: 12 }}>
            <div style={{ fontSize: 12.5, color: C.ink2, fontWeight: 600, marginBottom: 7, paddingLeft: 2 }}>{g.cat.emoji} {g.cat.label}</div>
            <PromptRail list={g.list.slice(0, 4)} onUse={(p) => { const t = (text ? text + " " : "") + p; setText(t); window.scrollTo({ top: 0, behavior: "smooth" }); analyze(t); }} />
          </div>
        ))}
      </Section>
    </>
  );
}

/* ── 경조사: 생신·기일·기념일 전용 화면 ─────────────
   제사는 보통 음력이라 해마다 양력 날짜가 다릅니다.
   음력 항목은 올해 양력 날짜로 잡고, 지나면 다음 해를
   추정(+354일)해두고 확인을 부탁합니다. */
function AnnScreen() {
  const { st, setSt, addTasks, say, setTab } = use();
  const [name, setName] = useState("");
  const [mm, setMM] = useState("");
  const [dd, setDD] = useState("");
  const [lead, setLead] = useState(7);
  const [lunar, setLunar] = useState(false);
  const [withPrep, setWithPrep] = useState(true);
  const isJesa = /제사|기일|차례/.test(name);
  /* 음력 선택 중이면 고른 날짜의 다음 양력 날짜를 미리 계산해 보여줍니다 */
  const preview = lunar && mm && dd ? nextLunarSolarAfter(`${String(mm).padStart(2, "0")}-${String(dd).padStart(2, "0")}`, Date.now()) : null;
  const inp = { border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "12px 13px", fontSize: 14.5, background: C.bg, color: C.ink, width: "100%" };

  const list = (st.customRoutines || [])
    .filter((cr) => (st.routines[`c:${cr.id}`] || {}).anchor)
    .map((cr) => {
      const cfg = st.routines[`c:${cr.id}`] || {};
      const evt = nextAnchorAfter(cfg.anchor, 0, todayKey() - 1);
      return { cr, cfg, evt, dday: Math.ceil((startOfDay(evt) - todayKey()) / DAY) };
    })
    .sort((a, b) => a.evt - b.evt);

  /* 제사·차례 준비물 — AI가 만들고, 실패하면 기본 목록으로 */
  const genPrep = async (title, evtMs) => {
    const ed = new Date(evtMs);
    const when = `${ed.getMonth() + 1}월 ${ed.getDate()}일`;
    const FALLBACK = [
      { title: "제수 음식 메뉴 정하기", category: "food", daysBefore: 7, note: "어른들께 여쭤볼 것 포함" },
      { title: "제기·향·초·병풍 확인", category: "event", daysBefore: 5, note: "모자란 건 미리 주문" },
      { title: "제수 장보기 목록 만들기", category: "food", daysBefore: 4, note: "과일·나물·전·탕국 재료" },
      { title: "제수 장보기", category: "food", daysBefore: 2, note: "생물은 하루 전에" },
      { title: "집 정리·상 자리 마련", category: "home", daysBefore: 1, note: "" },
      { title: "음식 장만·전 부치기", category: "food", daysBefore: 1, note: "" },
      { title: "지방·축문 준비", category: "event", daysBefore: 1, note: "" },
    ];
    let items = FALLBACK;
    try {
      const r = await askClaude(`한국 가정의 살림을 돕는 AI '${BRAND}'입니다. "${title}" (${when})을 준비합니다.
가구: ${householdLine(st)}
이 행사 전에 해야 할 준비를 5~8개로 나누세요. 장보기·음식·용품·집정리를 구분하고, 며칠 전에 할지 정하세요.
출력은 JSON 배열만: [{"title":"12자 이내","category":"food|home|event","daysBefore":숫자,"note":"15자 이내"}]`);
      if (Array.isArray(r) && r.length) items = r.filter((x) => x && x.title).slice(0, 8);
    } catch {}
    const rows = items.map((it) => {
      const due = new Date(evtMs - (Number(it.daysBefore) || 1) * DAY);
      return { title: String(it.title).slice(0, 20), category: ["food", "home", "event"].includes(it.category) ? it.category : "event",
        status: "remember", note: `${due.getMonth() + 1}/${due.getDate()}까지${it.note ? " · " + it.note : ""}` };
    });
    addTasks(rows, "ai");
    say(`준비 ${rows.length}개를 영역별로 담았어요`);
  };

  const add = () => {
    const t = name.trim();
    const m = Number(mm), d = Number(dd);
    if (!t) return say("이름을 넣어주세요 (예: 시아버지 생신)");
    if (!m || !d || m > 12 || d > (lunar ? 30 : 31)) return say(lunar ? "음력 월과 일을 골라주세요" : "월과 일을 골라주세요");
    const md = `${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    let anchorSolar = md, evtMs;
    if (lunar) {
      evtMs = nextLunarSolarAfter(md, Date.now());
      if (evtMs == null) return say("변환 가능한 날짜 범위를 벗어났어요");
      const ad = new Date(evtMs);
      anchorSolar = `${String(ad.getMonth() + 1).padStart(2, "0")}-${String(ad.getDate()).padStart(2, "0")}`;
    } else {
      evtMs = nextAnchorAfter(md, 0, Date.now());
    }
    const cid = uid("cr");
    setSt((sv) => ({
      ...sv,
      customRoutines: [...(sv.customRoutines || []), { id: cid, title: t, category: "event", cycle: 365 }],
      routines: { ...sv.routines, [`c:${cid}`]: { on: true, cycle: 365, anchor: anchorSolar, leadDays: lead,
        lunar: lunar || undefined, lunarMD: lunar ? md : undefined,
        lunarLabel: lunar ? `음력 ${m}월 ${d}일` : undefined,
        nextAt: Math.max(evtMs - lead * DAY, Date.now()) } },
    }));
    const doPrep = withPrep && isJesa;
    setName(""); setMM(""); setDD("");
    say(lunar ? `음력 ${m}월 ${d}일 → 올해 ${anchorLabel(anchorSolar)} · ${lead === 0 ? "당일" : lead + "일 전"}에 올립니다`
              : `${anchorLabel(anchorSolar)} ${lead === 0 ? "당일에" : lead + "일 전에"} 올립니다`);
    if (doPrep) genPrep(t, evtMs);
  };
  const editRow = (row) => {
    setName(row.cr.title);
    const src = row.cfg.lunar && row.cfg.lunarMD ? row.cfg.lunarMD : row.cfg.anchor;
    setMM(String(Number(src.split("-")[0])));
    setDD(String(Number(src.split("-")[1])));
    setLead(row.cfg.leadDays != null ? row.cfg.leadDays : 7);
    setLunar(!!row.cfg.lunar);
    setSt((sv) => ({ ...sv, customRoutines: (sv.customRoutines || []).filter((x) => x.id !== row.cr.id) }));
    window.scrollTo({ top: 0, behavior: "smooth" });
    say("아래 칸에 불러왔어요. 고쳐서 다시 넣어주세요");
  };

  return (
    <>
      <PageHead onBack={() => setTab("set")} backLabel="설정" />
      <div style={{ marginTop: 14, paddingLeft: 2 }}>
        <div className="disp" style={{ fontSize: 24, fontWeight: 600, letterSpacing: "-.03em" }}>경조사</div>
        <p style={{ fontSize: 13.5, color: C.ink2, marginTop: 9, lineHeight: 1.7 }}>
          넣어두면 <b style={{ color: C.moss }}>선물·준비물을 싸게 살 때</b> 미리 알립니다.<br />
          날짜를 기억해드리려는 게 아니에요 — 안 까먹는 것은 안 묻습니다.
          답례품이 제일 싼 때, 돌잔치 자리가 남아 있는 때를 대신 봅니다.
        </p>
      </div>

      <Card style={{ marginTop: 16 }}>
        <div style={{ padding: 16 }}>
          <div className="rail">
            {["시아버지 생신", "시어머니 생신", "친정아버지 생신", "친정어머니 생신", "남편 생일", "아내 생일", "결혼기념일",
              "시댁 제사", "친정 제사", "할아버지 기일", "할머니 기일",
              ...st.children.map((c) => `${c.name} 생일`)].map((p) => (
              <button key={p} className="press" onClick={() => { setName(p); if (/제사|기일/.test(p)) setLunar(true); }}
                style={{ background: name === p ? C.mossSoft : C.bg, color: name === p ? C.moss : C.ink2, border: `1px solid ${name === p ? C.moss : C.line}`, borderRadius: R.pill, padding: "8px 13px", fontSize: 12 }}>{p}</button>
            ))}
          </div>
          <input className="hae" value={name} onChange={(e) => setName(e.target.value)} placeholder="직접 입력 (예: 큰집 제사)"
            style={{ ...inp, marginTop: 10 }} />

          <div className="flex gap-1.5" style={{ marginTop: 12 }}>
            {[[false, "양력"], [true, "음력 (제사·기일)"]].map(([v, l]) => (
              <button key={l} className="press" onClick={() => setLunar(v)}
                style={{ flex: 1, background: lunar === v ? C.mossSoft : C.bg, color: lunar === v ? C.moss : C.ink2, border: `1px solid ${lunar === v ? C.moss : C.line}`, borderRadius: R.xs, padding: "10px 0", fontSize: 12.5, fontWeight: 600 }}>{l}</button>
            ))}
          </div>

          <div style={{ fontSize: 12, color: C.ink2, marginTop: 12 }}>{lunar ? "음력 날짜 (양력은 자동 계산)" : "날짜"}</div>
          <div className="flex gap-2" style={{ marginTop: 7 }}>
            <select className="hae" value={mm} onChange={(e) => setMM(e.target.value)} style={{ ...inp, flex: 1 }}>
              <option value="">{lunar ? "음력 몇 월" : "몇 월"}</option>
              {Array.from({ length: 12 }, (_, i) => i + 1).map((m) => <option key={m} value={m}>{m}월</option>)}
            </select>
            <select className="hae" value={dd} onChange={(e) => setDD(e.target.value)} style={{ ...inp, flex: 1 }}>
              <option value="">며칠</option>
              {Array.from({ length: lunar ? 30 : 31 }, (_, i) => i + 1).map((d) => <option key={d} value={d}>{d}일</option>)}
            </select>
          </div>
          {lunar && preview && (
            <div style={{ marginTop: 9, background: C.mossSoft, borderRadius: R.xs, padding: "10px 12px", fontSize: 12.5, color: C.moss, lineHeight: 1.6 }}>
              음력 {Number(mm)}월 {Number(dd)}일 → 다음 차례는 <b>{new Date(preview).getFullYear()}년 {new Date(preview).getMonth() + 1}월 {new Date(preview).getDate()}일</b>이에요. 해마다 자동으로 다시 계산합니다.
            </div>
          )}

          {isJesa && (
            <button className="press flex items-center gap-2.5 w-full" onClick={() => setWithPrep((v) => !v)}
              style={{ marginTop: 12, background: "transparent", border: "none", padding: "2px 0", textAlign: "left" }}>
              <span style={{ width: 20, height: 20, borderRadius: 6, flexShrink: 0, border: `1.5px solid ${withPrep ? C.moss : C.line}`, background: withPrep ? C.moss : "transparent", color: "#fff", fontSize: 12, lineHeight: "18px", textAlign: "center" }}>{withPrep ? "✓" : ""}</span>
              <span style={{ fontSize: 12.5, color: C.ink2, lineHeight: 1.5 }}>준비물도 AI가 나눠 담기 — 장보기·제기·음식·집정리를 날짜별로 영역에 넣습니다</span>
            </button>
          )}

          <div style={{ fontSize: 12, color: C.ink2, marginTop: 12 }}>얼마나 미리 알려드릴까요?</div>
          <div className="flex gap-1.5" style={{ marginTop: 7 }}>
            {[[0, "당일"], [3, "3일 전"], [7, "1주 전"], [14, "2주 전"]].map(([v, l]) => (
              <button key={v} className="press" onClick={() => setLead(v)}
                style={{ flex: 1, background: lead === v ? C.mossSoft : C.bg, color: lead === v ? C.moss : C.ink2, border: `1px solid ${lead === v ? C.moss : C.line}`, borderRadius: R.xs, padding: "10px 0", fontSize: 12.5, fontWeight: 600 }}>{l}</button>
            ))}
          </div>
          <Btn kind="accent" style={{ marginTop: 14, padding: "14px 0" }} onClick={add}>넣기</Btn>
        </div>
      </Card>

      <Section eyebrow="UPCOMING" title="다가오는 순서" right={list.length ? `${list.length}건` : null}>
        <Card>
          {list.length ? list.map((row, i) => (
            <div key={row.cr.id} className="flex items-center gap-2.5" style={{ padding: "14px 16px", borderBottom: i === list.length - 1 ? "none" : `1px solid ${C.lineSoft}` }}>
              <span className="flex-1 min-w-0">
                <span style={{ display: "block", fontSize: 14.5, fontWeight: 500 }}>{row.cr.title}</span>
                <span style={{ display: "block", fontSize: 12, color: C.ink3, marginTop: 3 }}>
                  {anchorLabel(row.cfg.anchor)}
                  {row.cfg.lunar ? <span style={{ color: C.sun }}> · {row.cfg.lunarLabel || "음력"} (자동 변환){row.cfg.estimated ? " · 추정, 확인해주세요" : ""}</span> : null}
                  {" · "}{(row.cfg.leadDays || 0) === 0 ? "당일 알림" : `${row.cfg.leadDays}일 전 알림`}
                </span>
              </span>
              <span className="mono" style={{ fontSize: 12.5, fontWeight: 500, color: row.dday <= 7 ? C.persim : C.moss, whiteSpace: "nowrap" }}>
                {row.dday === 0 ? "오늘" : `D-${row.dday}`}
              </span>
              <button className="press" onClick={() => editRow(row)}
                style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "6px 11px", fontSize: 11.5, color: C.ink2 }}>고치기</button>
              <button onClick={() => setSt((sv) => ({ ...sv, customRoutines: (sv.customRoutines || []).filter((x) => x.id !== row.cr.id) }))}
                aria-label="지우기" style={{ background: "none", border: "none", color: C.ink3, fontSize: 18, padding: 0 }}>×</button>
            </div>
          )) : (
            <div style={{ padding: "26px 18px", textAlign: "center", fontSize: 13.5, color: C.ink3, lineHeight: 1.7 }}>
              아직 등록한 경조사가 없어요.<br />위에서 칩 하나 눌러 시작해보세요.
            </div>
          )}
        </Card>
        {list.length > 0 && <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 9, paddingLeft: 3, lineHeight: 1.6 }}>
          알림일이 되면 오늘 화면 · 행사·경조사 영역에 올라오고, 담당자도 나눌 수 있어요.
        </div>}
      </Section>
    </>
  );
}

/* ── 영역(카테고리) ───────────────────────────── */
function Categories() {
  const { st, setSt, cats, openCat, setOpenCat, addTasks, say, log, setTab } = use();

  const [picked, setPicked] = useState({});
  const [aiItems, setAiItems] = useState([]);
  const [loading, setLoading] = useState(false);
  const [adding, setAdding] = useState(false);
  const [newName, setNewName] = useState("");
  const [ex, setEx] = useState(0);

  const allCats = [...cats, { id: "etc", emoji: "🗂", label: "기타" }];

  const open = async (cat) => {
    setOpenCat(cat); setPicked({}); setAiItems([]); setLoading(true); log("cat_open", { id: cat.id });
    const mine = st.tasks.filter((t) => t.category === cat.id).map((t) => t.title);
    try {
      const r = await askClaude(`한국 가정의 살림을 대신 기억해주는 AI 비서 '${BRAND}'입니다.
"${cat.label}" 영역에서 이 집이 아직 등록하지 않았지만 주기적으로 챙겨야 할 항목을 알려주세요.
가구: ${householdLine(st)}
이미 등록: ${mine.length ? mine.join(", ") : "없음"}
규칙: 이 집에 실제 해당하는 것만, 한국 기준, 3~4개, 이미 등록한 항목 제외.
출력은 JSON 배열만: [{"t":"12자 이내","cy":"권장 주기","why":"놓치기 쉬운 이유 20자"}]`);
      if (Array.isArray(r)) setAiItems(r.filter((x) => x && x.t));
    } catch {}
    setLoading(false);
  };

  if (openCat) {
    const baseKey = openCat.child ? "kid" : openCat.id;
    const mine = st.tasks.filter((t) => t.category === openCat.id && !t.done);
    /* 이미 담았거나 반복으로 도는 항목은 "놓친 것" 목록에서 뺍니다 */
    const list = [...(BLIND[baseKey] || []), ...aiItems]
      .filter((c) => !st.tasks.some((t) => !t.done && t.title === c.t));
    const myRoutines = eligibleRoutines(st, true).filter((r) => (r.child ? `kid:${r.child.id}` : r.seed.cat) === openCat.id);
    const chosen = list.filter((_, i) => picked[i]);
    const prompts = PROMPTS[baseKey] || PROMPTS.etc;

    return (
      <>
        <PageHead onBack={() => setOpenCat(null)} backLabel="영역 전체" />
        <div className="flex items-center gap-3" style={{ marginTop: 16, marginBottom: 6 }}>
          <span style={{ fontSize: 30 }}>{openCat.emoji}</span>
          <div>
            <div className="disp" style={{ fontSize: 22, fontWeight: 600, letterSpacing: "-.025em" }}>{openCat.label}</div>
            <div style={{ fontSize: 12.5, color: C.ink3, marginTop: 3 }}>반복 {myRoutines.length}개 · 진행 중 {mine.length}건</div>
          </div>
        </div>


        {/* 예시 질문 — 고정입니다. 누르면 말하기 화면 입력칸에 그대로 들어가요 */}
        <div style={{ marginTop: 16 }}>
          <PromptRail list={prompts.slice(0, 5)}
            note="누르면 ‘말하기’ 입력칸에 들어갑니다. 고쳐서 보내셔도 돼요."
            onUse={(p) => { setSt((sv) => ({ ...sv, draft: p, draftRun: true })); setOpenCat(null); setTab("speak"); }} />
        </div>
        <LinkCards group={null} text={openCat.label} />

        {myRoutines.length > 0 && (
          <Section eyebrow="ROUTINE" title="반복 업무" right="주기를 눌러 바꿀 수 있어요">
            <Card>{myRoutines.map((r, i, a) => <RoutineRow key={r.key} r={r} delay={i * 40} last={i === a.length - 1} manage />)}</Card>
          </Section>
        )}
        {mine.length > 0 && (
          <Section eyebrow="TASKS" title="담아둔 일">
            <Card>{mine.map((t, i, a) => <TaskRow key={t.id} t={t} delay={i * 40} last={i === a.length - 1} />)}</Card>
          </Section>
        )}

        <Section eyebrow="BLIND SPOT" title="혹시 놓치고 있는 건 없나요?" right="등록 안 해도 해당되는 일">
          <Card>
            {list.map((c, i) => (
              <button key={i} className="press rise flex items-start gap-3 w-full text-left" onClick={() => setPicked((p) => ({ ...p, [i]: !p[i] }))}
                style={{ background: picked[i] ? C.mossSoft : "transparent", border: "none", borderBottom: i === list.length - 1 && !loading ? "none" : `1px solid ${C.line}`, padding: "14px 16px", animationDelay: `${i * 50}ms` }}>
                <span style={{ width: 21, height: 21, marginTop: 1, borderRadius: 999, flexShrink: 0, border: `1.5px solid ${picked[i] ? C.moss : C.line}`, background: picked[i] ? C.moss : "transparent", color: "#fff", fontSize: 12, lineHeight: "19px", textAlign: "center" }}>{picked[i] ? "✓" : ""}</span>
                <span className="flex-1 min-w-0">
                  <span style={{ display: "block", fontSize: 14.5, fontWeight: 500 }}>{c.t}</span>
                  <span style={{ display: "block", fontSize: 12, color: C.ink3, marginTop: 3 }}>{c.why}</span>
                </span>
                <span className="mono" style={{ fontSize: 11, color: C.moss, whiteSpace: "nowrap", marginTop: 3 }}>{c.cy}</span>
              </button>
            ))}
            {loading && <div style={{ padding: "15px 16px", fontSize: 12.5, color: C.ink3, borderTop: `1px solid ${C.line}` }}>이 집에만 해당하는 항목을 더 찾는 중…</div>}
          </Card>
        </Section>

        <div style={{ marginTop: 18 }}>
          <Btn disabled={!chosen.length} onClick={() => { addTasks(chosen.map((c) => ({ title: c.t, category: openCat.id, status: "check", note: c.cy, coverage: "system" })), "ai"); say(`${chosen.length}개를 담았어요`); setPicked({}); }}>
            {chosen.length ? `${chosen.length}개 챙기기` : "챙길 항목을 골라주세요"}
          </Btn>
        </div>
      </>
    );
  }

  return (
    <>
    {/* 광고 자리. 지금은 아무것도 안 그립니다.
        유료 전환 뒤 무료 사용자에게만 켤 자리이고, 여기 둔 이유는
        복지 안내와 멀리 떨어뜨리기 위해서입니다.
        (복지는 유용정보 탭에 있고, 여기는 영역 목록 위입니다.) */}
    <AdSlot where="영역" />
    <Section eyebrow="AREAS" title="우리 집 관리 영역" right="탭하면 놓친 것부터">
      <div className="grid grid-cols-2 gap-2.5">
        {allCats.map((c, i) => {
          const n = st.tasks.filter((t) => t.category === c.id && !t.done).length;
          /* 켜져 있는 것만 셉니다. 꺼둔 것까지 세면 "반복 23"이라고 해놓고
             정작 아무것도 안 도는 화면이 됩니다 */
          const rn = eligibleRoutines(st, true).filter((r) => (r.child ? `kid:${r.child.id}` : r.seed.cat) === c.id && (st.routines[r.key] || {}).on).length;
          return (
            <button key={c.id} className="press rise text-left" onClick={() => open(c)}
              style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 18, padding: 15, boxShadow: SHADOW, animationDelay: `${i * 30}ms` }}>
              <div style={{ fontSize: 23 }}>{c.emoji}</div>
              <div style={{ fontSize: 14.5, fontWeight: 600, marginTop: 9, lineHeight: 1.3 }}>{c.label}</div>
              <div className="mono" style={{ fontSize: 10.5, color: n || rn ? C.moss : C.ink3, marginTop: 6 }}>{rn ? `반복 ${rn}` : ""}{rn && n ? " · " : ""}{n ? `할 일 ${n}` : (rn ? "" : "비어 있음")}</div>
            </button>
          );
        })}
        <div style={{ border: `1px dashed ${C.line}`, borderRadius: 18, padding: 15 }}>
          {adding ? (
            <>
              <input className="hae" value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="예: 텃밭"
                style={{ width: "100%", border: `1px solid ${C.line}`, borderRadius: 10, padding: "8px 10px", fontSize: 13, background: C.card, color: C.ink }} />
              <button className="press w-full" onClick={() => {
                const label = newName.trim(); if (!label) return setAdding(false);
                setSt((s) => ({ ...s, customCats: [...(s.customCats || []), { id: uid("cc"), emoji: "✚", label }] }));
                setNewName(""); setAdding(false); say("영역을 추가했어요");
              }} style={{ marginTop: 9, background: C.moss, color: "#fff", border: "none", borderRadius: 10, padding: "8px 0", fontSize: 12.5, fontWeight: 600 }}>추가</button>
            </>
          ) : (
            <button onClick={() => setAdding(true)} className="w-full text-left" style={{ background: "none", border: "none" }}>
              <div style={{ fontSize: 23, color: C.ink3 }}>✚</div>
              <div style={{ fontSize: 14.5, fontWeight: 600, marginTop: 9, color: C.ink2 }}>직접 추가</div>
              <div style={{ fontSize: 10.5, color: C.ink3, marginTop: 6 }}>빠진 영역 만들기</div>
            </button>
          )}
        </div>
      </div>
    </Section>
    </>
  );
}


/* 광고는 무료 사용자에게만, 유료 전환 뒤에 켭니다.
   지금은 자리만 잡아두고 아무것도 안 그립니다 —
   베타에 광고를 넣으면 유지율 숫자가 오염됩니다.
   켤 때 지킬 것: 복지 안내 옆에는 절대 붙이지 않습니다. */
function AdSlot({ where }) {
  const { st } = use();
  if (!CHARGING()) return null;
  if (st.plan === "paid") return null;
  if (!st.adOn) return null;
  return null;   /* 아직 붙인 광고가 없습니다 */
}


/* 마트에서 동선이 다릅니다. 먹을 것과 생활용품을 섞어두면
   한 줄씩 훑으며 왔다 갔다 하게 됩니다. 이름만 보고 갈라둡니다.
   틀려도 살 것 목록에서 자리만 바뀌는 정도라 위험하지 않습니다. */
const NONFOOD = [
  "휴지", "화장지", "물티슈", "세제", "섬유유연제", "표백", "락스", "세정", "샴푸", "린스",
  "비누", "치약", "칫솔", "면도", "생리대", "기저귀", "물티", "수세미", "행주", "걸레",
  "봉투", "지퍼백", "랩", "호일", "키친타월", "건전지", "전구", "테이프", "마스크", "면봉",
  "방향제", "탈취", "살충", "모기", "주걱", "국자", "도마", "냄비", "프라이팬", "그릇",
  "수건", "옷걸이", "빨래", "청소", "필터", "볼펜", "노트", "충전기", "케이블",
];
const isFoodName = (n) => !NONFOOD.some((k) => String(n || "").includes(k));

/* 늘 두고 쓰는 것들. 이게 있어야 "토마토소스 있으니 파스타" 같은 조합이 나옵니다.
   재료는 먹으면 없어지지만 이건 떨어질 때까지 계속 있습니다. */
const STAPLES = [
  "간장", "된장", "고추장", "고춧가루", "참기름", "들기름", "식초", "다진마늘",
  "맛술", "굴소스", "마요네즈", "케첩", "토마토소스", "크림소스", "카레가루",
  "김가루", "조미김", "참치캔", "스팸", "계란", "파스타면", "소면", "즉석밥",
  "미역", "김치", "어묵", "치즈", "버터",
];

/* ── 장보기와 식단 ────────────────────────────────
   "뭐 먹지"와 "뭐 사야 하지"는 사실 같은 고민입니다. 한 화면에 둡니다.
   영수증을 찍으면 산 재료를 읽어 손질할 일과 식단 후보를 함께 냅니다.
   고른 것만 남기고 나머지는 지웁니다. */
function MealScreen() {
  const { st, setSt, addTasks, say, log, spendAI, refundAI, setTab, complete } = use();
  const [busy, setBusy] = useState(false);
  const [want, setWant] = useState("");
  const [err, setErr] = useState("");
  const [txt, setTxt] = useState("");
  const [txt2, setTxt2] = useState("");
  const fileRef = useRef(null);
  const meal = st.meal || null;
  const items = (meal && meal.items) || [];
  const chosen = (meal && meal.chosen) || [];
  const isOn = (dish) => chosen.indexOf(dish) >= 0;
  const allBuys = st.tasks.filter((t) => t.status === "buy");
  const openBuys = allBuys.filter((t) => !t.done);
  /* 먹을 것과 생활용품은 마트에서 가는 자리가 다릅니다 */
  const isFoodTask = (t) => t.category === "food" || (t.category !== "home" && isFoodName(t.title));
  const buyGroups = (() => {
    const f = allBuys.filter(isFoodTask), o = allBuys.filter((t) => !isFoodTask(t));
    if (!f.length || !o.length) return [{ key: "all", label: null, items: allBuys }];
    return [{ key: "food", label: "🥬 먹을 것", items: f }, { key: "etc", label: "🧻 생활용품", items: o }];
  })();
  const boughtRows = allBuys.filter((t) => t.done);
  const bought = (meal && meal.bought) || [];
  /* "두부 구매" → "두부". 프롬프트에도 화면에도 재료 이름만 보이는 게 맞습니다 */
  const buys = openBuys.map((t) => t.title.replace(/\s*구매$/, ""));
  const copyList = async () => {
    const text = openBuys.map((t) => "· " + t.title.replace(/\s*구매$/, "")).join("\n");
    try { await navigator.clipboard.writeText(text); say("복사했어요. 쿠팡·메모 어디든 붙여넣으세요"); }
    catch { window.alert("복사가 막혀 있어요. 아래를 길게 눌러 복사하세요:\n\n" + text); }
  };

  const toggle = (dish) => setSt((sv) => {
    const cur = (sv.meal && sv.meal.chosen) || [];
    const next = cur.indexOf(dish) >= 0 ? cur.filter((x) => x !== dish) : [...cur, dish];
    return { ...sv, meal: { ...(sv.meal || {}), chosen: next } };
  });

  const gen = async () => {
    if (!spendAI("talk", 1)) return say("이번 달 AI 정리를 다 쓰셨어요");
    setBusy(true); setErr("");
    log("meal_gen", { want: want.length });
    const FALLBACK = [
      { dish: "된장찌개와 계란말이", why: "재료가 늘 있는 조합", need: ["두부", "애호박", "계란", "대파"], min: 25 },
      { dish: "소고기 미역국", why: "끓여두면 이틀 먹어요", need: ["미역", "국거리 소고기"], min: 40 },
      { dish: "간장 불고기", why: "아이도 잘 먹는 간", need: ["불고기감", "양파", "당근"], min: 30 },
      { dish: "김치볶음밥", why: "남은 밥 처리", need: ["김치", "햄", "계란"], min: 15 },
      { dish: "닭볶음탕", why: "주말에 한 번", need: ["닭볶음탕용 닭", "감자", "당근"], min: 50 },
    ];
    /* 매번 같은 게 나오면 안 씁니다. 지난번에 낸 메뉴를 알려주고 피하게 합니다 */
    const past = (st.mealPast || []).slice(-24);
    const m = new Date().getMonth() + 1;
    const season = m <= 2 || m === 12 ? "겨울" : m <= 5 ? "봄" : m <= 8 ? "여름" : "가을";
    let got = null, fell = false, why = "";
    /* 빈 답이 오는 일이 있습니다. 사용자가 다시 누르게 하지 말고 한 번은 앱이 다시 붙습니다.
       두 번째는 메뉴 수를 줄여서 — 짧게 달라고 하면 오는 경우가 있습니다. */
    for (let tryNo = 0; tryNo < 2 && !got; tryNo++) {
    const howMany = tryNo === 0 ? 7 : 5;
    try {
      const r = await askClaude(`한국 가정의 살림을 돕는 AI '${BRAND}'입니다. 이번 주 저녁 식단을 짜주세요.
가구: ${householdLine(st)}
오늘: ${todayStr()} (${season})
지금 집에 있는 재료: ${foods.filter((x) => !x.usedAt).slice(0, 20).map((x) => x.name).join(", ") || "모름"}
집에 늘 있는 것(양념·소스와 기본 식재료 — 이건 이미 있으니 사지 않습니다): ${staples.slice(0, 20).map((x) => x.name).join(", ") || "모름"}
지금 살 것 목록에 있는 것: ${buys.length ? buys.join(", ") : "없음"}
${past.length ? "최근에 이미 낸 메뉴(다시 내지 마세요): " + past.join(", ") : ""}
${want.trim() ? "요청: " + want.trim() : ""}

규칙
- 한국 가정에서 실제로 자주 해 먹는 저녁 메뉴로 ${howMany}개를 제안하세요.
- 설명이나 인사말 없이 JSON 배열만 쓰세요. 생각을 적지 말고 바로 답만 쓰세요.
- 아이가 있으면 아이가 먹을 수 있는 간의 메뉴를 반 이상 넣으세요.
- 재료가 겹치게 짜서 장을 한 번에 볼 수 있게 하세요. 한 번 산 재료를 두 끼에 쓰면 좋습니다.
- 한 주에 한 번은 40분 이상 걸리는 것, 나머지는 30분 안쪽으로.
- need에는 **사야 할 것만** 넣으세요. 위 "집에 늘 있는 것"에 적힌 건
  양념이든 계란·파스타면·김치든 **하나도 넣지 마세요.** 이미 집에 있습니다.
- **집에 있는 재료를 쓰는 메뉴를 가장 먼저** 고르세요. 사놓고 안 먹어 버리는 게
  제일 아깝습니다. 오래된 것부터 쓰는 메뉴면 더 좋습니다.
- 위에 적힌 **늘 있는 것을 적극적으로 조합**하세요. 토마토소스가 있으면 파스타,
  김가루가 있으면 주먹밥, 카레가루가 있으면 카레처럼요. 그게 있는 줄 알기에
  낼 수 있는 메뉴가 이 앱의 값어치입니다.
- 다만 **실제로 같이 안 먹는 조합을 억지로 붙이지 마세요.** 집에 있다고
  장어와 시금치를 한 그릇에 담는 식은 안 됩니다. 한국 가정에서 진짜로
  그렇게 해 먹는 메뉴만 쓰세요.
- 그다음으로 살 것 목록에 있는 재료를 쓰는 메뉴를 고르세요.
- **최근에 이미 낸 메뉴는 절대 다시 내지 마세요.** 주재료도 조리법도 바꾸세요.
  된장찌개를 냈으면 다음엔 찌개 말고 볶음이나 구이, 면, 덮밥 쪽으로 가세요.
- 조리법이 겹치지 않게 하세요. 국물·볶음·구이·조림·면·덮밥으로 갈래를 흩어주세요.
- ${season}에 나는 재료를 한두 개는 꼭 쓰세요.

이름 짓는 법 — 지금 제일 자주 틀리는 부분입니다
- **재료를 이어 붙여 이름을 만들지 마세요.** 그건 메뉴 이름이 아닙니다.
  ✗ 돼지고기간것두부조림 → ○ 돼지고기 두부조림
  ✗ 불고기감잡채       → ○ 잡채
  ✗ 장어시금치덮밥     → ○ 장어덮밥
- **한국 사람이 실제로 부르는 이름**으로 쓰고, **띄어쓰기도 그대로** 두세요.
- 재고에 "돼지고기 간 것"처럼 적혀 있어도, 메뉴 이름에는 "다진 돼지고기"나
  그냥 "돼지고기"로 씁니다.

출력은 JSON 배열만: [{"dish":"실제로 부르는 이름, 띄어쓰기 포함 16자 이내","why":"왜 이걸 권하는지 20자 이내","need":["사야 할 것만"],"min":조리시간분}]`);
      if (Array.isArray(r) && r.length) got = r.filter((x) => x && x.dish).slice(0, 8);
      if (!got) why = "AI가 식단 모양이 아닌 답을 보냈어요";
    } catch (e) {
      why = (e && e.message) || "식단을 못 받아왔어요";
      console.error("meal gen failed", "try" + (tryNo + 1), e && e.code, why);
      /* 키·크레딧·로그인 문제면 다시 불러도 같습니다. 두 번 부르지 않습니다 */
      if (!/빈 답|끊겼|읽지 못했|모양이 아닌/.test(why)) break;
    }
    }
    if (!got) {
      /* 기본 식단은 늘 같습니다. 그걸 보고 계신 거면 AI가 안 불린 겁니다.
         왜 못 불렀는지는 다음에 다시 누를 때 지워지면 안 됩니다. 같이 저장합니다. */
      refundAI("talk", 1); got = FALLBACK; fell = true;
      setErr(why);
    }
    setSt((sv) => ({ ...sv, meal: { at: Date.now(), items: got, chosen: [], fell, why: fell ? why : "" },
                     mealPast: fell ? (sv.mealPast || []) : [...(sv.mealPast || []), ...got.map((x) => x.dish)].slice(-24) }));
    setBusy(false); setWant("");
  };

  /* 재고 — 산 것은 집에 있고, 먹으면 없어집니다.
     "샀어요"에 줄이 그어지듯 "먹었어요"에도 줄이 그어집니다. */
  const pantry = (st.pantry || []).filter((x) => !x.usedAt || Date.now() - x.usedAt < 3 * DAY);
  const norm = (n) => String(n || "").replace(/\s*구매$/, "").trim();

  /* 늘 있는 것(양념)과 집에 있는 것(장 본 재료)은 다른 칸에 따로 보여줍니다.
     한쪽에 세면 다른 쪽에서 또 세면 안 됩니다 — "집에 있는 것 27개"라고
     써놓고 목록은 "아직 비어 있어요"가 뜨던 일이 있었습니다. */
  const staples = pantry.filter((x) => x.staple && !x.usedAt);
  const foods = pantry.filter((x) => !x.staple);
  const haveNow = foods.filter((x) => !x.usedAt);
  const hasStaple = (n) => (st.pantry || []).some((x) => x.name === n && x.staple && !x.usedAt);

  /* 양념은 탭 한 번으로 켜고 끕니다. 하나씩 적게 하면 아무도 안 넣습니다 */
  const toggleStaple = (n) => setSt((sv) => {
    const cur = sv.pantry || [];
    const i = cur.findIndex((x) => x.name === n && x.staple);
    if (i >= 0) return { ...sv, pantry: cur.filter((_, k) => k !== i) };
    return { ...sv, pantry: [{ id: uid("pt"), name: n, at: Date.now(), usedAt: null, staple: true }, ...cur] };
  });

  /* 양념이 떨어지면 없애는 게 아니라 살 것으로 보냅니다 */
  const ranOut = (x) => {
    setSt((sv) => ({ ...sv, pantry: (sv.pantry || []).filter((y) => y.id !== x.id) }));
    addTasks([{ title: x.name + " 구매", category: "food", status: "buy", note: "떨어졌어요" }]);
    say(`${x.name}을 살 것에 담았어요`);
  };

  const toPantry = (names) => setSt((sv) => {
    const cur = (sv.pantry || []).filter((x) => !x.usedAt || Date.now() - x.usedAt < 3 * DAY);
    const add = [];
    names.map(norm).filter(Boolean).forEach((n) => {
      const i = cur.findIndex((x) => x.name === n);
      /* 이미 있는 재료를 또 사면, 먹은 표시를 지우고 날짜만 갱신합니다 */
      if (i >= 0) cur[i] = { ...cur[i], at: Date.now(), usedAt: null };
      else if (!add.some((x) => x.name === n)) add.push({ id: uid("pt"), name: n, at: Date.now(), usedAt: null });
    });
    return { ...sv, pantry: [...add, ...cur] };
  });

  /* 살 것을 체크하면 산 것이니 재고로 넘어갑니다.
     다만 생리대·세제까지 "집에 있는 것"에 넣고 "먹었어요"를 묻는 건
     말이 안 됩니다. 먹는 것만 넘깁니다. */
  const buyDone = (t) => {
    if (!t.done && isFoodTask(t)) toPantry([t.title]);
    complete(t.id);
  };
  const eat = (x) => setSt((sv) => ({ ...sv,
    pantry: (sv.pantry || []).map((y) => y.id === x.id ? { ...y, usedAt: y.usedAt ? null : Date.now() } : y) }));
  const dropPantry = (x) => setSt((sv) => ({ ...sv, pantry: (sv.pantry || []).filter((y) => y.id !== x.id) }));

  /* 살 것에 직접 적기 */
  const addBuy = () => {
    const names = txt.split(/[,·]+/).map((x) => x.trim()).filter(Boolean);
    if (!names.length) return;
    addTasks(names.map((n) => ({ title: n + " 구매", category: isFoodName(n) ? "food" : "home", status: "buy", note: "" })));
    setTxt(""); say(`${names.length}개 적어뒀어요`);
  };

  /* 영수증 찍기 — 산 재료를 읽어 손질할 일과 식단 후보를 함께 냅니다.
     영수증은 "무엇을 샀는지"가 이미 적혀 있는 유일한 종이입니다. */
  const onReceipt = async (e) => {
    const f = (e.target.files || [])[0];
    if (!f) return;
    if (!spendAI("photo", 1)) return say("이번 달 사진 인식을 다 쓰셨어요");
    setBusy(true); setErr("");
    log("receipt_scan", {});
    try {
      const shot = await shrinkImage(f);
      const r = await askClaude(`한국 가정의 살림을 돕는 AI '${BRAND}'입니다. 장보기 영수증 사진입니다.
가구: ${householdLine(st)}

[사진] 영수증에서 **식재료만** 읽으세요.
- 상호·카드번호·금액·전화번호·주소는 절대 옮기지 마세요. 품목 이름만 봅니다.
- 생필품(휴지·세제 등)은 빼고 먹는 것만 고르세요.
- **할 일은 만들지 마세요.** 냉장고에 넣기·손질·밑간·요리는 살림하며 그냥 하는 일이고,
  까먹어서 손해가 나는 일이 아닙니다. 여기서는 산 것과 저녁 메뉴만 냅니다.
- meals에는 이 재료로 만들 수 있는 저녁 메뉴를 5~7개 제안하세요.
  need에는 이 영수증에 없어서 더 사야 할 재료만 넣고, 없으면 빈 배열로 두세요.

출력은 JSON 객체만: {"bought":["재료","재료"],"meals":[{"dish":"14자 이내","why":"20자 이내","need":[],"min":30}]}`, [shot]);
      const bought = Array.isArray(r && r.bought) ? r.bought.filter(Boolean).slice(0, 30) : [];

      const meals = Array.isArray(r && r.meals) ? r.meals.filter((x) => x && x.dish).slice(0, 8) : [];
      if (!bought.length && !meals.length) throw new Error("영수증에서 재료를 못 읽었어요");
      /* 영수증에서는 할 일을 만들지 않습니다.
         냉장고에 넣기·손질·요리는 살림하며 그냥 하는 일이지, 까먹어서 손해가 나는
         일이 아닙니다. 살펴둘 일 세 자리는 진짜 까먹는 것에만 씁니다.
         정기적으로 챙길 것(유통기한 훑기 등)은 정기 일정이 이미 맡고 있습니다. */
      setSt((sv) => ({ ...sv, meal: { at: Date.now(), items: meals, chosen: [], bought },
                       mealPast: [...(sv.mealPast || []), ...meals.map((x) => x.dish)].slice(-24) }));
      if (bought.length) toPantry(bought);
      say(`재료 ${bought.length}개를 읽고 식단 ${meals.length}개를 냈어요`);
    } catch (er) {
      refundAI("photo", 1);
      setErr(er && er.message ? er.message : "영수증을 못 읽었어요");
    }
    setBusy(false);
    if (fileRef.current) fileRef.current.value = "";
  };

  /* 고른 것만 남기고 나머지는 지웁니다 */
  const keepChosen = () => {
    if (!chosen.length) return say("남길 메뉴를 골라주세요");
    setSt((sv) => ({ ...sv, meal: { ...(sv.meal || {}), items: (sv.meal.items || []).filter((m) => chosen.indexOf(m.dish) >= 0) } }));
    log("meal_keep", { n: chosen.length });
    say(`${chosen.length}개만 남겼어요`);
  };

  /* 고른 메뉴의 재료를 살 것으로 — 이미 목록에 있는 건 다시 담지 않습니다 */
  const toBuy = () => {
    const need = [];
    items.forEach((m) => {
      if (!isOn(m.dish)) return;
      (m.need || []).forEach((n) => {
        const t = String(n).trim();
        if (!t) return;
        if (need.indexOf(t) >= 0) return;
        if (buys.indexOf(t) >= 0) return;
        need.push(t);
      });
    });
    if (!need.length) return say("담을 재료가 없어요. 이미 목록에 다 있습니다");
    addTasks(need.map((n) => ({ title: n + " 구매", category: "food", status: "buy", note: "이번 주 식단" })), "ai");
    log("meal_tobuy", { n: need.length });
    say(`재료 ${need.length}개를 살 것에 담았어요`);
    setTab("home");
  };

  return (
    <div style={{ "--ac": C.leaf }}>
      <div style={{ marginTop: 18, paddingLeft: 2 }}>
        <div className="disp" style={{ fontSize: 24, fontWeight: 600, letterSpacing: "-.03em" }}>장보기와 식단</div>
        <p style={{ fontSize: 13.5, color: C.ink2, marginTop: 9, lineHeight: 1.7 }}>
          뭘 사야 하는지와 뭘 먹을지는 <b style={{ color: C.ink }}>같은 고민</b>이라 한 화면에 뒀어요.
        </p>
      </div>

      {/* ① 살 것 — 사면 줄이 그어집니다 */}
      <Section eyebrow="CART" title={openBuys.length ? `살 것 ${openBuys.length}개` : "살 것"} right={boughtRows.length ? `산 것 ${boughtRows.length}개` : null}>
        <Card>
          {allBuys.length === 0 && (
            <div style={{ padding: "22px 16px", textAlign: "center", fontSize: 13, color: C.ink3, lineHeight: 1.75 }}>
              아직 비어 있어요.<br />아래에 적거나, 말하기에서 “휴지 사야 돼”라고 하시면 모입니다.
            </div>
          )}
          {buyGroups.map((g) => (
            <div key={g.key}>
              {g.label ? (
                <div style={{ padding: "10px 16px 7px", fontSize: 11.5, color: C.ink3, fontWeight: 600,
                              background: C.bg, borderBottom: `1px solid ${C.lineSoft}` }}>
                  {g.label} <span style={{ fontWeight: 400 }}>{g.items.filter((t) => !t.done).length}개</span>
                </div>
              ) : null}
              {g.items.map((t) => (
                <div key={t.id} className="flex items-center gap-3"
                  style={{ padding: "13px 16px", borderBottom: `1px solid ${C.lineSoft}`, opacity: t.done ? 0.45 : 1, transition: "opacity .4s ease" }}>
                  <button className="press" onClick={() => buyDone(t)} aria-label="샀어요"
                    style={{ width: 22, height: 22, borderRadius: 7, flexShrink: 0, border: `1.5px solid ${t.done ? C.leaf : C.line}`,
                             background: t.done ? C.leaf : "transparent", color: "#fff", fontSize: 12, lineHeight: "20px" }}>{t.done ? "✓" : ""}</button>
                  <span className="flex-1 min-w-0" style={{ fontSize: 14.5, fontWeight: 500, textDecoration: t.done ? "line-through" : "none", color: t.done ? C.ink3 : C.ink }}>
                    {t.title.replace(/\s*구매$/, "")}
                  </span>
                  {t.note ? <span style={{ fontSize: 11, color: C.ink3, whiteSpace: "nowrap" }}>{t.note}</span> : null}
                </div>
              ))}
            </div>
          ))}
          <div className="flex items-center gap-2" style={{ padding: "11px 12px", background: C.bg }}>
            <input className="hae" value={txt} onChange={(e) => setTxt(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") addBuy(); }} placeholder="휴지, 두부 — 쉼표로 여러 개"
              style={{ flex: 1, border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "10px 12px", fontSize: 13.5, background: C.card, color: C.ink }} />
            <button className="press" onClick={addBuy}
              style={{ background: C.leaf, color: "#fff", border: "none", borderRadius: R.sm, padding: "10px 14px", fontSize: 12.5, fontWeight: 600 }}>적기</button>
          </div>
        </Card>
        {openBuys.length > 0 && (
          <div className="flex gap-2" style={{ marginTop: 8 }}>
            <button className="press" onClick={copyList}
              style={{ flex: 1.3, background: C.ink, color: "#fff", border: "none", borderRadius: R.sm, padding: "11px 0", fontSize: 12.5, fontWeight: 600 }}>📋 목록 한꺼번에 복사</button>
            <button className="press" onClick={() => { log("partner_click", { name: "쿠팡", g: "buy", from: "살 것 목록" }); window.open("https://www.coupang.com/np/search?q=" + encodeURIComponent(openBuys[0].title.replace(/\s*구매$/, "")), "_blank", "noopener"); }}
              style={{ flex: 1, background: C.card, color: C.ink2, border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "11px 0", fontSize: 12.5 }}>쿠팡 열기</button>
          </div>
        )}
      </Section>

      {/* ② 재고 — 산 것은 여기 있고, 먹으면 줄이 그어집니다 */}
      <Section eyebrow="PANTRY" title={haveNow.length ? `집에 있는 것 ${haveNow.length}개` : "집에 있는 것"}
        right={haveNow.length ? "먹으면 눌러주세요" : null}>
        <Card>
          {foods.length === 0 ? (
            <div style={{ padding: "22px 16px", textAlign: "center", fontSize: 13, color: C.ink3, lineHeight: 1.75 }}>
아직 비어 있어요.<br />위에서 <b style={{ color: C.leaf }}>먹을 것에 체크</b>하거나 영수증을 찍으면 여기로 옵니다.<br />
              <span style={{ fontSize: 11.5 }}>생리대·세제 같은 건 여기 안 옵니다. 먹는 것만 모여요.</span>
            </div>
          ) : foods.map((x) => (
            <div key={x.id} className="flex items-center gap-3"
              style={{ padding: "13px 16px", borderBottom: `1px solid ${C.lineSoft}`, opacity: x.usedAt ? 0.45 : 1, transition: "opacity .4s ease" }}>
              <button className="press" onClick={() => eat(x)} aria-label={x.usedAt ? "안 먹었어요" : "먹었어요"}
                style={{ width: 22, height: 22, borderRadius: 7, flexShrink: 0, border: `1.5px solid ${x.usedAt ? C.leaf : C.line}`,
                         background: x.usedAt ? C.leaf : "transparent", color: "#fff", fontSize: 12, lineHeight: "20px" }}>{x.usedAt ? "✓" : ""}</button>
              <span className="flex-1 min-w-0" style={{ fontSize: 14.5, fontWeight: 500, textDecoration: x.usedAt ? "line-through" : "none", color: x.usedAt ? C.ink3 : C.ink }}>
                {x.name}
              </span>
              <span className="mono" style={{ fontSize: 10.5, color: C.ink3, whiteSpace: "nowrap" }}>
                {Math.max(0, Math.round((todayKey() - startOfDay(x.at)) / DAY))}일째
              </span>
              <button className="press" onClick={() => dropPantry(x)} aria-label="목록에서 빼기"
                style={{ background: "transparent", border: "none", padding: "0 2px", fontSize: 11, color: C.ink3, flexShrink: 0 }}>✕</button>
            </div>
          ))}
        </Card>
        {foods.some((x) => !x.usedAt) && (
          <div style={{ marginTop: 8, fontSize: 11.5, color: C.ink3, lineHeight: 1.7, paddingLeft: 3 }}>
            먹은 것은 줄이 그어지고 3일 뒤 목록에서 사라집니다. 잘못 눌렀으면 다시 누르면 돌아와요.
          </div>
        )}
      </Section>

      {/* 늘 두고 쓰는 것 — 이게 있어야 조합이 나옵니다 */}
      <Section eyebrow="STAPLES" title={staples.length ? `늘 있는 것 ${staples.length}개` : "늘 있는 것"}
        right="탭해서 켜고 끄세요">
        <Card>
          <div style={{ padding: "14px 15px" }}>
            <div style={{ fontSize: 12.5, color: C.ink2, lineHeight: 1.7, marginBottom: 11 }}>
              집에 <b style={{ color: C.ink }}>늘 두고 쓰는 것</b>을 켜두면 식단이 달라집니다.
              토마토소스가 있으면 파스타를, 김가루가 있으면 주먹밥을 내놓을 수 있어요.
            </div>
            <div className="flex flex-wrap gap-1.5">
              {STAPLES.map((n) => {
                const on = hasStaple(n);
                return (
                  <button key={n} className="press" onClick={() => toggleStaple(n)}
                    style={{ background: on ? C.leaf : C.bg, color: on ? "#fff" : C.ink2,
                             border: `1px solid ${on ? C.leaf : C.line}`, borderRadius: R.pill,
                             padding: "7px 12px", fontSize: 12.5, fontWeight: on ? 600 : 400 }}>{n}</button>
                );
              })}
            </div>
          </div>
          {staples.length > 0 && (
            <div style={{ borderTop: `1px solid ${C.lineSoft}`, padding: "12px 15px" }}>
              <div style={{ fontSize: 11.5, color: C.ink3, marginBottom: 8 }}>떨어진 게 있으면 눌러주세요. 살 것으로 넘어갑니다</div>
              <div className="flex flex-wrap gap-1.5">
                {staples.map((x) => (
                  <button key={x.id} className="press" onClick={() => ranOut(x)}
                    style={{ background: C.bg, color: C.ink2, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "7px 11px", fontSize: 12 }}>
                    {x.name} <span style={{ color: C.sun }}>떨어짐</span>
                  </button>
                ))}
              </div>
            </div>
          )}
        </Card>
        <div style={{ marginTop: 8 }}>
          <input className="hae" value={txt2} onChange={(e) => setTxt2(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") { const n = txt2.trim(); if (n && !hasStaple(n)) toggleStaple(n); setTxt2(""); } }}
            placeholder="목록에 없으면 직접 적고 Enter — 예: 트러플오일"
            style={{ width: "100%", border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "10px 12px", fontSize: 13, background: C.card, color: C.ink }} />
        </div>
      </Section>

      {/* ③ 영수증 — 산 것을 읽어 손질할 일과 식단을 함께 */}
      <input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={onReceipt} style={{ display: "none" }} />

/* ── 이달의 소식 ───────────────────────────────────

   0~2세는 육아종합지원센터, 5세는 처음학교로, 초등은 늘봄학교.
   부모가 그걸 알아서 찾아다닐 수는 없습니다.
   한 달에 한 번만 AI가 찾아서 정리해 둡니다. */

  const { st, setSt, cats, addTasks, say, log, setTab } = use();
  const news = st.news || null;
  const items = (news && news.items) || [];

  return (
    <>
      <PageHead onBack={() => setTab("home")} backLabel="오늘" />

          {news && news.month ? `${Number(news.month.slice(5))}월에 찾은 것이에요. ` : ""}
          우리 아이 나이에 <b style={{ color: C.ink }}>지금 해당되는 것</b>만 골랐습니다.
        </p>
      </div>

      {items.length === 0 && st.newsBusy && (
        <Card style={{ marginTop: 16 }}>
          <div style={{ padding: "34px 20px", textAlign: "center", fontSize: 13.5, color: C.ink2, lineHeight: 1.8 }}>

            <span style={{ fontSize: 11.5, color: C.ink3 }}>웹을 뒤져보느라 20초쯤 걸려요</span>
          </div>
        </Card>
      )}

      {items.length === 0 && !st.newsBusy && (
        <Card style={{ marginTop: 16 }}>
          <div style={{ padding: "26px 20px", textAlign: "center" }}>
            <div style={{ fontSize: 13.5, color: C.ink3, lineHeight: 1.8 }}>

            </div>
            {/* 빈 화면에서 되돌아갈 길이 없으면 고장 난 걸로 보입니다.

            <div style={{ marginTop: 16 }}>
              <Btn kind="ghost" onClick={() => { setSt((sv) => ({ ...sv, newsAsk: Date.now() })); setTab("home"); say("찾는 중이에요"); }}>

            </div>
          </div>
        </Card>
      )}

        const cat = cats.find((c) => c.id === n.category) || { emoji: "🗂", label: "기타" };

                  {n.kind === "private" ? "민간" : "공공"}

                <span className="mono" style={{ fontSize: 9.5, color: n.deadline ? C.sun : C.ink3 }}>

                <button className="press" onClick={() => {
                  addTasks([{ title: String(n.title).slice(0, 20), category: cat.id !== "기타" ? cat.id : "etc",
                    status: n.deadline ? "week" : "check", note: n.deadline ? `${n.deadline} 마감` : (n.who || ""), coverage: "new" }], "ai");
                  setSt((sv) => ({ ...sv, news: { ...(sv.news || {}), items: (sv.news.items || []).filter((x) => x !== n) } }));
                  log("news_add", { title: n.title });

                  <button className="press" onClick={() => { log("news_open", { title: n.title }); window.open(n.url, "_blank", "noopener"); }}
                    style={{ flex: 1, background: C.bg, color: C.ink2, border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "11px 0", fontSize: 12.5 }}>자세히 보기</button>

                  setSt((sv) => ({ ...sv, news: { ...(sv.news || {}), items: (sv.news.items || []).filter((x) => x !== n) } }));
                  log("news_skip", { title: n.title });
                }} style={{ background: "transparent", color: C.ink3, border: "none", padding: "11px 12px", fontSize: 12.5 }}>해당 없음</button>
              </div>
            </div>
          </Card>
        );
      })}

      <div style={{ marginTop: 16, background: C.mossSoft, borderRadius: R.sm, padding: "13px 15px", fontSize: 12.5, color: C.moss, lineHeight: 1.7 }}>
        아이 나이가 바뀌면 보는 곳도 바뀝니다. 0~2세는 육아종합지원센터,
        5세는 유치원 신청, 초등은 늘봄학교 — 매달 다시 찾습니다.
      </div>
    </>

}

    what: "자녀 요건을 채우면 승용차 한 대의 취득세를 감면받습니다.",
    who: "일정 나이 미만의 자녀 수로 봅니다.",
    where: "차를 등록할 때 구청·시청 세무과",
    miss: "차 살 때 그 자리에서 신청해야 합니다. 등록이 끝난 뒤에 알면 되돌리기 어렵습니다.",
  },
  W14: {
    what: "가족을 미리 등록해두면 기차 어른 운임을 할인받습니다.",
    who: "자녀 수와 나이 요건이 있습니다.",
    where: "코레일+ 앱에서 가족 등록 — 2026년 9월부터 KTX와 SRT를 한 앱에서 예매합니다",
    miss: "표를 살 때 등록하는 게 아니라 미리 해둬야 합니다. 명절에 알면 이미 늦습니다.",
  },
  W15: {
    what: "아이돌보미가 집에 와서 아이를 봐줍니다. 다자녀는 신청 순위가 앞으로 갑니다.",
    who: "소득에 따라 정부가 내주는 비율이 달라집니다.",
    where: "아이돌봄서비스 홈페이지 또는 주민센터",
    miss: "대기가 깁니다. 필요해진 다음에 신청하면 그때는 이미 못 씁니다.",

/* ── 유용정보 ─────────────────────────────────
   복지는 마감이 없습니다. 날짜를 붙이면 "시점 미정"만 쌓이고,
   할 일로 담으면 목록이 읽을 수 없게 길어집니다.
   여기서는 갈래별로 띄워두기만 합니다 — 해당되니 알아보세요, 까지입니다.

   흩어져 있던 것을 걷었습니다. 예전에는 같은 항목이 영역에도,
   타임라인에도, 맡기기에도 있었습니다. 이제 이 한 화면뿐입니다. */
function usefulItems(st) {
  const kids = st.children || [];
  /* 증여처럼 아예 해당 없는 집이 있습니다. 그런 항목이 계속 떠 있으면
     유용정보 전체가 "나랑 상관없는 것들"로 보입니다.
     그래서 항목마다 "필요 없어요"를 둡니다 — 다만 지우지는 않습니다.
     설정에서 언제든 되돌릴 수 있어야 합니다. 실수 한 번으로 영영
     못 보게 되면, 그 다음부터는 아무 버튼도 못 누릅니다. */
  const off = st.wfOff || {};
  const fits = (sd) => {
    if (!sd.wf) return false;
    if (sd.f && !st.flags[sd.f]) return false;
    if (sd.nkid && kids.length < sd.nkid) return false;
    if (sd.kid) {
      const w = sd.w || [0, 9999];
      if (!kids.some((ch) => { const m = childMonths(ch); return m >= w[0] && m <= w[1]; })) return false;
    }
    return true;
  };
  const out = SEED.filter((sd) => fits(sd) && !off[sd.id]).map((sd) => ({
    key: sd.id, cat: sd.cat, title: sd.t, g: sd.g, chg: sd.chg,
    ...(WELFARE_DETAIL[sd.id] || {}),
  }));
  /* 날짜를 아는 것에서 역산 — 경조사에 넣어둔 생일·기념일이 재료입니다.
     여기서 뜨는 이유는 날짜를 알려드리려는 게 아니라,
     그 준비를 언제 시작해야 싼지를 알려드리려는 것입니다. */
  const names = kids.map((c) => String(c.name || "").trim()).filter(Boolean);
  (st.customRoutines || []).forEach((cr) => {
    if (!cr || cr.category !== "event") return;
    const cfg = (st.routines || {})[`c:${cr.id}`] || {};
    if (!cfg.anchor) return;
    const at = nextFromAnchor(cfg.anchor, 0);
    if (!at) return;
    const left = Math.round((at - todayKey()) / DAY);
    DATED.forEach((d) => {
      if (!d.match.test(cr.title || "")) return;
      /* 돌잔치를 남편 생일에 권하면 안 됩니다 */
      if (d.kidOnly && !names.some((n) => (cr.title || "").indexOf(n) >= 0)) return;
      /* 창을 두지 않으면 반년 내내 같은 카드가 붙어 있습니다 */
      if (left > d.days || left <= d.days - 30) return;
      if (off[`${d.id}:${cr.id}`]) return;
      out.push({
        key: `${d.id}:${cr.id}`, cat: d.cat, dated: 1,
        title: `${cr.title} — ${d.t}`, what: d.why,
        use: `${anchorLabel(cfg.anchor)}까지 ${left}일 남았어요`,
        tip: d.tip, buy: d.buy,
      });
    });
  });
  /* 미리 사두기 — 달력 월로 뜹니다.
     아이가 없으면 원 행사도 없어서 하나도 안 뜹니다. */
  const mon = new Date().getMonth() + 1;
  const yr = new Date().getFullYear();
  /* 2월에 한복을 챙겼으면 7월에 "추석 한복 사이즈 점검"이 또 뜨면 안 됩니다.
     같은 물건을 두 번 사라고 하는 셈입니다. 그래서 같은 묶음(g)은
     올해 한 번 "챙겼어요"를 누르면 그 해 동안 통째로 내려갑니다. */
  const done = st.aheadDone || {};
  AHEAD.forEach((a) => {
    if (a.mo && a.mo.indexOf(mon) < 0) return;
    if (off[a.id]) return;
    if (a.g && done[a.g] === yr) return;
    if (a.w) {
      const w = a.w;
      if (!kids.some((ch) => { const m = childMonths(ch); return m >= w[0] && m <= w[1]; })) return;
    }
    out.push({
      key: a.id, cat: a.cat, title: a.t, what: a.why,
      use: a.use, risk: a.risk, tip: a.tip, ask: a.ask, buy: a.buy, g2: a.g, ahead: 1,
    });
  });
  /* 달마다 AI가 찾아온 것도 같은 목록에 섞습니다.
     "이달의 소식"이라고 따로 붙이면 자리가 또 하나 늘어납니다. */
  ((st.news || {}).items || []).forEach((n, i) => {
    if (!n || !n.title) return;
    if (off[`n${i}`]) return;
    out.push({ key: `n${i}`, cat: n.category || "etc", title: n.title, what: n.body,
      where: n.src || "", fresh: 1, url: n.url || "" });
  });
  return out;
}

/* ④ 사기 전에 순서를 제안합니다.
   이 앱이 쇼핑앱과 갈라지는 지점입니다. "안 사도 되는 걸 안 사게 해준다"가
   사람들이 이 앱을 믿는 이유고, 그걸 깨면 남을 이유가 없어집니다.
   그래서 구매는 맨 아래에 둡니다.

   외동은 "물려받기" 칸이 비어 있습니다. 형제가 없으니까요.
   그 집에는 대여와 당근이 더 중요합니다. */
function BuyOrder({ text }) {
  const { st } = use();
  const solo = (st.children || []).length < 2;
  const near = String((st && st.region) || "").trim();
  const q = encodeURIComponent(String(text || "").replace(/ 미리 보기| 최종 점검|·.*$/g, "").slice(0, 20));
  const steps = [
    { t: "집에 있는지 먼저 보기", d: "작년 것이 그대로 있는 경우가 많습니다" },
    !solo && { t: "형제에게 물려받기", d: "위 아이가 쓰던 것부터" },
    { t: "당근에서 찾기", d: "철 지난 것이 싸게 나옵니다",
      u: `https://www.daangn.com/search/${q}` },
    { t: "빌릴 수 있는지 보기", d: solo ? "형제가 없으면 여기가 제일 낫습니다" : "한두 번 쓰는 것은 빌리는 게 낫습니다",
      u: `https://map.naver.com/p/search/${encodeURIComponent((near ? near + " " : "") + "육아종합지원센터")}` },
    { t: "그래도 없으면 사기", d: "여기까지 왔으면 사셔도 됩니다" },
  ].filter(Boolean);
  return (
    <div style={{ marginTop: 13 }}>
      <div className="mono" style={{ fontSize: 9.5, color: C.moss, marginBottom: 8 }}>사기 전에</div>
      {steps.map((x, i) => (
        <div key={i} style={{ display: "flex", gap: 10, alignItems: "baseline", marginBottom: 7 }}>
          <span className="mono" style={{ fontSize: 10, color: C.ink3, flex: "none", width: 14 }}>{i + 1}</span>
          <div style={{ flex: 1, minWidth: 0 }}>
            {x.u ? (
              <a className="press" href={x.u} target="_blank" rel="noopener noreferrer"
                style={{ fontSize: 13.5, color: C.ink, textDecoration: "none", borderBottom: `1px solid ${C.line}` }}>
                {x.t} ›
              </a>
            ) : (
              <span style={{ fontSize: 13.5, color: C.ink }}>{x.t}</span>
            )}
            <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 2, lineHeight: 1.6 }}>{x.d}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

function Useful() {
  const { st, setSt, cats, setTab, say } = use();
  const [open, setOpen] = useState(null);
  const items = useMemo(() => usefulItems(st), [st.flags, st.children, st.news]);
  /* 유용정보는 유료입니다. 몰라서 못 받는 걸 찾아다 주는 것이 이 앱이 파는 것이고,
     그 값을 안 받으면 서버비도 AI값도 못 냅니다.
     다만 잠그기만 하면 무료 사용자는 여기에 뭐가 있는지도 모릅니다.
     그래서 제목은 다 보이고, 한 개는 열어둡니다 — 값어치를 보고 정하시게. */
  const opened = !CHARGING() || st.plan === "paid";
  /* 열어두는 한 개는 "바뀐 것"을 먼저 고릅니다. 기준이 내려와서 이제 되는 것 —
     그게 이 화면이 하는 일을 가장 잘 보여줍니다. */
  const freeKey = useMemo(() => {
    const chg = items.find((x) => x.chg);
    return (chg || items[0] || {}).key;
  }, [items]);
  const groups = useMemo(() => {
    const by = {};
    items.forEach((it) => { (by[it.cat] = by[it.cat] || []).push(it); });
    /* 바뀐 것이 먼저입니다. 한 번 "안 된다"고 들은 사람은 다시 안 알아봅니다 —
       그 사이에 기준이 바뀐 걸 아무도 알려주지 않습니다.
       "이제 된대요"를 알려주는 것만으로 이 화면은 값을 합니다. */
    const rank = (x) => (x.chg ? 0 : x.dated ? 1 : x.ahead ? 2 : x.fresh ? 3 : 4);
    Object.keys(by).forEach((id) => by[id].sort((a, b) => rank(a) - rank(b)));
    const hasChg = (g) => (g.some((x) => x.chg) ? 0 : g.some((x) => x.ahead || x.dated) ? 1 : 2);
    return Object.keys(by).map((id) => ({
      cat: (cats || []).find((c) => c.id === id) || { id, emoji: "🗂", label: "기타" },
      list: by[id],
    })).sort((a, b) => hasChg(a.list) - hasChg(b.list) || b.list.length - a.list.length);
  }, [items, cats]);

  const read = (k) => {
    if (open === k) return setOpen(null);
    if (!opened && k !== freeKey) {
      /* 잠긴 걸 눌렀을 때 아무 일도 안 일어나면 고장으로 보입니다.
         왜 안 열리는지는 말해줘야 합니다. */
      say("유료에서 열립니다");
      return setOpen(k);
    }
    setOpen(k);
    setSt((sv) => ({ ...sv, wfRead: (Number(sv.wfRead) || 0) + 1 }));
  };

  return (
    <>
      <div style={{ marginTop: 18, paddingLeft: 2 }}>
        <div className="disp" style={{ fontSize: 24, fontWeight: 600, letterSpacing: "-.03em" }}>유용정보</div>
        <p style={{ fontSize: 13.5, color: C.ink2, marginTop: 9, lineHeight: 1.7 }}>
          몰라서 못 받는 것, 그리고 <b style={{ color: C.ink }}>지금 사두면 나중보다 싼 것</b>을 띄워둡니다.
          우리 집에 해당되는 것만 나옵니다.
          <b style={{ color: C.persim }}> 바뀐 것</b>은 기준이 내려와서 이제 되는 거예요 —
          예전에 안 된다고 들으셨어도 다시 보세요.
          <b style={{ color: C.moss }}> 지금이 싸요</b>는 행사가 코앞이라서가 아니라,
          지금이 값이 제일 내려간 때라서 띄운 거예요.
        </p>
        {!CHARGING() ? (
          <p style={{ fontSize: 12, color: C.ink3, marginTop: 7, lineHeight: 1.7 }}>
            {PHASE === "beta" ? "베타 동안에는 다 열려 있어요." : "지금은 전부 무료로 열려 있어요."}
          </p>
        ) : st.plan !== "paid" ? (
          <p style={{ fontSize: 12, color: C.ink3, marginTop: 7, lineHeight: 1.7 }}>
            무료에서는 한 개만 열려 있어요. 나머지는 제목만 보입니다.
          </p>
        ) : null}
      </div>

      {groups.map((g) => (
        <Section key={g.cat.id} eyebrow="" title={`${g.cat.emoji} ${g.cat.label}`} right={`${g.list.length}개`}>
          <Card>
            {g.list.map((it, i) => {
              const on = open === it.key;
              return (
                <div key={it.key} style={{ borderBottom: i === g.list.length - 1 ? "none" : `1px solid ${C.line}` }}>
                  <button className="press w-full text-left" onClick={() => read(it.key)}
                    style={{ background: "transparent", border: "none", padding: "14px 16px", display: "block" }}>
                    <div className="flex items-baseline gap-2">
                      <span style={{ flex: 1, minWidth: 0, fontSize: 14.5, fontWeight: 500 }}>{it.title}</span>
                      {it.chg ? <span className="mono" style={{ fontSize: 9, color: C.persim, background: C.persimSoft, borderRadius: 999, padding: "2px 7px" }}>바뀐 것</span>
                        : it.ahead || it.dated ? <span className="mono" style={{ fontSize: 9, color: C.moss, background: C.mossSoft, borderRadius: 999, padding: "2px 7px" }}>지금이 싸요</span>
                        : it.fresh ? <span className="mono" style={{ fontSize: 9, color: C.moss }}>이번 달</span> : null}
                      <span style={{ fontSize: 11, color: C.ink3 }}>
                        {!opened && it.key !== freeKey ? "잠김" : on ? "접기" : "보기"}
                      </span>
                    </div>
                    {!on && it.what && (
                      <div style={{ fontSize: 12, color: C.ink3, marginTop: 5, overflow: "hidden",
                        textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{it.what}</div>
                    )}
                  </button>
                  {on && !opened && it.key !== freeKey && (
                    <div style={{ padding: "0 16px 16px" }}>
                      <div style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: 12, padding: "13px 15px" }}>
                        <div style={{ fontSize: 13, color: C.ink2, lineHeight: 1.8 }}>
                          유료에서 열립니다. 무엇인지, 어디서 신청하는지, 왜 놓치는지가 들어 있습니다.
                        </div>
                        <button className="press" onClick={() => setTab("set")}
                          style={{ marginTop: 11, background: C.moss, color: "#fff", border: "none",
                            borderRadius: 999, padding: "9px 16px", fontSize: 12.5 }}>
                          유료로 열기
                        </button>
                      </div>
                    </div>
                  )}
                  {on && (opened || it.key === freeKey) && (
                    <div style={{ padding: "0 16px 16px" }}>
                      {it.what && <div className="hae" style={{ fontSize: 13.5, color: C.ink, lineHeight: 1.8 }}>{it.what}</div>}
                      {it.who && <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 9, lineHeight: 1.7 }}>
                        <span className="mono" style={{ fontSize: 9.5, color: C.moss, marginRight: 7 }}>누가</span>{it.who}</div>}
                      {it.where && <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 5, lineHeight: 1.7 }}>
                        <span className="mono" style={{ fontSize: 9.5, color: C.moss, marginRight: 7 }}>어디에</span>{it.where}</div>}
                      {it.miss && (
                        <div style={{ marginTop: 11, background: C.persimSoft, borderRadius: 12, padding: "11px 13px" }}>
                          <div className="mono" style={{ fontSize: 9.5, color: C.persim }}>놓치는 이유</div>
                          <div style={{ fontSize: 12.5, color: C.ink, marginTop: 5, lineHeight: 1.75 }}>{it.miss}</div>
                        </div>
                      )}
                      {it.use && <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 9, lineHeight: 1.7 }}>
                        <span className="mono" style={{ fontSize: 9.5, color: C.moss, marginRight: 7 }}>언제 쓰나</span>{it.use}</div>}
                      {/* 사이즈 위험은 빠뜨리면 안 됩니다. 앱이 시켜서 산 옷이 안 맞으면 그 앱은 지워집니다 */}
                      {it.risk && (
                        <div style={{ marginTop: 11, background: C.persimSoft, borderRadius: 12, padding: "11px 13px" }}>
                          <div className="mono" style={{ fontSize: 9.5, color: C.persim }}>사이즈</div>
                          <div style={{ fontSize: 12.5, color: C.ink, marginTop: 5, lineHeight: 1.75 }}>{RISK_LINE[it.risk]}</div>
                        </div>
                      )}
                      {it.tip && <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 9, lineHeight: 1.7 }}>
                        <span className="mono" style={{ fontSize: 9.5, color: C.moss, marginRight: 7 }}>참고</span>{it.tip}</div>}
                      {/* ② 2단계 — 앱은 날짜를 모릅니다. 아는 사람은 알림장을 받은 분입니다.
                             찍어서 넣으면 3단계로 넘어가 날짜와 준비물이 생깁니다. */}
                      {it.ask && (
                        <div style={{ marginTop: 12, background: C.bg, border: `1px solid ${C.line}`,
                          borderRadius: 12, padding: "12px 14px" }}>
                          <div style={{ fontSize: 12.5, color: C.ink, lineHeight: 1.75 }}>{it.ask}</div>
                          <button className="press" onClick={() => { setTab("speak"); say("찍어서 넣으면 날짜까지 정리합니다"); }}
                            style={{ marginTop: 9, background: "transparent", border: `1px solid ${C.line}`,
                              borderRadius: 999, padding: "7px 13px", fontSize: 12, color: C.ink2 }}>
                            가정통신문 찍기
                          </button>
                        </div>
                      )}
                      {it.buy ? <BuyOrder text={it.title} /> : null}
                      {/* 챙긴 걸 말해두면 같은 묶음이 그 해 동안 안 뜹니다 —
                          2월에 한복을 마련했으면 7월 점검은 필요 없습니다 */}
                      <div className="flex gap-1.5" style={{ marginTop: 13, flexWrap: "wrap" }}>
                        {/* 챙긴 걸 말해두면 같은 묶음이 그 해 동안 안 뜹니다 —
                            2월에 한복을 마련했으면 7월 점검은 필요 없습니다 */}
                        {it.g2 && (
                          <button className="press" onClick={() => {
                            setSt((sv) => ({ ...sv, aheadDone: { ...(sv.aheadDone || {}), [it.g2]: new Date().getFullYear() } }));
                            setOpen(null);
                            say(`${it.g2}은 올해 안 띄웁니다`);
                          }}
                            style={{ background: "transparent", border: `1px solid ${C.line}`,
                              borderRadius: 999, padding: "8px 14px", fontSize: 12.5, color: C.ink3 }}>
                            올해 챙김
                          </button>
                        )}
                        {/* 증여처럼 아예 해당 없는 집이 있습니다.
                            지우는 게 아니라 접어두는 것이고, 설정에서 되돌립니다. */}
                        <button className="press" onClick={() => {
                          setSt((sv) => ({ ...sv, wfOff: { ...(sv.wfOff || {}), [it.key]: Date.now() } }));
                          setOpen(null);
                          say("접었어요. 설정에서 다시 꺼냅니다");
                        }}
                          style={{ background: "transparent", border: `1px solid ${C.line}`,
                            borderRadius: 999, padding: "8px 14px", fontSize: 12.5, color: C.ink3 }}>
                          해당 없음
                        </button>
                      </div>
                      {it.url ? (
                        <a className="press" href={it.url} target="_blank" rel="noopener noreferrer"
                          style={{ display: "inline-block", marginTop: 11, background: C.bg, border: `1px solid ${C.line}`,
                            borderRadius: 999, padding: "8px 14px", fontSize: 12.5, color: C.ink2, textDecoration: "none" }}>
                          안내 보기 ›
                        </a>
                      ) : null}
                      {it.g ? <div style={{ marginTop: 11 }}><LinkCards group={it.g} text={it.title} compact noAd /></div> : null}
                      <div style={{ marginTop: 11, fontSize: 11.5, color: C.ink3, lineHeight: 1.7 }}>
                        받을 수 있는지는 기관이 정합니다. 여기서는 있다는 것만 알립니다.
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </Card>
        </Section>
      ))}

      {/* 달마다 새로 찾아오는 것 — 버튼 하나로 끝냅니다 */}
      <div style={{ marginTop: 18 }}>
        <Btn kind="ghost" onClick={() => { setSt((sv) => ({ ...sv, newsAsk: Date.now() })); setTab("home"); }}>
          이번 달 새로 나온 것 찾아보기
        </Btn>
        <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 9, lineHeight: 1.7, textAlign: "center" }}>
          {st.newsBusy ? "찾는 중이에요… 웹을 뒤져보느라 20초쯤 걸려요"
            : "한 달에 한 번, 이 집에 해당하는 행정·지원 정보를 찾아 위 목록에 넣습니다."}
        </div>
        {/* 토스트는 2.3초 만에 사라져서 계속 놓치고 있었습니다.
            왜 안 됐는지는 화면에 남아 있어야 합니다. */}
        {st.newsErr && !st.newsBusy && (
          <div style={{ marginTop: 11, background: C.persimSoft, borderRadius: 12, padding: "12px 14px" }}>
            <div className="mono" style={{ fontSize: 9.5, color: C.persim }}>지난번에 안 된 이유</div>
            <div style={{ fontSize: 12.5, color: C.ink, marginTop: 5, lineHeight: 1.75 }}>{st.newsErr}</div>
          </div>
        )}
      </div>
    </>
  );
}
