/* ══════════ 앱 ══════════ */
/* ── 새 버전이 나왔는지 스스로 봅니다 ──────────────
   홈 화면에 추가한 앱은 시작 화면을 아주 오래 들고 있습니다.
   실제로 폰이 0831-y에 굳어 있는 동안 서버는 0901-g였습니다.
   그러면 이미 고친 것을 다시 신고하게 되고, 베타에서 그건 시간 낭비입니다.

   그래서 화면을 다시 볼 때마다 version.json을 캐시 없이 읽어
   지금 돌고 있는 판과 다르면 위에 한 줄을 띄웁니다.
   새로고침은 사용자가 누릅니다 — 쓰던 걸 앱이 마음대로 끊지 않습니다. */
function useNewBuild() {
  const [newer, setNewer] = useState("");
  const last = useRef(0);
  useEffect(() => {
    const look = async () => {
      if (document.hidden) return;
      if (Date.now() - last.current < 60000) return;   /* 1분에 한 번이면 충분합니다 */
      last.current = Date.now();
      try {
        const r = await fetch(`/version.json?t=${Date.now()}`, { cache: "no-store" });
        if (!r.ok) return;
        const v = await r.json();
        if (v && v.build && v.build !== BUILD) setNewer(v.build);
      } catch {}
    };
    look();
    document.addEventListener("visibilitychange", look);
    window.addEventListener("focus", look);
    return () => {
      document.removeEventListener("visibilitychange", look);
      window.removeEventListener("focus", look);
    };
  }, []);
  return newer;
}

function NewBuildBar({ build }) {
  if (!build) return null;
  return (
    <div style={{ position: "sticky", top: 0, zIndex: 60, background: C.moss, color: "#fff",
      padding: "10px 16px", display: "flex", alignItems: "center", gap: 12 }}>
      <span style={{ flex: 1, minWidth: 0, fontSize: 13, lineHeight: 1.5 }}>
        새 버전이 있습니다 <span className="mono" style={{ opacity: .8, fontSize: 11 }}>{BUILD} → {build}</span>
      </span>
      {/* location.reload() 로는 아이폰 홈 화면 앱이 옛 화면을 그대로 내줍니다.
          주소에 시각을 붙여야 새로 받아옵니다. 설정의 "최신으로 받기"와 같은 방법입니다. */}
      <button className="press" onClick={() => { window.location.href = window.location.pathname + "?v=" + Date.now(); }}
        style={{ flex: "none", background: "#fff", color: C.moss, border: "none",
          borderRadius: 999, padding: "7px 14px", fontSize: 12.5, fontWeight: 600 }}>
        새로 받기
      </button>
    </div>
  );
}

function App() {
  const [st, setSt] = useState(DEFAULT_STATE);
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState("home");
  const [me, setMe] = useState(window.__ME || "m1");
  const [toast, setToast] = useState(null);
  const [openCat, setOpenCat] = useState(null);
  const newBuild = useNewBuild();
  const first = useRef(true);
  /* 가족이 고친 걸 받아 화면에 넣을 때, 그걸 다시 저장하지 않도록 한 번 건너뜁니다 */
  const skipSave = useRef(false);

  /* ── 나갈 말을 미리 구워둡니다 ──────────────────────
     서버(api/voice-send)는 이걸 읽어서 그대로 보냅니다.
     서버가 문장을 다시 만들면 부모가 미리보기에서 본 것과 달라질 수 있고,
     그러면 "내가 본 게 안 나갔다"가 됩니다.

     계획·그날 것·전화 설정이 바뀔 때만 다시 굽습니다.
     매번 구우면 저장이 계속 돌아 동기화가 시끄러워집니다. */
  const outboxKey = JSON.stringify([
    st.callOn, st.callMax, st.callAt, st.callMorning,
    st.callPlan, st.callToday, (st.elders || [])[0], (st.children || []).map((k) => [k.id, k.name]),
  ]);
  useEffect(() => {
    if (!ready) return;
    const next = bakeOutbox(st);
    if (JSON.stringify(next) === JSON.stringify(st.callOutbox || {})) return;
    setSt((sv) => ({ ...sv, callOutbox: next }));
  }, [outboxKey, ready]);

  useEffect(() => {
    (async () => {
      /* 저장 키는 앞으로 고정. 옛 버전 키가 남아 있으면 옮겨온다 */
      const KEYS = ["meonjeon", "meonjeon:v7", "household:v6", "household:v5"];
      for (const k of KEYS) {
        try {
          const r = await window.storage.get(k);
          if (r) {
            const loaded = cleanupPerishable(dropAnniversaries(dedupeRoutines({ ...DEFAULT_STATE, ...JSON.parse(r.value) })));
            /* 한 번 열 때 한 번만 셉니다 */
            setSt({ ...loaded, opens: (Number(loaded.opens) || 0) + 1 });
            break;
          }
        } catch {}
      }
      setReady(true);
    })();
  }, []);
  useEffect(() => {
    if (!ready) return;
    if (first.current) { first.current = false; return; }
    if (skipSave.current) { skipSave.current = false; return; }
    const t = setTimeout(() => { window.storage.set("meonjeon", JSON.stringify(st)).catch(() => {}); }, 500);
    return () => clearTimeout(t);
  }, [st, ready]);

  /* 알림 서버는 씨앗 목록을 모릅니다. 루틴 제목만 따로 적어둡니다 —
     이게 없으면 "개 산책"처럼 매일 하는 일이 알림에서 통째로 빠집니다. */
  useEffect(() => {
    if (!ready) return;
    const map = {};
    eligibleRoutines(st).forEach((r) => {
      const cfg = st.routines[r.key];
      if (cfg && cfg.on !== false) map[r.key] = r.seed.t + (r.child ? ` (${r.child.name})` : "");
    });
    setSt((sv) => (JSON.stringify(sv.routineTitles || {}) === JSON.stringify(map) ? sv : { ...sv, routineTitles: map }));
  }, [ready, st.routines, st.children, st.flags, st.petTypes, st.cars, st.customRoutines]);

  /* 유용정보(복지·미리 사두기)는 지금까지 앱을 열어야만 보였습니다.
     그런데 이 앱은 "안 열어도 알려주는 것"이 값입니다 — 안 열면 0이 됩니다.
     알림 서버는 씨앗을 모르므로, 앱이 열릴 때 아직 안 본 것들을 줄로 적어둡니다.
     서버는 날짜로 그중 하나만 꺼내 하루 한 줄씩 붙입니다.
     한꺼번에 스무 개를 보내면 그건 알림이 아니라 광고입니다. */
  useEffect(() => {
    if (!ready) return;
    const q = usefulItems(st)
      .filter((it) => !it.fresh)                 /* 이달의 소식은 이미 따로 뜹니다 */
      .slice(0, 40)
      .map((it) => ({ t: String(it.title || "").slice(0, 28), w: String(it.what || "").slice(0, 60) }))
      .filter((x) => x.t);
    setSt((sv) => (JSON.stringify(sv.dailyQueue || []) === JSON.stringify(q) ? sv : { ...sv, dailyQueue: q }));
  }, [ready, st.wfOff, st.aheadDone, st.children, st.flags, st.petTypes, st.news]);

  /* 가족이 다른 기기에서 고치면 여기로 들어옵니다.
     "새로고침" 버튼을 누르게 하지 않고 화면에 바로 반영합니다 */
  useEffect(() => {
    window.__applyRemote = (remote) => {
      if (!remote || !Object.keys(remote).length) return;
      skipSave.current = true;
      setSt((sv) => (JSON.stringify(sv) === JSON.stringify({ ...DEFAULT_STATE, ...remote }) ? sv : { ...DEFAULT_STATE, ...remote }));
    };
    return () => { delete window.__applyRemote; };
  }, []);

  const log = (name, props) => setSt((s) => ({ ...s, events: [...s.events.slice(-1200), { name, props, ts: Date.now() }] }));
  /* CalButtons가 Ctx 밖에서도 셀 수 있게 연결해 둡니다 */
  log2 = log;
  const say = (m) => { setToast(m); setTimeout(() => setToast(null), 2300); };
  /* AI를 한 번 씁니다. 상한에 닿으면 세지 않고 false를 돌려줘요 */
  const spendAI = (kind, n = 1) => {
    if (leftOf(st, kind) < n) return false;
    setSt((sv) => {
      const cur = (sv.aiUsage || {}).month === usageMonth() ? sv.aiUsage : { month: usageMonth(), talk: 0, photo: 0, find: 0 };
      return { ...sv, aiUsage: { ...cur, month: usageMonth(), [kind]: (cur[kind] || 0) + n } };
    });
    return true;
  };
  /* 실패한 호출은 돌려줍니다. AI가 답을 못 준 것까지 사용자 몫에서 깎으면 안 됩니다 */
  const refundAI = (kind, n = 1) => setSt((sv) => {
    const cur = (sv.aiUsage || {}).month === usageMonth() ? sv.aiUsage : null;
    if (!cur) return sv;
    return { ...sv, aiUsage: { ...cur, [kind]: Math.max((cur[kind] || 0) - n, 0) } };
  });
  const cats = useMemo(() => [
    ...st.children.map((ch) => ({ id: `kid:${ch.id}`, emoji: "🧒", label: `${ch.name}(${childLabel(ch)})`, child: ch })),
    ...BASE_CATS.filter((c) => c.need(st.flags, st.children)),
    ...(st.customCats || []),
  ], [st.children, st.flags, st.customCats]);

  /* 말씀하신 원문에는 아이 이름·학교·병원이 섞입니다. 그건 남기지 않습니다.
     대신 AI가 정리해낸 제목만 남깁니다 — "테니스 라켓 구매"는 개인정보가
     아니면서 "테니스 수요가 있다"를 알려줍니다. 시드를 어디로 넓힐지
     추측이 아니라 데이터로 정하기 위한 최소한의 기록입니다. */
  /* 예전에는 AI가 만든 할 일의 제목을 그대로 기록에 남겼습니다.
     그런데 사용자가 그 할 일을 지워도 기록에는 남아 있었습니다.
     "약 떨어지기 전에 알림"처럼 말로 넣은 것에 약 이름이 섞이면
     지웠는데도 남는 셈입니다. 지운 건 지워져야 합니다.
     몇 개를 어느 영역에 만들었는지만 셉니다 — 그거면 충분합니다. */
  const logTitles = (rows, how) => {
    if (!rows.length) return;
    const byCat = {};
    rows.forEach((r) => { const c = r.category || "etc"; byCat[c] = (byCat[c] || 0) + 1; });
    log("ai_titles", { how, n: rows.length, cats: byCat });
  };

  const addTasks = (items, raisedBy) => {
    const rows = items.map((it) => ({
      id: uid("t"), title: it.title, category: it.category, status: it.status || "week", note: it.note || "",
      raisedBy: raisedBy || me, owner: it.owner || (st.duty || {})[it.category] || null,
      done: false, seedId: it.seedId || null, withKids: it.withKids || null,
      eventAt: it.eventAt || null, lead: it.lead != null ? it.lead : null,
      dueAt: it.eventAt ? dueFromEvent(it.eventAt, it.lead != null ? it.lead : 1) : (it.dueAt || defaultDue(it.status || "week")),
      coverage: it.coverage || "new", createdAt: Date.now(),
    }));
    setSt((s) => ({ ...s, tasks: [...rows, ...s.tasks] }));
    log("task_create", { n: rows.length });
    if (raisedBy === "ai") logTitles(rows, "ai");
    return rows.length;
  };

  const complete = (id) => setSt((s) => ({ ...s, tasks: s.tasks.map((t) => t.id === id ? { ...t, done: !t.done, doneBy: !t.done ? me : undefined, doneAt: !t.done ? Date.now() : undefined } : t) }));
  const assign = (id, owner) => setSt((s) => ({ ...s, tasks: s.tasks.map((t) => t.id === id ? { ...t, owner } : t) }));
  const setPref = (key, val) => setSt((s) => ({ ...s, prefs: { ...s.prefs, [key]: { ...(s.prefs[key] || {}), ...val } } }));
  const setRoutine = (key, val) => setSt((s) => ({ ...s, routines: { ...s.routines, [key]: { ...(s.routines[key] || {}), ...val } } }));

  /* 반복 업무 처리 — 완료·미룸·건너뜀 모두 정상 처리 */
  const routineAction = (key, cfg, action) => {
    const days = cfg.cycle || 30;
    const patterned = dowList(cfg).length > 0 || domList(cfg).length > 0;
    let next, lunarPatch = null;
    if (cfg.anchor && cfg.lunar) {
      const lead = cfg.leadDays != null ? cfg.leadDays : 7;
      const thisEvt = nextAnchorAfter(cfg.anchor, 0, todayKey() - 1);
      const exact = cfg.lunarMD ? nextLunarSolarAfter(cfg.lunarMD, Math.max(thisEvt, todayKey())) : null;
      const evtNext = exact != null ? exact : thisEvt + 354 * DAY;
      const nd = new Date(evtNext);
      const newAnchor = `${String(nd.getMonth() + 1).padStart(2, "0")}-${String(nd.getDate()).padStart(2, "0")}`;
      next = evtNext - lead * DAY;
      lunarPatch = { anchor: newAnchor, estimated: exact == null || undefined };
    } else {
      next = cfg.anchor ? nextAnchorAfter(cfg.anchor, cfg.leadDays != null ? cfg.leadDays : 7, todayKey())
        : patterned ? nextByPattern(cfg) : todayKey() + days * DAY;
    }
    if (action === "done") { setRoutine(key, { ...(lunarPatch || {}), nextAt: next, lastAt: Date.now(), doneBy: me, streak: (cfg.streak || 0) + 1 }); say(cfg.lunar ? "해두셨네요. 내년 양력 날짜로 다시 잡아뒀어요" : "해두셨네요"); }
    if (action === "later") { setRoutine(key, { nextAt: Date.now() + DAY }); say("내일 다시 올립니다"); }
    if (action === "skip") { setRoutine(key, { ...(lunarPatch || {}), nextAt: next }); say("이번 회차는 건너뛸게요"); }
    /* 오늘 완료 취소 — 다시 오늘 할 일로 되돌립니다 */
    if (action === "undo") { setRoutine(key, { nextAt: todayKey(), lastAt: null, doneBy: null, streak: Math.max((cfg.streak || 1) - 1, 0) }); say("되돌렸어요"); }
    log("routine_" + action, { key });
  };

  /* 공유로 들어온 글은 말하기 화면으로 넘겨 바로 정리합니다.
     한 번만 합니다 — 화면을 다시 그릴 때마다 또 넣으면 같은 글이 쌓입니다. */
  const sharedUsed = useRef(false);
  useEffect(() => {
    if (!ready || !SHARED || sharedUsed.current) return;
    sharedUsed.current = true;
    setSt((sv) => ({ ...sv, draft: SHARED, draftRun: true, draftFrom: "share" }));
    setTab("speak");
    log("share_in", { chars: SHARED.length });
  }, [ready]);

  if (!ready) return (
    <div className="hae" style={{ background: C.bg, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: C.ink3, fontSize: 13 }}>
      <style dangerouslySetInnerHTML={{ __html: FONTS }} />불러오는 중…
    </div>
  );

  return (
    <Ctx.Provider value={{ st, setSt, me, setMe, cats, addTasks, complete, assign, setPref, setRoutine, routineAction, say, log, logTitles, spendAI, refundAI, tab, setTab, openCat, setOpenCat }}>
      <div className="hae" style={{ background: C.bg, minHeight: "100vh", color: C.ink,
                                     transition: "background .35s ease", WebkitFontSmoothing: "antialiased" }}>
        <style dangerouslySetInnerHTML={{ __html: FONTS }} />
        <NewBuildBar build={newBuild} />
        <div style={{ maxWidth: 440, margin: "0 auto", paddingBottom: 100, position: "relative" }}>
          {(!st.onboarded || st.previewOnboarding) ? <Onboarding preview={!!st.onboarded} /> : (
            <>
              <Header />
              <div className="px-5">
                <LinkClaims key={tab}>
                {tab === "home" && <Home />}
                {tab === "speak" && <Speak />}
                {tab === "news" && <NewsScreen />}
                {tab === "call" && <CallScreen />}
                {tab === "set" && <Settings />}
                </LinkClaims>
              </div>
              <TabBar />
            </>
          )}
          {toast && <div className="rise" style={{ position: "fixed", bottom: 108, left: "50%", transform: "translateX(-50%)", background: C.ink, color: "#fff", fontSize: 13, padding: "11px 18px", borderRadius: 999, zIndex: 70, whiteSpace: "nowrap", boxShadow: SHADOW }}>{toast}</div>}
        </div>
      </div>
    </Ctx.Provider>
  );
}

/* ── 첫 설정 4단계 ────────────────────────────── */
/* preview=true 면 이미 쓰고 있는 집이 처음 화면을 다시 보는 것입니다.
   30가구에 보내기 전에 첫인상을 확인해야 하는데, 한 번 지나가면 다시 못 봅니다.
   이때는 무엇을 눌러도 집 정보를 건드리지 않습니다. */
function Onboarding({ preview }) {
  /* 살림 앱일 때는 여섯 단계였습니다 — 차·반려동물·제사·음력까지 물었습니다.
     조부모께 전달하는 앱에서는 물을 것이 넷뿐입니다.
     맡기시나, 아이가 누구인가, 어느 분께 거나, 무엇을 알려드리나.
     온보딩이 무거우면 하다가 때려칩니다. */
  const { st, setSt, say } = use();
  const [step, setStep] = useState(0);
  const [kids, setKids] = useState([{ id: uid("k"), name: "", age: "" }]);
  const [elder, setElder] = useState({ id: uid("e"), label: "", phone: "" });
  const [at, setAt] = useState("07:50");
  const [dow, setDow] = useState(String(new Date().getDay() || 1));
  const [plan, setPlan] = useState({});
  const [time, setTime] = useState("");
  const [what, setWhat] = useState("");
  const inp = { border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 13px", fontSize: 14.5, background: C.bg, color: C.ink, width: "100%" };

  const PreviewBar = () => !preview ? null : (
    <div style={{ background: C.sunSoft, color: C.sun, borderRadius: 14, padding: "11px 14px",
                  fontSize: 12.5, lineHeight: 1.7, margin: "14px 0 2px" }}>
      <b>미리보기예요.</b> 여기서 무엇을 눌러도 우리 집 정보는 바뀌지 않습니다.
      <button onClick={() => setSt((sv) => ({ ...sv, previewOnboarding: false }))}
        style={{ display: "block", marginTop: 6, background: "transparent", border: "none", padding: 0,
                 color: C.sun, fontSize: 12.5, textDecoration: "underline" }}>끝내고 돌아가기</button>
    </div>
  );

  const STEPS = [
    { q: `${BRAND}에 오신 걸 환영해요.\n아이를 어른께 맡기시나요?`,
      s: "할머니·할아버지, 또는 다른 어른이요. 부모가 일정을 한 번 넣어두면 앱이 매일 그 시각에 전화로 알려드립니다. 어른은 받기만 하시면 됩니다." },
    { q: "아이가 누구인가요?",
      s: "어른께 읽어드릴 때 이름을 부릅니다. 나이는 안 넣으셔도 됩니다." },
    { q: "어느 분께 걸까요?",
      s: "호칭은 어른이 들으실 말로 적으세요. 번호는 그 어른 휴대폰이나 집전화입니다." },
    { q: "무엇을 알려드릴까요?",
      s: "요일마다 다른 것이 있으면 지금 하나만 넣어보세요. 나머지는 나중에 채우시면 됩니다." },
  ];
  const cur = STEPS[step];
  const kidsOk = kids.some((k) => k.name.trim());
  const elderOk = elder.label.trim() && elder.phone.trim();
  const canNext = step === 0 ? true : step === 1 ? kidsOk : step === 2 ? elderOk : true;
  const planN = Object.values(plan).reduce((a, v) => a + v.length, 0);

  const addRow = () => {
    const w = what.trim();
    if (!w) return;
    setPlan((p) => ({ ...p, [dow]: (p[dow] || []).concat([{ id: uid("cl"), time: time.trim(), what: w.slice(0, 30), kind: "sked", kid: (kids[0] || {}).id, alert: false }]) }));
    setTime(""); setWhat("");
  };

  const finish = (on) => {
    if (preview) { setSt((sv) => ({ ...sv, previewOnboarding: false })); say("미리보기였어요. 아무것도 안 바뀌었습니다"); return; }
    const cleanKids = kids.filter((k) => k.name.trim())
      .map((k) => ({ ...k, name: k.name.trim(), months: Number(k.age) ? Math.round(Number(k.age) * 12) : null }));
    setSt((sv) => ({
      ...sv,
      children: cleanKids,
      elders: on && elderOk ? [{ ...elder, label: elder.label.trim(), phone: elder.phone.trim() }] : [],
      callAt: at, callPlan: plan, callOn: !!on && elderOk,
      callOff: on ? 0 : Date.now(),
      onboarded: true,
    }));
    say(on ? "다 됐어요. 오늘 화면에서 나갈 말을 미리 보실 수 있어요" : "다 됐어요");
  };

  return (
    <div className="px-5" style={{ paddingBottom: 40 }}>
      <PreviewBar />
      <div className="mono" style={{ fontSize: 10.5, color: C.moss, letterSpacing: ".1em", marginTop: 26 }}>
        {step + 1} / {STEPS.length}
      </div>
      <h1 className="disp" style={{ fontSize: 25, fontWeight: 600, lineHeight: 1.4, marginTop: 10, whiteSpace: "pre-line", letterSpacing: "-.02em" }}>
        {cur.q}
      </h1>
      <p style={{ fontSize: 13, color: C.ink3, marginTop: 11, lineHeight: 1.8 }}>{cur.s}</p>

      <div style={{ marginTop: 24 }}>
        {step === 0 && (
          <>
            <Btn kind="accent" onClick={() => setStep(1)}>네, 맡깁니다</Btn>
            <Btn kind="quiet" onClick={() => { setStep(1); }} style={{ marginTop: 6 }}>
              아직은 아니지만 곧 맡길 것 같아요
            </Btn>
            <button className="press" onClick={() => finish(false)}
              style={{ display: "block", width: "100%", marginTop: 10, background: "transparent", border: "none",
                       color: C.ink3, fontSize: 12.5, padding: "10px 0" }}>
              맡기지 않습니다 — 그냥 둘러볼게요
            </button>
          </>
        )}

        {step === 1 && (
          <>
            {kids.map((k, i) => (
              <div key={k.id} className="grid grid-cols-3 gap-2" style={{ marginBottom: 8 }}>
                <input style={{ ...inp, gridColumn: "span 2" }} placeholder="이름" value={k.name}
                  onChange={(e) => setKids((v) => v.map((x, ix) => ix === i ? { ...x, name: e.target.value.slice(0, 10) } : x))} />
                <input style={inp} placeholder="나이" inputMode="numeric" value={k.age}
                  onChange={(e) => setKids((v) => v.map((x, ix) => ix === i ? { ...x, age: e.target.value.replace(/\D/g, "").slice(0, 2) } : x))} />
              </div>
            ))}
            {kids.length < 4 && (
              <button className="press" onClick={() => setKids((v) => v.concat([{ id: uid("k"), name: "", age: "" }]))}
                style={{ background: "transparent", border: `1px dashed ${C.line}`, borderRadius: 12, width: "100%",
                         padding: "11px 0", fontSize: 13, color: C.ink3 }}>+ 아이 더 넣기</button>
            )}
            <p style={{ fontSize: 12, color: C.ink3, marginTop: 12, lineHeight: 1.7 }}>
              아이가 둘이어도 <b style={{ color: C.ink2 }}>전화는 한 통</b>입니다. 이름을 앞에 붙여 읽어드려요.
            </p>
          </>
        )}

        {step === 2 && (
          <>
            <div className="grid grid-cols-2 gap-2">
              <input style={inp} placeholder="호칭 (예: 할머니)" value={elder.label}
                onChange={(e) => setElder((v) => ({ ...v, label: e.target.value.slice(0, 10) }))} />
              <input style={inp} placeholder="전화번호" inputMode="tel" value={elder.phone}
                onChange={(e) => setElder((v) => ({ ...v, phone: e.target.value.replace(/[^\d-]/g, "").slice(0, 14) }))} />
            </div>
            <div className="flex items-center gap-2.5" style={{ marginTop: 10 }}>
              <span style={{ fontSize: 13, color: C.ink2, flexShrink: 0 }}>전화 나가는 시각</span>
              <input style={{ ...inp, width: 110 }} value={at}
                onChange={(e) => setAt(e.target.value.slice(0, 5))} />
            </div>
            <div style={{ marginTop: 14, background: C.mossSoft, borderRadius: 12, padding: "13px 15px", fontSize: 12.5, color: C.ink2, lineHeight: 1.8 }}>
              전화는 <b style={{ color: C.ink }}>부모님 번호로</b> 갑니다. 어른 폰에는 늘 보시던 이름으로 뜹니다.<br />
              그래도 <b style={{ color: C.ink }}>“앞으로 이 번호로 전화 갈 거야”</b>라고 한 번 말씀드려 주세요.
              모르고 받으시면 기계 목소리에 놀라십니다.
            </div>
          </>
        )}

        {step === 3 && (
          <>
            <div className="flex gap-1.5" style={{ marginBottom: 12 }}>
              {["1", "2", "3", "4", "5"].map((dv) => {
                const n = (plan[dv] || []).length;
                return (
                  <button key={dv} className="press" onClick={() => setDow(dv)}
                    style={{ flex: 1, padding: "9px 0", borderRadius: 12, fontSize: 13, fontWeight: dow === dv ? 600 : 400,
                             border: `1px solid ${dow === dv ? C.moss : C.line}`, background: dow === dv ? C.moss : "transparent",
                             color: dow === dv ? "#fff" : (n ? C.ink2 : C.ink3) }}>
                    {DOW_KR[Number(dv)]}{n ? <span style={{ fontSize: 10, marginLeft: 3, opacity: .8 }}>{n}</span> : null}
                  </button>
                );
              })}
            </div>
            {(plan[dow] || []).map((r) => (
              <div key={r.id} className="flex items-center gap-2.5" style={{ padding: "9px 0", borderBottom: `1px solid ${C.lineSoft}` }}>
                <span className="mono" style={{ fontSize: 12.5, color: C.moss, width: 46 }}>{r.time || "—"}</span>
                <span style={{ fontSize: 14, flex: 1 }}>{r.what}</span>
                <button className="press" onClick={() => setPlan((p) => ({ ...p, [dow]: p[dow].filter((x) => x.id !== r.id) }))}
                  style={{ background: "transparent", border: "none", color: C.ink3, fontSize: 12 }}>빼기</button>
              </div>
            ))}
            <div className="flex gap-2" style={{ marginTop: 12 }}>
              <input style={{ ...inp, width: 82, flexShrink: 0 }} placeholder="15:20 (꼭)" value={time}
                onChange={(e) => setTime(e.target.value.slice(0, 5))} />
              <input style={inp} placeholder="태권도 데려다주기" value={what}
                onChange={(e) => setWhat(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") addRow(); }} />
              <button className="press" onClick={addRow}
                style={{ flexShrink: 0, padding: "0 16px", borderRadius: 12, background: C.moss, color: "#fff", border: "none", fontSize: 14, fontWeight: 600 }}>넣기</button>
            </div>
            <p style={{ fontSize: 12, color: C.ink3, marginTop: 12, lineHeight: 1.7 }}>
              약과 준비물은 나중에 <b style={{ color: C.ink2 }}>전화</b> 화면에서 넣으시면 됩니다.
              지금은 하나만 넣어보셔도 되고, 그냥 넘어가셔도 됩니다.
            </p>
          </>
        )}
      </div>

      {step > 0 && (
        <div style={{ marginTop: 26 }}>
          {step < STEPS.length - 1
            ? <Btn kind="accent" disabled={!canNext} onClick={() => setStep(step + 1)}>다음</Btn>
            : <Btn kind="accent" onClick={() => finish(true)}>{planN ? "다 됐어요" : "일단 이대로 시작하기"}</Btn>}
          <Btn kind="quiet" onClick={() => setStep(step - 1)} style={{ marginTop: 4 }}>← 뒤로</Btn>
        </div>
      )}
    </div>
  );
}

function Header() {
  const { st, me, setMe, tab, setTab } = use();
  const inSet = tab === "set";
  return (
    <div className="stick flex items-center justify-between px-5" style={{ paddingTop: 14, paddingBottom: 12 }}>
      <div className="flex items-center gap-2 min-w-0">
        <div className="disp" style={{ fontSize: 18, fontWeight: 700, letterSpacing: "-.035em" }}>{BRAND}</div>
        {st.members.length > 1 && (
          <span style={{ fontSize: 11, color: C.ink3, whiteSpace: "nowrap" }}>
            · {(st.members.find((m) => m.id === me) || {}).name} 화면
          </span>
        )}
      </div>
      <div className="flex items-center gap-1.5">
        {st.members.map((m) => (
          <button key={m.id} className="press" onClick={() => setMe(m.id)} aria-label={`${m.name} 화면으로 보기`}
            style={{ background: "none", border: "none", padding: 0, lineHeight: 0, opacity: me === m.id ? 1 : .28 }}>
            <Avatar member={m} size={28} />
          </button>
        ))}
        <button className="press" onClick={() => setTab(inSet ? "home" : "set")} aria-label={inSet ? "설정 닫기" : "설정"}
          style={{ width: 30, height: 30, marginLeft: 4, borderRadius: 999, border: `1px solid ${inSet ? C.moss : C.line}`, background: inSet ? C.mossSoft : C.card, color: inSet ? C.moss : C.ink2, fontSize: 13 }}>{inSet ? "✕" : "⚙"}</button>
      </div>
    </div>
  );
}

/* ── 반복 업무 행 ─────────────────────────────── */
function RoutineRow({ r, delay = 0, last, compact, manage }) {
  const { st, setSt, routineAction, setRoutine, say } = use();
  const cfg = st.routines[r.key] || { ...seedCfg(r.seed), on: true };
  const owner = st.members.find((m) => m.id === cfg.owner);
  const [pick, setPick] = useState(false);
  const [own, setOwn] = useState(false);
  const [rename, setRename] = useState(null);
  const overdue = (cfg.nextAt || 0) < todayKey();
  const doneToday = !!(cfg.lastAt && cfg.lastAt >= todayKey());
  const catId = r.child ? `kid:${r.child.id}` : r.seed.cat;

  return (
    <div className="rise flex items-start gap-3" style={{ padding: "15px 16px", borderBottom: last ? "none" : `1px solid ${C.lineSoft}`, animationDelay: `${delay}ms`, opacity: doneToday ? 0.45 : 1, transition: "opacity .4s ease" }}>
      <button className="press" onClick={() => routineAction(r.key, cfg, doneToday ? "undo" : "done")} aria-label={doneToday ? "되돌리기" : "했어요"}
        style={{ width: 23, height: 23, marginTop: 1, borderRadius: 8, flexShrink: 0, border: `1.5px solid ${doneToday ? C.moss : C.line}`, background: doneToday ? C.moss : "transparent", color: "#fff", fontSize: 12, lineHeight: "20px" }}>{doneToday ? "✓" : ""}</button>
      <div className="flex-1 min-w-0">
        <div style={{ fontSize: 15, fontWeight: 500, lineHeight: 1.45, textDecoration: doneToday ? "line-through" : "none" }}>
          {r.seed.t}
          {r.child ? <span style={{ color: C.ink3, fontWeight: 400 }}> · {r.child.name}</span> : null}
          {r.seed.season ? <span style={{ color: C.sun, fontWeight: 400, fontSize: 12 }}> · {r.seed.season === "summer" ? "여름" : "겨울"}</span> : null}
          {r.custom && !doneToday ? <button onClick={() => setRename(r.seed.t)} style={{ marginLeft: 6, background: "none", border: "none", color: C.ink3, fontSize: 11.5, padding: 0 }}>이름 고치기</button> : null}
        </div>
        {!compact && !doneToday && <div className="flex items-center gap-2 flex-wrap" style={{ marginTop: 8 }}>
          <button className="press" onClick={() => setPick(true)}
            style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "5px 11px", fontSize: 11.5, color: C.ink2 }}>{patternLabel(cfg)}</button>
          <button className="press" onClick={() => routineAction(r.key, cfg, "later")}
            style={{ background: "none", border: "none", color: C.ink3, fontSize: 11.5, padding: "4px 2px" }}>내일 할게요</button>
          <button className="press" onClick={() => routineAction(r.key, cfg, "skip")}
            style={{ background: "none", border: "none", color: C.ink3, fontSize: 11.5, padding: "4px 2px" }}>이번엔 건너뛰기</button>
          {cfg.anchor && <CalButtons title={r.seed.t} whenMs={nextFromAnchor(cfg.anchor, 0)} note={r.seed.tg} />}
        </div>}
        {!compact && !doneToday && r.seed.lk && <LinkCards group={null} text={r.seed.lk} compact />}
      </div>
      {overdue && !doneToday && <span style={{ fontSize: 11, color: C.ink3, whiteSpace: "nowrap", marginTop: 3 }}>지난 회차</span>}
      {manage ? (
        <button className="press" onClick={() => setRoutine(r.key, { on: !(cfg.on !== false) })} aria-label="사용 여부"
          style={{ width: 42, height: 25, borderRadius: 99, border: "none", background: cfg.on !== false ? C.moss : C.line, position: "relative", flexShrink: 0, marginTop: 1 }}>
          <span style={{ position: "absolute", top: 3, left: cfg.on !== false ? 20 : 3, width: 19, height: 19, borderRadius: 99, background: "#fff", transition: "left .18s" }} />
        </button>
      ) : (
        <button className="press" onClick={() => setOwn(true)} aria-label="담당자 정하기" style={{ background: "none", border: "none", padding: 0, lineHeight: 0, marginTop: 1 }}>
          <Avatar member={owner} size={25} />
        </button>
      )}

      {own && <OwnerPicker title={r.seed.t} current={cfg.owner} categoryId={catId}
        onPick={(id) => setRoutine(r.key, { owner: id })} onClose={() => setOwn(false)} />}

      {rename != null && (
        <Sheet onClose={() => setRename(null)}>
          <div className="disp" style={{ fontSize: 20, fontWeight: 600 }}>이름 고치기</div>
          <input className="hae" value={rename} onChange={(e) => setRename(e.target.value)}
            style={{ width: "100%", marginTop: 14, border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "13px 14px", fontSize: 15, background: C.bg, color: C.ink }} />
          <Btn style={{ marginTop: 16 }} onClick={() => {
            const t = rename.trim(); if (!t) return setRename(null);
            setSt((sv) => ({ ...sv, customRoutines: (sv.customRoutines || []).map((x) => x.id === r.seed.id ? { ...x, title: t } : x) }));
            setRename(null); say("바꿨어요");
          }}>저장</Btn>
          <Btn kind="quiet" onClick={() => {
            setSt((sv) => ({ ...sv, customRoutines: (sv.customRoutines || []).filter((x) => x.id !== r.seed.id) }));
            setRename(null); say("이 항목은 지웠어요");
          }}>이 항목 지우기</Btn>
        </Sheet>
      )}

      {pick && <CyclePicker current={cfg.cycle} title={r.seed.t} anchor={cfg.anchor} pattern={cfg}
        onPick={(dd) => {
          setRoutine(r.key, { cycle: dd, nextAt: nextByPattern({ ...cfg, cycle: dd }) }); setPick(false);
          /* 요일이나 날짜가 지정돼 있으면 그게 주기보다 앞섭니다.
             말 안 하면 "주기를 바꿨는데 안 바뀐다"로 보입니다. */
          const fixed = dowList(cfg).length || domList(cfg).length;
          say(fixed ? `${cycleLabel(dd)}로 바꿨어요. 다만 아래 요일·날짜 지정이 먼저라 올라오는 날은 그대로예요`
                    : `${cycleLabel(dd)}로 바꿨어요`);
        }}
        onPattern={(p) => {
          /* 요일·날짜를 바꿨으면 다음 차례도 다시 계산해야 합니다.
             안 하면 화면의 글자만 바뀌고 올라오는 날은 그대로입니다. */
          setRoutine(r.key, { ...p, nextAt: nextByPattern({ ...cfg, ...p }) || cfg.nextAt });
          say(dowList(p).length ? `${dowList(p).map((i) => WEEKDAY[i]).join("·")}요일마다 올립니다`
            : domList(p).length ? `매달 ${domList(p).map(domLabel).join("·")}에 올립니다` : "요일·날짜 지정을 풀었어요");
        }}
        onAnchor={(a) => {
          /* 날짜를 넣으면 요일·월중 날짜는 풉니다. 안 그러면 그쪽이 이겨서
             넣은 날짜가 무시되고 화면도 안 바뀝니다. */
          setRoutine(r.key, a
            ? { anchor: a, cycle: 365, dows: [], dow: "", doms: [], dom: "", nextAt: nextFromAnchor(a, 7) }
            : { anchor: "", nextAt: nextByPattern(cfg) || cfg.nextAt });
          setPick(false);
          say(a ? `${anchorLabel(a)} 기준으로 미리 알립니다` : "날짜를 지웠어요");
        }}
        onOff={() => { setRoutine(r.key, { on: false }); setPick(false); say("이 항목은 접어둘게요"); }}
        onClose={() => { setRoutine(r.key, { nextAt: nextByPattern(cfg) || cfg.nextAt }); setPick(false); }} />}
    </div>
  );
}

/* ── Task 행 ──────────────────────────────────── */
function TaskRow({ t, delay = 0, last }) {
  const { st, cats, complete, assign, setSt, say } = use();
  const [rep2, setRep2] = useState(false);
  const [own, setOwn] = useState(false);
  const [edit, setEdit] = useState(false);
  const cat = cats.find((c) => c.id === t.category) || { emoji: "🗂", label: "기타" };
  const due = dueLabel(t.dueAt);
  const owner = st.members.find((m) => m.id === t.owner);
  const raiser = t.raisedBy === "ai" ? "ai" : st.members.find((m) => m.id === t.raisedBy);
  const upd = (patch) => setSt((sv) => ({ ...sv, tasks: sv.tasks.map((x) => x.id === t.id ? { ...x, ...patch } : x) }));
  const kidNames = (t.withKids || []).map((id) => (st.children.find((c) => c.id === id) || {}).name).filter(Boolean);

  return (
    <div className="rise flex items-start gap-3" style={{ padding: "15px 16px", borderBottom: last ? "none" : `1px solid ${C.lineSoft}`, animationDelay: `${delay}ms`, opacity: t.done ? 0.45 : 1, transition: "opacity .4s ease" }}>
      <button className="press" onClick={() => complete(t.id)} aria-label={t.done ? "되돌리기" : "완료"}
        style={{ width: 23, height: 23, marginTop: 1, borderRadius: 8, flexShrink: 0, border: `1.5px solid ${t.done ? C.moss : C.line}`, background: t.done ? C.moss : "transparent", color: "#fff", fontSize: 12, lineHeight: "20px" }}>{t.done ? "✓" : ""}</button>
      <div className="flex-1 min-w-0">
        <button className="text-left w-full" onClick={() => !t.done && setEdit(true)} disabled={t.done}
          style={{ background: "none", border: "none", padding: 0, fontSize: 15, fontWeight: 500, lineHeight: 1.45, color: t.done ? C.ink3 : C.ink, textDecoration: t.done ? "line-through" : "none" }}>
          {t.title}
        </button>
        <div className="flex items-center gap-1.5 flex-wrap" style={{ fontSize: 11.5, color: C.ink3, marginTop: 5 }}>
          {/* 날짜를 눌러서 바로 고칠 수 있게. "고치기"를 찾아 헤매지 않도록 */}
          {!t.done && due && (
            <button className="press" onClick={() => setEdit(true)}
              style={{ background: due.urgent ? C.persimSoft : C.mossSoft, color: due.urgent ? C.persim : C.moss,
                       border: "none", borderRadius: 999, padding: "3px 9px", fontSize: 11.5, fontWeight: 600, marginRight: 2 }}>
              {due.date} · {due.text}
            </button>
          )}
          <span>{cat.emoji} {cat.label}</span>
          {!t.done && t.eventAt ? <span style={{ color: C.sun, fontWeight: 600 }}>· 그날 {dueLabel(t.eventAt).date}</span> : null}
          {kidNames.length ? <span>· 🧒 {kidNames.join(", ")}와 함께</span> : null}
          {t.note && <span>· {t.note}</span>}
          {!t.done && raiser && <span>· {raiser === "ai" ? `${BRAND}이 챙김` : `${raiser.name}이 떠올림`}</span>}
          {t.done && t.doneBy && <span>· {(st.members.find((m) => m.id === t.doneBy) || {}).name} 완료</span>}
        </div>
        {!t.done && (
          <div className="flex items-center gap-1.5 flex-wrap" style={{ marginTop: 9 }}>
            <button className="press" onClick={() => setEdit(true)}
              style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "5px 11px", fontSize: 11.5, color: C.ink2 }}>고치기</button>
            {!t.seedId && <button className="press" onClick={() => setRep2(true)}
              style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "5px 11px", fontSize: 11.5, color: C.ink2 }}>반복으로</button>}
          </div>
        )}
        {!t.done && <LinkCards group={null} text={`${t.title} ${t.note || ""}`} compact />}
      </div>
      <div className="flex items-center gap-2" style={{ marginTop: 1 }}>
        {!t.done && <Chip status={t.status} />}
        {!t.done ? <button className="press" onClick={() => setOwn(true)} aria-label="담당자 정하기" style={{ background: "none", border: "none", padding: 0, lineHeight: 0 }}><Avatar member={owner} /></button>
          : <Avatar member={st.members.find((m) => m.id === t.doneBy)} dim />}
      </div>

      {own && <OwnerPicker title={t.title} current={t.owner} categoryId={t.category} withKids={t.withKids || []} onWithKids
        onPick={(id, kids) => upd({ owner: id, withKids: kids })} onClose={() => setOwn(false)} />}

      {edit && (
        <Sheet onClose={() => setEdit(false)}>
          <div className="disp" style={{ fontSize: 20, fontWeight: 600 }}>항목 고치기</div>
          <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 16 }}>할 일 이름</div>
          <input className="hae" value={t.title} onChange={(e) => upd({ title: e.target.value })}
            style={{ width: "100%", marginTop: 8, border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "13px 14px", fontSize: 15, background: C.bg, color: C.ink }} />
          <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 14 }}>메모</div>
          <input className="hae" value={t.note || ""} onChange={(e) => upd({ note: e.target.value })} placeholder="왜 해야 하는지 짧게"
            style={{ width: "100%", marginTop: 8, border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "12px 14px", fontSize: 13.5, background: C.bg, color: C.ink }} />
          <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 18 }}>그날이 언제인가요? <span style={{ color: C.ink3, fontWeight: 400 }}>선택</span></div>
          <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 3, lineHeight: 1.6 }}>단수·소풍·마감처럼 <b style={{ color: C.ink2 }}>그날</b>이 있으면 넣어주세요. 며칠 전에 알려드릴지 정하면 올릴 날짜는 저희가 계산합니다.</div>
          <input type="date" className="hae" value={t.eventAt ? new Date(t.eventAt - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10) : ""}
            onChange={(e) => { const ev = parseWhen(e.target.value); upd(ev ? { eventAt: ev, lead: t.lead != null ? t.lead : 1, dueAt: dueFromEvent(ev, t.lead != null ? t.lead : 1) } : { eventAt: null }); }}
            style={{ width: "100%", marginTop: 9, border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 13px", fontSize: 15, background: C.bg, color: C.ink, fontFamily: "inherit" }} />
          {t.eventAt ? (
            <>
              <div className="flex flex-wrap gap-1.5" style={{ marginTop: 8 }}>
                {LEADS.map(([n, lb]) => {
                  const on = (t.lead != null ? t.lead : 1) === n;
                  return (
                    <button key={n} className="press" onClick={() => upd({ lead: n, dueAt: dueFromEvent(t.eventAt, n) })}
                      style={{ background: on ? C.moss : C.bg, color: on ? "#fff" : C.ink2, border: `1px solid ${on ? C.moss : C.line}`,
                               borderRadius: R.pill, padding: "8px 13px", fontSize: 12.5, fontWeight: on ? 600 : 400 }}>{lb}</button>
                  );
                })}
              </div>
              <div style={{ marginTop: 9, background: C.mossSoft, borderRadius: 10, padding: "9px 12px", fontSize: 12.5, color: C.moss, lineHeight: 1.6 }}>
                그날은 <b>{dueLabel(t.eventAt).date}</b> · <b>{dueLabel(dueFromEvent(t.eventAt, t.lead != null ? t.lead : 1)).date}</b>에 올립니다
              </div>
            </>
          ) : null}
          <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 18 }}>{t.eventAt ? "올려드릴 날짜를 직접 고치기" : "며칠에 올려드릴까요?"}</div>
          <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 3 }}>
            {t.dueAt ? `지금은 ${dueLabel(t.dueAt).date}예요. ` : ""}이 날이 되면 오늘 화면 맨 위로 올라옵니다.
          </div>
          <input type="date" className="hae" value={t.dueAt ? new Date(t.dueAt - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10) : ""}
            onChange={(e) => upd({ dueAt: parseWhen(e.target.value) || defaultDue(t.status) })}
            style={{ width: "100%", marginTop: 9, border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 13px", fontSize: 15, background: C.bg, color: C.ink, fontFamily: "inherit" }} />
          <div className="flex gap-1.5" style={{ marginTop: 8 }}>
            {[["오늘", 0], ["내일", 1], ["모레", 2], ["일주일 뒤", 7]].map(([lb, n]) => (
              <button key={lb} className="press" onClick={() => upd({ dueAt: todayKey() + n * DAY })}
                style={{ flex: 1, background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "9px 0", fontSize: 12, color: C.ink2 }}>{lb}</button>
            ))}
          </div>

          <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 18 }}>어떤 종류인가요?</div>
          <div className="flex flex-wrap gap-2" style={{ marginTop: 10 }}>
            {STATUS_ORDER.filter((k) => k !== "repeat").map((k) => (
              <button key={k} className="press" onClick={() => upd({ status: k })}
                style={{ background: t.status === k ? STATUS[k].bg : C.bg, color: t.status === k ? STATUS[k].fg : C.ink2,
                         border: `1px solid ${t.status === k ? STATUS[k].fg : C.line}`, borderRadius: R.pill, padding: "8px 13px", fontSize: 12.5, fontWeight: 600 }}>{STATUS[k].label}</button>
            ))}
          </div>
          <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 18 }}>어느 영역에 넣을까요?</div>
          <div className="flex flex-wrap gap-2" style={{ marginTop: 10 }}>
            {[...cats, { id: "etc", emoji: "🗂", label: "기타" }].map((c) => (
              <button key={c.id} className="press" onClick={() => upd({ category: c.id })}
                style={{ background: t.category === c.id ? C.mossSoft : C.bg, color: t.category === c.id ? C.moss : C.ink2,
                         border: `1px solid ${t.category === c.id ? C.moss : C.line}`, borderRadius: R.pill, padding: "8px 12px", fontSize: 12.5 }}>{c.emoji} {c.label}</button>
            ))}
          </div>
          {/* 무엇을 할지 정하는 자리에서 누가 할지도 같이 정합니다.
              화면을 두 번 오갈 이유가 없습니다 */}
          {st.members.length > 1 && (
            <>
              <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 18 }}>누가 할까요? <span style={{ color: C.ink3, fontWeight: 400 }}>안 정하셔도 됩니다</span></div>
              <div className="flex flex-wrap gap-2" style={{ marginTop: 10 }}>
                {st.members.map((m) => (
                  <button key={m.id} className="press flex items-center gap-1.5" onClick={() => upd({ owner: t.owner === m.id ? null : m.id })}
                    style={{ background: t.owner === m.id ? C.mossSoft : C.bg, color: t.owner === m.id ? C.moss : C.ink2,
                             border: `1px solid ${t.owner === m.id ? C.moss : C.line}`, borderRadius: R.pill, padding: "8px 13px", fontSize: 12.5, fontWeight: t.owner === m.id ? 600 : 400 }}>
                    <span style={{ width: 7, height: 7, borderRadius: 99, background: m.color, display: "inline-block" }} />{m.name}
                  </button>
                ))}
              </div>
            </>
          )}
          <Btn style={{ marginTop: 20 }} onClick={() => setEdit(false)}>확인</Btn>
          <Btn kind="quiet" onClick={() => { setSt((sv) => ({ ...sv, tasks: sv.tasks.filter((x) => x.id !== t.id) })); setEdit(false); say("지웠어요"); }}>이 할 일 지우기</Btn>
        </Sheet>
      )}

      {rep2 && (() => {
        /* 이 할 일에서 이미 만든 정기 일정이 있으면 그걸 고칩니다.
           전에는 누를 때마다 새로 만들어서, 여러 번 누르면 같은 일정이 쌓였습니다.
           그리고 원래 할 일은 그대로 남아 있어서 화면이 하나도 안 바뀌어 보였습니다. */
        /* 이 할 일에서 만든 것, 또는 이름·영역이 같은 정기 일정이 이미 있으면 그것으로 봅니다.
           같은 이름이 둘씩 생기면 화면만 지저분해지고 알림도 두 번 옵니다. */
        const same = (r) => r.createdFrom === t.id
          || (String(r.title || "").trim() === String(t.title || "").trim() && r.category === t.category);
        const mine = (st.customRoutines || []).filter(same);
        const cur = mine.length ? (st.routines[`c:${mine[0].id}`] || {}) : {};

        /* 반복으로 바꾸면 할 일 목록에서는 빠집니다. 정기 일정으로 옮겨간 거니까요. */
        const move = (cycle, extra, msg) => {
          setSt((sv) => {
            const keep = (sv.customRoutines || []).filter((r) => !same(r));
            const ro = { ...sv.routines };
            (sv.customRoutines || []).forEach((r) => { if (same(r)) delete ro[`c:${r.id}`]; });
            const cid = mine.length ? mine[0].id : uid("cr");
            const cfg = { on: true, cycle, owner: t.owner || undefined, ...extra };
            return {
              ...sv,
              tasks: (sv.tasks || []).filter((x) => x.id !== t.id),
              customRoutines: [...keep, { id: cid, title: t.title, category: t.category, cycle, createdFrom: t.id }],
              routines: { ...ro, [`c:${cid}`]: cfg },
            };
          });
          setRep2(false);
          say(msg + " · 영역 화면의 정기 일정으로 옮겼어요");
        };

        return <CyclePicker title={t.title} current={cur.cycle || 30} pattern={cur}
          onPattern={(pt) => {
            const cycle = dowList(pt).length ? 7 : (cur.cycle || 30);
            move(cycle, { ...pt, nextAt: nextByPattern({ ...pt, cycle }) }, patternLabel({ ...pt, cycle }));
          }}
          onAnchor={(a) => {
            if (!a) return setRep2(false);
            move(365, { anchor: a, nextAt: nextFromAnchor(a, 7) }, `${anchorLabel(a)} 기준으로 매년`);
          }}
          onPick={(dd) => move(dd, { nextAt: Date.now() + dd * DAY }, `${cycleLabel(dd)}마다`)}
          onClose={() => setRep2(false)} />;
      })()}
    </div>
  );
}

/* ── 생애주기 추천 카드 ───────────────────────── */
function RecCard({ rec, delay = 0, flat }) {
  const { st, setPref, setSt, addTasks, say, log, setTab } = use();
  const [mode, setMode] = useState(null);
  const seed = rec.seed;
  const category = seed.kid ? `kid:${rec.child.id}` : seed.cat;
  const soon = rec.dateKnown && rec.dday <= 7;
  const accept = (owner) => {
    addTasks([{ title: seed.t, category, status: seed.st, note: seed.tg, seedId: seed.id, coverage: "system", owner: owner || null }], "ai");
    setPref(rec.key, { accepted: true }); log("rec_accept", { id: seed.id }); say(owner ? "담당자와 함께 담았어요" : "할 일에 담았어요");
  };
  const feedback = (type) => {
    setSt((s) => ({ ...s, feedback: [...s.feedback, { id: seed.id, type, ts: Date.now() }] }));
  };
  return (
    <>
      <div className="rise" style={{ marginBottom: 10, animationDelay: `${delay}ms` }}>
        <Card flat={flat} style={{ borderColor: soon ? C.persim : C.line }}>
          <div style={{ padding: 17 }}>
            <div className="flex items-start justify-between gap-3">
              <div className="min-w-0">
                <div style={{ fontSize: 16, fontWeight: 600, letterSpacing: "-.01em" }}>{seed.t}</div>
                <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 5 }}>필요한 때 · {seed.tg}{rec.child ? ` · ${rec.child.name}` : ""}</div>
              </div>
              <span className="mono" style={{ fontSize: 12.5, fontWeight: 500, color: rec.dateKnown ? (soon ? C.persim : C.moss) : C.ink3, whiteSpace: "nowrap" }}>
                {rec.dateKnown ? (rec.dday <= 0 ? "지금" : `D-${rec.dday}`) : "시점 미정"}
              </span>
            </div>
            {seed.ask && <div style={{ marginTop: 12, background: C.mossSoft, color: C.moss, borderRadius: 12, padding: "11px 13px", fontSize: 13, lineHeight: 1.55 }}>{seed.ask}</div>}
            {(seed.scan || /알림장|통신문|안내문/.test(seed.t)) && (
              <button className="press w-full flex items-center justify-center gap-2" onClick={() => { setTab("speak"); say("📄 알림장·통신문 사진 버튼을 눌러 찍어주세요"); }}
                style={{ marginTop: 10, background: C.ink, color: "#fff", border: "none", borderRadius: R.sm, padding: "13px 0", fontSize: 13.5, fontWeight: 600 }}>
                📄 알림장 사진으로 바로 분석하기
              </button>
            )}
            <button className="press w-full" onClick={() => accept()}
              style={{ marginTop: 14, background: C.moss, color: "#fff", border: "none", borderRadius: R.md, padding: "15px 0", fontSize: 14.5, fontWeight: 600 }}>할 일에 등록하기</button>
            <div className="flex gap-2" style={{ marginTop: 8 }}>
              <button className="press" onClick={() => { setPref(rec.key, { snoozedUntil: Date.now() + 30 * DAY }); say("한 달 뒤에 다시 알립니다"); }}
                style={{ flex: 1, background: C.bg, color: C.ink2, border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "11px 0", fontSize: 12.5 }}>나중에</button>
              <button className="press" onClick={() => setMode("no")} style={{ flex: 1, background: C.bg, color: C.ink2, border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "11px 0", fontSize: 12.5 }}>관심 없음</button>
            </div>
            <div className="flex gap-4" style={{ marginTop: 11 }}>
              {[["시기 조정", "edit"], ["가족에게 넘기기", "give"], ["왜 지금?", "why"]].map(([l, m]) => (
                <button key={m} onClick={() => setMode(m)} style={{ background: "none", border: "none", color: C.ink3, fontSize: 11.5, padding: 0 }}>{l}</button>
              ))}
              {rec.dateKnown && <CalButtons title={seed.t} whenMs={Date.now() + Math.max(rec.dday, 0) * DAY} note={seed.tg} style={{ padding: 0 }} />}
            </div>
            <LinkCards group={seed.g} text={seed.t} />
          </div>
        </Card>
      </div>

      {mode === "no" && (
        <Sheet onClose={() => setMode(null)}>
          <div className="disp" style={{ fontSize: 19, fontWeight: 600 }}>어떻게 할까요?</div>
          <p style={{ fontSize: 13.5, color: C.ink2, marginTop: 8 }}>“{seed.t}” 제안을 닫습니다.</p>
          <div style={{ marginTop: 16 }}>
            <Btn kind="ghost" onClick={() => { setPref(rec.key, { dismissedOnce: true }); feedback("이번만"); setMode(null); say("이번만 닫았어요"); }}>이번만 제외</Btn>
            <div style={{ height: 8 }} />
            <Btn kind="ghost" onClick={() => { setPref(rec.key, { enabled: false }); feedback("불필요"); setMode(null); say("앞으로 안 보여줍니다"); }}>앞으로 제외</Btn>
            <Btn kind="quiet" onClick={() => { setSt((s) => ({ ...s, groupsOff: { ...s.groupsOff, [seed.g]: true } })); feedback("그룹차단"); setMode(null); say(`‘${seed.g}’ 관련을 모두 껐어요`); }}>‘{seed.g}’ 관련은 전부 안 받기</Btn>
          </div>
        </Sheet>
      )}
      {mode === "edit" && (
        <Sheet onClose={() => setMode(null)}>
          <div className="disp" style={{ fontSize: 19, fontWeight: 600 }}>얼마나 미리 알려드릴까요?</div>
          <p style={{ fontSize: 13.5, color: C.ink2, marginTop: 8, lineHeight: 1.7 }}>지금은 {rec.lead}일 전부터예요.</p>
          <div className="grid grid-cols-4 gap-2" style={{ marginTop: 16 }}>
            {[7, 14, 30, 60, 90, 120, 180, 270].map((dd) => (
              <button key={dd} className="press" onClick={() => { setPref(rec.key, { lead: dd }); feedback("수정"); setMode(null); say(`${dd}일 전부터 알립니다`); }}
                style={{ background: rec.lead === dd ? C.mossSoft : C.bg, color: rec.lead === dd ? C.moss : C.ink2, border: `1px solid ${rec.lead === dd ? C.moss : C.line}`, borderRadius: 12, padding: "13px 0", fontSize: 13, fontWeight: 600 }}>{dd}일</button>
            ))}
          </div>
        </Sheet>
      )}
      {mode === "give" && (
        <Sheet onClose={() => setMode(null)}>
          <div className="disp" style={{ fontSize: 19, fontWeight: 600 }}>누구에게 맡길까요?</div>
          <div className="flex flex-col gap-2" style={{ marginTop: 16 }}>
            {st.members.map((m) => (
              <button key={m.id} className="press flex items-center gap-3" onClick={() => { accept(m.id); setMode(null); }}
                style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: 14, padding: "14px 16px", fontSize: 14.5 }}>
                <Avatar member={m} size={30} /> {m.name}에게
              </button>
            ))}
          </div>
        </Sheet>
      )}
      {mode === "why" && (
        <Sheet onClose={() => setMode(null)}>
          <div className="disp" style={{ fontSize: 19, fontWeight: 600 }}>왜 지금 보여드렸나요</div>
          <div style={{ fontSize: 14, color: C.ink2, marginTop: 12, lineHeight: 1.8 }}>
            이 항목은 <b style={{ color: C.ink }}>{seed.tg}</b>에 필요합니다.<br />
            준비는 보통 <b style={{ color: C.ink }}>{rec.lead}일 전</b>에 시작해야 늦지 않아요.
            {rec.child ? <> 지금 {rec.child.name}가 {childLabel(rec.child)}라서 그 시점이 왔습니다.</> : <> 우리 집에 해당하는 조건이라 올렸어요.</>}
            {seed.src && <><br /><br /><span style={{ color: C.ink3, fontSize: 12.5 }}>근거 · {seed.src.split(";").map((x) => SOURCE_NAME[x]).filter(Boolean).join(", ")}</span></>}
          </div>
        </Sheet>
      )}
    </>
  );
}

/* ── 휴일 날씨 브리핑 ─────────────────────────────
   금·토·일이나 연휴가 오면 그 전날에 한 번만 띄웁니다.
   금요일이 공휴일이면 자동으로 목요일에 뜹니다. */
const PLACES = [
  { label: "서울", lat: 37.5665, lon: 126.978 }, { label: "인천", lat: 37.4563, lon: 126.7052 },
  { label: "수원", lat: 37.2636, lon: 127.0286 }, { label: "대전", lat: 36.3504, lon: 127.3845 },
  { label: "대구", lat: 35.8714, lon: 128.6014 }, { label: "부산", lat: 35.1796, lon: 129.0756 },
  { label: "광주", lat: 35.1595, lon: 126.8526 }, { label: "울산", lat: 35.5384, lon: 129.3114 },
  { label: "춘천", lat: 37.8813, lon: 127.7300 }, { label: "전주", lat: 35.8242, lon: 127.1480 },
  { label: "청주", lat: 36.6424, lon: 127.4890 }, { label: "제주", lat: 33.4996, lon: 126.5312 },
];
const WMO = (c) => {
  if (c === 0) return { e: "☀️", t: "맑음" };
  if (c <= 2) return { e: "🌤", t: "구름 조금" };
  if (c === 3) return { e: "☁️", t: "흐림" };
  if (c <= 48) return { e: "🌫", t: "안개" };
  if (c <= 57) return { e: "🌦", t: "이슬비" };
  if (c <= 67) return { e: "🌧", t: "비" };
  if (c <= 77) return { e: "🌨", t: "눈" };
  if (c <= 82) return { e: "🌧", t: "소나기" };
  if (c <= 86) return { e: "🌨", t: "소나기눈" };
  return { e: "⛈", t: "천둥번개" };
};

function HolidayBrief() {
  const { st, setSt, setTab, addTasks, say } = use();
  const brk = useMemo(() => nextBreak(Date.now()), []);
  const [data, setData] = useState(null);
  const [err, setErr] = useState("");
  const asked = useRef(false);
  const place = st.place || PLACES[0];
  const show = brk && startOfDay(Date.now()) >= brk.briefAt && startOfDay(Date.now()) <= brk.days[brk.days.length - 1].getTime();

  useEffect(() => {
    if (!show || asked.current) return;
    asked.current = true;
    const cache = st.brief;
    if (cache && cache.date === todayStr() && cache.place === place.label) { setData(cache.daily); return; }
    (async () => {
      try {
        const r = await fetch(`/api/weather?lat=${place.lat}&lon=${place.lon}`);
        const d = await r.json();
        if (!r.ok || !d.time) throw new Error(d.error || "날씨 실패");
        setData(d);
        setSt((sv) => ({ ...sv, brief: { date: todayStr(), place: place.label, daily: d } }));
      } catch (e) { setErr("날씨를 못 가져왔어요. 잠시 뒤 다시 열어보세요."); }
    })();
  }, [show, place.label]);

  if (!show) return null;
  const rows = brk.days.map((d) => {
    const key = ymd(d);
    const i = data && data.time ? data.time.indexOf(key) : -1;
    if (i < 0) return { d, key };
    return { d, key, code: data.weather_code[i], max: data.temperature_2m_max[i], min: data.temperature_2m_min[i], pop: data.precipitation_probability_max[i] };
  });
  const wet = rows.some((r) => r.pop >= 60);
  const startLabel = `${brk.days[0].getMonth() + 1}월 ${brk.days[0].getDate()}일(${WEEKDAY[brk.days[0].getDay()]})`;

  return (
    <Fold icon="🌤" tone={C.seaSoft} title={`${startLabel}부터 ${brk.days.length}일 쉬어요`}
      sub={data ? (wet ? "비 오는 날이 있어요 · 눌러서 날씨 보기" : "나들이 날씨예요 · 눌러서 자세히") : "날씨 브리핑 보기"}>
        <div className="flex items-center justify-between">
          <span className="mono" style={{ fontSize: 9.5, color: C.sea }}>HOLIDAY BRIEF</span>
          <select className="hae" value={place.label}
            onChange={(e) => { const p = PLACES.find((x) => x.label === e.target.value); asked.current = false; setSt((sv) => ({ ...sv, place: p, brief: null })); }}
            style={{ border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "4px 9px", fontSize: 11.5, background: C.bg, color: C.ink2 }}>
            {PLACES.map((p) => <option key={p.label} value={p.label}>{p.label}</option>)}
          </select>
        </div>

        {err && <div style={{ fontSize: 12.5, color: C.ink3, marginTop: 8 }}>{err}</div>}
        {!data && !err && <div className="flex gap-2" style={{ marginTop: 12 }}>{brk.days.map((_, i) => <div key={i} className="skel" style={{ flex: 1, height: 62 }} />)}</div>}
        {data && (
          <div className="flex gap-2" style={{ marginTop: 12 }}>
            {rows.map((r) => {
              const w = WMO(r.code);
              return (
                <div key={r.key} style={{ flex: 1, background: C.bg, borderRadius: R.sm, padding: "10px 4px", textAlign: "center" }}>
                  <div style={{ fontSize: 11, color: C.ink3 }}>{r.d.getDate()}일({WEEKDAY[r.d.getDay()]})</div>
                  <div style={{ fontSize: 19, marginTop: 3 }}>{w.e}</div>
                  <div style={{ fontSize: 11.5, marginTop: 3, fontWeight: 600 }}>{Math.round(r.max)}° <span style={{ color: C.ink3, fontWeight: 400 }}>{Math.round(r.min)}°</span></div>
                  {r.pop != null && <div className="mono" style={{ fontSize: 9.5, color: r.pop >= 60 ? C.sea : C.ink3, marginTop: 2 }}>{r.pop}%</div>}
                </div>
              );
            })}
          </div>
        )}
        <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 12, lineHeight: 1.65 }}>
          {wet ? "비 오는 날이 있어요. 실내 계획을 하나 잡아두면 덜 급합니다." : "나들이 가기 좋은 날씨예요. 예약이 필요한 곳은 지금이 마지막입니다."}
        </div>
        <LinkCards group="놀이" text={wet ? "실내 체험 키즈카페" : "주말 나들이 여행지"} />
        <button className="press w-full" onClick={() => { addTasks([{ title: "휴일 계획 정하기", category: "event", status: "week", note: `${startLabel}부터 ${brk.days.length}일` }], "ai"); say("할 일에 담았어요"); }}
          style={{ marginTop: 12, background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "12px 0", fontSize: 13, color: C.ink2, width: "100%" }}>
          휴일 계획 할 일로 담기
        </button>
    </Fold>
  );
}

function MovePlan() {
  const { st, setSt, addTasks, say } = use();
  const [date, setDate] = useState(st.moveDate || "");
  if (!st.flags.moving) return null;
  const ms = date && /^\d{4}-\d{2}-\d{2}$/.test(date) ? new Date(date + "T00:00:00").getTime() : null;
  const dday = ms ? Math.ceil((startOfDay(ms) - todayKey()) / DAY) : null;
  const rows = ms ? PACK_PLAN.filter((p) => p.d <= (dday == null ? 99 : Math.max(dday, 0)) + 3) : [];

  return (
    <Fold icon="📦" title={dday == null ? "이사 준비 시작하기" : dday >= 0 ? `이사까지 ${dday}일` : "이사 뒤 정리 중"}
      sub="날짜를 넣으면 짐싸기를 하루치로 나눕니다" defaultOpen={dday != null && dday <= 7}>
        <div style={{ fontSize: 12.5, color: C.ink2, lineHeight: 1.65 }}>
          한 번에 다 싸려면 못 합니다. 날짜를 넣으면 <b style={{ color: C.ink }}>방마다 하루치로 쪼개서</b> 나눕니다.
        </div>
        <div className="flex gap-2" style={{ marginTop: 11 }}>
          <input className="hae" type="date" value={date} onChange={(e) => { setDate(e.target.value); setSt((sv) => ({ ...sv, moveDate: e.target.value })); }}
            style={{ flex: 1, border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "11px 12px", fontSize: 14, background: C.bg, color: C.ink }} />
          <button className="press" disabled={!ms} onClick={() => {
            const items = PACK_PLAN.map((p) => {
              const when = startOfDay(ms) - p.d * DAY;
              const left = Math.ceil((when - todayKey()) / DAY);
              const dt = new Date(when);
              return {
                title: p.t, category: p.d === -1 || p.d === 5 ? "finance" : "home",
                status: left <= 0 ? "now" : left <= 7 ? "week" : "remember",
                note: `${dt.getMonth() + 1}/${dt.getDate()} · ${p.n}`,

              const when = new Date(startOfDay(ms) - p.d * DAY);

              {item.kind === "buy" ? "미리 알았으면 좋았을 것" : "미리 준비해볼까요?"}
            </span>
          </div>
          <div style={{ fontSize: 16, fontWeight: 600, letterSpacing: "-.015em", lineHeight: 1.4 }}>{item.title}</div>
          <div style={{ fontSize: 13, color: C.ink2, marginTop: 7, lineHeight: 1.6 }}>{item.why}</div>
          {/* 웹에서 확인한 것이면 어디서 봤는지 밝힙니다. 지어낸 것과 구분되게 */}
          {item.src ? <div style={{ fontSize: 11.5, color: C.moss, marginTop: 8, background: C.mossSoft, borderRadius: 8, padding: "6px 9px", display: "inline-block" }}>🔎 {item.src}에서 확인</div> : null}
          <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 8 }}>
            {item.kind === "buy" ? "담으면 · 🛒 살 것 목록으로 들어갑니다" : <>담으면 · {cat.emoji} {cat.label} 영역으로 들어갑니다</>}
          </div>
          <LinkCards group={null} text={`${item.title} ${item.why || ""}`} />

          {/* 등록 버튼은 항상 한 줄을 통째로 씁니다 — 좁은 화면에서 밀려 안 보이던 문제 */}
          <button className="press w-full" onClick={onAdd}
            style={{ marginTop: 14, background: C.moss, color: "#fff", border: "none", borderRadius: R.md, padding: "15px 0", fontSize: 14.5, fontWeight: 600 }}>
            {item.kind === "buy" ? "살 것에 담기" : "할 일에 등록하기"}
          </button>
          <div className="flex gap-2" style={{ marginTop: 8 }}>
            <button className="press" onClick={onLater}
              style={{ flex: 1, background: C.bg, color: C.ink2, border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "11px 0", fontSize: 12.5 }}>{item.when || "나중에"} 다시</button>
            <button className="press" onClick={onNo}
              style={{ flex: 1, background: C.bg, color: C.ink2, border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "11px 0", fontSize: 12.5 }}>관심 없음</button>
          </div>
        </div>
      </Card>
    </div>
  );
}

/* ── 홈 ───────────────────────────────────────
   판단이 필요한 일은 3가지만. 매일 루틴은 체크리스트로 따로.
   나머지는 접어두고, 가족이 각자 자기 몫만 볼 수도 있게. */
function Home() {
  const { st, setSt, me, cats, setTab, addTasks, complete, say, log, setRoutine, routineAction, spendAI, refundAI } = use();
  const [all, setAll] = useState(false);
  const [only, setOnly] = useState("all");   /* all = 다 같이 보기 / mine = 내 몫만 */
  /* 루틴은 접은 채로 시작합니다. 매일 하는 일은 "살펴둘 일"이 아니라
     하던 대로 하면 되는 것이고, 그게 열일곱 줄 펼쳐져 있으면
     정작 봐야 할 세 가지가 묻힙니다. */
  const [openRoutine, setOpenRoutine] = useState(false);
  const [disc, setDisc] = useState([]);
  const [loadingDisc, setLoadingDisc] = useState(false);
  const asked = useRef(false);

  /* 카톡으로 그냥 전달하는 것과 뭐가 다른가 — 여기가 그 답입니다.
     전달은 매달 합니다. 정기로 만들어두면 다음부터는 공유조차 안 하셔도 됩니다. */
  const nudge = st.shareNudge && st.shareNudge.title ? st.shareNudge : null;
  /* 어른께 나갈 말 — 아침에 한 번 보여드립니다.
     이게 없으면 부모가 깜빡했을 때 "평소대로"가 나갑니다.
     아무것도 안 간 것보다 틀린 말이 간 것이 나쁩니다. */
  const callDay = nextCallDay(st);
  const callScr = st.callOn ? callScript(st, callDay) : "";
  const callTomorrow = callDay > todayKey();
  const callBatchN = st.callOn ? callBatches(st, callDay).length : 0;

  const recs = useMemo(() => buildRecommendations(st), [st]);
  const due = useMemo(() => dueRoutines(st), [st]);
  /* 기준 날짜를 아는 것만 오늘 화면에 올립니다 */
  const datedRecs = useMemo(() => recs.filter((r) => r.dateKnown), [recs]);
  const openTasks = st.tasks.filter((t) => !t.done);
  const meName = (st.members.find((m) => m.id === me) || {}).name || "";
  const spouse = st.members.find((m) => m.id !== me);

  /* 이미 분담이 끝난 일은 각자 화면에서만 — "내 몫만 보기" */
  const isMine = (owner) => owner === me;

  /* 오늘 살펴둘 일은 3가지까지만. 그 이상은 목록이 아니라 벽이 됩니다 */
  const limit = 3;

  /* 매일 하는 것과 가끔 하는 것을 나눕니다 */
  const visible = (ownerId) => only === "all" || isMine(ownerId);
  const dailyAll = due.filter((r) => ((st.routines[r.key] || {}).cycle || 30) <= 3);
  const daily = dailyAll.filter((r) => visible((st.routines[r.key] || {}).owner));
  const occasional = due.filter((r) => !dailyAll.includes(r) && visible((st.routines[r.key] || {}).owner));
  const mineRoutines = due.filter((r) => (st.routines[r.key] || {}).owner === me);

  /* 생각·판단이 필요한 일 (여기만 3개 원칙) */
  const doneToday = (r) => { const c = st.routines[r.key] || {}; return !!(c.lastAt && c.lastAt >= todayKey()); };
  /* 오늘 아직 안 한 매일 루틴 — 접힌 카드에도 이름이 그대로 보입니다 */
  const dailyLeft = daily.filter((r) => !doneToday(r));
  const visTasks = openTasks.filter((t) => visible(t.owner));
  /* 오늘 끝낸 루틴은 3개 정원에 넣지 않고, 취소선 상태로 뒤에 남겨둡니다 */
  /* 날짜가 오늘까지 온 일은 분류와 상관없이 맨 위로 올립니다.
     말할 때 "다음 주 화요일"이라고 한 게 그날 실제로 떠야 하니까요. */
  const dueNow = (t) => (t.dueAt || 0) <= todayKey() + DAY;
  const arrived = visTasks.filter((t) => t.status !== "buy" && dueNow(t))
    .sort((a, b) => (a.dueAt || 0) - (b.dueAt || 0));
  const rest = visTasks.filter((t) => !arrived.includes(t));
  /* 조부모께 전달하는 앱으로 좁히면서, 씨앗에서 저절로 나오던 것들을 뺐습니다.
     결혼기념일·가정통신문 추천·루틴 체크리스트 같은 것들입니다.
     남는 건 부모가 말하기로 직접 넣은 일뿐입니다 — 그게 어른께 갈 말이 됩니다. */
  const think = [
    ...arrived.map((t) => ({ kind: "task", t })),
    ...rest.filter((t) => t.status === "now").map((t) => ({ kind: "task", t })),
    ...rest.filter((t) => t.status === "week").map((t) => ({ kind: "task", t })),
  ].slice(0, limit);
  /* 세 개만 보여주는 건 벽을 만들지 않기 위해서입니다. 그건 그대로 둡니다.
     다만 접힌 쪽에 "오늘까지인 일"이 남아 있으면 그건 말해줘야 합니다.
     "기억하고 있는 26개"라고만 하면 안 엽니다 — 26개는 그것대로 벽이니까요.
     급한 게 몇 개인지 알면 엽니다. */
  const shownKeys = new Set(think.filter((x) => x.kind === "task").map((x) => x.t.id));
  /* 할 일만 셉니다. 정기 일정은 "이번 주 정기 일정"에 따로 자리가 있고,
     주기가 돌아온 것이지 오늘 안 하면 큰일 나는 게 아닙니다.
     그것까지 세면 숫자가 스무 개를 넘어가고, 그럼 이 줄도 벽이 됩니다. */
  const hiddenUrgent = arrived.filter((t) => !shownKeys.has(t.id));

  /* 오늘 끝낸 할 일도 지우지 않고 취소선 상태로 남겨둡니다 (루틴과 같은 규칙) */
  const doneTasksToday = st.tasks.filter((t) => t.done && (t.doneAt || 0) >= todayKey() && visible(t.owner) && (t.status === "now" || t.status === "week"));
  const thinkShown = [...think, ...doneTasksToday.map((t) => ({ kind: "task", t })), ...occasional.filter(doneToday).map((r) => ({ kind: "routine", r }))];
  /* 살 것은 여기서도 세지 않습니다. 나눌 일이 아니니까요 */
  const unowned = openTasks.filter((t) => !t.owner && t.status !== "buy").length + due.filter((r) => !(st.routines[r.key] || {}).owner).length;
  const remain = openTasks.length + due.length + datedRecs.length - think.length - daily.length;

  /* 방금 담은 일은 날짜가 아직 안 와서 위에 안 뜹니다.
     담고 넘어온 직후 한 번만 목록을 펼쳐서 "어디 갔지?"를 없앱니다 */
  useEffect(() => {
    if (!st.showAll) return;
    setAll(true);
    setSt((sv) => ({ ...sv, showAll: 0 }));
  }, [st.showAll]);

  useEffect(() => {
    const dueSnooze = (st.discoverSnoozed || []).filter((x) => x.dueAt <= Date.now());
    if (dueSnooze.length) {
      setDisc((d) => [...dueSnooze, ...d].slice(0, 3));
      setSt((sv) => ({ ...sv, discoverSnoozed: (sv.discoverSnoozed || []).filter((x) => x.dueAt > Date.now()) }));
    }
  }, [st.onboarded]);

  /* AI 제안은 주 2회(월·목)만 새로 찾습니다.
     매일 새 제안을 들이밀면 억지스러워지고 사용자도 피로해집니다.
     그 사이에는 마지막에 찾은 것을 그대로 보여줍니다. */
  useEffect(() => {
    if (asked.current || !st.onboarded) return;
    asked.current = true;
    const cache = st.discoverCache;
    const dow = new Date().getDay();                 /* 0=일 … 1=월, 4=목 */
    const isFindDay = dow === 1 || dow === 4;
    const fresh = cache && cache.date === todayStr();
    if (cache && (fresh || !isFindDay)) { setDisc((d) => (d.length ? d : cache.items || [])); return; }
    if (!cache && !isFindDay) {
      /* 처음 쓰는 분은 월·목이 아니어도 한 번은 보여줍니다 */
    }
    (async () => {
      setLoadingDisc(true);
      try {
        if (!spendAI("find", 1)) { setLoadingDisc(false); return; }
        const r = await askClaude(`당신은 한국 가정의 살림을 대신 기억해주는 AI 비서 '${BRAND}'입니다.

이 집이 지금 시기에 **"미리 알았으면 좋았을 텐데"** 하고 나중에 후회할 만한 것을 2개만 찾아주세요.

가구: ${householdLine(st)}
오늘 날짜: ${todayStr()}
사는 곳: ${(st.place && st.place.label) || "한국"}

        if (Array.isArray(r)) {

    const forced = !!st.newsAsk;
    if (!forced && (askedNews.current || (st.news || {}).month === mon)) return;

    /* 이달의 소식은 유료입니다. 매달 새로 찾아오는 것이 구독의 값어치이고,
       공공 지원부터 민간 서비스까지 여기로 들어옵니다.
       베타 동안에는 모두에게 엽니다 — 30가구는 값어치를 재는 사람들입니다. */
    const opened = !CHARGING() || st.plan === "paid";

      if (forced) { setSt((sv) => ({ ...sv, newsAsk: 0 })); setTab("news"); }

      if (!spendAI("find", 1)) { fail(`이번 달 ${AI_LABEL.find}를 다 쓰셨어요`); return; }

      try {

이 집이 이번 달에 알아두면 좋을 행정·지원 정보를 3~4개 찾아주세요.

/* ── 말하기 ───────────────────────────────────── */
function Speak() {
  const { st, setSt, cats, addTasks, me, say, setTab, log, spendAI, refundAI } = use();
  const [text, setText] = useState("");
  const [capped, setCapped] = useState(null);   /* 상한에 닿았을 때 보여줄 안내 */
  const [phase, setPhase] = useState("input");
  const [result, setResult] = useState([]);
  const [listening, setListening] = useState(false);
  const [shots, setShots] = useState([]);        /* 올린 사진 미리보기 */
  const [hasShot, setHasShot] = useState(false);  /* 사진을 올렸는지 — 안내 문구용 */
  const [answer, setAnswer] = useState("");       /* 질문에 대한 AI의 답 — 담기 전에 먼저 보여줌 */
  const [groupBy, setGroupBy] = useState("cat");  /* 결과를 영역별로 볼지 시점별로 볼지 */
  const fileRef = useRef(null);
  const [note, setNote] = useState("");
  const [failed, setFailed] = useState(false);
  /* 방금 어른께 넣은 것 — 결과 화면에서 바로 빼실 수 있게 */
  const [justCall, setJustCall] = useState(null);
  const [ex, setEx] = useState(0);
  const [edit, setEdit] = useState(null);
  /* 공유하기로 들어온 글인지. 결과 화면에서 "몇 번째인지"를 말해주려고 들고 있습니다 */
  const [fromShare, setFromShare] = useState(false);
  const [seenAgain, setSeenAgain] = useState(0);
  const rec = useRef(null);

  /* 영역 화면에서 예시 질문을 눌러 넘어온 경우 */
  useEffect(() => {
    if (!st.draft) return;
    const joined = (text ? text + " " : "") + st.draft;
    const run = st.draftRun;
    setText(joined);
    if (st.draftFrom === "share") setFromShare(true);
    setSt((sv) => ({ ...sv, draft: "", draftRun: false, draftFrom: "" }));
    /* 예시 질문을 눌러서 넘어온 것이면 한 번 더 누르게 하지 않고 바로 답합니다 */
    if (run) analyze(joined);
  }, [st.draft]);


  const startMic = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return setNote("이 브라우저에선 음성 입력이 안 돼요. 카톡 안이라면 Safari·Chrome으로 열어보세요. 아래에 적어도 결과는 같습니다.");
    try {
      const r = new SR(); r.lang = "ko-KR"; r.continuous = true; r.interimResults = true;
      r.onresult = (e) => { let s = ""; for (let i = 0; i < e.results.length; i++) s += e.results[i][0].transcript; setText(s); };
      r.onerror = () => { setListening(false); setNote("마이크를 못 켰어요. 팝업이 뜨면 '허용'을 눌러주세요. 카톡 안에서 여셨다면 Safari나 Chrome으로 열어야 마이크가 됩니다. 지금은 아래에 적어주셔도 결과는 같아요."); };
      r.onend = () => setListening(false);
      r.start(); rec.current = r; setListening(true); setNote("");
    } catch { setNote("음성 입력을 시작하지 못했어요."); }
  };
  const stopMic = () => { try { rec.current && rec.current.stop(); } catch {} setListening(false); };

  /* 사진으로 담기 — 알림장은 준비물로, 냉장고는 식단으로 */
  const pickPhoto = () => { if (fileRef.current) { fileRef.current.value = ""; fileRef.current.click(); } };
  /* 이알리미·키즈노트 캡처는 보통 클립보드에 있습니다. 저장 → 앨범에서 찾기를 건너뛰게.
