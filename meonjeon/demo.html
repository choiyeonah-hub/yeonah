    /* 아무것도 못 건졌으면 이번 시도는 없던 일로 하고 횟수를 돌려줍니다 */
    /* 어른께 갈 것이 있으면 그날 것으로 담습니다.
       부모는 한 군데에만 말하고, 갈래는 앱이 정합니다 —
       "어디에 말해야 하지"를 매번 정하게 하면 그게 다시 부모 일입니다. */
    if (callRows.length) {
      const cday = nextCallDay(st);
      setSt((sv) => {
        const rows = callRows.map((x) => ({
          id: uid("cl"),
          time: /^\d{1,2}:\d{2}$/.test(String(x.time || "")) ? x.time : "",
          what: callWhat(x.what),
          kind: ["sked", "med", "bag"].includes(x.kind) ? x.kind : "sked",
          kid: ((sv.children || []).find((k) => k.name && k.name === String(x.who || "")) || {}).id
               || ((sv.children || []).length === 1 ? (sv.children[0] || {}).id : ""),
          /* 여기서 false로 못박고 있었습니다. 그래서 "내일 3시 소아과"가
             아침 통에 묻히고, 정작 세 시 전에는 아무 전화도 안 갔습니다. */
          alert: !!x.alert && /^\d{1,2}:\d{2}$/.test(String(x.time || "")),
        })).filter((r) => r.what);
        return { ...sv, callToday: callMerge(sv, cday, rows), callOn: true };
      });
      const lab = ((st.elders || [])[0] || {}).label || "어른";
      const when = nextCallDay(st) > todayKey() ? "내일" : "오늘";
      /* 결과 화면에 보여주려고 들고 있습니다. 넣어놓고 안 보여주면
         부모가 "어른께 뭐가 갔지"를 전하기 탭까지 들어가서 확인해야 합니다. */
      setJustCall({ day: cday, when, label: lab, offAsk });
      log("talk_to_call", { n: callRows.length });
    }
    /* 실패했을 때 "두부 소진 · 휴지 구매"를 지어내 보여주던 자리입니다.
       화면 위에 "아래는 예시라 담지 마세요"라고 적어두긴 했는데,
       그건 앱이 거짓말을 해놓고 각주로 변명하는 것입니다.
       못 알아들었으면 못 알아들었다고만 하고 아무것도 만들지 않습니다. */
    /* 넣을 게 없어도 "쉬는 날?"은 물어봐야 합니다 */
    if (!callRows.length && offAsk) {
      const lab = ((st.elders || [])[0] || {}).label || "어른";
      setJustCall({ day: nextCallDay(st), when: nextCallDay(st) > todayKey() ? "내일" : "오늘", label: lab, offAsk: true });
    }
    if (!items.length && !gotAnswer && !callRows.length && !offAsk) { refundAI(kind, 1); setFailed(lastErr || true); }
    else setFailed(false);
    setShots([]);
    setResult(items); setPhase("result");
  };

  /* 어느 영역으로 넘어가는지 먼저 보이게, 기본은 영역별입니다 */
  const grouped = (groupBy === "cat"
    ? [...cats, { id: "etc", emoji: "🗂", label: "기타" }].map((c) => ({
        key: c.id, label: `${c.emoji} ${c.label}`, color: C.ink,
        hint: `${result.filter((r) => r.category === c.id).length}개`,
        items: result.filter((r) => r.category === c.id) }))
    : STATUS_ORDER.map((k) => ({
        key: k, label: STATUS[k].label, color: STATUS[k].fg, hint: STATUS[k].hint,
        items: result.filter((r) => r.status === k) }))
  ).filter((g) => g.items.length);
  const newCats = [...new Set(result.filter((r) => r.category === "etc" && r.newCategory).map((r) => r.newCategory))];

  /* 담기 — 화면 아래 고정 버튼과 맨 끝 버튼이 같은 동작을 씁니다 */
  const commit = () => {
    const n = addTasks(result, me);
    /* 공유로 들어온 것이면 제목별로 셉니다.
       두 번째부터는 "정기로 만들어두면 다음부터 공유 안 하셔도 됩니다"를 말해줍니다 —
       그게 카톡으로 그냥 전달하는 것과 다른 점입니다. */
    if (fromShare && result.length) {
      const keys = [...new Set(result.map((r) => shareKey(r.title)).filter(Boolean))];
      let most = 0;
      setSt((sv) => {
        const seen = { ...(sv.shareSeen || {}) };
        keys.forEach((k) => { seen[k] = (seen[k] || 0) + 1; most = Math.max(most, seen[k]); });
        /* 오래 쌓이면 저장이 커집니다. 많이 온 것부터 60개만 둡니다 */
        const trimmed = Object.entries(seen).sort((a, b) => b[1] - a[1]).slice(0, 60);
        return { ...sv, shareSeen: Object.fromEntries(trimmed) };
      });
      setSeenAgain(most);
    }
    const reps = result.filter((r) => r.repeatDays);
    if (reps.length) {
      setSt((sv) => {
        const cr = [...(sv.customRoutines || [])], ro = { ...sv.routines };
        reps.forEach((r) => {
          const nid = uid("cr");
          const cfg = { on: true, cycle: r.repeatDays, anchor: r.anchor || undefined,
            dows: (r.repeatDows && r.repeatDows.length) ? r.repeatDows : undefined,
            dow: r.repeatDow != null && r.repeatDow !== "" ? r.repeatDow : undefined,
            dom: r.repeatDom || undefined,
                  doms: (r.repeatDoms && r.repeatDoms.length) ? r.repeatDoms : undefined };
          cr.push({ id: nid, title: r.title, category: r.category, cycle: r.repeatDays });
          ro[`c:${nid}`] = { ...cfg,
            nextAt: r.anchor ? nextFromAnchor(r.anchor, 7)
              : (dowList(cfg).length || domList(cfg).length) ? nextByPattern(cfg)
              : Date.now() + r.repeatDays * DAY };
        });
        return { ...sv, customRoutines: cr, routines: ro };
      });
    }
    /* 날짜가 아직 멀면 "담았는데 안 보인다"가 됩니다. 언제 올라오는지 같이 알려줍니다 */
    const soon = result.map((r) => r.dueAt || 0).filter(Boolean).sort((a, b) => a - b)[0];
    const far = soon && soon > todayKey() + DAY ? new Date(soon) : null;
    say(reps.length ? `${n}개를 담고 ${reps.length}개는 정기로 등록했어요`
      : far ? `${n}개를 담았어요 · ${far.getMonth() + 1}/${far.getDate()}부터 올라와요`
      : `${n}개를 담았어요`);
    /* 같은 글이 두 번째로 들어왔으면 첫 화면에 한 번 남깁니다.
       토스트는 3초면 사라져서, 정작 알려줘야 할 것을 못 알립니다. */
    const twice = fromShare && result.find((r) => (st.shareSeen || {})[shareKey(r.title)] >= 1);
    setSt((sv) => ({ ...sv, showAll: Date.now(),
      shareNudge: twice ? { title: twice.title, at: Date.now() } : sv.shareNudge }));
    setTab("home");
  };

  if (capped) {
    const left = leftOf(st, capped), lim = limitOf(st, capped);
    return (
      <>
        <div style={{ marginTop: 20, paddingLeft: 2 }}>
          <div className="disp" style={{ fontSize: 22, fontWeight: 600 }}>이번 달 {AI_LABEL[capped]}를 다 쓰셨어요</div>
          <p style={{ fontSize: 13.5, color: C.ink2, marginTop: 9, lineHeight: 1.75 }}>
            무료로 쓰시는 동안 한 달에 {lim}번까지 도와드리고 있어요. {nextResetLabel()}에 다시 채워집니다.
          </p>
        </div>
        <Card style={{ marginTop: 16, borderColor: C.moss }}>
          <div style={{ padding: 17 }}>
            <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 8 }}>그동안에도 그대로 챙깁니다</div>
            <div style={{ fontSize: 13, color: C.ink2, lineHeight: 1.8 }}>
              직접 적으신 일은 <b>횟수와 상관없이</b> 담기고, 정기 일정과 미리 알려드리는 것도 계속 돌아갑니다.
              AI가 대신 정리해주는 것만 잠깐 쉬는 거예요.
            </div>
          </div>
        </Card>
        <div style={{ marginTop: 18 }}>
          <Btn kind="accent" onClick={() => { setCapped(null); setResult([{ title: text.trim().slice(0, 20) || "", category: (cats[0] || {}).id, status: "week", note: "" }]); setPhase("result"); setEdit(0); }}>
            직접 적어서 담기
          </Btn>
          <div style={{ height: 8 }} />
          <Btn kind="ghost" onClick={() => { setCapped(null); setTab("home"); }}>오늘 화면으로</Btn>
        </div>
      </>
    );
  }

  if (phase === "thinking") return (
    <Card style={{ marginTop: 14 }}>
      <div style={{ padding: "48px 20px", textAlign: "center" }}>
        <div className="disp" style={{ fontSize: 17, fontWeight: 600, marginBottom: 22 }}>머릿속을 펼치는 중</div>
        <div className="flex flex-wrap justify-center gap-2">
          {toFragments(text).map((w, i) => (
            <span key={i} className="frag" style={{ "--r": `${(i % 5) - 2}deg`, animationDelay: `${i * 90}ms`, background: C.bg, border: `1px solid ${C.line}`, borderRadius: 9, padding: "5px 9px", fontSize: 12, color: C.ink2 }}>{w}</span>
          ))}
        </div>
        <div className="mono" style={{ fontSize: 10.5, color: C.ink3, marginTop: 26 }}>카테고리 · 시점 · 선행 판단 중</div>
      </div>
    </Card>
  );

  if (phase === "result") return (
    <>
      <div style={{ marginTop: 20, paddingLeft: 2 }}>
        {/* 어른께 간 것까지 세야 합니다. "1개로 정리했어요" 아래에
            아홉 줄이 깔려 있으면 그 숫자가 거짓말이 됩니다. */}
        <div className="disp" style={{ fontSize: 22, fontWeight: 600 }}>
          {answer ? "이렇게 해보면 어때요?"
            : justCall && justCall.day
              ? `${result.length}개는 내 할 일로, ${callAllFor(st, justCall.day).length}개는 ${justCall.label}께`
              : `${result.length}개로 정리했어요`}
        </div>
        <p style={{ fontSize: 13.5, color: C.ink2, marginTop: 7, lineHeight: 1.65 }}>
          {answer ? "괜찮으면 아래에서 필요한 일만 담으세요."
            : "어른께 갈 것은 이미 담겼어요. 내 할 일은 담아야 오늘 화면에 남습니다."}
        </p>
        {/* 어른께 간 것을 안 보여주면 부모가 전하기 탭까지 들어가 확인해야 합니다.
            여기서 바로 보고 바로 뺄 수 있어야 합니다. */}
        {/* "내일 아빠 연차야" — 앱이 마음대로 끄지 않습니다.
            연차가 반드시 "안 맡긴다"는 뜻은 아니고, 잘못 끄면
            그날 하원을 아무도 안 갑니다. 그게 제일 나쁜 실패라
            한 번 여쭙고 부모가 누르셔야 꺼집니다. */}
        {justCall && justCall.offAsk && (() => {
          const day = justCall.day;
          const off = ((st.callToday || {})[day] || {}).off;
          const n = off ? 0 : callBatches(st, day).length;
          return (
            <Card style={{ marginTop: 14, borderColor: off ? C.line : C.persim }}>
              <div style={{ padding: "14px 16px" }}>
                {off ? (
                  <>
                    <div style={{ fontSize: 13.5, color: C.ink2, lineHeight: 1.75 }}>
                      <b style={{ color: C.ink }}>{justCall.when}은 쉽니다.</b> {justCall.label}께 아무것도 안 갑니다.
                    </div>
                    <button className="press" onClick={() => setSt((sv) => {
                      const t = { ...(sv.callToday || {}) }; t[day] = { ...(t[day] || {}), off: false };
                      return { ...sv, callToday: t };
                    })} style={{ marginTop: 10, background: "transparent", border: `1px solid ${C.line}`, borderRadius: 999, padding: "7px 14px", fontSize: 12.5, color: C.ink2 }}>
                      다시 켜기
                    </button>
                  </>
                ) : (
                  <>
                    <div style={{ fontSize: 13.5, color: C.ink, fontWeight: 600, marginBottom: 6 }}>
                      {justCall.when}은 안 맡기시나요?
                    </div>
                    <div style={{ fontSize: 12.5, color: C.ink3, lineHeight: 1.75, marginBottom: 11 }}>
                      그렇게 들려서 여쭙니다. <b style={{ color: C.ink2 }}>끄면 {justCall.label}께 갈 {n}건이 안 나갑니다.</b><br />
                      연차셔도 아이는 그대로 맡기시는 날이면 그냥 두세요 —
                      <b style={{ color: C.ink2 }}>안 나가는 쪽이 더 위험합니다.</b>
                    </div>
                    <div className="flex gap-2">
                      <button className="press" onClick={() => { setSt((sv) => {
                        const t = { ...(sv.callToday || {}) }; t[day] = { ...(t[day] || {}), off: true };
                        return { ...sv, callToday: t };
                      }); say(`${justCall.when}은 쉬는 것으로 했어요`); log("call_off_day", {}); }}
                        style={{ flex: 1, background: C.persimSoft, color: C.persim, border: "none", borderRadius: 12, padding: "11px 0", fontSize: 13.5, fontWeight: 600 }}>
                        네, 하루 다 쉽니다
                      </button>
                      <button className="press" onClick={() => setJustCall((v) => ({ ...v, offAsk: false }))}
                        style={{ flex: 1, background: "transparent", color: C.ink2, border: `1px solid ${C.line}`, borderRadius: 12, padding: "11px 0", fontSize: 13.5 }}>
                        아니요, 그대로
                      </button>
                    </div>
                    {/* 반차가 제일 흔합니다. 오전 반차면 등원만 빠지고 하원은 그대로예요.
                        하루를 통째로 끄면 하원이 같이 꺼져서, 그게 제일 위험한 실수입니다. */}
                    <button className="press" onClick={() => setJustCall((v) => ({ ...v, part: !v.part }))}
                      style={{ width: "100%", marginTop: 8, background: "transparent", color: C.moss, border: "none", padding: "8px 0", fontSize: 12.5, fontWeight: 600 }}>
                      {justCall.part ? "접기" : "반차라 몇 개만 뺄게요"}
                    </button>
                    {justCall.part && (() => {
                      const all = callAllFor(st, day);
                      const skip = ((st.callToday || {})[day] || {}).skip || [];
                      if (!all.length) return (
                        <div style={{ fontSize: 12.5, color: C.ink3, padding: "4px 2px 2px" }}>
                          {justCall.when} {justCall.label}께 갈 것이 없습니다.
                        </div>
                      );
                      return (
                        <div style={{ borderTop: `1px solid ${C.lineSoft}`, paddingTop: 8 }}>
                          <div style={{ fontSize: 11.5, color: C.ink3, marginBottom: 7 }}>
                            뺄 것을 눌러주세요. 나머지는 그대로 나갑니다.
                          </div>
                          <div className="flex flex-col gap-1">
                            {all.map((r) => {
                              const gone = skip.indexOf(r.id) >= 0;
                              return (
                                <button key={r.id} className="press" onClick={() => setSt((sv) => {
                                  const t = { ...(sv.callToday || {}) };
                                  const cur = (t[day] || {}).skip || [];
                                  const next = gone ? cur.filter((x) => x !== r.id) : cur.concat([r.id]);
                                  t[day] = { ...(t[day] || {}), skip: next };
                                  return { ...sv, callToday: t };
                                })}
                                  style={{ display: "flex", alignItems: "center", gap: 8, textAlign: "left",
                                           background: gone ? C.lineSoft : "transparent",
                                           border: `1px solid ${gone ? C.line : C.lineSoft}`,
                                           borderRadius: 10, padding: "8px 10px", fontSize: 13,
                                           color: gone ? C.ink3 : C.ink,
                                           textDecoration: gone ? "line-through" : "none" }}>
                                  <span style={{ fontSize: 11.5, color: gone ? C.ink3 : C.moss, minWidth: 42, fontWeight: 600 }}>
                                    {/^\d{1,2}:\d{2}$/.test(String(r.time || "")) ? r.time : "시각없음"}
                                  </span>
                                  <span style={{ flex: 1 }}>{r.what}</span>
                                  <span style={{ fontSize: 11.5, color: C.ink3 }}>{gone ? "뺐음" : "뺄까요"}</span>
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })()}
                  </>
                )}
              </div>
            </Card>
          );
        })()}
        {justCall && (() => {
          /* 말씀하신 것만 보여주고 있었습니다. 그래서 "이렇게 갑니다" 아래에
             요일 계획은 안 보이고, 순서도 말한 차례 그대로였습니다.
             실제로 나갈 것을 시간순으로 그대로 보여줍니다. */
          const rows = callItemsFor(st, justCall.day);
          if (!rows.length) return null;
          return (
            <Card style={{ marginTop: 14, borderColor: C.moss }}>
              <div style={{ padding: "14px 16px" }}>
                <div style={{ fontSize: 13.5, fontWeight: 600, color: C.moss, marginBottom: 9 }}>
                  ☏ {justCall.when} {justCall.label}께 이렇게 갑니다
                </div>
                {rows.map((r) => (
                  <div key={r.id} className="flex items-center justify-between" style={{ padding: "7px 0", borderTop: `1px solid ${C.lineSoft}` }}>
                    <span style={{ fontSize: 13.5, color: C.ink }}>
                      <b className="mono" style={{ fontSize: 11.5, color: C.moss, marginRight: 7, fontWeight: 500 }}>
                        {r.kind === "bag" ? "가방" : r.kind === "med" ? "약" : (r.time || "—")}
                      </b>
                      {r.what}
                    </span>
                    {/* 말씀해서 담긴 것은 지우고, 요일 계획에서 온 것은 그날만 빼둡니다.
                        계획을 지워버리면 다음 주 화요일 하원까지 같이 사라집니다. */}
                    <button className="press" onClick={() => setSt((sv) => {
                      const t = { ...(sv.callToday || {}) };
                      const cur = t[justCall.day] || {};
                      const 말한것 = (cur.add || []).some((x) => x.id === r.id);
                      t[justCall.day] = 말한것
                        ? { ...cur, add: (cur.add || []).filter((x) => x.id !== r.id) }
                        : { ...cur, skip: (cur.skip || []).concat([r.id]) };
                      return { ...sv, callToday: t };
                    })} style={{ background: "transparent", border: "none", color: C.ink3, fontSize: 12 }}>빼기</button>
                  </div>
                ))}
                <button className="press" onClick={() => setTab("call")}
                  style={{ marginTop: 11, background: "transparent", border: `1px solid ${C.line}`, borderRadius: 999, padding: "7px 14px", fontSize: 12.5, color: C.ink2 }}>
                  시각·말투 고치기
                </button>
              </div>
            </Card>
          );
        })()}
        {failed && <div style={{ marginTop: 12, background: C.sunSoft, color: C.sun, borderRadius: 12, padding: "11px 13px", fontSize: 12.5, lineHeight: 1.7 }}>
          {typeof failed === "string" ? failed : "이번엔 못 알아들었어요."} 아무것도 담지 않았습니다 — 횟수도 안 깎였어요.
          시각과 무엇을 하실지 같이 말씀해 보세요. 예: “내일 3시 소아과”
        </div>}
        {newCats.length > 0 && <div style={{ marginTop: 12, background: C.mossSoft, color: C.moss, borderRadius: 12, padding: "11px 13px", fontSize: 12.5, lineHeight: 1.6 }}>
          지금 카테고리에 없는 이야기가 있어요. <b>{newCats.join(", ")}</b>은 기타로 담아둘게요. 영역 화면에서 새로 만들 수 있습니다.
        </div>}
      </div>
      {answer && (
        <Card style={{ marginTop: 16, borderColor: C.sprout }}>
          <div style={{ padding: 17 }}>
            <div className="flex items-center gap-2" style={{ marginBottom: 10 }}>
              <Avatar member="ai" size={22} />
              <span className="mono" style={{ fontSize: 9.5, color: C.moss }}>{BRAND}의 답</span>
            </div>
            <div style={{ fontSize: 14, lineHeight: 1.85, whiteSpace: "pre-wrap" }}>{answer}</div>
            <LinkCards group={null} text={answer.slice(0, 60)} compact />
          </div>
        </Card>
      )}
      {answer && result.length > 0 && (
        <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 16, paddingLeft: 3, fontWeight: 600 }}>이걸 하려면 이런 일이 필요해요 👇</div>
      )}
      {result.length > 1 && (
        <div className="flex items-center gap-2" style={{ marginTop: 16, paddingLeft: 3 }}>
          <span style={{ fontSize: 11.5, color: C.ink3 }}>묶어 보기</span>
        </div>
      )}

            <Btn onClick={() => setEdit(null)} style={{ marginTop: 18 }}>확인</Btn>

      </div>

      {result.length > 0 && (

        <div style={{ padding: 18 }}>
          <div className="flex justify-center" style={{ position: "relative", height: 96, marginBottom: 4 }}>

              style={{ width: 80, height: 80, borderRadius: 999, marginTop: 8, background: listening ? C.persim : C.moss, color: "#fff", border: "none", fontSize: 26, boxShadow: SHADOW_LIFT }}>{listening ? "■" : "🎙"}</button>
          </div>

            <div style={{ marginTop: 12, background: C.mossSoft, color: C.moss, borderRadius: 12, padding: "11px 13px", fontSize: 12.5, lineHeight: 1.7 }}>

              그 선을 흐리면 부모가 매일 여기에 들어와 다시 적게 되고,

            <br />“내일 3시 소아과 데려가주셔야 해, 예약은 내가 잡고” 하시면 —

              try {
                const t = await navigator.clipboard.readText();
                if (!t || !t.trim()) return setNote("복사해둔 글이 없어요. 카톡에서 메시지를 길게 눌러 복사한 뒤 다시 눌러주세요.");
                setText((v) => (v ? v + "\n" : "") + t.trim().slice(0, 4000));
                setFromShare(true); setNote("");
              } catch {
                setNote("붙여넣기 권한이 막혀 있어요. 위 칸을 길게 눌러 붙여넣기 하셔도 결과는 같습니다.");
              }
            }} style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "9px 14px", fontSize: 12, color: C.ink2 }}>📋 카톡 글 붙여넣기</button>
            <button className="press" onClick={() => setText(DEMO_SPEECH)}
              style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.pill, padding: "9px 14px", fontSize: 12, color: C.ink2 }}>시연용 예시</button>
          </div>
          <input ref={fileRef} type="file" accept="image/*" multiple style={{ display: "none" }} onChange={onFiles} />
          <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 9, lineHeight: 1.65 }}>
            알림장·가정통신문·학원 문자 캡처를 읽어 <b style={{ color: C.ink2 }}>날짜와 준비물</b>만 뽑습니다.
            그게 그대로 어른께 갈 말이 됩니다.<br />
            {/* 종이를 찍으면 그림자와 각도 때문에 글자가 뭉갭니다.
                화면 캡처는 글자가 그대로라 훨씬 잘 읽힙니다. */}
            <b style={{ color: C.ink2 }}>화면 캡처가 사진보다 잘 읽힙니다.</b> 종이를 찍으면 그림자와 각도 때문에 글자가 뭉개져요.
            키즈노트·문자는 캡처하시고, 종이만 있을 때는 평평하게 펴서 위에서 찍어주세요.
          </div>
          {st.plan !== "paid" && leftOf(st, "talk") <= 5 && (
            <div style={{ fontSize: 11.5, color: leftOf(st, "talk") ? C.ink3 : C.persim, marginTop: 10, lineHeight: 1.65 }}>
              {leftOf(st, "talk")
                ? `이번 달 AI 정리 ${leftOf(st, "talk")}번 남았어요 · ${nextResetLabel()}에 다시 채워집니다`
                : `이번 달 AI 정리를 다 쓰셨어요. 직접 적으시면 그대로 챙깁니다 · ${nextResetLabel()}에 다시 채워집니다`}
            </div>
          )}
          {hasShot && <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 9, lineHeight: 1.6 }}>
            사진은 크기를 줄여 AI에 보내고 <b style={{ color: C.ink2 }}>앱에는 저장하지 않습니다</b>. 뽑아낸 할 일만 남아요.
          </div>}

          <div style={{ height: 14 }} />
          <Btn onClick={() => analyze()}>{shots.length ? "사진까지 같이 정리해줘" : "정리해줘"}</Btn>
        </div>
      </Card>

    </>
  );
}

/* 제도 이름만 알려주는 건 소용이 없습니다. "응급안전안심서비스"라고 적어두면
   그게 뭔지 몰라서 그냥 지나갑니다. 무엇을 해주고, 어디에 말하면 되고,
   무엇 때문에 놓치는지 — 세 줄이 있어야 움직입니다.

   금액과 나이는 적지 않습니다. 지자체마다 다르고 해마다 바뀌는데,
   앱이 숫자를 말해버리면 그게 틀렸을 때 사용자가 손해를 봅니다.
   "어디에 물어보면 되는지"까지가 앱이 책임질 수 있는 범위입니다. */
/* ── 미리 사두기 ─────────────────────────────────
   이 앱이 복지 앱과 갈라지는 지점입니다.

   ① 행사 날짜를 몰라도 됩니다.
      원마다 물놀이 날짜는 다릅니다. 그런데 5월에 수영복을 사두면
      7월보다 싸다는 건 어느 원을 다니든 같습니다.
      그래서 아이 나이(w)가 아니라 달력 월(mo)로 띄웁니다.

   ③ 필요한 시점이 아니라 값이 싼 시점에 띄웁니다.
      행사 3주 전은 부모들이 다 같이 사는 때라 제일 비싸고 품절입니다.
      그때 알려주는 건 "늦었다"를 알려주는 것에 가깝습니다.

   싸다고 열두 달 앞서 사면 아이 키가 달라집니다. 세 살에서 일곱 살은
   한 해에 5~7cm 자랍니다. 그래서 risk가 붙은 것에는 반드시
   "한 사이즈 크게"를 같이 말합니다. 앱이 시켜서 산 옷이 안 맞으면
   그 앱은 지워집니다. */
/* ── 무엇을 "미리 사두기"에 넣을 것인가 ─────────────
   기준을 두 번 틀렸습니다. 처음엔 "값이 싼 때"로 봤고, 그다음엔 "다이소에 있느냐"로 봤습니다.
   둘 다 아닙니다. 맞는 기준은 이겁니다 —

     생활용품(기능만 하면 되는 것) → 다이소·마트에서 삽니다.
       언제든 있고 값 차이가 작아서 미리 알릴 값이 없습니다.
       예: 문구류(색연필·크레파스·풀), 세제, 수건

     패션이 조금이라도 들어가는 것 → 다이소에 있어도 안 삽니다. 인터넷에서 삽니다.
       다이소 것은 종류가 적고 사이즈가 몇 개 없고 예쁘지 않아서입니다.
       예: 할로윈 의상, 한복, 래시가드, 발표회 옷

   즉 "다이소에 있느냐"가 아니라 "다이소에서 사느냐"입니다.
   아이가 입는 것, 남에게 보이는 것은 다 후자입니다.

   그런데 여기서 한 번 더 걸러야 합니다. 패션이라고 다 넣으면 안 됩니다.
   미리 사서 실제로 얻는 게 있어야 합니다. 셋 중 하나입니다 —

     ① 값  — 그 시기에만 싼가 (래시가드 5월, 한복 설 직후, 할로윈 해외 시즌오프)
     ② 배송 — 지금 주문해야 그때 오는가 (해외직구)
     ③ 있고 없고 — 그때만 있는가 (당근에 올라오는 작년 것, 대여 자리)

   셋 다 아니면 넣지 않습니다. 늦게 사도 되는 항목입니다.

   반례를 하나 적어둡니다 — 아이 겨울 패딩·부츠는 뺐습니다.
     1~2월 재고정리가 싸긴 한데, 그렇게 싸지는 건 쿠팡에서 사는 값싼 것입니다.
     패션을 보고 고르는 곳(네이버쇼핑 같은 데)에서는 미리 산다고 값이 안 내려갑니다.
     사이즈도 남고, 늦게 사도 됩니다. 그래서 미리 알릴 값이 없습니다.

   새 항목을 넣기 전에 이 두 질문을 먼저 하세요:
     1) "이걸 다이소에서 사는가?"            — 산다면 넣지 않습니다.
     2) "미리 사면 값·배송·있고 없고 중 뭐가 달라지는가?" — 아무것도 안 달라지면 넣지 않습니다.
   ─────────────────────────────────────────── */
const AHEAD = [
  { id: "B02", mo: [2], cat: "kid", w: [12, 108], g: "한복", t: "한복 미리 보기",
    why: "설이 지나 수요가 뚝 떨어집니다. 연중 비수기라 대여도 자리가 있습니다.",
    use: "7개월 뒤 (추석)", risk: "high",
    ask: "원에 한복 입는 행사가 있는지 먼저 물어보세요.",

/* ── 유용정보 ─────────────────────────────────
   복지는 마감이 없습니다. 날짜를 붙이면 "시점 미정"만 쌓이고,
   할 일로 담으면 목록이 읽을 수 없게 길어집니다.
   여기서는 갈래별로 띄워두기만 합니다 — 해당되니 알아보세요, 까지입니다.

   흩어져 있던 것을 걷었습니다. 예전에는 같은 항목이 영역에도,
   타임라인에도, 맡기기에도 있었습니다. 이제 이 한 화면뿐입니다. */
function usefulItems(st) {
  const kids = st.children || [];
  /* 증여처럼 아예 해당 없는 집이 있습니다. 그런 항목이 계속 떠 있으면
     유용정보 전체가 "나랑 상관없는 것들"로 보입니다.
     그래서 항목마다 "필요 없어요"를 둡니다 — 다만 지우지는 않습니다.
     설정에서 언제든 되돌릴 수 있어야 합니다. 실수 한 번으로 영영
     못 보게 되면, 그 다음부터는 아무 버튼도 못 누릅니다. */
  const off = st.wfOff || {};
  const fits = (sd) => {
    if (!sd.wf) return false;
    if (sd.f && !st.flags[sd.f]) return false;
    if (sd.nkid && kids.length < sd.nkid) return false;
    if (sd.kid) {
      const w = sd.w || [0, 9999];
      if (!kids.some((ch) => { const m = childMonths(ch); return m >= w[0] && m <= w[1]; })) return false;
    }
    return true;
  };
  const out = SEED.filter((sd) => fits(sd) && !off[sd.id]).map((sd) => ({
    key: sd.id, cat: sd.cat, title: sd.t, g: sd.g, chg: sd.chg,
    ...(WELFARE_DETAIL[sd.id] || {}),
  }));
  /* 날짜를 아는 것에서 역산 — 경조사에 넣어둔 생일·기념일이 재료입니다.
     여기서 뜨는 이유는 날짜를 알려드리려는 게 아니라,
     그 준비를 언제 시작해야 싼지를 알려드리려는 것입니다. */
  const names = kids.map((c) => String(c.name || "").trim()).filter(Boolean);
  (st.customRoutines || []).forEach((cr) => {
    if (!cr || cr.category !== "event") return;
    const cfg = (st.routines || {})[`c:${cr.id}`] || {};
    if (!cfg.anchor) return;
    const at = nextFromAnchor(cfg.anchor, 0);
    if (!at) return;
    const left = Math.round((at - todayKey()) / DAY);
    DATED.forEach((d) => {
      if (!d.match.test(cr.title || "")) return;
      /* 돌잔치를 남편 생일에 권하면 안 됩니다 */
      if (d.kidOnly && !names.some((n) => (cr.title || "").indexOf(n) >= 0)) return;
      /* 창을 두지 않으면 반년 내내 같은 카드가 붙어 있습니다 */
      if (left > d.days || left <= d.days - 30) return;
      if (off[`${d.id}:${cr.id}`]) return;
      out.push({
        key: `${d.id}:${cr.id}`, cat: d.cat, dated: 1,
        title: `${cr.title} — ${d.t}`, what: d.why,
        use: `${anchorLabel(cfg.anchor)}까지 ${left}일 남았어요`,
        tip: d.tip, buy: d.buy,
      });
    });
  });
  /* 미리 사두기 — 달력 월로 뜹니다.
     아이가 없으면 원 행사도 없어서 하나도 안 뜹니다. */
  const mon = new Date().getMonth() + 1;
  const yr = new Date().getFullYear();
  /* 2월에 한복을 챙겼으면 7월에 "추석 한복 사이즈 점검"이 또 뜨면 안 됩니다.
     같은 물건을 두 번 사라고 하는 셈입니다. 그래서 같은 묶음(g)은
     올해 한 번 "챙겼어요"를 누르면 그 해 동안 통째로 내려갑니다. */
  const done = st.aheadDone || {};
  AHEAD.forEach((a) => {
    if (a.mo && a.mo.indexOf(mon) < 0) return;
    if (off[a.id]) return;
    if (a.g && done[a.g] === yr) return;
    /* 영역 이름은 BASE_CATS에 있는 것만 씁니다.
       "house"나 "kid"처럼 없는 이름을 넣으면 유용정보에서는 '기타'로 묶이고,
       할 일로 담으면 영역 화면에 없는 칸으로 들어가 사라집니다. */
    let cat = a.cat === "house" ? "home" : a.cat;
    if (a.w) {
      const w = a.w;
      const ch = kids.find((c) => { const m = childMonths(c); return m >= w[0] && m <= w[1]; });
      if (!ch) return;
      /* 아이 항목은 그 아이 칸으로 보냅니다. 아이가 둘이면 나이가 맞는 쪽입니다. */
      if (cat === "kid") cat = `kid:${ch.id}`;
    } else if (cat === "kid") {
      cat = "etc";
    }
    out.push({
      key: a.id, cat, title: a.t, what: a.why,
      use: a.use, risk: a.risk, tip: a.tip, ask: a.ask, buy: a.buy, g2: a.g, ahead: 1,
    });
  });
  /* 달마다 AI가 찾아온 것도 같은 목록에 섞습니다.
     "이달의 소식"이라고 따로 붙이면 자리가 또 하나 늘어납니다. */
  ((st.news || {}).items || []).forEach((n, i) => {
    if (!n || !n.title) return;
    if (off[`n${i}`]) return;
    out.push({ key: `n${i}`, cat: n.category || "etc", title: n.title, what: n.body,
      where: n.src || "", fresh: 1, url: n.url || "" });
  });
  return out;
}

/* ④ 사기 전에 순서를 제안합니다.
   이 앱이 쇼핑앱과 갈라지는 지점입니다. "안 사도 되는 걸 안 사게 해준다"가
   사람들이 이 앱을 믿는 이유고, 그걸 깨면 남을 이유가 없어집니다.
   그래서 구매는 맨 아래에 둡니다.

   외동은 "물려받기" 칸이 비어 있습니다. 형제가 없으니까요.
   그 집에는 대여와 당근이 더 중요합니다. */
function BuyOrder({ text }) {
  const { st } = use();
  const solo = (st.children || []).length < 2;
  const near = String((st && st.region) || "").trim();
  const q = encodeURIComponent(String(text || "").replace(/ 미리 보기| 최종 점검|·.*$/g, "").slice(0, 20));
  const steps = [
    { t: "집에 있는지 먼저 보기", d: "작년 것이 그대로 있는 경우가 많습니다" },
    !solo && { t: "형제에게 물려받기", d: "위 아이가 쓰던 것부터" },
    { t: "당근에서 찾기", d: "철 지난 것이 싸게 나옵니다",
      u: `https://www.daangn.com/search/${q}` },
    { t: "빌릴 수 있는지 보기", d: solo ? "형제가 없으면 여기가 제일 낫습니다" : "한두 번 쓰는 것은 빌리는 게 낫습니다",
      u: `https://map.naver.com/p/search/${encodeURIComponent((near ? near + " " : "") + "육아종합지원센터")}` },
    { t: "그래도 없으면 사기", d: "여기까지 왔으면 사셔도 됩니다" },
  ].filter(Boolean);
  return (
    <div style={{ marginTop: 13 }}>
      <div className="mono" style={{ fontSize: 9.5, color: C.moss, marginBottom: 8 }}>사기 전에</div>
      {steps.map((x, i) => (
        <div key={i} style={{ display: "flex", gap: 10, alignItems: "baseline", marginBottom: 7 }}>
          <span className="mono" style={{ fontSize: 10, color: C.ink3, flex: "none", width: 14 }}>{i + 1}</span>
          <div style={{ flex: 1, minWidth: 0 }}>
            {x.u ? (
              <a className="press" href={x.u} target="_blank" rel="noopener noreferrer"
                style={{ fontSize: 13.5, color: C.ink, textDecoration: "none", borderBottom: `1px solid ${C.line}` }}>
                {x.t} ›
              </a>
            ) : (
              <span style={{ fontSize: 13.5, color: C.ink }}>{x.t}</span>
            )}
            <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 2, lineHeight: 1.6 }}>{x.d}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

/* 쓰는 날을 넣으면 하루 전에 알립니다.
   유용정보는 할 일을 안 만드는 자리입니다. 다만 사용자가 날짜를 직접 넣은 것은
   앱이 짐작한 것이 아니라 사용자가 정한 것이라, 그때는 할 일이 되어도 됩니다.
   가정통신문 사진으로 날짜가 확정될 때와 같은 규칙입니다. */
function WhenUse({ item }) {
  const { st, setSt, say, addTasks } = use();
  const saved = (st.aheadWhen || {})[item.key] || "";
  const [v, setV] = useState(saved);
  const put = (mmdd) => {
    const ev = parseWhen(mmdd);
    if (!ev) return say("월-일을 넣어주세요 (예: 10-31)");
    setSt((sv) => ({ ...sv, aheadWhen: { ...(sv.aheadWhen || {}), [item.key]: mmdd } }));
    addTasks([{ title: item.title.replace(/ 미리 보기| 최종 점검/g, ""), category: item.cat,
      status: "week", eventAt: ev, lead: 1, note: "쓰는 날 하루 전에 올라옵니다" }], "self");
    say("하루 전에 알려드립니다");
  };
  const off = () => {
    setSt((sv) => { const m = { ...(sv.aheadWhen || {}) }; delete m[item.key]; return { ...sv, aheadWhen: m }; });
    setV(""); say("알림을 껐습니다");
  };
  return (
    <div style={{ marginTop: 14, borderTop: `1px solid ${C.line}`, paddingTop: 13 }}>
      <div style={{ fontSize: 12.5, color: C.ink, lineHeight: 1.7 }}>
        지금 안 사셔도 됩니다. <b>쓰는 날을 아시면 넣어두세요</b> — 하루 전에 알립니다.
      </div>
      <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 4, lineHeight: 1.6 }}>
        안 넣으면 알림은 없습니다. 이 자리에만 계속 떠 있습니다.
      </div>
      {saved ? (
        <div className="flex items-center gap-2" style={{ marginTop: 10 }}>
          <span className="mono" style={{ fontSize: 12.5, color: C.moss }}>{saved} 하루 전에 알림</span>
          <button className="press" onClick={off}
            style={{ background: "transparent", border: `1px solid ${C.line}`, borderRadius: 999,
              padding: "6px 12px", fontSize: 12, color: C.ink3 }}>끄기</button>
        </div>
      ) : (
        <div className="flex gap-2" style={{ marginTop: 10 }}>
          <input className="hae" value={v} onChange={(e) => setV(e.target.value)} placeholder="10-31"
            inputMode="numeric"
            style={{ flex: 1, minWidth: 0, border: `1px solid ${C.line}`, borderRadius: 11,
              padding: "10px 12px", fontSize: 14, background: C.bg, color: C.ink }} />
          <button className="press" onClick={() => put(v.trim())}
            style={{ flex: "none", background: C.moss, color: "#fff", border: "none",
              borderRadius: 11, padding: "10px 16px", fontSize: 12.5, fontWeight: 600 }}>넣기</button>
        </div>
      )}
    </div>
  );
}

/* 자동차 검사·보험 시점 —
   보험사·검사기관 API는 본인인증 없이는 열리지 않습니다. 그래서 연동 대신
   최초등록 연월과 보험 갱신월만 한 번 받고, 날짜는 법정 주기로 계산합니다. */
/* 차마다 검사일도 보험 갱신 달도 다릅니다. 한 대씩 따로 받습니다. */
function CarOne({ car, idx, n }) {
  const { st, setSt, say, setTab } = use();
  const insp = nextCarInspection(car.firstReg);
  const ins = nextInsuranceMonth(car.insMonth, null, car.insDay);
  const fmt = (t) => t ? new Date(t).toLocaleDateString("ko-KR", { year: "numeric", month: "long" }) : null;
  const dday = (t) => Math.round((t - todayKey()) / DAY);

  /* 계산한 시점을 정기 일정으로 넣어 알림·담당까지 그대로 씁니다.
     차가 여러 대면 일정도 차마다 따로 생겨야 합니다 — id에 차 번호를 붙입니다. */
  const sync = (next) => setSt((sv) => {
    const list = carsOf(sv).map((c) => c.id === car.id ? { ...c, ...next } : c);
    const me = list.find((c) => c.id === car.id) || {};
    const kInsp = `car-insp:${car.id}`, kIns = `car-ins:${car.id}`;
    const cr = (sv.customRoutines || []).filter((r) => r.id !== kInsp && r.id !== kIns);
    const ro = { ...sv.routines };
    delete ro[`c:${kInsp}`]; delete ro[`c:${kIns}`];
    /* 차가 한 대면 이름을 안 붙입니다. "우리 차 정기검사"는 군더더기예요 */
    const tail = list.length > 1 ? ` (${carLabel(me, idx)})` : "";
    const i1 = nextCarInspection(me.firstReg);
    if (i1) {
      cr.push({ id: kInsp, title: "자동차 정기검사 받기" + tail, category: "transport", cycle: 730 });
      ro[`c:${kInsp}`] = { on: true, cycle: 730, nextAt: i1 - 31 * DAY };
    }
    const i2 = nextInsuranceMonth(me.insMonth, null, me.insDay);
    if (i2) {
      /* 보험은 금융입니다. 차가 두 대여도 갱신·비교는 돈 쓰는 일이라 그 영역에서 봅니다. */
      cr.push({ id: kIns, title: "자동차 보험 만기" + tail, category: "finance", cycle: 365 });
      const d2 = new Date(i2);
      ro[`c:${kIns}`] = {
        on: true, cycle: 365,
        /* 만기일 5일 전부터 올라오고, 갱신했다고 누를 때까지 매일 남아 있습니다 */
        anchor: `${String(d2.getMonth() + 1).padStart(2, "0")}-${String(d2.getDate()).padStart(2, "0")}`,
        leadDays: 5,
        nextAt: Math.max(i2 - 5 * DAY, todayKey()),
      };
    }
    return { ...sv, cars: list, customRoutines: cr, routines: ro };
  });

  const drop = () => {
    if (!confirm(`${carLabel(car, idx)}를 지울까요? 이 차의 검사·보험 일정도 같이 없어집니다.`)) return;
    setSt((sv) => {
      const kInsp = `car-insp:${car.id}`, kIns = `car-ins:${car.id}`;
      const ro = { ...sv.routines };
      delete ro[`c:${kInsp}`]; delete ro[`c:${kIns}`];
      return { ...sv, cars: carsOf(sv).filter((c) => c.id !== car.id),
               customRoutines: (sv.customRoutines || []).filter((r) => r.id !== kInsp && r.id !== kIns),
               routines: ro };
    });
    say("지웠어요");
  };

  const thisYear = new Date().getFullYear();
  const years = []; for (let y = thisYear; y >= thisYear - 24; y--) years.push(y);
  const ry = (car.firstReg || "").split("-")[0] || "";
  const rm = (car.firstReg || "").split("-")[1] || "";
  /* 예전에는 연도와 월이 둘 다 있어야만 저장했습니다.
     그런데 사람은 하나씩 고릅니다 — 연도를 고른 순간 월이 비어 있어서
     방금 고른 연도까지 지워졌고, 그래서 최초 등록일을 영영 못 넣었습니다.
     이제 고른 쪽만 먼저 담아둡니다. 반쪽이면 계산만 안 할 뿐입니다. */
  const setReg = (y, m) => sync({ firstReg: (y || m) ? `${y}-${m}` : "" });

  return (
    <Card style={{ marginTop: 10 }}>
      <div style={{ padding: 15 }}>
        <div className="flex items-center gap-2">
          <input className="hae" value={car.name || ""} onChange={(e) => sync({ name: e.target.value })}
            placeholder={n > 1 ? `${idx + 1}번째 차 — 예: 남편 차, 카니발` : "우리 차"}
            style={{ flex: 1, minWidth: 0, border: `1px solid ${C.line}`, borderRadius: 11, padding: "10px 12px",
                     fontSize: 14, fontWeight: 600, background: C.bg, color: C.ink }} />
          {n > 1 && <button className="press" onClick={drop} aria-label="이 차 지우기"
            style={{ background: "transparent", border: "none", color: C.ink3, fontSize: 13, padding: "4px 6px" }}>✕</button>}

                         border: `1px solid ${on ? C.moss : C.line}`, borderRadius: R.sm, padding: "10px 0",
                         fontSize: 12, fontWeight: 600 }}>

        <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 16 }}>최초 등록</div>

        <div className="flex gap-2" style={{ marginTop: 8 }}>

            <option value="">연도</option>
            {years.map((y) => <option key={y} value={String(y)}>{y}년</option>)}
          </select>
          <select className="hae" value={rm} onChange={(e) => setReg(ry, e.target.value)}
            style={{ flex: 1, border: `1px solid ${C.line}`, borderRadius: 11, padding: "11px 10px", fontSize: 14, background: C.bg, color: C.ink }}>
            <option value="">월</option>
            {Array.from({ length: 12 }, (_, i) => String(i + 1).padStart(2, "0")).map((m) => <option key={m} value={m}>{Number(m)}월</option>)}
          </select>
        </div>
        {(ry || rm) && !(ry && rm) && (
          <div style={{ fontSize: 11.5, color: C.sun, marginTop: 7, lineHeight: 1.6 }}>
            {ry ? "월까지 골라야 정기검사 시점을 계산합니다." : "연도까지 골라야 정기검사 시점을 계산합니다."}
          </div>
        )}

        <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 18 }}>보험 만기일</div>
        <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 4, lineHeight: 1.6 }}>
          보험증권이나 문자에 적힌 <b style={{ color: C.ink2 }}>만기일</b>이에요.
          하루만 넘겨도 무보험이라 <b style={{ color: C.ink2 }}>5일 전부터</b> 매일 올립니다.
        </div>
        {/* 날짜를 넣는 자리마다 "캡처로 대신 넣기"가 있어야 합니다.
            유용정보 탭에만 두면, 정작 손으로 적고 있는 사람에게는 안 보입니다.
            여기가 그 사람이 지금 서 있는 자리입니다. */}
        <button className="press w-full" onClick={() => { setTab("speak"); say("📄 사진 버튼을 눌러 보험 안내문이나 내보험찾아줌 화면을 올려주세요"); }}
          style={{ marginTop: 9, background: C.mossSoft, color: C.moss, border: `1px solid ${C.moss}`, borderRadius: R.sm, padding: "11px 0", fontSize: 12.5, fontWeight: 600 }}>
          📄 캡처로 대신 넣기
        </button>
        <div style={{ fontSize: 11, color: C.ink3, marginTop: 6, lineHeight: 1.65 }}>
          보험 안내문·문자를 캡처해서 올리시면 날짜를 찾아 넣어드려요.
        </div>
        {/* 만기일을 아예 모르는 사람이 제일 많습니다. 그 사람을 캡처 화면으로 보내봐야
            찍을 게 없습니다. 먼저 볼 데로 데려다줘야 합니다. */}
        <a className="press w-full" href="https://cont.insure.or.kr/" target="_blank" rel="noopener noreferrer"
          style={{ display: "block", textAlign: "center", marginTop: 7, background: C.bg, color: C.ink2,
                   border: `1px solid ${C.line}`, borderRadius: R.sm, padding: "11px 0", fontSize: 12.5, textDecoration: "none" }}>
          만기일을 모르겠어요 · 내보험찾아줌 열기

            <div className="grid gap-1.5" style={{ marginTop: 7, gridTemplateColumns: "repeat(7, minmax(0, 1fr))" }}>

                             borderRadius: 9, padding: "8px 0", fontSize: 12, fontWeight: 600 }}>{n}</button>

            </div>}
          </>
        ) : null}

        {(insp || ins) && (
          <div style={{ marginTop: 15, paddingTop: 13, borderTop: `1px solid ${C.lineSoft}` }}>
            <div className="mono" style={{ fontSize: 9.5, color: C.moss }}>이렇게 챙길게요</div>
            {insp && <div style={{ fontSize: 13.5, marginTop: 9, lineHeight: 1.65 }}>
              정기검사 <b>{fmt(insp)}</b>쯤 · <span style={{ color: C.moss }}>D-{dday(insp)}</span>
              <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 3 }}>월까지만 계산한 값이에요. 만료 한 달 전에 정기 일정으로 올라오고, 정확한 날짜는 그때 자동차민원 포털에서 확인하시면 됩니다</div>
            </div>}
            {ins && <div style={{ fontSize: 13.5, marginTop: 11, lineHeight: 1.65 }}>
              보험 만기 <b>{new Date(ins).toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric" })}</b>
              {" · "}<span style={{ color: C.moss }}>D-{dday(ins)}</span>
              <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 3 }}>
                {car.insDay ? "만기 5일 전부터 매일 올립니다. 금융 영역에 있습니다."
                            : "날짜를 안 고르셔서 그 달 1일 기준이에요. 5일 전부터 매일 올립니다."}

/* 자동차 검사·보험 시점 —
   보험사·검사기관 API는 본인인증 없이는 열리지 않습니다. 그래서 연동 대신
   최초등록 연월과 보험 갱신월만 한 번 받고, 날짜는 법정 주기로 계산합니다. */
function CarDates() {
  const { st, setSt, say } = use();
  const cars = carsOf(st);

  const add = () => setSt((sv) => {
    const list = carsOf(sv);
    if (list.length >= 4) return sv;
    return { ...sv, cars: [...list, { id: uid("car"), name: "", type: "ice", firstReg: "", insMonth: null }] };
  });

  return (
    <>
      <div style={{ fontSize: 12.5, color: C.ink3, marginTop: 10, paddingLeft: 2, lineHeight: 1.7 }}>
        한 번만 넣어두면 다시 안 물어봐요. 법정 주기(신차 4년 → 이후 2년)로 다음 검사 시점을 계산합니다.
      </div>
      {cars.length === 0
        ? <Card style={{ marginTop: 10 }}><div style={{ padding: "22px 16px", fontSize: 13.5, color: C.ink3, textAlign: "center", lineHeight: 1.7 }}>
            아직 등록한 차가 없어요.<br />아래에서 추가하시면 검사·보험 시점을 챙깁니다.
          </div></Card>
        : cars.map((c, i) => <CarOne key={c.id} car={c} idx={i} n={cars.length} />)}
      {cars.length < 4 && (
        <button className="press" onClick={add}
          style={{ width: "100%", marginTop: 10, background: "transparent", border: `1px dashed ${C.line}`,
                   borderRadius: R.sm, padding: "13px 0", fontSize: 13, color: C.ink2 }}>
          {cars.length ? "차 한 대 더 추가" : "차 추가"}
        </button>
      )}
      {cars.length > 1 && (
        <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 9, paddingLeft: 2, lineHeight: 1.7 }}>
          차마다 검사·보험 일정이 따로 올라옵니다. 이름을 적어두시면 어느 차인지 바로 보여요.
        </div>
      )}
    </>
  );
}

/* ── 어른께 전화 ───────────────────────────────────
   부모가 보는 화면입니다. 어른은 이 화면을 못 보십니다 — 볼 필요도 없고요.
   요일별로 한 번 넣어두면 앱이 매일 아침 대신 읽어드립니다. */
function CallScreen() {
  const { st, setSt, say, setTab, log } = use();
  const [dow, setDow] = useState(String(new Date().getDay() || 1));
  const [time, setTime] = useState("");
  const [what, setWhat] = useState("");
  const [kind, setKind] = useState("sked");   /* sked 일정 · med 약 · bag 준비물 */
  const [alert, setAlert] = useState(false);  /* 그 시각 30분 전과 정각, 두 번 울릴지 */
  const [med, setMed] = useState({ when: MED_WHEN[0], name: "", dose: "", how: MED_HOW[0] });
  const [kid, setKid] = useState(((st.children || [])[0] || {}).id || "");
  const inp = { border: `1px solid ${C.line}`, borderRadius: 12, padding: "11px 12px", fontSize: 14.5, background: C.bg, color: C.ink, width: "100%" };
  const elder = (st.elders || [])[0] || { label: "", phone: "" };
  const rows = ((st.callPlan || {})[dow] || []).slice().sort((a, b) => String(a.time || "").localeCompare(String(b.time || "")));
  const day = nextCallDay(st);
  const tomorrow = day > todayKey();
  const byApp = elderByApp(st);
  const batches = callBatches(st, day).map((b) => {
    if (b.app) {
      /* 앱 알림은 값이 안 듭니다. 대신 어른이 앱을 안 보시면 조용히 안 갑니다 */
      const text = smsText(st, day, b.rows);
      return { ...b, text, cost: { sec: 0, won: 0, bytes: 0 } };
    }
    if (b.sms) {
      const text = smsText(st, day, b.rows);
      const c = smsCost(text);
      return { ...b, text, cost: { sec: 0, won: byApp ? 0 : c.won, bytes: c.bytes, long: c.long } };
    }
    const text = callScript(st, day, b.rows);
    return { ...b, text, cost: callCost(text, byApp) };
  });
  const dayWon = batches.reduce((a, b) => a + b.cost.won, 0);
  const dropped = callDropped(st, day);
  const callN = batches.filter((b) => !b.sms && !b.app).length;
  const smsN = batches.filter((b) => b.sms).length;
  const appN = batches.filter((b) => b.app).length;

  const setElder = (k, v) => setSt((sv) => {
    const list = (sv.elders || []).slice();
    const cur = list[0] || { id: uid("e"), label: "", phone: "" };
    list[0] = { ...cur, [k]: v };
    return { ...sv, elders: list };
  });

  /* 넣을 때 고른 요일들. 비어 있으면 지금 보고 있는 요일에만 넣습니다.
     피아노가 월·수·금이면 세 번 넣게 하지 않습니다. */
  const [alsoDows, setAlsoDows] = useState([]);

  const add = () => {
    const w = what.trim();
    if (kind === "med") { addMed(); return; }
    if (!w) return;
    /* 시각 없는 일정은 어른께 "태권도"라고만 읽힙니다. 언제인지 모르십니다.
       준비물은 시각이 필요 없으니 일정에만 막습니다.
       */
    if (kind === "sked" && !/^\d{1,2}:\d{2}$/.test(time.trim())) {
      say("몇 시인지 같이 넣어주세요. 시각이 없으면 어른이 언제인지 모르십니다");
      return;
    }
    const 넣을요일 = [...new Set([dow, ...alsoDows])];
    setSt((sv) => {
      const plan = { ...(sv.callPlan || {}) };
      넣을요일.forEach((d) => {
        plan[d] = (plan[d] || []).concat([{
          id: uid("cl"), time: kind === "bag" ? "" : time.trim(),
          what: w.slice(0, 30), kind, kid, alert: kind === "sked" ? !!alert : false }]);
      });
      return { ...sv, callPlan: plan, callOn: true };
    });
    setTime(""); setWhat(""); setAlert(false); setAlsoDows([]);
    if (넣을요일.length > 1) say(`${넣을요일.map((d) => DOW_KR[Number(d)]).join("·")}요일에 넣었어요`);
    log("call_plan_add", { dow, kind, n: 넣을요일.length });
  };
  /* 약은 이름만 적고 마는 일이 많습니다. 때·용량을 따로 받습니다 */
  const addMed = () => {
    /* 약봉투는 이름을 안 받습니다 — 그게 이 선택지의 뜻입니다 */
    if (med.how !== MED_BAG && !med.name.trim()) return;
    const line = medLine({ ...med, name: med.name.trim() });
    const 넣을요일 = [...new Set([dow, ...alsoDows])];
    setSt((sv) => {
      const plan = { ...(sv.callPlan || {}) };
      넣을요일.forEach((d) => { plan[d] = (plan[d] || []).concat([{
        id: uid("cl"), time: med.when === "정한 시각에" ? time.trim() : "",
        what: line.slice(0, 40), kind: "med", kid,
        /* 시각을 정한 약(안약·연고)만 그 시각에 따로 겁니다 */
        /* 시각을 정한 약(안약·연고)은 놓치면 안 되니 두 번 울립니다 */
        alert: med.when === "정한 시각에" && !!time.trim() }]); });
      return { ...sv, callPlan: plan, callOn: true };
    });
    setMed({ when: MED_WHEN[0], name: "", dose: "", how: MED_HOW[0] });
    setTime("");
    log("call_plan_add", { dow, kind: "med" });
  };
  /* 알아서 → 전화 → 문자 → 알아서. 한 자리에서 돌립니다 */
  const setWay = (id) => setSt((sv) => {
    const plan = { ...(sv.callPlan || {}) };
    plan[dow] = (plan[dow] || []).map((r) => r.id !== id ? r
      : { ...r, way: r.way === "call" ? "sms" : r.way === "sms" ? "app" : r.way === "app" ? "" : "call" });
    return { ...sv, callPlan: plan };
  });

  const del = (id) => setSt((sv) => {
    const plan = { ...(sv.callPlan || {}) };
    plan[dow] = (plan[dow] || []).filter((r) => r.id !== id);
    return { ...sv, callPlan: plan };
  });
  /* 한 요일을 짜두고 다른 요일에 복사 — 하원 시각처럼 매일 같은 것이 있습니다 */
  const copyTo = (target) => setSt((sv) => {
    const plan = { ...(sv.callPlan || {}) };
    plan[target] = (plan[dow] || []).map((r) => ({ ...r, id: uid("cl") }));
    return { ...sv, callPlan: plan };
  });

  /* 말로 넣기 — 칸을 하나씩 채우는 것보다 말이 빠릅니다.
     다만 반복 일정은 건드리지 않습니다. 그날 것만 더합니다. */

  return (
    <div style={{ "--ac": C.moss }}>
      <PageHead title="어른께 전하기" onBack={() => setTab("home")} backLabel="오늘" />
      <p style={{ fontSize: 13, color: C.ink3, marginTop: 8, lineHeight: 1.7 }}>
        <b style={{ color: C.ink2 }}>요일마다 한 번만 넣어두시면, 그 뒤로는 앱이 챙깁니다.</b>
        매일 아침 부모가 보내는 것이 아니라, 정해진 시각에 앱이 어른께 걸어 읽어드립니다.<br />
        부모가 손대실 일은 <b style={{ color: C.ink2 }}>그날만 다른 것</b>뿐입니다 — 약이 바뀌거나 학원 시간이 옮겨졌을 때요.
      </p>

      <Section eyebrow="CALL-01" title="어느 분께 걸까요">
        <div className="grid grid-cols-2 gap-2.5">
          <input style={inp} placeholder="호칭 (예: 할머니)" value={elder.label || ""}
            onChange={(e) => setElder("label", e.target.value.slice(0, 10))} />
          <input style={inp} placeholder="전화번호" inputMode="tel" value={elder.phone || ""}
            onChange={(e) => setElder("phone", e.target.value.replace(/[^\d-]/g, "").slice(0, 14))} />
        </div>
        <div className="flex items-center gap-2.5" style={{ marginTop: 10 }}>
          <span style={{ fontSize: 13, color: C.ink2, flexShrink: 0 }}>전화 나가는 시각</span>
          <input style={{ ...inp, width: 110 }} placeholder="07:50" value={st.callAt || ""}
            onChange={(e) => setSt((sv) => ({ ...sv, callAt: e.target.value.slice(0, 5) }))} />
        </div>
        <div style={{ marginTop: 12, background: C.bgSoft || C.bg, border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 13px", fontSize: 12.5, color: C.ink2, lineHeight: 1.75 }}>
          ⚠ <b>어른 폰에 이 번호를 저장해드려야 합니다.</b> 모르는 번호로 뜨면 어른들은 안 받으십니다.
          직접 찾아뵙고 저장해드리고, <b>“앞으로 이 번호로 전화 갈 거야”</b>라고 한 번 말씀드리세요.
          그 한마디가 이 기능이 되느냐 마느냐를 가릅니다.
        </div>
      </Section>

      <Section eyebrow="CALL-02" title="요일마다 무엇을 알려드릴까요">
        <div className="flex gap-1.5" style={{ marginBottom: 12 }}>
          {["1", "2", "3", "4", "5"].map((d) => {
            const n = ((st.callPlan || {})[d] || []).length;
            return (
              <button key={d} className="press" onClick={() => setDow(d)}
                style={{ flex: 1, padding: "9px 0", borderRadius: 12, fontSize: 13, fontWeight: dow === d ? 600 : 400,
                         border: `1px solid ${dow === d ? C.moss : C.line}`, background: dow === d ? C.moss : "transparent",
                         color: dow === d ? "#fff" : (n ? C.ink2 : C.ink3) }}>
                {DOW_KR[Number(d)]}{n ? <span style={{ fontSize: 10, marginLeft: 3, opacity: .8 }}>{n}</span> : null}
              </button>
            );
          })}
        </div>

        {rows.length === 0 && (
          <p style={{ fontSize: 12.5, color: C.ink3, padding: "6px 0 12px" }}>
            {DOW_KR[Number(dow)]}요일에 넣은 것이 없습니다. 학원·하원 시각처럼 그날 어른이 아셔야 할 것을 넣으세요.
          </p>
        )}
        {rows.map((r) => (
          <div key={r.id} className="flex items-center gap-2.5"
            style={{ padding: "10px 0", borderBottom: `1px solid ${C.lineSoft || C.line}` }}>
            <span className="mono" style={{ fontSize: 12.5, color: C.moss, width: 46, flexShrink: 0 }}>
              {r.kind === "bag" ? "가방" : r.kind === "med" ? "약" : (r.time || "—")}
            </span>
            <span style={{ fontSize: 14, flex: 1, minWidth: 0 }}>
              {(st.children || []).length > 1 && r.kid
                ? <b style={{ color: C.ink3, fontWeight: 500, marginRight: 5 }}>
                    {((st.children || []).find((k) => k.id === r.kid) || {}).name}
                  </b> : null}
              {r.what}
              {r.alert && r.time ? <b style={{ color: C.moss, fontSize: 11, marginLeft: 6, fontWeight: 500 }}>· 알림 2번</b> : null}
            </span>
            {/* 복직 초반엔 다 전화로 듣고 싶으시다가, 한 달쯤 지나 외우시면
                "피아노는 이제 문자로"가 됩니다. 그 자리를 여기 둡니다.
                기본은 "알아서" — 앱이 그날 형편대로 정합니다. */}
            <button className="press" onClick={() => setWay(r.id)}
              style={{ background: "transparent", border: "none", flexShrink: 0, padding: "0 8px",
                       fontSize: 11, color: r.way === "call" ? C.moss : r.way === "sms" ? C.sun : r.way === "app" ? C.sea : C.ink3 }}>
              {r.way === "call" ? "전화" : r.way === "sms" ? "문자" : r.way === "app" ? "앱" : "알아서"}
            </button>
            <button className="press" onClick={() => del(r.id)}
              style={{ background: "transparent", border: "none", color: C.ink3, fontSize: 12, flexShrink: 0 }}>빼기</button>
          </div>
        ))}

        <div style={{ marginTop: 14, paddingTop: 13, borderTop: `1px solid ${C.line}` }}>
          {(st.children || []).length > 1 && (
            <div className="flex gap-1.5" style={{ marginBottom: 10, flexWrap: "wrap" }}>
              <span style={{ fontSize: 12, color: C.ink3, alignSelf: "center", marginRight: 2 }}>누구</span>
              {(st.children || []).map((k) => (
                <button key={k.id} className="press" onClick={() => setKid(k.id)}
                  style={{ padding: "5px 12px", borderRadius: 999, fontSize: 12,
                           border: `1px solid ${kid === k.id ? C.moss : C.line}`,
                           background: kid === k.id ? C.mossSoft : "transparent",
                           color: kid === k.id ? C.moss : C.ink3 }}>{k.name}</button>
              ))}
            </div>
          )}
          {/* 피아노가 월·수·금이면 세 번 넣게 하지 않습니다.
              여기서 같이 고르면 한 번에 들어갑니다. */}
          <div className="flex items-center gap-1.5" style={{ marginBottom: 10, flexWrap: "wrap" }}>
            <span style={{ fontSize: 12, color: C.ink3, marginRight: 2 }}>이 요일에도</span>
            {["1", "2", "3", "4", "5"].filter((d) => d !== dow).map((d) => {
              const on = alsoDows.includes(d);
              return (
                <button key={d} className="press" onClick={() => setAlsoDows((v) => on ? v.filter((x) => x !== d) : v.concat(d))}
                  style={{ padding: "5px 11px", borderRadius: 999, fontSize: 12, fontWeight: on ? 600 : 400,
                           border: `1px solid ${on ? C.moss : C.line}`,
                           background: on ? C.mossSoft : "transparent", color: on ? C.moss : C.ink3 }}>
                  {DOW_KR[Number(d)]}
                </button>
              );
            })}
          </div>
          <div className="flex gap-1.5" style={{ marginBottom: 10 }}>
            {[["sked", "일정"], ["med", "약"], ["bag", "준비물"]].map(([k, lab]) => (
              <button key={k} className="press" onClick={() => setKind(k)}
                style={{ padding: "6px 14px", borderRadius: 999, fontSize: 12.5, fontWeight: kind === k ? 600 : 400,
                         border: `1px solid ${kind === k ? C.moss : C.line}`,
                         background: kind === k ? C.mossSoft : "transparent",
                         color: kind === k ? C.moss : C.ink3 }}>{lab}</button>
            ))}
          </div>

          {kind === "sked" && (
            <>
              {/* 아침에 등원 전 병원 가는 일이 흔합니다. 매번 치게 하지 않습니다.
                  손으로 고쳐 쓰셔도 되게 칸에 넣어주기만 합니다. */}
              <div className="flex gap-1.5" style={{ flexWrap: "wrap", marginBottom: 9 }}>
                {["병원 데려다주기", "등원 데려다주기", "하원 데리러 가기", "학원 데려다주기", "학원에서 데려오기"].map((q) => (
                  <button key={q} className="press" onClick={() => setWhat(q)}
                    style={{ padding: "5px 11px", borderRadius: 999, fontSize: 11.5,
                             border: `1px solid ${what === q ? C.moss : C.line}`,
                             background: what === q ? C.mossSoft : "transparent",
                             color: what === q ? C.moss : C.ink3 }}>{q}</button>
                ))}
              </div>
              <div className="flex gap-2">
                <input style={{ ...inp, width: 82, flexShrink: 0 }} placeholder="15:20" value={time}
                  onChange={(e) => setTime(e.target.value.slice(0, 5))} />
                <input style={inp} placeholder="태권도 데려다주기" value={what}
                  onChange={(e) => setWhat(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") add(); }} />
                <button className="press" onClick={add}
                  style={{ flexShrink: 0, padding: "0 16px", borderRadius: 12, background: C.moss, color: "#fff", border: "none", fontSize: 14, fontWeight: 600 }}>넣기</button>
              </div>
              <button className="press flex items-center gap-2" onClick={() => setAlert((v) => !v)}
                style={{ marginTop: 10, background: "transparent", border: "none", padding: 0, textAlign: "left" }}>
                <span style={{ width: 15, height: 15, borderRadius: 4, flexShrink: 0,
                               border: `1.5px solid ${alert ? C.moss : C.line}`, background: alert ? C.moss : "transparent",
                               color: "#fff", fontSize: 10, lineHeight: "13px", textAlign: "center" }}>{alert ? "✓" : ""}</span>
                <span style={{ fontSize: 12.5, color: alert ? C.ink2 : C.ink3 }}>
                  {byApp
                    ? <>이건 <b style={{ color: C.ink2 }}>30분 전과 정각</b>에 알림</>
                    : <>이건 <b style={{ color: C.ink2 }}>30분 전에 전화</b> (한 통 늘어납니다)</>}
                </span>
              </button>
              <p style={{ fontSize: 11.5, color: C.ink3, marginTop: 7, lineHeight: 1.7 }}>
                {byApp
                  ? "값이 안 드니 놓치면 안 되는 것은 다 켜세요. 간식처럼 늦어도 되는 것만 끄시면 됩니다."
                  : "하원·하교처럼 놓치면 아이가 기다리는 것만 켜세요. 한 통에 약 300원입니다. 간식·약은 어른이 집에서 하시니 안 켜셔도 됩니다."}
              </p>
            </>
          )}

          {kind === "med" && (
            <>
              <div className="flex gap-1.5" style={{ flexWrap: "wrap", marginBottom: 8 }}>
                {MED_WHEN.map((w) => (
                  <button key={w} className="press" onClick={() => setMed((m) => ({ ...m, when: w }))}
                    style={{ padding: "6px 11px", borderRadius: 999, fontSize: 12,
                             border: `1px solid ${med.when === w ? C.moss : C.line}`,
                             background: med.when === w ? C.mossSoft : "transparent",
                             color: med.when === w ? C.moss : C.ink3 }}>{w}</button>
                ))}
              </div>
              {med.when === "정한 시각에" && (
                <input style={{ ...inp, width: 100, marginBottom: 8 }} placeholder="13:00" value={time}
                  onChange={(e) => setTime(e.target.value.slice(0, 5))} />
              )}
              {med.how !== MED_BAG && (
                <div className="grid grid-cols-2 gap-2">
                  <input style={inp} placeholder="약 이름 (예: 시럽)" value={med.name}
                    onChange={(e) => setMed((m) => ({ ...m, name: e.target.value.slice(0, 16) }))} />
                  <input style={inp} placeholder="용량 (예: 5ml, 반 알)" value={med.dose}
                    onChange={(e) => setMed((m) => ({ ...m, dose: e.target.value.slice(0, 12) }))} />
                </div>
              )}
              {med.how === MED_BAG && (
                <p style={{ fontSize: 12, color: C.ink3, lineHeight: 1.75 }}>
                  <b style={{ color: C.ink2 }}>이름도 용량도 안 적으셔도 됩니다.</b>
                  전날 봉투에 담아두시면 어른은 꺼내 드리기만 하시면 돼요.
                  병명이나 약 이름이 스피커폰으로 새어나갈 일도 없습니다.
                </p>
              )}
              <div className="flex gap-1.5" style={{ flexWrap: "wrap", marginTop: 8 }}>
                {MED_HOW.map((h) => (
                  <button key={h} className="press" onClick={() => setMed((m) => ({ ...m, how: h }))}
                    style={{ padding: "6px 11px", borderRadius: 999, fontSize: 12,
                             border: `1px solid ${med.how === h ? C.moss : C.line}`,
                             background: med.how === h ? C.mossSoft : "transparent",
                             color: med.how === h ? C.moss : C.ink3 }}>{h}</button>
                ))}
              </div>
              <p style={{ fontSize: 12, color: C.ink3, marginTop: 10, lineHeight: 1.7 }}>
                이렇게 읽어드립니다 — “{medLine({ ...med, name: med.name || "○○" }) || "…"}”<br />
                <b style={{ color: C.ink2 }}>밥에 붙은 약은 따로 전화하지 않습니다.</b>
                어른이 밥을 챙기시니 약도 그때 하십니다. 아침 통화에 같이 실립니다.
              </p>
              <Btn kind="accent" onClick={add} style={{ marginTop: 10, padding: "12px 0", fontSize: 14 }}>넣기</Btn>
            </>
          )}

          {kind === "bag" && (
            <>
              <div className="flex gap-2">
                <input style={inp} placeholder="물통, 체육복" value={what}
                  onChange={(e) => setWhat(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") add(); }} />
                <button className="press" onClick={add}
                  style={{ flexShrink: 0, padding: "0 16px", borderRadius: 12, background: C.moss, color: "#fff", border: "none", fontSize: 14, fontWeight: 600 }}>넣기</button>
              </div>
              <p style={{ fontSize: 12, color: C.ink3, marginTop: 10, lineHeight: 1.7 }}>
                이렇게 읽어드립니다 — “{what || "물통"} 가방에 챙겨뒀어요. 현관에 두겠습니다.”<br />
                <b style={{ color: C.ink2 }}>어른께 챙기시라고 하지 않습니다.</b>
                준비물은 전날 부모가 챙기는 게 맞고, 어른께는 챙겨뒀다는 것만 알려드립니다.
              </p>
            </>
          )}

        </div>

        {rows.length > 0 && (
          <div className="flex items-center gap-1.5" style={{ marginTop: 12, flexWrap: "wrap" }}>
            <span style={{ fontSize: 11.5, color: C.ink3 }}>이 요일을 그대로 복사 →</span>
            {["1", "2", "3", "4", "5"].filter((d) => d !== dow).map((d) => (
              <button key={d} className="press" onClick={() => { copyTo(d); setDow(d); say(`${DOW_KR[Number(d)]}요일에 복사했습니다`); }}
                style={{ padding: "5px 11px", borderRadius: 999, border: `1px solid ${C.line}`, background: "transparent", fontSize: 11.5, color: C.ink2 }}>
                {DOW_KR[Number(d)]}
              </button>
            ))}
          </div>
        )}
      </Section>


      <Section eyebrow="CALL-03" title={tomorrow ? "내일 이렇게 나갑니다" : "오늘 이렇게 나갑니다"}>
        {((st.callToday || {})[day] || {}).off && (
          <div style={{ marginBottom: 12, background: C.persimSoft, borderRadius: 12, padding: "13px 15px", fontSize: 13, color: C.persim, lineHeight: 1.75 }}>
            <b>{tomorrow ? "내일" : "오늘"}은 쉬는 날로 해두셨습니다.</b> 아무것도 안 나갑니다.
            <button className="press" onClick={() => setSt((sv) => {
              const t = { ...(sv.callToday || {}) }; t[day] = { ...(t[day] || {}), off: false };
              return { ...sv, callToday: t };
            })} style={{ display: "block", marginTop: 9, background: "transparent", border: `1px solid ${C.persim}`, borderRadius: 999, padding: "6px 13px", fontSize: 12, color: C.persim }}>
              다시 켜기
            </button>
          </div>
        )}
        {dropped > 0 && (
          <div style={{ marginBottom: 12, background: C.persimSoft, color: C.persim, borderRadius: 12, padding: "12px 14px", fontSize: 12.5, lineHeight: 1.7 }}>
            넣어두신 것이 많아 <b>{dropped}개는 안 나갑니다.</b> 하루에 {CALL_MAX}개까지만 전해드려요 —
            그보다 많으면 어른이 다 기억하실 수가 없습니다. 덜 급한 것을 빼주세요.
          </div>
        )}
        {batches.length ? (
          <>
            {batches.map((b, i) => (
              <div key={i} style={{ marginTop: i ? 10 : 0 }}>
                <div className="mono" style={{ fontSize: 11, color: b.app ? C.sea : b.sms ? C.sun : C.moss, marginBottom: 5 }}>
                  {b.at} · {b.kind}{b.app ? " · 앱" : b.sms ? " · 문자" : " · 전화"}
                </div>
                <div style={{ background: C.card, border: `1px solid ${b.app ? C.sea : b.sms ? C.sun : C.moss}`, borderRadius: 14, padding: "14px 15px", fontSize: 14, lineHeight: 1.85, color: C.ink, whiteSpace: (b.sms || b.app) ? "pre-wrap" : "normal" }}>
                  {(b.sms || b.app) ? b.text : `“${b.text}”`}
                </div>
                {/* 부모에게 "기본료 220원, 348원"을 보여줄 이유가 없습니다.
                    통신사가 문자마다 22원이라고 알려주지 않는 것과 같습니다.
                    남은 통 수만 보이면 됩니다. 원가는 만드는 사람 것이라 접힌 자리로. */}
                <p className="mono" style={{ fontSize: 11, color: C.ink3, marginTop: 5 }}>
                  {b.sms ? "문자" : `약 ${b.cost.sec}초`}
                </p>
              </div>
            ))}
            <div style={{ marginTop: 14, background: C.mossSoft, borderRadius: 12, padding: "13px 15px" }}>
              <div style={{ fontSize: 13.5, fontWeight: 600, color: C.moss }}>
                하루 {[callN && `전화 ${callN}통`, smsN && `문자 ${smsN}통`, appN && `앱 ${appN}건`].filter(Boolean).join(" · ")}
              </div>
              <div style={{ fontSize: 12.5, color: C.ink2, marginTop: 5, lineHeight: 1.7 }}>
                {byApp

          <div style={{ fontWeight: 600, color: C.ink, marginTop: 12, marginBottom: 6 }}>남는 것</div>
          서비스 개선을 위해 <b>AI가 정리한 일의 제목</b>이 익명으로 수집됩니다.
          (예: “피아노 학원 5시”) 누가 말했는지, 어느 집인지는 함께 남기지 않습니다.
          <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 10, lineHeight: 1.7 }}>
            어른 성함과 전화번호는 <b style={{ color: C.ink2 }}>전화를 거는 데에만</b> 씁니다.
            광고에 쓰거나 밖으로 팔지 않습니다.
          </div>
        </div></Card>
      </Section>

      <Section eyebrow="NOTIFY" title="알림">
        <PushBox />
      </Section>


      <div style={{ marginTop: 20 }}>
        <Btn onClick={() => { setSt((s) => ({ ...s, members: d.members.filter((m) => m.name.trim()), children: d.children, flags: d.flags, petTypes: d.petTypes, cars: carsOf(d), carType: d.carType || "ice", extra: d.extra, region: String(d.region || "").trim() })); say("저장했어요"); setTab("home"); }}>저장</Btn>
        <div style={{ height: 8 }} />
        {/* 지우기 전에 내려받을 길이 있어야 합니다. 되돌릴 수 없는 버튼 옆에
            백업이 없으면, 그건 버튼이 아니라 함정입니다. */}
        <Btn kind="ghost" onClick={() => {
          try {
            const blob = new Blob([JSON.stringify(st, null, 2)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `손주한통-백업-${todayStr().replace(/[^0-9]/g, "")}.json`;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 4000);
            say("백업 파일을 내려받았어요");
          } catch { say("이 브라우저에선 내려받기가 안 돼요"); }
        }}>지금 상태 백업 내려받기</Btn>
        <div style={{ height: 8 }} />
        <Btn kind="quiet" onClick={() => {
          if (!confirm("모든 데이터를 지우고 처음부터 시작할까요?\n\n가족 전체의 데이터가 지워지고 되돌릴 수 없습니다.\n먼저 위에서 백업을 내려받으세요.")) return;
          if (!confirm("정말 지울까요? 남편분 화면의 내용도 함께 사라집니다.")) return;
          window.storage.delete("meonjeon").catch(() => {}); setSt(DEFAULT_STATE);
        }}>데이터 전체 삭제</Btn>
      </div>

      {/* 베타 지표·처음 화면 미리보기·서버 점검은 만드는 사람이 보는 것입니다.
          쓰는 부모에게는 눌러도 뜻을 모르는 버튼 셋일 뿐이라, BUILD 줄을 눌러야 나옵니다. */}
      {dev && (
        <div style={{ marginTop: 20 }}>
          <Btn kind="ghost" onClick={() => setDash(true)}>베타 지표 보기</Btn>
          <div style={{ height: 8 }} />
          <Btn kind="ghost" onClick={() => { setSt((s2) => ({ ...s2, previewOnboarding: true })); setTab("home"); }}>처음 화면 미리보기</Btn>
          <EnvCheck />
        </div>
      )}

      {/* 폰에서 새로고침이 됐는지 확인하는 자리 */}
      <div className="flex items-center justify-between" style={{ marginTop: 26, paddingTop: 16, borderTop: `1px solid ${C.lineSoft}` }}>
        <button className="press" onClick={() => setDev((v) => !v)}
          style={{ background: "none", border: "none", padding: 0 }}>
          <span className="mono" style={{ fontSize: 10, color: dev ? C.moss : C.ink3, letterSpacing: ".08em" }}>BUILD {BUILD}</span>
        </button>
        <button className="press" onClick={() => { location.href = location.pathname + "?v=" + Date.now(); }}
          style={{ background: "transparent", border: `1px solid ${C.line}`, borderRadius: 999, padding: "7px 13px", fontSize: 11.5, color: C.ink2 }}>
          최신으로 받기
        </button>
      </div>
    </>
  );
}

/* ── 하단 탭 ──────────────────────────────────── */
function TabBar() {
  const { st, tab, setTab } = use();
  /* 예전에 이 자리는 "나눔" 탭이었고, 혼자 쓰면 나눌 게 없어서 감췄습니다.
     지금은 같은 자리가 유용정보(복지 + 미리 사두기)입니다.
     그런데 감추는 조건만 남아 있어서, 혼자 등록한 집은 이 탭을 아예 못 봤습니다.
     복지는 오히려 혼자 사는 집에 더 필요하고, 미리 사두기도 여기에만 있습니다. */
  const items = [
    { id: "home", label: "오늘", icon: "◉" },
    { id: "speak", label: "말하기", icon: "✦", primary: true },
    { id: "call", label: "전하기", icon: "☏" },
  ];
  return (
    <nav style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 440,
                  background: "rgba(255,255,255,.9)", backdropFilter: "saturate(1.6) blur(16px)", WebkitBackdropFilter: "saturate(1.6) blur(16px)",
                  borderTop: `1px solid ${C.line}`, display: "flex", gap: 2, zIndex: 30, padding: "7px 8px",
                  paddingBottom: "calc(7px + env(safe-area-inset-bottom))" }}>
      {items.map((it) => {
        const on = tab === it.id;
        /* 식단 탭만 초록. 어느 방에 와 있는지 아래에서도 보이게 */
        const ac = it.id === "meal" ? C.leaf : C.moss;
        if (it.primary) return (
          <button key={it.id} className="press flex-1 flex flex-col items-center justify-center" onClick={() => setTab(it.id)}
            style={{ background: "transparent", border: "none", padding: "2px 0", color: on ? ac : C.ink3 }}>
            <span style={{ width: 40, height: 40, borderRadius: 999, background: on ? ac : C.ink, color: "#fff", fontSize: 16,
                           display: "inline-flex", alignItems: "center", justifyContent: "center", boxShadow: SHADOW }}>{it.icon}</span>
            <span style={{ fontSize: 10.5, marginTop: 3, fontWeight: on ? 600 : 400 }}>{it.label}</span>
          </button>
        );
        return (
          <button key={it.id} className="press flex-1 flex flex-col items-center" onClick={() => setTab(it.id)}
            style={{ background: "transparent", border: "none", borderRadius: R.sm, padding: "7px 0", color: on ? ac : C.ink3 }}>
            <span style={{ position: "relative", fontSize: 15, lineHeight: "20px" }}>
              {it.icon}
              {it.badge ? <span className="mono" style={{ position: "absolute", top: -3, right: -12, minWidth: 15, height: 15, borderRadius: 99, background: C.persim, color: "#fff", fontSize: 9, lineHeight: "15px", padding: "0 4px" }}>{it.badge}</span> : null}
            </span>
            <span style={{ fontSize: 10.5, marginTop: 3, fontWeight: on ? 600 : 400 }}>{it.label}</span>
          </button>
        );
      })}
    </nav>
  );
}


window.startApp = () => ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
