<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F3F2EE" />
<title>손주한통</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="손주한통" />
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap');
  html,body{margin:0;background:#F3F2EE;font-family:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;color:#20211D;-webkit-font-smoothing:antialiased}
  #gate{max-width:440px;margin:0 auto;padding:64px 22px calc(40px + env(safe-area-inset-bottom))}
  #gate h1{font-family:'Noto Serif KR',serif;font-size:28px;font-weight:600;letter-spacing:-.035em;line-height:1.42;margin:0}
  #gate p{font-size:13.5px;color:#565952;line-height:1.78;margin-top:14px}
  #gate input{width:100%;border:1px solid #E1DFD7;border-radius:16px;padding:15px 16px;font-size:15px;background:#fff;font-family:inherit;box-sizing:border-box;transition:border-color .15s,box-shadow .15s}
  #gate input:focus{outline:none;border-color:#1F4B73;box-shadow:0 0 0 3px #E2EBF4}
  #gate button{width:100%;border:none;border-radius:16px;padding:16px 0;font-size:15px;font-weight:600;font-family:inherit;background:#20211D;color:#fff;margin-top:10px;cursor:pointer;transition:transform .12s ease}
  #gate button:active{transform:scale(.985)}
  #gate .ghost{background:transparent;color:#767A6F;font-weight:400;font-size:13px}
  #gate .msg{margin-top:16px;font-size:13px;line-height:1.7;padding:14px 15px;border-radius:14px;background:#E2EBF4;color:#1F4B73}
  /* 버튼이 넷이 되면 좁은 폰에서 밀립니다. 줄바꿈을 허용합니다 */
  #bar{position:fixed;top:0;left:0;right:0;z-index:80;display:none;justify-content:center;gap:6px;flex-wrap:wrap;
       background:rgba(255,255,255,.86);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);
       border-bottom:1px solid #E1DFD7;padding:8px 12px;font-size:11.5px;color:#565952;align-items:center}
  #bar button{border:1px solid #E1DFD7;background:#F3F2EE;border-radius:99px;padding:6px 10px;font-size:11px;white-space:nowrap;color:#565952;font-family:inherit;cursor:pointer}
  #sync{position:fixed;bottom:calc(112px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:90;display:none;
        background:#20211D;color:#fff;border-radius:99px;padding:11px 16px;font-size:12.5px;align-items:center;gap:10px;
        box-shadow:0 2px 4px rgba(15,26,21,.06), 0 22px 48px -22px rgba(15,26,21,.4)}
  #sync button{background:#1F4B73;color:#fff;border:none;border-radius:99px;padding:6px 12px;font-size:12px;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div id="bar"></div>
<div id="gate"></div>
<div id="root"></div>
<div id="sync"><span>가족이 방금 업데이트했어요</span><button onclick="location.reload()">새로고침</button></div>

<script>
/* ══ 체험판 부팅 ══════════════════════════════════════
   로그인·서버 없이 이 기기(localStorage)에만 저장합니다.
   AI 분석은 내장 간이 버전 — 실제 배포판에서는 Claude가 합니다. */
(function () {
  var gate = document.getElementById('gate');
  var bar = document.getElementById('bar');

  /* 저장: 브라우저가 저장을 막아도 앱은 떠야 합니다 */
  var mem = {};
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] == null ? null : mem[k]; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} mem[k] = v; }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} delete mem[k]; }

  window.storage = {
    get: function (k) { var v = lsGet('meonjeon-demo:' + k); if (v == null) return Promise.reject(new Error('empty')); return Promise.resolve({ key: k, value: v }); },
    set: function (k, v) { lsSet('meonjeon-demo:' + k, v); return Promise.resolve({ key: k, value: v }); },
    delete: function (k) { lsDel('meonjeon-demo:' + k); return Promise.resolve({ deleted: true }); },
    list: function () { return Promise.resolve({ keys: ['meonjeon'] }); },
  };
  window.__ME = 'm1';

  /* ── 간이 AI: /api/classify·/api/weather 를 이 안에서 처리 ── */
  var CAT_RULES = [
    [/청소|화장실|싱크대|베란다|분리수거|쓰레기|설거지|정리/, 'home'],
    [/아이랑|놀이|체험|활동|나들이|키즈/, 'kid'],
    [/냉장고|유통기한|먹어야|반찬|식단|이유식|밀키트|장보|장 봐/, 'food'],
    [/빨래|세탁|옷 정리|계절옷|드라이|이불/, 'laundry'],
    [/운동화|신발|사이즈|옷(이|가)? ?작/, 'kid'],
    [/어린이집|유치원|학교|알림장|준비물|학원|숙제/, 'edu'],
    [/병원|접종|검진|약|영양제/, 'health'],
    [/자동차|엔진오일|주유|타이어|세차|검사/, 'transport'],
    [/시부모|부모님|장인|장모|친정/, 'parents'],
    [/생일|명절|추석|설날|제사|경조사|결혼식|돌잔치|손님/, 'event'],
    [/보험|카드값|세금|관리비|연말정산|적금|납부/, 'finance'],
    [/사료|산책|모래|동물병원|강아지|고양이/, 'pet'],
    [/여행|여권|항공|숙소/, 'travel'],
    [/에어컨|세탁기|건조기|정수기|필터|가전|보일러/, 'appliance'],
  ];
  var ST_RULES = [
    [/사야|사기|살 것|구매|주문|장보/, 'buy'],
    [/오늘|당장|지금|급/, 'now'],
    [/확인|알아보|찾아보|언제였|언제 갈|모르겠/, 'check'],
    [/비교|고르|정할|결정/, 'decide'],
    [/일 수도|할 수도|오시면|되면|확정되면/, 'conditional'],
    [/기억|잊지|말아야|알아두/, 'remember'],
  ];
  function guess(rules, text, fb) { for (var i = 0; i < rules.length; i++) if (rules[i][0].test(text)) return rules[i][1]; return fb; }
  function toTitle(cl) {
    var t = cl.replace(/(해야\s*(되고|하고|돼|해|겠다|지)|인 것 같아|것 같아|는 것 같다|라고 했어|래|네|다)\s*$/g, '').trim();
    t = t.replace(/^(아 맞다|그리고|근데|참)\s*/, '');
    return t.slice(0, 18);
  }
  function splitSpeech(sp) {
    var marked = sp.replace(/(되|하|았|었|해|돼|둬|와|져|졌|간|온|는데|니까)고\s/g, '$1고\u0001')
                   .replace(/([다요래봐야어아지])[.]?\s+(?=[가-힣])/g, '$1\u0001');
    return marked.split(/[\u0001.!?\n]/).map(function (x) { return x.trim(); }).filter(function (x) { return x.length >= 4; });
  }
  function classifySpeech(sp) {
    if (sp.indexOf('다음 주 화요일 단수') >= 0) {
      return [
        { title: '단수 전 물 받아두기', category: 'home', status: 'remember', note: '다음 주 화요일 단수' },
        { title: '휴지 구매', category: 'home', status: 'buy', note: '떨어지기 전에' },
        { title: '아이 운동화 사이즈 확인', category: 'kid', status: 'check', note: '작아진 듯' },
        { title: '시부모님 방문 준비', category: 'event', status: 'conditional', note: '토요일 확정되면' },
        { title: '엔진오일 교체일 확인', category: 'transport', status: 'check', note: '기록이 없음' },
        { title: '두부 먼저 먹기', category: 'food', status: 'now', note: '유통기한 임박' },
      ];
    }
    var out = splitSpeech(sp).map(function (cl) {
      return { title: toTitle(cl), category: guess(CAT_RULES, cl, 'etc'), status: guess(ST_RULES, cl, 'week'), note: '' };
    }).filter(function (x) { return x.title.length >= 2; });
    return out.slice(0, 8);
  }
  function discoverItems() {
    var m = new Date().getMonth() + 1;
    if (m >= 8 && m <= 9) return [
      { title: '명절 승차권 예매', why: '추석 기차표는 한 달 전에 열려요', when: '9월에', category: 'event' },
      { title: '가을 환절기 옷 꺼내기', why: '아침저녁 기온차가 커지기 전에', when: '9월에', category: 'laundry' },
    ];
    if (m >= 10 && m <= 12) return [
      { title: '보일러 점검 예약', why: '첫 추위에 몰리면 예약이 안 돼요', when: '11월에', category: 'appliance' },
      { title: '연말정산 영수증 정리', why: '몰아서 하면 놓치는 게 생겨요', when: '12월에', category: 'finance' },
    ];
    return [
      { title: '에어컨 필터 청소', why: '본격 냉방 전에 한 번', when: '5월에', category: 'appliance' },
      { title: '여름옷 정리', why: '작아진 아이 옷부터', when: '5월에', category: 'laundry' },
    ];
  }
  function fakeWeather() {
    var t = { time: [], weather_code: [], temperature_2m_max: [], temperature_2m_min: [], precipitation_probability_max: [] };
    var codes = [0, 1, 2, 3, 61, 1, 0, 2, 1, 3, 0, 1];
    for (var i = 0; i < 12; i++) {
      var d = new Date(Date.now() + i * 86400000);
      var p = function (n) { return String(n).length < 2 ? '0' + n : '' + n; };
      t.time.push(d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()));
      t.weather_code.push(codes[i]);
      t.temperature_2m_max.push(26 - i % 4);
      t.temperature_2m_min.push(17 - i % 3);
      t.precipitation_probability_max.push(codes[i] >= 60 ? 75 : 10 + (i % 3) * 10);
    }
    return t;
  }
  var NL = String.fromCharCode(10);
  function aiText(obj) { return { content: [{ type: 'text', text: JSON.stringify(obj) }] }; }
  function handleClassify(body) {
    var prompt = (body && body.prompt) || '';
    if (body && body.images && body.images.length) {
      if (/냉장고/.test(prompt)) return aiText({
        tasks: [
          { title: '두부 먼저 먹기', category: 'food', status: 'now', note: '유통기한 임박' },
          { title: '애호박 소진', category: 'food', status: 'now', note: '무르기 전에' },
          { title: '달걀 구매', category: 'food', status: 'buy', note: '2개 남음' },
        ],
        menu: [
          { day: '월', dish: '두부조림', use: '두부·양파', tip: '두부조림 레시피' },
          { day: '수', dish: '애호박전', use: '애호박·달걀', tip: '애호박전 만들기' },
          { day: '금', dish: '야채볶음밥', use: '남은 야채', tip: '냉장고털이 볶음밥' },
        ],
      });
      return aiText([
        { title: '체육복 챙기기', category: 'edu', status: 'week', note: '금요일 체육', newCategory: '', cycle: '' },
        { title: '현장학습 동의서 제출', category: 'edu', status: 'now', note: '이번 주 수요일까지', newCategory: '', cycle: '' },
        { title: '견학 도시락 준비', category: 'food', status: 'remember', note: '다음 주 금요일', newCategory: '', cycle: '' },
      ]);
    }
    if (/여행을 준비합니다/.test(prompt)) return aiText([
      { title: '숙소·교통 예약 확인', category: 'travel', daysBefore: 14, note: '취소 기한도' },
      { title: '짐 목록 만들기', category: 'travel', daysBefore: 5, note: '아이 짐 따로' },
      { title: '상비약 챙기기', category: 'health', daysBefore: 3, note: '' },
      { title: '화분·반려동물 맡기기', category: 'home', daysBefore: 2, note: '' },
      { title: '냉장고 정리', category: 'food', daysBefore: 1, note: '상할 것 먼저' },
      { title: '짐 싸기', category: 'travel', daysBefore: 1, note: '충전기 확인' },
    ]);
    if (/을 준비합니다/.test(prompt) && /제사|기일|차례/.test(prompt)) return aiText([
      { title: '제수 메뉴 정하기', category: 'food', daysBefore: 7, note: '어른들께 여쭤보기' },
      { title: '제기·향·초 확인', category: 'event', daysBefore: 5, note: '모자란 건 주문' },
      { title: '제수 장보기 목록', category: 'food', daysBefore: 4, note: '과일·나물·전 재료' },
      { title: '제수 장보기', category: 'food', daysBefore: 2, note: '생물은 하루 전' },
      { title: '집 정리·상 자리', category: 'home', daysBefore: 1, note: '' },
      { title: '음식 장만·전 부치기', category: 'food', daysBefore: 1, note: '' },
      { title: '지방·축문 준비', category: 'event', daysBefore: 1, note: '' },
    ]);
    var m = prompt.match(/발화: "([\s\S]*?)"/);
    if (m) {
      var ANSWERS = [
        [/보험/, '자동차 보험 갱신 전에는 이 순서로 보시면 됩니다.' + NL + NL + '1. 지금 보험의 만기일과 보험료를 먼저 확인하세요. 갱신 안내문이나 보험사 앱에 있습니다.' + NL + '2. 다이렉트 3곳 이상 견적을 같은 조건(자기부담금·특약)으로 비교하세요. 조건이 다르면 금액 비교가 의미 없습니다.' + NL + '3. 블랙박스·마일리지·자녀할인 특약이 빠지지 않았는지 보세요. 마일리지는 나중에 환급받는 구조라 신청만 해두면 됩니다.' + NL + '4. 만기 하루 전에 하면 선택지가 없어집니다. 2주 전에 끝내세요.',
          [['보험 만기일·현재 보험료 확인','transport','check','갱신 안내문에 있어요'],['다이렉트 3곳 견적 비교','transport','week','같은 조건으로'],['마일리지·자녀할인 특약 확인','transport','check','빠지기 쉬워요']]],
        [/놓친|빠진|챙길/, '지금 시기에 이 집에서 빠지기 쉬운 건 세 가지예요.' + NL + NL + '아이가 5살이면 이맘때 취학 전 건강검진 안내가 나옵니다. 기간이 정해져 있어서 놓치면 다시 잡기 어려워요.' + NL + '어린이집 방학·행사 일정은 보통 2주 전에 공지되는데, 알림장을 놓치면 당일 아침에 알게 됩니다.' + NL + '환절기 전에 아이 옷 사이즈를 한 번 재두면 급하게 사는 일이 줄어요.',
          [['영유아 건강검진 시기 확인','kid','check','기간이 정해져 있어요'],['어린이집 방학·행사 일정 확인','edu','week','2주 전 공지'],['아이 옷·신발 사이즈 재기','kid','week','환절기 전에']]],
        [/검사/, '자동차 정기검사는 이렇게 챙기시면 됩니다.' + NL + NL + '비사업용 승용차는 최초 등록 4년 뒤 첫 검사를 받고, 그 뒤로는 2년마다입니다.' + NL + '만료일 전후 31일 안에만 받으면 되니 한 달 전부터 예약하면 넉넉해요.' + NL + '기한을 넘기면 과태료가 붙고 날짜가 지날수록 올라갑니다.' + NL + '설정 → 자동차에서 최초등록 연월만 넣어두시면 다음 검사 시점을 저희가 계산해 미리 알려드려요.',
          [['자동차 최초등록 연월 등록','transport','now','설정에서 한 번만'],['정기검사 예약','transport','week','만료 한 달 전']]],
        [/검진/, '올해 받아야 할 검진을 정리하면 이렇습니다.' + NL + NL + '성인 일반건강검진은 출생연도 홀짝에 따라 해마다 대상이 갈립니다. 직장가입자는 사무직이면 2년마다예요.' + NL + '아이는 영유아 건강검진이 월령 구간마다 있고, 구강검진은 따로 있습니다.' + NL + '연말에 몰리면 예약이 안 되니 상반기에 끝내는 편이 낫습니다.',
          [['건강검진 대상 여부 확인','health','check','출생연도 홀짝'],['검진 예약','health','week','상반기에'],['아이 영유아검진 차수 확인','kid','check','월령 구간']]],
        [/명절|추석|설/, '명절은 준비 시점이 서로 다릅니다.' + NL + NL + '기차표는 명절 한 달 전에 예매가 열리고 몇 분 만에 마감됩니다. 이게 가장 먼저예요.' + NL + '선물은 2주 전, 성묘나 차례 음식 재료는 3~4일 전이 적당합니다.' + NL + '연휴 전날 마트가 붐비니 장보기는 그 전에 끝내두세요.',
          [['명절 승차권 예매일 확인','event','check','한 달 전 오픈'],['선물 목록 정하기','event','week','2주 전'],['차례·성묘 준비물 정리','event','week','']]],

  const list = Array.isArray(st.cars) ? st.cars : [];

}

   여기서 미리 2개로 자르면, 이미 "이미 있어요"로 내린 것이 자리를 차지한 채
   걸러져서 한 개만 남거나 아무것도 안 남습니다. 새로 넣은 링크도 영영 못 뜹니다. */
const linksFor = ({ group, text, flags }) => {
  const t = String(text || "");
  const hit = LINKS.filter((l) => {
    /* 이 집에 해당 없는 건 아예 안 봅니다. 차 없는 집에 주유소를 띄우면
       그 자리는 광고가 아니라 소음입니다 */
    if (l.flag && flags && !flags[l.flag]) return false;
    /* 다른 데를 가리키는 말이 있으면 이 링크가 아닙니다.
       "둘째 6개월 예방접종"의 "접종" 두 글자에 동물병원이 붙던 일이 있었습니다 */
    if ((l.not || []).some((k) => t.includes(k))) return false;
    return (group && (l.g || []).includes(group)) || (l.kw || []).some((k) => t.includes(k));
  });
  return hit;
};
/* {near}가 있는 링크는 사시는 곳을 앞에 붙여 보냅니다.
   "동물병원"으로 보내면 지도가 어디를 보여줄지 모릅니다 —
   설정에 적어둔 동네가 있으면 "강서구 동물병원"으로 보냅니다.
   시·군·구를 안 적었으면 날씨용으로 고른 광역(서울)이라도 씁니다. */
const nearWhere = (st) =>
  String((st && st.region) || "").trim() || ((st && st.place && st.place.label) || "");
/* 앱 하나를 가리키는 링크는 기기마다 주소가 다릅니다.
   예전에는 애플 주소만 넣어서, 안드로이드에서 누르면 아이폰 앱스토어
   웹페이지가 떴습니다 — 받을 수가 없습니다. 절반이 깨져 있던 셈입니다.
   그래서 aos(안드로이드용)를 따로 두고 기기를 보고 고릅니다. */
const isAndroid = () => typeof navigator !== "undefined" && /android/i.test(navigator.userAgent || "");
const linkUrl = (l, text, st) => {
  let u = (isAndroid() && l.aos ? l.aos : l.url).replace("{q}", encodeURIComponent(String(text || "").slice(0, 30)));
  if (l.near) {
    const where = nearWhere(st);
    u = u.replace("{near}", encodeURIComponent((where ? where + " " : "") + l.near));
  }
  return u;
};

/* AI가 준 "YYYY-MM-DD"를 그날 0시로 바꿉니다. 이상한 값이면 null */
function parseWhen(v) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || "").trim());
  if (!m) return null;
  const y = Number(m[1]), mo = Number(m[2]), da = Number(m[3]);
  const d = new Date(y, mo - 1, da);
  /* 13월 40일 같은 값은 Date가 조용히 다른 날로 굴려버립니다. 되돌려 확인합니다 */
  if (d.getFullYear() !== y || d.getMonth() !== mo - 1 || d.getDate() !== da) return null;
  const t = d.getTime();
  if (isNaN(t)) return null;
  /* 지나간 날짜를 주면 오늘로 당깁니다 */
  return Math.max(t, todayKey());
}
/* 말에 시점이 없을 때, 분류만 보고 대강 언제쯤인지 정합니다 */

const defaultDue = (status) => todayKey() + (DUE_BY_STATUS[status] != null ? DUE_BY_STATUS[status] : 3) * DAY;
/* "그날"과 "며칠 전"을 따로 받습니다.
   단수 9/3, 하루 전 → 9/2에 올립니다. 사용자가 역산하지 않게. */
const LEADS = [[0, "당일"], [1, "하루 전"], [2, "2일 전"], [3, "3일 전"], [7, "1주 전"], [14, "2주 전"]];
const dueFromEvent = (eventAt, lead) => Math.max(startOfDay(eventAt) - (Number(lead) || 0) * DAY, todayKey());

/* 남은 날짜 표시 — 오늘/내일/D-3/3일 지남
   date에는 "9/3(목)"처럼 진짜 날짜를 담습니다.
   D-5만 보여주면 며칠인지 세어봐야 하고, 고치려 해도 뭘 고치는지 모릅니다 */
function dueLabel(t) {
  if (!t) return null;
  const dt = new Date(t);
  const date = `${dt.getMonth() + 1}/${dt.getDate()}(${WEEKDAY[dt.getDay()]})`;
  const d = Math.round((todayKey0(t) - todayKey()) / DAY);
  if (d < 0) return { text: `${-d}일 지남`, date, urgent: true };
  if (d === 0) return { text: "오늘", date, urgent: true };
  if (d === 1) return { text: "내일", date, urgent: false };
  return { text: `D-${d}`, date, urgent: false };
}
const todayKey0 = (t) => startOfDay(t);

/* "반복으로"를 누를 때마다 정기 일정을 새로 만들던 시절에, 같은 일정이
   여러 개 쌓인 집이 있습니다. 읽을 때 한 번 정리합니다.
   이름과 영역이 똑같은 것만 묶으므로, 일부러 따로 만든 것은 안 건드립니다. */
/* 영수증에서 나온 재료 손질은 오래 두면 거짓말이 됩니다.
   일주일이면 이미 먹었거나 상했는데 "야채 손질"만 남아 있으면,
   앱이 우리 집을 모른다는 뜻이 됩니다. 안 끝낸 것만 조용히 걷어냅니다. */
function cleanupPerishable(st) {
  const tasks = st.tasks || [];
  const cut = todayKey() - 7 * DAY;
  const kept = tasks.filter((t) => !(t && t.perish && !t.done && (t.dueAt || 0) < cut));
  return kept.length === tasks.length ? st : { ...st, tasks: kept };
}

/* 이 앱은 이제 경조사를 다루지 않습니다. 그런데 그때 만들어둔
   결혼기념일·생신·제사가 아직 "이번 주 정기 일정"에 떠서,
   어른께 전화할 것과 섞여 보입니다. 읽을 때 한 번만 걷어냅니다.
   해마다 한 번 오는 것(anchor)만 봅니다 — 손으로 만드신 반복은 안 건드립니다. */
function dropAnniversaries(st) {
  const ro = { ...(st.routines || {}) };
  const gone = (st.customRoutines || []).filter((cr) => (ro[`c:${cr.id}`] || {}).anchor);
  if (!gone.length) return st;
  gone.forEach((cr) => { delete ro[`c:${cr.id}`]; });
  const ids = new Set(gone.map((cr) => cr.id));
  return { ...st, routines: ro, customRoutines: (st.customRoutines || []).filter((cr) => !ids.has(cr.id)) };
}

function dedupeRoutines(st) {
  const list = st.customRoutines || [];
  if (list.length < 2) return st;
  const seen = new Map(), keep = [], drop = [];
  list.forEach((r) => {
    const k = `${String(r.title || "").trim()}|${r.category || ""}`;
    if (seen.has(k)) { drop.push(r); return; }
    seen.set(k, r); keep.push(r);
  });
  if (!drop.length) return st;
  const ro = { ...(st.routines || {}) };
  drop.forEach((r) => { 
    const first = seen.get(`${String(r.title || "").trim()}|${r.category || ""}`);
    /* 지우는 쪽이 켜져 있었으면 남기는 쪽도 켜줍니다 */
    const mineOn = (ro[`c:${r.id}`] || {}).on;
    if (mineOn && ro[`c:${first.id}`]) ro[`c:${first.id}`] = { ...ro[`c:${first.id}`], on: true };
    delete ro[`c:${r.id}`];
  });
  return { ...st, customRoutines: keep, routines: ro };
}

     집안 내용이 아니라 숫자 하나라서 베타 지표에서 이것만 읽습니다 */
  opens: 0,
  /* 복지를 실제로 읽어보는지. "복지가 꼭 필요한가"는 말로 정할 게 아니라
     30가구가 4주 동안 몇 번 여는지로 정합니다. 이것도 숫자 하나입니다. */
  wfRead: 0,
  tasks: [], routines: {}, customRoutines: [], prefs: {}, groupsOff: {}, customCats: [],
  /* 루틴 key → 제목. 알림 서버가 읽습니다 (서버는 씨앗 목록을 모릅니다) */
  routineTitles: {},
  /* 온보딩에서 안 넣고 넘어간 날짜. 며칠 뒤에 앱이 먼저 물어봅니다 */
  pendingDates: [], pendingAt: 0,
  /* 온보딩에서 통째로 끈 영역. 사흘 뒤에 딱 한 번만 다시 물어봅니다 */
  skippedCats: [],
  events: [], feedback: [], discoverSnoozed: [], dismissedDiscover: [],
  discoverCache: null, pantry: [],
  /* 최근에 낸 식단 메뉴 — 다음에 짤 때 겹치지 않게 씁니다 */
  mealPast: [],
  /* 주간 카드를 본 주 (일요일 날짜) */
  /* 앱 안 브라우저 안내를 닫은 시각 */
  inAppOff: 0,
  /* 기본 분담: 카테고리 → 담당자. 여기 있는 건 매번 정하지 않아도 됩니다 */
  duty: {}, dutyAsk: true,
  /* 처음 채우기 안내 — 온보딩을 끝내면 첫 화면에 한 번 남깁니다 */
  oneShotAsk: 0, oneShotOff: 0,
  /* 공유하기로 들어온 글에서 뽑힌 제목 → 몇 번째인지.
     두 번째부터 "매번 공유 안 하셔도 됩니다"를 말해줄 수 있습니다. */
  shareSeen: {},
  /* 휴일 날씨 브리핑 */
  place: { label: "서울", lat: 37.5665, lon: 126.978 },
  brief: null,
  /* 서로 넘긴 일 */
  toss: [],
  /* ── 어른께 거는 전화 ──────────────────────────
     조부모께 아이를 맡기는 집을 위한 것입니다.
     전제가 하나 있고, 그 전제가 이 기능의 전부입니다 —
     어른은 앱을 켜지 않으십니다. 문자도 안 읽으시고, 사진도 안 찍으십니다.
     받으시는 것 말고는 아무것도 하지 않으십니다.
     그래서 넣는 일은 전부 부모 몫이고, 요일별로 한 번만 넣으면 됩니다. */
  callOn: false,
  elders: [],        /* { id, label, phone } — 이름 대신 호칭으로 부릅니다 */
  callAt: "07:50",
  /* 하루에 걸 전화 수. 넘는 것은 문자로 내려갑니다.
     한 통 285원, 문자 20원이라 이 숫자 하나가 그 집의 값을 정합니다. */
  callMax: 2,
  /* 앱이 미리 구워둔 "나갈 말". 서버는 이걸 읽어서 보내기만 합니다.
     서버가 문장을 다시 만들면 부모가 미리보기에서 본 것과 달라질 수 있고,
     그러면 "내가 본 게 안 나갔다"가 됩니다. 그건 이 앱이 죽는 길입니다.
     { "2026-09-02": [{ id, at, text, sms }] } */
  callOutbox: {},
  /* 나가기 전에 부모에게 한 번 알릴지. 기본은 켬 —
     처음 몇 주는 "무엇이 나가는지" 보고 싶어 하십니다.
     익숙해지면 끄시면 됩니다. 끄셔도 전화는 그대로 나갑니다. */
  callHeadsUp: true,
  /* 아침에 한 번 몰아 알려드릴지. 기본은 끔 — 어른이 아침에 오시면
     부모가 그 자리에서 말하고 나갑니다. 부모가 먼저 나가는 집만 켭니다. */
  callMorning: false,
  callPlan: {},      /* "1"~"5" (월~금) → [{ id, time, what }] */
  callToday: {},     /* dateKey → { add: [...], skip: [id...], off: true }  그날만 다른 것 */
  callLog: {},       /* dateKey → { at, ok }  받으셨는지. 어른이 안 하셔도 남습니다 */
  /* 한때 아침마다 "이대로 보내기"를 누르게 했습니다. 그런데 매일 누를 것이
     있으면 그것이 매일 일이 됩니다. 없앴습니다 — 옛 판에서 넘어온 값만 남습니다 */
  callChecked: {},
  callOff: 0,        /* 안내 카드를 닫은 시각. 조부모께 안 맡기는 집도 많습니다 */
  notify: { on: false, hour: 8 },
  /* AI 사용량 — 달이 바뀌면 month가 갱신되며 0부터 다시 셉니다 */
  aiUsage: { month: "", talk: 0, photo: 0, find: 0 },
  plan: "free",
  draft: "",
  onboarded: false,
};

/* ── 유틸 ─────────────────────────────────────── */
const DAY = 86400000;
const uid = (p) => `${p}${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
const monthsToDays = (m) => Math.round(m * 30.44);
const startOfDay = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const todayKey = () => startOfDay(Date.now());
/* 설정에 적어둔 "2027-01-15" 같은 날짜를 밀리초로 바꿉니다.
   안 적었거나 형식이 다르면 null — 그러면 예전처럼 시점 미정으로 둡니다. */
const isoDay = (s) => (s && /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s + "T00:00:00").getTime() : null);

/* ── 어른께 읽어드릴 말 ────────────────────────────
   전화 한 통에 기본료 200원이 붙습니다. 나눠 걸수록 손해라서
   그날 것을 한 통에 다 담습니다. 한 항목이 8~10초라 대여섯 개가 한계고,
   그것보다 많으면 어른이 못 외우십니다. 그래서 여섯 개에서 끊습니다. */
/* 하루에 어른께 전할 수 있는 항목 수.
   6이던 시절에는 통마다 값이 들어서 막아둔 것이었는데,
   이제는 넘는 것이 문자(20원)로 내려가니 그럴 이유가 없습니다.
   아이 둘이면 하원 둘·학원 둘·하원 둘로 여섯이 그냥 차고,
   거기에 준비물이 붙으면 하원 하나가 조용히 잘렸습니다. */
const CALL_MAX = 12;
/* 원가를 화면에 띄울지. 베타 동안 만드는 사람은 봐야 하고,
   부모에게는 보일 이유가 없습니다 — 통신사도 문자마다 22원이라고 안 알려줍니다.
   주소 뒤에 ?cost 를 붙이면 켜집니다. */
const DEV_COST = typeof location !== "undefined" && /[?&]cost\b/.test(location.search);
const DOW_KR = ["일", "월", "화", "수", "목", "금", "토"];

/* 다음에 전화가 나갈 날. 오늘 나갈 시각이 아직이면 오늘, 지났으면 내일입니다.
   부모가 챙기는 자리는 전날 저녁입니다 — 아침에 알면 준비물은 이미 늦고,
   출근 준비 중이라 보지도 못합니다. */
function nextCallDay(st, now) {
  const t = now || Date.now();
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(st.callAt || "07:50"));
  const cut = new Date(t);
  cut.setHours(m ? Number(m[1]) : 7, m ? Number(m[2]) : 50, 0, 0);
  return startOfDay(t < cut.getTime() ? t : t + DAY);
}

/* 그날 어른께 갈 줄들. 요일 반복에서 가져와 그날 것만 더하고 뺍니다 */
function callItemsFor(st, when) {
  const day = startOfDay(when || Date.now());
  const dow = String(new Date(day).getDay());
  const base = ((st.callPlan || {})[dow] || []).slice();
  const t = (st.callToday || {})[day] || {};
  const skip = t.skip || [];
  const rows = base.filter((r) => skip.indexOf(r.id) < 0).concat(t.add || []);
  /* 시각 없는 것(준비물·먹는 약)을 뒤로 보냅니다.
     빈 문자열이 "11:50"보다 앞서 정렬돼서, 넘칠 때 잘리는 쪽이
     준비물이 아니라 하원이 되고 있었습니다. */
  const key = (r) => (/^\d{1,2}:\d{2}$/.test(String(r.time || "")) ? r.time : "99:99");
  return rows
    .filter((r) => r && r.what)
    .sort((a, b) => key(a).localeCompare(key(b)))
    .slice(0, CALL_MAX);
}

/* 어른께 나갈 말은 명사로 끝나야 합니다.
   "소아과 진료 있어요"가 그대로 들어와서
   "오후 3시 소아과 진료 있어요입니다"가 나가고 있었습니다. */
const CALL_TAIL = /\s*(있어요|있습니다|있음|이에요|예요|에요|입니다|이라네요|래요|한대요|합니다|해요)$/;
function callWhat(s) {
  let w = String(s || "").trim().slice(0, 40);
  for (let i = 0; i < 3 && CALL_TAIL.test(w); i++) w = w.replace(CALL_TAIL, "").trim();
  return w;
}
/* 같은 것을 두 번 말씀하셨는지 보는 열쇠 */
const callKey = (r) => `${r.kid || ""}|${r.kind || "sked"}|${callWhat(r.what)}`;

/* 앞서 말한 것을 고쳐 말하면 덮어써야 합니다. 그냥 붙이고 있어서
   "태권도 오후 3시"와 "태권도 오후 2시"가 나란히 남았고,
   어른은 같은 학원을 두 번 들으셨습니다. */
function callMerge(sv, cday, rows) {
  const t = { ...(sv.callToday || {}) };
  const cur = t[cday] || {};
  let add = (cur.add || []).slice();
  const skip = (cur.skip || []).slice();
  const dow = String(new Date(cday).getDay());
  const base = (sv.callPlan || {})[dow] || [];
  rows.forEach((r) => {
    const k = callKey(r);
    add = add.filter((a) => callKey(a) !== k);          /* 아까 말한 같은 것을 지웁니다 */
    const 겹침 = base.filter((b) => callKey(b) === k);
    /* 요일 계획에 이미 있는 것을 시각 없이 다시 말씀하신 것이면
       계획 쪽이 낫습니다 — 시각이 붙어 있으니까요 */
    if (겹침.length && !r.time) return;
    겹침.forEach((b) => { if (skip.indexOf(b.id) < 0) skip.push(b.id); });
    add.push(r);
  });
  t[cday] = { ...cur, add, skip };
  return t;
}

/* 뺀 것까지 다 돌려줍니다. 반차처럼 "몇 개만" 빼는 화면에서는
   이미 뺀 것도 보여야 다시 켜실 수 있습니다. */
function callAllFor(st, when) {
  const day = startOfDay(when || Date.now());
  const dow = String(new Date(day).getDay());
  const base = ((st.callPlan || {})[dow] || []).slice();
  const t = (st.callToday || {})[day] || {};
  const key = (r) => (/^\d{1,2}:\d{2}$/.test(String(r.time || "")) ? r.time : "99:99");
  return base.concat(t.add || [])
    .filter((r) => r && r.what)
    .sort((a, b) => key(a).localeCompare(key(b)));
}

/* 상한에 걸려 안 나가는 것이 있으면 부모가 알아야 합니다.
   조용히 자르면 어른이 못 들으신 줄도 모릅니다. */
function callDropped(st, when) {
  const day = startOfDay(when || Date.now());
  const dow = String(new Date(day).getDay());
  const t = (st.callToday || {})[day] || {};
  const skip = t.skip || [];
  const all = ((st.callPlan || {})[dow] || []).filter((r) => skip.indexOf(r.id) < 0)
    .concat(t.add || []).filter((r) => r && r.what);
  return Math.max(0, all.length - CALL_MAX);
}

/* 시각을 어른이 들으시는 대로 읽습니다. "15:20"을 "십오 시"라고 하면
   되물으십니다. "오후 세 시 이십 분"이 귀에 들어오는 말입니다. */
/* "서연는 오후 4시 하원입니다"가 나갔습니다. 받침을 안 봤거든요.
   어른이 귀로 들으시는 문장이라 조사 하나가 그대로 티가 납니다.
   한글 받침은 (글자코드 - 0xAC00) % 28 로 압니다. 0이면 받침이 없습니다. */
const 은는 = (w) => {
  const t = String(w || "").trim();
  if (!t) return "";
  const c = t.charCodeAt(t.length - 1);
  if (c < 0xac00 || c > 0xd7a3) return t + "는";     /* 한글이 아니면 그냥 는 */
  return t + ((c - 0xac00) % 28 ? "은" : "는");
};

const callTime = (t) => {
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || ""));
  if (!m) return "";
  let h = Number(m[1]); const mm = Number(m[2]);
  if (h > 23 || mm > 59) return "";
  const ampm = h < 12 ? "오전" : "오후";
  h = h % 12 || 12;
  return mm ? `${ampm} ${h}시 ${mm}분` : `${ampm} ${h}시`;
};

/* 한 통에 담을 것을 시간대로 묶습니다.
   기본료 220원이 통마다 붙어서, 통 수가 곧 돈입니다.
   그런데 나눌 값어치가 있는 것도 있습니다 — 아침 여덟 시에 들은 말을
   오후 세 시까지 기억하시는 건 어렵습니다. 특히 일흔이 넘으시면요.

   그래서 "따로"를 켠 줄만 그 시각 30분 전에 한 통씩 나가고,
   나머지는 아침 한 통에 다 실립니다. 30분 전에 한 번이지,
   30분 전과 그 시각에 두 번이 아닙니다.

   그리고 나누지 않아도 되는 것이 생각보다 많습니다.
   약은 밥에 붙어 있습니다 — 아침 먹고, 점심 먹고. 어른이 밥을 챙기시니
   약도 그때 하십니다. 시각을 따로 알려드릴 일이 아니라,
   달라졌을 때만 말씀드리면 됩니다.
   하원과 이어지는 학원도 한 흐름이라 한 통에 들어갑니다. */
/* 어른이 앱을 쓰시면 전화를 안 걸어도 됩니다.
   60대는 스마트폰을 잘 쓰십니다. 70~80대가 어렵고요.
   앱으로 가면 알림이 공짜라 일정마다 30분 전에 보내드려도 값이 안 듭니다.
   전화는 통마다 220원이라 묶어야 했지만, 알림은 묶을 이유가 없습니다. */
const elderByApp = (st) => (((st.elders || [])[0] || {}).how === "app");

function callBatches(st, when) {
  /* 그날은 통째로 안 맡기시는 날 — 아무것도 안 나갑니다 */
  if (((st.callToday || {})[startOfDay(when || Date.now())] || {}).off) return [];
  const rows = callItemsFor(st, when);
  if (!rows.length) return [];
  const byApp = elderByApp(st);

  const out = [];
  /* 아침 통화는 기본이 아닙니다.
     어른이 아침에 오시면 부모가 그 자리에서 브리핑하고 나갑니다.
     그 직후에 앱이 또 전화하면 방금 들은 것을 다시 듣는 것이라 이상합니다.

     진짜 문제는 아침에 모르시는 게 아니라, 오후 세 시까지 기억하시기
     어려운 것입니다. 그래서 기본은 "그 일 30분 전"입니다. */
    const two = rows.filter((r) => r.alert && r.time);
    const rest = rows.filter((r) => !(r.alert && r.time));

    /* ── 가까운 것끼리 한 통으로 ────────────────────────
       하원 11시 50분, 병원 12시 10분이면 전에는 11:20과 11:40에
       따로 두 통이 나갔습니다. 20분 사이에 전화가 두 번 오는 겁니다.
       어른께는 성가시고 값은 두 배입니다.

       30분 안에 붙어 있는 것은 한 통에 담고, 제일 이른 것의 30분 전에 겁니다.
       늦는 것보다 조금 이른 게 낫습니다 — 시각은 다 읽어드리니까요. */
    const MERGE = 30;
    const mins = (t) => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || "")); return m ? Number(m[1]) * 60 + Number(m[2]) : 0; };
    const 묶음 = [];
    two.slice().sort((a2, b2) => mins(a2.time) - mins(b2.time)).forEach((r) => {
      const last = 묶음[묶음.length - 1];
      if (last && mins(r.time) - mins(last[0].time) <= MERGE) last.push(r);
      else 묶음.push([r]);
    });

    묶음.forEach((g) => {
      out.push({ at: minus30(g[0].time), rows: g, kind: g.length > 1 ? "곧 있을 것" : "30분 전", must: true });
      /* 앱 알림은 값이 안 드니 정각에 한 번 더 */
      if (byApp) g.forEach((r) => out.push({ at: r.time, rows: [r], kind: "정각", must: true }));
    });
    out.sort((a2, b2) => String(a2.at).localeCompare(String(b2.at)));

  /* 안 켠 것(약·준비물)도 어딘가에는 실려야 합니다 */
  if (rest.length) {
    if (st.callMorning || !out.length) {
      out.unshift({ at: st.callAt || "07:50", rows: rest, kind: "아침" });
    } else {
      out[0] = { ...out[0], rows: rest.concat(out[0].rows) };
    }
  }

  /* ── 전화는 아껴 쓰는 자원입니다 ────────────────────
     한 통 285원, 문자 20원. 열네 배 차이입니다.
     아이가 둘이면 하원 둘·학원 둘·하원 둘로 하루 여섯 건이 되는데,
     전부 전화로 걸면 월 37,620원이라 아무도 안 삽니다.

     그래서 하루에 걸 전화 수를 정해두고, 넘는 것은 문자로 내립니다.
     먼저 먹는 쪽은 "놓치면 되돌릴 수 없는 것"(must)이고,
     아침 요약은 남을 때만 전화로 갑니다 — 아침엔 어른이 여유가 있고
     글로 오면 나중에 다시 보실 수 있으니까요.

     부모에게는 이걸 안 알립니다. "오늘 전화 2통 다 쓰셨어요"는
     우리 사정이지 부모 사정이 아니고, 그걸 읽는 순간 부모 일이 하나 늡니다.
     미리보기에 전화인지 문자인지만 보이면 됩니다. */
  if (byApp) return out;

  /* 부모가 항목마다 정해둔 것이 예산보다 앞섭니다.
     복직 초반엔 다 전화로 듣고 싶으시다가, 한 달쯤 지나 외우시면
     "피아노는 이제 문자로"가 됩니다. 그게 이 앱이 오래 가는 길입니다 —
     안 그러면 3주차에 "이 전화 왜 오지"가 되고 그대로 해지입니다. */
  const way = (b2) => {
    const w = b2.rows.map((r) => r.way).filter(Boolean);
    if (w.includes("call")) return "call";                     /* 하나라도 꼭 전화면 전화 */
    if (!w.length || w.length !== b2.rows.length) return "auto";
    if (w.every((x) => x === "sms")) return "sms";
    if (w.every((x) => x === "app")) return "app";
    return "auto";
  };
  const 고정전화 = out.filter((b2) => way(b2) === "call");
  /* 앱으로 고른 것은 값이 안 듭니다. 다만 어른이 앱을 안 보시면
     조용히 안 갑니다 — 그래서 기본값이 아니라 부모가 눌러서 고르는 것입니다. */
  const 고정앱 = new Set(out.filter((b2) => way(b2) === "app"));
  const 고정문자 = new Set(out.filter((b2) => way(b2) === "sms"));
  const 나머지 = out.filter((b2) => way(b2) === "auto");

  let left = Math.max(0, Number(st.callMax != null ? st.callMax : 2));
  const 전화 = new Set(고정전화);
  left -= 고정전화.length;                                      /* 꼭 전화가 예산을 먼저 먹습니다 */
  나머지.filter((b2) => b2.must).forEach((b2) => { if (left > 0) { 전화.add(b2); left--; } });
  나머지.filter((b2) => !b2.must).forEach((b2) => { if (left > 0) { 전화.add(b2); left--; } });
  return out.map((b2) =>
    고정앱.has(b2) ? { ...b2, app: true }
    : 전화.has(b2) && !고정문자.has(b2) ? b2
    : { ...b2, sms: true });
}

/* 부모가 말한 것 중 "어른께 갈 것"과 "내가 챙길 것"을 갈라주는 지시문.
   자리를 둘로 두면 부모가 어디에 말할지를 매번 정해야 합니다.
   그건 앱이 할 일이지 부모가 할 일이 아닙니다. */
function CALL_SPLIT(st, today) {
  if (!st.callOn || !(st.elders || []).length) return "";
  const label = ((st.elders || [])[0] || {}).label || "어른";
  return `
- **${label}께 전화로 갈 것은 call 배열에 따로 담으세요.** items에는 넣지 마세요.
  아이를 그날 맡기시는 집이라, 부모가 "내일 3시 소아과"라고 하면
  그건 내 할 일이 아니라 ${label}께 알려드릴 말입니다.
  · 시각이 있는 일정은 kind "sked", time "HH:MM".
  · 약은 kind "med", "언제 이름 용량" 순으로.
  · 부모가 챙겨둔 준비물은 kind "bag", 물건 이름만.
  · 심부름 부탁(세탁소 찾기·택배 받아두기)은 call에 넣지 마세요.
    이 앱은 아이 일정을 전하는 곳이지 심부름을 시키는 곳이 아닙니다. items로 보내세요.
  · what은 15자 이내, ${label}이 들으실 말투로. 아이 이름은 what이 아니라 who에.
  · **what은 명사로 끝내세요.** "소아과 진료"이지 "소아과 진료 있어요"가 아닙니다.
    이 말이 그대로 읽혀서, 서술어를 붙이면 "오후 3시 소아과 진료 있어요입니다"가 나갑니다.
  · 부모가 앞서 말한 것을 **고쳐 말하면 고친 것만 보내세요.**
    같은 일을 두 번 담으면 어른이 같은 학원을 두 번 들으십니다.
  · 놓치면 되돌릴 수 없는 것은 alert를 true로 하세요. 그러면 그 시각 30분 전에
    따로 전화가 갑니다. 아침에 한 번 들으신 것을 오후 세 시까지 기억하시라고 할 수는 없습니다.
    true로 할 것: 병원·진료, 하교·하원, 정해진 시각에 데려다주는 학원,
    시각이 정해진 약(안약·연고·흡입기).
    false로 둘 것: 먹는 약처럼 밥에 붙어 있는 것, 준비물, 시각이 없는 것.
    판단이 서지 않으면 true로 두세요 — 놓치는 쪽이 더 나쁩니다.
  · **놓치면 되돌릴 수 없는 것은 alert를 true로 하세요.** 그러면 그 시각 30분 전에
    따로 전화가 갑니다. 아침에 한 번 들으신 것을 오후 세 시까지 기억하시라고 할 수는 없습니다.
    true로 할 것: 병원·진료, 하교·하원, 정해진 시각에 데려다주는 학원,
    시각이 정해진 약(안약·연고·흡입기).
    false로 둘 것: 먹는 약처럼 밥에 붙어 있는 것, 준비물, 부탁, 시각이 없는 것.
    판단이 서지 않으면 true로 두세요 — 놓치는 쪽이 더 나쁩니다.
  · 아이를 어떻게 키우라는 말(배변훈련·훈육·수면교육)은 만들지 마세요.
  · 매주 똑같이 반복되는 것은 call에 넣지 마세요 — 그건 전화 탭에 한 번만 넣는 것입니다.
    call은 **그날만 다른 것**입니다.
- 예약 잡기·체육복 빨아두기·학원비 내기처럼 **부모가 직접 할 일**은 그대로 items로.
  어른께 시킬 수 없는 것, 시켜서는 안 되는 것이 여기입니다.
- 오늘은 ${today}입니다. 날짜가 오늘이나 내일이 아니면 call이 아니라 items로 보내세요.

- 그날 안 맡기실 것 같으면 offDay를 true로 하세요.
  누가 쉬는지는 상관없습니다 — "아빠 연차", "엄마 연차", "내가 쉬어",
  "우리 둘 다 쉬는 날", "내일은 내가 볼게", "어린이집 안 가", "우리가 데리고 있어".
  반차·오전만·오후만처럼 **반쪽인 말도 offDay를 true로** 하세요.
  전부 끄자는 뜻이 아니라, 부모께 여쭤볼 자리를 만드는 것입니다.
  다만 이건 확인용입니다 — 앱이 마음대로 끄지 않고 부모께 한 번 물어봅니다.
  "연차"가 반드시 "안 맡긴다"는 뜻은 아니거든요.
  아빠가 연차인데 병원에 가시고 아이는 그대로 어른께 갈 수도 있습니다.
  잘못 꺼서 하원을 아무도 안 가는 것이 이 앱에서 제일 나쁜 실패입니다.
  offDay가 true여도 call은 평소대로 뽑으세요. 끄는 것은 부모가 정합니다.
  다만 **재택근무는 offDay가 아닙니다.** 집에 있어도 회의 중이면 하원은 어른이 가십니다.
  "재택", "집에서 일해"만 있는 말에는 offDay를 false로 두세요.
`;
}

/* 오늘과 내일 나갈 말을 미리 구워둡니다.
   서버(api/voice-send)가 이걸 읽어서 그대로 보냅니다. */
function bakeOutbox(st) {
  const box = {};
  [0, 1].forEach((n) => {
    const when = todayKey() + n * DAY;
    const day = new Date(when);
    const k = `${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, "0")}-${String(day.getDate()).padStart(2, "0")}`;
    if (!st.callOn || !((st.elders || [])[0] || {}).phone) return;
    const bs = callBatches(st, when);
    if (!bs.length) return;
    box[k] = bs.map((b, i) => ({
      /* id에 내용을 넣으면 안 됩니다.
         08:58에 나간 뒤 08:59에 부모가 고치면 id가 바뀌어
         "안 보낸 통"이 되고, 09:00에 한 번 더 나갑니다.
         시각과 차례로만 만듭니다 — 고치면 아직 안 나간 통에만 반영되고,
         이미 나간 통은 그대로 둡니다. 나간 말을 되돌릴 수는 없으니까요. */
      id: `${b.at}-${b.app ? "a" : b.sms ? "s" : "c"}-${i}`,
      at: b.at, sms: !!b.sms, app: !!b.app,
      text: (b.sms || b.app) ? smsText(st, when, b.rows) : callScript(st, when, b.rows),
    }));
  });
  return box;
}

/* 전화 대신 문자로 갈 때의 글. 읽어드리는 말투를 그대로 쓰지 않습니다 —
   "끊으셔도 됩니다"는 글에서는 뜻이 없고, 보낸 사람이 누구인지가 필요합니다. */
function smsText(st, when, rows) {
  const body = callScript(st, when, rows)
    .replace(/^[^,]+,\s*/, "")            /* "어머니, " 머리말은 뺍니다 */
    /* 베타의 "1번을 눌러주세요"는 전화에만 붙습니다.
       문자에 그게 가면 어른이 눌러도 아무 일이 안 일어나고,
       글자 수가 90바이트를 넘어 장문(50원)이 됩니다. */
    .replace(/\s*들으셨으면 1번을 눌러주세요\.\s*안 누르셔도 괜찮습니다\.?/, "")
    .replace(/\s*끊으셔도 됩니다\.?\s*$/, "");
  const me = (st.members || []).find((m) => m.id === (st.me || "m1"));
  const who = (me && me.name) ? me.name : "";
  return who ? `${body}\n- ${who}` : body;
}

/* 단문은 90바이트(한글 45자)까지 20원 안팎, 넘으면 장문이 되어 값이 뜁니다.
   부모가 길게 적으면 미리 알려줘야 합니다. */
function smsCost(text) {
  const bytes = [...String(text || "")].reduce((n, ch) => n + (ch.charCodeAt(0) < 128 ? 1 : 2), 0);
  return { bytes, won: bytes <= 90 ? 20 : 50, long: bytes > 90 };
}

/* "15:20" → "14:50" */
function minus30(t) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || ""));
  if (!m) return t;
  let v = Number(m[1]) * 60 + Number(m[2]) - 30;
  if (v < 0) v += 1440;
  return `${String(Math.floor(v / 60)).padStart(2, "0")}:${String(v % 60).padStart(2, "0")}`;
}

/* 어른께 그대로 나갈 문장. 부모가 미리 볼 수 있어야 해서 따로 뺐습니다.
   확인을 요구하지 않습니다 — 버튼을 누르시라고 하면 그 순간
   어른이 이 앱의 사용자가 되어버립니다. 끊으시면 끝입니다.

   준비물은 "챙겨주세요"가 아니라 "챙겨뒀어요"입니다.
   전화로 부를 수 있는 건 두세 개까지고, 그보다 많으면 어른이 못 외우십니다.
   그리고 준비물은 부모가 전날 챙기는 게 맞습니다. 어른께 시킬 일이 아닙니다. */
function callScript(st, when, rows) {
  const list = rows || callItemsFor(st, when);
  if (!list.length) return "";
  const elder = (st.elders || [])[0] || {};
  const label = elder.label || "어르신";
  const kids = st.children || [];
  const day = startOfDay(when || Date.now());
  const t = (st.callToday || {})[day] || {};
  /* 부모가 그날 문장을 통째로 고쳤으면 그것이 우선입니다 */
  if (t.script) return String(t.script);

  const nameOf = (id) => (kids.find((k) => k.id === id) || {}).name || "";
  const 하나 = kids.length <= 1;
  const 첫아이 = kids[0] && kids[0].name ? kids[0].name : "아이";

  const 일정 = list.filter((r) => r.kind !== "bag");
  const 가방 = list.filter((r) => r.kind === "bag");

  /* ── 아이별로 묶고, 그 안에서 시간순 ────────────────
     전에는 들어온 차례대로 이어붙였습니다. 그래서 이런 게 나갔습니다 —
     "태권도, 첫째 오후 1시 30분 피아노, 첫째 오후 2시 30분 하원, 첫째 오후 3시 간식"
     시각 없는 것이 맨 앞에 오고, 같은 아이인데 "첫째"가 매 줄에 붙습니다.
     귀로 들으면 누구 것인지 따라가기가 어렵습니다.

     이제 아이마다 한 덩이로 묶고 이름은 그 앞에 한 번만 부릅니다 —
     "첫째는 1시 30분 피아노 데려다주기, 2시 30분 하원, 3시 간식입니다."
     시각이 없는 것은 뒤로 보냅니다. 시각이 있는 것이 먼저 들려야
     어른이 시계를 보실 수 있습니다. */
  const mm = (r) => {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(r.time || ""));
    return m ? Number(m[1]) * 60 + Number(m[2]) : 9999;   /* 시각 없는 것은 맨 뒤 */
  };
  const 시간순 = (a2, b2) => mm(a2) - mm(b2);

  /* 아이 차례는 등록 순서 그대로. 그래야 매일 같은 차례로 들리십니다 */
  const 묶음 = [];
  if (하나) {
    묶음.push({ name: "", rows: 일정.slice().sort(시간순) });
  } else {
    kids.forEach((k) => {
      const mine = 일정.filter((r) => r.kid === k.id).sort(시간순);
      if (mine.length) 묶음.push({ name: k.name || "아이", rows: mine });
    });
    /* 누구 것인지 안 정해진 것은 이름 없이 뒤에 붙입니다 */
    const 미정 = 일정.filter((r) => !kids.some((k) => k.id === r.kid)).sort(시간순);
    if (미정.length) 묶음.push({ name: "", rows: 미정 });
  }

  /* 시각이 없는 것을 시각 있는 것 뒤에 그냥 이어붙이면
     "오후 3시 간식 주기, 태권도입니다"가 되어 3시에 태권도인 줄 아십니다.
     문장을 끊고 "그밖에"로 시작합니다. */
  const 문장 = 묶음.map((g) => {
    const 때있 = g.rows.filter((r) => r.time);
    const 때없 = g.rows.filter((r) => !r.time);
    const 앞말 = g.name ? `${은는(g.name)} ` : "";
    const 조각 = [];
    if (때있.length) 조각.push(`${앞말}${때있.map((r) => `${callTime(r.time)} ${r.what}`).join(", ")}입니다.`);
    if (때없.length) 조각.push(`${때있.length ? "그밖에 " : 앞말}${때없.map((r) => r.what).join(", ")}가 있습니다.`);
    return 조각.join(" ");
  }).join(" ");

  /* "유치원 가방"이 들어오면 "유치원 가방 가방에"가 나갔습니다 */
  const 가방목록 = 가방.map((r) => (하나 ? "" : (nameOf(r.kid) ? nameOf(r.kid) + " " : "")) + r.what).join(", ");
  const 가방줄 = 가방.length
    ? ` ${가방목록}${/가방$/.test(가방목록) ? "에" : " 가방에"} 챙겨뒀어요. 현관에 두겠습니다.`
    : "";
  const 곧 = list === rows && rows.length === 1 && rows[0].alert;
  const 머리 = 하나 ? `${label}, ${첫아이} ` : `${label}, `;
  const 앞 = 일정.length
    ? `${머리}${곧 ? "곧 있을 일정입니다" : "오늘 일정입니다"}. ${문장}`
    : `${머리}오늘입니다.`;
  return `${앞}${가방줄}${confirmTail()} 끊으셔도 됩니다.`;
}

/* 약은 이름·용량·때를 따로 받습니다. 자유롭게 적게 두면
   "약 먹이기"라고만 적고 마는데, 어른께는 그 말이 아무 소용이 없습니다. */
/* 먹는 약은 밥에 붙어 있어서 시각을 따로 알려드릴 일이 아닙니다.
   그런데 안약·연고·흡입기는 밥과 무관하고, 그래서 제일 잘 빠뜨립니다.
   그런 것만 그 시각에 따로 겁니다. */
const MED_WHEN = ["아침 먹고", "점심 먹고", "저녁 먹고", "자기 전", "정한 시각에"];
/* 약 이름·용량을 매번 적는 게 번거로우면 이 하나로 끝냅니다.
   부모가 전날 봉투에 담아두고, 어른은 그걸 꺼내 드리기만 하시면 됩니다.
   병명·약 이름이 스피커폰으로 새어나가는 것도 같이 막힙니다. */

function childMonths(ch) {

const HOLIDAYS = {

const ymd = (d) => {
  const p = (n) => String(n).padStart(2, "0");

const isHoliday = (d) => {

/* 이번 쉬는 날 묶음을 찾습니다. 금요일이 공휴일이면 목요일에 브리핑합니다 */
function nextBreak(from) {
  const base = startOfDay(from || Date.now());
  for (let i = 0; i <= 9; i++) {
    const d = new Date(base + i * DAY);
    if (!isHoliday(d)) continue;
    const days = [];
    for (let j = 0; j < 6; j++) {
      const n = new Date(base + (i + j) * DAY);
      if (!isHoliday(n)) break;
      days.push(n);
    }
    return { start: days[0], days, briefAt: startOfDay(days[0].getTime() - DAY) };
  }
  return null;
}

function eligibleRoutines(st, ignoreSeason) {

    if (seed.ct) {
      const kinds = carsOf(st).map((c) => c.type || "ice");
      const want = seed.ct.split("|");
      if (!kinds.some((k) => want.includes(k))) return;
    }
    if (seed.kid) {
      st.children.forEach((ch) => {
        const m = childMonths(ch);
        if (m >= seed.w[0] && m <= seed.w[1]) out.push({ key: keyOf(seed, ch), seed, child: ch });
      });
    } else if (seed.nkid) {
      if ((st.children || []).length >= seed.nkid && (!seed.f || st.flags[seed.f]))
        out.push({ key: seed.id, seed, child: null });
    } else if (!seed.f || st.flags[seed.f]) out.push({ key: seed.id, seed, child: null });

/* 비사업용 승용차 정기검사 — 최초 등록 4년 뒤 첫 검사, 그 뒤로 2년마다.
   만료일 전후 31일 안에 받으면 되므로 D-31에 올려둡니다.

function nextCarInspection(firstReg, now) {
  const m = /^(\d{4})-(\d{1,2})$/.exec(String(firstReg || ""));
  if (!m) return null;
  const y = Number(m[1]), mo = Number(m[2]);
  if (mo < 1 || mo > 12) return null;
  now = now || Date.now();
  let due = new Date(y + 4, mo - 1, 1).getTime();
  let guard = 0;
  while (due < now && guard++ < 40) { const d = new Date(due); due = new Date(d.getFullYear() + 2, d.getMonth(), 1).getTime(); }
  return due;
}
/* 보험 갱신은 '가입한 달'만 알면 됩니다. 날짜까지 적으라고 하면 아무도 안 적어요 */
/* 자동차보험 만기일. 예전에는 "갱신하는 달"만 받아서 그 달 1일로 잡았습니다.
   만기 하루라도 넘기면 무보험 운행이라 날짜까지 받는 게 맞습니다.
   day가 없으면 옛 방식 그대로 그 달 1일입니다. */
function nextInsuranceMonth(month, now, day) {
  const mo = Number(month);
  if (!mo || mo < 1 || mo > 12) return null;
  now = now || Date.now();
  const d = new Date(now);
  const dy = Number(day) > 0 ? Number(day) : 1;
  const make = (y) => {
    const t = new Date(y, mo - 1, dy);
    /* 2월 30일처럼 없는 날은 그 달 말일로 */
    return t.getMonth() === mo - 1 ? t : new Date(y, mo, 0);
  };
  let due = make(d.getFullYear()).getTime();
  if (due < startOfDay(now)) due = make(d.getFullYear() + 1).getTime();
  return due;
}

/* 오늘 떠야 할 반복 업무 */
function dueRoutines(st) {
  const endOfToday = todayKey() + DAY;

    .map((r) => ({ ...r, cfg: st.routines[r.key] }))
    /* 오늘 이미 완료한 것도 목록에 남겨둡니다 (지우지 않고 흐리게 표시하기 위해) */
    .filter((r) => r.cfg && r.cfg.on !== false && ((r.cfg.nextAt || 0) < endOfToday || (r.cfg.lastAt && r.cfg.lastAt >= todayKey())))
    /* 완료한 항목은 다음 회차가 미래로 밀리므로, 정렬에서는 오늘 자리를 지킵니다 */
    .sort((a, b) => {
      const at = (r) => (r.cfg.lastAt && r.cfg.lastAt >= todayKey() ? todayKey() : (r.cfg.nextAt || 0));
      return at(a) - at(b);
    });

function makeAnniversary(a, v) {
  const m = Number(v.m), dd = Number(v.d);
  if (!m || !dd) return null;
  const title = a.editable ? String(v.name || "").trim() : a.title;
  if (!title) return null;
  const useLunar = v.lunar !== undefined ? v.lunar : !!a.lunar;
  const md = `${String(m).padStart(2, "0")}-${String(dd).padStart(2, "0")}`;
  let anchor = md, evt;
  if (useLunar) {
    evt = nextLunarSolarAfter(md, Date.now());
    if (evt == null) return null;
    const ad = new Date(evt);
    anchor = `${String(ad.getMonth() + 1).padStart(2, "0")}-${String(ad.getDate()).padStart(2, "0")}`;
  } else evt = nextAnchorAfter(md, 0, Date.now());
  const id = uid("cr");

           nextAt: Math.max(evt - lead * DAY, todayKey()) },

/* ── ② 생애주기 업무 ─────────────────────────── */
function buildRecommendations(st) {
  const now = Date.now();
  const out = [];
  const push = (seed, child, dday, dateKnown) => {
    const p = st.prefs[keyOf(seed, child)] || {};
    if (p.enabled === false || st.groupsOff[seed.g] || p.accepted || p.dismissedOnce) return;
    if (p.snoozedUntil && p.snoozedUntil > now) return;
    out.push({ key: keyOf(seed, child), seed, child, dday, dateKnown, lead: p.lead != null ? p.lead : seed.lead });
  };
  LIFE_SEEDS.forEach((seed) => {
    /* 복지는 유용정보에서 읽는 것입니다. 마감이 없어서 할 일로 담기면
       "시점 미정"만 쌓입니다. 추천 카드로 권하지 않습니다. */
    if (seed.wf) return;
    /* 계절·달 항목은 그때만. 예전에는 반복 항목에만 이 문이 있어서,
       생활 항목은 열두 달 내내 떴습니다. */
    if (!inSeason(seed)) return;
    if (seed.kid) {
      st.children.forEach((ch) => {
        const m = childMonths(ch), [a, b] = seed.w;
        const p = st.prefs[keyOf(seed, ch)] || {};
        const lead = p.lead != null ? p.lead : seed.lead;
        const days = monthsToDays(a - m);
        if (days <= lead && m <= b) push(seed, ch, days, true);
      });
    } else {
      if (seed.f && !st.flags[seed.f]) return;
      if (seed.nkid && (st.children || []).length < seed.nkid) return;
      /* 기준 날짜를 집이 직접 적어둔 항목(여행 출국일 등)은 그 날짜로 셉니다.
         안 적었으면 예전처럼 "시점 미정"으로 둡니다 — 없는 날짜를 지어내지 않습니다. */
      if (seed.dk) {
        const at = isoDay(st[seed.dk]);
        if (!at) return push(seed, null, null, false);
        const days = Math.ceil((startOfDay(at) - todayKey()) / DAY);
        const p = st.prefs[keyOf(seed, null)] || {};
        const lead = p.lead != null ? p.lead : seed.lead;
        if (days < -1 || days > lead) return;   /* 아직 이르거나 이미 지난 것 */
        return push(seed, null, days, true);
      }
      push(seed, null, null, false);
    }
  });
  return out.sort((x, y) => (x.dateKnown && y.dateKnown ? x.dday - y.dday : x.dateKnown ? -1 : y.dateKnown ? 1 : 0));
}

   단계가 바뀌는 날 이 한 줄만 고칩니다. */
const PHASE = "beta";

  beta: { talk: 80, photo: 30, find: 30 },

const usageMonth = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };
/* 이번 달 쓴 횟수. 달이 바뀌면 저절로 0부터 다시 셉니다 */
function usedThis(st, kind) {
  const u = st.aiUsage || {};
  return u.month === usageMonth() ? (u[kind] || 0) : 0;
}
function limitOf(st, kind) {
  /* 값을 안 받는 두 단계는 한도가 다릅니다.
     베타는 30가구뿐이라 넉넉히 열어도 월 5만 5천원이 최대입니다.
     출시 후 무료 기간은 몇 명이 올지 모르니 상한이 필요합니다. */
  if (PHASE === "beta") return AI_LIMITS.beta[kind];
  if (!CHARGING()) return AI_LIMITS.open[kind];
  return (st.plan === "paid" ? AI_LIMITS.paid : AI_LIMITS.free)[kind];
}
function leftOf(st, kind) {
  const lim = limitOf(st, kind);
  return lim === Infinity ? Infinity : Math.max(lim - usedThis(st, kind), 0);
}

/* 토큰은 만료되기도 하고 갱신되기도 해서, 부를 때마다 최신을 꺼내옵니다 */
async function authHeaders() {
  try {
    if (typeof SB !== "undefined" && SB && SB.auth) {
      const { data } = await SB.auth.getSession();
      if (data && data.session && data.session.access_token) {
        window.__TOKEN = data.session.access_token;
      }
    }
  } catch {}
  return window.__TOKEN ? { Authorization: "Bearer " + window.__TOKEN } : {};
}

/* ── 카톡·문자에서 "공유하기"로 들어온 글 ─────────────────
   앱이 카톡을 읽는 게 아닙니다. 카카오는 받은 메시지를 읽는 길을 안 줍니다.
   여기로 오는 것은 사용자가 공유 버튼을 눌러 보내준 것뿐입니다.

   share_target을 GET으로 둔 이유:
   POST로 받으려면 서비스워커에 fetch 가로채기를 넣어야 하는데,
   그걸 넣으면 새 판이 안 내려오는 문제가 다시 생깁니다. 그 문제로 이미 한 번 고생했습니다.
   문자 한 통은 주소창에 넉넉히 들어가므로 GET으로 충분합니다.

   ⚠ 안드로이드에서 앱을 홈에 설치했을 때만 공유 목록에 뜹니다.
   아이폰은 이 규격 자체를 지원하지 않아서, 붙여넣기 버튼을 따로 뒀습니다. */
const SHARED = (() => {
  try {
    const q = new URLSearchParams(window.location.search);
    const t = [q.get("title"), q.get("text"), q.get("url")].filter(Boolean).join("\n").trim();
    if (!t) return "";
    /* 새로고침해도 또 들어오지 않게 주소에서 지웁니다. join 같은 다른 값은 그대로 둡니다 */
    const keep = new URLSearchParams(window.location.search);
    ["title", "text", "url"].forEach((k) => keep.delete(k));
    const rest = keep.toString();
    window.history.replaceState(null, "", window.location.pathname + (rest ? "?" + rest : ""));
    return t.slice(0, 4000);
  } catch { return ""; }
})();

/* 공유로 들어온 글이 몇 번째인지 세는 열쇠.

async function askClaude(prompt, images, search) {
  const res = await fetch("/api/classify", {
    method: "POST",
    headers: { "Content-Type": "application/json", ...(await authHeaders()) },
    body: JSON.stringify({ prompt, images: images || undefined, search: search || undefined, promptVersion: PROMPT_VERSION }),
  });
  if (!res.ok) {
    let why = "";
    try { why = (await res.json()).error || ""; } catch {}
    const err = new Error(why || `서버가 ${res.status}로 응답했어요`);
    err.status = res.status;
    throw err;
  }
  const data = await res.json();
  const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
  return parseLoose(text, data.stop_reason, data.diag);
}

/* AI 답에서 자료만 꺼냅니다.
   답이 길이 제한에 걸려 중간에 끊기는 일이 실제로 생깁니다. 그때 그냥 던지면
   화면에 "Unexpected end of JSON input"만 뜹니다. 끊긴 답이라도 끝까지 온
   항목은 살려 쓰고, 정말 못 쓸 때만 무슨 일인지 한국어로 알립니다. */
function parseLoose(text, stopReason, diag) {
  const clean = String(text || "").replace(/```json/g, "").replace(/```/g, "").trim();
  /* 왜 못 읽었는지를 화면에서 바로 알 수 있어야 합니다.
     원문이 아니라 "무엇이 왔는지"만 붙입니다 */
  const tail = diag
    ? ` (받은 것: ${(diag.types || []).join("+") || "없음"} · 글자 ${diag.chars || 0} · 중단 ${stopReason || "?"})`
    : stopReason ? ` (중단 ${stopReason})` : "";
  const fail = (msg, code) => { const e = new Error(msg); e.code = code; e.stopReason = stopReason; e.diag = diag; throw e; };
  if (!clean) fail("AI가 빈 답을 보냈어요." + tail, "empty");

  const a = clean.indexOf("["), o = clean.indexOf("{");
  const at = o >= 0 && (o < a || a < 0) ? o : a;
  if (at < 0) fail("AI 답에서 정리된 내용을 못 찾았어요." + tail, "nojson");
  const body = clean.slice(at);

  try { return JSON.parse(body); } catch {}

  /* 뒤에 군더더기가 붙은 경우 — 마지막 닫는 괄호까지만 */
  const close = body.lastIndexOf(body[0] === "{" ? "}" : "]");
  if (close > 0) { try { return JSON.parse(body.slice(0, close + 1)); } catch {} }

  /* 배열이 중간에 끊긴 경우 — 온전히 닫힌 항목만 골라냅니다 */
  if (body[0] === "[") {
    const out = [];
    let depth = 0, start = -1, inStr = false, esc = false;
    for (let i = 1; i < body.length; i++) {
      const ch = body[i];
      if (inStr) { if (esc) esc = false; else if (ch === "\\") esc = true; else if (ch === '"') inStr = false; continue; }
      if (ch === '"') { inStr = true; continue; }
      if (ch === "{") { if (!depth) start = i; depth++; }
      else if (ch === "}") { depth--; if (!depth && start >= 0) { try { out.push(JSON.parse(body.slice(start, i + 1))); } catch {} start = -1; } }
    }
    if (out.length) return out;
  }
  fail((stopReason === "max_tokens"
    ? "AI 답이 너무 길어서 중간에 끊겼어요."
    : "AI 답을 읽지 못했어요.") + tail, "cut");
}

          <div className="rail" style={{ marginTop: 9 }}>

                  🧒 {c.name}

      {categoryId && (
        <button className="press flex items-center gap-2.5 w-full" onClick={() => setAsDefault((v) => !v)}

}

/* ── 예시 질문 줄 ─────────────────────────────────
   돌아가며 사라지지 않게 고정해두고, 눌러서 쓰거나 복사합니다. */

/* ── 바깥 서비스로 이어주는 카드 ─────────────────── */
/* 이번 접속에서 이미 센 노출 (같은 카드를 여러 번 세지 않게) */
const SHOWN = new Set();

/* 한 화면에 같은 링크가 두 번 뜨지 않게 합니다.
   살 것 옆에 쿠팡이 있는데 식단 아래에 또 쿠팡이 붙던 일이 있었습니다.
   먼저 그려진 카드가 이름을 잡고, 뒤에 오는 카드는 그 이름을 건너뜁니다.
   누가 잡았는지를 함께 적어두어서, 그 카드가 혼자 다시 그려질 때는
   자기 것을 그대로 다시 잡습니다. */
const ClaimCtx = createContext(null);
function LinkClaims({ children }) {
  const ref = useRef(null);
  ref.current = new Map();   /* 화면을 다시 그릴 때마다 처음부터 */
  return <ClaimCtx.Provider value={ref}>{children}</ClaimCtx.Provider>;
}

/* 조부모께 전달하는 앱에는 바깥으로 나가는 링크가 필요 없습니다.
   아자스쿨·키즈노트 같은 추천이 할 일 밑에 붙어 있으면 화면이 지저분해지고,
   무엇보다 "이것도 하세요"가 됩니다. 이 앱은 전달만 합니다.
   자리는 남겨둡니다 — 저점역산 앱을 만들 때 그대로 씁니다. */
const LINKS_OFF = true;

function LinkCards({ group, text, compact, exclude, noAd }) {
  if (LINKS_OFF) return null;
  const { st, setSt, log } = use();
  /* 눌렀다고 깐 것도, 예매한 것도 아닙니다. 앱은 알 수가 없습니다.
     그래서 클릭으로 숨기지 않고 90일간 그대로 둡니다.
     대신 사용자가 직접 "이미 있어요"를 누르면 그때 내립니다 —
     판단은 앱이 아니라 쓰는 사람이 합니다.
     · always  쿠팡·레시피처럼 늘 필요한 것 → 안 내림
     · 기본     첫 노출로부터 90일 → 그 뒤 자동으로 내림 */
  const clicked = st.linkClicks || {};
  const seen = st.linkSeen || {};
  const off = st.linkOff || {};
  const claims = useContext(ClaimCtx);
  const uid = useId();
  const skip = exclude || [];
  const hits = linksFor({ group, text, flags: st.flags }).filter((l) => {
    /* 복지 안내 밑에는 물건 파는 링크를 안 붙입니다. 안마기 광고가 그 자리에 붙으면
       바로 위의 "장기요양등급 신청"까지 광고로 읽힙니다.
       이 앱이 파는 건 "손주한통이 말하면 진짜다" 하나뿐입니다.

       관공서만 남기는 방식은 써봤다가 물렀습니다 — 기차 할인 카드에서
       코레일까지 막혔습니다. 그건 광고가 아니라 실제로 가야 하는 길입니다. */
    if (noAd && l.ad) return false;
    if (skip.indexOf(l.name) >= 0) return false;
    /* 이 화면 위쪽에서 이미 뜬 링크는 건너뜁니다 */
    if (claims && claims.current) {
      const owner = claims.current.get(l.name);
      if (owner && owner !== uid) return false;
    }
    if (off[l.name] && Date.now() - off[l.name] < 180 * DAY) return false;
    if (l.always) return true;
    const from = seen[l.name] || clicked[l.name];
    return !from || (Date.now() - from) / DAY < 90;
  })
    /* 아직 못 보신 것을 앞으로. 한 자리에 2개까지만 — 그 이상은 광고판이 됩니다 */
    .sort((a, b) => (seen[a.name] ? 1 : 0) - (seen[b.name] ? 1 : 0))
    .slice(0, 2);
  if (claims && claims.current) hits.forEach((l) => claims.current.set(l.name, uid));
  /* 어디에서 뜬 카드인지 — 제휴 협상 때 "돌잔치 화면에서 몇 번" 을 말할 수 있어야 합니다 */
  const from = String(text || group || "").trim().slice(0, 24);
  useEffect(() => {
    const fresh = hits.filter((l) => !seen[l.name] && !l.always);
    hits.forEach((l) => {
      const key = l.name + "|" + from;
      if (SHOWN.has(key)) return;
      SHOWN.add(key);
      log("partner_show", { name: l.name, g: group || null, from });
    });
    /* 90일은 처음 보여드린 날부터 셉니다 */
    if (fresh.length) {
      const now = Date.now();
      setSt((sv) => {
        const cur = sv.linkSeen || {};
        const add = {};
        fresh.forEach((l) => { if (!cur[l.name]) add[l.name] = now; });
        return Object.keys(add).length ? { ...sv, linkSeen: { ...cur, ...add } } : sv;
      });
    }
  }, [hits.map((l) => l.name).join(","), from]);
  if (!hits.length) return null;
  return (
    <div className="flex flex-col gap-1.5" style={{ marginTop: compact ? 8 : 12 }}>
      {hits.map((l) => (
        <div key={l.name} className="flex items-center" style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: R.sm }}>
          <button className="press flex items-center gap-2.5 flex-1 min-w-0 text-left"
            onClick={() => {
              log("partner_click", { name: l.name, g: group || null, from });
              setSt((sv) => ({ ...sv, linkClicks: { ...(sv.linkClicks || {}), [l.name]: Date.now() } }));
              window.open(linkUrl(l, text, st), "_blank", "noopener");
            }}
            style={{ background: "transparent", border: "none", padding: "10px 4px 10px 12px" }}>
            <span className="mono" style={{ fontSize: 9, color: C.ink3, border: `1px solid ${C.line}`, borderRadius: 5, padding: "1px 5px", flexShrink: 0 }}>{l.tag}</span>
            <span className="flex-1 min-w-0">
              <span style={{ display: "block", fontSize: 13, fontWeight: 600 }}>{l.name}</span>
              <span style={{ display: "block", fontSize: 11.5, color: C.ink3, marginTop: 2 }}>{l.desc}</span>
            </span>
            <span style={{ fontSize: 13, color: C.moss }}>›</span>
          </button>
          {/* 내릴지 말지는 쓰는 사람이 정합니다. 앱은 깔았는지 알 수 없으니까요 */}
          {!l.always && (
            <button className="press" aria-label="이 카드 그만 보기" title="이미 있어요"
              onClick={() => {
                log("partner_off", { name: l.name, from });
                setSt((sv) => ({ ...sv, linkOff: { ...(sv.linkOff || {}), [l.name]: Date.now() } }));
              }}
              style={{ background: "transparent", border: "none", padding: "10px 11px", fontSize: 11, color: C.ink3, flexShrink: 0, lineHeight: 1 }}>✕</button>
          )}
        </div>
      ))}
    </div>
  );
}

/* 기준 날짜(MM-DD)로 다음 차례 계산 — 생일·기념일용
   leadDays를 안 주면 일주일 전으로 잡습니다.
   0을 주면 그날 그대로입니다 — 예전에는 `leadDays || 7`이라 0이 7로 바뀌었고,
   그래서 "캘린더에 넣기"가 생일을 일주일 일찍 넣고 있었습니다. */
function nextFromAnchor(anchor, leadDays) {
  if (!anchor) return null;
  const [mm, dd] = anchor.split("-").map(Number);
  const now = new Date(); const y = now.getFullYear();
  let d = new Date(y, mm - 1, dd);
  if (d.getTime() < startOfDay(Date.now())) d = new Date(y + 1, mm - 1, dd);
  return d.getTime() - (leadDays == null ? 7 : leadDays) * DAY;
}
const anchorLabel = (a) => (a ? `${Number(a.split("-")[0])}월 ${Number(a.split("-")[1])}일` : "");
/* ── 음력 → 양력 변환 ──────────────────────────────
   한국천문연구원 데이터 기반(korean-lunar-calendar)으로 생성한
   2025~2045년 테이블. ny=음력 1월 1일의 양력 날짜,
   s=각 달 시작 오프셋(일), l=각 달 길이(29/30). 전 구간 검증 완료. */
const LUNAR_TABLE = {"2025":{"ny":[1,29],"s":[0,30,59,89,118,147,206,236,265,295,325,355],"l":[30,29,30,29,29,30,30,29,30,30,30,29]},"2026":{"ny":[2,17],"s":[0,30,59,89,118,147,177,206,236,265,295,325],"l":[30,29,30,29,29,30,29,30,29,30,30,30]},"2027":{"ny":[2,7],"s":[0,29,59,88,118,147,176,206,235,264,294,324],"l":[29,30,29,30,29,29,30,29,29,30,30,30]},"2028":{"ny":[1,27],"s":[0,29,59,89,118,177,206,236,265,294,324,354],"l":[29,30,30,29,30,29,30,29,29,30,30,29]},"2029":{"ny":[2,13],"s":[0,30,60,89,119,149,178,207,237,266,295,325],"l":[30,30,29,30,30,29,29,30,29,29,30,30]},"2030":{"ny":[2,3],"s":[0,29,59,88,118,148,177,207,236,266,295,325],"l":[29,30,29,30,30,29,30,29,30,29,30,29]},"2031":{"ny":[1,23],"s":[0,30,59,118,148,177,207,237,266,296,325,355],"l":[30,29,30,30,29,30,30,29,30,29,30,29]},"2032":{"ny":[2,11],"s":[0,30,59,88,118,147,177,207,236,266,296,325],"l":[30,29,29,30,29,30,30,29,30,30,29,30]},"2033":{"ny":[1,31],"s":[0,29,59,88,117,147,176,206,235,265,295,354],"l":[29,30,29,29,30,29,30,29,30,30,30,30]},"2034":{"ny":[2,19],"s":[0,29,59,88,117,147,176,206,235,265,295,325],"l":[29,30,29,29,30,29,30,29,30,30,30,29]},"2035":{"ny":[2,8],"s":[0,30,59,89,118,147,177,206,235,265,295,324],"l":[30,29,30,29,29,30,29,29,30,30,29,30]},"2036":{"ny":[1,28],"s":[0,30,60,89,119,148,207,236,265,295,325,354],"l":[30,30,29,30,29,29,29,29,30,30,29,30]},"2037":{"ny":[2,15],"s":[0,30,60,89,119,148,177,207,236,265,295,324],"l":[30,30,29,30,29,29,30,29,29,30,29,30]},"2038":{"ny":[2,4],"s":[0,30,60,89,119,148,178,207,237,266,295,325],"l":[30,30,29,30,29,30,29,30,29,29,30,29]},"2039":{"ny":[1,24],"s":[0,30,60,89,119,178,208,237,267,296,326,355],"l":[30,30,29,30,30,30,29,30,29,30,29,29]},"2040":{"ny":[2,12],"s":[0,30,59,89,119,148,178,208,237,267,296,326],"l":[30,29,30,30,29,30,30,29,30,29,30,29]},"2041":{"ny":[2,1],"s":[0,30,59,88,118,147,177,207,236,266,296,325],"l":[30,29,29,30,29,30,30,29,30,30,29,30]},"2042":{"ny":[1,22],"s":[0,29,88,117,147,176,206,235,265,295,324,354],"l":[29,30,29,30,29,30,29,30,30,29,30,30]},"2043":{"ny":[2,10],"s":[0,29,59,88,117,147,176,205,235,265,294,324],"l":[29,30,29,29,30,29,29,30,30,29,30,30]},"2044":{"ny":[1,30],"s":[0,30,59,89,118,147,177,235,265,294,324,354],"l":[30,29,30,29,29,30,29,30,29,30,30,30]},"2045":{"ny":[2,17],"s":[0,30,59,89,118,147,177,206,235,265,294,324],"l":[30,29,30,29,29,30,29,29,30,29,30,30]}};
function lunarToSolar(ly, lm, ld) {
  const t = LUNAR_TABLE[ly];
  if (!t) return null;
  const day = Math.min(ld, t.l[lm - 1]); /* 29일까지인 달의 30일 제사는 그 달 말일로 */
  return new Date(ly, t.ny[0] - 1, t.ny[1] + t.s[lm - 1] + day - 1).getTime();
}
/* afterMs 이후 첫 음력 MM-DD의 양력 시점. 테이블 밖이면 null */
function nextLunarSolarAfter(lunarMD, afterMs) {
  const [lm, ld] = lunarMD.split("-").map(Number);
  const y0 = new Date(afterMs).getFullYear();
  for (let y = y0 - 1; y <= y0 + 2; y++) {
    const t = lunarToSolar(y, lm, ld);
    if (t != null && t > afterMs) return t;
  }
  return null;
}

/* afterMs 이후에 오는 첫 (기념일 - 미리 알릴 일수) 시점 */
function nextAnchorAfter(anchor, lead, afterMs) {
  if (!anchor) return null;
  const [mm, dd] = anchor.split("-").map(Number);
  const y = new Date(afterMs).getFullYear();
  for (let i = 0; i <= 2; i++) {
    const t = new Date(y + i, mm - 1, dd).getTime() - (lead || 0) * DAY;
    if (t > afterMs) return t;
  }
  return null;
}

/* 주기 고르기 시트 — 주기 + 요일/날짜 패턴까지 한 자리에서 */
/* 씨앗의 기본 설정. 설·추석처럼 음력에 매인 것(lu)은 음력 정보를 함께 넣습니다.
   그래야 해마다 양력 날짜가 저절로 옮겨갑니다 — 올해 설이 2월 17일이면
   내년에는 알아서 다른 날로 갑니다. */
function seedCfg(seed) {
  const cycle = cycleToDays(seed.cy);
  /* 새 학기처럼 날짜가 정해진 일은 주기로 떠돌면 안 됩니다.
     "학기별(120일)"로 두면 8월에 이름표를 붙이라고 합니다. */
  if (seed && seed.an) {
    const lead = seed.lead || 0;
    const at = nextAnchorAfter(seed.an, 0, todayKey());
    return { cycle: 365, anchor: seed.an, leadDays: lead,
             nextAt: Math.max(at - lead * DAY, todayKey()) };
  }
  if (!seed || !seed.lu) return { cycle };
  const lead = seed.lead || 0;
  const at = nextLunarSolarAfter(seed.lu, todayKey());
  const d = at != null ? new Date(at) : null;
  return {
    cycle: 365, lunar: true, lunarMD: seed.lu, leadDays: lead,
    lunarLabel: `음력 ${Number(seed.lu.split("-")[0])}월 ${Number(seed.lu.split("-")[1])}일`,
    ...(d ? {
      anchor: `${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`,
      nextAt: Math.max(at - lead * DAY, todayKey()),
    } : {}),
  };
}

          <div className="grid gap-1.5" style={{ marginTop: 10, gridTemplateColumns: "repeat(7, minmax(0, 1fr))" }}>
            {Array.from({ length: 31 }, (_, i) => i + 1).map((n) => {
              const cur = domList(pat);
              const on = cur.includes(n);
              const next = on ? cur.filter((x) => x !== n) : [...cur, n].sort((a, b) => a - b);
              return (
                <button key={n} className="press"
                  onClick={() => onPattern(next.length
                    ? { doms: next, dom: "", dow: "", dows: [], anchor: "" }
                    : { doms: [], dom: "" })}
                  style={{ background: on ? C.moss : C.bg, color: on ? "#fff" : C.ink2, border: `1px solid ${on ? C.moss : C.line}`,
                           borderRadius: 10, padding: "9px 0", fontSize: n === 31 ? 11 : 12.5, fontWeight: 600,
                           gridColumn: n === 31 ? "span 2" : undefined }}>{n === 31 ? "말일" : n}</button>
              );
            })}
          </div>
          {domList(pat).length
            ? <div style={{ fontSize: 11.5, color: C.moss, marginTop: 8 }}>매달 {domList(pat).map(domLabel).join("·")}에 올립니다 · 다시 누르면 해제됩니다</div>
            : <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 8 }}>‘말일’은 그 달의 마지막 날에 맞춰 올립니다 (2월이면 28·29일)</div>}
        </div>
      )}
      {onAnchor && (
        <div style={{ marginTop: 18 }}>
          <div style={{ fontSize: 12.5, color: C.ink2, fontWeight: 600 }}>날짜가 정해져 있나요?</div>
          <div style={{ fontSize: 12, color: C.ink3, marginTop: 3, lineHeight: 1.6 }}>생일·기념일·경조사처럼 날짜가 있는 일이면 넣어주세요. 그 날짜 기준으로 미리 알립니다.</div>
          <div className="flex gap-2" style={{ marginTop: 9 }}>
            <input className="hae" value={d} onChange={(e) => setD(e.target.value)} placeholder="MM-DD (예: 09-28)"
              style={{ flex: 1, border: `1px solid ${C.line}`, borderRadius: 11, padding: "11px 12px", fontSize: 14, background: C.bg, color: C.ink }} />
            <button className="press" onClick={() => onAnchor(/^\d{2}-\d{2}$/.test(d.trim()) ? d.trim() : "")}
              style={{ background: C.moss, color: "#fff", border: "none", borderRadius: 11, padding: "0 16px", fontSize: 13, fontWeight: 600 }}>저장</button>
          </div>
        </div>
      )}
      {onOff && <Btn kind="quiet" onClick={onOff}>이 항목은 안 할게요</Btn>}
    </Sheet>
  );
}

/* 사진을 1200px 이내로 줄이고 JPEG로 바꿉니다.
   원본 그대로 보내지 않는 이유: 통신량·비용도 있지만
   사진에 붙은 위치·기기 정보(EXIF)를 떼어내기 위해서예요. */
function shrinkImage(file, max = 1200) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("파일을 읽지 못했어요"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("사진을 열지 못했어요"));
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * scale);
        cv.height = Math.round(img.height * scale);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        const url = cv.toDataURL("image/jpeg", 0.78);
        resolve({ media_type: "image/jpeg", data: url.split(",")[1] });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* 캘린더로 내보내기 — 체험판에서는 파일 저장이 막혀 있어 안내만 합니다 */
